name: Refresh Demo World

# Re-downloads lore config, achievements, and world zone YAML files onto
# the demo instance without restarting the server or dropping player connections.
# After this runs, a staff `reload all` or POST /api/reload?target=all
# is needed to apply the new data to the running engine.
#
# Triggers:
#   - Manual workflow_dispatch from the Actions tab
#
# (repository_dispatch from the Auringold lore repo is intentionally NOT enabled
# right now — we want to gate refreshes manually until the Auringold content is
# stable. To enable later, add:
#   on:
#     repository_dispatch:
#       types: [refresh-world]
#     workflow_dispatch:
# and configure a workflow in the Auringold repo that calls:
#   gh api repos/jnoecker/AmbonMUD/dispatches -f event_type=refresh-world)
#
# Prerequisites (same as deploy-demo — already configured):
#   GitHub secrets:
#     AWS_EC2_DEMO_ROLE_ARN   IAM role ARN allowed to SSM into the demo instance
#     DEMO_INSTANCE_ID        EC2 instance ID
#     LORE_CONFIG_URL         URL to download application-local.yaml
#                             (e.g. https://auringold.ambon.dev/config/application-local.yaml)
#     WORLD_ZONES_BASE_URL    Base URL for world zone YAML files
#                             (e.g. https://auringold.ambon.dev/world)
#   GitHub variables:
#     AWS_REGION              AWS region (default: us-east-1)

on:
  workflow_dispatch:

concurrency:
  group: refresh-demo-world
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    name: Refresh world files on demo
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: check
        env:
          INSTANCE_ID: ${{ secrets.DEMO_INSTANCE_ID }}
          ROLE_ARN: ${{ secrets.AWS_EC2_DEMO_ROLE_ARN }}
          LORE_URL: ${{ secrets.LORE_CONFIG_URL }}
        run: |
          if [ -z "$INSTANCE_ID" ] || [ -z "$ROLE_ARN" ] || [ -z "$LORE_URL" ]; then
            echo "::notice::Refresh skipped — DEMO_INSTANCE_ID, AWS_EC2_DEMO_ROLE_ARN, or LORE_CONFIG_URL not configured"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EC2_DEMO_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Refresh lore config and world zones via SSM
        if: steps.check.outputs.skip != 'true'
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.DEMO_INSTANCE_ID }}
          LORE_URL: ${{ secrets.LORE_CONFIG_URL }}
        run: |
          ACHIEVEMENTS_URL="${LORE_URL%/*}/achievements.yaml"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"curl -fsSL -o /app/data/application-local.yaml $LORE_URL && /usr/local/bin/fetch-world-zones && mkdir -p /app/data/world && curl -fsSL -o /app/data/world/achievements.yaml $ACHIEVEMENTS_URL\"]" \
            --comment "Refresh world files from Auringold lore repo" \
            --query "Command.CommandId" \
            --output text)
          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait for refresh to complete
        if: steps.check.outputs.skip != 'true'
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command-id }}
          INSTANCE_ID: ${{ secrets.DEMO_INSTANCE_ID }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Print output
        if: always() && steps.check.outputs.skip != 'true'
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command-id }}
          INSTANCE_ID: ${{ secrets.DEMO_INSTANCE_ID }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status, StatusDetails, StandardOutputContent, StandardErrorContent]" \
            --output text
