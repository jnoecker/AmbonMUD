name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write   # required for OIDC AWS credential federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
          cache-dependency-path: web-v3/bun.lock
      - run: cd web-v3 && bun install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck test integrationTest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-v3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
          cache-dependency-path: web-v3/bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  docker:
    # Build and push to ECR on every push to main after tests pass.
    # Runs on a native ARM64 runner to match the t4g.nano demo instance —
    # avoids slow QEMU emulation while producing a correct linux/arm64 image.
    # Uses the 8-core (~32 GB) larger runner: the in-process Kotlin compiler
    # requests a 6g heap (gradle.properties) which OOMs the standard 16 GB
    # ubuntu-24.04-arm runner during `shadowJar`. Revisit if the heap is lowered.
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm-8core
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.ECR_REPO_NAME || 'ambonmud/app' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          IMAGE="${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.repo }}"
          docker build \
            --tag "$IMAGE:${{ steps.meta.outputs.tag }}" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"
