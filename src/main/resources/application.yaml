    commands:
      entries:
        help:
          usage: help/?
          description: Show this help
          category: utility
          staff: false
        look:
          usage: look/l [target|direction]
          description: Look around, at a target, or in a direction
          category: navigation
          staff: false
        move:
          usage: n/s/e/w/u/d
          description: Move in a direction
          category: navigation
          staff: false
        exits:
          usage: exits/ex
          description: List available exits
          category: navigation
          staff: false
        recall:
          usage: recall
          description: Teleport to your recall point (set by resting at an inn)
          category: navigation
          staff: false
        rest:
          usage: rest
          description: Rest at an inn to make it your recall point.
          category: navigation
          staff: false
        depart:
          usage: depart
          description: Leave the death sanctum and return to the world
          category: navigation
          staff: false
        run:
          usage: run <directions> (e.g. 5n3e)
          description: Move along a sequence of directions. Numeric prefixes repeat — '5n3e' walks five north then three east.
          category: navigation
          staff: false
          requiresTarget: true
        areas:
          usage: areas [<minLevel> [<maxLevel>]]
          description: List known areas. With one level, shows areas covering that level; with two, shows areas overlapping the
