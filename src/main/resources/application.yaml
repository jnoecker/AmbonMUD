ambonmud:
  mode: STANDALONE
  sharding:
    enabled: false
    engineId: engine-1
    zones: []
    advertiseHost: localhost
    registry:
      type: STATIC
      leaseTtlSeconds: 30
      assignments: []
    handoff:
      ackTimeoutMs: 2000
    playerIndex:
      enabled: false
      heartbeatMs: 10000
    instancing:
      enabled: false
      defaultCapacity: 200
      loadReportIntervalMs: 5000
      startZoneMinInstances: 1
      autoScale:
        enabled: false
        evaluationIntervalMs: 30000
        scaleUpThreshold: 0.8
        scaleDownThreshold: 0.2
        cooldownMs: 60000
  grpc:
    server:
      port: 9090
    client:
      engineHost: localhost
      enginePort: 9090
  gateway:
    id: 0
    snowflake:
      idLeaseTtlSeconds: 300
    reconnect:
      maxAttempts: 10
      initialDelayMs: 1000
      maxDelayMs: 30000
      jitterFactor: 0.2
      streamVerifyMs: 2000
    startZone: ""
    engines: []
  server:
    telnetPort: 4000
    webPort: 8080
    productionMode: false
    inboundChannelCapacity: 10000
    outboundChannelCapacity: 10000
    sessionOutboundQueueCapacity: 200
    maxInboundEventsPerTick: 1000
    tickMillis: 100
    inboundBudgetMs: 30
  world:
    startRoom: pixel_haven_academy:start
    resources:
      - world/pixel_haven_academy.yaml
      - world/pixel_haven.yaml
  persistence:
    backend: YAML
    rootDir: data/players
    worker:
      enabled: true
      flushIntervalMs: 5000
  database:
    jdbcUrl: jdbc:postgresql://localhost:5432/ambonmud
    username: ambon
    password: ambon
    maxPoolSize: 5
    minimumIdle: 1
  login:
    maxWrongPasswordRetries: 3
    maxFailedAttemptsBeforeDisconnect: 3
    maxConcurrentLogins: 150
    authThreads: 8
  engine:
    scheduler:
      maxActionsPerTick: 100
    guild:
      maxSize: 50
      inviteTimeoutMs: 60000
    debug:
      enableSwarmClass: false
    stats:
      definitions:
        STR:
          displayName: Strength
          abbreviation: STR
          description: Physical power
          baseStat: 10
        DEX:
          displayName: Dexterity
          abbreviation: DEX
          description: Agility and reflexes
          baseStat: 10
        CON:
          displayName: Constitution
          abbreviation: CON
          description: Health and endurance
          baseStat: 10
        INT:
          displayName: Intelligence
          abbreviation: INT
          description: Magical aptitude
          baseStat: 10
        WIS:
          displayName: Wisdom
          abbreviation: WIS
          description: Insight and willpower
          baseStat: 10
        CHA:
          displayName: Charisma
          abbreviation: CHA
          description: Force of personality
          baseStat: 10
      bindings:
        meleeDamageStat: STR
        meleeDamageDivisor: 1
        dodgeStat: DEX
        dodgePerPoint: 5
        maxDodgePercent: 50
        spellDamageStat: INT
        spellDamageDivisor: 1
        hpScalingStat: CON
        hpScalingDivisor: 2
        manaScalingStat: INT
        manaScalingDivisor: 2
        hpRegenStat: CON
        hpRegenMsPerPoint: 400
        manaRegenStat: WIS
        manaRegenMsPerPoint: 400
        xpBonusStat: CHA
        xpBonusPerPoint: 5
    abilities:
      definitions:
        storybook_charge:
          displayName: Storybook-Charge
          description: Rush a foe like a storybook champion and strike with bright, fearless steel.
          manaCost: 8
          cooldownMs: 5000
          levelRequired: 1
          targetType: ENEMY
          requiredClass: WARRIOR
          tree: knight_valor
          tier: 0
          effect:
            type: DIRECT_DAMAGE
            minDamage: 12
            maxDamage: 18
            damagePerLevel: 0.3
        blanket_fort:
          displayName: Blanket-Fort
          description: Turn childhood certainty into a sheltering wall that catches the next blows for you.
          manaCost: 12
          cooldownMs: 12000
          levelRequired: 3
          targetType: SELF
          requiredClass: WARRIOR
          tree: knight_valor
          tier: 1
          effect:
            type: APPLY_STATUS
            statusEffectId: blanket_fortress
        lionheart:
          displayName: Lionheart
          description: Challenge a bully so fiercely that it cannot ignore you.
          manaCost: 10
          cooldownMs: 9000
          levelRequired: 5
          targetType: ENEMY
          requiredClass: WARRIOR
          tree: knight_valor
          tier: 2
          effect:
            type: TAUNT
            flatThreat: 85.0
            margin: 15.0
        everafter:
          displayName: Everafter
          description: Promise the ending where your friends make it home, filling them with stubborn courage.
          manaCost: 18
          cooldownMs: 18000
          levelRequired: 8
          targetType: ALL_ALLIES
          requiredClass: WARRIOR
          tree: knight_valor
          tier: 3
          effect:
            type: APPLY_STATUS
            statusEffectId: lionheart_promise
        comet_chalk:
          displayName: Comet-Chalk
          description: Sketch a blazing comet across the air and drive it through a single foe.
          manaCost: 12
          cooldownMs: 5000
          levelRequired: 1
          targetType: ENEMY
          requiredClass: MAGE
          tree: wizard_wonder
          tier: 0
          effect:
