  progression:
    maxLevel: 50
    xp:
      baseXp: 100
      exponent: 2.2
      linearXp: 150
      multiplier: 1
      defaultKillXp: 10
      # Diminishing returns when a player has out-levelled the XP source.
      # Applies to kills (mob level) and to quests/puzzles that declare an
      # intended player level. Largest matching `levelsBelow` wins — prevents
      # trivial trash farming and flat-reward quest ladders from capping XP.
      diminishing:
        enabled: true
        thresholds:
          - levelsBelow: 3
            multiplier: 0.5
          - levelsBelow: 5
            multiplier: 0.2
          - levelsBelow: 8
            multiplier: 0.0
    rewards:
      hpPerLevel: 2
      manaPerLevel: 1
      fullHealOnLevelUp: true
      fullManaOnLevelUp: true
      baseHp: 10
      baseMana: 10
    # Engine-computed XP for quests. Authors pick a difficulty tier (or leave
    # `rewards.xp` authored for an explicit override) and the engine produces
    #   (baseXp + xpPerLevel * (level - 1)) * tiers[difficulty]
    # at completion time. Diminishing returns still applies on top.
    quests:
      baseline:
        baseXp: 50
        xpPerLevel: 20
      tiers:
        TRIVIAL: 0.25
        EASY: 0.5
        STANDARD: 1.0
        HARD: 1.75
        EPIC: 3.0
