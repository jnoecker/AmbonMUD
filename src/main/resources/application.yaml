    classes:
      definitions:
        WARRIOR:
          displayName: Warrior
          hpPerLevel: 4
          manaPerLevel: 1
          description: A battle-hardened combatant trained in heavy armor and martial weapons, equally capable of absorbing
            punishment and dealing devastating blows.
          backstory: >-
            Warriors are forged in the crucibles of military academies, mercenary companies, and frontier garrisons
            scattered across the known world. Their training begins young — often as squires hauling shields for veteran
            soldiers or as pit fighters scrapping for coin in underground arenas. Every warrior carries the scars of a
            hundred sparring matches before they ever see true battle.


            The great martial traditions vary by region. In the northern holds, warriors learn to fight in tight shield
            walls against raiding parties. Along the coast, they train aboard warships where footing is treacherous and
            a single misstep means death. In the heartland cities, formal fencing academies produce duelists of
            extraordinary precision. What unites them all is an unflinching willingness to stand at the front and meet
            violence head-on.


            Veteran warriors often find employment as caravan guards, siege engineers, or lieutenants in the standing
            armies of various lords. A rare few earn enough reputation to command their own companies. Regardless of
            station, a warrior's worth is measured in the battles they have survived and the comrades they brought home
            alive.
          primaryStat: STR
          image: 98169782bef9c4739ce982aba28b5022ddc0ad413e466031389a33778d3162c8.jpg
          outfitDescription: Full plate armor with a heavy steel breastplate, layered pauldrons, gauntlets, and greaves. A
            longsword hangs from a leather baldric at the hip, and a kite shield bearing a battle-worn heraldic crest is
            strapped to one arm. A crimson half-cape drapes from the left shoulder.
        MAGE:
          displayName: Mage
          hpPerLevel: 1
          manaPerLevel: 5
          description: A scholar of the arcane arts who channels raw magical energy into destructive spells, protective wards, and
            debilitating hexes.
          backstory: >-
            Mages are products of the great arcane colleges — cloistered institutions built on ley-line nexuses where
            the veil between the material and ethereal planes runs thin. Admission requires proof of innate magical
            sensitivity, and the washout rate is brutal. Students who survive years of grueling study, failed
            incantations, and the occasional laboratory explosion emerge as some of the most dangerous individuals
            alive.


            The curriculum covers elemental theory, planar cosmology, glyph construction, and counter-magic. Practical
            training takes place in warded chambers where novices learn to shape raw mana into coherent spell forms
            without killing themselves or their classmates. Those who show talent for destruction are shepherded toward
            battle-magic tracks; those with subtler gifts may specialize in enchantment, divination, or ward-crafting.


            Graduated mages often serve as court advisors, war-casters attached to military units, or independent
            researchers pursuing obscure branches of arcane knowledge. The colleges maintain strict records of all
            licensed practitioners, and rogue mages who practice without sanction are hunted by the order's enforcers.
          primaryStat: INT
          image: 08f5d33a0dc82a3cfa8bf3849c7e0b3a3fef71b5c7c635981dd17c02f09e732d.jpg
          outfitDescription: Deep indigo robes with silver arcane sigils embroidered along the hems and cuffs. A tall oak staff
            topped with a faintly glowing crystal is held in one hand. A thick leather-bound spellbook hangs from a
            chain at the belt. The robe's hood is pulled back, revealing sharp, studious features.
        CLERIC:
          displayName: Cleric
          hpPerLevel: 2
          manaPerLevel: 4
          description: A devoted servant of the divine who channels sacred power to mend wounds, bolster allies, and smite the
            unholy.
          backstory: >-
            Clerics are ordained within the great temple hierarchies — sprawling religious institutions that maintain
            hospitals, libraries, and fortified sanctuaries across the realm. Aspirants are taken in as acolytes, often
            from orphanages or devout families, and spend years studying scripture, herbalism, and the channeling of
            divine energy before they are permitted to lay hands on the sick or wounded.


            The path to ordination is one of discipline and sacrifice. Acolytes rise before dawn for prayer, spend their
            mornings tending to the injured and dying, and devote their afternoons to theological study. Combat training
            is mandatory — the temples learned long ago that healers who cannot defend themselves are liabilities on the
            battlefield. Maces and warhammers are favored because they are effective against armored foes without
            requiring the shedding of blood that some orders find doctrinally objectionable.


            Full clerics serve wherever need is greatest. Some are permanently stationed at frontier clinics. Others
            march with armies, keeping soldiers alive through grueling campaigns. A few are dispatched as wandering
            mendicants, carrying the temple's mercy to remote villages that would otherwise have no access to healing
            magic.
          primaryStat: WIS
          image: b5d2b5a7da755dd6335713f466cea867faf24f552f398f2516139105a52df7c3.jpg
          outfitDescription: White and gold vestments layered over a chain hauberk. A polished steel mace hangs from the belt
            alongside a radiant holy symbol on a heavy chain. The vestments bear the emblem of a sunburst, and a hooded
            mantle of deep gold cloth rests across the shoulders.
        ROGUE:
          displayName: Rogue
          hpPerLevel: 2
          manaPerLevel: 2
          description: A cunning operative who relies on stealth, precision, and dirty tricks to eliminate targets before they can
            retaliate.
          backstory: >-
            Rogues come from the shadow side of civilization — the thieves' guilds, spy networks, and assassin
            brotherhoods that thrive in every major city. Their training is informal compared to warriors or mages, but
            no less rigorous. Apprentices learn lockpicking, poison craft, silent movement, and blade work from
            experienced mentors who tolerate nothing less than perfection. A fumbled lock or a creaking floorboard
            during training earns a beating; in the field, it earns a grave.


            The guilds operate under strict codes of conduct. Contracts are honored, territories are respected, and
            information is the most valuable currency. A rogue who breaks guild law faces exile or worse. In return, the
            guild provides fencing services for stolen goods, legal protection through bribed magistrates, and a network
            of safe houses spanning multiple cities.


            Not all rogues are criminals. Military scouts, royal intelligence agents, and freelance investigators all
            employ the same skill set in service of legitimate employers. The line between spy and thief is largely a
            matter of who signs the paycheck. Regardless of allegiance, all rogues share a preference for ending fights
            quickly, quietly, and on their own terms.
          primaryStat: DEX
          image: 673082bf0f825c957ba5629399b2670cf6254645f322813e84c86c928d51b10a.jpg
          outfitDescription: Supple dark leather armor with reinforced shoulder guards and bracers studded with dull metal rivets.
            Twin daggers are sheathed in crossed back-scabbards. A deep hooded cloak of charcoal-grey wool obscures the
            face, and a bandolier of small pouches and vials crosses the chest.
        RANGER:
          displayName: Ranger
          hpPerLevel: 3
          manaPerLevel: 3
          description: A wilderness expert who fights alongside bonded animal companions, blending archery with nature magic to
            control the battlefield.
          backstory: >-
            Rangers are trained by the wardens — a loose confederation of frontier scouts, beast-tamers, and wilderness
            survivalists who patrol the untamed lands beyond the reach of civilization. There are no formal academies;
            instead, apprentice rangers are taken into the wild by experienced mentors and taught through years of
            practical experience. They learn to track prey across any terrain, read weather patterns, identify edible
            and poisonous plants, and forge the empathic bonds with wild animals that are the hallmark of their craft.


            The bond between a ranger and their companions is not mere domestication. It is a form of primal magic — an
            ancient pact between humanoid and beast that predates the arcane colleges by millennia. Rangers who attune
            to this power can communicate wordlessly with their bonded animals, share sensory impressions across great
            distances, and even channel restorative natural energy through the bond. The deeper the trust between ranger
            and companion, the more potent these abilities become.


            Rangers serve as border patrols, monster hunters, and guides for expeditions into uncharted territory. They
            are often the first line of defense when creatures from the deep wilderness encroach on settled lands. Their
            knowledge of the natural world makes them invaluable to military commanders planning campaigns through
            hostile terrain, and their animal companions provide scouting capabilities that no amount of conventional
            reconnaissance can match.
          primaryStat: WIS
          image: d1d7c4b66422dce6c5d2b7d4362872730da19ad9abb3d10962946f0571e0de50.jpg
          outfitDescription: Weathered green and brown leather armor with leaf-shaped scale overlays across the chest. A longbow
            of dark yew is slung across the back alongside a quiver of fletched arrows. A short hunting knife sits at
            the hip. The armor is accented with fur trim and wooden toggles, and a forest-green cloak is pinned at the
            shoulder with an antler brooch.
    races:
      definitions:
        HUMAN:
          displayName: Human
          description: Versatile and adaptable, humans excel in any role through sheer determination and ingenuity.
          backstory: >-
            Humans are the most widespread of the civilized races, having carved kingdoms, republics, and trading
            empires out of every habitable corner of the known world. Their relatively short lifespans drive an urgency
            that other races sometimes mistake for recklessness, but which humans understand as ambition. A human who
            lives to see sixty has likely accomplished more in raw volume than an elf who has spent three centuries
            perfecting a single craft.


            Human societies are staggeringly diverse. The northern clans organize around warrior-kings and blood oaths.
            The southern city-states are governed by merchant councils and guild charters. The eastern provinces
            maintain rigid feudal hierarchies with landed nobility and peasant levies. What unites them is a relentless
            drive to build, expand, and leave a mark on the world that outlasts their mortal years.


            In adventuring companies, humans serve as the glue that holds disparate races and temperaments together.
            They lack the innate magical affinity of the sylvan or the physical resilience of the stoneheart, but they
            compensate with adaptability and an unmatched talent for learning new skills quickly. A human fighter can
            retrain as a passable scout in weeks; a human mage can pick up the basics of herbalism between campaigns.
            This flexibility makes them welcome in any party composition.
          traits:
            - Adaptable
            - Ambitious
          image: a6c6cc0632454035a29c3afbff6f91716bd7c1d4dbe4c22dcc574fabbab6c029.jpg
          bodyDescription: Medium build with a wide range of skin tones from pale to deep brown. Features are varied and
            unremarkable compared to the other races — no pointed ears, no stone-like skin. Hair ranges from straight to
            curly in shades of black, brown, red, and blonde. Eyes are brown, blue, green, or grey. Sturdy and
            well-proportioned, neither slight nor bulky.
        SYLVAN:
          displayName: Sylvan
          description: Graceful forest-dwellers attuned to nature and magic, with keen senses honed over centuries of life among
            the ancient woods.
          backstory: >-
            The sylvan emerged from the deep forests in an age before recorded history, and they have never fully left
            them. Their settlements are built into living trees, across suspended bridges, and within root-hollowed
            chambers beneath the forest floor. To outsiders, a sylvan village is nearly invisible — indistinguishable
            from the surrounding woodland until you are standing in the middle of it.


            Sylvan lifespans stretch across centuries, which gives them a fundamentally different relationship with time
            than the shorter-lived races. A sylvan artisan may spend decades perfecting a single bow. Their historians
            remember events that humans consider ancient mythology. This long perspective makes them cautious and
            deliberate, but it also means that when a sylvan commits to a course of action, they have considered the
            consequences more thoroughly than most.


            Despite their reclusive reputation, sylvan are not isolationists. They maintain trade relationships with
            human border towns, exchanging rare herbs, enchanted wood, and masterwork bows for metals and manufactured
            goods that the forest cannot provide. Sylvan rangers patrol the borders between civilization and the wild
            places, serving as an early warning system against incursions from the deeper wilderness. Those who leave
            the forest to adventure abroad often do so out of a sense of duty — a threat has been identified that
            requires intervention beyond the treeline.
          traits:
            - Keen Senses
            - Nature Affinity
            - Graceful
          image: d0f51898fa492713d576ad22596bd48c94ebfcba487c8acde8ba187044038d4a.jpg
          statMods:
            DEX: 1
            INT: 1
            CON: -1
          bodyDescription: Tall and slender with an angular, fine-boned frame. Skin has a faint warm undertone ranging from fair
            to olive. Ears are long and pointed, sweeping back from the head. Eyes are large and almond-shaped, often in
            vivid greens, golds, or pale silver. Hair is typically straight and worn long, in shades of silver-white,
            deep black, or autumnal auburn. Movements are fluid and precise.
        STONEHEART:
          displayName: Stoneheart
          description: Hardy mountain folk with dense bones and iron constitutions, shaped by generations of life in the deep
            halls beneath the peaks.
          backstory: >-
            The stoneheart were born of the mountains — or so their creation myths insist. Their earliest histories
            speak of a time when the first clans simply walked out of the rock itself, fully formed and already arguing
            about whose tunnel was deeper. Whether this is literal truth or cultural metaphor, the stoneheart have dwelt
            beneath the great mountain ranges for as long as any race can remember.


            Stoneheart civilization is built around the clan-hold: a vast underground complex of mines, forges, dwelling
            halls, and mushroom farms carved into the living rock over generations. Each clan-hold is a self-sufficient
            fortress capable of withstanding siege for years. The stoneheart are master miners and smiths, producing
            metalwork of extraordinary quality. Their steel is sought after across the known world, and a
            stoneheart-forged blade can fetch ten times the price of its human-made equivalent.


            Stoneheart who venture above ground do so for trade, diplomacy, or the pursuit of rare minerals that their
            home mountains lack. They find the open sky disorienting at first — too much empty space above the head —
            but adapt quickly enough. In battle, stoneheart are immovable anchors. Their dense bones and thick muscles
            make them extraordinarily difficult to knock down, and their natural resistance to poison and disease means
            that battlefield conditions that would incapacitate other races barely slow them down.
          traits:
            - Stone Resilience
            - Mountain Born
            - Enduring
          image: df4a97f7b08199838134bf56438cf02fb9d6434b8ff8b573d799fd5647099a86.jpg
          statMods:
            CON: 2
            DEX: -1
          bodyDescription: Short and broad with a powerful, stocky build. Skin is thick and weathered, ranging from ruddy tan to
            deep granite-grey. Features are heavy and blunt — strong jaw, prominent brow ridge, wide nose. Eyes are
            deep-set in shades of slate, amber, or dark brown. Hair is coarse and thick, typically worn in braids, in
            shades of iron-grey, black, or dark copper. Hands are broad with thick, calloused fingers.
