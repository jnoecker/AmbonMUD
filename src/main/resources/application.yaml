ambonmud:
  mode: STANDALONE
  sharding:
    enabled: false
    engineId: engine-1
    zones: []
    advertiseHost: localhost
    registry:
      type: STATIC
      leaseTtlSeconds: 30
      assignments: []
    handoff:
      ackTimeoutMs: 2000
    playerIndex:
      enabled: false
      heartbeatMs: 10000
    instancing:
      enabled: false
      defaultCapacity: 200
      loadReportIntervalMs: 5000
      startZoneMinInstances: 1
      autoScale:
        enabled: false
        evaluationIntervalMs: 30000
        scaleUpThreshold: 0.8
        scaleDownThreshold: 0.2
        cooldownMs: 60000
  grpc:
    server:
      port: 9090
      controlPlaneSendTimeoutMs: 2000
    client:
      engineHost: localhost
      enginePort: 9090
    allowPlaintext: true
    timestampToleranceMs: 30000
  gateway:
    id: 0
    snowflake:
      idLeaseTtlSeconds: 300
    reconnect:
      maxAttempts: 10
      initialDelayMs: 1000
      maxDelayMs: 30000
      jitterFactor: 0.2
      streamVerifyMs: 2000
    engines: []
  server:
    telnetPort: 4000
    webPort: 8080
    productionMode: false
    inboundChannelCapacity: 10000
    outboundChannelCapacity: 10000
    sessionOutboundQueueCapacity: 200
    maxInboundEventsPerTick: 1000
    tickMillis: 100
    inboundBudgetMs: 30
  world:
    startRoom: auringold_academy:krioshaeu_cabin
    resources:
      - world/auringold_academy.yaml
      - world/celestial_sanctum.yaml
      - world/playtesting.yaml
  persistence:
    backend: YAML
    rootDir: data/players
    worker:
      enabled: true
      flushIntervalMs: 1000
  database:
    jdbcUrl: jdbc:postgresql://postgres:5432/ambonmud
    username: ambon
    password: override-via-secrets-yaml
    maxPoolSize: 15
    minimumIdle: 2
  login:
    maxWrongPasswordRetries: 3
    maxFailedAttemptsBeforeDisconnect: 3
    maxConcurrentLogins: 50
    authThreads: 8
  engine:
    scheduler:
      maxActionsPerTick: 100
    guild:
      maxSize: 50
      inviteTimeoutMs: 60000
    debug:
      enableSwarmClass: false
    stats:
      definitions:
        STR:
          displayName: Strength
          abbreviation: STR
          description: Physical power
          baseStat: 10
        DEX:
          displayName: Dexterity
          abbreviation: DEX
          description: Agility and reflexes
          baseStat: 10
        CON:
          displayName: Constitution
          abbreviation: CON
          description: Health and endurance
          baseStat: 10
        INT:
          displayName: Intelligence
          abbreviation: INT
          description: Magical aptitude
          baseStat: 10
        WIS:
          displayName: Wisdom
          abbreviation: WIS
          description: Insight and willpower
          baseStat: 10
        CHA:
          displayName: Charisma
          abbreviation: CHA
          description: Force of personality
          baseStat: 10
      bindings:
        meleeDamageStat: STR
        meleeStatMultiplier: 0.25
        meleeLevelScalingRate: 1.4
        meleeVarianceMin: 0.85
        meleeVarianceMax: 1.15
        meleeBaseAttackPower: 10
        meleeArmorMitigationK: 20
        dodgeStat: DEX
        dodgePerPoint: 2
        maxDodgePercent: 30
        spellDamageStat: INT
        spellStatMultiplier: 0.25
        spellLevelScalingRate: 1.4
        spellVarianceMin: 0.85
        spellVarianceMax: 1.15
        healStat: WIS
        healStatMultiplier: 0.25
        healLevelScalingRate: 1.3
        healVarianceMin: 0.85
        healVarianceMax: 1.15
        buffStat: CHA
        buffDurationPerStat: 0.02
        buffMagnitudePerStat: 0.02
        hpScalingStat: CON
        hpScalingDivisor: 5
        manaScalingStat: INT
        manaScalingDivisor: 5
        hpRegenStat: CON
        hpRegenMsPerPoint: 200
        manaRegenStat: WIS
        manaRegenMsPerPoint: 200
        xpBonusStat: CHA
        xpBonusPerPoint: 0.01
