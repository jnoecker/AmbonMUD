    friends:
      maxFriends: 50
    classes:
      definitions:
        bulwark:
          displayName: Bulwark
          hpScalingRate: 1.42
          manaScalingRate: 1.39
          description: Immovable defender clad in heavy armor, holding the line against overwhelming odds.
          primaryStat: STR
          statPriorities:
            - STR
            - CON
            - DEX
          selectable: true
          threatMultiplier: 3
          image: 85b8254589f7de36b47b5b39ee41b6b261e987d794ac7d970793584387451f63.jpg
          outfitDescription: Massive plate mail bearing the patina of countless battles, each dent a testament to blows survived.
            Tower shield tall as a door, emblazoned with heraldry of protected causes. Stance planted firm, feet taking
            root, immovable as ancient oak before the storm.
          showcaseRace: lithae
          starterEquipment:
            - itemId: auringold_academy:starlight_sword
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        arcanist:
          displayName: Arcanist
          hpScalingRate: 1.39
          manaScalingRate: 1.42
          description: Master of advanced spellcraft who bends illusion and reality through communion with the Arcanum.
          primaryStat: INT
          statPriorities:
            - INT
            - WIS
            - CHA
          selectable: true
          threatMultiplier: 0.5
          image: 5fe37527a0b5fd1e3a9b2ca1555ed853f84d7834d521c734e2365dd4c74c787d.jpg
          outfitDescription: Robes of deep midnight blue that shift like ocean currents, embroidered with constellations that
            faintly glow in darkness. A scholar's sash holds pouches of ritual components and a leather-bound grimoire.
            Eyes reflect distant starlight. Fingers occasionally spark with borrowed cosmic radiance. Carries an ornate
            staff or wand topped with compressed starlight.
          showcaseRace: aetherae
          starterEquipment:
            - itemId: auringold_academy:starlight_staff
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        veil:
          displayName: Veil
          hpScalingRate: 1.41
          manaScalingRate: 1.41
          description: Stealth assassins who strike from shadow and vanish before their enemies can react.
          backstory: >-
            In an age when heroes are called to face eldritch horrors, the Veil remain Ambon's most enigmatic
            practitioners—masters of secrecy elevated to an art form. They move like living extensions of darkness
            itself, bending light around their forms and muffling sound before it escapes their footsteps, becoming so
            perfectly still that even time-perceiving Lustriae sometimes fail to notice them until movement betrays
            presence.


            Many serve as spies, assassins, and infiltrators across Ambon's kingdoms, slipping through noble courts like
            well-dressed ghosts or traversing canopy highways without disturbing a single leaf. Yet in this hopeful age,
            not all Veil members follow the path of death—some have adapted their ancient arts to serve newer purposes,
            redirecting killing strokes to disable rather than destroy, delivering sleep rather than fatality.


            Whether bound by coin, ancient oaths, or personal codes as shadowy as the practitioners themselves, the Veil
            represent the necessary darkness that gives meaning to light—the price of peace, the watchers who ensure
            that some threats never live long enough to require heroes to face them.
          primaryStat: DEX
          statPriorities:
            - DEX
            - STR
            - CON
          selectable: true
          threatMultiplier: 0.5
          image: 4df10f07cdc2d3265e8fe6453d5b21cd8c033130349d36893543d7897cec4cf3.jpg
          outfitDescription: Fitted dark silhouettes that absorb light rather than reflect it—deep leather armor in grays and
            blacks, with subtle silver or moonlit accents. Dual daggers or short blades concealed until the moment of
            strike. Movement is fluid and economical, a figure that seems to occupy less space than should be possible.
            Eyes are alert, watchful, carrying the calm stillness of a predator perfectly at ease in shadow.
          showcaseRace: mycorae
          starterEquipment:
            - itemId: auringold_academy:starlight_dagger
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        herald:
          displayName: Herald
          hpScalingRate: 1.4
          manaScalingRate: 1.42
          description: Divine conduit who channels patron power to heal wounds, restore strength, and kindle hope amid darkness.
          primaryStat: WIS
          statPriorities:
            - WIS
            - INT
            - CHA
          selectable: true
          threatMultiplier: 0.3
          image: 9187ad816d4f719d48a85dcfed58bf5667e39a79aaac5dbf9236b5a889a91e47.jpg
          outfitDescription: Robes or vestments adorned with symbols of their patron, bearing holy talismans, prayer beads, or
            reliquaries. Their presence radiates gentle luminescence—petals for Sylflorae, fragrant smoke for Pyrae,
            resonant shimmer for Lithae. They carry themselves with serene conviction, hands open in blessing, an aura
            of compassion and sacred power.
          showcaseRace: pyrae
          starterEquipment:
            - itemId: auringold_academy:starlight_mace
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        scrollwright:
          displayName: Scrollwright
          hpScalingRate: 1.41
          manaScalingRate: 1.415
          description: Craftspeople who command enchanted clockwork constructs powered by captured starlight and celestial magic.
          backstory: >-
            You have studied under the gentle tutelage of scrollwrights who learned their craft from Tessikar the
            Springwight himself—or at least from those who did. In quiet workshops filled with the tick-tock of brass
            hearts and the crystalline hum of awakening consciousness, you have learned to etch spiraling patterns onto
            clockwork frames, patterns that seem to shift when glimpsed from the corner of one's eye. You have learned
            to seat luminous crystals—fragments of starlight captured in faceted stone—into delicate mechanisms,
            breathing synthetic life into automatons through a sublime fusion of precise craftsmanship and reverent
            magic.


            Your creations are humble compared to the legendary Animae of Tessikar's greatest works, yet each one
            carries a spark of the same wonder. Perhaps you command clockwork sparrows that chirp melodies of pure
            mathematics, or brass companions no larger than a child's cupped hands. Each ticking heart within your
            constructs pulses with a genuine essence of life drawn from Ambon's creative force, making them true
            servants rather than mere puppets.
          primaryStat: INT
          statPriorities:
            - INT
            - CON
            - STR
          selectable: true
          image: df3e3c7a4988f937df3c6ec63b982c26b86a57d560281b7cd62a02241b398c5f.jpg
          outfitDescription: A Scrollwright wears workshop-stained robes of warm earth tones, pockets heavy with clockwork
            components and luminous crystal fragments. Their fingers bear the precise marks of steady
            craftsmanship—calluses from engraving tools, faint scorch marks from soldering brass. They carry themselves
            with the patient focus of an artisan, often accompanied by one or more of their small clockwork creations
            hovering or perched nearby, their surfaces gleaming with brass and crystal in rhythmic, hypnotic motion.
          showcaseRace: lustriae
          starterEquipment:
            - itemId: auringold_academy:starlight_hammer
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        songweaver:
          displayName: Songweaver
          hpScalingRate: 1.4
          manaScalingRate: 1.42
          description: Minstrels and bards who channel primal magic through melody, narrative, and performance—shaping reality
            itself with their songs.
          primaryStat: CON
          statPriorities:
            - CON
            - DEX
            - STR
          selectable: true
          threatMultiplier: 0.4
          image: baf687e5bd4600479ddc4c53f39a2883ca76f50fd4ccc794b11cc50b5a8343ac.jpg
          outfitDescription: Flowing garments adorned with ornate patterns and baroque embellishments that shimmer with subtle
            bioluminescence; an elegant instrument—lyre, pipe, or voice itself—carried with practiced grace; stance
            poised between performer and mystic, movements fluid and expressive as living song.
          showcaseRace: kitsarae
          starterEquipment:
            - itemId: auringold_academy:starlight_lyre
            - itemId: auringold_academy:auringold_robes
            - itemId: auringold_academy:slice_cake
              equip: false
            - itemId: auringold_academy:cup_tea
              equip: false
            - itemId: auringold_academy:cucumber_sandwich
              equip: false
        AKATHAVAE:
          displayName: Akathavae
          hpScalingRate: 1.35
          manaScalingRate: 2
          description: Pledge-granted pacifist path. Players who pledge at an Akathavae shrine become Akathavae — combat is
            forsworn and the world is leveled through illumination. Multiclassing is locked while pledged, and the prior
            class is restored on renunciation. Not selectable at character creation.
          backstory: The Akathavae are keepers of knowledge who give voice to stories, in service of the Naraxian god who writes
            the Arcanum. Where others conquer the world, the Akathavae record it — every room walked, every creature
            met, every relic held — illuminating each into a personal Arcanum.
          primaryStat: INT
          statPriorities:
            - INT
            - WIS
            - CHA
          selectable: false
          image: 36ec1b6c729d27b84e059a26ac8434432a35ea185a378c27fa8c5cb56ce48f06.jpg
          outfitDescription: Candle-lit scholar's robes layered over travelling leathers, a satchel of blank parchment, and a
            quill kept always within reach.
          showcaseRace: archae
    races:
      definitions:
        archae:
          displayName: Archae
          description: The first children of the Creator, adaptable and ambitious inheritors of divine legacy.
          backstory: Before the world had learned its own name, before the seas remembered their shores or the mountains
            understood their heights, the Creator breathed intention into clay and starlight, and the Archae opened
            their eyes for the very first time. They are the eldest children, the prototype and the promise, shaped not
            for any single purpose but for all purposes at once — a people built from divine curiosity rather than
            divine certainty.
          image: ed7a68c77e2223e074cfa6d21bda4e71448d28b61809403409324382952cf4cc.jpg
          statMods:
            STR: 1
            DEX: 1
          bodyDescription: Medium humanoid frame, well-proportioned and graceful. Smooth brown skin with large, expressive eyes
            that seem to hold depths of ancient memory. Hair is brown. Hands are elegant and dexterous, suggesting
            capability across many pursuits.
          racialAbility:
            kind: ARCHAE_DRENGARIAE
            displayName: Call the Drengariae
            cooldownMs: 150000
            triggerHealthPct: 25
            petTemplateKey: drengariae_soldier
            petDurationMs: 9000
            selfMessage: You cry out to the Drengariae — a frost-clad soldier answers, blade aflame!
            roomMessage: A Drengariae soldier answers {player}'s call, blade wreathed in pale fire!
        aetherae:
          displayName: Aetherae
          description: Beings of shadow and mist, charged with ancient sacred duties since their creation from Aineroia's own
            essence.
          backstory: "Beings of shadow and mist, the Aetherae are shapeshifters who take on whatever form they please. They reside
            in the far north of Ambon, living in nomadic societies where they care for the moonlight horses, the
            Luneqrae. "
          image: 482b6bbc79161499c4c200f507ac1e84c9cf19779d31bad11f7522563451b210.jpg
          statMods:
            INT: 1
            WIS: 1
            DEX: 1
            CON: -3
          bodyDescription: "A figure made of dark, billowing shadowy smoke, wrapped in a heavy ornate purple cloak with intricate
            embroidery and clasps, made of a mother-of-pearl like material. The cloak is richly detailed and clearly
            physical — the body within it is not. Where the cloak opens or where a face should be, there is only roiling
            dark fog, dense and slowly churning. No visible features, no solid form beneath the garment . The smoke
            curls and wisps at the edges of the cloak's hood and hem. "
          imagePromptDirective: NO FACE, NO HUMAN FACE, NO SOLID FORM, MADE OF FOG AND SMOKE
          racialAbility:
            kind: AETHERAE_PHASE
            displayName: Phase Shift
            cooldownMs: 150000
            phaseTicks: 2
            selfMessage: You flicker out of existence — the blow passes through empty air.
            roomMessage: "{player} flickers and fades out of existence!"
        lustriae:
          displayName: Lustriae
          description: Eternally youthful fae who perceive time as a living current, flitting between moments with curious
            playfulness.
          backstory: The Lustriae are the first children of Aineroia. Resembling faeries, with colorful diaphanous wings and an
            eternally youthful, perfect visage. They have a natural affinity for time magic and prophecy.
          image: c3b3f34dc46cba273afea05a5c0a0640817ff938344ea21d74c8e990e17cacf0.jpg
          statMods:
            DEX: 1
            CHA: 1
            CON: -1
          bodyDescription: "A faerie with luminous iridescent skin, pastel-toned hair, and delicate youthful features. Large
            softly glowing eyes. Wearing elegant garments that appear grown from leaves, petals, silk, and vines. Large,
            multicolor diaphanous wings extend behind them like stained glass windows. "
          racialAbility:
            kind: LUSTRIAE_TIMESLIP
            displayName: Timeslip
            cooldownMs: 150000
            selfMessage: Time stutters — you slip a heartbeat sideways and strike again!
            roomMessage: "{player} blurs as time stutters around them!"
        pyrae:
          displayName: Pyrae
          description: Sons of the Phoenix — beings of living flame born from stories of rebirth and resurrection.
          backstory: Creatures of fire and rebirth, the Pyrae are the descendants of the mythical phoenix. They reside in the
            thick jungles formed in the wake of the heat of the Caldera, building cities high in the trees. They produce
            numerous unique salves and herbal remedies and have a strong symbiotic relationship with their jungle
            homeland.
          image: 3f4c8ad44513c967813302f641e61f614f16396671209408fe5e5a46d8ef764b.jpg
          statMods:
            STR: 1
            CON: 1
            CHA: 1
          bodyDescription: >-
            a tall, elegant humanoid phoenix made of living flame, with sharp avian features, ember-bright eyes, molten
            crimson-and-amber skin, glowing fire-veins, and a crest of open flame for hair. A great pair of phoenix
            wings grows from their shoulders and back, folding around them like a fiery cloak, while they still retain
            normal human arms and hands. Regal, radiant, severe, and mythic, with ash motes and heat shimmer surrounding
            them.

            Their skin is not true flesh, but a fluid surface of deep crimson, ruby-black, and molten amber, rippling
            like the crust of cooling magma. Beneath that surface, veins of brilliant gold-white fire trace their
            throats, collarbones, ribs, and limbs, flaring brighter with strong emotion. Their hair rises as a crest of
            open flame, curling upward in scarlet, orange, and gold like phoenix plumage caught in a windless blaze.


            From their shoulders springs a magnificent pair of wings, large and expressive, worn almost like a regal
            cloak draped across their back. At rest, the wings fold close around them, creating the impression of a
            mantle of living feathers and fire; when spread, they blaze outward in long layered plumes of crimson,
            orange, gold, and white-hot light. The wings should feel unmistakably phoenix-like: elegant, fiery, and
            ceremonial, framing the body rather than replacing the arms.


            Unlike true birdfolk, the Pyrae retain normal humanoid arms and hands. 


            Their legs are long and elegant, human-shaped or subtly raptor-like in posture, ending in darkened feet
            wreathed in heat distortion. At rest, they seem like living embers in humanoid form; in motion, they become
            radiant phoenix figures, wing-cloaks unfurling in a storm of fire and light.
          racialAbility:
            kind: PYRAE_IMMOLATE
            displayName: Immolation
            cooldownMs: 120000
            triggerHealthPct: 10
            aoeDamagePctOfMaxHp: 0.6
            selfMessage: Your blood boils over — you erupt in a roar of flame!
            roomMessage: "{player} erupts in a roar of flame!"
        ophirae:
          displayName: Ophirae
          description: Serpentine abyssal dragons who rule the cold northern waters from underwater cities built of leviathan bone.
          backstory: The Ophirae were born from Aineroia's stories of power, fierceness, and freedom—the hope of being stronger
            than death itself. Created to rule the air, water, and skies, they rose as apex predators of the cold
            northern seas, claiming the bones and scales of now-extinct ocean leviathans to craft their vast underwater
            cities. From these architectural marvels of ancient bone, they venture forth to maintain small trading posts
            on the edges of lakes and oceans, bridging their abyssal realm with the surface world.
          image: f23e93bc5af134a6631c9530b44b67f673f4261fb3bfb434c4c4d85242e19870.jpg
          statMods:
            STR: 1
            DEX: 1
            CON: 1
          bodyDescription: "A fully reptilian dragon-humanoid with a true dragon head, scaled snout, elegant horned or frilled
            crest, intelligent golden eyes, and blue-green iridescent scales. Clawed hands and feet, long tail, and
            small draconic wings with translucent fin-like membranes folded behind. "
          racialAbility:
            kind: OPHIRAE_WRATH
            displayName: Draconic Wrath
            cooldownMs: 120000
            triggerHealthPct: 20
            damageMultiplier: 1.5
            buffDurationMs: 6000
            selfMessage: Your draconic blood ignites — your strikes turn merciless!
            roomMessage: "{player}'s eyes blaze with draconic fury!"
        kitsarae:
          displayName: Kitsarae
          description: Animal spirits who walk between animal and humanoid form, masters of deception and subtle enchantment.
          backstory: Coming from many different backgrounds, the Kitsarae began life as simple animals but through an unquenchable
            thirst for knowledge and cultivation have become sentient. They are disciples of the Naraxian Akathavae, the
            goddess of scholars and performers, who has gifted them the ability to shift between humanoid and animal
            forms. They excel at diplomacy and are often found as traveling minstrels and performers.
          image: 31929073f06f7aafe73d7a949549dc8f568d2158acf1483728e037be3275c81d.jpg
          statMods:
            INT: 1
            DEX: 1
            CHA: 1
            STR: -1
          bodyDescription: Animal humanoids that come in many shapes and sizes. Any animal that chooses a path of cultivation.
            Choose a random and unusual mammal and anthropomorphize it. They walk on two legs but retain most of their
            animal features unless they are trying to disguise themselves. They come in all shapes and sizes, living
            harmoniously in their pursuit of knowledge. No vulpines.
          imagePromptDirective: NO HUMAN FACE, FULLY ANIMAL FACE , Try to pick unusual mammals and avoid foxes in general, NO FOXES
          racialAbility:
            kind: KITSARAE_REVERSAL
            displayName: Cultivated Reversal
            cooldownMs: 180000
            selfMessage: You breathe the lethal force inward — the killing blow becomes life!
            roomMessage: "{player} draws a killing blow inward as though it were a breath."
        mycorae:
          displayName: Mycorae
          description: Fungal people grown from living mycelium, embodying the natural cycle of decay and rebirth.
          backstory: Born of Aineroia's stories of the natural order—of decay and rebirth, the endless turning of seasons—the
            Mycorae emerged as living proof that death is not an ending but a transformation. Their consciousness dwells
            both in the fruiting bodies that walk among the forests of Ambon and in the vast mycelial networks that web
            beneath the soil, connecting them to one another in ways other races scarcely comprehend.
          image: a04e5a698881ebd23ac7f06454a8d687dc6ab475040151f57d1e10158e4e0531.jpg
          statMods:
            WIS: 1
            CON: 1
            CHA: -1
          bodyDescription: A Mycorae, a gentle, small humanoid mushroom spirit made of mycelium, bark fibers, moss, and layered
            fungi. Ruffled orange-red mushroom cap like a living hat, shadowed face with glowing cyan eyes, body covered
            in overlapping red, purple, and magenta shelf mushrooms, turquoise bioluminescent droplets and spores,
            covered in colorful glowing mushrooms and wildflowers.  Short and delicate. No human face.
          imagePromptDirective: NO FACE, NO HUMAN FACE
          racialAbility:
            kind: MYCORAE_SPORES
            displayName: Spore Burst
            cooldownMs: 120000
            triggerHealthPct: 25
            petTemplateKey: spore_mushroom
            petCountMin: 1
            petCountMax: 3
            petDurationMs: 12000
            selfMessage: You burst, scattering a cloud of spores that erupt into shrieking mushrooms!
            roomMessage: "{player} bursts in a cloud of spores!"
        lithae:
          displayName: Lithae
          description: Living beings of crystal and stone, their forms shimmer with the earth's raw beauty and transform across
            centuries into glittering prisms.
          backstory: When the world was young, Kvarcgagap the Shining Quartz Void moved through the deep places, seeding them with
            caverns filled with ore and gemstone. Within those caverns, he carved ornate crystalline humanoid statues,
            sleeping below the mountains. When the Emberfell awoke Ambon's magic, the Lithae awoke as well, constructing
            shining cities in the mountain's core.
          image: 19886d18950cd05184efcc7933605b13b5833626b50b70d9b8d8d7ed3f7dbe49.jpg
          statMods:
            CON: 1
            DEX: -1
          bodyDescription: "A  short, stocky humanoid made from a colorful patchwork of irregular gemstones, crystals, rocks, and
            ore, held together by glowing gold kintsugi-like seams. Not a sleek crystal warrior, but an ancient mountain
            spirit with a craggy expressive face, large rounded hands, warm glowing eyes, and a richly varied mosaic
            body of amethyst, garnet, quartz, jasper, emerald, opal, obsidian, citrine, and rose quartz. "
          imagePromptDirective: No human face
          racialAbility:
            kind: LITHAE_STONEFORM
            displayName: Stone Form
            cooldownMs: 150000
            regenPctOfMaxHp: 0.2
            stoneStatusId: stoneform_root
            stoneDurationMs: 4000
            selfMessage: Your skin hardens to living stone — the blow glances away as you settle, immovable.
            roomMessage: "{player} turns to living stone!"
        aureliae:
          displayName: Aureliae
          description: Bioluminescent beings of the deep ocean, drifting like living constellations through Ambon's darkest waters.
          backstory: The Aureliae were born from Aineroia's desire to light the darkness of the next world for her lost children.
            These jellyfish-like beings emerged as living radiance—translucent forms that pulse with cascades of azure,
            violet, and pearl, their bioluminescence a gentle beacon in the deep. They live in underwater cities
            constructed from living coral, which they manipulate through their magic songs.
          image: be0ac8d68f5ec2bbb86cb2806841cd7e86e00d123938fba8ae87b9dd848bb614.jpg
          statMods:
            INT: 1
            WIS: 1
            DEX: 1
          bodyDescription: A tall, elegant aureliae with a partially humanoid silhouette, its upper body shaped with subtle
            suggestions of shoulders, torso, and posture beneath layers of translucent jelly-like flesh. Its head is a
            luminous crystal-clear bell resembling a celestial jellyfish dome, filled with swirling galaxies, drifting
            nebulae, and radiant constellations that pulse softly like a living universe. The creature has no true face,
            only shifting concentrations of starlight within the dome that imply awareness and emotion. From beneath the
            bell cascade long, graceful tendrils that resemble a fusion of jellyfish tentacles and flowing robes,
            curling and drifting with weightless elegance. Several thicker tendrils function almost like elongated arms,
            capable of delicate movement and manipulation, while finer sensory filaments trail behind like cosmic silk.
            Its body narrows into a vaguely humanoid torso before dissolving into a mass of floating bioluminescent
            appendages instead of legs. The flesh is semi-transparent and iridescent, glowing with deep blues, violets,
            and ultraviolet hues, threaded with faint veins of astral light. The creature radiates an ancient, mystical
            intelligence—less like an animal and more like a wandering cosmic sage born from the abyss between stars.
            High-detail fantasy creature design, ethereal bioluminescence, elegant humanoid anatomy blended with
            jellyfish morphology, painterly fantasy illustration, celestial deep-sea aesthetic, soft cosmic bloom
            lighting, flowing organic shapes, alien but beautiful, no clothing, no armor, no human skin textures, no
            human face
          imagePromptDirective: NO FACE, NO HUMAN FACE
          racialAbility:
            kind: AURELIA_DAZZLE
            displayName: Dazzling Burst
            cooldownMs: 120000
            triggerHealthPct: 15
            stunStatusId: dazzle_stun
            selfMessage: You flare with blinding bioluminescence!
            roomMessage: "{player} flares with blinding light!"
