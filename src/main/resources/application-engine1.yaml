# Engine 1 profile for multi-instance local testing.
# Run with: ./gradlew runEngine1
# Owns: crossroads_path, thornhaven_city, thornwood_forest, farmer_fields,
#        cobblestone_road, highland_trails, old_mines, marsh_of_fog,
#        goblin_warrens, dark_barrows
# gRPC server: 9091  |  metrics: 9191
ambonmud:
  mode: ENGINE
  sharding:
    enabled: true
    engineId: engine-1
    zones:
      - crossroads_path
      - thornhaven_city
      - thornwood_forest
      - farmer_fields
      - cobblestone_road
      - highland_trails
      - old_mines
      - marsh_of_fog
      - goblin_warrens
      - dark_barrows
    advertiseHost: localhost
    registry:
      type: STATIC
      assignments:
        - engineId: engine-1
          host: localhost
          port: 9091
          zones:
            - crossroads_path
            - thornhaven_city
            - thornwood_forest
            - farmer_fields
            - cobblestone_road
            - highland_trails
            - old_mines
            - marsh_of_fog
            - goblin_warrens
            - dark_barrows
        - engineId: engine-2
          host: localhost
          port: 9092
          zones:
            - sea_cliffs
            - sunken_temple
            - ruined_fortress
            - shadowmere_fen
            - thornhaven_sewers
            - haunted_manor
            - barrens_wastes
            - frost_caverns
            - celestial_peak
            - dungeon_of_echoes
  grpc:
    server:
      port: 9091
    sharedSecret: "local-dev-secret-change-in-production"
  observability:
    metricsHttpPort: 9191
