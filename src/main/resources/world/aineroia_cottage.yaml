items:
  moonpetal:
    image: 1710867d1cc3353b2226027f48548f11f398fa0bcad4dd422209b750857caa14.png
    displayName: a moonpetal herb
    keyword: moonpetal
    description: A luminescent herb with wide, cool-to-the-touch petals. It smells faintly of night air and restores a
      measure of vitality when consumed.
    consumable: true
    onUse:
      healHp: 12
    room: west_herb_garden
    basePrice: 15
  phoenix_feather:
    image: c424dc0a36158f0f26b9ae4d3d804e1924737d1eaf53952f40d9d36a5786fa1f.png
    displayName: a phoenix feather
    keyword: feather
    description: A long tail feather in deepest crimson and molten gold, still faintly warm. It doesn't burn — but something
      inside it does.
    room: east_flower_garden
    basePrice: 30
  corpsecap_spore:
    image: d68765a76da726ce313f9925e08f6286fad765836947d51cc39c08f56c34db68.png
