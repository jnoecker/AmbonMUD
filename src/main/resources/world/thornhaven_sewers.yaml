items:
  rat_pelt:
    displayName: a sewer rat pelt
    keyword: pelt
    description: A greasy, foul-smelling pelt stripped from a giant sewer rat. Has some value to tanners who don't ask questions.
    basePrice: 8
    image: 9ed3ef36874ef6741a83a6cd1b07a24b9e09c1dbd9e0b100b725d8b599aa61ac.png
  deserter_tag:
    displayName: a deserter's identification tag
    keyword: tag
    description: A stamped metal tag from a city guard who went absent without leave. The city watch might pay for these.
    basePrice: 12
    image: e6ca4dfa4aff85974d1cf8f23bede7a4ba83ea3af5b9a9c0cf86d1e48db8656d.png
  troll_tooth:
    displayName: a sewer troll tooth
    keyword: tooth
    description: A heavy, curved tooth pried from a sewer troll. Alchemists grind these into strengthening compounds.
    basePrice: 25
    image: 2d97e4680bf9cc79ba28cefc52df16a3aedb12168a9e88b447c91462d7354537.png
  stolen_shipment:
    displayName: a stolen merchant shipment
    keyword: shipment
    description: A bundle of silks and spices bearing a Thornhaven merchant's seal, stolen and stashed in the sewers.
      Informant Nax will want this returned.
    basePrice: 0
    image: 992f26addc92756a9279c7a2e18e482ec021879212efdfbf48c57e1c559477e3.png
  thieves_shiv:
    displayName: a thieves' shiv
    keyword: shiv
    slot: weapon
    damage: 8
    basePrice: 280
    description: A short, perfectly balanced stabbing blade favoured by sewer-dwelling rogues. Quick and quiet.
    image: ca65abf39ee13a748b6625e7080b716936c9423857cb321d285fd85492e2a01e.png
  sewer_leathers:
    displayName: reinforced sewer leathers
    keyword: leathers
    slot: body
    armor: 5
    basePrice: 310
    description: Hardened leather armour treated with waterproofing oils. Designed for fighting in confined, wet spaces.
    image: 9b7a804f645118976bfe32c23f8f27c6178a41d43fb3224a5ec5be8b7a444809.png
  lockpick_set:
    displayName: a lockpick set
    keyword: lockpick
    basePrice: 35
    description: A leather roll containing picks, rakes, and tension wrenches. The Fence sells these to anyone who doesn't
      ask what they're for.
    image: 4f27aedf8308cb1cf21f8879e6c7f2a2d4b9584bcf40b62eaecfc118f4fc953a.png
  smoke_vial:
    displayName: a smoke vial
    keyword: smoke
    consumable: true
    onUse:
      healHp: 5
    basePrice: 40
    description: A small glass vial that shatters on impact, releasing a cloud of choking grey smoke. Useful for disengagement.
    image: 6126ccf2631a7f92e5ab32ba00e5ba745ad2c850031863c2dbb72693e601a040.png
  smuggled_blade:
    displayName: a smuggled blade
    keyword: blade
    slot: weapon
    damage: 6
    basePrice: 180
    description: A serviceable sword of foreign manufacture, smuggled past the city tariffs. No maker's mark.
    image: 8e1d1670f9d79f7f374ceacecbf492fd28119b6bf0d5b5d7d6be488ba26c03d9.png
