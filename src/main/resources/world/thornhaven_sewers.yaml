  the_fence:
    name: the Fence
    room: fences_den
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: Don't say my name. Don't ask my name. I buy things that need buying and sell things that need selling. Type 'list'
          to see what I've got. No questions asked — on either side.
        choices:
          - text: What can you tell me about the sewers?
            next: sewer_info
          - text: Goodbye.
            next: farewell
      sewer_info:
        text: These tunnels run the full length of Thornhaven — older than the city itself. Rats in the upper levels, deserters
          and rogues further down. A troll has set up in the deep section and nobody's keen to evict it. Beyond the
          troll? Smugglers' territory. Best left alone unless you've got a death wish.
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: You were never here.
    image: bd07ed17e4c0b05fed591ab77411dbf08c827076f2f7bd716740231ed2fb3eb5.png
  informant_nax:
    name: Informant Nax
    room: fences_den
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - stolen_shipment
    dialogue:
      root:
        text: Psst. Over here. Name's Nax. I've got information — good information — about a stolen merchant shipment. The goods
          are locked in the smugglers' vault past the troll. I can't get past the troll myself, but someone with your...
          capabilities... could. Recover the shipment and I'll make it worth your time.
        choices:
          - text: I'll recover the shipment.
            next: quest_accept
          - text: Why can't you do it yourself?
            next: why_me
          - text: Goodbye.
            next: farewell
      why_me:
        text: Have you seen the troll? It's twice my height and it eats people. I'm an informant, not a hero. The vault is past
          the troll's lair — bring back the shipment and you'll be well paid.
        choices:
          - text: Fine, I'll do it.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Good. Head south through the lower drain and the deep sewer. The troll guards the passage to the vault. The
          shipment is in an iron strongbox. Bring it back here.
        choices:
          - text: I'll be back.
            next: farewell
      farewell:
        text: Keep your head down. The rogues don't like strangers.
    image: eeebe380843c564f42f91fd37f771624a9122e6fcb81a973a9cad48ea62f5691.png
