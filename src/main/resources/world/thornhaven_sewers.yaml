quests:
  stolen_shipment:
    name: The Stolen Shipment
    description: Informant Nax has intelligence on a stolen merchant shipment stashed in the smugglers' vault deep in the
      Thornhaven sewers. Get past the sewer troll and recover the goods.
    giver: informant_nax
    objectives:
      - type: collect
        targetKey: stolen_shipment
        count: 1
        description: Recover the stolen shipment from the smugglers' vault
    rewards:
      xp: 850
      gold: 55
rooms:
  sewer_entrance:
    title: Thornhaven Sewers — Entrance
    description: A rusted iron ladder descends from the grate above into a vaulted brick tunnel. The air is thick with damp
      and the smell of stagnant water. Torches have been mounted in crude brackets — someone uses these tunnels
      regularly. The main drainage channel runs south into the darkness. The grate above leads back up to the city.
    exits:
      u: thornhaven_city:lower_city_alley
      s: drainage_hub
    image: b06d6c8f934fe93316da026769ffc267e88ce6ca26eb71864edbf50836d8e13e.jpg
  drainage_hub:
    title: Drainage Hub
    description: A wide junction where three drainage channels converge. The brickwork here is ancient — far older than the
      city above — and the ceiling arches high enough to stand comfortably. Water flows sluggishly along channels cut
      into the floor. Tunnels branch east, west, and south. The entrance is back to the north.
    exits:
      n: sewer_entrance
      e: east_channel
      w: west_overflow
      s: lower_drain
    image: 46a2a58690ddff71ac7f6b5297ecc6ddf6f70ef9b917b72018cc9dfeec131142.jpg
  east_channel:
    title: East Channel
    description: A long brick tunnel running east beneath the city. The water is deeper here and the walls are slick with
      green growth. Giant sewer rats have established territory along this stretch, their nests visible in gaps between
      the bricks. The drainage hub is back to the west; the rat warren lies to the south.
    exits:
      w: drainage_hub
      s: rat_warren
    image: bc7884394feeaeb7a53932d8d5c1b955fbfbf023451b1a1fa89abfd50b6e8440.jpg
  rat_warren:
    title: Rat Warren
    description: A collapsed section of tunnel that sewer rats have turned into a sprawling nest. The floor is covered in
      debris, droppings, and the remains of things dragged down from above. The rats are territorial and aggressive. The
      east channel is back to the north; a hidden alcove lies to the east.
    exits:
      n: east_channel
      e: hidden_alcove
    image: c80567ea546e5e6a7e12bd8ac0e20c063922137fd60dc1a0dd6d63a2ef6e6ae3.jpg
  hidden_alcove:
    title: Hidden Alcove
    description: A dry recess in the tunnel wall, partially concealed by fallen masonry. Someone has been using this as a
      stash point — there are scuff marks on the stone and a reinforced chest wedged into the corner. The rat warren is
      back to the west.
    features:
      smuggled_chest:
        type: CONTAINER
        displayName: a reinforced chest
        keyword: chest
        initialState: closed
        resetWithZone: true
        items:
          - lockpick_set
    exits:
      w: rat_warren
    image: 2479bc078a4f469ced4efc09297edeeee236c4f2315f3f29ca12361d26e9de23.jpg
  west_overflow:
    title: West Overflow
    description: An overflow channel where excess rainwater is diverted during storms. The tunnel is wider and drier than
      the east side, and the brickwork shows signs of repair — someone maintains this section. A passage continues west
      toward what smells like habitation. The drainage hub is back to the east.
    exits:
      e: drainage_hub
      w: fence_passage
    image: 96cab4707afe1a284af65abb5760e1d7ec6e4494cd3b7e828a6452ffc4ee77e8.jpg
  fence_passage:
    title: Fence's Passage
    description: A narrow tunnel marked with subtle chalk symbols on the walls — directional markers for those who know the
      code. The passage has been swept clean and a curtain of sacking hangs over the entrance ahead to the west. Someone
      has gone to some trouble to make this section discreet. The overflow channel is back to the east.
    exits:
      e: west_overflow
      w: fences_den
    image: 48580329e236ffd29b0f1c95a3e6154e47060adcdcfedaa4a3eb709ed090060f.jpg
  fences_den:
    title: The Fence's Den
    description: A surprisingly well-appointed chamber carved out of the old sewer infrastructure. Wooden shelving lines the
      walls, stocked with an eclectic inventory. A brazier provides heat and light. The Fence conducts business from
      behind a makeshift counter, and Informant Nax lurks in the shadows nearby. Type 'list' to browse the Fence's
      goods.
    exits:
      e: fence_passage
    image: a47c9dffacd0b2d0dad78641572d6e87d29f44ce5d17370c105cf7c6ef841cf0.jpg
  lower_drain:
    title: Lower Drain
    description: The main drainage channel descends here, the ceiling dropping and the air growing heavier. The brickwork
      transitions from maintained to neglected — whatever municipal attention the upper levels receive doesn't extend
      this deep. A deserter camp is visible through a breach in the east wall. The passage continues south into
      darkness.
    exits:
      n: drainage_hub
      e: deserter_camp
      s: deep_sewer
    image: 13e23351081c6397aebc8357ba8863271e4c22b9d8728514b5a3ce876b70ad3b.jpg
  deserter_camp:
    title: Deserter Camp
    description: A makeshift camp in a disused cistern, occupied by soldiers who deserted the city guard and went
      underground rather than face tribunal. Bedrolls, stolen provisions, and guard-issue equipment litter the floor.
      The deserters are hostile to anyone who might report their location. The lower drain is back to the west.
    exits:
      w: lower_drain
    image: bd560daea9a7308a7d68600f036fe553dc543f986573168a1eb050b9d3ee75e1.jpg
  deep_sewer:
    title: Deep Sewer
    description: The deepest level of the accessible sewer system. The tunnel walls are damp and the air is foul. Sewer
      rogues have claimed this territory, patrolling between here and their hideout to the east. The troll's domain lies
      to the south — the smell alone warns you. The lower drain is back to the north.
    exits:
      n: lower_drain
      e: rogue_run
      s: troll_tunnel
    image: c0cf16522aba5f9066969baeadffbdbc11c6a319d87239c676318ed40f842387.jpg
  rogue_run:
    title: Rogue Run
    description: A stretch of tunnel controlled by sewer rogues who operate outside the Thieves' Guild's jurisdiction.
      They've set up trip-wires, observation points, and escape routes through the brickwork. Anyone entering without
      their knowledge is treated as a target. The deep sewer is back to the west.
    exits:
      w: deep_sewer
    image: f11033d3ccfc11187a57be2530dc174cf58d60bccf0db1984a3e66313b15cd29.jpg
  troll_tunnel:
    title: Troll Tunnel
    description: A wide, low-ceilinged passage that reeks of carrion and something worse. Deep claw marks score the walls,
      and the bones of unfortunate adventurers crunch underfoot. The troll's lair opens up ahead to the south. The deep
      sewer is back to the north.
    exits:
      n: deep_sewer
      s: trolls_lair
    image: c8012fd5a0a52e2d17c6c26bfe8dcf01897b7a44cc1ac12b4ffdc2ddd2813146.jpg
  trolls_lair:
    title: Troll's Lair
    description: A large natural cavern that the sewer system was built around — or perhaps broke into by accident. A
      massive sewer troll has made this space its own, surrounding itself with a nest of filth, bones, and collected
      refuse. Despite its brutishness, the troll is an effective guardian — nothing passes without its permission. A
      reinforced passage leads east to the smugglers' vault.
    exits:
      n: troll_tunnel
      e: smugglers_vault
    image: 7994bd642223046523aa68d8608392c0a8934e0ce638e921cf44adb205297b10.jpg
  smugglers_vault:
    title: Smugglers' Vault
    description: A sealed chamber at the far end of the sewer system, retrofitted with iron doors and heavy locks by whoever
      runs the smuggling operation. Crates and barrels fill the space, most bearing merchant marks that have been
      crudely scraped off. An iron strongbox against the far wall contains goods awaiting redistribution. The troll's
      lair is back to the west.
    features:
      iron_strongbox:
        type: CONTAINER
        displayName: an iron strongbox
        keyword: strongbox
        initialState: closed
        resetWithZone: false
        items:
          - stolen_shipment
    exits:
      w: trolls_lair
    image: 5d8e218bcd48037a08e2dfbe5406a8b4c1026ccdc31c63db56d7521e96be98df.jpg
graphical: true
