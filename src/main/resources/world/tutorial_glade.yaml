zone: tutorial_glade
startRoom: awakening_clearing
rooms:
  awakening_clearing:
    image: a4f83217c4a403e38159dd95db921cba5a12a72301ceea6e1758020d3c2a23ad.jpg
    title: Awakening Clearing
    description: You stand in a sun-dappled clearing ringed by ancient oaks. Soft grass cushions your feet, and birdsong
      drifts from the canopy above. A gnarled walking stick lies half-hidden in the clover. A mossy trail leads north
      into the trees. To the south, a vine-wrapped archway shimmers faintly — the way back to the Wayfinder Gallery.
    exits:
      n: mossy_trail
      s: ambon_hub:wayfinder_gallery
  mossy_trail:
    image: 6b065289dbb5dddf7d2959ddfc0c096dc08940e878051f4c42c0bf79429e489b.jpg
    title: Mossy Trail
    description: A narrow trail winds between moss-covered stones and leaning birch trees. Ferns brush your knees as you
      walk, and the air smells of damp earth and wild mint.
    exits:
      n: old_signpost
      s: awakening_clearing
  old_signpost:
    image: 77d8c217947b88804c5173e9882e02cdbaa660a0737dcef9381372c4445b3744.jpg
    title: Old Signpost
    description: A weathered signpost stands at a fork in the trail. One arm points north and reads 'CAMP', another points
      vaguely into the undergrowth. Most of the paint has peeled away, but someone has scratched fresh arrows into the
      wood.
    exits:
      n: hermit_camp
      s: mossy_trail
  hermit_camp:
    image: 06f3da07ac9a5f55f54c9c3311d391fc599653a9d29ff6ece4e7bfb6555ee8bc.jpg
    title: Hermit's Camp
    description: A small campsite tucked beneath a leaning pine. A bedroll lies unrolled beside a cold fire ring, and a
      leather cap sits on a mossy stump as if placed there moments ago. Whoever camped here left in a hurry.
    exits:
      n: stream_crossing
      s: old_signpost
  stream_crossing:
    image: fea21c7f07c870981c2601c0cf6020bf01b0e8a7272c0a7dd80acd1acb70e4f8.jpg
    title: Stream Crossing
    description: A clear stream cuts across the trail, burbling over smooth stepping stones. Sunlight flashes off the water,
      and dragonflies hover above the current. The main path continues north, and a faint trail leads east toward the
      sound of frogs.
    exits:
      n: mushroom_grove
      s: hermit_camp
      e: lily_pond
  mushroom_grove:
    image: 9e4775942893ad91c1fd9d6c8b48d3e3a05b61260a1ede52909d21836c2c7101.jpg
    title: Mushroom Grove
    description: Giant mushrooms grow in clusters here, their spotted caps rising waist-high. Spores drift in lazy spirals
      through shafts of green light. Something rustles beneath the nearest cap, and the air tastes faintly of copper. A
      large burrow opens to the east.
    exits:
      n: fern_hollow
      s: stream_crossing
      e: burrow_entrance
  fern_hollow:
    image: d8428071f1a298c8b43d12273cad447e47652dd10c03815351408386616443ae.jpg
    title: Fern Hollow
    description: A sheltered hollow carpeted in soft ferns. The canopy is thick here, muffling all sound to a gentle hush.
      It feels safe, a place to catch your breath before pressing on.
    exits:
      n: berry_thicket
      s: mushroom_grove
  berry_thicket:
    image: d398d781de1456cf29bf3381e6f3d180d8c2d24dc13f7f140258a147dfb2be69.jpg
    title: Berry Thicket
    description: Thorny bushes heavy with dark berries crowd the trail. Claw marks score the bark of nearby trees, and tufts
      of russet fur cling to the lowest branches. Something guards this patch jealously.
    exits:
      n: fallen_log_bridge
      s: fern_hollow
  fallen_log_bridge:
    image: 9556e5620830da8cd565a9e509dd32a87f67a434ed901eb800a54c08f3d4baf9.jpg
    title: Fallen Log Bridge
    description: A massive fallen tree spans a narrow ravine. Its bark is worn smooth by the passage of many feet, and ferns
      sprout from cracks along its length. The drop below is not far, but the rocks look unfriendly.
    exits:
      n: sunlit_glade
      s: berry_thicket
  sunlit_glade:
    image: 2f933542b72d1a895a6ff94b19c3d291242e2fe3dc5dc4e7d7ce2d4c062a4ed3.jpg
    title: Sunlit Glade
    description: A beautiful glade where the canopy parts to let in a column of golden light. Wildflowers bloom in every
      color, and butterflies spiral upward in the warmth. The forest feels alive and listening.
    exits:
      n: deer_meadow
      s: fallen_log_bridge
  deer_meadow:
    image: 1e48e2fd8e2d77f5a50a06d9fedab11792fa16275e4806db545b62e4178a29cb.jpg
    title: Deer Meadow
    description: A broad meadow of tall grass and clover. Hoof prints pattern the soft earth, and the forest thickens to the
      north. A rocky trail leads east between moss-covered boulders.
    exits:
      n: ancient_oak
      s: sunlit_glade
      e: rocky_outcrop
  ancient_oak:
    image: 6718466887d68fa4ba106e10a9021862e258f76dee5c9d418cdee97b9e54d58d.jpg
    title: Ancient Oak
    description: An enormous oak dominates the clearing, its trunk wider than three people standing arm to arm. Thick roots
      ripple across the ground like frozen waves, and a fraying rope ladder dangles from a high branch. A passage leads
      north through tangled vines.
    exits:
      n: vine_curtain
      s: deer_meadow
      u: rope_ladder
  vine_curtain:
    image: 133836dd32b5abc6084e194d139170a0e3a78e0d2128f41f410ccc2ecfac277f.jpg
    title: Vine Curtain
    description: Dense curtains of hanging vines obscure the path ahead. Pale webs glitter between the strands, and
      something skitters just out of sight. The air is cooler here, with a faint mineral tang.
    exits:
      n: crystal_spring
      s: ancient_oak
  crystal_spring:
    image: fb4880efdbd79d89aca8535add31ee4d3b6e976347a65a86da50de5b696da602.jpg
    title: Crystal Spring
    description: An underground spring wells up into a shallow pool of impossibly clear water. Pale crystals jut from the
      rocks at its edge, catching the dim light and throwing tiny rainbows across the moss. A particularly sharp shard
      lies loose on the bank.
    exits:
      n: guardian_grove
      s: vine_curtain
  guardian_grove:
    image: d137e4ac953c9be22586e0706be83fe503e18a87661e327a7afa4c787f486d08.jpg
    title: Guardian Grove
    description: A solemn ring of silver-barked trees surrounds a mossy mound. The air here feels heavy with old purpose,
      and the branches interlock overhead like clasped hands. An ancient figure stands motionless at the center,
      watching.
    exits:
      n: forest_gate
      s: crystal_spring
  forest_gate:
    image: 6538b22333f403841c5312d6905e14cdbcc82fa804fe5ee4de3b3bc7ed30f815.jpg
    title: Forest Gate
    description: A natural archway of intertwined branches frames the path ahead. Beyond it, the forest gives way to open
      sky and the faint smell of worked stone. You sense that passing through means leaving the forest's shelter behind.
    exits:
      n: ambon_hub:hall_of_portals
      s: guardian_grove
  lily_pond:
    image: 015146bcf1e70c402833a4a45a070ac65bdb5ed00fa80af0533597e11830fd8e.jpg
    title: Lily Pond
    description: A tranquil pond dotted with white lily pads. Fish dart beneath the surface in flashes of silver, and a
      bullfrog watches you from a mossy rock.
    exits:
      w: stream_crossing
      e: pond_island
  pond_island:
    image: 9da588d41ca52152e40c356e775f45dba40294e0896ad6360d10c306f9d1f649.jpg
    title: Pond Island
    description: A miniature island barely large enough to stand on. Reeds ring its edge, and the water laps gently at your
      feet. A smooth stone sits on the highest point, placed there with obvious care.
    exits:
      w: lily_pond
      s: muddy_bank
  muddy_bank:
    image: a758a6eb29588497cdd78e2fe09f62981a30678a8a9ef429d88c1166b12cca9f.jpg
    title: Muddy Bank
    description: The pond's southern bank is churned to thick mud. Shell fragments and small bones litter the ground, and
      something heavy has dragged itself back and forth between the water and a hollow log.
    exits:
      n: pond_island
  burrow_entrance:
    image: 2fb4fcb4097c0ba8d75f7a09ab6fceea857fd93cdbdd5e146794ea9552a8d692.jpg
    title: Burrow Entrance
    description: A large burrow mouth gapes at the base of a mossy hillock. Scratched earth and scattered tufts of fur mark
      it as well-used. The opening is just wide enough to squeeze through.
    exits:
      w: mushroom_grove
      d: rabbit_warren
  rabbit_warren:
    image: 377bf957009b592cb0e25cf69b4c487abeb7f15a03ec3d40e2ef8888d4e64f64.jpg
    title: Rabbit Warren
    description: A low, earthy chamber lined with packed dirt and dry grass. Dozens of smaller tunnels branch off in every
      direction, and the air is warm with the scent of fur and fresh-turned soil.
    exits:
      u: burrow_entrance
      d: burrow_stash
  burrow_stash:
    image: 095eb2959a84b116495f691d973945787f3532bda1a5594cfb1668aaa2932a70.jpg
    title: Burrow Stash
    description: A dead-end chamber at the deepest point of the warren. Bones, shiny pebbles, and bits of cloth have been
      dragged here and arranged in a rough nest. Something has been hoarding treasures.
    exits:
      u: rabbit_warren
  rope_ladder:
    image: 053f89dc2c94341b6103a9048202ecf3f11f5ba52b0e524f3bd573d485d5d5bd.jpg
    title: Rope Ladder
    description: You cling to a fraying rope ladder that sways with every movement. The ground falls away below, and the
      oak's branches creak in the wind. A wooden platform is visible above.
    exits:
      d: ancient_oak
      u: treehouse_platform
  treehouse_platform:
    image: ed90cd35051cd95a04881504392794306618633d3134252105b5ed2b9f4db7fb.jpg
    title: Treehouse Platform
    description: A weathered platform built into the oak's crown. Warped planks and rusted nails speak of someone's
      long-abandoned project. A carved bowl sits in the corner, and a ladder continues upward.
    exits:
      d: rope_ladder
      u: lookout_perch
  lookout_perch:
    image: 223b4c7c17c070b1388451e24c14fddafc1e65d849428132cbf8d44e523e7a3b.jpg
    title: Lookout Perch
    description: The highest point in the forest. From here you can see the canopy stretching in every direction like a
      green ocean, broken only by a distant stone archway to the north. The wind carries the sound of birdsong and,
      faintly, running water.
    exits:
      d: treehouse_platform
  rocky_outcrop:
    image: f237670f6bec92b19b5a07ce671db49ec926e3f8fdf1e147531bea166a793355.jpg
    title: Rocky Outcrop
    description: Jagged boulders jut from the hillside, scored with deep claw marks. Tufts of grey fur cling to the rough
      stone, and a low growl echoes from somewhere ahead.
    exits:
      w: deer_meadow
      e: wolf_den
  wolf_den:
    image: 64f209bc67d1bd25009f8a11a2bc641b4896712b6f03d816701bb5fe30b44d35.jpg
    title: Wolf Den
    description: A shallow cave beneath an overhang of rock and twisted roots. Bones are scattered across the floor, and the
      smell of musk hangs heavy in the still air. Yellow eyes watch you from the shadows.
    exits:
      w: rocky_outcrop
      e: den_stash
  den_stash:
    image: 2cd0093f6d27e77a8236931af923ecd183975d0d9b593bd99dc3bad45138d8cd.jpg
    title: Den Stash
    description: The deepest recess of the wolf's den. Trinkets and torn cloth lie tangled among old bones. Something useful
      has been dragged here and half-buried beneath a pile of leaves.
    exits:
      w: wolf_den
  training_grounds:
    title: The Training Grounds
    description: A paved courtyard ringed by scarred stone pillars. Weapon racks hold blunted swords and heavy tower
      shields, and deep gouges mark the flagstones from years of drills. A straw dummy lists sideways, battered beyond
      recognition. This is where Bulwarks first learn to stand their ground — to absorb punishment and hold the line
      with Shield Bash, forcing enemies to focus their fury on an unyielding wall of steel. A stone ramp descends to the
      clearing below.
    exits:
      d: awakening_clearing
  wild_den:
    title: The Wild Den
    description: A rough-hewn cave mouth choked with brambles and the musk of predators. Claw marks score the walls, and
      tufts of fur cling to the jagged stone. Bones crunch underfoot. This is where Wardens awaken their primal rage —
      learning Rending Strike to tear into foes with savage fury, opening wounds that bleed long after the initial blow.
      A narrow trail descends through the undergrowth to the clearing below.
    exits:
      d: awakening_clearing
  arcane_tower:
    title: The Arcane Tower
    description: A circular chamber at the top of a crumbling spire, its walls etched with softly pulsing runes. A
      leather-bound tome floats at chest height, pages turning on their own. The air crackles with the sharp tang of
      ozone. This is where Arcanists first channel raw magical energy — shaping it into Arcane Bolt, a focused lance of
      crackling force hurled at a single target. A spiral staircase descends to the clearing below.
    exits:
      d: awakening_clearing
  grove_heart:
    title: The Grove Heart
    description: A living chamber woven from the intertwined branches of ancient willows. Bioluminescent flowers cast a soft
      green glow, and the air hums with the whisper of growing things. Roots pulse faintly underfoot like a slow
      heartbeat. This is where Faeweavers first commune with nature — learning Thornlash, calling forth barbed vines
      that lash out with the forest's quiet fury. A root-carved passage descends to the clearing below.
    exits:
      d: awakening_clearing
  clockwork_crypt:
    title: The Clockwork Crypt
    description: A vaulted chamber where tarnished gears mesh with ancient bone. Brass automatons stand in alcoves, their
      joints crusted with verdigris, and a faint ticking echoes from deep within the walls. The air is cold and carries
      the sweet-rot scent of embalming herbs. This is where Necromancers first touch the boundary between life and death
      — learning Soul Bolt, ripping a fragment of spectral energy from the void and hurling it at the living. A corroded
      ladder descends to the clearing below.
    exits:
      d: awakening_clearing
  shadow_alcove:
    title: The Shadow Alcove
    description: A cramped space tucked beneath the roots of a massive oak, so dark that the walls seem to breathe. Coils of
      wire, lockpicks, and a battered satchel hang from hidden pegs. A rough map has been scratched into the dirt floor.
      This is where Veils first learn to strike from darkness — Shadow Strike, a sudden blade from nowhere that deals
      devastating damage before the target knows you are there. A concealed passage slopes down to the clearing below.
    exits:
      d: awakening_clearing
  seal_chamber:
    title: The Seal Chamber
    description: A stark stone room inscribed with overlapping circles and angular wards. Chains of cold iron hang from the
      ceiling, and the air feels thick — as if magic itself is being suppressed. Faint sigils pulse with a dull amber
      glow wherever you step. This is where Binders first learn their trade — Binding Strike, an attack that disrupts
      magical flow and begins to unravel an enemy's defenses. A heavy iron door opens to stairs descending to the
      clearing below.
    exits:
      d: awakening_clearing
  storm_spire:
    title: The Storm Spire
    description: An exposed platform atop a jagged rock pinnacle, buffeted by winds that carry the sharp smell of lightning.
      Scorch marks blacken the stone, and a copper rod juts skyward, crackling with static. The clouds churn overhead in
      a perpetual storm. This is where Stormblades first channel the tempest — Spark Strike sends a jolt of lightning
      through blade and target alike, leaving the air singing with electricity. A wind-worn staircase descends to the
      clearing below.
    exits:
      d: awakening_clearing
  radiant_chapel:
    title: The Radiant Chapel
    description: A modest chapel where warm candlelight throws long shadows across whitewashed walls. A low altar bears
      offerings of dried wildflowers and smooth river pebbles, and the silence carries a profound peace. Golden motes
      drift in the still air like tiny prayers. This is where Heralds first feel the call — Holy Strike channels divine
      wrath into a single blow while mending the Herald's own wounds, a reminder that to heal and to fight are one
      purpose. A sunlit doorway opens to stairs descending to the clearing below.
    exits:
      d: awakening_clearing
  observatory:
    title: The Observatory
    description: A domed chamber open to the sky, its walls inlaid with star charts in silver and lapis. An orrery of
      crystal spheres orbits slowly at the room's center, casting constellations across every surface. The air feels
      thin and vast, as if the cosmos itself is leaning in to listen. This is where Starweavers first touch the fabric
      of space — Starfire draws down a searing bolt of stellar energy, a tiny piece of a distant sun given lethal
      purpose. A moonlit staircase descends to the clearing below.
    exits:
      d: awakening_clearing
    image: 1ea59f9c1c6169970b9e2662b5b4337e54a23c196e9a94089130e3ea4351fa71.png
