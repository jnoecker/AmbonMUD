  elder_dragon_auranthos:
    name: Elder Dragon Auranthos
    room: celestial_throne
    tier: boss
    level: 10
    respawnSeconds: 1800
    xpReward: 500
    goldMin: 200
    goldMax: 400
    behavior:
      template: aggro_guard
    drops:
      - itemId: dragonfire_blade
        chance: 0.4
      - itemId: dragonscale_aegis
        chance: 0.35
    dialogue:
      root:
        text: "The throne room fills with heat and light. A dragon of ancient gold unfolds from the far dais — Auranthos, whose
          name appears on the oldest maps and in the oldest warnings. Its voice is not sound but pressure: felt in the
          chest, understood without hearing. 'I have waited. The wards weaken. The seals scatter. And now the last
          challengers come. Are you here to replace me — or to end what I guard?'"
        choices:
          - text: We've come to end the threat.
            next: threat_info
          - text: What are you guarding?
            next: guardian_info
          - text: We fight.
            next: defiance
      threat_info:
        text: "'The threat? I AM the threat — or the answer to one. The old order sealed this peak because what sleeps beneath
          it must never wake. I was placed here as the final ward. Kill me and the last seal breaks. But perhaps that is
          what must happen. Perhaps the age of wards is over and the age of heroes must begin. Come. Prove you are
          worthy of what follows.'"
        choices:
          - text: Then we fight.
            next: farewell
          - text: We're not ready.
            next: farewell
      guardian_info:
        text: "'Beneath this mountain, in a place deeper than any mine or barrow, something old dreams. The order built their
          wards, placed their seals, and stationed me here as the last line. A thousand years I've waited. I'm tired. If
          you can defeat me, perhaps you can face what comes next. If not — well. Better to know now.'"
        choices:
          - text: We accept the challenge.
            next: farewell
          - text: We need more time.
            next: farewell
      defiance:
        text: "'Direct. I respect that. Very well.'"
        choices:
          - text: Now.
            next: farewell
      farewell:
        text: The temperature in the room doubles. The dragon rises.
    image: 15bc3d9373ad0b47c613fcb387090756ff2f22009b7284fed4b2fa09cd5183d6.png
  sage_meridia:
    name: Sage Meridia
    room: ancient_observatory
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - celestial_reckoning_final
    dialogue:
      root:
        text: You've made it this far. I'm Meridia — the last of the Scholars' Guild field researchers still working the
          Celestial Peak project. Everything our colleagues have gathered — the seal from the fortress, the ward from
          the frost caverns, the idol from the fen — it all points here. The Elder Dragon Auranthos sits at the peak's
          throne. It's the final ward. To understand what the old order was protecting, we need to get past it. Can you
          do this?
        choices:
          - text: I'll face the dragon.
            next: quest_accept
          - text: Tell me about the old order.
            next: order_info
          - text: Goodbye.
            next: farewell
      order_info:
        text: A civilisation that predates Thornhaven by a thousand years. They built the temples, carved the seals, placed the
          wards. They understood something about this peak — something they considered worth their entire civilisation's
          effort to contain. Then they vanished. All that remains are their protections. And those are failing.
        choices:
          - text: I'll face the dragon.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Thank you. The throne room is at the very top — past the sanctum, past the guardians. Auranthos has been there for
          a thousand years. It won't go quietly. But this is the culmination of everything — the reckoning the old order
          knew would come.
        choices:
          - text: I'll return when it's done.
            next: farewell
      farewell:
        text: May the stars remember your name.
    image: c71727b5eeda376aa994d9182c666044e5424e6498b7452ed491cf0ff3cac2df.png
quests:
  celestial_reckoning_final:
    name: The Celestial Reckoning — The Dragon
    description: Sage Meridia has pieced together the old order's warnings. The Elder Dragon Auranthos atop the Celestial
      Peak is the final ward — and it must be confronted. Defeat Auranthos to complete the Celestial Reckoning.
    giver: sage_meridia
    objectives:
      - type: kill
        targetKey: elder_dragon_auranthos
        count: 1
        description: Defeat Elder Dragon Auranthos
    rewards:
      xp: 3000
      gold: 200
rooms:
  mountain_passage:
    title: Celestial Peak — Mountain Passage
    description: The ice passage from the Frost Caverns opens into a broader tunnel that climbs steeply through the
      mountain's interior. The ward-glyphs carved into the walls grow more frequent and more complex. The air is thin
      and cold but carries a strange charge — like the moment before lightning. The frost caverns are back to the south.
    exits:
      s: frost_caverns:ice_passage
      n: ascending_trail
    image: 4dc159de662c1ed13637419d735179c94f8e23664c3c31a12434cbf23128729f.jpg
  ascending_trail:
    title: Ascending Trail
    description: A steep, switchbacking trail that climbs the mountain's interior through natural chimney formations.
      Celestial wisps drift through the space, their light casting shifting shadows. The rock here is different —
      streaked with veins of pale crystal that pulse faintly. The passage is back south; the trail continues up to the
      north.
    exits:
      s: mountain_passage
      n: wind_swept_ridge
    image: 3e0cc12947ff4cef386389ce7b38c8cb1f246804ab251eb1c51d02e2699eab6d.jpg
  wind_swept_ridge:
    title: Wind-Swept Ridge
    description: "The trail emerges briefly onto an exposed ridge where the wind hits with stunning force. The view is
      extraordinary: the entire known world spreads below — Thornhaven a cluster of lights to the south, the Barrens a
      brown smear to the north, the sea a grey line to the west. Ahead, the peak itself rises into cloud. The trail
      continues north; an ancient observatory is visible to the east."
    exits:
      s: ascending_trail
      n: ward_gate
      e: ancient_observatory
    image: ffc7e2b26007bbe774eb3c07494e8d166ff02cfb931df18e687abb924c99956c.jpg
  ancient_observatory:
    title: Ancient Observatory
    description: A ruined structure of carved stone and crystal lenses, clinging to the mountainside. The old order built
      this to watch the stars — and perhaps to watch what they had sealed below. Sage Meridia has established a research
      camp in the shelter of the remaining walls. Her notes and instruments cover every surface. The ridge is back to
      the west.
    exits:
      w: wind_swept_ridge
    image: f9b26cd0f73055f4f2db3eb6789c300568b84f0577dc6c7f2e7eb878c9254c70.jpg
  ward_gate:
    title: Ward Gate
    description: A massive stone gateway built directly into the mountain, its surface covered entirely in ward-glyphs that
      glow with steady blue-white light. The old order's craftsmanship is extraordinary — the gate has stood for a
      millennium and the enchantments still hold. Beyond it, the celestial approach ascends toward the peak. The ridge
      is back south.
    exits:
      s: wind_swept_ridge
      n: celestial_approach
    image: d1ebce228954f08c83e90aa6bbc2dea0edabfe88d5803c2c79935aaf2bb57010.jpg
  celestial_approach:
    title: Celestial Approach
    description: A long, straight passage cut through solid rock with mathematical precision. The walls are perfectly smooth
      and the floor is level despite the mountain's angle. Crystal formations grow from the ceiling, providing a
      constant pale illumination. A crystal spire is visible through an opening to the east. The ward gate is back
      south; the path continues north.
    exits:
      s: ward_gate
      n: elder_shrine
      e: crystal_spire
    image: fd0aadcc9342ea3849806ee2f238434cf3766de6e92428960674bc82e9518ebc.jpg
  crystal_spire:
    title: Crystal Spire
    description: A natural formation of enormous crystal pillars that pierce through the mountain from some unimaginable
      depth. The largest is wider than a house and hums at a frequency that vibrates in your bones. The crystals are
      warm to the touch and glow from within. Whatever power the old order was containing, this is its surface
      expression. The approach is back to the west.
    exits:
      w: celestial_approach
    image: 70a543865897791b44f57f5cf71d3ee460112458fef06a03da639061cca9c112.jpg
  elder_shrine:
    title: Elder Shrine
    description: "A devotional space carved by the old order at the mountain's heart. The shrine is simple — a stone altar
      bearing the geometric star-pattern found on every seal and ward in Auringold. The inscription reads: 'We who watch.
      We who ward. We who will not be forgotten.' The words glow faintly. The approach is south; the celestial bridge
      lies north."
    exits:
      s: celestial_approach
      n: celestial_bridge
    image: 9fbbdab35b8d87b15da496a5c474a1f1b1671df1494133f6df27d8c6ab734cd5.jpg
  celestial_bridge:
    title: Celestial Bridge
    description: A narrow bridge of carved stone spanning a chasm of extraordinary depth. Far below, something glows — a
      vast, slow pulse of light from the mountain's core. The bridge has no railings and the wind is fierce. On the far
      side, a storm platform crackles with elemental energy. The shrine is back south.
    exits:
      s: elder_shrine
      n: storm_platform
    image: 31f12fa439fb2cc5fc7c56714e7e409d70ed9a3273cdd051c2e9a5858cb3fe0d.jpg
  storm_platform:
    title: Storm Platform
    description: A broad, exposed platform where the mountain meets the sky. Storm elementals coalesce from the charged
      atmosphere, their forms flickering between lightning and solid matter. The platform serves as a natural barrier —
      anything that reaches the peak entrance beyond must first survive this gauntlet. The bridge is back south; the
      entrance lies north.
    exits:
      s: celestial_bridge
      n: peak_entrance
    image: cbefd088649a38ece53d3dd0964ae2625783ecea2e931498bfb41885516cf4d9.jpg
  peak_entrance:
    title: Peak Entrance
    description: "The final threshold. A doorway cut from a single block of star-crystal, its surface inscribed with a
      warning in the old order's script: 'Beyond this point the ward holds. Do not enter unless you are prepared to
      inherit what we could not destroy.' The doorway leads north into the inner peak. The storm platform is back
      south."
    exits:
      s: storm_platform
      n: sanctum_antechamber
    image: ff1e5be9224b3a18aa11c8a0507227fc1475e117657fba0663889386414de16b.jpg
  sanctum_antechamber:
    title: Sanctum Antechamber
    description: A high-vaulted chamber where celestial guardians patrol in slow, deliberate circuits. The walls are covered
      in murals depicting the old order's history — their rise, their discovery of the threat beneath the mountain,
      their decision to seal it, and their eventual disappearance. The final panel is blank. The peak entrance is south;
      the sanctum lies north.
    exits:
      s: peak_entrance
      n: celestial_sanctum
    image: c386f254ecb6bfd108b9ae69fd44da9de60699cf89758110234828d770e60aff.jpg
  celestial_sanctum:
    title: Celestial Sanctum
    description: "The inner sanctum of the Celestial Peak: a perfectly circular chamber with a domed ceiling of star-crystal
      that shows the sky above — day or night, clear or clouded, the stars are always visible here. Star wardens stand
      eternal guard. The chamber hums with contained power. The antechamber is south; the dragon's approach lies above."
    exits:
      s: sanctum_antechamber
      u: dragon_approach
    image: 9ea1207128a85d8d85959b41d18d91afe67c41f7f9be8a9213a987b865fa9110.jpg
  dragon_approach:
    title: Dragon's Approach
    description: "A final ascending passage that opens onto the mountain's true summit — an enclosed throne room carved from
      the peak itself. The air is furnace-hot despite the altitude. Light pours from above: golden, fierce, alive. The
      sound of breathing fills the space — vast, slow, ancient breathing. The sanctum is below."
    exits:
      d: celestial_sanctum
      n: celestial_throne
    image: 9ee8b32f095d0133fcc30a97606bc4decc1a7f298232a63ba37f42de72eae0b6.jpg
  celestial_throne:
    title: Celestial Throne
    description: The summit of the Celestial Peak, enclosed in a dome of star-crystal that frames the sky in every
      direction. At the center, on a dais of gold-veined stone, rests Elder Dragon Auranthos — an ancient being of
      golden scales and cosmic fire, coiled around the mountain's apex like a living crown. The dragon's eyes are open.
      It has been waiting.
    exits:
      s: dragon_approach
      n: celestial_apex
    image: 49874c9d8f93bf19994ccdec30fbeb0ec20fb329b248fb9a8c3c1fa2cc42a95a.jpg
  celestial_apex:
    title: Celestial Apex
    description: "Beyond the throne, a small chamber opens at the absolute summit of the peak. The dome is open here — true
      sky above, wind and stars and the vast sweep of Auringold below. A final inscription is carved into the floor: 'The
      ward is broken. The reckoning begins. What sleeps beneath will wake. May those who come after us be stronger than
      we were.' The view from the apex encompasses the entire world of Auringold — every zone, every road, every forest
      and sea visible from this single, extraordinary vantage point. The throne room is back to the south."
    exits:
      s: celestial_throne
    image: 6d5b23b4a90846247f88a170669aa5f4b0ec032ac3a76d2153ca0b6b2ceb4e62.jpg
graphical: true
