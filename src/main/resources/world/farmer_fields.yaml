items:
  slime_residue:
    displayName: a lump of slime residue
    keyword: slime
    description: A glutinous, faintly luminous blob left behind after slaying a giant slime. Alchemists find uses for it.
    basePrice: 8
    image: 87b0b0baa83a2c84f07e23c04fc5530afcd7261b2a8ac312faf8febe220b479b.png
  sprite_dust:
    displayName: a pinch of sprite dust
    keyword: dust
    description: Fine iridescent powder that sparkles in sunlight. A byproduct of harvest sprites.
    basePrice: 15
    image: b603e549a11718cb0fb7d75feda2402e3f7b49f325d26aa94e5a8d38cc0b572a.png
  rusty_farm_tool:
    displayName: a rusty farm tool
    keyword: tool
    description: A corroded billhook propped in the corner. Not worth much, but someone might buy it for scrap.
    basePrice: 3
    image: 8518d19ced038ead485f06fff838f49b65ef5abfa267f039e5f7c0f242f4f486.png
  healing_herbs:
    displayName: a bundle of healing herbs
    keyword: herbs
    description: "A tied bundle of dried meadow herbs: yarrow, clover, and something with a sharp smell. Any herbalist could
      make something of these."
    basePrice: 15
    image: c557d9c175900db1f174caea654a4997148ddb65896141c973be3c98056b4784.png
mobs:
  field_crow:
    name: a field crow
    room: harvest_fields
    tier: weak
    level: 1
    respawnSeconds: 60
    xpReward: 5
    image: 4b3b5ce444935558f394b8c061a23dfa5998523ca39e4a503e9edba219ea20ad.png
  giant_slime:
    name: a giant slime
    room: south_meadow
    tier: standard
    level: 2
    respawnSeconds: 90
    xpReward: 12
    drops:
      - itemId: slime_residue
        chance: 0.7
    image: e2d51ba19072c8c48009fdfe8491d3b4fb2682545e9839ece299302071ec628d.png
  barn_rat:
    name: a barn rat
    room: eastern_paddock
    tier: weak
    level: 1
    respawnSeconds: 60
    xpReward: 5
    image: 005dfb861c7325e4d635f03430646be23eb9a8bdec2c6dd0d358119bdc9889fb.png
  harvest_sprite:
    name: a harvest sprite
    room: harvest_fields
    tier: standard
    level: 2
    respawnSeconds: 300
    xpReward: 15
    drops:
      - itemId: sprite_dust
        chance: 0.4
    image: e00f6d11a518998e30337ebd364dfcf48da5be3ad380cb5943f3159373f9787d.png
  farmer_aldous:
    name: Farmer Aldous
    room: aldous_farm
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - slime_infestation
    dialogue:
      root:
        text: Hoy there! Good to see a capable-looking traveller. Those blasted slimes have been multiplying in the south meadow
          — they ruin the crops and stink something awful. Can you help?
        choices:
          - text: I'll deal with the slimes.
            next: quest_accept
          - text: Tell me about this place.
            next: about_fields
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Thank the stars. Kill enough of them in the south meadow and the rest should clear out. I'll have something for
          you when it's done.
        choices:
          - text: I'll see to it.
            next: farewell
      about_fields:
        text: This is the Farmer Fields — the breadbasket of Thornhaven. Families have worked this land for generations. The
          city's just north through the trade row gate. South of here the fields give way to the coastal cliffs
          eventually.
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Good luck out there. Watch your boots in the slime patches.
    image: 572406c9cb4e4ae2e53ede4f0003a37d96523ddfb85107151cdfbb373ca39b62.png
  goodwife_petha:
    name: Goodwife Petha
    room: barn
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - missing_chickens
    dialogue:
      root:
        text: Oh dear, you startled me! I've been worried sick — the chickens keep disappearing and I found rat holes all along
          the paddock fence. Would you be a dear and deal with those rats?
        choices:
          - text: I'll clear out the rats.
            next: quest_accept
          - text: What's in the chest there?
            next: about_chest
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Bless you! Three or four should be enough to sort the problem. The paddock's just south of the barn — that's where
          they're worst.
        choices:
          - text: I'll take care of it.
            next: farewell
      about_chest:
        text: That old thing? Just some odds and ends left by the last farmhand. Help yourself if there's anything useful in
          there.
        choices:
          - text: I'll deal with the rats.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      farewell:
        text: Thank you, dear. Mind you don't step in anything.
    image: 6b4f6a6a428c5e9638bd668983c47620dd1ffda73d9486996cf799c9f391fe6d.png
quests:
  slime_infestation:
    name: The Slime Infestation
    description: Farmer Aldous needs you to clear the giant slimes that have overrun the south meadow and are ruining the crops.
    giver: farmer_aldous
    objectives:
      - type: kill
        targetKey: giant_slime
        count: 5
        description: Kill 5 giant slimes in the south meadow
    rewards:
      xp: 300
      gold: 15
  missing_chickens:
    name: The Missing Chickens
    description: Goodwife Petha suspects barn rats are responsible for her missing chickens. Deal with the rats in the
      eastern paddock.
    giver: goodwife_petha
    objectives:
      - type: kill
        targetKey: barn_rat
        count: 4
        description: Kill 4 barn rats in the eastern paddock
    rewards:
      xp: 200
      gold: 10
rooms:
  north_fields:
    title: Farmer Fields — North Approach
    description: The trade row gate of Thornhaven stands behind you to the north, and a well-worn cart track leads south
      through open farmland. The sky here is wide and blue, the air smells of soil and distant sea, and the sounds of
      the city fade quickly. Harvest fields stretch to the east; the farmhouse track leads south.
    exits:
      n: thornhaven_city:trade_row
      s: farmhouse_path
      e: harvest_fields
    image: 6e7c070a607fe1fc4db4bd1671637319bc2d8902bf0aefc78ffa5c9961dbaa48.jpg
  harvest_fields:
    title: Harvest Fields
    description: Long furrows of crops stretch in orderly rows under the open sky. Field crows strut between the rows
      picking at whatever takes their fancy, ignoring your presence entirely. Harvest sprites dart at the field margins,
      trailing glints of light. The north approach is back to the west.
    exits:
      w: north_fields
    image: 29da923bec05bbeeb152dfb9ae2b24c2bc39fcc0d825bb08d1e0ed845fc6e643.jpg
  farmhouse_path:
    title: Farmhouse Path
    description: A cart track between old stone walls that connects the fields to the farmhouse compound. The smell of wood
      smoke and cooked food drifts from the farmhouse to the east. A barn with a sagging roof stands to the west.
    exits:
      n: north_fields
      e: aldous_farm
      w: barn
    image: d21051cac97f83d5afef21afc5f044b3da485ebd50bbeb2293b6238a45810e10.jpg
  aldous_farm:
    title: Aldous Farm — Yard
    description: A packed-earth yard before a solid farmhouse of dressed stone. Chickens peck around a water trough. Farmer
      Aldous can usually be found here, keeping an eye on the south meadow from the yard gate. The farmhouse path leads
      west; the well is to the south.
    exits:
      w: farmhouse_path
      s: farmstead_well
    image: 712beed71192f7abc6db9c51d73c97f4fd03fded811b621eb1161344a8145ae0.jpg
  farmstead_well:
    title: Farmstead Well
    description: A stone well with a wooden cover, standing in the middle of the farm's central yard. The water is cold and
      clean. From here you can see the south meadow spreading away to the east, dotted with suspicious glinting patches
      where the slimes have been.
    exits:
      n: aldous_farm
      e: south_meadow
    image: 21f6240a344056ff4410baf7b55b0e761f5c582d6aa5139bdb38d7a159ad3bca.jpg
  south_meadow:
    title: South Meadow
    description: A broad field that used to grow barley before something started disturbing the soil. Giant slimes have
      colonized the wetter patches, leaving trails of shimmering residue. The smell is unpleasant. The well is back to
      the west; the field road leads further south; fallow ground lies to the north.
    exits:
      w: farmstead_well
      s: field_road_south
      n: fallow_ground
    image: 95b329097510691169c078f9d59e668d4a5c5269b1fa471fd1f646371bf70bb3.jpg
  fallow_ground:
    title: Fallow Ground
    description: "A section of field left to rest for the season: rough grass, self-seeded weeds, and a few crows
      investigating the disturbed earth. The barn is to the west and the south meadow lies below to the south."
    exits:
      s: south_meadow
      w: barn
    image: aa60ef3fa8b29a3288a962cea92cfcf5cfda1e61beb6cec2e63364d9e40e1baf.jpg
  barn:
    title: The Old Barn
    description: A high-roofed barn that has seen better decades. Straw and old farm equipment litter the floor. Goodwife
      Petha tends to the animals here most mornings. The farmhouse path is to the east; the eastern paddock where the
      rats are worst is through the back door to the south.
    features:
      old_farm_chest:
        type: CONTAINER
        displayName: an old farm chest
        keyword: chest
        initialState: closed
        resetWithZone: true
        items:
          - rusty_farm_tool
          - healing_herbs
    exits:
      e: farmhouse_path
      s: eastern_paddock
    image: eee461ca7a7a016803441f2b7df29ec1c58508a2e4c98ea65dc01e286a9f9fdb.jpg
  eastern_paddock:
    title: Eastern Paddock
    description: A fenced enclosure behind the barn where livestock are kept. Rat holes pepper the fence line, and the
      animals have been skittish lately. Barn rats scurry between the fence posts and under the troughs. The barn is
      back to the north.
    exits:
      n: barn
    image: 178d5e9565ec3ffa6f495eced7deca7384c5d48883091db6beeec208f411ba6b.jpg
  field_road_south:
    title: Field Road — South End
    description: The cart track narrows here as the farmland gives way to rougher scrub. The smell of salt is faint but
      unmistakable on the southern breeze, and the distant sound of waves carries on the wind. The Sea Cliffs are a
      short walk further south. The south meadow is back to the north.
    exits:
      n: south_meadow
      s: sea_cliffs:cliff_road
    image: 38664e1a40dcbccfbb7a78ac645203efa5595098711492ca56b981691ad13137.jpg
graphical: true
