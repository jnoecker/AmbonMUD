      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: kelp
        chance: 1
items:
  starlight_sword:
    displayName: Starlight Sword
    description: A slender, elegant blade forged from pale silver metal that seems to drink in darkness and radiate a soft,
      cold luminescence, its fuller etched with tiny constellation patterns that shimmer and shift like a living star
      map. The crossguard is wrought in the shape of sweeping crescent moons, and the hilt is wrapped in deep
      midnight-blue leather threaded with fine filaments of glowing white that pulse faintly, as though the sword
      breathes.
    keyword: starlight sword
    slot: weapon
    level: 1
    tier: rare
    archetype: damage
    basePrice: 25
    itemType: equipment
    image: 38be7089bf59f45619ee1a7c269c8676cfb921e3dd6ea5b09e10448db6ed193e.png
