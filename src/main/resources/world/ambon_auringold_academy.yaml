    displayName: Auringold Academy Robes
    description: Flowing robes of midnight blue cascade to the floor, their fabric alive with slowly shifting
      constellations, distant nebulae, and spiraling galaxies that shimmer with an inner celestial light, as though the
      wearer is draped in a living piece of the cosmos itself.
