  starlight_sceptre:
    displayName: Starlight Sceptre
    description: A slender ceremonial staff of deep midnight-blue metal, its shaft etched with delicate constellation
      patterns that shimmer with faint silver light, crowned by a polished orb of pale crystal that pulses softly like a
      distant star.
    keyword: starlight sceptre
    slot: weapon
    level: 1
    tier: rare
