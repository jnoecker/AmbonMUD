    description: A fully reptilian dragon-humanoid with a distinct dragon head — scaled snout, frilled or horned crest,
      intelligent golden eyes. Their entire body is covered in iridescent blue-green scales. Clawed hands and feet, a
      long tail. Small draconic wings with translucent fin-like membranes. Wearing a flowing white robe or kimono-like
      garment draped over their scaled body, adorned with seaweed, coral beads, and shell necklaces. They should look
      like an eastern sea dragon who got dressed for a diplomatic meeting — regal, ancient, clearly not mammalian in any
      way. A creature of deep water and open sky.
