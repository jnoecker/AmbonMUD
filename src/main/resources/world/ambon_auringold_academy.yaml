      SECONDARY: 3
      TERTIARY: 2
  starlight_mace:
    displayName: Starlight Mace
    description: A radiant ceremonial mace with a shaft of deep midnight-blue metal etched with constellations that faintly
      glow silver, topped with a heavy flanged head inlaid with a brilliant starburst of white and gold gemstones that
      cast soft prismatic light across nearby surfaces.
    keyword: starlight mace
    slot: weapon
    level: 1
    tier: rare
    basePrice: 20
    itemType: equipment
    archetype: damage
    damage: 4
    stats:
