    description: A mid-sized raptor woven entirely from gnarled, woody bramble vines, its "feathers" formed by overlapping
      thorns and dark serrated leaves that rustle softly when it shifts its weight. Clusters of tiny white blossoms and
      glossy blackberries dot its wings and crest, giving it a deceptively delicate appearance despite its sharp, hooked
      beak of dense, lacquered wood.
    spawns:
      - room: pyrae
      - room: cindaron
    image: e6458250da8a45b42668422f97efd41aea651252d5a3aef79892d02549c8eee8.png
  stone_macaque:
    name: a stone macaque
    tier: elite
    level: 2
    description: A small, dusty grey monkey crouches low with watchful amber eyes, its rough fur the color and texture of
      weathered granite. Chips of pale stone cling to its wiry limbs, and its knuckles are calloused to near-rocklike
      hardness from scrambling across mountain terrain.
    spawns:
      - room: veratheron
      - room: cindaron
    image: abd120a285383d4d117798e3e2e0e8038320b241d73f2bf86b4181875947ea69.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  ice_beaver:
    name: an ice beaver
    tier: weak
    level: 3
    description: A small, pudgy rodent with thick silvery-white fur rimmed with frost, its flat tail glazed with a thin
      sheen of ice that catches the light like polished glass.
    spawns:
      - room: faegrimm
        count: 2
    image: 0c002162fd19726233242ca6912447a3994b10cd94be914de2ef317265cd4802.png
  mischievous_stoat:
    name: a mischievous stoat
    tier: weak
    level: 3
    description: A small, slender-bodied mustelid with sleek chestnut-brown fur and a cream-white belly, its black-tipped
      tail flicking with restless energy as its bright, beady eyes dart about with clever, impish curiosity.
    spawns:
      - room: aineron
      - room: lustriae
    image: 6a284162878511516d4744e15d0eaf0fae6398da4d7bfd84b628b6e731e73074.png
  lustriae_guard_woman:
    name: A Lustriae Guard
    tier: standard
    level: 3
    description: A short, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — pastel hair,
      dark eyes, softly pointed ears. She has rust colored diaphanous wings extending from her back. She is dressed as a
      fairy guard, like the forest itself grew over her to provide clothing, with bark, leaves thorns forming a living
      military uniform.
    spawns:
      - room: aineron
    image: d70ccdc7787279ae760a141cd4389f23e1cd0be302a96291225e21f97bb3f3c1.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
  lustriae_diver_man:
    name: Lustriae Pearl Diver
    tier: standard
    level: 3
    description: A slender, iridescent-skinned fae crouches at the water's edge, her translucent wings folded tight against
      her back, droplets still beading across her pale blue diving suit stitched from woven kelp and silkfish scales.
      She grips a slender obsidian spear tipped with a luminescent pearl, her sharp eyes scanning the depths below with
      practiced intensity.
    spawns:
      - room: faegrimm
    image: 3a3d0af4985f99bf0361a55c97e41b450fbe0f8448a4f45a7aea31c09336d616.png
  pyrae_warrior:
    name: Pyrae Warrior
    tier: standard
    level: 3
    description: A slender humanoid figure draped in woven garments threaded with living vines and luminous amber filaments,
      their ember-warm skin casting a soft ruddy glow across the surrounding leaves. Their hair drifts upward like
      slow-rising flame in shades of copper and gold, and their eyes hold a calm, smoldering light — fingers laced with
      creeping tendrils of enchanted greenery that curl and bloom at their touch.
    spawns:
      - room: pyrae
    image: bc66f9c5fe76d201be468ffc67745cfcba68d32758958a70bf294e58d5bcfa44.png
    toughness: -1
    hpMult: 0.8
    dmgMult: 0.8
    xpMult: 0.8
    goldMult: 0.8
  aetherae_stablemaster_2:
    name: Aetherae Stablemaster
    tier: elite
    level: 4
    description: A figure of churning midnight-blue smoke and shadow fills the heavy ornate cloak that drapes its formless
      body, the fabric richly embroidered in silver and deep cobalt with clasps of tarnished steel catching the light.
      Where a face should be, only dense cerulean fog churns and roils, tendrils of blue-black mist curling from the
      hood's edges and hem like breath in cold air, hinting at immense, inhuman presence within.
    spawns:
      - room: aetherae
    image: 9f2b0058c12d0ff8b26306960d7e45f826fa5a8b2aff0fc350b5609c8ede7b62.png
  doktuk_malukae_copy:
    name: Doktuk Mulkae
    description: A towering, broad-shouldered figure of sun-baked terracotta hide, etched with pale mineral veins that catch
      the light like cracked desert stone, stooped slightly beneath the weight of a massive flat rock clutched to its
      chest like a sacred tome. Its deep-set eyes hold a ponderous, straining intensity beneath a heavy brow ridge
      dusted with fine crystalline sediment.
    spawns:
      - room: desert_sands
    level: 3
    tier: standard
    image: b7b13ccefe3932fb3d60dc8971bbc5a33002d4cf906b40fedee507f183be56d7.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
      - itemId: stone_fragments
        chance: 0.5
  graktuk_malukae_copy:
    name: Graktuk Malukae
    tier: standard
    level: 3
    description: A hulking humanoid of sun-baked terracotta hide and granite-grey undertones, its massive frame hunched with
      slow, brutish power, thick limbs scarred from countless contests of strength. Rough-hewn loincloths of cured
      leather hang from its waist, and its fists are calloused and cracked like ancient stone, ever ready to grapple.
    spawns:
      - room: desert_sands
    image: f4838f8e7e994a2d8155f21e5e49bc849d7f4fd45a8971b423c18d86e2afeadc.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
      - itemId: stone_fragments
        chance: 0.5
  sandy_crab:
    name: a sandy crab
    tier: weak
    level: 1
    description: A small, pale sand-colored crab scuttles sideways across the ground, its shell dusted with fine grit and
      its beady black eyes perched on short, wary stalks.
    spawns:
      - room: tempest_between_worlds
      - room: sandy_shoal
      - room: waterfall
