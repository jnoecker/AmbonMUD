  starlight_dagger:
    displayName: Starlight Dagger
    description: A sleek, crescent-curved blade forged from a pale, luminous metal that seems to hold captured starlight
      within its edge, casting faint silver-blue glimmers across nearby surfaces. The slender hilt is wrapped in dark
      material etched with tiny celestial markings, contrasting beautifully against the dagger's ethereal, moonlit
      sheen.
    keyword: starlight dagger
    slot: weapon
    level: 1
    tier: rare
    archetype: damage
    damage: 4
    stats:
      PRIMARY: 5
      SECONDARY: 3
      TERTIARY: 2
    basePrice: 20
    itemType: equipment
    image: 57113e3b810163736b9e9e5a3bfc0bc4da3bd4d8fd5d37895ac0a03213159861.png
  starlight_crook:
    displayName: Starlight Shepherd's Hook
    description: A gracefully curved shepherd's crook wound with living emerald vines and soft silver-veined leaves that
      shimmer faintly, as though touched by moonlight, with tiny star-shaped blossoms blooming along its length and a
      pale, luminous glow emanating from the polished heartwood beneath.
    keyword: starlight crook
    slot: weapon
    level: 1
    tier: rare
    archetype: damage
    damage: 4
    stats:
      PRIMARY: 5
