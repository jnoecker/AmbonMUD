zone: ambon_auringold_academy
startRoom: krioshaeu_cabin
rooms:
  krioshaeu_cabin:
    title: Krioshaeu's Cabin
    description: >-
      Welcome, Adventurer! You stand within a cozy cabin that is lit by a roaring fire in the hearth. Here in the realm
      between life and death, you've been chosen to be reborn as a hero of Ambon. A small tea cart is set with two cups
      of hot tea and a variety of pastries and finger sandwiches. Krioshaeu sits in her rocking chair, smiling warmly at
      you. 


      To the north, the doorway opens into an endless starry void.
    exits:
      e: endless_starry_void
    image: 613b834e1c5a15f3ab92b48bb587e658f23ee641982e0a621f872c2811067897.jpg
    inn: true
  endless_starry_void:
    title: The Endless Starry Void
    description: >-
      You drift suspended in an infinite expanse of darkness punctuated by countless stars of brilliant white and deep
      sapphire, their light seeming to bend and refract through threads of luminescent cosmic dust that spiral outward
      like frozen aurora. Distant galaxies bloom and fade like flowers of light in slow motion, their swirling arms of
      gold and violet painting stories across the void while wisps of nebulae drift past in haunting, ever-shifting
      formations that seem to echo with the weight of eons.


      To the south, the door to Krioshaeu's Cabin stands open, suspended in space. To the east you see a caravan wagon
      drifting through the stars.
    exits:
      e: wagon_drifting_stars
      w: krioshaeu_cabin
    image: f8fddeb64308955ea614751d515ce962b84d915e7358a907a1befddd61074689.jpg
  wagon_drifting_stars:
    title: Outside a Wagon Drifting Through the Stars
    description: A weathered fortune teller's wagon drifts silently through the cosmic void, its wooden frame adorned with
      faded gilt and arcane symbols, while stained glass windows pulse with an eerie, otherworldly luminescence in hues
      of deep violet and emerald. Before it, a perfect ring of spectral campfire hovers impossibly in the starless
      darkness, casting dancing shadows across the wagon's ornate side and illuminating the endless expanse of space
      around it.
    exits:
      w: endless_starry_void
      e: fortune_teller_parlor
    image: 5fe5b3703e99268e052c30e150d25b90c551d83b859f2bba75333e4d822ac708.jpg
  memory_creation:
    title: A Memory of Creation
    description: You stand within a dream, or a memory, witnessing the creation of Ambon. The world is pulled apart,
      floating in pieces around a central platform. A humanoid figure stands on the platform, bathed in blinding light,
      manipulating the arcane energies as the world forms around them. At their feet, the heat of their presence melts
      the ground, forming two slabs of obsidian beneath them.
    exits:
      w: first_archae
      e: sylflorae_farm
    image: 4ef2f86cdbcb4d0c18f41e8d928f53142326b90ea2438fa62e807f5b114a9682.jpg
  fortune_teller_parlor:
    title: Fortune Teller's Astral Parlor
    description: Within the impossibly vast interior of what should be a cramped wagon, towering shelves overflow with
      leather-bound tomes and crystalline artifacts, their spines glowing with arcane script, while overhead a vaulted
      ceiling painted with zodiac constellations is illuminated by an ever-shifting kaleidoscope of colored light
      streaming through intricate stained glass windows—each pane depicting celestial events and mystical symbols. The
      air itself seems to shimmer with otherworldly energy, dense with the scent of incense and old parchment, as though
      the space exists partially in this world and partially in something far stranger beyond.
    exits:
      w: wagon_drifting_stars
      n: caravan_stable
    image: bb927aba5c9850398131e4beae923248056b00d07ab1cfbdc7543e999aa85836.jpg
  heralds_of_creation:
    title: The Heralds of Creation
    description: You stand upon eternally soft grass that shifts between verdant green and opalescent shimmer, as if reality
      itself cannot decide what this primordial earth should be. Towering above in the luminous haze are beings of pure
      prismatic light—their forms vaguely humanoid yet composed of cascading colors that refract and bloom like living
      stained glass, their movements leaving trails of soft radiance as they prepare the new world for its coming
      inhabitants.
    exits:
      e: kitsarae_study
      s: sylflorae_farm
    image: 40a3c6b24126ae3a3aee670b1608f20af005377ba7cb91d538058022cec7db02.jpg
  first_archae:
    title: The First Archae
    description: The first Archae city, Marldon, begins as a humble town along the river. As the eons pass, it grows into a
      thriving metropolis, the cultural center of Archae civilization.
    exits:
      e: memory_creation
      n: kiriton_winter
    image: 5758bbee5a0387d513d43df2da3ae7383fbb293269a3cc7c27782dc440f120bd.jpg
  drifting_through_clouds:
    title: Drifting Through the Clouds
    description: As you continue through the dream world, passing into the mists of time, you find yourself floating among
      the clouds.
    exits:
      s: kiriton_winter
      n: foothills_kaerinlith
    image: b67aa79ea650bd3ebb793693896976049e6c7f1b434da2baa095e4c03d9d07af.jpg
  tempest_between_worlds:
    title: The Tempest Between Worlds
    description: Drawn by the absence of the Creator, primal forces from other realms began to arrive in Ambon. Maelsang,
      the Tempest Between Worlds,  is a god of storms and seas who came to Ambon from another world. Here in the dream,
      you witness him in his full fury, the unbridled tempest of the harsh early land.
    exits:
      w: sandy_shoal
      n: cozy_inn
      s: seaweed_thicket
    image: 239e3a7617e3ef18ada3f7fa99afe7e06220db1dfe68195ab18b35d6ef6a19f2.jpg
  turbulent_waters:
    title: Turbulent Waters
    description: You find yourself suspended in roiling, storm-churned depths where jagged shards of lightning flicker
      through murky jade-green waters, their brief illumination revealing debris and strange shapes drifting in the
      turbulent currents that pull and twist around you.
    exits:
      e: waterfall
      n: ship_graveyard
    image: 021a9feee2afaf2325f3027f8344850654c0bb933178448c74460184ff2f7be7.jpg
  sandy_shoal:
    title: A Sandy Shoal
    description: A shallow expanse of pale golden sand stretches beneath crystalline shallows, where sunlight dances in
      rippling patterns across the seafloor—the boundary between waking and dreaming where the waters seem both
      impossibly clear and softly luminescent, as though lit from within by the gentle glow of awakening consciousness.
    exits:
      e: tempest_between_worlds
      s: coral_reef
    image: 649cc3a698ec161fd7cfa5d46c6a84f1b01ce86069eda2485d1f8f3ec117be74.jpg
  foothills_kaerinlith:
    title: The Foothills Below Kaerinlith
    description: Gentle slopes of amber-hued grass roll downward from the towering crystalline peak of Kaerinlith, its
      faceted surface catching ethereal light in shimmering cascades of lavender and gold. The air carries the sweet,
      dreamlike quality of a place half-remembered, where wildflowers in impossible colors bloom between smooth stones
      worn soft by time, and the distant sound of crystalline chimes drifts down from the mountain above like a lullaby
      calling the newly-reborn toward their destiny.
    exits:
      e: clockwork_forest
      n: path_kaerinlith
      s: drifting_through_clouds
    image: 63a8d8a27732d3908ada5e32d057d7a0cc2e60f2ace1b9ebbbf1e20e8e5f1a48.jpg
  sylflorae_farm:
    title: A Sylflorae Farm
    description: >-
      You stand on a mountaintop, looking over a valley filled with various Sylflorae migrating outward from their point
      of creation. 


      The Sylflorae are enormous, slow-moving, deeply intelligent creatures whose backs grow orchards, berry tangles,
      tea-shrubs, moss gardens, or grainlike seed-plumes. Created by Astriel to provide plentiful harvests for the young
      Archae civilizations, the Sylflorae resemble vast mythical animals with bark-hide, rootlike limbs, vine manes,
      antler-branches, and entire cultivated ecosystems growing across their backs. They roam through the plains of
      central Ambon seeking favorable growing conditions.
    exits:
      n: heralds_of_creation
      w: memory_creation
    image: dc534a1162bb966d5bf593f1bf3caa7888ca3fdc778307b722901d70256cfa79.jpg
  clockwork_forest:
    title: A Clockwork Forest
    description: Towering brass and copper trees rise like skeletal sentinels, their branches fashioned from interlocking
      gears and crystalline chimes that hum with an ethereal resonance. Soft luminescent sap glows amber and violet
      within transparent trunks, casting dancing shadows across a forest floor of polished cogs and delicate clockwork
      vines that tick softly with each passing breeze.
    exits:
      w: foothills_kaerinlith
      n: deep_clockwork_forest
      e: springwright_workshop
    image: 16f905247d5b9ecd0fddad92ad5aa2ae171eb9db92bc74ca8417adc83a687318.jpg
  deep_clockwork_forest:
    title: Deeper in the Clockwork Forest
    description: Massive brass gears and copper clockwork mechanisms jut from the forest floor like mechanical roots, their
      surfaces etched with intricate patterns that gleam faintly in the dreamlike golden light filtering through
      canopies of crystalline leaves that chime softly as they shift. The air hums with the rhythmic tick-tock of
      countless unseen mechanisms, while shimmering pathways of polished metal wind between ancient trees whose trunks
      spiral with embedded cogs and spinning wheels, creating an eerie beauty where nature and machinery exist in
      perfect, impossible harmony.
    exits:
      e: clockwork_clearing
      s: clockwork_forest
      w: path_kaerinlith
      n: beside_clockwork_pond
    image: 8e4203135ce37b06a29654de22a463557a9f0d806699cc861ef87c6a9c41f046.jpg
  clockwork_clearing:
    title: A Clearing in the Clockwork Forest
    description: A sun-dappled clearing opens within a forest of towering mechanisms—gears the size of boulders mesh with
      crystalline branches that chime softly in the breeze, their surfaces catching golden light like stained glass.
      Grass dotted with luminescent flowers grows in neat spirals around the mechanical trunks, while the sky above
      shimmers with the warm, dreamlike glow of perpetual late afternoon.
    exits:
      w: deep_clockwork_forest
      s: springwright_workshop
    image: 56f92adf42b8d8ab89fbc9197fb6f69764ca8592bdac67683988b6360f2c7798.jpg
  springwright_workshop:
    title: The Springwright's Workshop
    description: This is a memory of the workshop of Tessikar the Springwright. The workshop is magnificent chaos — gears,
      springs, crystals, half-finished mechanisms, blueprints, tools of every kind covering every surface. Crystals from
      the Lithae mines glow in racks along the walls, some already integrated into mechanical housings. Through the
      workshop window, the city of Tessikon is visible far below on the mountainside — his creation, grown from one
      workshop into a civilization.
    exits:
      n: clockwork_clearing
      w: clockwork_forest
    image: d633c965d8fc432e28f36fef4f4b93ec05151d0fb2b0c397e5623eb0ccf190c9.jpg
  beside_clockwork_pond:
    title: Beside the Clockwork Pond
    description: A serene glade unfolds beside a luminous pond whose surface ripples with the gentle ticking of countless
      tiny gears and clockwork mechanisms, their brass and copper casings catching dreamlike light as they drift lazily
      through crystalline water. Whimsical mushrooms with iridescent caps dot the mossy banks, while delicate chiming
      bells hang from nearby branches, creating soft melodies that echo the pond's mechanical heartbeat—a place where
      the boundary between nature's organic beauty and artifice's precise wonder blurs into something wholly
      fantastical.
    exits:
      s: deep_clockwork_forest
      n: wading_pond
    image: 8984ff1e9218880088c17e18ec9c1eb15b3cbce6a1f116c8c738a6414a1979fa.jpg
  clockwork_dias:
    title: Mechanical Dias at the Center of a Clockwork Pond
    description: A towering mechanical platform spirals downward like the intricate gears of a grand cuckoo-clock, its brass
      and copper surfaces etched with dreamlike symbols that seem to shift in the ethereal light filtering down from
      above, while crystalline clockwork mechanisms turn with hypnotic precision around a shimmering pool of liquid
      starlight that reflects both the mechanical intricacy above and bottomless depths below.
    exits:
      d: void_below_mountain
      s: wading_pond
    image: f74c98af49a2266ea3cb590587c55b9858d999e23c487faadd71024e294607ea.jpg
  mine_opening:
    title: The Opening of a Shining Crystal Mine
    description: Crystalline formations jut from earth and stone in every direction, their facets catching and scattering
      light into dancing rainbows that paint the walls in shifting hues of amber, violet, and rose gold. The mine's
      entrance yawns wide and inviting, with glittering veins of precious ore running through the rock face like threads
      of solidified starlight, while loose gemstones crunch softly beneath your feet, their surfaces polished smooth by
      time and the passage of many before you.
    exits:
      n: shining_crystal_mine
      s: path_kaerinlith
    image: 04ec6af335a47726b74fb33a4ce2b91135f4a23cc0e7c150a692a8df344d8334.jpg
  shining_crystal_mine:
    title: A Shining Crystal Mineshaft
    description: Crystalline formations of brilliant amber and pale gold jut from earthen walls, their facets catching and
      refracting an ethereal, opalescent glow that illuminates the narrow passage without any apparent source of light.
      The air shimmers with faint, dreamlike iridescence, and the ground beneath your feet crunches softly with
      fragments of glittering mineral dust, as though you walk through solidified starlight freshly mined from the
      depths of slumber itself.
    exits:
      s: mine_opening
      n: void_below_mountain
    image: 71a8c1cc81e9f074b100eb353a92f2f72a0386f06f8307667fdc7f610ac8e4c2.jpg
  void_below_mountain:
    title: The Void Below the Mountain
    description: Early in Ambon's history Kvarcgagap, The Sparkling Quartz Void, arrived. Like a trickle of quicksilver, he
      moved through the deep places, carving the caverns and seeding the crystals and ore. You stand within a memory of
      his home, deep beneath Kaerinlith, among the sparkling rainbow crystal statues of his children, the Lithae.
    exits:
      s: shining_crystal_mine
      u: clockwork_dias
      n: sleeping_stone_statues
    image: 65c58c4bfb44bc6e991b2e2292d8b09a86a7bec118667f074043135cf0206101.jpg
  sleeping_stone_statues:
    title: Cavern of Sleeping Stone Lithae
    description: A cavernous vault stretches endlessly into shadow, its vaulted ceiling soaring impossibly high above rows
      upon rows of towering crystalline statues—some translucent and gleaming with inner light, others carved from
      obsidian and pale limestone, their humanoid forms frozen in eternal poses of dignity, anguish, or defiance. Veins
      of luminescent ore thread through the chamber's walls, casting an ethereal glow that dances across the statues'
      blank faces and reaches toward distant archways where deeper darkness beckons.
    exits:
      s: void_below_mountain
      e: underground_river
    image: e59be12e7c4f62341bca12179e086b60c7e0919b79c328371b0568964a4740c6.jpg
  arrival_king:
    title: The Arrival of the King
    description: A tear of blinding light splits the mountainside as reality warps and fractures—through the shimmering
      breach emerges an ornate mahogany chariot drawn by four majestic white stallions whose manes seem woven from
      starlight, their hooves striking the ground with an otherworldly resonance as they pull their gilded burden into
      this realm of dreams and rebirth.
    exits:
      e: world_seed
      w: enchanted_bakery
      s: cozy_inn
    image: 70ddc93b82acc84d079074756bd38a2ce35928106a36a57560fd788ab67bc6f1.jpg
  world_seed:
    title: The World Seed
    description: >-
      You stand within a memory of a time long past. Malkuth the Betrayer visits Kvarcgagap and presents him with a
      seemingly simple question: "From what kind of seed did the world grow?". 


      And so Kvarcgagap traveled to the center of Ambon, in the deepest and oldest places there, and discovered the
      obsidian slabs where the Creator stood as they created the realm.
    exits:
      w: arrival_king
      e: obsidian_dagger
    image: f5ce8ccae85ce7c46e523f8439096fef1fd05f22cba141498c66cce48b8be9ae.jpg
  great_betrayal:
    title: The Great Betrayal
    description: You stand within a memory, watching as Malkuth the Betrayer meets with Kvarcgagap, the Shining Quartz Void.
      The scene unfolds in the clockwork forest near Kaerinlith. As the dream plays out, Malkuth draws the Obsidian
      Dagger from its sheath and steals the life force of the great stone god. At the edge of the clearing, a fortune
      teller's wagon sits next to a smoldering fire.
    exits:
      s: obsidian_dagger
      w: carnival_prophecy
    image: f487378011d105ccc9ae770e27c31b0bcfdd4607cc914d34cde6b9c4a10cb48a.jpg
  clockwork_battle:
    title: The Clockwork Battle
    description: You stand in a clearing that shows clear signs of a terrible battle. Fragments of memory drift by - Malkuth
      attacking Tessikar and being driven off by the Springwright. The ground is scorched and the clockwork trees are
      bent and damaged.
    exits:
      e: carnival_prophecy
      w: emberfell
    image: 1afcc2081e9ae30b6fdaa9f19ac733cd9ef2ec5bdf501710167a6cf05fdf8149.jpg
  obsidian_dagger:
    title: The Birth of the Obsidian Dagger
    description: A cavernous forge wreathed in ethereal, twilight-blue flames burns at the center of a black cathedral, its
      edges fractured into jagged shards that seem to pierce the boundary between worlds. At the furnace's heart, the
      flames have turned black and gold —while whispers of the divine realm echo through fissures in reality that bleed
      starlight and ash.
    exits:
      w: world_seed
      n: great_betrayal
    image: 251bd1319f9613ef49af40b4511053a9da56dd1b1e715d29e801ceed1d1a7c48.jpg
  carnival_prophecy:
    title: The Fortune Teller's Prophecy
    description: Inside a cramped wagon perfumed with exotic incense, candlelight flickers across crimson silks and
      mysterious symbols etched into wooden walls, casting dancing shadows that seem to move of their own accord; a
      robed figure gestures solemnly over scattered tarot cards and glowing crystals while their companion leans forward
      intently, caught between wonder and dread as ancient words hang heavy in the air.
    exits:
      e: great_betrayal
      w: clockwork_battle
    image: bb74026309406e22be8412c90271d29af79c5b670e6f19d945e75d308a028a9b.jpg
  emberfell:
    title: The Emberfell
    description: You stand at the highest peak of the mountain Kaerinlith. The memories swirl around you, showing the scenes
      of the Emberfell. Tessikar the Springwright strikes the molten slag of obsidian with his hammer, sending a shower
      of sparks over the countryside.
    exits:
      e: clockwork_battle
      w: gemstone_mineshaft
    image: 4dd33bee0fe60e833565f12bf79399921854859300afc76210271ccebe14c1e3.jpg
  humble_forest_cabin:
    title: A Humble Forest Cabin
    description: Weathered logs form the walls of this modest cabin, its thatched roof sagging gently with age and patched
      in places with bundled reeds. Smoke curls lazily from a stone chimney, and the air carries the mingled scents of
      dried herbs hanging from the rafters, medicinal poultices simmering on a clay stove, and old wood worn smooth by
      decades of care.
    exits:
      e: vault
      n: royal_wedding
    image: 2485cb1112f5285bbe47dc098616e21af07ebe5a1d9b2cf97990f86da04467b6.jpg
    inn: true
  royal_wedding:
    title: The Royal Wedding
    description: You stand in a lavishly decorated ballroom, as the memory of the wedding of Malkuth and Aineroia plays out
      before you. Ghostly figures dance and twirl and the sounds of music and revelry fill the air.
    exits:
      s: humble_forest_cabin
      w: royal_graveyard
    image: 7802b7ac63f421722602048072f4c98a6ccd261193ae354f2c80ba386a98906c.jpg
  royal_graveyard:
    title: In a Tiny, Brightly-Lit Graveyard
    description: Rows of cheerfully painted gravestones glow under the warm light of countless torches, their surfaces
      ablaze with vibrant depictions of phoenixes mid-flight, delicate faeries dancing between flowers, and majestic
      dragons coiled protectively around ornate monuments. The dancing firelight casts playful shadows across the tiny
      cemetery, transforming what might be a place of sorrow into a luminous garden of hope and wonder.
    exits:
      e: royal_wedding
      s: sacrificial_altar
    image: 60ced20788a1cd22edaba28c162b3a3d4d85da7d58b705c5aae95ef4430317ea.jpg
  sacrificial_altar:
    title: Beside the Sacrificial Altar
    description: Candlelight flickers across an obsidian altar of polished black glass, its surface etched with spiraling
      runes that seem to drink in the shadows; arranged upon it are dried bundles of luminescent herbs that glow with
      soft violet and silver light, an ornate bassinet lined with gossamer silk, and a ceremonial dagger whose blade
      catches the firelight like captured starlight. The air shimmers with an otherworldly haze, carrying the sweet
      scent of dreamsmoke and rebirth magic, as if the very boundary between the realm of the dead and the waking world
      grows thin in this consecrated space.
    exits:
      w: arcane_tempest
      n: royal_graveyard
    image: 6b29eecd9d926df7dc9ba82464845f20853a7e6db961320e906da0ebffa79ca5.jpg
  caldera:
    title: The Caldera
    description: A colossal wound carved into the world itself, this massive crater sprawls endlessly in all directions—its
      jagged rim rising like broken teeth against the sky while the depths plunge into shadow and swirling auroras of
      unstable arcane energy. The displaced earth hangs suspended in impossible geometry, great chunks of stone and
      shattered kingdom frozen mid-fall through layers of ethereal light and crackling magical force that hums with the
      residual power of catastrophic enchantment.
    exits:
      n: verathaios_workshop
      s: arcane_tempest
    image: ed537d7226cc97991d59ada6e3b68934a5fe5ef760480251dd54313558be6a32.jpg
  arcane_tempest:
    title: Inside the Arcane Tempest
    description: Swirling columns of prismatic energy spiral endlessly through this impossible chamber, their colors
      shifting from deep violet to brilliant gold with each rotation. The air crackles with raw magical force, and the
      very ground beneath your feet seems to flicker between solid stone and shimmering, translucent arcane matter as
      reality bends around the tempest's violent heart.
    exits:
      e: sacrificial_altar
      n: caldera
    image: 8df8148b2df1550f5ca0af5f8c8d94ff6aeab83d4296aa244d1b383db68e8a34.jpg
  verathaios_workshop:
    title: Verathaios's Workshop
    description: A lush tropical greenhouse thrums with verdant life, its canopy towering overhead with bioluminescent vines
      that cast dancing shadows across massive ferns and exotic flowers blooming in impossible colors—deep purples,
      luminous golds, and soft greens that seem to glow from within. The air shimmers with visible magic, and the ground
      is carpeted with moss so soft it muffles footsteps while healing herbs and crystalline-stemmed plants grow in wild
      abundance, their properties whispered through the humid breeze.
    exits:
      s: caldera
      n: aolia
    image: fa2811af5c4f38aa2f7924da84a7502f9364081daf117cba7155259f850a0fa1.jpg
  aolexia:
    title: Aolexia
    description: A breathtaking expanse of crystalline islands drift like silent sentinels through an ethereal void where
      starlight pools into luminous streams and the very atmosphere thrums with ancient arcane knowledge. Vast libraries
      spiral across floating terraces of solidified starlight, their ever-shifting shelves laden with tomes in forgotten
      and unspoken tongues, while meditation chambers hewn from cosmic crystal invite seekers deeper into
      understanding—all tethered to the world below through Aolia, a delicate observatory whose constellation of
      gleaming telescopes pierces both the celestial vault above and the misty lands of Ambon beneath, their lenses
      reflecting equal wonder at the infinite and the mortal.
    exits:
      n: shattered_fae_wood
      s: aolia
    image: 239e1807f2166b41557f80739ee447a9633be639a3a0df19559fd372e1355dfa.jpg
  aolia:
    title: Aolia
    description: A sprawling observatory suspended among billowing clouds, its brass telescopes pointed skyward like fingers
      grasping at celestial secrets, while below the misty veil Ambon's civilizations shimmer in miniature; gossamer
      pathways of solidified starlight wind between crystalline domes and floating platforms, and a shimmering archway
      pulses with arcane energy—the threshold to the grand library beyond.
    exits:
      s: verathaios_workshop
      n: aolexia
    image: f467c9bbf1d5be8e17f97b8c4a3a8b2a20f7f296163ffb8daa5404ba78d135d7.jpg
  shattered_fae_wood:
    title: The Shattered Fae Wood
    description: Fractured crystalline shards of impossible geometry drift through an endless void of twilight purple and
      shimmering gold, their surfaces reflecting distorted glimpses of a forest that exists in a thousand broken pieces
      simultaneously—skeletal trees with luminescent bark twist through the weightless expanse while spectral wisps of
      displaced magic coalesce and scatter like disturbed embers, all beneath a sky that has itself splintered into
      jagged segments of starlight and shadow.
    exits:
      s: aolexia
      n: aineroia_cottage
    image: aef70a2517c299715389cfd992ed0fcd3bcc647365e715c6bd730f84bbde48b3.jpg
  lustriae:
    title: The Lustriae
    description: A shimmering glade where twilight lingers eternally, neither fully day nor night, with ancient trees whose
      bark glimmers faintly as though dusted with captured starlight and frost. Gossamer veils of pale blue and silver
      mist coil through the air like living things, swirling around impossible architecture that seems to exist in
      multiple moments at once—archways that loop back upon themselves, crystalline structures that refract light into
      cascading rainbows, and clearings where the same stone appears both weathered by ages and pristine and new.
    exits:
      n: aineron
      s: faegrimm
      e: pyrae
    image: 5618e60c3c8903f9f8fb34f7a07c889ffcb4a49b03c6d1fbef0d4caada45d7ab.jpg
  pyrae:
    title: The Pyrae
    description: Scorched air ripples from every surface as waves of heat distort the very atmosphere, and towering trees
      with bark blackened by eternal flame stretch impossibly high into a hazy crimson sky where embers drift like snow.
      Suspended bridges of woven vines and phoenix feathers span between colossal canopy dwellings, their architecture
      carved from still-smoldering wood and reinforced with bands of hardened ash, while the glow of contained infernos
      within illuminates everything in dancing shades of gold, amber, and deep blood-red.
    exits:
      s: veratheron
      n: cindaron
      w: lustriae
      e: aureliae
    image: 923ffc5b2f6e2d02adff0a07e59dd87a777e7cf7286ef08f37a0131cddf03049.jpg
  aureliae:
    title: The Aureliae
    description: Bioluminescent beings of the deep ocean drift through endless darkness like living constellations, their
      translucent forms pulsing with otherworldly radiance in cascades of azure, violet, and pearl that ripple
      hypnotically across jellyfish-like bodies. Around them, vast coral metropolises rise in impossible spirals and
      delicate arches, each structure alive and glowing in harmony with the gentle light of their creators, while
      haunting magic songs—complex symphonies resonating through the water—echo endlessly through the luminous realm.
    exits:
      n: phosmaren
      s: lagauri
      w: pyrae
      e: ophirae
    image: ba7f96858dbfb15a30cdae1ea605e8fccb54481493ba59181154f828d5ed30f1.jpg
  ophirae:
    title: The Ophirae
    description: A vast underwater cathedral of pearlescent bone and midnight scales emerges from obsidian depths, its
      spiraling towers crafted from the ancient ribs of forgotten leviathans; serpentine forms with iridescent eyes
      glide through currents of luminescent bioluminescence, their scaled bodies rippling with the grace of creatures
      born to command both the crushing abyss and storm-torn skies.
    exits:
      s: thalvorek
      n: nakhara
      w: aureliae
      e: mycorae
    image: c16891bc0c61bb1cff601ea423754eaabf44c49ae3995a39ebbb6b995676466e.jpg
  mycorae:
    title: The Mycorae
    description: Beneath the forest floor, a vast network of silvery mycelial threads pulses with bioluminescent life, their
      collective consciousness made manifest in fruiting bodies that rise like living architecture—towering mushroom
      cities with caps of deep amber, ethereal blue, and ghostly white glow softly in the perpetual twilight. Individual
      Mycorae emerge from this living substrate as graceful, translucent-skinned beings with stalks for limbs and crowns
      of luminescent tissue, their bark-like flesh breathing in rhythm with the greater fungal network, embodying the
      eternal cycle of decay, death, and rebirth that defines their very existence.
    exits:
      n: mycollum
      s: voxspore
      w: ophirae
      e: vulgorth
    image: f3ff7412809bc028fbbf36255c38775cbb288da0625864a3e5e200ff77ee3e41.jpg
  night_wind:
    title: A Shrieking Night Wind
    description: A violent, keening gale that shrieks with the anguish of a child's unfinished cry, its form a roiling mass
      of pale, corpse-cold mist threaded through with wisps of deep indigo and sickly green that pulse like a dying
      heartbeat. The air itself seems to fracture in its presence, crystalline shards of supernatural frost hanging
      suspended in the wind, while an overwhelming sense of abandon and grief presses down upon all who stand within its
      maddening howl.
    exits:
      e: moon
      s: vulgorth
      w: mycollum
    image: 1b9cf119ed5409c5ee6be40b6e3be43c0e503cb30e4185b83bb015e799c75f55.jpg
  luneqrae:
    title: The Luneqrae
    description: You stand on the grassy plains in Northern Ambon. Ethereal forms of pearlescent mist and silver smoke
      coalesce into the shapes of graceful horses, their bodies translucent and shifting like captured moonlight, their
      hoofbeats silent against the ground as they drift through the space with an haunting, weightless elegance. Their
      eyes gleam with a sorrowful luminescence, and trails of gossamer light mark their passage—the restless spirits of
      those who never found rest, now bound eternally to the silver glow of the moon's domain.
    exits:
      n: krioshaion
      e: aetherae
    image: 2e3914cc3d4acb876508a20cbfa05d17f8b4e004ce2c38209bdef8b20689bbe1.jpg
  moon:
    title: Aineroia Lights the Night Sky
    description: >-
      Nearly 200 years after her ascension, Aineroia returns to Ambon to find the people terrified by the newly released
      magical creatures, haunted by the screeching night wind, cowering in fear of Ambon's dark nights. Death existed in
      Ambon from the beginning — terrifying, formless, nameless, the end of all things. Aineroia could not accept this
      for her children - for any of Ambon's children - so she took this primordial terror and shaped it into something
      beautiful.


      Thus was born Krioshaion, the realm of the dead, ruled by the benevolent Krioshaeu —death given form, purpose, and
      compassion. She lifted Krioshaion itself into Ambon's night sky, transforming the realm of the dead into the
      world's moon. Now it hangs there like a luminous pearl, casting gentle light across the world below—no longer the
      harsh, distant gleam of stars, but the warm radiance of a mother's eternal vigil.
    exits:
      w: night_wind
      s: krioshaion
    image: 04964efc65110967409883815bbfbe28acb281f6a6624db7d2a66a82d096938e.jpg
  aetherae:
    title: The Aetherae
    description: Swirling mists coalesce into spectral forms that drift across windswept northern plains, their translucent
      bodies shifting between shadow and starlight as they move with the grace of nomadic herders tending luminescent,
      ethereal creatures. These beings of living darkness wear flowing garments that billow without wind, their eyes
      glowing softly like distant moons, eternally bound to guard an ancient, concealed blade and shepherd their fey
      charges across endless grasslands.
    exits:
      w: luneqrae
      n: desert_sands
    image: 295ffd14d731dc1a302d058fe100c03d38e082d22c8a93b8dc959c74cbb6ec92.jpg
  call_for_heroes:
    title: The Call for Heroes
    description: Outside a quaint cottage of pale wisteria wood that sits nestled among luminescent dream-flowers, its
      thatched roof shimmering with threads of silver starlight that seem to drift upward like smoke. Warm amber light
      spills from curtained windows, and the doorway is framed by climbing vines bearing delicate glass-like blooms that
      chime softly in an unfelt breeze.
    exits:
      n: necrambon
      s: tessikon
    image: 5e346c92fbcced4e0173984767743ffc5d4a56593216f255aafb648034086ffb.jpg
  desert_sands:
    title: The Hot Desert Sands
    description: The Hot Desert Sands stretch endlessly beneath a merciless sun, where towering rock formations pierce the
      shimmering heat haze like the weathered bones of ancient titans. Vast expanses of rust-colored sand and
      sun-bleached stone dominate the landscape, interrupted by scattered outcroppings of dark basalt and veins of
      crystalline minerals that gleam like captured starlight, while the distant eastern peaks loom snow-capped and
      forbidding against the harsh blue sky—a frozen barrier separating this scorched realm from the world beyond.
    exits:
      s: aetherae
      n: creeping_darkness
    image: c810b18fe025076c707067d259ed07fb012d1b0f727a940f1b803a571bd82c3c.jpg
  aineron:
    title: Aineron
    description: "A massive archway grown from ancient, living trees at the edge of a sparse northern forest. The trees
      forming the arch are enormous, their trunks twisted together into a cathedral-like gateway, branches interlocking
      overhead. Beyond the archway, the world changes — the light is warmer, the colors more saturated, the air filled
      with drifting motes of gold. On this side: thin boreal forest, cold light, frost on the ground. Through the arch:
      an impossibly lush magical realm glimpsed in the distance. Small cozy structures of wood and vine cluster near the
      base of the archway. The feeling of standing at a threshold between worlds."
    exits:
      s: lustriae
      w: aineroia_cottage
      e: cindaron
    image: f85000a2b14e478aeecc5f24ac3be48f8cab1ad6b6f2f29b56f091681e73f5bb.jpg
  veratheron:
    title: Veratheron
    description: Tall, slender tower-like structures rising above the jungle canopy along the western coast. The towers are
      organic in design — grown from living wood rather than built, spiraling upward like enormous vines reaching for
      the sky. At their tops, platform-homes and lookout posts give views across both the jungle and the ocean. The warm
      river flows nearby, steam rising where supernatural warmth meets ocean breeze. Named for Verathaios the World
      Healer, this settlement has a sacred quality — a place where the divine greenhouse meets the sea.
    exits:
      n: pyrae
      w: faegrimm
      e: lagauri
    image: e3eba791cc6aecd074f24bfeebe102aace5bd1c5d142584a1f9ae7a41a15a88e.jpg
  phosmaren:
    title: Phosmaren
    description: The main Aureliae port at the southeastern tip of the continent — the place where other races come to trade
      with the jellyfish people. A larger settlement than the others, with proper docks and harbor facilities, but still
      unmistakably Aureliae in design. The architecture glows with phosphorescent light, especially beautiful at dusk
      and night. A lighthouse-like structure emits a soft, pulsing bioluminescent beacon.
    exits:
      s: aureliae
      w: cindaron
      e: nakhara
    image: 6d0366fd51bca3cb8d606f612452833f43c29aa7b069bd2c0319ef403082a4e7.jpg
  thalvorek:
    title: Thalvorek
    description: The underwater city of Thalvorek. Massive coral-and-stone architecture spiraling downward into deep blue
      water. Bioluminescent lights illuminate the structures in blues, greens, and golds. The buildings have a flowing,
      organic quality — grown from coral and shaped by current rather than built with straight lines. Schools of fish
      move through open archways. The scale is enormous — this is a true city, with districts, plazas, and towering
      structures, all beneath the waves. The surface above is calm, giving no hint of what lies below except a faint,
      diffused glow.
    exits:
      n: ophirae
      w: lagauri
      e: voxspore
    image: cd8eb775ef558b685a4b2fbbc407efa32a32170ff9341fe3d33d0bfd5ca84dbd.jpg
  mycollum:
    title: Mycollum
    description: A fungal city at the intersection of forest and marsh. Enormous mushroom caps — some the size of buildings
      — form the canopy over a settlement built from living fungal material. Bioluminescent fungi of every color provide
      light — pale blues, soft greens, warm ambers. The ground is a thick carpet of mycelium, visibly pulsing with faint
      light as information travels through the network. Structures are grown, not built — hollowed-out giant mushrooms
      serve as homes, with shelf fungi forming stairs and platforms. The air is thick with spores that drift like snow.
      Everything is damp, organic, alive.
    exits:
      s: mycorae
      w: nakhara
      e: night_wind
    image: d8cd6ba77489ac863da3ad2889855ced94637cd0af1c0a1cbb11d6449e05b509.jpg
  creeping_darkness:
    title: The Creeping Darkness
    description: "Creeping shadows pool unnaturally thick in this place, darkness so profound it seems almost solid—a
      tangible wrongness that swallows light rather than merely obscuring it. The very stone beneath your feet bears the
      discolored marks of decay, fractured and weeping a sickly luminescence like infected wounds, while the air tastes
      of copper, ash, and something far more ancient: the reek of stolen divinity twisted into instruments of
      suffering."
    exits:
      e: resistance_camp
      s: desert_sands
    image: 4e0f00e1a337c2631fb7c05f684d81f4a74b958bce2ce0d4510be3b8208fa572.jpg
  tessikon:
    title: The Coming-Soon Portal to Tessikon
    description: A city of pure engineering at the base of the central mountains, built by Tessikar the Springwright. High
      above the city, Tessikar's cabin and workshop are visible carved into the mountainside — smoke and steam venting
      from a cluttered genius's workshop, with a path winding down to the city below. The architecture is unlike
      anything else in Ambon — every surface is mechanical. Buildings of polished brass, copper, and steel, with visible
      gears, pistons, and clockwork mechanisms integrated into the structure itself. Towers topped with spinning
      orreries. Streets paved with interlocking metal plates. Steam vents release gentle plumes from underground
      workshops. Mechanical lifts carry people between terraced levels built into the mountainside. Automated market
      stalls with clockwork attendants. Crystal-powered lamps line every street — the crystals traded from the nearby
      Lithae, repurposed from beauty into function. The city hums — a constant low vibration of a thousand mechanisms
      working in harmony.
    exits:
      n: call_for_heroes
      s: dream_hotel
    image: dba36fb9d3398fddb4e65ca2925bcd321961e8b54ec578a583149b95f1fcb301.jpg
  faegrimm:
    title: Faegrimm
    description: A weathered Lustriae settlement at the eastern edge of the sparse forest where it meets the rocky coast.
      Harder and grimmer than the western faerie communities — structures of dark twisted wood and grey stone, built to
      withstand coastal winds. Watch towers of black timber rise above the treeline. The faeries here are frontier folk.
      Fog rolls in from the sea. The buildings have a fortress quality underneath their organic construction — thorned
      vines growing over defensive walls, trees shaped into barricades. A settlement that says "this is where the gentle
      forest ends and the wild coast begins."
    exits:
      n: lustriae
      e: veratheron
    image: 803086ada29205a432ab00a84c1b77b0e80c93567faf3953d170c243be493c61.jpg
  cindaron:
    title: Cindaron
    description: A Pyrae settlement at the southern edge of the jungle, where the canopy thins and the caldera's warmth
      fades. The structures are lower here, the trees less massive. The architecture transitions from full canopy-city
      to something closer to ground level. The light is different — less of the supernatural golden glow, more natural.
      The settlement has a frontier quality — the last outpost of Pyrae civilization before the open Archae heartland
      begins. Embers of the caldera's warmth linger in the air, but just barely. A place of endings and thresholds.
    exits:
      s: pyrae
      e: phosmaren
      w: aineron
    image: 706c8863e01d15c9c918137cc2d51acafdf9176834c358dfac0984f0fc24e215.jpg
  lagauri:
    title: Lagauri
    description: An Aureliae settlement in the central archipelago, built around and within a warm tropical lagoon. The
      architecture is half above water, half below — structures that descend from stilts above the surface down into the
      lagoon below. Everything glows — bioluminescent coral, luminescent jellyfish drifting through the shallows, the
      buildings themselves emanating soft golden and purple light. The lagoon water is shallow and warm, filled with
      life. Aureliae in their natural translucent, glowing forms are visible moving through the water. A city of light
      floating on a tropical sea.
    exits:
      n: aureliae
      e: thalvorek
      w: veratheron
    image: d8a294b13d13f08bd6307897b78987c7376e0be0a6ee750a461b8cd4904240ca.jpg
  nakhara:
    title: Nakhara
    description: A coastal trading settlement on the northeastern shore, larger and more developed than Thalnakh. Built on
      the beach and extending onto stilts over shallow water. The architecture incorporates pearl, shell, coral, and
      sea-glass — beautiful in an understated way. A harbor with unusual boats — sleek, low vessels designed to be
      sailed both on and beneath the surface. The offshore water is crystal-clear, revealing coral structures and the
      tops of underwater buildings in the shallows. Ophirae in their natural dragon-like forms are visible swimming in
      the water below the docks.
    exits:
      s: ophirae
      e: mycollum
      w: phosmaren
    image: 740c8b94b168088bb445d9d9c920ce8ecf0ff1a522e98c994c49675eb1c2ae3e.jpg
  voxspore:
    title: Voxspore
    description: A unique settlement where Kitsarae and Mycorae cultures blend. On one side, Kitsarae architecture —
      colorful, elegant, silk-draped market stalls and carved buildings. On the other, Mycorae fungal structures — giant
      mushrooms, bioluminescent light, mycelium walkways. The two styles meet and mingle in the center, creating a
      hybrid district unlike anything else in Ambon. A place where fox-clever diplomats trade with a hive-mind. The
      market stalls sell both conventional goods and exotic fungal products. The atmosphere is bustling, cosmopolitan,
      slightly surreal.
    exits:
      n: mycorae
      e: lyrasael
      w: thalvorek
    image: 90aaebdace0cd77fbe764ef4d780b70b1a6ea4d422338ffd5de775fa6c78b67d.jpg
  lyrasael:
    title: Lyrasael
    description: A beautiful port city on the eastern coast of the Kitsarae basin. White and pastel buildings cascading down
      a hillside to a crescent harbor. The architecture is the most refined on the continent — graceful arches, tile
      roofs in warm terracotta and blue, open courtyards with fountains and flowering gardens. Musicians perform in
      public squares. Sailing vessels fill the harbor. The climate is perfect — warm sun, gentle breeze, blue water.
      This is the jewel of Kitsarae culture, the place every bard wants to perform and every diplomat wants to be
      posted. Mediterranean paradise with fox-clever charm.
    exits:
      w: voxspore
      n: vulgorth
    image: c846d5c47d43ba0dc5c90d2a04dd66a529a4b9236b1f04e0fe6563a45ebbd1bd.jpg
  vulgorth:
    title: Vulgorth
    description: A Lithae settlement on the eastern slope of the mountains, facing the lowlands. More industrial and
      outward-facing than the deep holds — great forge chimneys rise from the mountainside, smoke and steam venting into
      the open air. The architecture transitions from mountain-carved stone at the top to more conventional buildings at
      the base where the settlement meets the trade roads. Workshops, smithies, and markets line terraced streets
      descending the slope. The gateway where dwarven craft meets the outside world. Warm forge-light glows from every
      window. Carts of finished metalwork and crystal goods line the roads heading east.
    exits:
      s: lyrasael
      n: night_wind
      w: mycorae
    image: e4954e343a5277e3342716311bddab8c023bce33ff6ba30d385528c6385b6e29.jpg
  krioshaion:
    title: Krioshaion
    description: Vast, rolling expanses of luminous colored mist — aurora-touched fog in silvers, golds, pale blues, soft
      violets, and rose pinks — drifting and shifting like a living sky made of ground. The mist doesn't obscure — it
      reveals, parting and reforming to show glimpses of impossible beauty. There is no ground in the conventional sense
      — visitors walk on surfaces of solidified moonlight, smooth and faintly warm, that glow from within. The "sky"
      above is not a sky but the inner surface of the moon itself — a vast dome of pearlescent silver-white that
      radiates gentle, ambient light from every direction.
    exits:
      n: moon
      s: luneqrae
    image: c0ecb5b5eb85821482d6ae33fb3da3c2cce66574470e690638861925d5baa5b8.jpg
  path_kaerinlith:
    title: The Path to Kaerinlith
    description: A winding mountain path ascends toward a distant crystalline peak that shimmers with ethereal light, its
      slopes bathed in the soft, dreamlike glow of Auringold's perpetual twilight. Wildflowers in impossible
      hues—lavender, rose-gold, and pale silver—dot the rocky terrain, while the air itself seems to shimmer with gentle
      mist that obscures the drop-offs below, creating an atmosphere both wondrous and slightly disorienting, as if the
      very path exists between waking and dreaming.
    exits:
      n: mine_opening
      s: foothills_kaerinlith
      e: deep_clockwork_forest
    image: 565438541b1a4ccdff72100268ed0b8ae741abdd75b072887096c994eb913c6f.jpg
  cozy_inn:
    title: The Cozy Inn of Dreams
    description: "Warm lamplight spills across worn wooden floorboards as the crackling fireplace casts dancing shadows on
      the plush, dream-touched furnishings—every cushion and curtain rendered in soft golds and drowsy blues, as if the
      inn itself exists half in sleep. Familiar comforts materialize around you: a well-stocked bar of frosted glass
      bottles, small round tables perfect for quiet conversations, and an overall atmosphere that feels both safely
      enclosed and somehow infinite, like a cherished memory made manifest."
    exits:
      s: tempest_between_worlds
      w: auringold_tavern
      n: arrival_king
    image: 1e19697f890b64879b1d612493983a1afa309aab0196c0d9bc66bb6be76136d0.jpg
    inn: true
  gemstone_mineshaft:
    title: A Mineshaft Full of Gemstones
    description: Glittering veins of amethyst, emerald, and sapphire streak through the rough stone walls, catching light in
      fractured rainbows that dance across the earthen floor, while loose gemstones of every hue scatter across the
      ground like fallen stars awaiting discovery.
    exits:
      e: emberfell
      s: vault
    image: d4c87ca1d4ae4ef2a5e4768908d0795494ac688dd5ea9e50ce21699f7dd38e9b.jpg
  enchanted_bakery:
    title: The Enchanted Bakery of Auringold
    description: Warm golden light spills through frosted windows as the scent of fresh-baked bread and sweet honey fills
      the air, with shelves lined in soft pastels displaying delicate confections that seem to glow with an otherworldly
      luminescence. The cozy interior radiates comfort and wonder—all rounded corners, soft textures, and whimsical
      details that feel both inviting and slightly dreamlike, as if you've stepped into a memory of safety rather than a
      real place.
    exits:
      s: auringold_tavern
      e: arrival_king
    image: 993a837b7b86dcfb1ffb02ce8c6861b74c8241a7fee7515f031c9634c69211ec.jpg
  auringold_tavern:
    title: The Retired Professor Tavern
    description: A cozy tavern bathed in warm lamplight, its wooden beams and shelves lined with well-worn books, curious
      artifacts, and half-empty bottles of amber liquor that catch the glow like captured firelight. Comfortable
      armchairs and round tables scattered throughout invite weary travelers to settle in, while the air itself seems
      thick with the scent of pipe smoke, old leather, and the faint sweetness of mulled wine—a place where stories
      linger as much as the patrons who tell them.
    exits:
      e: cozy_inn
      n: enchanted_bakery
    image: 041c7cef3768e5ed8547e0e1a341d480724c652a43171ce1cdb390c2f3fea595.jpg
  ship_graveyard:
    title: A Graveyard of Sunken Ships
    description: Skeletal hulls of countless vessels lie scattered across the murky seafloor like the ribs of massive
      beasts, their splintered wood encrusted with bioluminescent coral and writhing sea anemones that paint the
      darkness with ethereal blues and greens. Swaying kelp forests have claimed the masts and rigging, while schools of
      phosphorescent fish weave through the skeletal remains, transforming this graveyard of human ambition into a
      haunting garden of brine and decay.
    exits:
      s: turbulent_waters
      e: sunken_ship_hull
      n: coral_reef
    image: 400f043ac859a59e7808ad7d126173d92dfcdacdd5065faaa660461b3f629284.jpg
  coral_reef:
    title: A Coral Reef
    description: Brilliant corals in impossible hues—deep purples, electric blues, and shimmering golds—form towering
      formations around you, their branching arms creating natural corridors of wonder. Schools of luminescent fish dart
      through the crystalline water in synchronized waves, while anemones sway gently in the current, their tentacles
      painting trails of bioluminescent light across the dreamlike seascape.
    exits:
      e: seaweed_thicket
      n: sandy_shoal
      s: ship_graveyard
    image: 78779de38f67dcd0383727f63d979370e2d906216ebedf220f91a6a8b597dd7e.jpg
  seaweed_thicket:
    title: A Seaweed Thicket
    description: Towering strands of emerald and amber seaweed sway gently in invisible currents, their fronds creating a
      dense, shifting labyrinth of shadows and filtered green light that dapples across the sandy bottom. The water here
      tastes of salt and ancient growth, with occasional glimpses of bioluminescent plankton twinkling like drowsy stars
      between the tangled stems.
    exits:
      s: sunken_ship_hull
      w: coral_reef
      n: tempest_between_worlds
    image: 1356b0886e96370f414a386e81a049e9891656991953ea82566f15f365dbd6d2.jpg
  sunken_ship_hull:
    title: Within the Hull of a Sunken Ship
    description: The rotting wooden hull of an ancient vessel lies tilted in the murky depths, its barnacle-encrusted
      timbers creaking softly with the current, while bioluminescent algae casts an eerie green-blue glow across the
      tilted deck and the skeletal remains of its rigging.
    exits:
      n: seaweed_thicket
      w: ship_graveyard
    image: 83f7e3783c345b9cef97c5dd57ba8d99318bb201d0f2a7865c8d9e3f4dd06b4e.jpg
  vault:
    title: Kvarcgagap's Vault
    description: A cavernous chamber carved from glittering quartz-veined stone, its walls faceted to catch and refract
      ethereal dreamlight into prismatic cascades of amber and violet. Towering crystalline formations jut from floor
      and ceiling like frozen waterfalls, their surfaces etched with faint runes that seem to shimmer with the memory of
      countless treasures once guarded within this hallowed vault.
    exits:
      n: gemstone_mineshaft
      w: humble_forest_cabin
    image: 9c1bdc443e9a04e72a6f6ce586f36abd3e6f59059899b3b5433bcb876a339b08.jpg
    features:
      vault_chest:
        type: CONTAINER
        displayName: Kvarcgagap's Vault
        keyword: vault
        initialState: closed
        resetWithZone: true
        items:
          - gemstone_crate
  wading_pond:
    title: Wading Across a Clockwork Pond
    description: A tranquil expanse of shallow water glimmers with an otherworldly luminescence, its surface dotted with
      floating brass gears and crystalline cogs that turn in perfect, silent synchronization; delicate streams of golden
      light dance between the mechanical pieces like living threads, while the water itself shimmers in soft blues and
      silvers, reflecting a sky that seems both dream-like and impossibly precise.
    exits:
      s: beside_clockwork_pond
      n: clockwork_dias
    image: cb43ff130d5d58b5dee4092e6cf4350766490588587beca14551bc14aee4c20f.jpg
  caravan_stable:
    title: A Stable of Clockwork Horses
    description: A pair of gleaming brass automatons stand beneath a makeshift stable, floating among the stars. their
      bodies etched with intricate filigree and spinning gears visible beneath translucent panels in their flanks. Their
      mechanical eyes glow with an amber light, and wisps of enchanted steam curl from their nostrils, their polished
      surfaces reflecting candlelight in mesmerizing patterns.
    exits:
      s: fortune_teller_parlor
      n: kitsarae_study
    image: 8247cafd27b1e86050e138a627dd715b2a56571038c2e0bd804c47698ecc33c5.jpg
  kitsarae_study:
    title: The Path to Enlightenment
    description: A serene forest clearing bathed in soft, ethereal light where creatures of fur and feather sit in
      contemplative circles around glowing tomes and intricate geometric diagrams etched into moonlit stone. The air
      shimmers with arcane energy as some beings remain locked in animal form while others stand half-transformed, their
      silhouettes flickering between bestial and humanoid grace, their eyes alight with the spark of dawning intellect.
    exits:
      s: caravan_stable
      w: heralds_of_creation
    image: 51b40d594c2f5ebe3a7250ed967cde905fb2cf32f9a8657d0fa3b36fd973f4bf.jpg
  aineroia_cottage:
    title: Aineroia's Cottage
    description: A quaint cottage of pale wisteria wood sits nestled among luminescent dream-flowers, its thatched roof
      shimmering with threads of silver starlight that seem to drift upward like smoke. Warm amber light spills from
      curtained windows, and the doorway is framed by climbing vines bearing delicate glass-like blooms that chime
      softly in an unfelt breeze.
    exits:
      s: shattered_fae_wood
      e: aineron
    image: 3edef5e2570ef32d74960271ad3a4623358554fec8ac0d2f7042d2fa95efcebe.jpg
    inn: true
  yaleron:
    title: Yaleron - A City Under Seige
    description: A walled Archae city east of the mountains, dominated by a large temple to the Creator. High, thick walls
      with few gates. The architecture is austere and conservative — functional stone buildings, no ornamentation, no
      concession to the newer magical aesthetics of post-ascension Ambon. The temple is the largest structure, its spire
      visible for miles. The city feels deliberately isolated — no sprawling suburbs, no welcoming market districts
      outside the walls. Roads approach but the gates are narrow.
    exits:
      s: necrambon
      n: resistance_camp
    image: 8ef0a3167b5d881ed14f38d740bec2d484c9c266a7ec1f20d9e0b04a730c3262.jpg
  necrambon:
    title: Necrambon
    description: >-
      A walled Archae city east of the mountains, dominated by a large temple to the Creator. High, thick walls with few
      gates. The architecture is austere and conservative — functional stone buildings, no ornamentation, no concession
      to the newer magical aesthetics of post-ascension Ambon. The temple is the largest structure, its spire visible
      for miles. The city feels deliberately isolated — no sprawling suburbs, no welcoming market districts outside the
      walls. Roads approach but the gates are narrow.

      The city has been destroyed. The walls are breached, the temple damaged. The streets are empty of the living. An
      oppressive, grey atmosphere — the light seems dimmer here, the air colder. Signs of Kirot's occupation everywhere
      — dark stains on the stones, an unnatural stillness. This is a place where terrible things happened and the land
      remembers. The architecture is intact but lifeless — a city that died with its people.
    image: dd7567e3831cd929336d15cbed21de0a4fa37f43af42404135566457e7f5c914.jpg
    exits:
      n: yaleron
      s: call_for_heroes
  resistance_camp:
    title: A Resistance Camp in the Mountains
    description: Rough-hewn tents of grey and brown canvas cling to the windswept ledges of a jagged mountain pass, their
      guide-ropes straining against the biting alpine wind, while cookfires glow like embers in the cold dusk below
      peaks dusted with snow. Banners of a dozen different orders and factions hang side by side between the rocks, and
      armored figures move purposefully among stacked crates and weapon racks, their breath misting in the thin air as
      the sprawling walled city of Yaleron looms far below in the valley's shadow.
    image: 486a32fa93475acb69b281e5f9757d1f0c411a55b95dd5cdfcd6636cb03c51ed.jpg
    exits:
      w: creeping_darkness
      s: yaleron
  dream_hotel:
    title: Hotel at the Edge of Dreams
    description: A grand but unsettling establishment where the architecture subtly defies logic — doorways slightly too
      tall, hallways that curve where they shouldn't, and wallpaper of deep burgundy and tarnished gold that seems to
      shift patterns when not looked at directly. Soft amber lamplight flickers throughout, casting long shadows across
      velvet furnishings and a front desk of dark lacquered wood, behind which hangs a clock with too many hands, all
      moving at different speeds.
    exits:
      n: tessikon
      w: general_store
      s: library_fairytales
    image: b003d0960624177e1b43aa0a09d52b28d781710fb5011da101d332a6ce851b25.jpg
    inn: true
  general_store:
    title: Madam Daydreams' General Store
    description: A cozy, cluttered shop bathed in warm amber lamplight, its wooden shelves sagging under the weight of
      colorful potion bottles, bundled herbs, and peculiar knick-knacks stacked from floor to ceiling. A faded velvet
      curtain separates the front counter from some unseen back room, and the air seems to shimmer faintly with the
      mingled scents of dried flowers and old magic.
    exits:
      e: dream_hotel
      s: crafters_workshop
    image: 24e1f2423e639465bd14ac340f379ad1aadd763db50150e3eba4b4cd3013c62e.jpg
  library_fairytales:
    title: The Library of Fairytales
    description: Towering shelves of dark mahogany stretch from floor to vaulted ceiling, crammed with leather-bound tomes
      whose gilded spines shimmer with a faint, otherworldly glow, while clusters of floating candles drift lazily
      between the stacks, casting warm pools of amber light across worn reading tables scattered with open books and
      fallen feathers. Faded tapestries depicting wolves in grandmother's clothing, glass slippers, and spinning wheels
      adorn the stone walls, and in the far corner, a massive illustrated atlas lies open on a pedestal, its pages
      slowly turning on their own as if an invisible hand searches for a forgotten story.
    image: c0d55292fe438fd1d97c2c80cced8922d8b71044234b48c0abeb0039572b0f0b.jpg
    exits:
      w: crafters_workshop
      n: dream_hotel
  kiriton_winter:
    title: Harsh Kiriton Winter
    description: Frost-rimed wooden structures huddle together beneath a merciless grey sky, their rooftops buried under
      heavy drifts of snow while icicles hang like pale fangs from every eave. The settlement's paths are swallowed in
      white, the frozen earth cracked and unyielding, and the skeletal silhouettes of barren trees sway against a biting
      wind that scours the land bare of any warmth or color.
    exits:
      s: first_archae
      n: drifting_through_clouds
    image: 6c316a2e4ae64fbbf318405f7fddc36efe6e5934a6e661d0e088d61e560a57ae.jpg
  underground_river:
    title: An Underground River
    description: A wide, dark river cuts silently through a vaulted stone cavern, its black water catching faint glimmers of
      bioluminescent moss clinging to the slick, dripping walls. Jagged stalactites hang overhead like stone teeth, and
      the air carries the cold, mineral scent of deep earth made almost visible in faint wisps of pale mist drifting
      across the slow current.
    exits:
      w: sleeping_stone_statues
      n: waterfall
    image: 558b91c745ca938541ac524cfc4dc315abff7e2af7b0002cf37c10e58c693ff3.jpg
  waterfall:
    title: A Mountain Waterfall
    description: A breathtaking cascade of crystalline water thunders down the face of a moss-covered granite cliff,
      catching the light in a thousand shimmering droplets that drift like silver mist through the cool mountain air.
      Lush ferns and wildflowers cling to the rocky banks where the churning white water collects into a deep, emerald
      pool below.
    exits:
      s: underground_river
      w: turbulent_waters
    image: 10e024819a16b3bfe3d6d994a2f92f6a64833aadcaed2eaddb575fe46127c5b8.jpg
  crafters_workshop:
    title: Crafter's Workshop
    description: Warm firelight flickers from a stone forge tucked into one corner, its chimney blackened with years of
      soot, while across the room an alchemist's table gleams with glass vials, bubbling retorts, and shelves crowded
      with labeled reagents. A sturdy loom and spinning wheel occupy a quieter alcove, draped with half-finished bolts
      of cloth in rich, earthy hues, the whole space smelling of coal smoke, herbs, and raw wool.
    exits:
      n: general_store
      e: library_fairytales
    image: 699c75864057bbca5646f793eb9ad3776dabbc2c45f0805a9dbd594024c03cba.jpg
    station: forge
lifespan: 30
terrain: inside
levelBand:
  min: 1
  max: 1
difficultyHint: standard
mobs:
  krioshaeu:
    name: Krioshaeu
    role: quest_giver
    spawns:
      - room: krioshaeu_cabin
    description: "A Lustriae woman with salt-and-pepper hair — the only faerie who looks aged — pale iridescent skin, dark
      eyes, and softly rounded ears. Beautiful but slightly off. Her features have a faerie delicacy but there is
      something wild and untamed about her. Her clothing is colorful and deliberately mismatched — patchwork silks,
      embroidered scarves in clashing patterns, a wide-brimmed hat adorned with flowers, feathers, and small dangling
      charms. She looks like a beloved eccentric aunt who dresses however she pleases. Her most striking feature: large,
      strong black raven wings spreading from her back — not the translucent, diaphanous wings of the Lustriae but
      solid, dark, powerful feathered wings. She sits in a cozy cabin interior — a roaring fire, a steaming teapot, two
      cups on the table. One hand holds a teacup. She is smiling warmly, as if the viewer just arrived and she's been
      expecting them. Her dark eyes are kind but ancient — they have seen everyone's last moment and they are not
      afraid. Death dressed like a carnival, waiting with tea."
    image: d54a8a98459cd12cf5f866e9fcd464f72637c064e71767ea760114bf2971232e.png
  naraxian_akathavae:
    name: Naraxian Akathavae
    spawns:
      - room: fortune_teller_parlor
    description: A wrinkled old woman dressed in colorful minstrel garb with an extremely ornate masquerade-style mask
      covering most of their face. They hold an ancient tome that crackles with magic in their left hand, and a flaming
      phoenix feather quill in their right. They have an ornately carved violin floating next to them, and wear a tall,
      overly complicated hat.
    role: dialog
    image: d60ba19e37c9304f720e3b55d94e0284bada92969338661b646292aa46605496.png
  maelsang:
    name: A Dream of Maelsang
    spawns:
      - room: tempest_between_worlds
    description: A tempest given form — a colossal figure emerging from or composed of a raging ocean storm. His body is
      made of churning seawater, dark clouds, and crackling lightning. Waves tower around him. His face is barely
      defined in the storm — just the suggestion of features in the roiling clouds, eyes of lightning, a mouth that is a
      whirlpool. He is in motion — fleeing westward across the ocean, and his passage is destruction. Behind him, ships
      are shattered, waves crash impossibly high, waterspouts spiral into the sky. The ocean itself is being torn apart
      by his panicked retreat. In the far background, the coastline of Ambon is barely visible through the storm. He is
      not attacking — he is running, and the devastation is collateral. A god so afraid of what's behind him that he's
      destroying everything in his path without even noticing.
    image: 90d3ea787353984dc0fb864351a7e47abb8c0849da342eed024034fbec3c75c1.png
    tier: boss
    category: elemental
    level: 1
    drops:
      - itemId: aura_tempest
        chance: 1
  tessikar:
    name: Tessikar the Springwright
    spawns:
      - room: springwright_workshop
    description: A dwarf — short, stocky, broad-shouldered — sitting at a cluttered workbench in a mountain workshop. One
      eye is replaced by a clockwork mechanism that whirs and focuses with mechanical precision, its lens glowing
      faintly amber. One arm is entirely mechanical — brass and copper gears, pistons, and articulated fingers that move
      with impossible delicacy as they work on a small clockwork creation on the bench. His organic hand holds a tiny
      tool. The workshop is magnificent chaos — gears, springs, crystals, half-finished mechanisms, blueprints, tools of
      every kind covering every surface. Crystals from the Lithae mines glow in racks along the walls, some already
      integrated into mechanical housings. Through the workshop window, the city of Tessikon is visible far below on the
      mountainside — his creation, grown from one workshop into a civilization. His expression is pure concentration —
      the look of someone who has forgotten to eat because this particular gear ratio is almost perfect. A god who would
      rather tinker than rule.
    image: 5c37e9f97dd508962c971591a62e0e91e9bc38c296dce379c638e0492c5f2b04.png
    role: prop
  kvarcgagap:
    name: Kvarcgagap the Shining Quartz Void
    spawns:
      - room: void_below_mountain
    role: dialog
    description: "An ancient, primordial being from outside of Ambon. God of bedrock, caverns, precious gems and crystals,
      metal ores, and everything glittering under the ground. A force of nature, he most often takes the form of a
      shimmering liquid the consistency of quicksilver, but shimmering like liquid opal. In this form, he travels freely
      through solid stone, sometimes as a trickle and other times as a great deluge. Sometimes leaving no trail and
      others carving massive underground caverns and seeding the deep places with crystals and metals. "
    image: 6f9afaac0614f870bdf90986658afa2aceeafdf45d2c6f59e6609ea677e51cce.png
  ambon_auringold_academy_mob6:
    name: Shade of Malkuth
    spawns:
      - room: clockwork_battle
    description: A pale, sharp-featured specter cloaked in tattered shadows grips an obsidian dagger aloft, its form
      flickering between solid and incorporeal as if struggling to maintain existence in this realm. Fragments of ornate
      regalia—golden chains, jeweled rings, and threads of silk—cling to the shade's dark silhouette like the fading
      echoes of stolen royalty, while its cold, possessive gaze burns with otherworldly hunger and bitter resentment.
    image: cf8acbcb1c4aced3f78c579249729c6529f0a280449a760a55ca42c6eec65dfd.png
    level: 2
    tier: boss
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
      - itemId: ruby_necklace
        chance: 1
  ambon_auringold_academy_mob7:
    name: Tick the Clockwork Horse
    description: "A gleaming brass automaton horse, its body etched with intricate filigree and spinning gears visible
      beneath translucent panels in its flanks. Its mechanical eyes glow with an amber light, and wisps of enchanted
      steam curl from its nostrils, its polished surfaces reflecting candlelight in mesmerizing patterns. "
    spawns:
      - room: caravan_stable
    role: prop
    category: construct
    image: 7b7ad53665b6757e97ef69d4bc58785ec5d5e1f6cccc176e9ff52ebcfbb6fdf0.png
  ambon_auringold_academy_mob8:
    name: Tock the Clockwork Horse
    description: "A gleaming silver automaton horse, its body etched with intricate filigree and glowing gems visible
      beneath translucent panels in its flanks. Its mechanical eyes glow with an violet light, and wisps of enchanted
      steam curl from its nostrils, its polished surfaces reflecting candlelight in mesmerizing patterns. "
    role: prop
    spawns:
      - room: caravan_stable
    image: 406aeff907501fdb1890d19c75821d59e5dbd185c83e73f4f9f6af09d787c668.png
  kitsarae_scholar:
    name: Kitsarae Scholar
    description: A humanoid with silver and black fur and kind, sleepy, black eyes eyes. Part badger, part human, dressed in
      the academic robes of a scholar.
    image: 7925beec888dc3d98d4da40a1bb2921f64c30d94d0de93ea018fc351a21144e3.png
    spawns:
      - room: kitsarae_study
  kitsarae_minstrel:
    name: Kitsarae Minstrel
    description: A humanoid with rusty fur and clever, amber eyes. Part fox, part human, dressed in minstrel garb.
    spawns:
      - room: kitsarae_study
    image: cb54f2764862bb3303559e3cff2a99363413ae7910f68779be4ed46b7e5c1a85.png
  ambon_auringold_academy_mob11:
    name: Alorae Herald
    description: A tall, ethereal figure shimmers with translucent luminosity—its delicate skin refracting light into
      swirling spectrums of deep purple, golden yellow, and silvery blue, almost crystalline in quality. Starlight
      glimmers within its eyes while hair flows like captured cosmic wind, surrounded by soft prismatic halos that shift
      with each movement, and it glides within gold and cream religious robes, clasping a ceremonial mace carved with
      intricate celestial patterns.
    role: prop
    image: 94fcfa8862f8ab422286a0af3e8975a3385cfc7175353096a95441585b56750a.png
    spawns:
      - room: heralds_of_creation
  orchard_back_sylflorae:
    name: Orchard-Back Sylflorae
    tier: standard
    level: 1
    description: Resembling enormous porcupines, these gentle giants grow apple, pear, fig, starfruit, or dream-fruit trees
      rooted into their backs.
    spawns:
      - room: sylflorae_farm
    role: prop
    image: 91376b7860f909db3256afea24cf8ca576265eb5a4c51eb604cdcce4d5be01c4.png
  mossmantle_sylflorae:
    name: Mossmantle Sylflorae
    tier: standard
    level: 1
    description: Enormous tortoise-like beasts covered in moss, mushrooms, ferns, and medicinal herbs.
    spawns:
      - room: sylflorae_farm
    role: prop
    image: c174b79c1169ccc2801edaa69301dd41b08e3c89218f9543ac32a45533d7592d.png
  vinehorn_sylflorae:
    name: Vinehold Sylflorae
    tier: standard
    level: 1
    description: Massive elk-like wanderers with antlers covered in edible berries or exotic spices.
    spawns:
      - room: sylflorae_farm
    role: prop
    category: elemental
    image: 20c81f32053c712189dd43b9c8b9df937d383d305340703b3b2e21edab3b690e.png
  granary_sylflorae:
    name: Granary Sylflorae
    tier: standard
    level: 1
    description: Mountain-sized aurochs-like beings with waving seed-grasses growing along their spines.
    spawns:
      - room: sylflorae_farm
    role: prop
    image: 766b9f806b2167ef4d9a353f62989f29e11649d63bf6dc0d9b03c38bd7f36ecc.png
  bloomwake_sylflorae:
    name: Bloomwake Sylflorae
    tier: standard
    level: 1
    description: Bright, birdlike plant-beasts with feathers made of wildflowers, orchids, and lilies. The blooms and seeds
      fall to the ground as they fly, leaving a trail of flowers wherever they pass.
    spawns:
      - room: sylflorae_farm
    role: prop
    image: 17c5c23ba12f3b6e080f7924ac1431a65f200ae74abc428fe0f6d062f48437fc.png
  kitsarae_farmer:
    name: Kitsarae Farmer
    description: A humanoid boar with rough, bark line skin, a long snout and protruding fangs. Part boar, part human,
      dressed in simple farmers' garb and holding a pitchfork.
    image: 54f287883da3db3fba6e287f1cf3bb2c15a57a515b771f05fe69a7259805a040.png
    spawns:
      - room: kitsarae_study
  verathaios:
    name: Verathaios
    description: A human man standing in the heart of an impossibly lush magical rainforest, his arms outstretched,
      magically manipulating the plants around him. Vines respond to his gestures, growing and weaving in real time.
      Flowers bloom at his command. Trees bend toward him like sunflowers toward the sun. He wears extraordinary
      clothing — a long coat or robe made entirely of phoenix feathers, iridescent and shimmering with fiery reds,
      oranges, and golds that contrast dramatically with the green jungle around him. The feather-coat seems alive,
      shifting colors as he moves. His face is serene, patient, deeply focused — a gardener at work in the most
      important garden in the world. Every plant around him is unique and magical — bioluminescent flowers, vines
      bearing glowing fruit, herbs that shimmer with healing energy. The caldera's warmth is visible as a golden haze in
      the air. He is not commanding nature — he is collaborating with it. A god who came to a new world and decided to
      plant things.
    spawns:
      - room: verathaios_workshop
    image: 78de31bd4103d3108270d7c7e3ebb997bc71110259b4199b671cac00be03d7e2.png
    role: prop
  dream_wisp:
    name: a flickering dream wisp
    tier: weak
    level: 1
    description: A gossamer ribbon of pale luminescence drifts lazily through the air, its form constantly shifting between
      solid and translucent as if struggling to maintain existence. Wisps of opalescent light trail behind it in slow,
      hypnotic waves, creating the fleeting impression of a half-remembered face before dissolving back into formless
      radiance.
    category: elemental
    image: b7adbcc7ff099e109ccd9be4ae002a8388203e5b9c5575c72a09dd95ae58a07e.png
    spawns:
      - room: endless_starry_void
        count: 2
      - room: heralds_of_creation
      - room: drifting_through_clouds
        count: 2
      - room: fortune_teller_parlor
        count: 2
    behavior:
      template: wander
      params:
        maxWanderDistance: 4
  angry_nebula:
    name: a tiny angry nebula
    tier: standard
    level: 1
    description: A swirling sphere of cosmic dust no larger than a clenched fist roils with violent purples and blues, its
      edges crackling with barely contained energy as it zips erratically through the air, leaving a faint trail of
      sparkling particles in its wake.
    spawns:
      - room: endless_starry_void
        count: 2
      - room: wagon_drifting_stars
        count: 2
      - room: caravan_stable
    image: 98a543f8c919057bd9fbbe0d8fa0308f4c497dfe8a600288802d978ee9278606.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: stardust
        chance: 1
  unruly_tarot:
    name: a deck of unruly tarot cards
    tier: standard
    level: 1
    description: A chaotic swirl of oversized playing cards hovers in mid-air, their gilded edges catching the light as they
      flutter and dance with manic energy—some depicting strange arcane symbols while others show warped, laughing faces
      that seem to shift when you're not looking directly at them. The entire mass pulses with an eerie violet glow,
      cards occasionally shooting out in random directions before snapping back into the roiling cloud like they're
      bound by invisible strings.
    spawns:
      - room: fortune_teller_parlor
    category: construct
    image: c9298312c6d9bbbfd90cbd7a467ed6afcb95fe4a1dea5a02082ffa2e32df88c8.png
  crackling_firmament:
    name: a crackling piece of firmament of creation
    tier: standard
    level: 1
    description: A jagged shard of shimmering sky hangs suspended in mid-air, its surface rippling with arcs of pale blue
      and white energy that crackle and spark with primordial power, casting dancing shadows across nearby surfaces as
      reality seems to bend unnaturally around its edges.
    spawns:
      - room: heralds_of_creation
        count: 2
    image: 144f961ddb4cd2bfffca478d38779f92e77301cbe4d9f85bd505e3a4f51ed492.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: stardust
        chance: 1
  tiny_seamonster:
    name: a tiny sea monster
    description: A diminutive creature no larger than a clenched fist, with translucent bluish skin that glistens wetly and
      a cluster of short, writhing tentacles around a gaping circular mouth lined with needle-like teeth. Two large,
      bulbous eyes glow faintly with bioluminescent green light as it darts erratically through the water.
    image: eb571fb53c8ce6a97cb37659ddfb2c71fd6c14e729872006d44155158c30c17f.png
    spawns:
      - room: sunken_ship_hull
    level: 2
    drops:
      - itemId: kelp
        chance: 1
  seahorse:
    name: a neon colored seahorse
    description: A diminutive seahorse with a translucent body that shimmers in brilliant neon blues and magentas, its
      serpentine tail curling gracefully as bioluminescent patterns dance across its delicate frame like living
      electricity.
    spawns:
      - room: seaweed_thicket
        count: 3
    image: 3aa6f199ca8ff8bcd00469a23a3b94b2ae3e37d4d94f67e399d4f5247c81aea9.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: kelp
        chance: 0.5
  cavern_rat:
    name: a crystalline cavern rat
    tier: standard
    level: 1
    description: A skeletal rodent no larger than a fist, its entire body formed from translucent crystal that catches and
      refracts light into scattered rainbows; its beady eyes glow faintly with an inner luminescence, and delicate
      shards protrude from its spine like a crystalline mane.
    image: 506d659c758b23237589f958e0f779cca3c929e1a5dc23fc0a48571324ad99fb.png
    spawns:
      - room: vault
        count: 2
      - room: gemstone_mineshaft
        count: 2
      - room: shining_crystal_mine
        count: 2
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: stone_fragments
        chance: 0.5
  clockwork_deer:
    name: a clockwork deer
    tier: standard
    level: 1
    description: A delicate brass stag no taller than a hound, with intricate copper gears visible through transparent
      panels along its flanks and neck, its antlers crafted from polished steel that catch the light with each
      mechanical tick of its movements. Its eyes glow with a faint amber luminescence, and wisps of steam occasionally
      escape from vents near its shoulders as it moves with an eerie, synchronized grace.
    spawns:
      - room: clockwork_forest
      - room: deep_clockwork_forest
        count: 2
    image: 94202d0ed57ecea852a93400b0dd7189454e91faee7c94e7ebfa3e10ba7963f2.png
    behavior:
      template: wander
      params: {}
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_sparrow:
    name: a filigree clockwork sparrow
    tier: standard
    level: 1
    description: A tiny mechanical bird no larger than a thumb, its delicate brass body intricately etched with scrolling
      patterns and barely-visible gears visible through transparent crystal panels; gossamer copper wings beat with a
      soft, rhythmic ticking as it hovers on diminutive springs, its jeweled eyes glowing a faint amber.
    spawns:
      - room: deep_clockwork_forest
      - room: clockwork_clearing
      - room: beside_clockwork_pond
    image: 4f0b9851a85ffd1b925dd6801d83f21cb4fc4610d9c38c32fa1573ae78e1dbd3.png
    behavior:
      template: wander
      params: {}
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_koi:
    name: a clockwork koi
    tier: standard
    level: 1
    description: A small mechanical fish with burnished copper scales that shimmer with an oily iridescence, its body
      wrought from interlocking gears and delicate brass plating. Rhythmic clicking emanates from within as crystalline
      fins of frosted glass rotate with hypnotic precision, propelling the diminutive construct through the air with
      unnaturally fluid grace.
    spawns:
      - room: wading_pond
        count: 2
    category: beast
    image: fa6161e40322460d3a4836754311d8473a8bf94f3a976cd0c18c88b3af64eddb.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_frog:
    name: a clockwork frog
    description: A diminutive brass automaton no larger than a fist, with segmented copper limbs articulated at delicate
      joints and a bulbous body etched with intricate gear patterns. Two luminous emerald gems serve as its eyes,
      casting a faint glow as they swivel with mechanical precision, while a small winding key protrudes from its back.
    spawns:
      - room: wading_pond
      - room: beside_clockwork_pond
    image: 48fb4bf8946a3efd4569b1dd39cbf622ac0c32c11be9daa970632619c77c06e5.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_alligator:
    name: a clockwork alligator
    description: A small mechanical reptile with brass plating and copper joints, its segmented tail ticking rhythmically as
      it moves with jerky, predatory grace across the ground. Tiny gears visible through gaps in its corroded metal hide
      catch the light as it snaps its hinged jaw open and closed with a metallic clang.
    spawns:
      - room: clockwork_dias
        count: 2
    tier: elite
    category: beast
    image: 036fc6608c00aa8394614e25043d60cee96941d5e0fe93adb3b4679d4a75dcd6.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 1
  sea_anemone:
    name: a sea anemone
    description: A translucent, gelatinous creature no larger than a human fist clings to the seafloor, its stubby tentacles
      swaying gently in the currents with delicate, rippling motions. Soft hues of pale pink and cream shimmer across
      its translucent body, while its countless thin tendrils undulate hypnotically, seeking sustenance from the water
      around it.
    spawns:
      - room: coral_reef
        count: 2
      - room: ship_graveyard
      - room: underground_river
    image: 33b8297cbf361cab5865637553d78a15e81327e777339d2f0d0b3743cbf2070c.png
    drops:
      - itemId: kelp
        chance: 0.5
  electric_eel:
    name: an electric eel
    description: A sleek, serpentine creature about two feet long with a mottled dark green and black body that glistens
      with moisture, its small beady eyes gleaming with predatory intelligence as faint blue arcs of electricity
      occasionally dance across its slick scales.
    spawns:
      - room: ship_graveyard
        count: 2
      - room: seaweed_thicket
      - room: sunken_ship_hull
    image: 0301dcf9f6f581bb5384c00d772e09d68eca2eba3d16fb6d4685e88dbfd0bb70.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: kelp
        chance: 0.5
  venomous_jellyfish:
    name: a highly venomous jellyfish
    tier: standard
    level: 1
    description: A translucent, bell-shaped creature drifts lazily through the water, its gelatinous body tinged with sickly
      purples and greens that seem to pulse with an inner toxin. Long, wispy tentacles trail beneath it like deadly
      threads, each one shimmering with a faint bioluminescent glow that marks their venom-laden nature.
    spawns:
      - room: coral_reef
      - room: seaweed_thicket
      - room: sandy_shoal
    image: 40036ab669c15613201610ed854b32283130633b795720369e344edcdf0cf8ae.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: kelp
        chance: 0.5
  spiny_starfish:
    name: a spiny starfish
    tier: standard
    level: 1
    description: A small, brick-red starfish sprawls across the seafloor with five stubby arms, its surface bristling with
      blunt spines that give it a rough, defensive appearance; tiny suction cups line the undersides of its limbs as it
      slowly glides across sand and stone.
    spawns:
      - room: sandy_shoal
      - room: turbulent_waters
    image: f4e70308854fc2e3c50c4c4560d7c8f1be3841b464c7276956b4c845132324f4.png
    drops:
      - itemId: kelp
        chance: 0.5
  ice_elemental:
    name: a piercing ice elemental
    tier: standard
    level: 1
    description: A shimmering humanoid form coalesces from swirling frost and glacial mist, its translucent body crackling
      with razor-sharp icicles that jut outward at jagged angles. Its core glows with an ethereal pale blue
      luminescence, and as it moves, crystalline shards rain down around it, leaving trails of frozen air in its wake.
    spawns:
      - room: turbulent_waters
      - room: drifting_through_clouds
    image: 385b6bee1a0245f18cde6a7f2bcc946ddfe106f7eb452625967a907dedc6b054.png
  kirot_aethiryn:
    name: Shade Kirot Aethiryn
    tier: elite
    level: 3
    description: An Alorae who has fallen — tall, with the frame of a divine being, but corrupted. Where a healthy Alorae
      radiates prismatic light, Kirot radiates a sickly darkness. His skin is pale and cracked, with veins of black
      energy visible beneath the surface. His eyes burn with cold green light. His vestments were once white and gold
      but are now stained, tattered, and rewoven with dark threads. He stands in a blighted landscape — dead trees, grey
      earth, withered crops — and from his outstretched hands, tendrils of dark magic reach into the ground, pulling
      skeletal and rotting forms upward. The dead rise around him in a spreading circle. His expression is calm,
      methodical, clinical — this is not madness, it is craft.
    spawns:
      - room: creeping_darkness
    image: 78c1065f5ddcbe3525aca9663578aaf449279628755b5af1e28b5f40f67ddda7.png
  astriel:
    name: Astriel
    tier: standard
    level: 1
    description: A tall, radiant Alorae standing in golden subtropical farmland at sunset. He is luminous — prismatic light
      refracting from his skin, rainbows playing across his white and gold vestments. But his light is gentle here, not
      blinding — he is using it to bless the land. His hands are extended over rows of growing crops, and where his
      light touches the earth, plants surge upward, flowering and fruiting in fast-forward.
    image: 6d25e68d9148fd56f45e55e0208f7e331cae8690967d9c44b40f8f15702cfdfd.png
    spawns:
      - room: heralds_of_creation
  ambonien:
    name: Ambonien
    tier: standard
    level: 1
    description: "Ambonien is draped in animal skins — heavy furs and hides that wrap and layer around their body,
      concealing their form entirely. The skins are rough, unworked, the first practical clothing of someone who has no
      one to teach them craft. The draping obscures any gendered features — this figure could be anyone, could become
      anyone. Only their face and hands are visible. Their skin is the warm brown of freshly turned earth — the soil the
      Creator used. Their hair is dark, thick, wind-tossed, falling to their shoulders. Their eyes are large, dark, and
      startlingly alert — the eyes of someone seeing everything for the first time. There is wonder in that gaze, but
      also confusion, and the very beginning of loneliness. "
    image: 5477884ba8d9b0525938b0e85f92ae70e43e889ccdbb64042f77920ff6af01cb.png
    spawns:
      - room: first_archae
    role: prop
  ambuoroko:
    name: Ambuoroko
    tier: standard
    level: 1
    description: A figure of dark, billowing shadow wrapped in a magnificent ornate cloak, standing atop a rocky outcropping
      overlooking a vast battlefield. Glowing blue eyes burn intensely from within the churning darkness of the hood —
      the only solid feature in the smoke. His hands are extended and from them erupts an enormous display of arcane
      power — cascading blue and white lightning, spiraling geometric patterns of pure magical energy, reality itself
      bending around him. The scale is devastating — the magic he channels dwarfs the landscape below. His cloak billows
      dramatically in the energy discharge.
    image: 54beb14ecc2d6fcca66683e4fe512b75453204b034c187f6d603a7368042cdd9.png
    spawns:
      - room: resistance_camp
    role: prop
  elustriaine:
    name: Elustriaine
    tier: standard
    level: 1
    description: A smaller, younger-looking version of Aineroia — the same Lustriae features, translucent diaphanous wings,
      dark hair, dark eyes, pale mother-of-pearl skin - but more compact, fiercer, with an edge of wildness. She wears
      layered silks in neon pastel tones — bright and cheery — draped and wrapped in a traveling style, with coin
      bracelets on both wrists that catch the light. The bracelets are prominent — scale-like or coin-like metal pieces
      that jingle with movement. A small crossbow is slung at her hip. Her dark hair is wild, adorned with small coins
      and silk ribbons. She has rainbow, diaphanous wings extending from her back like enormous stained glass windows
      that seem to emit an otherworldly light.
    image: 0c8be01cb30ae22ea70a3fc430a8a09423c89be60fe773bb2b196e4152e51b0a.png
    spawns:
      - room: resistance_camp
    role: prop
  geode_fragment:
    name: an animated geode fragment
    tier: standard
    level: 2
    description: A fist-sized chunk of rough grey stone shambles forward on tiny crystalline legs, its cracked exterior
      splitting open to reveal a jagged interior of glittering purple amethyst that catches the light with an eerie,
      pulsing shimmer.
    image: 8e665ee5a222d51a0c5f3301b68622c59817f47ad4006a163baace0d8d238f49.png
    spawns:
      - room: mine_opening
      - room: shining_crystal_mine
      - room: gemstone_mineshaft
      - room: vault
        count: 2
    drops:
      - itemId: stone_fragments
        chance: 0.75
  crystal_drake:
    name: the Crystal Drake
    tier: boss
    level: 1
    description: A massive serpentine creature coils with regal menace, its scales formed entirely of razor-sharp
      crystalline facets that refract light into cascading prismatic rainbows across every surface it touches. Two
      enormous wings of translucent amethyst membrane stretch wide behind a horned head crowned with jagged spires of
      pure quartz, its piercing eyes glowing with an inner violet luminescence.
    spawns:
      - room: vault
    image: 41077ae48c688ba78b0232fd9a468fd2a695946a74ef3e330e19e6b1130ccc20.png
    drops:
      - itemId: quartz_bootz
        chance: 1
      - itemId: stone_fragments
        chance: 0.8
  magma_spawn:
    name: a magma spawn
    tier: standard
    level: 2
    description: A small, roughly humanoid figure formed from cooling volcanic rock, its cracked obsidian shell glowing a
      fierce orange-red at the seams where molten magma churns just beneath the surface.
    spawns:
      - room: gemstone_mineshaft
      - room: shining_crystal_mine
    image: f2f2bbfad65d80b2db22cc923cd22c89906239613f18a69d40b1f95feae1df81.png
    behavior:
      template: wander
      params: {}
    drops:
      - itemId: stone_fragments
        chance: 0.5
  stalactite:
    name: a furious stalactite
    tier: standard
    level: 2
    description: A jagged spike of pale limestone hangs motionless from the cave ceiling, its wet surface glinting faintly
      in the dim light, a thin crack running along its length suggesting it is moments from breaking free.
    spawns:
      - room: void_below_mountain
      - room: mine_opening
    category: elemental
    image: 494bc30b4ae0b97e13566ed5c12af7fa3e12a7e6cba589f5a432f37474e9dba7.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  stalagmite:
    name: a giggling stalagmite
    tier: standard
    level: 2
    description: A small, lumpy column of pale grey stone rises from the cave floor, its rough mineral surface etched with a
      crude, unsettling grin of jagged calcite teeth that seems to widen whenever no one is looking directly at it.
    spawns:
      - room: void_below_mountain
      - room: gemstone_mineshaft
    category: elemental
    image: dd3692c7d65684507c8ed9cba5a5dd31c18658dc5e48612535e3a0fdc3189842.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  fanged_jackelope:
    name: a fanged jackalope
    tier: weak
    level: 2
    description: A small, tawny-furred rabbit crouches low to the ground, its oversized antlers still velvet-soft and
      slightly crooked, while two tiny but wickedly sharp fangs curl over its lower lip.
    spawns:
      - room: foothills_kaerinlith
      - room: path_kaerinlith
      - room: clockwork_clearing
      - room: arrival_king
    image: dbac06930e37a7507c3c977250b6e0fa571e8e6ec3cd7d8a4f52c23912bc2d48.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
  malkuth:
    name: Malkuth
    tier: standard
    level: 1
    description: "A distinctly human man dressed like a caricature of a king or lord. He is handsome in a cold, calculated
      way — sharp features, dark hair, pale skin. His clothing is absurdly elaborate — layer upon layer of royal
      regalia, gold crown encrusted with too many jewels, fur-trimmed robes over embroidered tunics over silk shirts,
      rings on every finger, chains of office stacked upon chains of office. He has overdone it. "
    spawns:
      - room: arrival_king
    role: prop
    image: 5117dee0d0b24223283fa6c5af6bcea8d7a0c089450e6447e02a7b7640985b24.png
  mechanical_fortune_teller:
    name: a mechanical fortune teller
    tier: standard
    level: 1
    description: A small, weathered automaton encased in a glass cabinet, its brass gears and clockwork face visible through
      cracked panes, glass eyes glowing with a faint amber light beneath a painted turban of chipped red and gold.
    spawns:
      - room: carnival_prophecy
    role: prop
    image: 9227885a44956785c52ceaf1bf8f590489c4fe6e1d3ff9042255fc3e04f5b389.png
  kvarcgagap_fragments:
    name: broken fragments of Kvarcgagap
    tier: standard
    level: 1
    description: Scattered across the ground lie jagged shards of translucent quartz, each fragment still faintly pulsing
      with an inner iridescent light — pale golds, blues, and violets shifting like trapped opalescence beneath a
      cracked and cloudy surface, as though something divine and liquid once filled them but has long since drained
      away.
    spawns:
      - room: great_betrayal
        count: 2
    role: prop
    image: 282e89473e87bc551182406e6a26a4a0a18786a40d3e3748d92a3d96e628a185.png
  time_wraith:
    name: a time wraith
    tier: standard
    level: 2
    description: A wispy, translucent figure drifts just above the ground, its tattered shroud shifting between moments like
      a flickering candle flame, now solid, now barely a shimmer of pale silver and faded grey. Empty hollow eyes glow
      with a dim, ghostly light, and its elongated fingers trail behind it like smoke dissolving into forgotten time.
    image: ebdc43cab1d8f0305ce0236387ae3176b373e43f3a6f433801584b9b0af9a1f5.png
    spawns:
      - room: obsidian_dagger
      - room: carnival_prophecy
      - room: lustriae
    behavior:
      template: wander
      params:
        maxWanderDistance: 10
  emberfell_tessikar:
    name: Tessikar the Springwright
    tier: standard
    level: 1
    description: A stout dwarf figure in a heavy leather apron, his arms corded with muscle and streaked with old burn
      scars, stands with the quiet confidence of someone who has bent the world to the shape of his hammer. Flecks of
      obsidian dust glitter in his beard and along the creases of his weathered knuckles, and a faint ember-glow lingers
      in his eyes like the last sparks of a forge that never fully cools. One eye is replaced by a clockwork mechanism
      that whirs and focuses with mechanical precision, its lens glowing faintly amber. One arm is entirely mechanical —
      brass and copper gears, pistons, and articulated fingers that move with impossible delicacy.
    image: ba7831cc48893d041afd0689aea07a7c0b378388aa0271a37820294d3f3f1153.png
    spawns:
      - room: emberfell
    role: prop
  void_elemental:
    name: a crackling void elemental
    tier: standard
    level: 2
    description: A wispy, translucent figure of swirling darkness crackles with faint purple-white sparks along its
      ever-shifting edges, its vaguely humanoid form constantly dissolving and reforming as though struggling to hold
      itself together. Twin pinpricks of cold violet light serve as eyes, flickering unsteadily within the hollow depths
      of its amorphous, shadowy mass.
    spawns:
      - room: world_seed
        count: 2
      - room: obsidian_dagger
      - room: clockwork_battle
        count: 2
      - room: memory_creation
    image: 1c39ed8e25b54664185b85f0f11407bc63531083e3556a6f4345f646536550ce.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: stardust
        chance: 1
  archae_healer:
    name: a humble Archae healer woman
    tier: standard
    level: 1
    description: A slender Archae woman with waist-length dark hair and sharp, slightly pointed ears stands with quiet
      composure, her extremely pale skin almost luminous against the simple earthen robes she wears. Her dark, attentive
      eyes carry a calm warmth, and a small pouch of herbs and wrapped linen bandages hangs at her hip.
    spawns:
      - room: humble_forest_cabin
    role: prop
    image: 73ecd984fb8d0cfa68c3fb66684c6a32d04e352e2074aa629b940ad443e25282.png
  doctor_reinheart:
    name: Doctor Reinheart
    tier: standard
    level: 1
    description: a young Kitsarae reindeer scholar, a humanoid woman with animalistic features. She is a world renowned
      scholar and an expert in every field. She provides refreshment and training for new heroes, and a friendly ear to
      the residents of Auringold.
    image: 2baba8ff70c6e7d5633fa88be0fa46afd2d0edc21a2993c4b04b829f5a104824.png
    spawns:
      - room: auringold_tavern
  madame_herb:
    name: Madame Herb
    tier: standard
    level: 1
    description: A smaller Sylflorae formed entirely from dense tangles of living flowers, vines, and root-fibers gathered
      into the rough shape of a creature. Its body has no clear anatomy beneath the growth; instead, layered iris
      petals, curling stems, moss, and flowering tendrils continuously weave and shift against one another as it moves.
      Long streamer-like leaves trail behind it like flowing hair, while great blooming irises open and close across its
      body in response to mood and attention. Clusters of bird-of-paradise flowers flare from its shoulders and back in
      brilliant bursts of orange, violet, sapphire, and gold, giving it the appearance of a wandering living bouquet
      caught in a permanent state of bloom.
    spawns:
      - room: cozy_inn
    role: prop
    image: 2ad9bf818ef6ae0e771e5676ff834da87462fdb7678fb9eb31de2b5e14d8bd7f.png
  shadow_of_betrayal:
    name: a shadow of betrayal
    tier: standard
    level: 3
    description: A wispy, humanoid silhouette of deep violet-black smoke drifts silently just above the ground, its
      featureless face turned slightly away as though perpetually averting its gaze. Faint, jagged cracks of sickly
      green light fracture across its translucent form, pulsing with a dim, unsettling glow.
    spawns:
      - room: royal_wedding
      - room: sacrificial_altar
      - room: royal_graveyard
    image: ee2e571871ba3ee3bf3d82b946ae02b3cd25a8ee2d18744e5e5a60e51e0e752c.png
  grief_aineroia:
    name: Aineroia
    tier: standard
    level: 1
    description: "A tall, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — dark hair,
      dark eyes, softly rounded ears but she is taller, broader. She walks through the garden, holding a children's
      fairytale book, telling stories that spiral outward as golden magic, forming shapes in the air — the ghostly
      silhouettes of fantastical creatures taking form: a phoenix, a dragon, a glowing jellyfish, a tiny shimmering
      pixie. Her expression is not triumph but grief — tears streaming down her dark eyes even as she creates."
    role: prop
    spawns:
      - room: royal_graveyard
    image: aa41e9a8cf2f0ac6a3ded856c8297c416a8627d11abb2c1b5085cd6f55f5efd7.png
  wandering_spirit:
    name: a wandering displaced spirit
    tier: weak
    level: 3
    description: A translucent, softly glowing figure drifts aimlessly just above the ground, its ethereal form flickering
      between visibility and absence like a candle flame caught in the wind. The ghostly silhouette appears vaguely
      humanoid, its edges dissolving into wisps of pale blue-white mist, features blurred and expression vacant — caught
      in a state between worlds.
    category: undead
    spawns:
      - room: arcane_tempest
        count: 3
      - room: caldera
        count: 4
      - room: shattered_fae_wood
        count: 2
    image: 178ed72cb38d22c2fee0589080351a07db08ce483ce85b62d37f37af267d360e.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 8
  venus_flytrap:
    name: a slithering adventurer-eating venus flytrap
    tier: standard
    level: 3
    description: A knee-high carnivorous plant with a wide, tooth-lined snap-jaw blossom dripping with translucent digestive
      fluid, its mottled green and crimson leaves bristling with coarse trigger hairs. It sways hypnotically on a thick
      fibrous stalk.
    category: elemental
    image: 4c693139ffa7cd163fe9e465b3a99a8d8f1894d54248d9900d167fe81b120c50.png
    spawns:
      - room: verathaios_workshop
        count: 2
      - room: caldera
  pitcher_plant:
    name: a walking pitcher-plant with venomous tentacles
    tier: standard
    level: 3
    description: A squat, bulbous green plant shuffles forward on a tangle of pale root-like legs, its wide-mouthed pitcher
      glistening with sweet-smelling digestive fluid. Slender, violet-veined tentacles writhe lazily around its base,
      their tips beaded with tiny drops of shimmering amber venom.
    spawns:
      - room: verathaios_workshop
      - room: caldera
    image: 3505ce1aff57fceb6dac41aa1a7d85368dfe9908153e38db78290051ec82a5e2.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
  knowledge_gremlin:
    name: a tiny knowledge-stealing gremlin
    tier: weak
    level: 3
    description: A knee-high wrinkled creature with oversized ears and bulging yellow eyes crouches low to the ground, its
      spindly fingers perpetually twitching as though eager to snatch something away. Tattered scraps of stolen
      parchment and broken quill tips are tucked haphazardly into its patchy, matted fur.
    spawns:
      - room: aolexia
        count: 2
      - room: aolia
      - room: shattered_fae_wood
        count: 2
    image: 17baff29f50b9938b2e4b219b0468782edaf2899306fa4326700988449cafaef.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
  flowerpetal_phoenix:
    name: a phoenix formed from flower petals
    tier: standard
    level: 3
    description: A small, delicate bird composed entirely of softly layered flower petals in shades of blush pink, coral,
      and gold, their edges catching the light like living flame. Its wings trail wisps of pollen dust as it moves, and
      tiny ember-like sparks drift upward from its feathered crest like floating seeds on a warm breeze.
    spawns:
      - room: verathaios_workshop
      - room: aolia
      - room: caldera
