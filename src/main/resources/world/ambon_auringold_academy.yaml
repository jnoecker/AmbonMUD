  starlight_staff:
    displayName: Starlight Staff
    description: A slender crystalline staff that pulses with a soft inner glow, its surface etched with constellations that
      shimmer and shift like a living star map. The tip blooms into a radiant cluster of translucent shards, perpetually
      shedding tiny motes of silver-white light that drift downward like falling stardust.
    keyword: ambon_auringold_academy_item3
    slot: weapon
    level: 1
    tier: rare
