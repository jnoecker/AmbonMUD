    room: peanut_olympus
    basePrice: 100
    image: b79374492db840865212029cbd51e33eb6aa98fdbec32ef22a3135a9f25b7951.png
  penguin_plushie:
    displayName: a soft penguin plushie
    keyword: plushie
    description: A pudgy, impossibly soft stuffed penguin wearing a tiny golden crown. It squeaks when squeezed. Braelynn
      has dozens, but this one is clearly special.
    slot: offhand
    armor: 1
    room: braelynn_penguin_nursery
    basePrice: 30
    image: 248f325068a3ac40bf043bfef476e5d4e0d41e16b2aa8da5c09e0a8274ec30a3.png
  royal_goblet:
    displayName: the Royal Goblet of PBrae
    keyword: goblet
