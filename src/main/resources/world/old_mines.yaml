  survivor_hadrik:
    name: Survivor Hadrik
    room: survivors_hollow
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - lost_expedition
      - lost_expedition_deeper
    dialogue:
      root:
        text: Thank the gods — a living face! I'm Hadrik, with the Thornhaven Scholars' Expedition. The others went deeper and
          never came back. I've been trapped here for days. Please — can you help me recover our supply ledger? It's in
          the old supply chamber further in. The scholars back in Thornhaven need to know what happened.
        choices:
          - text: I'll find the ledger.
            next: quest_accept
          - text: What happened to the expedition?
            next: expedition_info
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Bless you. The old supply chamber is somewhere deeper in — past the cave junction and into the rubble areas. Watch
          out for the mine goblins; they've gotten bold since the expedition came in.
        choices:
          - text: I'll be back.
            next: farewell
      expedition_info:
        text: We came from Thornhaven to survey the Old Mines — silver and gem deposits, according to old records. We found
          them, all right. But the deeper tunnels are full of goblins and something worse. The foreman's vault at the
          bottom holds our survey documents. I think they went for those.
        choices:
          - text: I'll find the ledger.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      farewell:
        text: Be careful. The goblins know these tunnels better than we do.
    image: f843522fe01d577796119022175256315285dd815f5bf898227a85b2302687cd.png
quests:
  lost_expedition:
    name: The Lost Expedition
    description: Survivor Hadrik needs you to recover the expedition's supply ledger from somewhere in the deeper mine
      chambers. Find the ledger and return it to him.
    giver: survivor_hadrik
    objectives:
      - type: collect
        targetKey: expedition_supply_ledger
        count: 1
        description: Recover the expedition supply ledger
    rewards:
      xp: 700
      gold: 15
  lost_expedition_deeper:
    name: The Lost Expedition — Deeper Still
    description: The lead scholar and the rest of the expedition went further east — into the goblin warrens beneath the
      Thornwood. Recover the expedition notes from Chieftain Grak's hoard and bring them back to Hadrik.
    giver: survivor_hadrik
    objectives:
      - type: collect
        targetKey: goblin_warrens:expedition_notes
        count: 1
        description: Recover the expedition notes from Chieftain Grak's hoard
    rewards:
      xp: 600
      gold: 20
rooms:
  mine_entrance:
    title: Old Mines — Entrance
    description: A rough-hewn arch of old timber frames the mine entrance, deep in the mountain above the highland trails.
      The air inside is cold and smells of stone dust and old lamp oil. The cave descends from the highlands above via a
      shaft. A short corridor leads south into the mine proper.
    exits:
      u: highland_trails:summit_approach
      s: mine_corridor_a
    image: a23e151a8d2ebe01c60cda83f84b9600dc2197570fb9fca1a6eeae19ca74bd8a.jpg
  mine_corridor_a:
    title: Mine Corridor — Upper Level
    description: A broad timber-shored corridor lit by old lanterns that somehow still burn. The walls have been worked flat
      by a generation of miners. Iron ore seams are plainly visible in the east wall. Mine goblins have taken up
      residence here since the expedition disturbed them. The entrance is north; the main cave junction is south.
    exits:
      n: mine_entrance
      e: iron_seam
      s: cave_junction
    image: 2c42aff2ed88efc976414cc73ac64471fd178cf2fe6133d4ae580e0a548c1260.jpg
  iron_seam:
    title: Iron Seam
    description: A side chamber where a rich iron ore seam runs along the entire length of the wall. Old chisel marks show
      where the original miners worked it. The seam is still largely untapped — whoever comes back with the right tools
      will do well here.
    exits:
      w: mine_corridor_a
    image: 6ad3e519d6716cfa169d20cc6960bf56b39fde0e1c967002fc7559c988d18d8e.jpg
  cave_junction:
    title: Cave Junction
    description: "A natural cavern where three mine tunnels meet. The original mining crew marked each passage with painted
      symbols: a circle for copper to the east, a crescent for silver to the west, and a chevron pointing south toward
      the deeper workings. Kobold diggers patrol the junction, chipping at the walls in imitation of mining."
    exits:
      n: mine_corridor_a
      e: copper_pocket
      w: silver_vein
      s: deeper_shaft
    image: 38ec5cd01aa8670a25042d92b8b745cec8e7fd4fb2bc9076cb5723659e405805.jpg
  copper_pocket:
    title: Copper Pocket
    description: A cramped side-cut where a pocket of copper ore was found and hastily excavated. The walls still show the
      green-tinged copper bloom. The floor is slick with mineral water seeping from above. The junction is back to the
      west.
    exits:
      w: cave_junction
    image: 8e05fc37032ca1922ed48b41c07a7c6229ec707fd7c449d7dc5f4b386a551c03.jpg
  silver_vein:
    title: Silver Vein
    description: A beautifully lit side chamber where a silver ore vein runs at eye level, catching the lantern light with a
      faint shimmer. The original miners built a proper platform to work from — it still stands, barely. The silver is
      clearly premium quality. The junction is back to the east.
    exits:
      e: cave_junction
    image: c0d8c6e5ddf52a743d01cbed29857112298cbb1fd4250bee8d74d74a3635219e.jpg
  deeper_shaft:
    title: Deeper Shaft
    description: The main shaft drops here, shored with heavy timbers, descending into the mountain's heart. The air grows
      colder and damper. Giant rats have nested in the debris on the floor. Survivor Hadrik's camp is visible in a
      hollow to the east. The shaft continues south toward the rubble chamber.
    exits:
      n: cave_junction
      e: survivors_hollow
      s: rubble_chamber
    image: ef4b927e752beb4aaaacebdb3adc191af372c8c348c4c5189a91e6c3e8c9e1ea.jpg
  survivors_hollow:
    title: Survivor's Hollow
    description: A shallow alcove in the shaft wall, just large enough for a bedroll and a small fire. Someone has been
      living here for several days — makeshift torch holders, a blanket, a half-eaten ration. Survivor Hadrik huddles
      here, exhausted but alert. The main shaft is back to the west.
    exits:
      w: deeper_shaft
    image: 8531e0ae659e1d014d0cc59fd8fe6d324897db107cf0f675c803b6892503a27e.jpg
  rubble_chamber:
    title: Rubble Chamber
    description: A wide chamber where part of the ceiling collapsed long ago, filling the floor with broken stone. Someone
      has cleared a path through the rubble to the east. An old supply chest sits half-buried under a fallen beam in the
      corner.
    features:
      supply_chest:
        type: CONTAINER
        displayName: an old supply chest
        keyword: chest
        initialState: closed
        resetWithZone: true
        items:
          - expedition_supply_ledger
    exits:
      n: deeper_shaft
      e: mine_shaft_lower
      s: support_chamber
    image: 877877af514065cd64840ad63b16788d98dd38246734e65baee40f5b82a3e48f.jpg
  mine_shaft_lower:
    title: Mine Shaft — Lower Level
    description: The main shaft continues its descent. The timbers here are older and less reliable. A flooded passage drops
      away further below, its surface dark and still. The rubble chamber is back to the west.
    exits:
      w: rubble_chamber
      s: flooded_passage
    image: ddef1fadb446bee486fdaed66001ed8e7f30c22a11fc5a75b0509c6f1d7da725.jpg
  support_chamber:
    title: Support Chamber
    description: An internal chamber where the mine's structural timbers were maintained. Old tools hang on pegs alongside
      rusted support brackets. A heavy iron lever is mounted on the south wall with a brass plate reading 'VAULT DOOR'.
      Someone has greased it recently.
    features:
      vault_lever:
        type: LEVER
        displayName: a heavy iron lever
        keyword: lever
        initialState: up
        resetWithZone: true
    exits:
      n: rubble_chamber
    image: 35c223684e68c0f2f9e4831922fbdec2e9ccc54dd1b1b546a4ef8effa5cc7c56.jpg
  flooded_passage:
    title: Flooded Passage
    description: A tunnel where groundwater has pooled ankle-deep. The water is cold and carries a faint sulphur smell.
      Stone lurkers lurk at the edge of the lantern light, their grey bodies nearly indistinguishable from the rock. The
      shaft rises to the north; the collapsed run continues south.
    exits:
      n: mine_shaft_lower
      s: collapsed_run
    image: a046d9f4ee97aa9b16f67cd325c3d66e4f9e1bf4ab04d56bdeee51592d155577.jpg
  collapsed_run:
    title: Collapsed Run
    description: A long section of tunnel where the walls have partially buckled inward. The footing is treacherous — every
      step shifts broken stone. At the far end the passage clears and opens into a final chamber. The flooded passage is
      back to the north.
    exits:
      n: flooded_passage
      s: foremans_chamber
    image: d8547a064fa3e5964b80554cf013a30c4cf00d36f1d7f7dfb42aa84c6c723170.jpg
  foremans_chamber:
    title: Foreman's Chamber
    description: The mine foreman's command post at the deepest accessible level. Mine Foreman Droth has claimed it as his
      own territory, barricading the original furniture into a defensive ring. A heavy iron door in the east wall leads
      to the vault — locked. The vault lever in the support chamber above controls it. The collapsed run is back to the
      north.
    exits:
      n: collapsed_run
      e:
        to: wardens_vault
        door:
          initialState: locked
          keyItemId: foreman_key
          keyConsumed: false
          resetWithZone: false
    image: 88b775afc24ede5dac06ba9cd794bbff8a9ae983fda9c998dd1e11cfe3af3c41.jpg
  wardens_vault:
    title: Warden's Vault
    description: "The original mine supervisor's vault: a stone-walled strongroom that served as the mine's repository for
      assay records and ore samples. The walls are natural rock here, uncut, and a rich gemstone formation is visible in
      the far wall. A rough tunnel at the back continues east — whoever cut it was heading toward the cavern systems
      beneath the Thornwood Forest."
    exits:
      w: foremans_chamber
      e: goblin_warrens:mine_connection
    image: 22edf8355b2bbde66370c1b452c0d01ca4b260898ac4726d4e6c72282472c17e.jpg
graphical: true
