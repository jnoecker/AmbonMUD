    image: ee3951210ce7fdf050801d7827f2c5e42e3a0e96b260d5ebd3d4558a6c3770b2.png
  bounty_master_kira:
    name: Bounty Master Kira
    room: bounty_camp
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - wasteland_bounty
    dialogue:
      root:
        text: You look capable. Good — I need capable. I'm Kira, and I run the bounty board out here. The wasteland marauders
          have been raiding caravans from the abandoned outpost to the east. I need their numbers thinned. Kill three
          and bring me proof — their branded armbands will do.
        choices:
          - text: I'll deal with the marauders.
            next: quest_accept
          - text: What is this place?
            next: about_barrens
          - text: Goodbye.
            next: farewell
      about_barrens:
        text: The Barrens. Scrubland, dust, and things that want to kill you. Beyond the World Gate, before the real wilderness
          starts. Marauders settled in an old outpost and started hitting trade routes. The Sand Wyrm's been seen to the
          south — avoid it unless you've a death wish. And there are ruins out east that nobody's explored in a
          generation.
        choices:
          - text: I'll take the bounty.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: That's the spirit. The marauders camp at the abandoned outpost — east past the dust bowl. Bring me three of their
          branded armbands and I'll pay up.
        choices:
          - text: I'll be back.
            next: farewell
      farewell:
        text: Watch for scorpions. They like to bury in the sand.
    image: 4a21871e6bbd51e9be0bdc7a80fcde360633de9604d09ecd52ac34e73ec38dbb.png
quests:
  wasteland_bounty:
    name: "Wasteland Bounty: Marauder Cull"
    description: Bounty Master Kira needs the wasteland marauders at the abandoned outpost thinned out. Kill three and bring
      back their branded armbands as proof.
    giver: bounty_master_kira
    objectives:
      - type: collect
        targetKey: marauder_bounty_proof
        count: 3
        description: Collect 3 marauder bounty marks
    rewards:
      xp: 1200
      gold: 80
rooms:
  wastes_edge:
    title: Barrens Wastes — Southern Edge
    description: "Beyond the World Gate the road vanishes into scrubland and dust. The change is abrupt — green gives way to
      brown, soft earth to cracked clay, and the temperature rises noticeably. The Barrens stretch north and east: a
      flat, sun-blasted expanse of dry ground, sparse brush, and heat haze. The World Gate is back to the south."
    exits:
      s: crossroads_path:world_gate
      n: cracked_flats
      e: dust_bowl
    image: e25dfed644745f6abcfab2ecaf9ad3b80e889bc2403beadd87a3d4a79f45aae2.jpg
  cracked_flats:
    title: Cracked Flats
    description: A broad expanse of cracked clay baked to ceramic hardness by the sun. Dust scorpions skitter across the
      surface, their carapaces blending with the pale ground. Heat waves distort the horizon. A dried riverbed cuts
      through the landscape to the north. The edge of the wastes is back south; the bounty camp is to the west.
    exits:
      s: wastes_edge
      n: dried_riverbed
      w: bounty_camp
    image: f7f823be228ead67b4197c9273a346dbe004892b003ddb4ebf879ecb2d022906.jpg
  dust_bowl:
    title: Dust Bowl
    description: A depression in the landscape where the wind concentrates dust into choking clouds. Visibility drops to a
      few paces. The dust gets in everything — eyes, mouth, gear. Something moves in the murk, low to the ground. The
      wastes edge is back west; an abandoned outpost is visible to the east.
    exits:
      w: wastes_edge
      e: abandoned_outpost
    image: 48fb49589699c7cc0fc611d6d8cfce8e3fe2954dff3c19cbb106bb6f2086c8d2.jpg
  bounty_camp:
    title: Bounty Camp
    description: A tough, practical camp of canvas tents and firebreaks set up at the edge of the Barrens. Bounty Master
      Kira operates from a folding table covered in wanted posters and territorial maps. A notice board is nailed to a
      post — the first organised presence in the wasteland. The flats stretch east.
    exits:
      e: cracked_flats
    image: 10a3a723908133c45248effcdfc587c0cd43e4c68e3b117e6fb7d836ec7ed839.jpg
  dried_riverbed:
    title: Dried Riverbed
    description: A wide channel of smooth stones and cracked mud that hasn't seen water in years. Sand lurkers have
      colonised the deeper sections, hiding in the shade of the eroded banks. The riverbed runs roughly east toward
      bleached bones visible in the distance. The cracked flats are back south.
    exits:
      s: cracked_flats
      e: bleached_bones
      n: wind_worn_cliffs
    image: f6ed548b31534bfb7f5e078b647a01fcd694517d107b236bbe78d4c8358d87e4.jpg
  bleached_bones:
    title: Bleached Bones
    description: The riverbed widens here around the skeletal remains of enormous creatures — ancient bones bleached white
      by centuries of sun. Whether these are the remains of wyrms, dragons, or something else is impossible to say. The
      scale is sobering. The riverbed continues west; a scorpion den lies to the south.
    exits:
      w: dried_riverbed
      s: scorpion_den
    image: 24c321cccb9e7f11134af917a5c6fece4288b09130c33d282ada64f28b1d4efb.jpg
  scorpion_den:
    title: Scorpion Den
    description: A rocky hollow honeycombed with burrows where venomfang scorpions have established a colony. The ground is
      littered with shed carapaces, old kills, and the distinctive curved tracks of large scorpions. A venomfang
      scorpion guards the largest entrance with territorial aggression. The bones are back to the north.
    exits:
      n: bleached_bones
    image: b9b1040b0152599d098a763afedb996f59a80309d7dacaf80f38296c5c357230.jpg
  wind_worn_cliffs:
    title: Wind-Worn Cliffs
    description: Low sandstone cliffs eroded into bizarre shapes by centuries of wind. The formations create natural
      shelters and ambush points. The view from the cliff-top reveals the wyrm's territory to the north — disturbed
      ground and sand mounds marking its hunting range. The riverbed is back to the south.
    exits:
      s: dried_riverbed
      n: wyrm_territory
    image: 19b7951d2d581d9d21b795a2b76f94596d01d0b24a028d5156d71d78fea1b884.jpg
  abandoned_outpost:
    title: Abandoned Outpost
    description: The ruins of a border outpost — thick walls of sunbaked brick, collapsed watchtowers, and a courtyard open
      to the elements. Wasteland marauders have occupied the standing structures, using the defensible position as a
      base for raiding caravans on the trade road. The dust bowl is back to the west.
    exits:
      w: dust_bowl
      e: buried_ruins
    image: 6c1a3cd6826844e8056a35c01844047f23bb7f5304dc57ff0065328e78bf6656.jpg
  buried_ruins:
    title: Buried Ruins
    description: Half-swallowed by the encroaching sand, the remains of a much older settlement protrude from the dunes.
      Carved stonework of a style predating Thornhaven by centuries is visible where the wind has swept the sand clear.
      A stone chest sits exposed in a cleared excavation pit. The outpost is back to the west.
    features:
      excavation_chest:
        type: CONTAINER
        displayName: a stone chest
        keyword: chest
        initialState: closed
        resetWithZone: false
        items:
          - sand_crystal
          - sand_crystal
    exits:
      w: abandoned_outpost
    image: 481856ff823dae3f0fc6236329ce88ceb949f716bd106eb88fad8ce1b5c24ec5.jpg
  wyrm_territory:
    title: Wyrm Territory
    description: The ground here is disturbed — massive furrows ploughed through the hard-packed sand, sand mounds heaped in
      irregular patterns, and the remains of large animals picked clean. The Sand Wyrm hunts this stretch of wasteland.
      Its lair lies north — a wide crater in the earth from which a low rumbling can be felt through the ground. The
      cliffs are back to the south.
    exits:
      s: wind_worn_cliffs
      n: sand_wyrm_lair
    image: aa4a2d1944d96ddfa08ea64a2438dabc7f2f77f2a23729f889b6ef2c05a8026d.jpg
  sand_wyrm_lair:
    title: Sand Wyrm Lair
    description: A massive crater in the desert floor, its sides smooth and slick from the constant passage of the Sand
      Wyrm's armoured body. The creature itself lies coiled at the center — a segmented, eyeless horror the length of a
      city street, its mandibles working slowly. The air vibrates with its subterranean rumble. The wyrm territory is
      back to the south.
    exits:
      s: wyrm_territory
    image: 188dbc9009bbb6f23bd912262337df095479248af6598fb7b81b51a6e5056ad2.jpg
graphical: true
