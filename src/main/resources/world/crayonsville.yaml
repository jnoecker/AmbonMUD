  the_chromatic_lord:
    name: The Chromatic Lord
    description: The supreme ruler of Crayonsville, rendered in all colors simultaneously in perfect harmony, their presence
      commanding respect and awe.
    tier: boss
    spawns:
      - room: the_golden_gallery
    level: 5
    image: 5e8d9f40daf8f5d7ef94488c7d91b845ee1b789c2569a43c3866f1be85e19b02.png
  oil_slick_sprite:
    name: Oil Slick Sprite
    description: A small, iridescent creature that seems to exist between states of liquid and solid, reflecting light in
      impossible ways.
    tier: weak
    spawns:
      - room: the_azure_fountain_district
    level: 5
    image: e0f2cb637969a979c54bc451b1877a9dc4c5ba5686dd56a050b0a138dae09112.png
  hue_harvester:
    name: Hue Harvester
    description: A industrious figure painted in earthy browns and greens, dedicated to gathering and processing pigments
      from Crayonsville's depths.
    tier: standard
    spawns:
      - room: the_orange_orchard
    level: 5
    image: 105174a1f48dab2ec31b16c743f1efd3c64d281fe2177727bc99415c54acc64f.png
  ink_echo:
    name: Ink Echo
    description: A spectral being composed of flowing ink and dark purples, leaving written words in the air as it drifts
      through the archives.
    tier: standard
    spawns:
      - room: the_indigo_inkwell_archives
    level: 5
    image: a5319606b0a2b19df92283293e743194d7dbdcd9c53372c2c8132733d41f35b1.png
  shade_sculptor:
    name: Shade Sculptor
    description: An artisan entity rendered in deep magentas and teals, skilled in shaping shadow and light into artistic forms.
    tier: elite
    spawns:
      - room: the_sienna_studio_district
    level: 5
    image: d7f349c540bb633ad0658da1d06eba7a1d28e2eefcdccdfcd1ba116ab4bc0a44.png
  pastel_pixie:
    name: Pastel Pixie
    description: A tiny winged creature painted in soft, dreamy pastels of lavender and rose, fluttering about with carefree grace.
    tier: weak
    spawns:
      - room: the_mauve_meditation_chambers
    level: 5
    image: 1a44bd71d0474957f612c41398900e8ff7bded93bed82b30b8fe0741bb85df9c.png
  masterwork_golem:
    name: Masterwork Golem
    description: A towering construct painted in every color of the spectrum in perfect artistic balance, serving as
      protector of the town's greatest treasures.
    tier: elite
    spawns:
      - room: the_aquamarine_amphitheater
    level: 5
    image: 45647eb80434744ed731067c1f1275917fb9b86ff4feb5c21723227776086a95.png
