    image: 38cd19697528b281ac4fcabd1e5408fc358b7d2c2871426d4896c56227bb9611.png
    keyword: scroll_of_color_theory
  blessed_pigment_dust:
    displayName: Blessed Pigment Dust
    description: Finely ground powdered colors blessed by the Chromatic Lord, useful for crafting and imbuing items with
      chromatic power.
    room: the_violet_vendor_s_row
    image: ee38c4a401d9807f5c75f80690871ba7bc0cb36ae990baf368515028b51050b1.png
    keyword: blessed_pigment_dust
  ancient_art_key:
    displayName: Ancient Art Key
    description: A key carved from solidified rainbow light, capable of unlocking the deepest secrets of Crayonsville's
      hidden galleries.
    room: the_amber_archive_of_dreams
    image: 596784751a11487c73903a68ff4fef202c8cdf94d0cd665f7c118d7f94deddac.png
    keyword: ancient_art_key
  dream_journal:
    displayName: Dream Journal
    description: A leather-bound book filled with blank pages made of pressed dream-petals, awaiting the thoughts and
      sketches of inspired artists.
    room: the_lavender_laboratory
    image: 794e7b28009253ad3f6470ef9cd73dfb8d95dc91632b6bb1af8c4b3e448f01d8.png
    keyword: dream_journal
  spectral_compass:
    displayName: Spectral Compass
    description: A compass whose needle points not north, but toward the nearest source of genuine artistic inspiration
      within Crayonsville.
    room: the_celadon_cartographer_s_lodge
    image: bfc336df2079769c2d6e6785c809cb05cc02778210669903ed06bbadedfd1bdd.png
    keyword: spectral_compass
