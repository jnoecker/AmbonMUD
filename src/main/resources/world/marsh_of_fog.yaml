items:
  bog_root:
    displayName: a bog root
    keyword: root
    description: A gnarled root dug from the waterlogged soil of the marsh. Marshy, pungent, and medicinally valuable to
      those who know how to use it.
    basePrice: 12
    image: 98619604780ddafa80a9867fd225420cb5af5c7032d0e842fca44d1e37c12692.png
  nightshade_flower:
    displayName: a nightshade flower
    keyword: nightshade
    description: A small, dark-petalled flower that only blooms deep in the marsh. Toxic in large quantities; invaluable in
      small ones.
    basePrice: 18
    image: 287018a5b694eb78c1067c64113ab4dbc1458273fada43f29bd1e1dee5dde98c.png
  muck_crystal:
    displayName: a muck crystal
    keyword: crystal
    description: A cloudy crystal precipitated from the mineral-rich bog water. Strange energy hums faintly within it.
    basePrice: 20
    image: 79d1f173dfdfdcc17b87e817847a9c4a818dad4021b5fe4d26aeaa1dab00b828.png
  swamp_slime:
    displayName: a glob of swamp slime
    keyword: slime
    description: A viscous, foul-smelling substance harvested from marsh creatures. Some alchemists will pay for it.
    basePrice: 8
    image: fcdb35d293ad66555f30083f0d0af82bed03ff88a01bd0bd851ba77717a4c3e2.png
  wraith_essence:
    displayName: a vial of wraith essence
    keyword: essence
    description: A sealed vial of dark mist that swirls on its own. Obtained from a marsh wraith. Alchemically significant.
    basePrice: 35
    image: 8a0aaec8403c6d1442601f627065462df67a9b2c77318c26614bce6b192a5c4d.png
