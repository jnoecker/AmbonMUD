  hedge_witch_mossfoot:
    name: Hedge Witch Mossfoot
    room: mossfoot_hut
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - witchs_request
    dialogue:
      root:
        text: Hmm. A visitor who didn't get lost in the bog. Either you're skilled or lucky, and I find both interesting. I am
          Mossfoot. I have use of three things from this marsh — and I'll make it worth your trouble.
        choices:
          - text: What do you need?
            next: herb_request
          - text: What can you tell me about the marsh?
            next: marsh_lore
          - text: Goodbye.
            next: farewell
      herb_request:
        text: Two bog roots from the leech hollow — you'll find them growing at the water's edge. And one nightshade flower from
          the deep clearing east of the fungal dell. Difficult to reach, but the path is passable if you're careful.
        choices:
          - text: I'll gather them.
            next: farewell
          - text: What's in the eastern fen?
            next: eastern_lore
      marsh_lore:
        text: The Marsh of Fog is older than Thornhaven. The fog is natural — mineral vapour from the bog water. The wraiths are
          not natural. Something in the eastern barrows has been bleeding darkness into the fens for years. I study it.
          I haven't solved it.
        choices:
          - text: What do you need?
            next: herb_request
          - text: Goodbye.
            next: farewell
      eastern_lore:
        text: The eastern fen borders the Dark Barrows — ancient burial mounds, very old, not wholesome. I wouldn't recommend it
          unless you're well-prepared. Whatever is in those barrows is active.
        choices:
          - text: I'll gather the herbs.
            next: farewell
          - text: Goodbye.
            next: farewell
      farewell:
        text: Mind your step. The bog has moods.
    image: c81b504ee2769db8958d5228c0ee33a1000b8e60039b2392e6b85880ec146766.png
shops:
  mossfoot_herbs:
    name: Mossfoot's Herb Trade
    room: mossfoot_hut
