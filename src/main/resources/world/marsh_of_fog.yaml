    image: a856951d37fb5064ccb0d75bdd5f99c4e66faea9d38b375b0bf831ee82274289.jpg
quests:
  witchs_request:
    name: The Witch's Request
    description: "Hedge Witch Mossfoot needs rare herbs from the marsh: two bog roots from the leech hollow and one
      nightshade flower from the deep clearing to the east. Gather them and return to her."
    giver: hedge_witch_mossfoot
    objectives:
      - type: collect
        targetKey: bog_root
        count: 2
        description: Gather 2 bog roots from the leech hollow
      - type: collect
        targetKey: nightshade_flower
        count: 1
        description: Gather 1 nightshade flower from the nightshade clearing
    rewards:
      xp: 600
      gold: 25
rooms:
  western_bog:
    title: Western Bog — Edge of the Marsh
    description: "The cobblestone road dissolves into wet clay here, and the fog begins in earnest: a low white mist that
      clings to the ground and blurs distances. The smell is heavy with peat and standing water. Thornhaven is back to
      the west along the road. The bog path continues east."
    exits:
      w: cobblestone_road:fog_threshold
      e: bog_trail
    image: a09f50e25ec470457192fee537a03e56de97fb8d8289dd4f00d8cfd87ed5681d.jpg
  bog_trail:
    title: Bog Trail
    description: A raised path of packed earth and old planks winds through the marsh. The fog is thicker here, and sounds
      carry strangely — a splash somewhere to the south, something rustling to the north. Mossfoot's hut is through the
      reeds to the north. The main bog opens to the east, and the leech hollow lies south.
    exits:
      w: western_bog
      n: mossfoot_hut
      e: open_marsh
      s: leech_hollow
    image: fc7033805fb0a8948c6d774dd2e82afb7b986a75c8226b1f19ad1fe9df1e945a.jpg
  mossfoot_hut:
    title: Mossfoot's Hut
    description: A low stone-and-turf structure perched on a dry hummock above the bog. Bundles of dried herbs hang from
      every beam. Glass jars of dark liquid line the single shelf. Hedge Witch Mossfoot moves around the space with
      complete assurance. Type 'list' to browse her herbs.
    exits:
      s: bog_trail
    image: afb9686c5fa74893b46286b94219acdf6e45841649f0a31d7ad591f4a54654fa.jpg
  leech_hollow:
    title: Leech Hollow
    description: A murky basin where the bog water pools deepest. The surface is calm but something moves beneath it. Bog
      leeches hunt in the shallows here, propelled by slow undulations. Bog roots grow thickly along the waterline,
      their knobbed tips just above the surface.
    exits:
      n: bog_trail
      e: wisp_clearing
      s: deep_mire
    image: 54cd2899d3768205ec8c74434e7da46e30b443d40bd73d88317db5091b1889b7.jpg
  wisp_clearing:
    title: Wisp Clearing
    description: A patch of open fog where lights drift in slow, purposeless patterns — will-o'-wisps, pulsing cold
      blue-green. They drift toward anything warm with unnerving patience. The leech hollow is back to the west.
    exits:
      w: leech_hollow
    image: 329ca55f7b0b4bb865ff6057dafeb7ecf5ff957444464ae14eedcaa97b4a756c.jpg
  deep_mire:
    title: Deep Mire
    description: "The deepest part of the open bog: soft ground that flexes underfoot, dark water in every low spot, and
      mineral crystals visible in the exposed peat bank. The fog is so thick here that visibility drops to a few feet.
      The leech hollow is north; the wraith grounds are south; the serpent waterway is east."
    exits:
      n: leech_hollow
      s: wraith_grounds
      e: serpent_waterway
    image: 22e513e6c6c8566bbdce8e55a863d4dc655e1c9e52887538b965f4b13835f78a.jpg
  wraith_grounds:
    title: Wraith Grounds
    description: A stretch of fog-shrouded bog where marsh wraiths manifest — translucent figures that drift between the
      reeds and seem to be looking for something they lost long ago. The air is several degrees colder than the rest of
      the marsh. The deep mire is back to the north.
    exits:
      n: deep_mire
    image: 40a0d0c5b776c5dcea1596b29cbd66c9cbca308064fe02919a148a9eaff25335.jpg
  serpent_waterway:
    title: Serpent Waterway
    description: A slow channel of dark water threading through the eastern bog. Swamp serpents glide between the reed
      banks. The channel smells of mud and scale. The deep mire is back to the west; the eastern fen edge lies further
      east.
    exits:
      w: deep_mire
      e: eastern_fen_edge
    image: fc6dc3a379ef7de976081fdda83a936cb8bfeef09d34d9b98ea168d166d07be4.jpg
  eastern_fen_edge:
    title: Eastern Fen Edge
    description: The marsh thins here at its eastern boundary, giving way to firmer, darker ground. The fog lifts slightly,
      and through the gaps you can see standing stones and low earthen mounds on the horizon to the east — the Dark
      Barrows, grim and quiet. The serpent waterway is back to the west.
    exits:
      w: serpent_waterway
      e: dark_barrows:barrow_approach
    image: 3c34cbc4f49d5ea11eb68ec536f0e440a99d869fb66441895c41ad66364049f4.jpg
  open_marsh:
    title: Open Marsh
    description: A broad expanse of open bog where the reeds grow tall and the sky is a white disc in the fog. The ground
      squelches underfoot. The bog trail is back to the west; a boggy inlet lies north; and the twisted tree line is to
      the east.
    exits:
      w: bog_trail
      n: boggy_inlet
      e: twisted_trees
    image: 3ab5dc8c9b7d69b6b1f4baebb003eb5d931f197ffe619ed5f401f8973e431e05.jpg
  boggy_inlet:
    title: Boggy Inlet
    description: A finger of open water pushing north into the bog, its banks bright with marsh vegetation. Small birds pick
      insects from the surface. It is oddly peaceful here despite the general atmosphere of the marsh. The open marsh is
      back to the south.
    exits:
      s: open_marsh
    image: 5322b1f316f54abf8853c8771db13ca97f2566de25bf0ae07a8f360e14d925b7.jpg
  twisted_trees:
    title: Twisted Trees
    description: A stand of willow and alder bent into contorted shapes by years of fog and wind. The light barely
      penetrates. Something in the upper branches watches without making sound. The open marsh is to the west; the
      fungal dell lies south; a path through the darkening trees leads east toward barrow territory.
    exits:
      w: open_marsh
      s: fungal_dell
      e: dark_barrows_path
    image: ae1deba307619e39e7f694995db25bd3072dbf5a35e84e7a3d9fe04606a08693.jpg
  dark_barrows_path:
    title: Dark Barrows Path
    description: A barely-visible track through the eastern margin of the marsh, heading north toward the Dark Barrows. The
      ground is firmer here but the fog clings. The twisted trees are back to the west.
    exits:
      w: twisted_trees
      n: dark_barrows:barrow_approach
    image: af3c3acc556ac8873ac619f633c2cb4522add141cd9d995979cb9d64dc866424.jpg
  fungal_dell:
    title: Fungal Dell
    description: "A sunken hollow where enormous fungi have colonized every surface: shelves of bracket fungus up the
      trunks, caps as wide as shields across the floor, and networks of pale mycelium threading through the soil. Fungal
      hulks move ponderously through the dell. The twisted trees are back to the north; the nightshade clearing is to
      the east."
    exits:
      n: twisted_trees
      e: nightshade_clearing
    image: 229795237ba65845f5fa0da719ce8afe809bd48d597f4893a2c4ebc6b1657dcd.jpg
  nightshade_clearing:
    title: Nightshade Clearing
    description: "A small clearing in the deep marsh where nightshade plants grow thick: dark stems, dark leaves, and small
      dark flowers that seem to absorb light rather than reflect it. The clearing has an atmosphere of concentrated
      quiet. The fungal dell is back to the west."
    exits:
      w: fungal_dell
    image: 4aac8723ab496cb97fca0d265c3dc4ffef6fb622872c5ad5ad5ed096b450ebe7.jpg
graphical: true
