    respawnSeconds: 75
    xpReward: 40
    faction: iron_order
    drops:
      - itemId: prize_coupon
        chance: 0.35
  free_swords_mascot:
    name: "a Free Swords mascot"
    room: spell_status_lab
    tier: standard
    level: 3
    respawnSeconds: 75
    xpReward: 40
    faction: free_swords
    drops:
      - itemId: applause_horn
        chance: 0.1
  queue_gremlin:
    name: "a queue gremlin"
    room: mob_templates
    tier: standard
    level: 3
    drops:
      - itemId: bug_ticket
        chance: 0.45
      - itemId: checklist_shard
        chance: 0.2
  regression_ghost:
