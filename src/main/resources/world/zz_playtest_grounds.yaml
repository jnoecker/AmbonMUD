    level: 5
    drops:
      - itemId: squeaky_crown
        chance: 0.5
      - itemId: qa_hammer
        chance: 0.4
      - itemId: audit_lantern
        chance: 0.4
      - itemId: regression_medal
        chance: 1

quests:
  squeaky_cleanup:
    name: "Squeaky Cleanup"
    description: "Inspector Quibble wants the Combat Yard thinned out. Defeat three rubber chicken brigands before they organize a parade."
    giver: inspector_quibble
    objectives:
      - type: kill
        targetKey: playtest_grounds:rubber_chicken_brigand
        count: 3
        description: "Defeat 3 rubber chicken brigands in the Combat Yard"
    rewards:
      xp: 250
      gold: 20
  sparkle_for_science:
    name: "Sparkle for Science"
    description: "Botanist Petaltoss needs two sparkle ore samples and two bundles of giggleweed for a potion that is hopefully medicinal."
    giver: botanist_petaltoss
    objectives:
      - type: collect
        targetKey: sparkle_ore
        count: 2
        description: "Gather 2 sparkle ore from the Crafting Yard"
      - type: collect
        targetKey: giggleweed
        count: 2
        description: "Gather 2 giggleweed from the greenhouse"
    rewards:
      xp: 300
      gold: 25

