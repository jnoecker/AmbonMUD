    room: economy_district
    items:
      - bonk_baton
      - debugger_hat
      - padded_lab_coat
      - starter_seltzer
      - applause_horn
      - sensible_tonic
      - laminated_checklist

trainers:
  academy_master:
    name: "Professor Bonkles"
    classes:
      - WARRIOR
      - MAGE
      - CLERIC
      - ROGUE
      - RANGER
    room: arrival_hub

rooms:
  arrival_hub:
    title: "Arrival Hub - Dialogue, Quest, and Trainer Test"
    description: "A round marble plaza built by someone who thought onboarding should feel like entering a wizard circus. Brass banners identify each wing of the test grounds, while a fountain shaped like a smug turnip spits sparkling water into a tiled basin. The room is unmistakably a hub, but the decorative cherubs are all wearing safety goggles."
    exits:
      north: feature_corridor
      east: economy_district
      south: combat_yard
      west: crafting_yard
      up: worldstate_overlook
    features:
      orientation_board:
        type: SIGN
        displayName: "the orientation board"
        keyword: board
        text: "This hub tests dialogue, quest discovery, and trainer flows. Keys, starter supplies, and questionable confidence are available here."
  feature_corridor:
    title: "Feature Corridor - Door and Sign Test"
    description: "A polished hall of oversized labels and aggressively helpful arrows. Every torch wears a neat little placard explaining what lighting is. The corridor smells faintly of lemon wax and workshop chalk."
    exits:
      south: arrival_hub
      north:
        to: lock_gallery
        door:
          initialState: locked
          keyItemId: brass_qa_key
          keyConsumed: false
          resetWithZone: true
      east:
        to: wafer_annex
        door:
          initialState: locked
          keyItemId: wafer_qa_key
          keyConsumed: true
          resetWithZone: true
    features:
      caution_placard:
        type: SIGN
        displayName: "a caution placard"
        keyword: placard
        text: "North tests a reusable keyed door and locked container. East tests a consumable keyed door. Please do not eat the hardware unless explicitly told to."
  lock_gallery:
    title: "Lock Gallery - Reusable Key and Locked Container Test"
    description: "An oak-paneled gallery where one wall displays absurdly ornate locks and the other displays framed sketches of even more dramatic locks. A velvet rope protects a single chest, which somehow makes the room feel both important and deeply unserious."
    exits:
      south: feature_corridor
      north: puzzle_foyer
    features:
      sample_locker:
        type: CONTAINER
        displayName: "the sample locker"
        keyword: locker
        initialState: locked
        keyItemId: brass_qa_key
        keyConsumed: false
        resetWithZone: true
        items:
          - prize_coupon
  wafer_annex:
    title: "Wafer Annex - Consumable Key Door Test"
    description: "A tiny annex beyond the wafer-locked door. The walls are painted with triumphant pastries wearing crowns. It exists entirely to celebrate the concept of a single-use key and does so with unnecessary enthusiasm."
    exits:
      west: feature_corridor
  puzzle_foyer:
    title: "Puzzle Foyer - Riddle and Sequence Test"
    description: "A round chamber beneath a ceiling painted with moons, gears, and laughing owls. Three brightly colored levers jut from the floor like theatrical mushrooms, while the Sphinxette of Compliance lounges nearby on a cushion embroidered with tiny check marks."
    exits:
      south: lock_gallery
    features:
      red_lever:
        type: LEVER
        displayName: "the red lever"
        keyword: red
        initialState: up
        resetWithZone: true
      blue_lever:
        type: LEVER
        displayName: "the blue lever"
        keyword: blue
        initialState: up
        resetWithZone: true
      green_lever:
        type: LEVER
        displayName: "the green lever"
        keyword: green
        initialState: up
        resetWithZone: true
  prize_closet:
    title: "Prize Closet - Hidden Exit and Reward Test"
    description: "A tiny secret closet lined with velvet curtains, brass confetti cannons, and shelves of prizes nobody strictly needs. A golden spotlight falls on a single reward chest while painted stars twinkle across the ceiling."
    exits:
      south: puzzle_foyer
    features:
      reward_chest:
        type: CONTAINER
        displayName: "the reward chest"
        keyword: chest
        initialState: closed
        resetWithZone: true
        items:
          - starter_seltzer
          - applause_horn
  combat_yard:
    title: "Combat Yard - Basic Combat and Kill Quest Test"
    description: "A fenced practice yard strewn with straw targets, dented shields, and one extremely dramatic banner reading BONK WITH PURPOSE. Rubber chicken brigands strut around the sand while a confetti slime leaves festive skid marks wherever it oozes."
    exits:
      north: arrival_hub
      south: spell_status_lab
  spell_status_lab:
    title: "Spell and Status Lab - Ability, Faction, and Enchanting Test"
    description: "A tiled chamber humming with bottled lightning and polite danger. Racks of crystal rods surround an enchanting table etched with cautionary footnotes. Two rival faction trainees glare at each other over a tray of crackling biscuits."
    exits:
      north: combat_yard
    station: ENCHANTING_TABLE
  economy_district:
    title: "Economy Arcade - Shop, Bank, Trade, Auction, and Mail Test"
    description: "This lavish arcade looks like a bank lobby collided with a toy store. Brass teller windows glitter under chandeliers made of tiny abacuses, and neatly labeled counters invite you to buy, sell, store, mail, barter, and generally overcomplicate your pockets."
    exits:
      west: arrival_hub
      north: tavern_social_hall
      east: dungeon_portal_pavilion
      south: housing_showcase
    bank: true
  tavern_social_hall:
    title: "Tavern of Socially Acceptable Yelling - Social and Lottery Test"
    description: "A jubilant tavern under a ceiling of paper lanterns shaped like singing fish. The tables are carved with old guild tags, dramatic poetry, and suspiciously good doodles of dragons in aprons. Every stool wobbles with deliberate comic timing."
    exits:
      south: economy_district
      north: guild_group_staging
      east: playtest_arena:arena_entry
    tavern: true
  guild_group_staging:
    title: "Guild and Group Staging Hall - Organization Test"
    description: "A broad hall with chalk circles on the floor for forming parties, posing dramatically, and arguing about raid strategy. Parade shields hang from the rafters, each painted with a different fake guild crest: a duck, a teapot, a very stern carrot."
    exits:
      south: tavern_social_hall
  housing_showcase:
    title: "Housing Showcase - Housing and Workbench Test"
    description: "A model home assembled from lacquered timber, cheerful nonsense, and at least one architect's fever dream. One corner features a tidy workbench stacked with flat-pack shelves and tiny brass knobs sorted by mood."
    exits:
      north: economy_district
    station: WORKBENCH
  crafting_yard:
    title: "Crafting Yard - Mining and Smithing Test"
    description: "An open-air forge yard where anvils ring under striped awnings and a sparkle ore seam glitters from a decorative stone outcrop. The entire place smells of hot iron, citrus polish, and ambition."
    exits:
      east: arrival_hub
      north: greenhouse_of_suspicious_herbs
    station: FORGE
  greenhouse_of_suspicious_herbs:
    title: "Greenhouse of Suspicious Herbs - Herbalism and Alchemy Test"
    description: "A glass-roofed greenhouse fogged with warm mist and botanical gossip. Giggleweed sprouts from painted planters, moon peppers glow on curling vines, and the alchemy table bubbles softly like a cauldron trying very hard to be polite."
    exits:
      south: crafting_yard
    station: ALCHEMY_TABLE
  dungeon_portal_pavilion:
    title: "Dungeon Portal Pavilion - Dungeon Entry Test"
    description: "A domed pavilion of black stone and gilt trim, built around a humming archway of blue light. Bronze plaques explain the dungeon commands with almost offensive clarity. Type 'dungeon enter quality_assurance_gauntlet' here to begin a run."
    exits:
      west: economy_district
  worldstate_overlook:
    title: "Worldstate Overlook - Atmosphere and Room Art Test"
    description: "A rooftop overlook above the whole complex, with silk pennants snapping in a lavender breeze and a horizon painted in impossible sherbet clouds. Below, the test grounds glitter like a toy kingdom run by highly competent eccentrics."
    exits:
      down: arrival_hub
  mob_templates:
    title: "Dungeon Template Staging Room"
    description: "An internal room used to hold dungeon mob templates. If a player can see this, something has gone entertainingly wrong."

dungeon:
  name: quality_assurance_gauntlet
  description: "A compact dungeon tuned for repeat runs, full of noisy monsters, theatrical hazards, and enough treasure to make failure feel educational."
  minLevel: 1
  roomCountMin: 5
  roomCountMax: 7
  portalRoom: dungeon_portal_pavilion
  roomTemplates:
    entrance:
      - title: "Dungeon Entrance Test - Velvet Threshold"
        description: "A velvet-curtained threshold where brass bells ring each time a party steps through, as if the dungeon were delighted to have fresh paperwork."
      - title: "Dungeon Entrance Test - Checkpoint Arch"
        description: "A stone arch covered in glowing check marks. Somewhere beyond it, a goblin choir hums the tune of impending trouble."
    corridor:
      - title: "Corridor Test - Queue Hall"
        description: "A long hall lined with red ropes like a very hostile theater lobby. The floor tiles click beneath your boots in neat, nervous rhythms."
      - title: "Corridor Test - Flapping Passage"
        description: "Colorful banners flap overhead though no wind is present. Each one depicts a monster filling out a form badly."
    chamber:
      - title: "Chamber Test - The Bug Pit"
        description: "A circular chamber with chalk scribbles all over the walls: arrows, timestamps, and one large note reading REPRO STEPS UNCLEAR."
      - title: "Chamber Test - The Checklist Vault"
        description: "Rows of floating parchment circle the room like lazy birds. Each list grows another item the moment you think you understand it."
    treasure:
      - title: "Treasure Test - Coupon Hoard"
        description: "A low chamber stacked with prize tickets, glowing shards, and one suspiciously regal squeaky crown balanced on a velvet stool."
    boss:
      - title: "Boss Test - Deadline Arena"
        description: "A grand chamber under a clockwork dome where the Deadline Chimera prowls among shattered hourglasses. The air tastes like thunder and overdue promises."
  mobPools:
    common:
      - queue_gremlin
      - regression_ghost
    elite:
      - flaky_test_ogre
    boss:
      - deadline_chimera
  lootTables:
    normal:
      mobDrops:
        - bug_ticket
        - checklist_shard
        - sensible_tonic
      completionRewards:
        - regression_medal
    hard:
      mobDrops:
        - bug_ticket
        - checklist_shard
        - sensible_tonic
        - regression_medal
      completionRewards:
        - squeaky_crown
        - qa_hammer
        - audit_lantern

puzzles:
  compliance_riddle:
    type: riddle
    mobId: sphinxette_of_compliance
    roomId: puzzle_foyer
    question: "I get sharper the more you use me, but I am not a blade. I expose mistakes but I am not a lantern. What am I?"
    answer: "a test"
    acceptableAnswers:
      - "test"
      - "a test"
      - "unit test"
      - "a unit test"
    reward:
      type: unlock_exit
      exitDirection: north
      targetRoom: prize_closet
    failMessage: "The Sphinxette clicks her tongue. 'That answer lacks coverage.'"
    successMessage: "The Sphinxette smiles and a hidden panel slides open to the north."
    cooldownMs: 0
  lever_sequence:
    type: sequence
    roomId: puzzle_foyer
    steps:
      - feature: red
        action: pull
      - feature: blue
        action: pull
      - feature: green
        action: pull
    reward:
      type: give_gold
      gold: 77
    resetOnFail: true
    failMessage: "A kazoo fanfare plays as the mechanism indignantly resets."
    successMessage: "The floor applauds. A shower of gold coins patters out of hidden tubes."
  closet_riddle:
    type: riddle
    roomId: prize_closet
    question: "What has a crown, squeaks under pressure, and makes absolutely no claim to dignity?"
    answer: "the squeaky crown"
    acceptableAnswers:
      - "squeaky crown"
      - "the squeaky crown"
      - "crown"
    reward:
      type: give_item
      itemId: absurd_trophy
    failMessage: "A curtain flutters disapprovingly."
    successMessage: "A tiny spotlight snaps on and the absurd trophy lands in your arms."
    cooldownMs: 0
