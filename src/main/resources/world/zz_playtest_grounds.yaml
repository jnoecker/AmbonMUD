zone: playtest_grounds
startRoom: arrival_hub
lifespan: 0
image:
  room: demo/DefaultRoom.png
  mob: demo/DefaultMob.png
  item: demo/DefaultObject.png

items:
  brass_qa_key:
    displayName: "the reusable brass QA key"
    keyword: brasskey
    description: "A brass key on a ribbon labeled REUSABLE. Someone added tiny wings in red enamel, as if keys need to feel aerodynamic."
    room: arrival_hub
    basePrice: 1
  wafer_qa_key:
    displayName: "the dissolving wafer key"
    keyword: waferkey
    description: "A sugar wafer stamped with the word SINGLE-USE in cheerful icing. It smells faintly of lemon and reckless system design."
    room: arrival_hub
    consumable: true
    basePrice: 1
  starter_seltzer:
    displayName: "a fizzy starter seltzer"
    keyword: seltzer
    description: "A glass bottle full of pearly bubbles. The label promises courage, hydration, and at least one dramatic burp."
    room: arrival_hub
    consumable: true
    onUse:
      healHp: 12
    basePrice: 12
  applause_horn:
    displayName: "a pocket horn of polite applause"
    keyword: horn
    description: "A brass horn that toots exactly like three interns trying to sound impressed."
    consumable: true
    charges: 3
    onUse:
      grantXp: 15
    basePrice: 35
  bonk_baton:
    displayName: "a padded bonk baton"
    keyword: baton
    description: "A foam-wrapped practice club painted in heroic stripes. It looks safe until you notice the warning label: BONK RESPONSIBLY."
    slot: weapon
    damage: 3
    basePrice: 25
  debugger_hat:
    displayName: "a debugger's thinking cap"
    keyword: hat
    description: "A pointy cap stitched with magnifying glasses, tiny owls, and one suspiciously judgmental eyebrow."
    slot: head
    armor: 1
    stats:
      INT: 1
    basePrice: 20
  padded_lab_coat:
    displayName: "a padded lab coat"
    keyword: coat
    description: "A pristine white coat with reinforced elbows and a faint smell of cinnamon, ozone, and overconfidence."
    slot: body
    armor: 2
    basePrice: 30
  sparkle_ore:
    displayName: "a lump of sparkle ore"
    keyword: sparkle
    description: "A rude little nugget of ore that catches the light like it knows exactly how photogenic it is."
    basePrice: 6
  giggleweed:
    displayName: "a tuft of giggleweed"
    keyword: giggleweed
    description: "A curly herb with leaves shaped like laughing commas."
    basePrice: 4
  moon_pepper:
    displayName: "a moon pepper"
    keyword: pepper
    description: "A silver-speckled pepper pod so dramatic it seems to require its own spotlight."
    basePrice: 15
  chaotic_glitter:
    displayName: "a pinch of chaotic glitter"
    keyword: glitter
    description: "The crafting material of villains, bards, and deeply unserious wizards."
    basePrice: 20
  qa_hammer:
    displayName: "a quality assurance hammer"
    keyword: qahammer
    description: "A compact smithing hammer engraved with the words IF IT BREAKS WE LEARN."
    slot: weapon
    damage: 5
    basePrice: 60
  sensible_tonic:
    displayName: "a tonic of reasonable confidence"
    keyword: tonic
    description: "A herbal draught that tastes like mint, chamomile, and a project manager saying 'that seems manageable.'"
    consumable: true
    onUse:
      healHp: 18
    basePrice: 45
  audit_lantern:
    displayName: "an audit lantern"
    keyword: lantern
    description: "A brass lantern whose light politely highlights mistakes without ever quite judging you out loud."
    basePrice: 70
  laminated_checklist:
    displayName: "a laminated checklist"
    keyword: checklist
    description: "Bulletproof against coffee, panic, and the mysterious slime that appears in every workshop."
    slot: body
    armor: 1
    stats:
      WIS: 1
    basePrice: 40
  prize_coupon:
    displayName: "a prize coupon"
    keyword: coupon
    description: "A crisp coupon worth absolutely nothing in the real world and everything in a test environment."
    basePrice: 8
  absurd_trophy:
    displayName: "the absurd trophy of adequate problem solving"
    keyword: trophy
    description: "A gold cup topped with a triumphant rubber duck. The plaque reads: YOU DID THE THING."
    basePrice: 77
  rubber_feather:
    displayName: "a rubber feather"
    keyword: feather
    description: "A ridiculous feather that squeaks when squeezed."
    basePrice: 3
  confetti_glob:
    displayName: "a confetti glob"
    keyword: glob
    description: "A wobbling blob of brightly colored goo with opinions about festival planning."
    basePrice: 5
  bug_ticket:
    displayName: "a bug ticket"
    keyword: ticket
    description: "A paper ticket with TOO REPRODUCIBLE scribbled across the top in red ink."
    basePrice: 9
  checklist_shard:
    displayName: "a checklist shard"
    keyword: shard
    description: "A glowing fragment from a checklist so thorough it became metaphysical."
    basePrice: 14
  regression_medal:
    displayName: "a regression medal"
    keyword: medal
    description: "An iron medal awarded to anyone who bravely re-broke something old."
    basePrice: 24
  squeaky_crown:
    displayName: "the squeaky crown"
    keyword: crown
    description: "A regal crown of polished brass fitted with tiny toy hammers that squeak when the wearer nods."
    slot: head
    armor: 2
    stats:
      CHA: 1
    basePrice: 95

mobs:
  inspector_quibble:
    name: "Inspector Quibble"
    room: arrival_hub
    quests:
      - squeaky_cleanup
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome to the playtest grounds. Everything here is labeled, color coded, and only occasionally on fire. Need a quick assignment?"
        choices:
          - text: "What am I testing first?"
            next: first_task
          - text: "Remind me what this place is."
            next: explain_zone
          - text: "That is enough orientation for one lifetime."
            next: farewell
      first_task:
        text: "Start with the Combat Yard and clean up three rubber chicken brigands. They squeak, posture, and fall over in a way that makes excellent regression footage."
        choices:
          - text: "Understood."
            next: farewell
      explain_zone:
        text: "Each wing isolates a different gameplay loop: rooms, locks, puzzles, combat, crafting, economy, social systems, housing, dungeons, and atmosphere. Think of it as a theme park built by meticulous goblins."
        choices:
          - text: "That helps."
            next: farewell
      farewell:
        text: "Splendid. If something explodes, please note whether it was expected."
  professor_bonkles:
    name: "Professor Bonkles"
    room: arrival_hub
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "I teach all five classes because management refused to approve five separate hats. Use 'train list' when inspiration or violence strikes."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "That hat situation sounds grim."
            next: hat_lament
          - text: "Farewell, professor."
            next: farewell
      training_info:
        text: "Learn abilities with 'train learn <ability>'. Once you qualify, unlock additional classes with 'train unlock <class>'. I am a one-stop academy with slightly worse staffing ratios."
        choices:
          - text: "Back."
            next: root
      hat_lament:
        text: "Today I am wearing warrior brim, mage tassel, cleric trim, rogue lining, and ranger feathers. I am one sneeze away from a lawsuit."
        choices:
          - text: "Back."
            next: root
      farewell:
        text: "Study hard. Swing harder."
  quartermaster_plink:
    name: "Quartermaster Plink"
    room: economy_district
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome to the Economy Arcade. I oversee shopping, banking, trade etiquette, auction rumors, and the mail cubbies nobody empties."
        choices:
          - text: "How do I use the shop?"
            next: shop_help
          - text: "How do I use the bank?"
            next: bank_help
          - text: "What about trade, auction, and mail?"
            next: extra_help
          - text: "Enough fiscal wisdom for now."
            next: farewell
      shop_help:
        text: "Use 'list', 'buy <item>', and 'sell <item>'. Everything on the shelves is priced to encourage poor but educational decisions."
        choices:
          - text: "Back."
            next: root
      bank_help:
        text: "This room counts as a bank. Use 'bank balance', 'bank deposit', and 'bank withdraw' for both gold and items."
        choices:
          - text: "Back."
            next: root
      extra_help:
        text: "Trade with 'trade request', 'trade offer', and 'trade accept'. Auction uses 'auction list', 'auction sell', 'auction buy', and 'auction cancel'. Mail uses 'mail list', 'mail read', 'mail send', and 'mail delete'."
        choices:
          - text: "Back."
            next: root
      farewell:
        text: "May your ledgers balance and your bargains sparkle."
  barkeep_fizzwhistle:
    name: "Barkeep Fizzwhistle"
    room: tavern_social_hall
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "This tavern was built to test social systems, shouting acoustics, and whether anyone can lose gracefully at tavern games."
        choices:
          - text: "What should I try here?"
            next: social_help
          - text: "Can I gamble here?"
            next: gamble_help
          - text: "I will leave before the singing starts."
            next: farewell
      social_help:
        text: "Use say, gossip, whisper, shout, ooc, emote, and pose with other players. The room is tavern flagged, so it is excellent for chaos with seating."
        choices:
          - text: "Back."
            next: root
      gamble_help:
        text: "Yes. Lottery and tavern gambling should both work here. If luck abandons you, blame statistics, not the wallpaper."
        choices:
          - text: "Back."
            next: root
      farewell:
        text: "Mind the disco chandelier. It sheds sequins under stress."
  registrar_mopworth:
    name: "Registrar Mopworth"
    room: guild_group_staging
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Group invites to the left, guild paperwork to the right, emotional support tea in the middle."
        choices:
          - text: "What do I test here?"
            next: social_orgs
          - text: "Where is the tea?"
            next: tea
          - text: "Back to work."
            next: farewell
      social_orgs:
        text: "Test group formation and updates, then guild creation, invites, roster, ranks, motd, and gchat. I recommend doing the paperwork before the tea."
        choices:
          - text: "Back."
            next: root
      tea:
        text: "The tea is metaphorical. The paperwork, sadly, is real."
        choices:
          - text: "Back."
            next: root
      farewell:
        text: "May your guild tag be tasteful."
  broker_velvet:
    name: "Broker Velvet"
    room: housing_showcase
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome to the Housing Showcase, where every wall is staged and every throw pillow has a backstory."
        choices:
          - text: "How do I test housing?"
            next: housing_help
          - text: "Can I enter my house from dialogue?"
            next: entry_hint
          - text: "I fear decorative responsibility."
            next: farewell
      housing_help:
        text: "Use house buy, house status, house guests, and the edit commands for title and description. Once you own a house, I can usher you inside."
        choices:
          - text: "Back."
            next: root
      entry_hint:
        text: "After purchase, choose the dialogue option that opens your home. It is extremely dramatic for what is basically a doorway."
        choices:
          - text: "Enter my house."
            next: farewell
            action: enter_house
          - text: "Back."
            next: root
      farewell:
        text: "A good house says 'welcome home' and 'please sort your inventory.'"
  botanist_petaltoss:
    name: "Botanist Petaltoss"
    room: greenhouse_of_suspicious_herbs
    quests:
      - sparkle_for_science
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Please do not lick the plants, especially the one applauding in the corner. I need ingredients, not volunteers."
        choices:
          - text: "What ingredients?"
            next: gather_help
          - text: "Are the herbs supposed to giggle?"
            next: herb_joke
          - text: "I will definitely not lick anything."
            next: farewell
      gather_help:
        text: "Bring me sparkle ore from the forge yard and giggleweed from this greenhouse. It is for science, alchemy, and one very suspicious tea."
        choices:
          - text: "Back."
            next: root
      herb_joke:
        text: "Yes. If they stop giggling, that means they have started plotting."
        choices:
          - text: "Back."
            next: root
      farewell:
        text: "Excellent. Mind the carnivorous begonias."
  sphinxette_of_compliance:
    name: "the Sphinxette of Compliance"
    room: puzzle_foyer
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
  rubber_chicken_brigand:
    name: "a rubber chicken brigand"
    room: combat_yard
    tier: weak
    level: 1
    respawnSeconds: 45
    xpReward: 15
    drops:
      - itemId: rubber_feather
        chance: 0.6
  confetti_slime:
