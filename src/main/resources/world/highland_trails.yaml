rooms:
  trail_entrance:
    title: Highland Trailhead — Entrance
    description: The cobblestone road ends here where a well-worn dirt track begins winding uphill. Stone cairns mark the
      way into the highlands — a tradition maintained by travellers for generations. The air is noticeably cooler than
      the lowland road to the south. The highlands begin in earnest to the north.
    exits:
      s: cobblestone_road:highland_trailhead
      n: lower_trail
    image: b709efbbcae91dae66dd6826957a8beae003d2dd252855fc15c81ab0061c8ed2.jpg
  lower_trail:
    title: Lower Highland Trail
    description: A firm trail of exposed shale and heather that climbs steadily through the lower slopes. Mountain goats
      pick their way along the ridgeline with bored confidence, watching your progress. The trail entrance is back
      downhill to the south; the trail crossing is further north. A side path dips east toward an open meadow.
    exits:
      s: trail_entrance
      n: trail_crossing
      e: eastern_outlook
    image: 30c1e106c215514d998b86996d84bdc5aac85f4b854b4b7a1c02bfb6b824247d.jpg
  eastern_outlook:
    title: Eastern Outlook
    description: "A flat-topped boulder from which you can see the whole sweep of the land to the east and south: the
      cobblestone road threading back toward Thornhaven, the dark smear of the Marsh of Fog on the distant horizon, and
      the glint of what might be the sea far to the southeast. The trail is back to the west."
    exits:
      w: lower_trail
    image: 5243b582ddc025ed89fc712c54d5db0730e9ceb28f8030d2fac1d54fb8df05c3.jpg
  trail_crossing:
    title: Trail Crossing
    description: "A wide spot in the trail where a cross-path joins from the sides: east toward an iron-rich ridge, west
      into open meadowlands. Highland bandits have been working this junction, drawn by the traffic between the mines
      and the road below. The trail continues north toward the highland pass; the trailhead is back south."
    exits:
      s: lower_trail
      n: highland_pass
      e: iron_ridge
      w: goat_meadow
    image: 71a9e87e5ad70242d587aca33725cb2a65cda89785fedb23bcc129f3b70afdbd.jpg
  goat_meadow:
    title: Goat Meadow
    description: A sheltered bowl of scrubby grassland just west of the main trail. Mountain goats crop the short grass with
      practiced efficiency. Hardy mountain herbs grow in dense patches among the rocks — a herbalist's delight. The
      trail crossing is back to the east.
    exits:
      e: trail_crossing
    image: 7d85a44835b4b25c1cc1e5f9c9d410a1d85318b2b66147e7ff6c136adcf744fe.jpg
  iron_ridge:
    title: Iron Ridge
    description: A sharp ridge of dark stone where iron minerals colour the rock with rust-red streaks. The ore seam is
      clearly visible in the cliff face. The air up here has a metallic smell after rain. The trail crossing is back to
      the west; a rough ore shelf runs along the ridge to the north.
    exits:
      w: trail_crossing
      n: ore_shelf
    image: c575e04bc66a09db3a93f1a8584225768146df062c0c0715b11ebcf377720dea.jpg
  ore_shelf:
    title: Ore Shelf
    description: A narrow shelf of exposed rock where an iron ore vein runs openly along the cliff face. Chunks of ore have
      worked loose over the centuries and litter the shelf floor. This is clearly where the mines once sourced surface
      iron before they went underground. The iron ridge trail is back to the south.
    exits:
      s: iron_ridge
    image: 56cdd1346f512da2b51abe35153231afd09f789baa970c6e4afe7bfb9cb50fe9.jpg
  highland_pass:
    title: Highland Pass
    description: A narrow passage between two sheer rock walls where the trail squeezes through the first of the highland
      ridges. The wind funnels through here with enough force to make footing uncertain. A cave troll has made its lair
      in a widening of the crack to one side. The pass opens onto the upper trail ahead to the north; the crossing is
      back south.
    exits:
      s: trail_crossing
      n: upper_trail
    image: cd0858c1ffb74b565a1916b2eb5fd86286412a03471533b9691332a976b4ff80.jpg
  upper_trail:
    title: Upper Highland Trail
    description: "The trail levels briefly here before rising again toward the summit. The vegetation is sparse: lichen,
      stunted heather, and nothing else. The stone circle is visible as a dark ring on a flat area to the east. The air
      is sharp and cold. The pass is back to the south; the summit approach lies ahead north."
    exits:
      s: highland_pass
      n: summit_approach
      e: stone_circle
    image: 618dd052c6f5d37f949a999673d8ec3e916a7d8f6579213da51bc95beca8b780.jpg
  stone_circle:
    title: The Stone Circle
    description: A ring of seven standing stones on a flat hilltop, each about head height, with no inscription or
      decoration. Whoever placed them chose a site with an extraordinary view in every direction. The air inside the
      circle is uncannily still regardless of the wind outside. The upper trail is back to the west.
    exits:
      w: upper_trail
    image: be689398de20440dee9ab102b5be058e0eb91db9813bcc30404004063493c838.jpg
  summit_approach:
    title: Summit Approach
    description: The highest navigable ground on the highland trail before the true summit becomes impassable. Stone eagles
      ride thermals overhead, diving occasionally at things on the slope. A cleft in the rock to the east leads to a
      lookout perch. A dark cave mouth descends into the mountain to the south — the entrance to the Old Mines.
    exits:
      s: upper_trail
      e: eagles_perch
      d: old_mines:mine_entrance
      n: frost_caverns:frozen_pass
    image: 7c5127a97dcfa21f229f1bf8e1ec7c841b515148bd5b03c0d59a22fbb4318698.jpg
  eagles_perch:
    title: Eagle's Perch
    description: "A dramatic rocky shelf jutting from the summit face. Stone eagles nest in the crevices here and do not
      welcome visitors. The view is extraordinary: the full arc of the realm spread out below, from Thornhaven's
      rooftops to the dark line of the eastern fens and, on a clear day, the silver thread of the sea to the south. The
      summit approach is back to the west."
    exits:
      w: summit_approach
    image: 2a7b864c022fb622923f162fe35640f7f2e90c8aec7c23e6677dac9b22c4f8bb.jpg
