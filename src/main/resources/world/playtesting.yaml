puzzles:
  riddle_of_the_door:
    type: riddle
    roomId: the_door_that_asks
    question: "The obsidian sphinx exhales: 'The more of me you take, the more you leave behind — and in a place built for
      the testing of things, I am very nearly all you will ever make. What am I?'"
    answer: footsteps
    acceptableAnswers:
      - footsteps
      - footstep
      - steps
      - foot steps
      - my footsteps
    reward:
      type: give_item
      itemId: skeleton_star_key
    successMessage: The sphinx sighs, almost disappointed you managed it. With a grudging click, a star-shaped key drops
      from the speaking-grille into your waiting hand.
    failMessage: "'No,' says the sphinx, with relish. 'Do try again. I have nothing but time — and, apparently, neither do you.'"
    cooldownMs: 3000
    resetOnFail: false
