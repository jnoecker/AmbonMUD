    armor: 3
    room: the_kitchen_of_hunger
    level: 15
    tier: common
    archetype: armor
    image: 1ae371dbedd353ba9ca07e51a9a5e6c94eda6b5775d1a0ef0285b7941be0389d.png
    keyword: burnt_gloves
  quilt_patch:
    displayName: Quilted Patch of Security
    description: A protective amulet woven from quilted fabric scraps.
    stats:
      WIS: 1
    room: the_bedroom_of_eyes
    image: 86b8576a7bce662a4c872b8500364dbe7ee6a8f48060e0c5613ea3edead63c50.png
    keyword: quilt_patch
  brass_key:
    displayName: Tarnished Brass Key
    description: A large key that doesn't match any lock you've seen, yet feels important. It's warm in your hand and hums softly.
    room: the_hallway_of_doors
    image: 2007e6d9027fb6f31baefe5e044624e2e71a9186448b811c370c6fccf735b234.png
    keyword: brass_key
  thorn_crown:
    displayName: Crown of Thorns and Petals
    description: A twisted circlet of black thorns intertwined with the darkest petals. It whispers of growth and pain.
    slot: head
    room: the_garden_of_thorns
    level: 15
    tier: common
    archetype: armor
    armor: 3
    image: 7f4ca40773ea954b112cf4fdb558000a338b13cca525a22822d22251ab7da488.png
    keyword: thorn_crown
  mirror_shard:
    displayName: Shard of Fractured Mirror
    description: A piece of reflective glass that shows fragments of reflections that don't quite belong. It cuts if you're
      not careful.
    slot: weapon
    damage: 3
    room: the_mirror_gallery
    level: 15
    tier: common
    archetype: damage
    image: ae61b4d9954cf2e109fa01ec404dd68c9095ef14592e5211b60dfde528b32427.png
    keyword: mirror_shard
  clock_hand:
    displayName: Backward Clock Hand
    description: A large iron hand from a clock, still ticking softly. Time feels wrong in its presence.
    stats:
      INT: 2
      DEX: -1
    room: the_clock_chamber
    image: 5fce765d76ecbe3274d085985264090b3bbd88ed09121788140e586aed4af615.png
    keyword: clock_hand
  shadow_cloak:
    displayName: Cloak of Shadows
    description: A garment that seems to absorb light, making it difficult to focus on its wearer. It smells of darkness and
      old fears.
    slot: body
    armor: 6
    room: the_heart_of_the_nightmare
    level: 15
    tier: common
    archetype: armor
    image: 8c40fe913ad34fd2b6bc20dad7013446a6de5d2379dc41b5013009c7c6de0d49.png
    keyword: shadow_cloak
  gen_epic_warrior_weapon:
    displayName: Epic Warrior Blade
    description: Autogenerated epic-tier weapon for this zone. Replace the name and description, then keep editing.
