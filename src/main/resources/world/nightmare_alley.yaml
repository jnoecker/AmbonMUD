    spawns:
      - room: the_playground_of_teeth
    level: 15
    drops:
      - itemId: gen_uncommon_feet
        chance: 0.4
    image: ca1559d1bfdc02e823d9102a242c75ff98cc5b23b877e36d67da052c5e689ac5.png
  chalk_scraper:
    name: Chalk Scraper
    description: A being composed entirely of chalk dust and broken writing implements, leaving marks wherever it moves.
    tier: weak
    spawns:
      - room: the_school_desk_hall
    level: 15
    drops:
      - itemId: gen_common_feet
        chance: 0.6
    image: 5e6d9d83da000a818d9efc96a372a400f40f3edb67d626a2f92790bf345804e7.png
  hunger_entity:
    name: Hunger Entity
    description: A twisted thing made of pots, pans, and utensils fused together unnaturally. It reeks of burnt offerings.
    tier: elite
    spawns:
      - room: the_kitchen_of_hunger
    level: 15
    drops:
      - itemId: gen_rare_warrior_weapon
        chance: 0.2
      - itemId: gen_rare_mage_head
        chance: 0.2
      - itemId: gen_rare_cleric_feet
        chance: 0.2
      - itemId: gen_rare_rogue_weapon
        chance: 0.2
      - itemId: gen_rare_ruler_head
        chance: 0.2
    image: 1818c823ff77bd4f49e97c317b4ca427a005479f9f688337b015868d8253b2fa.png
  quilted_watcher:
    name: Quilted Watcher
    description: A creature that emerges from the bedroom quilts, its many eyes opening across a patchwork body. It watches
      everything simultaneously.
    tier: standard
    spawns:
      - room: the_bedroom_of_eyes
    level: 15
    drops:
      - itemId: gen_uncommon_hands
        chance: 0.4
    image: a66872f59e4d7256626e93a1d7c0caaa4a00d843ddec508090936f1df0fe79fa.png
  door_sentinel:
    name: Door Sentinel
    description: A towering figure made of doorframes and hinges, its footsteps echo through multiple rooms at once.
    tier: standard
    spawns:
      - room: the_hallway_of_doors
    level: 15
    drops:
      - itemId: gen_uncommon_weapon
        chance: 0.4
    image: 3f72d26016d51688d39b09bc1f40114d1b161a99abdad470d857f45eb7e8f296.png
  thorn_crawler:
    name: Thorn Crawler
    description: A massive insect-like thing with a body of twisted stems and petals of deepest black. It clicks and chittering.
    tier: standard
    spawns:
      - room: the_garden_of_thorns
    level: 15
    drops:
      - itemId: gen_uncommon_chest
        chance: 0.4
    image: 09c0d715191c43078398e2394f844a3e3bc153b6768ed8b7092104cb50553281.png
  mirror_twin:
    name: Mirror Twin
    description: A doppelgänger pulled from the fractured reflections, moving in concert with its surroundings but never
      quite in sync.
    tier: elite
    spawns:
      - room: the_mirror_gallery
    level: 15
    drops:
      - itemId: gen_rare_warrior_hands
        chance: 0.2
      - itemId: gen_rare_mage_chest
        chance: 0.2
      - itemId: gen_rare_cleric_legs
        chance: 0.2
      - itemId: gen_rare_rogue_hands
        chance: 0.2
      - itemId: gen_rare_ruler_chest
        chance: 0.2
    image: e16792723a35efe7963f2f607a8ce38bdb7acb2220d0fe202db7062de5c3e05a.png
  stair_keeper:
    name: Stair Keeper
    description: An elongated figure that coils around the descending steps, its limbs counting the endless stairs in a
      rasping whisper.
    tier: weak
    spawns:
      - room: the_stairwell_of_descent
    level: 15
    drops:
      - itemId: gen_common_hands
        chance: 0.6
    image: 1578a5675526b2ab0e31dbbf455d67a9b7df3360a460abf7b06310d8b2f5f2d3.png
  nightmare_lord:
    name: Nightmare Lord
    description: The apex predator of this realm, a being of pure dread that manifests as shifting shadow and terrible
      presence. Its form defies comprehension.
    tier: boss
    spawns:
      - room: the_heart_of_the_nightmare
    level: 16
    drops:
      - itemId: gen_epic_warrior_weapon
        chance: 0.1
      - itemId: gen_epic_mage_chest
        chance: 0.1
      - itemId: gen_epic_cleric_head
        chance: 0.1
      - itemId: gen_epic_rogue_legs
        chance: 0.1
      - itemId: gen_epic_ruler_feet
        chance: 0.1
    image: 1e69cb583549810b7025e0f45f2dee808e9b73cb6f66a14582d0a2e40b62a0b5.png
items:
  doll_mask:
    displayName: Porcelain Doll Mask
    description: A cracked porcelain mask with painted features frozen in an eternal smile. Wearing it makes you feel watched.
    slot: head
    room: the_toy_box_chamber
    level: 15
    tier: common
    archetype: armor
    armor: 3
    image: 9e6b1c643816ebb7125e6cdd4c18e8db81e1e0fcd8bf1f99cc7c710532802a9f.png
