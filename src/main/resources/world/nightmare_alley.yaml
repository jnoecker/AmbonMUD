    slot: body
    armor: 6
    room: the_school_desk_hall
    level: 15
    tier: common
    archetype: armor
    image: 03a060504afbba07c5bec1d08d22ab8af81a72b0a878e1308148b0bffc301524.png
    keyword: chalk_robes
  burnt_gloves:
    displayName: Burnt Kitchen Gloves
