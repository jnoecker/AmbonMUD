zone: nightmare_alley
startRoom: the_crooked_entryway
rooms:
  the_crooked_entryway:
    title: The Crooked Entryway
    description: Warped doorframes lean at impossible angles, their wood grain seeming to writhe in your peripheral vision.
      The air tastes of copper and old candy.
    exits:
      n: the_stretching_corridor
      w: the_toy_box_chamber
      e: the_playground_of_teeth
      s: the_bedroom_of_eyes
    image: bb7cbd3afb133e4f62bc857b650f388df034f4ac7d030308cb10999b62b36b9c.jpg
  the_stretching_corridor:
    title: The Stretching Corridor
    description: The hallway elongates before you, walls breathing in and out with a sickly rhythm. Shadows pool in corners
      that shouldn't exist.
    exits:
      s: the_crooked_entryway
      n: pixel_haven:crazy_road_intersection_point
    image: ffb51fe4d5e830654fa0f3c68f704616bc70c682b58cf0bece99d3a2cc9150d1.jpg
  the_toy_box_chamber:
    title: The Toy Box Chamber
    description: Enormous wooden toys scattered about are rendered grotesque by their scale—a doll's head the size of a
      horse, blocks stacked like dark towers. Dust motes drift like tiny eyes watching.
    exits:
      e: the_crooked_entryway
      n: the_nursery_of_whispers
    image: f29da8171db4c7578e6f2dfdd5ac771676484e457c70a5ef50f48c6b2e0fc1f8.jpg
  the_nursery_of_whispers:
    title: The Nursery of Whispers
    description: Oversized cradles creak despite the absence of wind, and lullabies echo from walls that seem to speak.
      Faded wallpaper peels like shedding skin.
    exits:
      s: the_toy_box_chamber
    image: 761493771fd30705b726d40a9659151a2d1af4a940891aebcc6927e505df8e68.jpg
  the_playground_of_teeth:
    title: The Playground of Teeth
    description: Swings hang too high to touch, creaking in a syncopated rhythm. The sandbox is stained dark, and sharp
      shadows stretch across equipment designed for a child's nightmares.
    exits:
      w: the_crooked_entryway
      e: the_school_desk_hall
      s: the_sidewalk_of_chalk
    image: 8c70633aeb51f38301ac8d295baaa5d99c0c830b1f6a7852b546a566ee6d69df.jpg
  the_school_desk_hall:
    title: The School Desk Hall
    description: Desks of impossible proportions loom like monuments, their surfaces scarred with ghostly chalk marks that
      seem to shift when you blink. A broken bell chimes without being struck.
    exits:
      w: the_playground_of_teeth
      s: the_kitchen_of_hunger
    image: 2bc0e4e94f82fb281b40377e3153450aeb41b91d4094cf227ae9ac1b83357076.jpg
  the_kitchen_of_hunger:
    title: The Kitchen of Hunger
    description: Looming cookware casts jagged shadows across countertops that stretch into darkness. The smell of burnt
      sugar and something acrid fills the space.
    exits:
      n: the_school_desk_hall
      e: the_garden_of_thorns
    image: 929f965f7b5535875646d89f5323e118a4c79c8a2bc78562f988a0b991568cd9.jpg
  the_bedroom_of_eyes:
    title: The Bedroom of Eyes
    description: An enormous bed dominates the room, its quilted surface patterned with shapes that almost look like
      watching faces. The closet door hangs open, leading only to more darkness.
    exits:
      n: the_crooked_entryway
      w: the_hallway_of_doors
      s: the_stairwell_of_descent
    image: 0ffed1f98643b52f0ae21ff3f62be539f10032335188c53937b46131e7dc52e5.jpg
  the_hallway_of_doors:
    title: The Hallway of Doors
    description: Countless doors line both walls, each slightly ajar, breathing out whispers and cold air. You cannot tell
      which doors lead forward and which inward.
    exits:
      e: the_bedroom_of_eyes
      s: the_mirror_gallery
    image: ac038ec7f11b1b8eb74eed44c0c03f5a3df5e9aab4aeaadbbef27d48e4e3aec1.jpg
  the_garden_of_thorns:
    title: The Garden of Thorns
    description: Oversized flowers twist with thorn-studded stems, their petals dark as bruises. The soil beneath your feet
      feels warm and wrong.
    exits:
      w: the_kitchen_of_hunger
    image: cf8806956f6a759ef14285a33c0b3cadcd06469552e87ec20eb4feee6f403c23.jpg
  the_mirror_gallery:
    title: The Mirror Gallery
    description: Tall mirrors line the walls, reflecting the room but not quite right—your reflection always seems to be
      moving separately. They cloud with breath that isn't yours.
    exits:
      n: the_hallway_of_doors
      e: the_stairwell_of_descent
      s: the_attic_of_secrets
    image: 22ffa548d5499f1bb531ea14c985077dae4e1c79b7a3403e0ca194012dfef032.jpg
  the_stairwell_of_descent:
    title: The Stairwell of Descent
    description: Stairs spiral downward, each step painted a different shade of black. The walls crowd inward the deeper you
      look, and the air grows heavier with each phantom step.
    exits:
      w: the_mirror_gallery
      n: the_bedroom_of_eyes
      s: the_basement_darkness
    image: 0a437e377f8a14d06e185315f400334e65219089edd71ed169577ba24b62b68e.jpg
  the_attic_of_secrets:
    title: The Attic of Secrets
    description: Rafters crisscross overhead like skeletal fingers. Forgotten items sit in shadows, and the scent of dust
      and old paper permeates the cramped space.
    exits:
      n: the_mirror_gallery
      e: the_basement_darkness
      s: the_theatre_of_silhouettes
    image: f2de5d7780c99bdc4b060ed454ebe5d0cdd55aa80bc9abb0e2fb894f6b1b3a2c.jpg
  the_basement_darkness:
    title: The Basement Darkness
    description: Dim phosphorescence barely illuminates concrete walls that weep with moisture. Something moves in the
      deepest shadows, just out of focus.
    exits:
      w: the_attic_of_secrets
      s: the_library_of_lost_words
      e: the_closet_within
      n: the_stairwell_of_descent
    image: 7fc7d80c8d794616c08e73848205f48ee4eaaa9dae4aae9ce00bbd88ee7f7656.jpg
  the_library_of_lost_words:
    title: The Library of Lost Words
    description: Shelves tower overhead, their books bound in dark leather. The words on the spines change when you're not
      looking directly at them.
    exits:
      n: the_basement_darkness
      s: the_clock_chamber
    image: 40df1ba94ca6ad8a31c4c65548821432d513fe2ca004ea30c7c6ed414797716a.jpg
  the_clock_chamber:
    title: The Clock Chamber
    description: An enormous clock face occupies one wall, its hands moving backward in stuttering jerks. Tick-tock echoes
      like a heartbeat gone wrong.
    exits:
      n: the_library_of_lost_words
    image: 6636b811dba7579128af3d114d7e4b98d50efe0a70a4667c615dbacb0a0d9650.jpg
  the_theatre_of_silhouettes:
    title: The Theatre of Silhouettes
    description: A stage looms with crimson curtains that never quite open. Shadow-puppet figures move behind translucent
      screens, their gestures unnatural and purposeful.
    exits:
      n: the_attic_of_secrets
    image: aefab67ed5695b07116eece959894d32f58de27b47335f85c515666301966e45.jpg
  the_closet_within:
    title: The Closet Within
    description: An endless closet crammed with coats and fabric that seems to shift and breathe. The darkness inside never
      quite recedes, no matter how much light you bring.
    exits:
      w: the_basement_darkness
      n: the_cellar_of_stones
      s: the_cinema_of_screams
    image: de4e46d24af152cd512c139b8925b1c4af2ec4f84e91336734fa8f69c267d40b.jpg
  the_cellar_of_stones:
    title: The Cellar of Stones
    description: Rough stone walls close in around you, and water drips with irregular rhythm. The floor is uneven,
      scattered with objects you can't quite identify.
    exits:
      s: the_closet_within
      n: the_sidewalk_of_chalk
      e: the_balloon_forest
    image: 696afaf532f5188f301ee427c00e10c36bb764d4514e3074aaa703d53d9d3c0f.jpg
  the_sidewalk_of_chalk:
    title: The Sidewalk of Chalk
    description: Pastel chalk drawings cover the ground, depicting scenes that shift disturbingly when observed. The sky
      above is perpetually twilight, caught between day and something worse.
    exits:
      s: the_cellar_of_stones
      n: the_playground_of_teeth
    image: ac38f256a780e276f918ad92afb3951c4d878bb64cbf2fa89227a3a911a5efad.jpg
  the_balloon_forest:
    title: The Balloon Forest
    description: Inflatable creatures and shapes hang suspended at various heights, their bright colors sickly-sweet against
      the murk. They bob without air currents.
    exits:
      w: the_cellar_of_stones
      s: the_candy_shop_of_rust
    image: 446022803ffbc3ff1fa2bf1844ff3679dcab8a39cf800932343168d7dd1a967d.jpg
  the_candy_shop_of_rust:
    title: The Candy Shop of Rust
    description: A counter overflows with confections behind warped glass. The colors are too vivid, the scent too thick,
      and nothing appears fresh despite the array.
    exits:
      n: the_balloon_forest
      s: the_carousel_of_regret
      e: the_bridge_of_whispers
    image: 6c2294c1edd4b09447b5bffdc23a8762f5ae7ff995ea00fa87b55bcf7af747ea.jpg
  the_carousel_of_regret:
    title: The Carousel of Regret
    description: Wooden horses twist on a frozen platform, their painted eyes tracking your movement. Tinny music plays from
      no visible source.
    exits:
      n: the_candy_shop_of_rust
      w: the_cinema_of_screams
      s: the_forest_of_pencils
    image: be9c49e9c7bff19b1f90025a87a043feb52292c7a15bed4b5a25c9748add992a.jpg
  the_cinema_of_screams:
    title: The Cinema of Screams
    description: Red velvet seats face a silver screen projecting nothing but static and shadow. Popcorn rots in forgotten
      containers, releasing sickly-sweet vapors.
    exits:
      n: the_closet_within
      s: the_pond_of_reflections
      e: the_carousel_of_regret
    image: 615bf6e5ede9f6cd77a9571024aa973e8bcab1a6f7af277990bdad79d529f32f.jpg
  the_pond_of_reflections:
    title: The Pond of Reflections
    description: Still black water reflects nothing accurate. The surface ripples without cause, and you sense something
      vast and patient beneath.
    exits:
      n: the_cinema_of_screams
      e: the_forest_of_pencils
    image: 044bc4111dd7ee6a4210e6a035bdfe73f0394bb6a5866926a120f9632757e6ff.jpg
  the_forest_of_pencils:
    title: The Forest of Pencils
    description: Impossibly tall pencils stand like trees, their erasers worn away to nothing. The ground is carpeted with
      shavings that crunch ominously underfoot.
    exits:
      w: the_pond_of_reflections
      s: the_mansion_foyer
      e: the_garden_wall
      n: the_carousel_of_regret
    image: 23fadf5072c2fda7acfdb2b7b0af85a3c9d57c7755c47897d81ddb5a3bb63c39.jpg
  the_bridge_of_whispers:
    title: The Bridge of Whispers
    description: A slender bridge spans an invisible chasm, and voices rise from below in conversations you almost
      understand. The rails are too low to be safe.
    exits:
      w: the_candy_shop_of_rust
    image: 7ecf7854e8472301520f70768712bbec0d00ad4c2ba86ee0a814283592db32c0.jpg
  the_mansion_foyer:
    title: The Mansion Foyer
    description: A grand entrance rises impossibly high, its chandeliers unlit despite being occupied by flickering shapes.
      Marble floors reflect something that isn't in the room.
    exits:
      n: the_forest_of_pencils
    image: 70c2a289dd71e4c6d59f1773a03f748f770439fe1e7943399e6a57ef9ad7a67d.jpg
  the_garden_wall:
    title: The Garden Wall
    description: A brick wall covered in creeping vines forms a boundary. Beyond it, you sense another layer to this
      nightmare, watching and waiting.
    exits:
      w: the_forest_of_pencils
      s: the_heart_of_the_nightmare
    image: ba51fcc110d0db9c1bca29126da40cd3eff96e2560b29c40011b85065fb47a57.jpg
  the_heart_of_the_nightmare:
    title: The Heart of the Nightmare
    description: Here, at the deepest point, reality frays like old fabric. The boundaries between rooms blur, and all paths
      seem to lead back to this exact spot.
    exits:
      n: the_garden_wall
    image: a326e654d517f3a90a3054a0c63d4877c7245f5955f02294b8cfc330114fa291.jpg
lifespan: 30
