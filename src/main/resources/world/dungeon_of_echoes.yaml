rooms:
  portal_chamber:
    title: Portal Chamber — Dungeon of Echoes
    description: A circular stone chamber etched with spiraling runes that pulse faintly with residual magic. A shimmering
      portal arch stands in the center, its surface rippling like disturbed water. The exit back to Old Grimly's study
      is carved into the northern wall. Type 'dungeon enter dungeon_of_echoes' to descend once more.
    exits:
      n: thornhaven_city:grimlys_study
    image: 718a7470fc8b5b51386c29db016a6f1d00f1014e80dee589b924a23c37748fa4.jpg
  mob_templates:
    title: Mob Template Room
    description: An internal room used to stage dungeon mob templates. Players cannot reach this room.
    image: 63a7c67c379f5cb1f88c464b8277ce5f65f9cedf0b825c8c561af0d4966a36b4.jpg
dungeon:
  name: dungeon_of_echoes
  description: A labyrinth that reshapes itself for every party that enters. Ancient magic echoes through the halls,
    animating constructs and spirits from a long-forgotten age.
  minLevel: 3
  roomCountMin: 10
  roomCountMax: 16
  portalRoom: portal_chamber
  roomTemplates:
    entrance:
      - title: Echoing Threshold
        description: The entrance to the dungeon hums with faint resonance. Runes on the walls pulse in irregular rhythm, as if
          breathing. The air tastes of old stone and spent magic.
      - title: The Shivering Gate
        description: A massive stone arch marks the dungeon entrance, its keystone carved with a screaming face. Drafts of cold
          air exhale from the passage ahead.
    corridor:
      - title: The Resonant Corridor
        description: A narrow passage where every footstep returns to you twice, slightly wrong. The walls are etched with
          symbols that seem to shift when you aren't looking directly at them.
      - title: The Long Hall
        description: A straightway of dressed stone that stretches further than it should. Sconces hold ever-burning torches
          that cast no shadows. Something moves at the far end.
      - title: Collapsed Passage
        description: The corridor has partially collapsed, forcing a crawl through rubble. On the other side the ceiling opens
          back up, but chunks of stone litter the floor and something has been digging.
      - title: The Flooded Corridor
        description: Ankle-deep water covers the floor here, and the smell of wet stone and iron fills the air. The water
          ripples slightly, though there is no breeze.
    chamber:
      - title: The Memory Chamber
        description: A wide room where images of past battles play out in translucent echo-light. Figures that look like
          adventurers fight creatures that may once have been real. The scene loops every few minutes. Mobs prowl among
          the images, ignoring them.
      - title: The Shattered Hall
        description: A grand chamber whose ceiling has given way, leaving a rubble field and an open sky of luminous void above.
          Strange constructs patrol the debris.
      - title: The Whispering Vault
        description: Every surface here is covered in tiny carved text — words that seem to rearrange themselves when read. The
          whispers are faint but constant. Something guards the far door.
      - title: The Echo Pool
        description: A perfectly still pool of dark water fills the center of this chamber. The reflections in it are subtly
          wrong — they show a different dungeon, or perhaps this one at a different time.
    treasure:
      - title: Cache of Echoes
        description: A side chamber sealed by a recently broken lock. Inside, chests and crates bear the marks of a party that
          came before — whoever they were, they didn't make it back out.
      - title: The Resonance Vault
        description: A small room whose walls amplify sound into near-physical force. At its center, a plinth holds a cache of
          crystallized echo fragments — valuable to those who know what to do with them.
    boss:
      - title: The Heart of Echoes
        description: The deepest chamber in the dungeon. The walls pulse with rhythmic light, and the floor is worn smooth by
          the continuous circling of the dungeon's apex predator. This is where the Echo ends.
      - title: The Resonance Throne
        description: A vaulted chamber dominated by a throne of fused crystal and stone. Whatever rules here has done so for a
          very long time. The air vibrates at a frequency that makes your bones ache.
  mobPools:
    common:
      - echo_wraith
      - echo_construct
      - echo_lurker
      - echo_guardian
    elite:
