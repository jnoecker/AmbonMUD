  "3010":
    name: the leather worker
    room: "3035"
    description: She looks as an honest, hard-working artisan who only just earns enough to keep herself going.
    level: 23
    hp: 1000
    minDamage: 21
    maxDamage: 28
    armor: 125
    xpReward: 4500
    goldMin: 99
    goldMax: 99
    tier: elite
  "3011":
    name: Hassan
    room: "3001"
    description: Big. Very big. Stupid. Very stupid. Hassan, the guardian of the Temple of Mota, towers over you. He's over
      12 feet tall, every inch of it muscle. It would be a Bad Thing to commit a crime in his presence.
    level: 45
    hp: 4499
    minDamage: 45
    maxDamage: 60
    armor: 175
    goldMin: 499
    goldMax: 499
    tier: boss
  "3012":
