zone: imported_zone
startRoom: "3001"
rooms:
  "3001":
    title: The Temple Of Mota
    description: |-
      You are in the southern end of the temple hall in the Temple of Mota.
      The temple has been constructed from giant marble blocks, eternal in
      appearance, and most of the walls are covered by ancient wall paintings
      picturing gods, giants and peasants.
         Large steps lead down through the grand temple gate, descending the huge
      mound upon which the temple is built and ends on the temple square below.
         Equally large steps lead UP through a small door into the ENTRANCE to MUD 
      SCHOOL.  (type 'up' to go to MUD SCHOOL.)  A small plaque is on this wall.
    exits:
      n: "3054"
      s: "3005"
      u: "3700"
  "3002":
    title: Cleric's Inner Sanctum
    description: |-
      This is the inner sanctum.  A picture of the mighty Mota is hanging on
      the wall, just above the altar which is set against the western wall.  A well
      in the middle of the floor leads down into darkness.  Vile smells waft from
      the depths.
    exits:
      e: "3003"
      d: "7026"
  "3003":
    title: Cleric's Bar
    description: |-
      The bar is one of the finest in the land, lucky it is members only.  Fine
      furniture is set all around the room.  A small sign is hanging on the wall.
    exits:
      s: "3004"
      w: "3002"
  "3004":
    title: Entrance to Cleric's Guild
    description: |-
      The entrance hall is a small modest room, reflecting the true nature of
      the Clerics.  The exit leads east to the temple square.  A small entrance to
      the bar is in the northern wall.
    exits:
      n: "3003"
      e: "3005"
  "3005":
    title: The Temple Square
    description: |-
      You are standing on the temple square.  Huge marble steps lead up to the
      temple gate.  The entrance to the Clerics Guild is to the west, and the old
      Grunting Boar Inn, is to the east.  Just south of here you see the market
      square, the center of Midgaard.
    exits:
      n: "3001"
      e: "3006"
      s: "3014"
      w: "3004"
      u: "3057"
  "3006":
    title: Entrance to the Grunting Boar Inn
    description: |-
      You are standing in the entrance hall of the Grunting Boar Inn.  The hall
      has been wisely decorated with simple but functional furniture.  A small
      staircase leads up to the defunct reception room and the bar is to the east.
    exits:
      e: "3007"
      w: "3005"
      u: "3008"
  "3007":
    title: The Grunting Boar
    description: |-
      You are standing in the bar.  The bar is set against the northern wall, old
      archaic writing, carvings and symbols cover its top.  A fireplace is built into
      the western wall, and through the southeastern windows you can see the temple
      square.  This place makes you feel like home.
      A small sign with big letters is fastened to the bar.
    exits:
      w: "3006"
  "3008":
    title: The Defunct Reception
    description: |-
      You are standing in a dusty, defunct reception.  The staircase leads
      down to the entrance hall.
    exits:
      d: "3006"
  "3009":
    title: The Bakery
    description: >-
      You are standing inside the small bakery.  A sweet scent of Danish and fine bread fills the room.  The bread and
      Danish are arranged in fine order on the shelves, and seem to be of the finest quality.

      A small sign is on the counter.
    exits:
      s: "3013"
  "3010":
    title: The General Store
    description: >-
      You are inside the general store.  All sorts of items are stacked on shelves behind the counter, safely out of
      your reach.

      A small note hangs on the wall.
    exits:
      s: "3015"
  "3011":
    title: The Weapon Shop
    description: You are inside the weapon shop.  There is a small note on the counter.
    exits:
      s: "3016"
  "3012":
    title: Main Street
    description: You are at the end of the main street of Midgaard.  South of here is the entrance to the Guild of Magic
      Users.  The street continues east towards the market square.  The magic shop is to the north and to the west is
      the city gate.
    exits:
      n: "3033"
      e: "3013"
      s: "3017"
      w: "3040"
  "3013":
    title: Main Street
    description: You are on the main street passing through the City of Midgaard.  South of here is the entrance to the
      Armoury, and the bakery is to the north.  East of here is the market square.
    exits:
      n: "3009"
      e: "3014"
      s: "3020"
      w: "3012"
  "3014":
    title: Market Square
    description: >-
      You are standing on the market square, the famous Square of Midgaard.

      A large, peculiar looking statue is standing in the middle of the square.

      Roads lead in every direction, north to the temple square, south to the common square, east and westbound is the
      main street.
    exits:
      n: "3005"
      e: "3015"
      s: "3025"
      w: "3013"
  "3015":
    title: The Main Street
    description: You are on Main Street crossing through town.  To the north is the general store, and the main street
      continues east.  To the west you see and hear the market place and to the south is the Jeweller's Shop.
    exits:
      n: "3010"
      e: "3016"
      s: "3034"
      w: "3014"
  "3016":
    title: The Main Street
    description: The main street, to the north is the weapon shop and to the south is the Guild of Swordsmen.  To the east
      you leave town and to the west the street leads to the market square.
    exits:
      n: "3011"
      e: "3041"
      s: "3021"
      w: "3015"
  "3017":
    title: Entrance to Mage's Guild
    description: The entrance hall is a small, poor lighted room.
    exits:
      n: "3012"
      s: "3018"
  "3018":
    title: Mage's Bar
    description: The bar is one of the wierdest in the land.  Mystical images float around the air.  Illusions of fine
      furniture appear all around the room.
    exits:
      n: "3017"
      e: "3019"
  "3019":
    title: Mage's Laboratory
    description: This is the Magical Experiments Laboratory.  Dark smoke-stained stones arch over numerous huge oaken
      tables, most of these cluttered with strange-looking pipes and flasks.  The floor is covered with half-erased
      pentagrams and even weirder symbols, and a blackboard in a dark corner has only been partially cleaned, some
      painful-looking letters faintly visible.  A well in the middle of the floor leads down into darkness.  Vile smells
      waft from the depths.
    exits:
      w: "3018"
      d: "7017"
  "3020":
    title: The Armoury
    description: The armoury with all kinds of armours on the walls and in the window.  You see helmets, shields and chain
      mails.  To the north is the main street. On the wall is a small note.
    exits:
      n: "3013"
  "3021":
    title: Entrance Hall to the Guild of Swordsmen
    description: The entrance hall to the Guild of Swordsmen.  A place where one has to be careful not to say something
      wrong (or right).  To the east is the bar and to the north is the main street.
    exits:
      n: "3016"
      e: "3022"
  "3022":
    title: The Bar of Swordsmen
    description: The bar of swordsmen, once upon a time beautifully furnished.  But now the furniture is all around you in
      small pieces.  To the south is the yard, and to the west is the entrance hall.
    exits:
      s: "3023"
      w: "3021"
  "3023":
    title: The Tournament and Practice Yard
    description: The practice yard of the fighters.  To the north is the bar.  A well leads down into darkness.
    exits:
      n: "3022"
      d: "7048"
  "3024":
    title: Eastern End of Poor Alley
    description: You are at the poor alley. South of here is the Grubby Inn and to the east you see common square.
      Melancholy's map shop is north. The alley continues further west.
    exits:
      n: "3160"
      e: "3025"
      s: "3048"
      w: "3044"
  "3025":
    title: The Common Square
    description: |-
      The common square, people pass you, talking to each other.  To the west is
      the poor alley and to the east is the dark alley.  To the north, this square
      is connected to the market square.  From the south you notice a nasty smell.
    exits:
      n: "3014"
      e: "3026"
      s: "3030"
      w: "3024"
  "3026":
    title: The Dark Alley
    description: |-
      The dark alley, to the west is the common square and to the south is the
      Guild of Thieves.  Grebe's Tavern, the famous sailor's dive, is north.
      The alley continues east.
    exits:
      n: "3352"
      e: "3045"
      s: "3027"
      w: "3025"
  "3027":
    title: Entrance Hall to the Guild of Thieves
    description: |-
      The entrance hall to the thieves' and assassins' guild.  A place where you
      can lose both your life and your money, if you are not careful.  To the north
      is the dark alley and to the east is the thieves' bar.
    exits:
      n: "3026"
      e: "3028"
  "3028":
    title: The Thieves Bar
    description: |-
      The bar of the thieves.  Once upon a time this place was beautifully
      furnished, but now it seems almost empty.  To the south is the yard, and to
      the west is the entrance hall.
         (Maybe the furniture has been stolen?!)
    exits:
      s: "3029"
      w: "3027"
  "3029":
    title: The Secret Yard
    description: |-
      The secret practice yard of thieves and assassins.  To the north is the
      bar.  A well leads down into darkness.
    exits:
      n: "3028"
      d: "7043"
  "3030":
    title: The Dump
    description: |-
      The dump, where the people from the city drop their garbage.  Through the
      garbage you can see a large junction of pipes, looks like the entrance to the
      sewer system.  South of here you see the river and to the north is the common
      square.  A rickety old bridge leads south to the promenade.
    exits:
      n: "3025"
      s: "3254"
      d: "7030"
  "3031":
    title: The Pet Shop
    description: |-
      The Pet Shop is a small crowded store, full of cages and animals of
      various sorts and sizes.  There is a sign on the wall.
    exits:
      s: "3045"
  "3032":
    title: Pet Shop Store
    description: |-
      This is the small dark room in which the Pet Shop Boy keeps his pets.
      It is vital that this room be immediately after the pet shop.
  "3033":
    title: The Magic Shop
    description: You are in a small room that smells of rare chemicals and spices. Dividing the room in two is a large desk,
      and on the wall behind it are numerous shelves crammed with jars, bottles, books and scrolls of all sorts and
      sizes.
    exits:
      s: "3012"
  "3034":
    title: The Jeweller's Shop
    description: You are in a small, beautifully furnished room. The warm light emanating from the small oil lamps on the
      walls is reflected in the hard, polished surface of the big mahogany desk that stands in the centre of the room. A
      small sign with golden letters stands on the desk.
    exits:
      n: "3015"
  "3035":
    title: The Leather Shop
    description: An acrid smell fills this large room. Along the walls are numerous shelves containing all sorts of animal
      hide and in the crackling fireplace hangs a big iron pot with boiling water. In the middle of the room is a large
      oak table. A wooden sign is hanging above the fireplace.
    exits:
      s: "3044"
  "3040":
    title: Inside the West Gate of Midgaard
    description: You are by two small towers that have been built into the city wall and connected with a footbridge across
      the heavy wooden gate. Main Street leads east and Wall Road leads both north and south from here.
    exits:
      n: "3257"
      e: "3012"
      s: "3042"
      w:
        to: "3052"
        door:
          closed: true
  "3041":
    title: Inside the East Gate of Midgaard
    description: You are by two small towers that have been built into the city wall and connected with a footbridge across
      the heavy wooden gate. Main Street leads west from here. Wall road crosses the street, heading north and south
      along the city wall.
    exits:
      n: "3267"
      e:
        to: "3053"
        door:
          closed: true
      s: "3250"
      w: "3016"
  "3042":
    title: Wall Road
    description: You are walking next to the western city wall. The road continues further south and the city gate is just
      north of here.
    exits:
      n: "3040"
      s: "3043"
  "3043":
    title: Wall Road
    description: You are walking next to the western city wall. Wall Road continues further north and south. A small, poor
      alley leads east. Some letters have been written on the wall here.
    exits:
      n: "3042"
      e: "3044"
      s: "3047"
  "3044":
    title: Poor Alley
    description: You are in narrow and dirty alley leading east and west. The leather shop is to the north.
    exits:
      n: "3035"
      e: "3024"
      s: "3170"
      w: "3043"
  "3045":
    title: Alley at Levee
    description: You are standing in the alley which continues east and west.  South of here you see the levee.  North is
      the Pet Shop.
    exits:
      n: "3031"
      e: "3046"
      s: "3049"
      w: "3026"
  "3046":
    title: Eastern end of Alley
    description: You are standing at the eastern end of the alley,  near the city walls.  Wall road loops around the city to
      your east, and you can see an old three-story warehouse to the south.  The Fountain of Youth Apothecary is north.
    exits:
      n: "3056"
      e: "3251"
      s: "3050"
      w: "3045"
  "3047":
    title: Wall Road
    description: You are standing on the road next to the western city wall which continues north.  South of here is a
      bridge across the river.  To the east, you see an odd looking building painted bright orange with purple trim...
      it must be the Mob Factory!
    exits:
      n: "3043"
      e: "9400"
      s: "3051"
  "3048":
    title: Grubby Inn
    description: You are inside the old Grubby Inn.  This place has not been cleaned for several decades, vile smells make
      you dizzy.
    exits:
      n: "3024"
  "3049":
    title: Levee
    description: You are at the levee.  South of here you see the river gently flowing west. The river bank is very low
      making it possible to enter the river.  Directly across the river you can see a small boat landing built off of
      Kate's Diner.
    exits:
      n: "3045"
      s: "3203"
  "3050":
    title: Abandoned Warehouse
    description: You are inside the only room in the old warehouse.  The place is very dusty and appears to have been unused
      for many years.  The skylight spills violet-tinged light.
    exits:
      n: "3046"
      u: "8604"
  "3051":
    title: On the Bridge
    description: You are standing on the stone bridge crosses the river.  The bridge is built out from the western city wall
      and the river flows west through an opening in the wall ten feet below the bridge.
    exits:
      n: "3047"
      s: "3100"
  "3052":
    title: Outside the West Gate of Midgaard
    description: You are by two small towers that have been built into the city wall and connected with a footbridge across
      the heavy wooden gate.  To the west you can see the edge of a big forest. A small dusty trail leads north along
      the wall.
    exits:
      n: "3900"
      e:
        to: "3040"
        door:
          closed: true
      w: "6000"
  "3053":
    title: Outside the East Gate of Midgaard
    description: You are by two small towers that have been built into the city wall and connected with a footbridge across
      the heavy wooden gate.  To the east the plains stretch out in the distance. To the north a small dusty trail
      follow the city wall.
    exits:
      n: "3908"
      e: "3503"
      w:
        to: "3041"
        door:
          closed: true
  "3054":
    title: By the Temple Altar
    description: You are by the temple altar in the northern end of the Temple of Mota. A huge altar made from white
      polished marble is standing in front of you and behind it is a ten foot tall sitting statue of Odin, the King of
      the Gods. The back of the altar opens into a a beautiful atrium, above which can be seen a rainbow.
    exits:
      s: "3001"
      u: "1215"
  "3056":
    title: The Fountain of Youth Apothecary
    description: An old man putters around behind the counter, making strange love potions and curative philtres.  He turns
      as you enter, and looks on with avarice. Judging from the furnishings, he's been made very wealthy by his trade.
    exits:
      s: "3046"
  "3057":
    title: In the air...
    description: WOW you can fly!  You are floating in the air above Temple Square of Midgaard.
    exits:
      u: "1017"
      d: "3005"
  "3100":
    title: Northwest end of Concourse
    description: You are at the concourse, the city wall is just west.  A small promenade goes east, and the bridge is just
      north of here.  The concourse continues south along the city wall.
    exits:
      n: "3051"
      e: "3101"
      s: "3270"
  "3101":
    title: Promenade
    description: The river gently flows west just north of here.  The promenade continues further east and to the west you
      see the city wall.  Park Road leads south from here.
    exits:
      e: "3102"
      s: "3131"
      w: "3100"
  "3102":
    title: Promenade
    description: The river gently flows west just north of here.  The promenade continues both east and west.  A rickety
      bridge crosses the river to the north, towards the city dump (fortunately, the wind is blowing towards the dump
      today). South of here you see the entrance to the park, and a small building seems to be just west of the
      entrance.  Austral Square, home of Kate's Diner, lies to your east.
    exits:
      n: "3254"
      e: "3103"
      s: "3105"
      w: "3101"
  "3103":
    title: Austral Square
    description: The Promenade opens here onto Austral Square, on the south bank of the Midgaard River.  All around you is
      the bustle of Southern Midgaard-- shopkeepers on break, a town gossip or two prattling away.  You hear the river
      lapping at the pilings of the dock by Kate's Diner, which is to your north.  Emerald Avenue begins to the south,
      the Promenade continues west, and the concourse ends to your east.
    exits:
      n: "3150"
      e: "3104"
      s: "3132"
      w: "3102"
  "3104":
    title: Northeast end of Concourse
    description: |-
      You are at the Concourse.  The city wall is just east and Austral Square,
      home of Kate's Diner, is west.  Looking across the river you see an old  
      warehouse.  A strong stone bridge crosses the river to the north, where the
      concourse becomes wall road.  The Concourse continues south along the wall.
    exits:
      n: "3253"
      s: "3272"
      w: "3103"
  "3105":
    title: Park Entrance
    description: |-
      You are standing just inside the small park of Midgaard.  To the north is
      the promenade and a small path leads south into the park.  To your east is
      the famous Park Cafe.
    exits:
      n: "3102"
      e: "3106"
      s: "3108"
  "3106":
    title: Park Cafe
    description: |-
      You are inside Park Cafe, a very well lighted, cosy place. The cafe
      is built from large logs. Through the windows in the northern wall you
      see the river, and through the southern window you see many vigorous
      colorful plants.
    exits:
      w: "3105"
  "3107":
    title: Small path through the park
    description: |-
      You are walking along a small path through the park.  The path continues
      south and east.
    exits:
      e: "3108"
      s: "3113"
  "3108":
    title: Small path in the park
    description: |-
      You are standing on a small path inside the park.  The park entrance is
      just north of here, and Park Cafe is just east of the entrance.  The path
      leads further east and west.
    exits:
      n: "3105"
      e: "3109"
      w: "3107"
  "3109":
    title: Small path in the park
    description: |-
      You are on a small path running through the park.  It continues west and
      south and just north of here you see the southern wall of Park Cafe.
    exits:
      s: "3115"
      w: "3108"
  "3110":
    title: Cityguard Head Quarters
    description: |-
      You are inside a tidy office.  A big desk made from dark wood is standing
      in the centre of the room.
    exits:
      e:
        to: "3111"
        door:
          closed: true
      w:
        to: "3142"
        door:
          closed: true
          locked: true
  "3111":
    title: Park Road
    description: |-
      The road continues north and south.  A building is just west of here, you
      notice a sign on the door.  The park entrance is to the east.
    exits:
      n: "3131"
      e: "3112"
      s: "3118"
      w:
        to: "3110"
        door:
          closed: true
  "3112":
    title: Western Park Entrance
    description: You are standing at the western end of the park.  A small path leads east into the park and going west
      through the entrance you will reach Park Road.
    exits:
      e: "3113"
      w: "3111"
  "3113":
    title: A path in the park
    description: You are in the park.  The paths lead north and west.  Westwards is the park entrance and to the east you
      see a small pond.
    exits:
      n: "3107"
      e: "3114"
      w: "3112"
  "3114":
    title: The Pond
    description: You are swimming around in the pond, feeling rather stupid.  You can get back on the path from the eastern
      and western end of the pond.
    exits:
      e: "3115"
      w: "3113"
  "3115":
    title: A path in the park
    description: You are in the park.  The paths lead north and east.  Eastwards is the park entrance and to the west you
      see a small pond.
    exits:
      n: "3109"
      e: "3116"
      w: "3114"
  "3116":
    title: Eastern Park Entrance
    description: You are standing at the eastern end of the park.  A small path leads west into the park.  Going east
      through the entrance you will reach Emerald Avenue.
    exits:
      e: "3117"
      w: "3115"
  "3117":
    title: Emerald Avenue
    description: You are at Emerald Avenue which continues north and south.  To the west is the park entrance and to the
      east is the not very big Town Hall of Midgaard.
    exits:
      n: "3132"
      e: "3137"
      s: "3119"
      w: "3116"
  "3118":
    title: Park Road
    description: You are on Park Road which leads north and south.
    exits:
      n: "3111"
      s: "3135"
  "3119":
    title: Emerald Avenue
    description: You are standing at a bend on Emerald Avenue.  The road leads north and west. To the east, you see some
      run-down slums...it looks like the bad part of town.
    exits:
      n: "3117"
      e: "2101"
      w: "3133"
  "3120":
    title: Road Crossing
    description: You are in the middle of the road cross.  Roads lead in all directions. A huge black iron chain as thick as
      a tree trunk is fastened into the ground at the centre of the road cross.  Its other end leads directly upwards
      towards the sky. A road sign is here.
    exits:
      n: "3133"
      e: "3136"
      s: "3134"
      w: "3135"
      u: "7914"
  "3121":
    title: Emerald Avenue
    description: You are standing at a bend on Emerald Avenue.  The road leads south and east.
    exits:
      e: "3134"
      s: "3125"
  "3122":
    title: Park Road
    description: You are on Park Road which leads south and north.  Elm Street is east of here.
    exits:
      n: "3136"
      e: "3123"
      s: "3126"
  "3123":
    title: Elm Street
    description: You are on Elm street.  Park Road is to the west and Elm Street continues in eastward direction.
    exits:
      e: "3124"
      w: "3122"
  "3124":
    title: Elm Street
    description: You near the end of Elm Street.  An old elm tree grows here.  A heavy iron grating is south, surrounding
      the city's graveyard.  You can see a sign hanging on the grate.  The concourse joins Elm Street to the east, and
      the street ends to the north near a run-down neighborhood.
    exits:
      n: "3144"
      e: "3273"
      s:
        to: "3600"
        door:
          closed: true
      w: "3123"
  "3125":
    title: Emerald Avenue
    description: You are on Emerald Avenue which continues north. The Concourse is south of here.
    exits:
      n: "3121"
      s: "3128"
  "3126":
    title: Park Road
    description: You are on Park Road which continues north.  The Concourse is south of here.
    exits:
      n: "3122"
      s: "3129"
  "3127":
    title: On the Concourse
    description: You are at the southwest corner of the city wall.  The Concourse leads both north and east.
    exits:
      n: "3271"
      e: "3128"
  "3128":
    title: On the Concourse
    description: You are walking around the scenic concourse as it continues its path around the city of Midgaard.  The
      south gate of the city lies to your east, and the southwestern corner of the city wall is west.  Emerald Avenue
      stretches out to the north.
    exits:
      n: "3125"
      e: "3255"
      w: "3127"
  "3129":
    title: On the Concourse
    description: The concourse continues its path around the city.  The southern gates of the city are west of here, and
      park road lies north.  The northeastern corner of the city wall is east.
    exits:
      n: "3126"
      e: "3130"
      w: "3255"
  "3130":
    title: On the Concourse
    description: You are at the southeast corner of the city wall.  The Concourse leads both north and west.
    exits:
      n: "3273"
      w: "3129"
  "3131":
    title: Park Road
    description: You are at Park Road which continues north and south.
    exits:
      n: "3101"
      s: "3111"
  "3132":
    title: Emerald Avenue
    description: You are standing on the north end of Emerald Avenue.  To the north is Austral Square and Kate's Diner, to
      the east is the small street Penny Lane.
    exits:
      n: "3103"
      e: "3139"
      s: "3117"
  "3133":
    title: Emerald Avenue
    description: You are standing at a bend on Emerald Avenue.  To the east the road goes on and to the south is the Road Crossing.
    exits:
      e: "3119"
      s: "3120"
  "3134":
    title: Emerald Avenue
    description: You are standing at a bend on Emerald Avenue.  To the west the road goes on and to the north is the Road Crossing.
    exits:
      n: "3120"
      w: "3121"
  "3135":
    title: Park Road
    description: You are at a bend on Park Road.  To the north the road goes on and to the east is the Road Crossing.  To
      the south, the ancient cliffs rise from deep under the ground, forming a wall.
    exits:
      n: "3118"
      e: "3120"
  "3136":
    title: Park Road
    description: You are at a bend on Park Road.  To the south the road goes on and to the west is the Road Crossing.
    exits:
      s: "3122"
      w: "3120"
  "3137":
    title: The Waiting Room
    description: You are standing in the waiting room at the town hall.  Wooden chairs stand along the walls and a long desk
      is placed in the middle of the room.
    exits:
      e: "3138"
      w: "3117"
  "3138":
    title: The Mayor's Office
    description: You are in the not very big office of the Mayor of Midgaard.  A large and polished but completely empty
      desk is standing in front of an armchair that looks so comfortable that it most of all resembles a bed with the
      head end raised slightly.
    exits:
      w: "3137"
  "3139":
    title: Penny Lane
    description: You are on Penny Lane.  Emerald Avenue is to the west and Penny Lane continues in eastward direction.
    exits:
      e: "3140"
      w: "3132"
  "3140":
    title: Penny Lane
    description: You are on Penny Lane.  The narrow road continues north and west, and the concourse intersects this street
      to the east.
    exits:
      n: "3141"
      e: "3272"
      w: "3139"
  "3141":
    title: The end of Penny Lane
    description: You are at the end of Penny Lane.  The only exit appears to be south.
    exits:
      s: "3140"
  "3142":
    title: Captain's Office
    description: You are in the Office of the Captain of the Guard.  The Midgaard Coat of Arms is hanging on the north wall
      and a heavy steel door is to the south.
    exits:
      e:
        to: "3110"
        door:
          closed: true
          locked: true
      s:
        to: "3143"
        door:
          closed: true
          locked: true
  "3143":
    title: The Jail
    description: You are in a dark and humid jail.  The dark stone walls are hard and cold to the touch.  A heavy steel door
      is to the north.
    exits:
      n:
        to: "3142"
        door:
          closed: true
          locked: true
  "3144":
    title: The end of Elm Street
    description: Elm street ends here, next to a dangerous-looking run down neighborhood. You can enter the slums to the
      east, or head towards the graveyard to the south.  It occurs to you that this isn't the happiest section of town.
    exits:
      e: "2160"
      s: "3124"
  "3150":
    title: Kate's Diner
    description: The smells of baking bread and simmering stew lead you dancing through the doorway of the diner.  No greasy
      spoons to be seen here-- the booth walls are covered in casual paisleys; the chairs are carved wood, rescued from
      garage sales.  Most tables have chess or backgammon boards carved and painted on their fingertip-smooth tops.  The
      refrain of some musical or other from the 1930's blends with the dusty golden light and the wonderful smells to
      put you completely at ease.  A huge picture window looks out over the Midgaard River, and a doorway leads north
      onto the dock and the South Bank river landing, while the main entrance to the south returns you to Austral
      Square. On most days you will find Kate here, testing a batch of stew or brewing a special pot of cinnamon coffee,
      eerily just in time for your arrival Pull up a chair, perhaps play a game, and take time out to talk.
    exits:
      n: "3203"
      s: "3103"
      u: "1219"
  "3160":
    title: Melancholy's Maps
    description: As you walk in, a sudden gust of wind enters the shop and sends several scraps of paper fly around the
      room.  You blink as the dust you've stirred up stings your eyes, and take a look around the shop.  This shop is
      cluttered with old pieces of parchment, stacks of books, and odd scraps.  A desk with slightly less clutter than
      the rest of the shop is in front of you.  A scroll case full of scrolls is behind the desk.  A bookcase is to the
      right of you, and to the left is a window overlooking the Common Square.  A small door, half hidden by a stack of
      books, leads to a room in the back of the shop.
    exits:
      n:
        to: "3161"
        door:
          closed: true
          locked: true
      s: "3024"
  "3161":
    title: Melancholy's Room
    description: A faint smell of incense teases your nose as you enter this room.  You step onto a soft bearskin rug and
      look around.  A simple bed lies against the far wall.  At the foot of it is a sturdy, ironbound chest, most likely
      full of Melancholy's trappings from her adventuring days.  On a small table under a window to the east is a vase
      with a single white rose.  Other than that, the room is quite bare.
    exits:
      s:
        to: "3160"
        door:
          closed: true
          locked: true
      u: "1219"
  "3170":
    title: Temple Of Stupid
    description: As you enter the abandoned warehouse your eyes blink violently to adjust to the almost total darkness.  You
      wonder where the windows are as you step into a mud puddle in the middle of the floor.  As your eyes adjust, you
      realize that there are mud puddles all around the room, and this is some weird version of windows.  In a flash of
      revelation, you realize that you've entered the Temple of Stupid.
    exits:
      n: "3044"
      u: "1219"
  "3200":
    title: Under the Bridge
    description: The arch under the bridge is covered by seaweed for one foot above the surface of the river.  The water
      gently flows through an opening in the lower part of the city wall.
    exits:
      e: "3201"
      w: "9772"
  "3201":
    title: On the River
    description: North of here you see the miserable buildings of the poor alley.  The river flows west towards the
      bridge.  The riverbanks are too steep to climb.
    exits:
      e: "3202"
      w: "3200"
  "3202":
    title: On the River
    description: North of here you see the dump.  The river flows from east to west.  The riverbanks are too steep to
      climb.  A bridge passes overhead, connecting the dump to the promenade.
    exits:
      e: "3203"
      w: "3201"
  "3203":
    title: On the River
    description: The levee is directly north of here, and a small boat landing for Kate's Diner is to the south.  The river
      flows in an east west direction.
    exits:
      n: "3049"
      e: "3204"
      s: "3150"
      w: "3202"
  "3204":
    title: On the River
    description: You see the warehouse on the northern riverbank.  East of here the river passes under the eastern bridge
      and through the city wall. The banks of the levee are west, in the direction of the current.
    exits:
      e: "3205"
      w: "3203"
  "3205":
    title: On the River
    description: The river enters from a hole in the eastern city wall.  The hole has been blocked by several vertically
      positioned iron bars set into the wall. Overhead you can see the stone buttresses of the eastern bridge.
    exits:
      e: "5001"
      w: "3204"
  "3250":
    title: Wall Road
    description: Wall road extends north and south along the eastern walls of the city. The east gate is north of you, south
      is an intersection with a dark alley. You check to make sure you still have your wallet.
    exits:
      n: "3041"
      s: "3251"
  "3251":
    title: Wall Road
    description: You are walking along the eastern wall of the city, on a road extending between the east gate and a bridge
      to the south.  A dark, dirty alley lies west of here.  You step carefully around a pool of liquid...who knows what
      it could be in a place this foul...
    exits:
      n: "3250"
      s: "3252"
      w: "3046"
  "3252":
    title: Wall Road
    description: The walls of Midgaard tower above you to the east, keeping the city safe from its enemies...you hope.  An
      intersection with a dark alley lies north, and a bridge over the Midgaard river is south.  Beyond the bridge wall
      road turns in the concourse.
    exits:
      n: "3251"
      s: "3253"
  "3253":
    title: On the Bridge
    description: You are crossing a strong stone bridge, which spans the Midgaard river. Below you, the river flows into an
      opening in the city wall, sealed with strong metal bars.  North of you is wall road, south of here the concourse
      loops around the inside of the city walls.
    exits:
      n: "3252"
      s: "3104"
  "3254":
    title: The South Bridge
    description: You are standing on a small, rickety bridge leading from the Midgaard City Dump to the much more attractive
      promenade of the southern parts of Midgaard.  You can smell the stench of the dump to the north, the fresher air
      of the promenade seems preferable.  Below you are the swift-moving currents of the Midgaard river.
    exits:
      n:
        to: "3030"
        door:
          closed: true
      s: "3102"
  "3255":
    title: Inside the South Gate of Midgaard
    description: Two strong stone towers surround a heavy wooden gate set into the city wall, to guard against the goblins
      that lurk in the southern forests.  You can exit the city to the south, if you dare, or walk down the concourse to
      the east or west.
    exits:
      e: "3129"
      s:
        to: "3256"
        door:
          closed: true
      w: "3128"
  "3256":
    title: Outside the South Gate of Midgaard
    description: You are standing outside the strong wooden gate on the southern walls of Midgaard.  Guards eye you
      suspiciously from the two towers on either side of the gate, as they stand watch to protect the city from the
      goblins of this forest.  The trees and goblins of the Miden'nir are south, the gate back to Migaard lies north.
    exits:
      n:
        to: "3255"
        door:
          closed: true
      s: "3505"
  "3257":
    title: Wall Road
    description: You are walking along wall road, just north of the west gate of Midgaard.  The road continues along the
      western wall to the north, towards an intersection with a busy Clan street.
    exits:
      n: "3258"
      s: "3040"
  "3258":
    title: Wall Road
    description: Wall road intersects with a crowded Clan Road here, filled with shops and artisans.  The street stretches
      off to the east, towards the far wall of the city.  Wall road continues to the north and south.
    exits:
      n: "3259"
      e: "3301"
      s: "3257"
  "3259":
    title: Wall Road
    description: You are walking along wall road, which extends along the inside of the western wall of Midgaard.  To the
      south, you can see an intersection with a crowded Clan street.  The northwestern corner of the city wall lies
      ahead to the north.
    exits:
      n: "3260"
      s: "3258"
  "3260":
    title: The Northwest Corner
    description: You are standing beneath the northwestern corner of the city wall, on a turn in wall road.  You can head
      south, towards the west gate, or east, to the north gate.
    exits:
      e: "3261"
      s: "3259"
  "3261":
    title: Wall Road
    description: The city walls tower over you as walk down wall road, between the northwestern corner of the wall to the
      west, and the northern gate of Midgaard to the east.
    exits:
      e: "3262"
      w: "3260"
  "3262":
    title: Inside the North Gate of Midgaard
    description: Two small towers surround a strong wooden gate, connected by a small stone bridge set with murder
      holes.  This gate is not as heavily guarded as the others, as the plains outside are safe to travel.  You can
      leave midgaard to the north, or continues along wall road to the west and east.  A teeming clan street is visible
      to the south, and beyond that the graceful spires of the Temple of Mota, but there is no way to reach them from
      here.
    exits:
      n:
        to: "3268"
        door:
          closed: true
      e: "3263"
      w: "3261"
  "3263":
    title: Wall Road
    description: You are walking along wall road, between the northern gate of the city and the northeastern corner of the
      city walls.  You can see bloodstains on the road... better be on guard for thieves.
    exits:
      e: "3264"
      w: "3262"
  "3264":
    title: The Northeast Corner
    description: Wall road turns the corner here, as you pass by the northeastern edge of the city wall.  The north gate
      lies to your west, and the road south leads to the eastern gate of Midgaard.
    exits:
      s: "3265"
      w: "3263"
  "3265":
    title: Wall Road
    description: Just south of you is an intersection with a crowded clan street.  The eastern wall of Midgaard is beside
      you, and to the north you can see the northeast corner of the city wall.
    exits:
      n: "3264"
      s: "3266"
  "3266":
    title: Wall Road
    description: Here, wall road meets up with a busy clan street heading off towards the west, and the far wall of the
      city.  You can smell spices, perfume, freshly cured hide, and other strange scents, all mingle together in one
      heady aroma. Wall road continues to the north and south.
    exits:
      n: "3265"
      s: "3267"
      w: "3316"
  "3267":
    title: Wall Road
    description: You are near the center of wall road, just north of the east gate of the city. To the north, you can see an
      intersection with a crowded clan street. The guards at the gate eye you suspiciously from afar.
    exits:
      n: "3266"
      s: "3041"
  "3268":
    title: Outside the North Gate of Midgaard
    description: You stand outside the north gate of the walled city of Midgaard.  A dusty trail is visibile to the north,
      it stretches around the walls of the city.  Further north are the wide expanses of the northern plains, leading to
      the village of Ofcol.  You can return to Midgaard to the south.
    exits:
      n: "3904"
      s:
        to: "3262"
        door:
          closed: true
  "3270":
    title: On the Concourse
    description: The strong stone walls of Midgaard rise up to the west, keeping evil at bay. The concourse heads towards a
      bridge to the north, and continues south alongside a beautiful park.
    exits:
      n: "3100"
      s: "3271"
  "3271":
    title: On the Concourse near the park
    description: You are walking down the Concoruse, along the western wall of Midgaard.  To the north, the road passes by a
      beautiful park, to the south, you can see the southwest corner of the city wall.
    exits:
      n: "3270"
      s: "3127"
  "3272":
    title: On the Concourse at Penny Lane
    description: You are on a road leading around the inner walls of Midgaard.  To the north, the concourse heads towards a
      bridge into northern Midgaard.  To the south, you can see an intersection with Elm Street.  The quaint paved
      streets of Penny Lane lie west.
    exits:
      n: "3104"
      s: "3273"
      w: "3140"
  "3273":
    title: On the Concourse at Elm Street
    description: The air grows chill as you pass near the Elm Street graveyard.  The walls of Midgaard are to the east, and
      the concourse continues to the north and south. To your west, you see Elm Street at the graveyard entrance.
    exits:
      n: "3272"
      s: "3130"
      w: "3124"
  "3301":
    title: Clan Road
    description: You are standing on the western end of Clan Road.  The traffic here is light.  This is a quieter section of
      Midgaard.  You can hear the sound of haggling coming from the east.
    exits:
      e: "3302"
      w: "3258"
  "3302":
    title: Clan Road
    description: You are walking along Clan Road.  To the south of you is the money changer. Clan Road continues on to the
      east and the west.
    exits:
      e: "3303"
      s: "3334"
      w: "3301"
  "3303":
    title: Clan Road
    description: The shops on this stretch of Clan road are long-closed and boarded up. Not much traffic passes through this
      part, as there is nothing to buy.
    exits:
      e: "3314"
      w: "3302"
  "3314":
    title: Clan Road
    description: Noise and light abound on this part of Clan Road.  Clan road continues off to the east and west.
    exits:
      e: "3315"
      w: "3303"
  "3315":
    title: Clan Road
    description: Clan Road seems to widen here slightly, allowing more traffic to travel through the area.  To the south is
      another entrance to the busy pub.  This door is also open wide and spilling forth the sounds of happy
      patrons.  Clan Road continues to the east and west.
    exits:
      e: "3316"
      s: "3356"
      w: "3314"
  "3316":
    title: Clan Road
    description: You are at the eastern end of Clan Road.  To the east of you, the tall wall around the city looms up before
      you and casts its shadow on you.  Clan Road continues to the west.
    exits:
      e: "3266"
      w: "3315"
  "3334":
    title: A Money Changer's Room
    description: A few strategically placed lanterns keep this place well-lit in the absence of any windows.  The room is
      surprisingly well appointed with tapestries hanging on the walls.  You'd wager your life the moneylender's guards
      are behind them, as there are none here.  The moneylender himself works from behind a large desk, no doubt holding
      a fortune in gold and silver. A smallish sign hangs on the wall, lettered in common.
    exits:
      n: "3302"
  "3352":
    title: Grebe's Tavern
    description: Dive.  That's all you can say about this place; its a dive.  You step carefully over the dead and/or drunk
      sailors on the floor toward the center of the room.  There's no decorations on the wall; they've all been ripped
      down in anger or for use as weapons at one time or another.  Looking around, you search vainly for a clean table
      to sit at, and then give up.
    exits:
      s: "3026"
  "3355":
    title: Andy's Pub
    description: The busy pub is filled with patrons.  People are laughing and singing. A minstrel plays his lute in another
      part of the pub, and a few people are even dancing.  Andy, the pubs owner, wanders around and checks to see that
      the needs of his customers are met.  The bar is to your south.  East of you is another section of the pub.  You
      know that there are rooms to be had somewhere around here...
    exits:
      e: "3356"
      s: "3357"
  "3356":
    title: A Room in the Pub
    description: This part of the pub is filled with dancing and singing.  A wandering minstrel is on a chair in a corner
      with his lute.  A busty red headed woman is standing near him and singing a tale of comedic heroism. Drunk men sit
      laughing at their tables and busy bar maids weave through the crowd with full mugs and horns of ale and
      mead.  Another part of the pub is located to your west. The bar is to the south.  A set of steps occupy in a
      corner of the room.  They lead up to the inn section of this prosperous establishment.
    exits:
      n: "3315"
      s: "3358"
      w: "3355"
      u: "3359"
  "3357":
    title: The Bar
    description: A long mahogany bar is set in the back of the pub.  Mugs line a shelf behind the bar.  Bottles of strong,
      nasty looking liquids decorate one of the lower shelves.  A large cask rests on a table behind the bar.  A strong
      but friendly-looking bartender stands next to the cask polishing glasses.  A couple of the bar maids stand in a
      corner and throw the most inviting glances your way. A sign is on the wall.
    exits:
      n: "3355"
  "3358":
    title: The Bar
    description: A long mahogany bar is set in the back of the pub.  Mugs line a shelf behind the bar.  Bottles of strong,
      nasty looking liquids decorate one of the lower shelves.  A large cask rests on a table behind the bar.  A strong
      but friendly looking bartender stands next to the cask polishing glasses.  A couple of the bar maids stand in a
      corner and throw the most inviting glances your way.
    exits:
      n: "3356"
  "3359":
    title: The Inn
    description: You are standing upstairs from Andy's Pub at Andy's Inn.  A few chairs and a couple of end tables give the
      room a `homey' atmosphere.  A large stone fireplace burns brightly against one wall and warms the room.  A large
      oak desk is nestled in one corner of the room.  A small man with wire-framed glasses sits behind the desk working
      dilligently on his books. He looks up as you enter the room.  He looks at you quizzically.  He is probably waiting
      for you to ask him for a room.
    exits:
      d: "3356"
mobs:
