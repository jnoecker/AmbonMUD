zone: thornhaven_city
startRoom: new_arrivals_hall
lifespan: 0

image:
  room: demo/DefaultRoom.png
  mob: demo/DefaultMob.png
  item: demo/DefaultObject.png

# ─── Items ────────────────────────────────────────────────────────────────────

items:
  # General store — starter gear
  worn_sword:
    displayName: "a worn iron sword"
    keyword: sword
    slot: hand
    damage: 3
    basePrice: 20
    description: "A short-bladed sword with a well-worn grip. Still serviceable."

  battered_staff:
    displayName: "a battered oak staff"
    keyword: staff
    slot: hand
    damage: 2
    basePrice: 15
    description: "A gnarled oak staff, nicked and scratched from long use."

  hunting_bow:
    displayName: "a hunting bow"
    keyword: bow
    slot: hand
    damage: 3
    basePrice: 20
    description: "A simple recurve bow strung with gut. Good for the road."

  rusty_dagger:
    displayName: "a rusty dagger"
    keyword: dagger
    slot: hand
    damage: 2
    basePrice: 10
    description: "A short blade mottled with rust. Still sharp at the tip."

  leather_cap:
    displayName: "a leather cap"
    keyword: cap
    slot: head
    armor: 1
    basePrice: 15
    description: "A simple cap of boiled leather. Modest protection."

  padded_vest:
    displayName: "a padded vest"
    keyword: vest
    slot: body
    armor: 1
    basePrice: 25
    description: "Thick cloth padding sewn into a close-fitting vest."

  minor_healing_potion:
    displayName: "a minor healing potion"
    keyword: potion
    consumable: true
    onUse:
      healHp: 15
    basePrice: 50
    description: "A small vial of cherry-red liquid. Restores a modest amount of health."

  clarity_potion:
    displayName: "a clarity potion"
    keyword: clarity
    consumable: true
    onUse:
      healHp: 5
    basePrice: 75
    description: "A silver-blue draught that steadies the mind and eases the spirit."

  # Market items available for upgrade purchase
  iron_sword:
    displayName: "an iron sword"
    keyword: sword
    slot: hand
    damage: 5
    basePrice: 80
    description: "A standard issue iron sword, sturdy and well-balanced."

  oak_staff:
    displayName: "an oak staff"
    keyword: staff
    slot: hand
    damage: 3
    basePrice: 60
    description: "A polished staff of dense oak, engraved with simple runes."

  short_bow:
    displayName: "a short bow"
    keyword: bow
    slot: hand
    damage: 5
    basePrice: 80
    description: "A compact bow light enough to carry all day."

  silver_dagger:
    displayName: "a silver-tipped dagger"
    keyword: dagger
    slot: hand
    damage: 4
    basePrice: 70
    description: "A sleek dagger with a silver point — effective against the undead."

  iron_helm:
    displayName: "an iron helm"
    keyword: helm
    slot: head
    armor: 2
    basePrice: 60
    description: "A plain iron helm dented by use but solid enough."

  chainmail_vest:
    displayName: "a chainmail vest"
    keyword: chainmail
    slot: body
    armor: 3
    basePrice: 120
    description: "Interlocked rings of iron sewn onto leather backing."

  leather_bracers:
    displayName: "leather bracers"
    keyword: bracers
    slot: hand
    armor: 1
    basePrice: 35
    description: "Strapped leather vambraces that protect the forearms."

# ─── Mobs ─────────────────────────────────────────────────────────────────────

mobs:
  innkeeper_mira:
    name: "Innkeeper Mira"
    room: tarnished_flagon_inn
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome to the Tarnished Flagon — the finest inn in Thornhaven, and the only one! Will you be setting up a recall point here?"
        choices:
          - text: "Set this inn as my recall point."
            next: confirm_recall
            action: set_recall
          - text: "Tell me about recall."
            next: explain_recall
          - text: "Goodbye."
            next: farewell
      confirm_recall:
        text: "Done! The Tarnished Flagon is your home away from home. Type 'recall' anywhere in the world to return here."
        choices:
          - text: "Thanks, Mira."
            next: farewell
      explain_recall:
        text: "Your recall point is your anchor in the world. Type 'recall' at any time and you'll be whisked back here instantly — very handy when you're lost or in trouble."
        choices:
          - text: "Set this inn as my recall point."
            next: confirm_recall
            action: set_recall
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Safe travels, adventurer. The door's always open."

  banker_theron:
    name: "Banker Theron"
    room: thornhaven_bank
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Good day. The Thornhaven Bank is at your service. Deposits, withdrawals, item storage — all handled with complete discretion."
        choices:
          - text: "How does the bank work?"
            next: explain_bank
          - text: "Goodbye."
            next: farewell
      explain_bank:
        text: "Deposit gold with 'bank deposit <amount>' and withdraw with 'bank withdraw <amount>'. Store items with 'bank deposit <item>'. Check your balance with 'bank balance'. Your assets are safe no matter what happens to you in the field."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Good day to you."

  auctioneer_brant:
    name: "Auctioneer Brant"
    room: auction_hall
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Step right up! Eryndal's premier auction house. List your wares, browse the offerings — everything's on the table!"
        choices:
          - text: "How do I use the auction house?"
            next: explain_auction
          - text: "Goodbye."
            next: farewell
      explain_auction:
        text: "'auction list' browses current listings. 'auction sell <item> <price>' lists something of your own. 'auction buy <listing#>' purchases it. 'auction cancel' pulls your listing."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "May your bids be profitable!"

  mail_clerk_oswin:
    name: "Mail Clerk Oswin"
    room: post_office
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Thornhaven Post — I handle all correspondence. Need to send word to someone, or check if anything has arrived for you?"
        choices:
          - text: "How do I send and read mail?"
            next: explain_mail
          - text: "Goodbye."
            next: farewell
      explain_mail:
        text: "'mail list' shows your inbox. 'mail read <#>' reads a message. 'mail send <player> <message>' composes one. 'mail delete <#>' discards it. Messages wait here until you return."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "I'll keep the letters safe. Safe travels."

  guild_registrar:
    name: "Guild Registrar Edda"
    room: guild_registry
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "The Thornhaven Guild Registry. Looking to found a guild, or manage one you already lead?"
        choices:
          - text: "How do guilds work?"
            next: explain_guild
          - text: "Goodbye."
            next: farewell
      explain_guild:
        text: "'guild create <name>' founds a new guild. 'guild invite <player>' recruits members. 'guild promote' and 'guild demote' manage ranks. 'guild roster' lists members. Use 'gchat' to speak in your guild channel."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "May your guild stand long."

  arena_master:
    name: "Arena Master Koryn"
    room: arena_district
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome to the Thornhaven Arena! The finest venue for honourable combat in the realm. Ready to test your blade?"
        choices:
          - text: "How does dueling work?"
            next: explain_duel
          - text: "Tell me about the leaderboards."
            next: explain_leaderboard
          - text: "Goodbye."
            next: farewell
      explain_duel:
        text: "'duel challenge <name>' challenges another player. They accept with 'duel accept'. The duel ends when one of you falls — no death penalty, just honour."
        choices:
          - text: "Tell me about the leaderboards."
            next: explain_leaderboard
          - text: "Goodbye."
            next: farewell
      explain_leaderboard:
        text: "Type 'leaderboard' to see who stands tallest in Eryndal. The Trophy Hall nearby records legendary deeds permanently with 'halloffame'."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Fight well. Fight with honour."

  old_grimly:
    name: "Old Grimly"
    room: grimlys_study
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Ah, another brave soul. Sit down. Old Grimly knows the way into places the sane avoid. The Dungeon of Echoes — you've heard of it?"
        choices:
          - text: "Tell me about the Dungeon of Echoes."
            next: explain_dungeon
          - text: "How do I enter?"
            next: how_to_enter
          - text: "Goodbye."
            next: farewell
      explain_dungeon:
        text: "The Dungeon of Echoes is a labyrinth that reshapes itself for every party. No two runs alike. Mobs scale to your level, boss lurking at the end. Two difficulties: standard and hard."
        choices:
          - text: "How do I enter?"
            next: how_to_enter
          - text: "Goodbye."
            next: farewell
      how_to_enter:
        text: "Right here in this study — type 'dungeon enter dungeon_of_echoes' for a standard run. Add 'hard' at the end for the hard version. You'll return here when you finish or flee."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Mind the shadows, friend. They have teeth."

  trainer_captain_varek:
    name: "Captain Varek"
    room: warrior_training_hall
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Warrior. I am Captain Varek. Skill points are yours to spend — spend them well. Type 'train list' to see what I can teach you."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "Goodbye."
            next: farewell
      training_info:
        text: "'train list' shows available abilities. 'train learn <ability>' spends a skill point. You earn points as you level. At level 10 you may also unlock a second class with 'train unlock'."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Train hard. Train every day."

  trainer_archmage_solen:
    name: "Archmage Solen"
    room: mage_library
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Ah, a seeker of arcane knowledge. I am Archmage Solen. Magic is not bestowed — it is earned. Type 'train list' to see what I offer."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "Goodbye."
            next: farewell
      training_info:
        text: "Skill points are the currency of knowledge. 'train list' shows available spells. 'train learn <spell>' spends one point. Master every spell before you consider a second vocation."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Knowledge is the only power that endures."

  trainer_high_priest_aldric:
    name: "High Priest Aldric"
    room: cleric_chapel
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Blessings upon you. I am High Priest Aldric. The light heals those who serve faithfully. Use 'train list' to see which prayers I can teach."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "Goodbye."
            next: farewell
      training_info:
        text: "Each skill point spent here is a prayer answered. 'train list' shows available blessings and rites. 'train learn <ability>' invests a point. The divine rewards devotion."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "May the light walk with you always."

  trainer_shade:
    name: "Shadow"
    room: rogue_den
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "...You found me. Most don't. That's promising. I'm called Shade. I teach those with quick hands and quiet feet. 'train list' if you're serious."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "Tell me about the sewers."
            next: sewer_hint
          - text: "Goodbye."
            next: farewell
      training_info:
        text: "'train list' shows my curriculum. 'train learn <skill>' costs a skill point. Master everything I offer and you'll reach places others can't. Like the sewers beneath Thornhaven."
        choices:
          - text: "Tell me about the sewers."
            next: sewer_hint
          - text: "Goodbye."
            next: farewell
      sewer_hint:
        text: "Thornhaven sits on old tunnels. Very old. Very interesting. Prove yourself — reach the right skill level — and maybe I'll show you where the grate is."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Don't let them see you leave."

  trainer_forester_lenna:
    name: "Forester Lenna"
    room: ranger_outpost
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Easy now. Name's Lenna. I range the Thornwood and beyond. Ranger looking to sharpen up? Type 'train list' — I've got plenty to teach."
        choices:
          - text: "How does training work?"
            next: training_info
          - text: "Goodbye."
            next: farewell
      training_info:
        text: "'train list' shows available abilities. 'train learn <ability>' spends a skill point. Rangers can mark prey, summon a hawk, read the land. You'll find me in Thornwood Forest as well, if you're out that way."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Track true. Come back alive."

  shopkeeper_dolvan:
    name: "Dolvan the Merchant"
    room: general_store
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Welcome! Best gear in Thornhaven, fair prices. Type 'list' to browse, 'buy <item>' to purchase."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Come back when your purse is full."

  recipe_merchant_sylva:
    name: "Sylva the Recipe Merchant"
    room: crafting_quarter
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: "Looking to learn a craft? I deal in recipes for smithing and alchemy. Type 'list' to browse."
        choices:
          - text: "How does crafting work?"
            next: explain_crafting
          - text: "Goodbye."
            next: farewell
      explain_crafting:
        text: "Gather materials out in the world — herbs, ores, and more. Bring them to the forge, alchemy lab, or workbench depending on the recipe. Use 'craft <recipe>' to create the item. Your skills improve with each attempt."
        choices:
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "May your crafts come out quality!"

