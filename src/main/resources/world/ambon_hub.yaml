zone: ambon_hub
image:
  room: ambon_hub/default_room.png
  mob: ambon_hub/default_mob.png
  item: ambon_hub/default_item.png
lifespan: 0
startRoom: hall_of_portals

mobs:
  innkeeper:
    image: b2cd0fae5e52248078b5f7ece23bd58e63cb4f37d974f74956eafc71f74c1a01.png
    name: "the Innkeeper"
    room: wanderers_inn
    dialogue:
      root:
        text: "Welcome to the Wanderer's Inn! We offer comfortable beds for weary travelers. Would you like to rent a room?"
        choices:
          - text: "Yes, I'd like to rent a room."
            next: confirm
            action: set_recall
          - text: "What is a recall point?"
            next: explain
          - text: "I'd like to visit my house."
            action: enter_house
          - text: "No thanks, just passing through."
      confirm:
        text: "Excellent! Your room is ready whenever you need it. Type 'recall' at any time to return here instantly."
        choices:
          - text: "Thank you!"
      explain:
        text: "If you rent a room here, this inn becomes your recall point. Type 'recall' anywhere in the world to teleport back. Very handy when you're lost or in trouble!"
        choices:
          - text: "I'd like to rent a room, then."
            next: confirm
            action: set_recall
          - text: "I'll think about it."
  portal_keeper:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "the Portal Keeper"
    room: hall_of_portals
    dialogue:
      root:
        text: "Welcome, traveler! I am the Portal Keeper. I watch over the passages between realms. How may I help you?"
        choices:
          - text: "Tell me about the portals."
            next: about_portals
          - text: "Any advice for a new adventurer?"
            next: advice
          - text: "Goodbye."
      about_portals:
        text: "Each archway leads to a different realm. East leads to a scholar's retreat. West, through the gallery, you'll find the Wanderer's Inn — with a back door to old ruins and a trapdoor to a labyrinth. The gallery itself has a southern archway into a peaceful forest glade. And beyond the gallery, the training grounds await — marshlands, highlands, mines, and barrens for adventurers of all ranks."
        choices:
          - text: "What about the ruins and the labyrinth?"
            next: ruins_and_labyrinth
          - text: "Tell me about the forest glade."
            next: tutorial_glade
          - text: "Tell me about the training grounds."
            next: training
            minLevel: 3
          - text: "Thank you."
      ruins_and_labyrinth:
        text: "Head west to the gallery, then north to the Wanderer's Inn. Through the inn's back door you'll find the Demo Ruins — a caravan camp at the edge of crumbling stonework, with traders, creatures, and old treasure. Below the inn, an iron trapdoor leads into the Labyrinth — an endless maze of repeating corridors. Adventurers enter to test their sense of direction. Some are still looking for the exit."
        choices:
          - text: "I'll check them out."
          - text: "Tell me about the other portals."
            next: about_portals
      tutorial_glade:
        text: "Through the gallery's southern archway lies the Tutorial Glade — a sun-dappled forest clearing. It's a gentle place, good for new adventurers finding their footing. Follow the mossy trail north and you'll find creatures to practice on, equipment to gather, and a few surprises."
        choices:
          - text: "Sounds peaceful. I'll start there."
          - text: "Tell me about the other portals."
            next: about_portals
      training:
        text: "The training grounds are divided by difficulty. The marshlands and highlands are suitable for novice adventurers, while the mines and barrens offer stiffer challenges. Each has its own creatures and rewards."
        choices:
          - text: "Sounds dangerous. I'll be careful."
      advice:
        text: "Head south through the gallery to the Tutorial Glade — it's gentle enough for new adventurers. Pick up equipment as you find it, and don't be afraid to flee from fights you can't win. Leveling up makes you stronger — check your 'score' often. Once you've gained a few levels, visit the Trainers' Corridor to the north to spend skill points on class abilities."
        choices:
          - text: "Thanks for the advice!"
          - text: "Tell me about the portals."
            next: about_portals

  warrior_trainer:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "Captain Varek"
    room: warrior_training_hall
    dialogue:
      root:
        text: "I'm Captain Varek, warrior trainer. Use 'train list' to see abilities available at your level, or 'train learn <ability>' to spend a skill point."
        choices:
          - text: "Tell me about warrior training."
            next: training_info
          - text: "How do skill points work?"
            next: skill_points
          - text: "Goodbye."
      training_info:
        text: "Warriors excel at melee combat — high damage, strong defenses, and battlefield control. Master your strikes and you'll be unstoppable."
        choices:
          - text: "Let me look at the training list."
      skill_points:
        text: "You earn one skill point every two levels. Type 'train list' to see what's available at your level, then 'train learn <ability>' to spend a point."
        choices:
          - text: "Got it, thanks."

  mage_trainer:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "Archmage Solvara"
    room: mage_library
    dialogue:
      root:
        text: "Greetings. I am Archmage Solvara. I can teach you the ways of elemental and arcane magic. Use 'train list' to see available spells."
        choices:
          - text: "Tell me about mage magic."
            next: training_info
          - text: "How do skill points work?"
            next: skill_points
          - text: "Goodbye."
      training_info:
        text: "Mages wield the destructive forces of fire, ice, and lightning. With enough skill points, you'll unlock devastating area spells and protective barriers."
        choices:
          - text: "I'd like to see the training list."
      skill_points:
        text: "Skill points are earned every two levels. Type 'train list' to see mage spells within your reach, then 'train learn <name>' to learn one."
        choices:
          - text: "Understood."

  cleric_trainer:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "High Priestess Ilara"
    room: cleric_sanctuary
    dialogue:
      root:
        text: "May the light guide you, adventurer. I am High Priestess Ilara. I can teach you the sacred arts of healing and divine power."
        choices:
          - text: "Tell me about the cleric path."
            next: training_info
          - text: "How do skill points work?"
            next: skill_points
          - text: "Farewell."
      training_info:
        text: "Clerics balance offense and defense — healing wounds, shielding allies, and smiting enemies with divine wrath. A cleric is never helpless."
        choices:
          - text: "I'd like to see the training list."
      skill_points:
        text: "You earn a skill point every two levels. Type 'train list' to see available cleric abilities, then 'train learn <name>' to spend a point."
        choices:
          - text: "Thank you."

  rogue_trainer:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "Shadowmaster Krix"
    room: rogue_den
    dialogue:
      root:
        text: "...you found me. Good. I'm Shadowmaster Krix. Capable rogues seek me out on their own. Type 'train list' to see what I can teach."
        choices:
          - text: "Tell me about rogue techniques."
            next: training_info
          - text: "How do skill points work?"
            next: skill_points
          - text: "Goodbye."
      training_info:
        text: "Rogues strike from the shadows — devastating burst damage, poisons, and mobility. Hit first and it's already over. Miss, and you'd better have tricks ready."
        choices:
          - text: "I'd like to see what you teach."
      skill_points:
        text: "Earn a skill point every two levels. Type 'train list' to see what I can offer at your level, then 'train learn <name>' to spend one."
        choices:
          - text: "Understood."

  banker:
    image: a27a9d8c0b5977b1fa0f7553b1b95400494a51662cb3a77c4e1079dd69c7c1fa.png
    name: "the Banker"
    room: vault_hall
    dialogue:
      root:
        text: "Welcome to the Ambon Vault. I can safeguard your gold and valuables. Use 'deposit' and 'withdraw' to manage your account, or 'balance' to check your holdings."
        choices:
          - text: "How does the bank work?"
            next: explain
          - text: "Just checking my balance."
            action: bank_balance
          - text: "Thanks, I'll manage from here."
      explain:
        text: "You may deposit gold with 'deposit <amount> gold' or store items with 'deposit <item>'. To retrieve them, use 'withdraw <amount> gold' or 'withdraw <item>'. Your vault holds up to 50 items. Gold has no limit."
        choices:
          - text: "Got it, thanks."

rooms:
  hall_of_portals:
    image: 4789f1a1e68c123f14630a57aafdb891172312e7a79df19d7a606c98c843dcd0.jpg
    title: "Hall of Portals"
    description: "A circular hall of pale stone and humming air. Archways ring the room like a compass rose, each inset with a different lintel carving. A placard reads: 'AMBONMUD DEMO HUB — Choose a doorway and step through.' Eastern light smells of old books. Western light spills warmly from the gallery beyond. A spiral staircase leads up to a crafting workshop. Stone steps descend into a dimly lit portal chamber below. A polished marble passage leads north."
    exits:
      n: vault_hall
      e: noecker_resume:lobby
      w: wayfinder_gallery
      u: crafting_workshop:entrance
      d: sunken_crypt:portal_chamber

  vault_hall:
    image: 4789f1a1e68c123f14630a57aafdb891172312e7a79df19d7a606c98c843dcd0.jpg
    title: "The Ambon Vault"
    description: "A hushed chamber of polished granite and brass fittings. Heavy iron deposit boxes line the walls behind a long marble counter. The Banker stands at attention, ledger in hand. A sign reads: 'DEPOSIT and WITHDRAW gold or items. Type BALANCE to check your account.' A broad archway to the north leads to the Trainers' Corridor."
    bank: true
    exits:
      s: hall_of_portals
      n: trainers_corridor

  blank_arches:
    image: c5c24327e550e1493fb096e726644a4b183ca640c02ad33f8dad294bfc7af44d.jpg
    title: "Blank Arches"
    description: "Unkeyed archways stand here like paused sentences. New chalkwork marks several passages for low-rank adventurers, each arch pulsing with a different color of mist."
    exits:
      e: wayfinder_gallery
      n: low_training_marsh:reedwalk_landing
      s: low_training_highlands:switchback_foot
      u: low_training_mines:orelift_station
      d: low_training_barrens:windcut_gate

  wayfinder_gallery:
    image: 8b602d97e2dee51662c87ff1a2eded40006aafa6ea8706e47905d8e7ff9861ea.jpg
    title: "Wayfinder Gallery"
    description: "A narrow gallery lined with relief maps of places that don't exist yet. A brass needle floats over each plaque, twitching toward the hall as if eager to be used. A warm glow spills from a doorway to the north. To the south, a vine-wrapped archway opens onto dappled green light and the scent of wild grass."
    exits:
      e: hall_of_portals
      w: blank_arches
      n: wanderers_inn
      s: tutorial_glade:awakening_clearing

  wanderers_inn:
    image: 5156f9c562d3f399ecc64ef196fa7787a5c449f9737f52e1bcd28675cba00b78.jpg
    title: "The Wanderer's Inn"
    description: "A cozy common room filled with the scent of woodsmoke and fresh bread. Low beams cross the ceiling, hung with dried herbs. A fire crackles in a broad hearth and mismatched chairs cluster around worn tables. The innkeeper stands behind a short counter, ready to help. A sign on the wall reads: 'RENT A ROOM — type recall anytime to return here.' A heavy door to the east is propped open, revealing a rutted track and the smell of campfire smoke. A bolted iron trapdoor in the corner is etched with the words: 'THE LABYRINTH — ENTER AT OWN RISK.'"
    exits:
      s: wayfinder_gallery
      e: demo_ruins:caravan_gate
      d: labyrinth:cell_00_00
  trainers_corridor:
    title: "Trainers' Corridor"
    description: "A broad corridor of clean stone, lit by evenly-spaced torch sconces. Four arched doorways branch off in the cardinal directions, each bearing a carved sigil for one of the four great classes. A plaque reads: 'Visit any trainer to spend skill points. Unlock new classes with gold at level 10 or above.'"
    exits:
      s: vault_hall
      n: warrior_training_hall
      e: mage_library
      w: cleric_sanctuary
      d: rogue_den

  warrior_training_hall:
    title: "Warrior Training Hall"
    description: "A vaulted hall of worn flagstones, hung with trophy weapons and scratched training dummies. The crash of steel and shouts of instruction echo off the high walls. Captain Varek stands at the center, eyeing you with professional appraisal."
    exits:
      s: trainers_corridor

  mage_library:
    title: "Mage Library"
    description: "Shelves of spell tomes line the walls from floor to ceiling. A hovering crystal orb casts pale blue light across several reading lecterns. Archmage Solvara looks up from an open tome, adjusting her spectacles with an arcane flourish."
    exits:
      w: trainers_corridor

  cleric_sanctuary:
    title: "Cleric Sanctuary"
    description: "A calm, candle-lit chamber with a carved altar at the far wall. Soft incense drifts through the air and the faint sound of distant bells fills the space with sacred peace. High Priestess Ilara kneels before the altar, rising as you enter."
    exits:
      e: trainers_corridor

  rogue_den:
    title: "The Rogue Den"
    description: "A low-ceilinged room draped in dark cloth. Hooks along the walls hold lockpicks, throwing knives, and other tools of the trade. Shadowmaster Krix emerges from the shadows — barely visible until he wants to be."
    exits:
      u: trainers_corridor

trainers:
  warrior_trainer:
