achievements:
  king_ambon:
    displayName: King of Ambon
    description: Whoever slays the fallen Kirot Aethiryn will become the King of Ambon.
    category: combat
    hidden: true
    criteria:
      - type: kill
        targetId: playtesting:void_seraph
        count: 1
        description: ""
    rewards:
      title: Ambonien, King of Ambon
  first_lesson:
    displayName: First Lesson
    description: Complete Orientation Day and let Pip log your enrollment at the Auringold Academy.
    category: exploration
    criteria:
      - type: quest_complete
        targetId: auringold_academy:school_orientation
        count: 1
        description: Complete Orientation Day
    rewards:
      xp: 50
  first_steps:
    displayName: First Steps
    description: Reach the second year of your power.
    category: class
    criteria:
      - type: reach_level
        targetId: ""
        count: 2
        description: Reach level 2
    rewards:
      xp: 50
  scarecrows_bane:
    displayName: Scarecrow's Bane
    description: Burst three practice dummies on the proving yard. They signed waivers.
    category: combat
    criteria:
      - type: kill
        targetId: auringold_academy:practice_dummy
        count: 3
        description: Burst practice dummies
    rewards:
      gold: 10
  proven_in_the_yard:
    displayName: Proven in the Yard
    description: Complete the Drillmaster's menagerie lesson — chase a coward, survive an ambush, and learn the better part
      of valor.
    category: combat
    criteria:
      - type: quest_complete
        targetId: auringold_academy:the_better_part_of_valor
        count: 1
        description: Complete The Better Part of Valor
    rewards:
      xp: 100
  honest_work:
    displayName: Honest Work
    description: Log your fieldwork with Gardener Fernwhistle — garden and mine both.
    category: crafting
    criteria:
      - type: quest_complete
        targetId: auringold_academy:green_thumbs
        count: 1
        description: Complete Green Thumbs, Steady Hands
    rewards:
      xp: 100
  the_makers_mark:
    displayName: The Maker's Mark
    description: Have your first enchanting work witnessed in the sanctum, charm and stardust in hand.
    category: crafting
    criteria:
      - type: quest_complete
        targetId: auringold_academy:a_finer_polish
        count: 1
        description: Complete A Finer Polish
    rewards:
      xp: 150
  out_riddled:
    displayName: Out-Riddled
    description: Answer the sphinx, walk the levers' verse, and carry the Grimoire of Beginnings back to the Hall of Records.
    category: exploration
    criteria:
      - type: quest_complete
        targetId: auringold_academy:echoes_in_the_stacks
        count: 1
        description: Complete Echoes in the Stacks
    rewards:
      xp: 150
  a_friendly_face:
    displayName: A Friendly Face
    description: Carry the Registrar's regards across campus and collect Fortuna's signature.
    category: social
    criteria:
      - type: quest_complete
        targetId: auringold_academy:a_friendly_word
        count: 1
        description: Complete A Friendly Word
    rewards:
      xp: 100
  laid_to_rest:
    displayName: Laid to Rest
    description: Soothe ten of the Academy's running-late nightmares back to the sleep they never quite reached.
    category: combat
    criteria:
      - type: kill
        targetId: auringold_academy:restless_pupil
        count: 10
        description: Soothe running-late nightmares
    rewards:
      gold: 50
  the_deans_red_quill:
    displayName: The Dean's Red Quill
    description: Put the Dean of Bad Dreams to rest at the bottom of the catacombs delve — the worst of Effiənoae's
      leavings, finally tucked in.
    category: combat
    criteria:
      - type: kill
        targetId: auringold_academy:dean_of_the_dead
        count: 1
        description: Defeat the Dean of Bad Dreams
    rewards:
      gold: 100
      title: Bane of the Dean
  head_of_the_class:
    displayName: Head of the Class
    description: Reach the fifth year of your power — the Gates take notice.
    category: class
    criteria:
      - type: reach_level
        targetId: ""
        count: 5
        description: Reach level 5
    rewards:
      gold: 100
  schools_out:
    displayName: School's Out
    description: Complete the rite of Commencement with all eight wing badges and present your credentials at the Gates of Ambon.
    category: class
    criteria:
      - type: quest_complete
        targetId: auringold_academy:commencement
        count: 1
        description: Complete Commencement
    rewards:
      xp: 500
      gold: 250
      title: Graduate of Auringold
  the_hard_way:
    displayName: The Hard Way
    description: Survive the Final Lesson's entire demonstration — and end it.
    category: combat
    hidden: true
    criteria:
      - type: kill
        targetId: auringold_academy:the_final_lesson
        count: 1
        description: Defeat the Final Lesson
    rewards:
      gold: 150
      title: Death's Pupil
