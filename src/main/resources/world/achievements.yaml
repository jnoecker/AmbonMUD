achievements:
  # ── Combat ────────────────────────────────────────────────────────
  first_blood:
    displayName: First Blood
    description: Defeat your first creature at the Academy.
    category: combat
    hidden: false
    criteria:
      - type: kill
        targetId: ""
        count: 1
        description: Kill any mob
    rewards:
      xp: 50
  proving_yourself:
    displayName: Proving Yourself
    description: Defeat five creatures in the Academy Proving Grounds.
    category: combat
    hidden: false
    criteria:
      - type: kill
        targetId: ""
        count: 5
        description: Kill 5 creatures
    rewards:
      xp: 150
      gold: 25
  warden_slayer:
    displayName: Warden Slayer
    description: Defeat the Dread Warden lurking in the Academy Throne Room.
    category: combat
    hidden: false
    criteria:
      - type: kill
        targetId: academy:dread_warden
        count: 1
        description: Kill the Dread Warden
    rewards:
      xp: 500
      gold: 100
      title: Warden Slayer
  catacomb_delver:
    displayName: Catacomb Delver
    description: Complete a run through the Academy catacombs dungeon.
