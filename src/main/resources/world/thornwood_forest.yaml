    dialogue:
      root:
        text: You found my outpost — good eyes. I'm Lenna. The Thornwood has a bandit problem that needs solving, and I have a
          quest to match. Interested?
        choices:
          - text: Tell me about the bandits.
            next: bandit_info
          - text: Goodbye.
            next: farewell
      bandit_info:
        text: A camp of brigands has moved into the deep woods south of here. They prey on travelers on the road. Take out three
          of them and the others may think twice. The camp is south through the berry thicket and deeper forest.
        choices:
          - text: I'll deal with them.
            next: farewell
          - text: Goodbye.
            next: farewell
