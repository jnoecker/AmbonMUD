zone: thornwood_forest
startRoom: forest_road
lifespan: 0

image:
  room: demo/DefaultRoom.png
  mob: demo/DefaultMob.png
  item: demo/DefaultObject.png

# ─── Items ────────────────────────────────────────────────────────────────────

items:
  wildflower:
    displayName: "a wildflower"
    keyword: flower
    description: "A small bloom with bright petals, still fresh from the meadow. Herbalists prize these."
    basePrice: 5

  forest_mushroom:
    displayName: "a forest mushroom"
    keyword: mushroom
    description: "A thick-capped mushroom found in the shaded dell. Useful in potions and cooking."
    basePrice: 8

  birch_bark:
    displayName: "a strip of birch bark"
    keyword: bark
    description: "Peeled from a riverside birch. Surprisingly useful in alchemical preparations."
    basePrice: 6

  wolf_pelt:
    displayName: "a wolf pelt"
    keyword: pelt
    description: "A thick grey-brown pelt stripped from a Thornwood wolf. Fetches a fair price at market."
    basePrice: 8

  spider_silk:
    displayName: "a strand of spider silk"
    keyword: silk
    description: "Thick, unusually strong silk from a cave spider. Weavers and alchemists both want it."
    basePrice: 10

  bear_hide:
    displayName: "a bear hide"
    keyword: hide
    description: "A heavy hide from a Thornwood bear. Good leather stock if properly cured."
    basePrice: 20

# ─── Gathering Nodes ──────────────────────────────────────────────────────────

gatheringNodes:
  wildflower_patch:
    displayName: "a wildflower patch"
    keyword: flowers
    skill: herbalism
    skillRequired: 1
    room: berry_thicket
    respawnSeconds: 120
    xpReward: 10
    yields:
      - itemId: wildflower
        minQuantity: 1
        maxQuantity: 2

  mushroom_cluster:
    displayName: "a mushroom cluster"
    keyword: mushrooms
    skill: herbalism
    skillRequired: 1
    room: mushroom_dell
    respawnSeconds: 180
    xpReward: 12
    yields:
      - itemId: forest_mushroom
        minQuantity: 1
        maxQuantity: 2

  birch_stand:
    displayName: "a stand of birch trees"
    keyword: birch
    skill: herbalism
    skillRequired: 2
    room: forest_stream
    respawnSeconds: 240
    xpReward: 15
    yields:
      - itemId: birch_bark
        minQuantity: 1
        maxQuantity: 1

# ─── Mobs ─────────────────────────────────────────────────────────────────────

mobs:
  stray_wolf:
    name: "a stray wolf"
    room: wolf_den
    tier: standard
    level: 2
    respawnSeconds: 90
    xpReward: 15
    behavior:
      template: wander_aggro
    drops:
      - itemId: wolf_pelt
        chance: 0.5

  territorial_hare:
    name: "a territorial hare"
    room: berry_thicket
    tier: weak
    level: 1
    respawnSeconds: 60
    xpReward: 5

  scrappy_fox:
    name: "a scrappy fox"
    room: forest_clearing
    tier: weak
    level: 2
    respawnSeconds: 120
    xpReward: 8

  forest_bandit:
    name: "a forest bandit"
    room: bandit_camp
    tier: standard
    level: 3
    respawnSeconds: 120
    xpReward: 25
    goldMin: 5
    goldMax: 15
    behavior:
      template: wander_aggro

  cave_spider:
    name: "a cave spider"
    room: spider_cavern
    tier: standard
    level: 3
    respawnSeconds: 90
    xpReward: 20
    drops:
      - itemId: spider_silk
        chance: 0.5

  mother_bear:
    name: "a mother bear"
    room: mothers_hollow
    tier: elite
    level: 4
    respawnSeconds: 300
    xpReward: 50
    behavior:
      template: wander_aggro
    drops:
      - itemId: bear_hide
        chance: 0.8

  forester_lenna_forest:
    name: "Forester Lenna"
    room: forest_outpost
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - bandit_problem
    dialogue:
      root:
        text: "You found my outpost — good eyes. I'm Lenna. The Thornwood has a bandit problem that needs solving, and I have a quest to match. Interested?"
        choices:
          - text: "Tell me about the bandits."
            next: bandit_info
          - text: "Goodbye."
            next: farewell
      bandit_info:
        text: "A camp of brigands has moved into the deep woods south of here. They prey on travelers on the road. Take out three of them and the others may think twice. The camp is south through the berry thicket and deeper forest."
        choices:
          - text: "I'll deal with them."
            next: farewell
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Track true. I'll be here when you return."

# ─── Quests ───────────────────────────────────────────────────────────────────

quests:
  bandit_problem:
    name: "The Bandit Problem"
    description: "Forester Lenna has asked you to deal with the bandits camped deep in Thornwood Forest. Kill three forest bandits to discourage further encroachment."
    giver: forester_lenna_forest
    objectives:
      - type: kill
        targetKey: forest_bandit
        count: 3
        description: "Kill 3 forest bandits in Thornwood Forest"
    rewards:
      xp: 500
      gold: 30

# ─── Rooms ────────────────────────────────────────────────────────────────────

rooms:
  forest_road:
    title: "Thornwood Forest — Forest Road"
    description: "A hard-packed dirt track that branches east from Thornhaven's north gate, curving between old oaks. The city is visible through the tree trunks behind you to the west. The road ahead widens slightly as it enters the forest proper. An outpost lean-to stands a short walk to the north."
    exits:
      w: thornhaven_city:north_gate
      e: forest_clearing
      n: forest_outpost

  forest_outpost:
    title: "Lenna's Outpost"
    description: "A compact camp sheltered by a leaning birch: a bedroll, a fire ring, and a rack of tools. A hand-drawn map of the Thornwood is pinned to the tree. Forester Lenna uses this as a base when ranging near the city. The forest road lies to the south."
    exits:
      s: forest_road

  forest_clearing:
    title: "Thornwood Clearing"
    description: "A broad clearing where the canopy opens to the sky. Tall grass and wildflowers ring the open ground. Foxes den in the thicket roots here and dart away at the sound of footsteps. The forest road is back to the west; the ancient oak grove is to the east; the wolf territory begins north; and berry thickets stretch south."
    exits:
      w: forest_road
      n: wolf_trail
      s: berry_thicket
      e: ancient_oak

  wolf_trail:
    title: "Wolf Trail"
    description: "A narrow path worn into the earth by paws rather than boots. Tufts of grey fur cling to low branches on either side. The smell of animal is strong here. The clearing is back to the south and the wolf den lies ahead to the north."
    exits:
      s: forest_clearing
      n: wolf_den

  wolf_den:
    title: "Wolf Den"
    description: "A hollow of twisted roots at the base of a great elm, matted with fur and old bones. Stray wolves circle the perimeter with low growls, eyes catching the light. This is the heart of their range. The trail leads back south."
    exits:
      s: wolf_trail
      w: mothers_hollow

  mothers_hollow:
    title: "Mother's Hollow"
    description: "A shallow depression ringed by roots and fallen logs. The air smells of wet earth and danger. A mother bear has claimed this hollow as her own and does not welcome visitors — she is fast, powerful, and protecting something. The wolf den is to the east."
    exits:
      e: wolf_den

  ancient_oak:
    title: "The Ancient Oak"
    description: "A single enormous oak, wider than three men, stands at the heart of an old grove. Carvings cover its bark — names, dates, and one worn symbol no one seems to recognize. The mood is peaceful but watchful. A hidden glade lies to the north, and the forest's eastern edge is beyond to the east."
    exits:
      w: forest_clearing
      n: hidden_grove
      e: thornwood_eastern_edge

  hidden_grove:
    title: "Hidden Grove"
    description: "A small sunlit clearing entirely enclosed by old-growth trees. The grass is impossibly green, wildflowers bloom in patches, and a bee or two drifts past. It feels like a place that doesn't know there's a world outside it. The ancient oak is back to the south."
    exits:
      s: ancient_oak

  thornwood_eastern_edge:
    title: "Thornwood Eastern Edge"
    description: "The trees thin here, and through the gaps you can see open farmland rolling away to the east and south — the Farmer Fields. The ancient oak stands at your back to the west. A wooden boundary post driven into the soil marks the edge of the forest."
    exits:
      w: ancient_oak

  berry_thicket:
    title: "Berry Thicket"
    description: "Dense bramble bushes heavy with berries line both sides of the path. Wild hares live in the thicket roots and watch you pass with defiant curiosity. Wildflowers grow wherever there is a gap in the brambles. The clearing is back north; mushroom dell lies to the east; the deep woods are south."
    exits:
      n: forest_clearing
      e: mushroom_dell
      s: deep_woods

  mushroom_dell:
    title: "Mushroom Dell"
    description: "A mossy hollow where the trees press close and the light is green-tinged and diffuse. Mushrooms of every size grow in clusters across the floor and up the sides of fallen logs. It is remarkably quiet here. The thicket is back to the west."
    exits:
      w: berry_thicket

  deep_woods:
    title: "Deep Woods"
    description: "The forest grows old and dark here. The undergrowth is thick, the canopy heavy, and the sounds of the road are long gone. A forest stream trickles somewhere to the west. A moonlit glade lies to the east. The bandit trail continues south, and the berry thicket is back north."
    exits:
      n: berry_thicket
      e: moonlit_glade
      s: bandit_trail
      w: forest_stream

  forest_stream:
    title: "Forest Stream"
    description: "A clear, cold stream tumbles over smooth stones between rows of silver birch. The sound of the water masks everything else and the air smells of clean earth and bark. The deep woods are back to the east."
    exits:
      e: deep_woods

  moonlit_glade:
    title: "Moonlit Glade"
    description: "A perfect circular clearing that the locals say glows faintly on full-moon nights. The grass here is shorter and finer than elsewhere in the forest, and deer tracks cross it in every direction. At night the air is exceptionally still. The deep woods are back to the west."
    exits:
      w: deep_woods

  bandit_trail:
    title: "Bandit Trail"
    description: "A path that wasn't here last season. Boot prints and horse dung tell you a group has been using this regularly. The deep woods are back to the north; the bandit camp is ahead to the south."
    exits:
      n: deep_woods
      s: bandit_camp

  bandit_camp:
    title: "Bandit Camp"
    description: "A ragged camp of makeshift shelters, cold fire pits, and stolen goods dumped in piles. Forest bandits patrol the perimeter with a bluster that suggests they know this ground. A cave entrance gapes in the rock face to the east — home to something worse than bandits. The trail leads back north."
    exits:
      n: bandit_trail
      e: cave_entrance

  cave_entrance:
    title: "Cave Entrance"
    description: "A low natural arch in a limestone outcropping. Something has been in and out of it regularly — a heavy smell of musk and old web lingers around the opening. The bandit camp is back to the west. The cave descends steeply below."
    exits:
      w: bandit_camp
      d: spider_cavern

  spider_cavern:
    title: "Spider Cavern"
    description: "A damp, web-choked cave lit only by the faint phosphorescence of the silk itself. Cave spiders move through the darkness with fluid, unhurried confidence. The walls are entirely covered in intricate web structures. The cave entrance is back up above."
    exits:
      u: cave_entrance
