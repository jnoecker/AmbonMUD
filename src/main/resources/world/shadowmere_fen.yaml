items:
  shadow_dust:
    displayName: a pinch of shadow dust
    keyword: dust
    description: Fine black powder that seems to drink in the light around it. Left behind by shadow creatures. Useful in
      dark alchemy.
    basePrice: 18
    image: 80bfbedecf7ae24fee0b7a4185b7013f58fc38bf9f665637b2ee2157631f0ffb.png
  fen_essence:
    displayName: a vial of fen essence
    keyword: essence
    description: A thick, luminous liquid distilled from the corrupted fen. Alchemists value its unusual properties.
    basePrice: 22
    image: 680f5b98670a5917aa9cada86340a5b14e0a9e88bd2927ad6d3c4e75f0676e86.png
  cursed_idol:
    displayName: a cursed idol
    keyword: idol
    description: A small stone figure carved in the likeness of something not quite human. The surface is warm despite the
      cold fen air, and it seems to pulse faintly when held. Scholar Vex will want to see this.
    basePrice: 0
    image: 363b27d880f05c466bbe53ad7fa66a4579c02da7300be97795ef33edb84cff81.png
  shadow_thistle:
    displayName: a shadow thistle
    keyword: thistle
    description: A thorny plant that grows only in shadow-corrupted ground. Its deep purple flowers are prized by alchemists
      for warding draughts.
    basePrice: 20
    image: b50cf32a7c24f0ebe5325e4091556e2ac2536a7427aa3470f0194a1e07a8278c.png
  heralds_blade:
    displayName: the Shadow Herald's blade
    keyword: blade
    slot: weapon
    damage: 12
    basePrice: 420
    description: A long, curved sword of blackened iron that trails wisps of shadow when swung. The Shadow Herald wielded
      this for centuries.
    image: f2a2c13d2ce28526dc6824dfdd1ec8da99b75241816e459fd36f290c842cf2cb.png
  fen_shroud:
    displayName: a fen shroud
    keyword: shroud
    slot: body
    armor: 7
    basePrice: 400
    description: A cloak woven from fen-mist and shadow, unnervingly light. It shifts and flows as though alive, offering
      protection that defies its apparent fragility.
    image: 0b83e238f70480eac0e3657ddb8d7ed33c4cdbe7d43b62eb30fd5b603b37d032.png
