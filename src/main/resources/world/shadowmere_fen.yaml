      template: aggro_guard
    image: b103ca0d8e1506b8d740da4f81bc68d78f17555d5154c0b22e16e40a2295e967.png
  twisted_shambler:
    name: a twisted shambler
    room: corrupted_grove
    tier: elite
    level: 7
    respawnSeconds: 300
    xpReward: 85
    behavior:
      template: wander_aggro
    drops:
      - itemId: fen_essence
        chance: 0.6
    image: a2df1dc99ef32f0411e4ee9cda8cfc1d1413ccda33bac3b848474a14841392cb.png
  shadow_herald:
    name: the Shadow Herald
    room: shadow_heralds_sanctum
    tier: boss
    level: 8
    respawnSeconds: 900
    xpReward: 250
    goldMin: 90
    goldMax: 170
    behavior:
      template: aggro_guard
    drops:
      - itemId: heralds_blade
        chance: 0.45
      - itemId: fen_shroud
        chance: 0.35
    dialogue:
      root:
        text: You have followed the corruption this far. Impressive. Foolish, but impressive. I am what remains when the shadow
          takes root — the herald of what is coming. The seal, the medallion, the wards — all of it crumbles. The
          Celestial Peak will fall.
        choices:
          - text: What do you know about the Celestial Peak?
            next: peak_info
          - text: We're ending this.
            next: defiance
          - text: We'll leave.
            next: farewell
      peak_info:
        text: The wards placed by the old order are failing. The seals they scattered across this land were meant to hold
          something at bay. Your scholars collect trinkets. The Iron Order hoards relics. None of them understand what
          is waking. I am merely... the announcement.
        choices:
          - text: Then we stop you first.
            next: defiance
          - text: We'll go.
            next: farewell
      defiance:
        text: Stopping me changes nothing. But come. Let us see what the living are worth.
        choices:
          - text: Now.
            next: farewell
      farewell:
        text: ...
    image: d83b6dd654decdfa5ca4438b6d0f924018e0cf769108269ebf5ee8ed9021420e.png
  scholar_vex:
    name: Scholar Vex
    room: scholars_camp
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - shadow_corruption
    dialogue:
      root:
        text: Stay close — this fen is not what it was. I'm Vex, Scholars' Guild, following up on Timon's work at the Sunken
          Temple. The corruption here traces back to Vaelthos and something older. There's a cursed idol on a twisted
          altar deeper in. I need it for analysis. Can you retrieve it?
        choices:
          - text: I'll find the idol.
            next: quest_accept
          - text: What's causing the corruption?
            next: corruption_info
          - text: Goodbye.
            next: farewell
      corruption_info:
        text: Vaelthos was experimenting with shadow magic drawn from something beneath the Celestial Peak. When he was
          destroyed, his work didn't stop — it spread. This fen is saturated with it. The idol on the altar is a focal
          point. Removing it might slow the spread.
        choices:
          - text: I'll get the idol.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Thank you. The twisted altar is south and east of here — through the corrupted grove. Be careful. The things in
          this fen are drawn to the idol's power.
        choices:
          - text: I'll return with it.
            next: farewell
      farewell:
        text: Watch your step. The ground shifts in places.
    image: 1b8c84a56f9eefd943407fa7954a974b50375e84efa922e6b018bc584b72dbe5.png
