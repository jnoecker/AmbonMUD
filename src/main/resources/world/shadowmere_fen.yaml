        minQuantity: 1
        maxQuantity: 2
quests:
  shadow_corruption:
    name: The Shadow Corruption
    description: Scholar Vex needs the cursed idol from the twisted altar deep in the Shadowmere Fen. Removing it may slow
      the shadow corruption spreading from Vaelthos's experiments.
    giver: scholar_vex
    objectives:
      - type: collect
        targetKey: cursed_idol
        count: 1
        description: Recover the cursed idol from the twisted altar
    rewards:
      xp: 1000
      gold: 45
rooms:
  barrow_passage:
    title: Shadowmere Fen — Barrow Passage
    description: The passage from the Dark Barrows opens onto sodden ground and a sky choked with grey-green haze. The air
      tastes of rot and something metallic. The fen stretches ahead to the east — a flat expanse of dark water, twisted
      trees, and ground that moves underfoot. The barrows are behind you to the west.
    exits:
      w: dark_barrows:vaelthos_chamber
      e: shadow_fen_edge
    image: 645c9ae57291f994257aa81ba0301c2d119fa5fde97720a366379446121a27fc.jpg
  shadow_fen_edge:
    title: Shadow Fen — Western Edge
    description: "The fen proper begins here: ankle-deep black water, tussocks of dead grass, and a pervasive sense of
      wrongness. Shadow creeps drift between the stunted trees, trailing dark mist. The ground is unreliable — test
      every step. Paths lead deeper into the fen in several directions."
    exits:
      w: barrow_passage
      n: haunted_willows
      e: fen_crossing
      s: murk_crossing
    image: a63b1c3eda5f49dca646c350e3cc5ab45a5e037447f6edc474412a635f62653c.jpg
  haunted_willows:
    title: Haunted Willows
    description: "A grove of ancient willows whose branches trail in the dark water like grasping fingers. The trees are
      leafless and grey, but they move — slowly, purposefully — in a wind you cannot feel. Faint sounds drift through
      the canopy: whispers, distant laughter, the creak of wood under strain. The fen edge is back to the south."
    exits:
      s: shadow_fen_edge
    image: 8a3e16b4638aadd63b528e2043074c307eb2ece6a2a85cfec4e200c1242bf935.jpg
  murk_crossing:
    title: Murk Crossing
    description: A stretch of fen where the water deepens to knee-height and the footing becomes treacherous. Submerged
      roots and hidden holes make every step a gamble. Something pale moves beneath the surface. A wailing pool lies to
      the east. The fen edge is back north.
    exits:
      n: shadow_fen_edge
      e: wailing_pool
    image: 06ada606107cff56348a89f2b5ca977b59201b9c6f7af7923087bc1b33891b26.jpg
  wailing_pool:
    title: Wailing Pool
    description: A broad pool of water so dark it looks like liquid shadow. Cursed wisps orbit the pool's surface in slow,
      mournful patterns, their light cold and blue-white. The sound that gives the pool its name rises and falls at
      irregular intervals — not wind, not animal, but something trapped beneath the water. The murk crossing is back to
      the west.
    exits:
      w: murk_crossing
    image: 89a636f94e672f44c1db2ff77fd80c36798e114906e8263811973b317946e7da.jpg
  fen_crossing:
    title: Fen Crossing
    description: "A relatively dry hummock of ground at the fen's center, offering a brief respite from the waterlogged
      terrain. Paths branch in several directions: north to a camp visible through the haze, south to a grove of twisted
      trees, and east deeper into the shadow-saturated depths."
    exits:
      w: shadow_fen_edge
      n: scholars_camp
      s: corrupted_grove
      e: shadow_fen_depths
    image: 4be5c763148e1cb140b225a14634a64c726e39c371339a207e43c87a813ff3bb.jpg
  scholars_camp:
    title: Scholar Vex's Camp
    description: "A small, carefully maintained camp on an elevated patch of dry ground. Scholar Vex has set up research
      materials under a waterproof tarp: specimen jars, notebooks, and what looks like containment wards scratched into
      flat stones. The camp is well-chosen — defensible and dry. The fen crossing is back to the south."
    exits:
      s: fen_crossing
    image: 1e172200b2bac50e4c45a0ec2dec816a2c8c6d3d72e4888d998357e0dbafbcdd.jpg
  corrupted_grove:
    title: Corrupted Grove
    description: A stand of trees so deeply shadow-corrupted that they've turned black from root to crown. The bark weeps
      dark sap and the ground beneath them is soft and warm. Shadow thistles grow in thick patches among the roots — the
      only thing that thrives here. A twisted shambler patrols the grove. A path leads east toward a stone structure
      visible through the trees.
    exits:
      n: fen_crossing
      e: twisted_altar_path
    image: 17e0baa8b9af37da00c406337e9da63151a83d83edbc42904e48abd5c0df007a.jpg
  twisted_altar_path:
    title: Twisted Altar Path
    description: A raised causeway of cracked flagstones leading through the worst of the corruption toward a stone
      structure ahead. The stones underfoot are carved with symbols that glow faintly — old wards, now failing. The air
      grows colder with every step east. The corrupted grove is back to the west.
    exits:
      w: corrupted_grove
      e: twisted_altar
    image: 34f3d671a19c10483071fe0626253ae88d42732f98a854f698ab46d48c8fef4a.jpg
  twisted_altar:
    title: Twisted Altar
    description: A stone platform in a clearing where the corruption is most intense. An altar of dark stone dominates the
      center, its surface carved with geometric patterns that hurt to look at. On the altar sits a small stone idol,
      pulsing with shadow energy. This is a focal point — the corruption in the fen radiates from this spot. The path
      leads back west.
    features:
      altar_surface:
        type: CONTAINER
        displayName: the twisted altar
        keyword: altar
        initialState: open
        resetWithZone: false
        items:
          - cursed_idol
    exits:
      w: twisted_altar_path
    image: fd91f6116cb1230087d7b7612cc10ff7a15bb40ab001e650bb5d2601fa05a93d.jpg
  shadow_fen_depths:
    title: Shadow Fen Depths
    description: The deepest part of the fen, where the shadow corruption is so thick it dims the sky to near-darkness even
      at midday. Fen specters drift through the murk, their forms barely distinguishable from the ambient shadow. The
      ground here is cold and hard — frozen by whatever force sustains this place. A passage south leads toward
      something luminous and wrong.
    exits:
      w: fen_crossing
      s: herald_approach
    image: 1cfdefd09a4a2dc752dffe9663742781e6f35950fb7044ddb756910aad711024.jpg
  herald_approach:
    title: Shadow Herald's Approach
    description: The fen gives way here to bare stone — a natural shelf of rock rising from the waterline, swept clean by
      forces that have nothing to do with weather. The air ahead pulses with cold light. Something ancient and powerful
      occupies the sanctum to the east. The fen depths are back to the north.
    exits:
      n: shadow_fen_depths
      e: shadow_heralds_sanctum
    image: 742f39c7049d3be8940bce0eca7971f011b19e2e3dc70e85de2039e335d00c84.jpg
  shadow_heralds_sanctum:
    title: Shadow Herald's Sanctum
    description: A natural cavern at the fen's eastern extremity, its walls coated in crystallised shadow that refracts cold
      light in all directions. The Shadow Herald drifts at the center — a towering figure of darkness given form, its
      eyes burning with pale fire. The cavern narrows to a sealed passage at its far end, the stone carved with
      star-patterns identical to those found on the ancient seals. Whatever lies beyond is not yet accessible.
    exits:
      w: herald_approach
    image: cfd2379b873baaa219f19f238036782326f3a43302ceb327bc635f48ad2cba50.jpg
graphical: true
