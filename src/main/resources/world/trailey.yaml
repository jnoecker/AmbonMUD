items:
  hoa_violation_notice:
    displayName: an HOA violation notice
    keyword: notice
    description: "A crisp official document noting violations including: improper mailbox angle (0.3 degrees off
      regulation), non-compliant lawn length (0.2mm above the approved maximum), unauthorized personality, and 'general
      atmospheric non-beige-ness.' It is terrifyingly thorough."
    room: cul_de_sac
    basePrice: 0
    image: 7b8ecb8f7f1ec96f7d328a04f1144d42b9de8c7fc765f0ec928e33ce9952a723.png
  spy_watch:
    displayName: a classified spy smartwatch
    keyword: watch
    description: A titanium-cased smartwatch with seventeen listed functions and fourteen unlisted ones, the latter labeled
      in a cipher. It tracks biometrics, decrypts nearby signals, and deploys a thumbnail-sized blast shield if you
      press the crown twice. Also tells the time.
    slot: hands
    armor: 4
    room: foyer
    basePrice: 85
    image: 4ce897f6aa4bf707d5a902a08802115d73f4d6264c6164cefb1ad04f865c21ef.png
  spy_gadget_pen:
    displayName: a spy gadget pen
    keyword: pen
    description: It looks like an ordinary pen. It is not. The cap fires a micro-grappling hook; the body contains a
      compressed-air sedative dart; the clip is a USB drive containing enough embarrassing information to neutralize a
      mid-sized international incident. Also it writes.
    consumable: true
    onUse:
      healHp: 25
    room: hall
    basePrice: 50
    image: 1b7a9fef795acf7cc5c8e5b3e95e657a441fafe7026620f79b2750354df00213.png
  makeup_compact:
    displayName: a professional makeup compact
    keyword: compact
    description: A heavy professional-grade compact from Hailey's collection. The mirror is perfect; the powder inside has a
      slight luminescent quality that is not standard in commercial cosmetics. Opening it and taking a moment with it
      is, for reasons you can't explain, actually quite restoring.
    consumable: true
    onUse:
      healHp: 15
    room: haileys_parlor
    basePrice: 35
    image: 908ea83f303a7bdd2b24e6ecafd69a51449efc2648e996c55488fd74f4b37a8e.png
  luxury_perfume:
    displayName: a bottle of Midnight Blossoms perfume
    keyword: perfume
    description: A heavy crystal bottle of Hailey's prize perfume — 'Midnight Blossoms,' according to the engraved stopper.
      One spritz and you are undeniably more capable. It is unclear whether this is psychological or chemical. The
      sentient cloud that guards it suggests the latter.
    consumable: true
    onUse:
      healHp: 30
    room: haileys_dressing
    basePrice: 60
    image: f97436b9f0853026238f387802ad5b9c12f60906df036a914240c1ff80030ba5.png
  competition_leotard:
    displayName: Hailey's competition leotard
    keyword: leotard
    description: A full-competition leotard in midnight blue and silver, decorated with precisely applied crystals along the
      neckline and sleeves. Designed for a Level 10 gymnast who expects to win. The stitching is structural enough to be
      classified as armor by people who know about these things.
    slot: body
    armor: 5
    room: haileys_gym
    basePrice: 90
    image: 2b8984df30863a2c20c569177921cda7bce33e772011d2f3da9d990c224aa63f.png
  paintball_marker:
    displayName: Trevor's tactical paintball marker
    keyword: marker
    description: "A heavily modified paintball marker with a custom grip, extended barrel, and a two-hundred-round hopper.
      The paint is Trevor's proprietary formula: glows in the dark, stains for six weeks, and leaves a satisfying impact
      sound on robot surfaces."
    slot: weapon
    damage: 11
    room: trevors_range
    basePrice: 75
    image: 3030d31a7fef0b7661f1cf418ebbf46686102375ec5634dacb9d3e065bd20206.png
  robot_spring_coil:
    displayName: a precision robot spring coil
    keyword: coil
    description: A tight helical spring machined to tolerances of one ten-thousandth of an inch, salvaged from one of
