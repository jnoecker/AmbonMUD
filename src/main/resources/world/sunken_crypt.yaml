zone: sunken_crypt
startRoom: portal_chamber
lifespan: 0

items:
  crypt_dust:
    displayName: "a handful of crypt dust"
    keyword: dust
    description: "Fine gray dust that shimmers faintly. Alchemists prize it for exotic reagents."
    basePrice: 20
  bone_fragment:
    displayName: "a bone fragment"
    keyword: bone
    description: "A jagged fragment of ancient bone, cold to the touch."
    basePrice: 15
  crypt_relic:
    displayName: "a crypt relic"
    keyword: relic
    description: "An ornate bronze trinket recovered from the crypt depths. It hums with faint magic."
    basePrice: 100
  crypt_explorer_title:
    displayName: "Title: Crypt Explorer"
    keyword: "crypt title"
    description: "A scroll that grants the title 'Crypt Explorer' — awarded to those who brave the Sunken Crypt in Lore mode."
    basePrice: 0

mobs:
  crypt_skeleton:
    name: "a skeletal warrior"
    description: "A rattling skeleton wielding a rusted sword. Its empty eye sockets glow with pale light."
    room: mob_templates
    tier: standard
    level: 5

    drops:
      - itemId: bone_fragment
        chance: 0.3
      - itemId: crypt_dust
        chance: 0.15
  crypt_spider:
    name: "a crypt spider"
    description: "A bloated spider the size of a dog, its legs clicking against the stone floor."
    room: mob_templates
    tier: weak
    level: 4

    drops:
      - itemId: crypt_dust
        chance: 0.2
  crypt_guardian:
    name: "a crypt guardian"
    description: "An armored undead sentinel, far more formidable than the common skeletons."
    room: mob_templates
    tier: elite
    level: 8

    drops:
      - itemId: bone_fragment
        chance: 0.5
      - itemId: crypt_relic
        chance: 0.2
  crypt_lord:
    name: "the Crypt Lord"
    description: "A towering undead lord wreathed in sickly green flames. Ancient armor hangs from its skeletal frame, and a massive greatsword trails ghostly fire."
    room: mob_templates
    tier: boss
    level: 10

    drops:
      - itemId: crypt_relic
        chance: 0.8
      - itemId: bone_fragment
        chance: 1.0

rooms:
  portal_chamber:
    title: "Dungeon Portal Chamber"
    description: "A circular stone chamber deep beneath the Hub. Ancient runes circle a shimmering portal that pulses with otherworldly light. A hooded figure stands beside it, ready to guide adventurers into the depths."
    exits:
      u: ambon_hub:hall_of_portals
  mob_templates:
    title: "Dungeon Mob Templates"
    description: "Internal room for dungeon mob template definitions."

dungeon:
  name: "The Sunken Crypt"
  description: "Ancient catacombs beneath the marshlands, haunted by restless undead. The deeper you go, the stronger they become — until you face the Crypt Lord himself."
  minLevel: 3
  roomCountMin: 20
  roomCountMax: 25
  portalRoom: portal_chamber
  roomTemplates:
    entrance:
      - title: "Crypt Entrance"
        description: "Crumbling steps descend into darkness. The air is thick with the smell of damp earth and ancient decay. Torches flicker in iron sconces, casting long shadows across moss-covered walls."
    corridor:
      - title: "Narrow Passage"
        description: "A cramped corridor winds through the bedrock. Water seeps through cracks in the ceiling, pooling in shallow puddles that reflect the feeble torchlight."
      - title: "Collapsed Hallway"
        description: "Half-buried pillars and scattered rubble line this once-grand corridor. Something skitters in the darkness ahead."
      - title: "Webbed Corridor"
        description: "Thick cobwebs hang from every surface, swaying gently in an unfelt breeze. The bones of small creatures dangle in the silk."
      - title: "Flooded Passage"
        description: "Ankle-deep water fills this low passage. The stone walls glisten with moisture, and the sound of dripping echoes from every direction."
    chamber:
      - title: "Burial Chamber"
        description: "Stone sarcophagi line the walls in recessed alcoves. Some have been pried open, their contents long since disturbed. Faded murals depict funeral rites of a forgotten civilization."
      - title: "Ossuary"
        description: "Walls of neatly stacked skulls and bones rise to the vaulted ceiling. A cold draft whispers through hollow eye sockets."
      - title: "Ritual Chamber"
        description: "Dark stains mark the floor around a central stone altar. Candles of black wax burn with sickly green flames that never seem to go out."
    treasure:
      - title: "Hidden Vault"
        description: "Behind a concealed door, a small chamber glitters with the forgotten wealth of the dead. Coins and trinkets spill from rotting chests."
      - title: "Reliquary"
        description: "Glass cases hold ancient artifacts preserved by magic. Most are cracked and empty, but a few treasures remain."
    boss:
      - title: "The Crypt Heart"
        description: "A vast domed chamber at the deepest point of the crypt. Ghostly green flames roar in braziers along the walls. At the far end, a massive throne of fused bone and iron dominates the space. Something ancient stirs."
  mobPools:
    common:
      - crypt_skeleton
      - crypt_spider
    elite:
      - crypt_guardian
    boss:
      - crypt_lord
  lootTables:
    lore:
      completionRewards:
        - crypt_explorer_title
    normal:
      mobDrops:
        - bone_fragment
        - crypt_dust
      completionRewards:
        - crypt_relic
    hard:
      mobDrops:
        - bone_fragment
        - crypt_dust
        - crypt_relic
      completionRewards:
        - crypt_relic
        - crypt_relic
    heroic:
      mobDrops:
        - crypt_relic
        - crypt_dust
      completionRewards:
        - crypt_relic
        - crypt_relic
        - crypt_relic
