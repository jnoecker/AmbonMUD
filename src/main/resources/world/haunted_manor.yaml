items:
  ectoplasm:
    displayName: a glob of ectoplasm
    keyword: ectoplasm
    description: A translucent, faintly glowing substance left behind when a restless spirit is dispersed. Cold to the touch
      and slightly sticky.
    basePrice: 15
    image: 7318c3303721a5a10d84b6ed49811fc5883819110926ec70355c0e2c58c740e7.png
  spectral_chain:
    displayName: a spectral chain link
    keyword: chain
    description: A single link of chain that flickers between solid and translucent. Taken from an animated suit of armour.
    basePrice: 18
    image: 95a263f4d449d9ea28ef2f8b79bde51d30ea335d5d8d2004749885c704182631.png
  lords_signet:
    displayName: Lord Ashworth's signet ring
    keyword: signet
    description: A heavy gold ring bearing the Ashworth family crest — a raven perched on a crescent moon. The ghost of Lady
      Elara will recognise this.
    basePrice: 0
    image: 3b3acee586e14a8dc22149f605b15018da7cfc958d9e84bc4daf78defe240024.png
  ghost_blade:
    displayName: the Phantom Blade
    keyword: blade
    slot: weapon
    damage: 11
    basePrice: 390
    description: A longsword that shimmers between solid steel and translucent mist. Strikes with the cold of the grave.
    image: b45a835a723743d7dea31d174fe0d973133d2acacc739fb25fd09914082c78e3.png
  phantom_mantle:
    displayName: a phantom mantle
    keyword: mantle
    slot: body
    armor: 6
    basePrice: 360
    description: A cloak of shimmering grey fabric that seems to drift independent of the wind. Wearing it makes you feel
      slightly less substantial.
    image: ca1573dc2eaf51871e7bc33066767b95158fcaac65834720fe201f226f3675dc.png
