zone: pixel_haven
startRoom: fat_cat_row
rooms:
  fat_cat_row:
    title: Fat Cat Row
    description: A wide cobblestone street curving past a row of cottages whose front porches are uniformly occupied by
      enormous, well-fed cats. They watch you with the slow approval of beings who have never wanted for tuna. The smell
      of warm bread drifts from somewhere — probably Grandma Sunshine's place over toward the rainbow mansion. The air
      shimmers slightly, the way it does when a place is held together by happy thinking.
    exits:
      n: k_nex_drawbridge
      e: the_porch_of_eternal_sighs
      s: a_road_filled_with_holiday_cheer
    image: 63e080f7f854947a78cac4114fd700ce3f7420432ea05f6e12a87a242cf19f7c.jpg
  the_dump:
    title: The Dump
    description: A surprisingly tidy heap of broken toys, loose springs, and the kind of forgotten oddments that every child
      eventually outgrows. A homemade scrap forge bellows in one corner, manned by no one in particular, its anvil
      hammered flat by years of optimistic crafting. Things you could swear you lost as a kid keep poking out of the
      heap if you look long enough.
    station: FORGE
    exits:
      w: pixel_haven_mall_parking
      e: ambon_hub:wanderers_inn
    image: 08e45041fbad027f5b549a97c659624e017e27b85e4d562bbf22e67feef3a6bb.jpg
  pixel_haven_lottery_office:
    title: Pixel Haven Lottery Office
    description: A small store-front made entirely of poster board and gold paint, festooned with pennants and dotted with
      flashing fairy lights. A glass tumbler the size of a beer keg rotates ping-pong balls behind the counter, and the
      back wall is a glittering mosaic of past winners' grinning photographs.
    exits:
      s: the_only_road_2
    image: dac3b08e11d2d12e5d545376ef8ba85aa4b4f8fdc414fcd2d5701b76763b4002.jpg
    tavern: true
  the_only_road:
    title: The Only Road
    description: A wide, sun-dappled main road paved in cobblestones the colors of a child's crayon set — uneven, a little
      wonky, and somehow exactly right. Signs at the corners proudly announce that this is THE ONLY ROAD, even though
      there are clearly several more like it. Pixel Haven City Hall stands to the south, an imposing little building
      beneath an oversized weathercock.
    exits:
      s: pixel_haven_city_hall
      e: the_only_road_3
      w: the_only_road_2
    image: 301776586c4f2b0e1f10dc1ab6cb56e5b1a446f9b83ba28afbbd68a778b1976e.jpg
  the_only_road_2:
    title: The Only Road
    description: A continuation of the Only Road that is, confusingly, also called the Only Road. The lottery office stands
      proudly to the north, its lights winking. The road continues west toward Crayonsville and east toward the city's
      heart.
    exits:
      e: the_only_road
      n: pixel_haven_lottery_office
      w: the_only_road_4
    image: b1633c93b8e143100ffe0c46b5dea31fb400e338d5a575429c2b93b5a71fd700.jpg
  the_only_road_3:
    title: The Only Road
    description: An eastward stretch of the Only Road where the cobblestones are pocked with shallow potholes that seem to
      wink at you. Each one is suspiciously imp-shaped. The road slopes toward the south toward the Treacherous Hill,
      and east it leads on toward Stuffiesburg.
    exits:
      s: the_treacherous_hill
      w: the_only_road
      e: the_only_road_5
      n: auringold_academy:great_hall
    image: b3ef489ae582799db33e7fe0a59a9196665e4d1f1cb72eda8620c3e23028aacf.jpg
  pixel_haven_city_hall:
    title: Pixel Haven City Hall
    description: A polished marble lobby that is far grander on the inside than the building looks from outside. A towering
      brass weathercock-shaped chandelier hangs from the high ceiling, and the floor is inlaid with the civic motto in
      mosaic tile - HONEST, EARNEST, AND OPEN UNTIL FIVE. Mayor Buttercup keeps her desk against the back wall, and the
      bank tellers occupy a row of pigeonholes along the side. This is the place to deposit gold with 'bank' commands.
    bank: true
    exits:
      n: the_only_road
    image: 321d09867496e857a91fe0489ca345a9dcc3dad789129989f8634b57641615ce.jpg
  the_treacherous_hill:
    title: The Treacherous Hill
    description: A modest grassy hill made deeply, philosophically treacherous by the Tumble Goblins who roll down it on
      purpose, all day, every day. The grass has been worn into long bowling-pin grooves. A path runs north to the Only
      Road and south toward the Crossroads.
    exits:
      n: the_only_road_3
      s: crossroads
    image: 5cfe7a81d2c34720ec43cb9851da629dc7f3a067602af4a312e520455580bf97.jpg
  burnt_pixel_bar:
    title: The Burnt Pixel Bar
    description: A low-ceilinged tavern with one wall blackened from a long-ago kitchen fire that everyone refuses to
      explain. The booths are mismatched, the lighting is mostly candles in jars, and someone has set up a felt-topped
      table in the corner where bored adventurers gamble away their daily allowance. A long bar of polished pine runs
      along one wall.
    tavern: true
    exits:
      e: crossroads
    image: c73fd9b1b7eb0f7e637bd979175e75f2ea38a2300620a7b57565d32cf185e6d0.jpg
  crossroads:
    title: Crossroads
    description: A junction where four wagon-tracks of differing widths meet at unfortunate angles, surrounded by low
      signposts that have been turned by mischievous hands until none of them point anywhere reliable. The Burnt Pixel
      Bar squats to the west, the Treacherous Hill rises to the north, the K'nex Drawbridge spans the river to the
      south, and the Hospital for the Aging and Infirmed (Teenagers) crouches uneasily to the east.
    exits:
      w: burnt_pixel_bar
      n: the_treacherous_hill
      e: hospital_for_the_aging_and_infirmed_teenagers
      s: k_nex_drawbridge
    image: 1fc74a8a157cdd18376da24c600bc275c85050bcad4f06d7839ffb3fbb724780.jpg
  hospital_for_the_aging_and_infirmed_teenagers:
    title: Hospital for the Aging and Infirmed (Teenagers)
    description: A bright, clean clinic with construction-paper hearts taped to the walls and a row of beanbag chairs where
      weary teenagers rest with mock-serious expressions. Doctor Ouchless presides from behind a desk piled with juice
      boxes, friendship bracelets, and a stethoscope shaped like a smiling cat. Healers come here to learn the gentlest
      of arts.
    exits:
      w: crossroads
    image: cd8e5c5e226bb811f8597eea37bd02a3252b6fc96f146b8ef19e98c3c71547fc.jpg
  a_hidden_railroad_bridge:
    title: A Hidden Railroad Bridge
    description: A wooden trestle bridge tucked between the river bend and the cliffs, almost invisible from anywhere else
      in town. The planks are mossy, the rails rust-gold, and the only sounds are river water flowing nearby and wind in
      the cliff grasses. A treacherous footbridge to the west crosses into the Underbed Hollow.
    exits:
      e: pixel_river_2
      s: the_sports_metroplex
      w: road_underbed_hollow
    image: a339b4637c73004169d71e9b907d07bcbaef057f50079c6f1b306fce946e1527.jpg
  pixel_river:
    title: Pixel River
    description: A wide, slow-flowing river whose surface ripples in clean perfect squares — the water itself is pixelated,
      glittering in tidy rows. Bath-toy slimes bob in the shallows like enormous misshapen rubber duckies. The
      drawbridge is to the east, and the river continues south.
    exits:
      e: k_nex_drawbridge
      s: pixel_river_2
    image: a236a2a4245078d1dcb4424e654df4dee27059a067a8a583421973c48788d53f.jpg
  k_nex_drawbridge:
    title: The K'nex Drawbridge
    description: A drawbridge built entirely from snap-together plastic struts and connectors, somehow strong enough to bear
      weight. Its mechanism is hand-cranked from a tiny gatehouse on the south side, and the gear that lifts it has a
      single yellow plastic rod for a handle. Crossings creak musically.
    exits:
      w: pixel_river
      s: fat_cat_row
      n: crossroads
      e: pixel_haven_academy:start
    image: 24fbe873123d0804f31a643d112268c61aa6323939211cd529501c3b7af12a32.jpg
  pixel_river_2:
    title: Pixel River
    description: The southern stretch of the river where the bath-toy slimes are most numerous, drifting through reeds the
      same crisp color as crayon green. The bank is shallow and stepping-stones lead to the hidden railroad bridge in
      the west.
    exits:
      n: pixel_river
      s: pixelated_culvert
      w: a_hidden_railroad_bridge
    image: 3c4ddde9e302f1af8ed4a353d437e92af5f7e6577156d4d44b19b0da33bc863c.jpg
  the_porch_of_eternal_sighs:
    title: The Porch of Eternal Sighs
    description: A long, sun-warmed porch lined with rocking chairs and one massive cat-cushion. The breeze rustles faded
      lace curtains. The cat sighs. The wind sighs. Even the floorboards sigh, as though they too have lived a long life
      of mild disappointment. Grumpy Grandma's house is reachable to the east.
    exits:
      w: fat_cat_row
      e: grumpy_grandma_s_house
    image: 036f7f546b926ddc4bdb97a9961066204a6ee446f8a065fbb25ff8ebf429ab4d.jpg
  grumpy_grandma_s_house:
    title: Grumpy Grandma's House
    description: A dim, doily-strewn parlor crowded with porcelain cat figurines and one very large real cat. A rocking
      chair creaks unevenly in the corner. The smell is mothballs and faintly stale peppermints. Every surface looks
      faintly disapproving of you.
    exits:
      w: the_porch_of_eternal_sighs
    image: 62de5bd3505c878613dc82e4fac1939330929314afcd862bb3c268fd3c8d245e.jpg
  the_sports_metroplex:
    title: The Sports Metroplex
    description: A vast open-air sports complex with painted-on play lines for every sport ever imagined and several that
      haven't been yet. Children play here in the dreams of grown-ups; the bleachers are always half-full of cheering
      nobody-in-particulars. A stairway descends to a hidden gambling nook below. Misfit Island lies south across a
      footbridge.
    exits:
      d: the_gambling_nook
      s: misfit_island
      n: a_hidden_railroad_bridge
    image: d9ab32a04fb5b0dc314a52650c215abd4231f20c8eedc8b1fda6d383e267834a.jpg
  the_fanciest_most_decorated_rainbow_mansion:
    title: The Fanciest, Most Decorated Rainbow Mansion
    description: An absurd, magnificent mansion painted in every color of the rainbow at once, festooned with strings of
      fairy lights, plastic icicles, paper hearts, and one inflatable snowman who appears to be dancing in slow motion.
      It celebrates every holiday simultaneously and somehow this is not exhausting.
    exits:
      e: a_road_filled_with_holiday_cheer
      s: fanciest_house_front_yard
      w: fanciest_house_back_yard
    image: b441b0c8db67997e53a0e29e42f4cf347e86400a2de5e4eadcb55d433f1ea5ec.jpg
  a_road_filled_with_holiday_cheer:
    title: A Road Filled with Holiday Cheer
    description: A street where every house is decorated for a different holiday, all at once and all year round. Pumpkins
      jostle with menorahs, Easter baskets sit beside wreaths, fireworks dangle from a gingerbread eave. Tinsel never
      quite settles to the ground. The smell is cinnamon, sugar, and possibility.
    exits:
      w: the_fanciest_most_decorated_rainbow_mansion
      e: el_steckley_s_dueling_grounds
      n: fat_cat_row
      s: trainer_row
    image: b2f49529cc424e8f142367d06c1916075b28c4ca15b6d50d17e5e4e447d0bcdd.jpg
  el_steckley_s_dueling_grounds:
    title: El Steckley's Dueling Grounds
    description: A circular dueling pit of stamped earth ringed by an audience of empty wooden benches that somehow always
      feel half-occupied. A masked duelist named El Steckley keeps watch from the center, foam rapiers crossed at his
      hip. The Boarding House is just to the east.
    exits:
      w: a_road_filled_with_holiday_cheer
      e: the_boarding_house
    image: 07315ffb3c1292bc9b6651aff7abbc559c80e478ecb960aeffedea8abc4c0610.jpg
  the_boarding_house:
    title: The Boarding House
    description: A drowsy parlor lined with mismatched easy chairs and a faded Persian rug. The boarders here are all
      half-asleep over books, knitting, or unfinished crosswords. Sunlight slants through lace curtains. The clock on
      the mantel is right twice a day, by accident.
    exits:
      w: el_steckley_s_dueling_grounds
    image: 0811060caca2245f1723412853d15a61242364b8d527e21fb5f1c01bd5437d8e.jpg
  the_gambling_nook:
    title: The Gambling Nook
    description: A snug little card-room hidden beneath the Sports Metroplex bleachers, all green felt and warm
      pendant-lamps. A folding table is set up with chips, cards, and a cup of dice. The air is thick with the smell of
      root beer and friendly menace.
    tavern: true
    exits:
      u: the_sports_metroplex
    image: 3f136f4b4805fa03d638665075c4c30ad0b5ba0fa8574a64152fafe990d97123.jpg
  trainer_row:
    title: Trainer Row
    description: A short street with carved wooden signs hanging over half a dozen doorways, each promising lessons in a
      different art. Aspiring knights, princesses, doctors, pirates, and explorers gather here to find their first
      teachers. The Academy stands to the east, and the Arts and Crafts hub is just south.
    exits:
      e: the_academy
      n: a_road_filled_with_holiday_cheer
      s: arts_and_crafts
    image: 5ed7d501e30f33b78c73e05ec358119ce5c0fa3c7c20cf27aaabfa10b7b1bbe2.jpg
  the_academy:
    title: The Academy
    description: A wide-floored training hall with practice dummies stuffed with old socks, racks of cardboard weapons, and
      a banner reading 'BRAVE FIRST, FAST SECOND' in jubilant marker. Sir Bramble the Brave keeps order from a tall
      stool by the door, his cardboard armor squeaking happily.
    exits:
      w: trainer_row
    image: 241728ad9cd773983b5b60906ea1e875501a8a7111ddc1b97ed8076782c625c8.jpg
  the_tailor_s_costume_shop:
    title: The Tailor's Costume Shop
    description: "A wonderful little boutique where every wall is covered in costumes hanging from wooden pegs: princess
      gowns, knight's tabards, pirate vests, doctor's coats, and more. A long mirror runs along one wall, and a tailor's
      table sits in the back, scattered with sequins. Princess Sparklepants holds court here in between fittings,
      teaching the gentle magic of dressing the part."
    exits:
      e: arts_and_crafts
      w: cult_of_the_rubber_ducky
    image: 623c043d952992896769f0f85757f954c40eb32ab8905b78c37764073bdf1b00.jpg
  arts_and_crafts:
    title: Arts and Crafts
    description: A bright, paint-splattered workshop ringed by long pine workbenches, jars of glitter, and big rolls of
      butcher paper. The smell of glue and freshly-sharpened pencils is overwhelming. Pixel Haven's crafters use this
      room as their primary workbench station.
    station: WORKBENCH
    exits:
      w: the_tailor_s_costume_shop
      e: the_alchemist
      n: trainer_row
      s: the_wacky_waving_arm_flailing_inflatable_crossing_guard_station
    image: 2db70b4c067587c67b7c15a07973e3fbfb3bfe82de24bd4834a12b52430ad297.jpg
  the_alchemist:
    title: The Alchemist
    description: A cosy laboratory filled with bubbling glass beakers, copper coils, and shelves of jars labelled in
      handwriting only the alchemist herself can read. A tall stone alchemy table dominates the center, ringed with
      stools where apprentices brew strange brews. The smell is sugar, lavender, and faintly of fireworks.
    station: ALCHEMY_TABLE
    exits:
      w: arts_and_crafts
    image: c9e1b6da943777e0ed71b176ce8dd31562fc0536abe66a94274ab324606d09e3.jpg
  the_mystery_of_pixel_haven:
    title: The History of Pixel Haven
    description: A small museum with three exhibit cases, four maps that disagree about everything, and Historian Whiskers
      presiding behind a high desk piled with notebooks. A brass plaque on the wall reads 'Auringold — A World Made of
      Children's Dreams. Mind the displays.'
    exits:
      s: main_street
    image: a1fe4196e55c83c792c23dd6080a7c79961b251653524c37cd1eba5ae60243db.jpg
  the_register_brides:
    title: The Registrar of Guilds
    description: A formal little office of polished oak and ledger-laden shelves, kept by Brides the Guild Registrar.
      Banners of the great Pixel Haven guilds (and the small ones, and the silly ones) hang from the rafters, gently
      swaying in the breeze from the open window.
    exits:
      w: the_wacky_waving_arm_flailing_inflatable_crossing_guard_station
    image: 5eacd82b50cdc1812f76008484c58bcd8fb3372cac52bbd64e31062b78324540.jpg
  the_wacky_waving_arm_flailing_inflatable_crossing_guard_station:
    title: The Wacky-Waving Arm-Flailing Inflatable Crossing Guard Station
    description: A traffic island anchored by a ten-foot-tall inflatable crossing guard whose arms flail wildly in every
      breeze, directing pedestrians cheerfully to no particular destination. The station is the busiest intersection in
      town and somehow nobody has ever been hit by anything here.
    exits:
      n: arts_and_crafts
      s: crazy_road_intersection_point
      e: the_register_brides
      w: sanctuary
    image: 51990b9937e34dbeb9bf032507ac894316da7bf02a6ccc0e210100ce02abe50a.jpg
  the_general_store:
    title: The General Store
    description: A cluttered, friendly shop where every shelf is organized by color rather than purpose, so the red shelves
      have apples next to crayons next to small wooden swords. Crayonsville Carl beams from behind the counter. Type
      'list' to see what's on the shelves.
    exits:
      s: rainbow_fowl
    image: 0a3342f6df6ed47d105dc2093610dfab119bfef782f31bcc4cba63d55e12180e.jpg
  parkway:
    title: Parkway
    description: A broad green boulevard lined on both sides with manicured hedges shaped into animals — a hedge bear, a
      hedge rabbit, a hedge train. Park Boulevard is to the south, the Railroad Crossing east, and the animated flowers
      of Cartoon Flower Square shine to the west.
    exits:
      s: park_boulevard
      e: the_railroad_crossing
      w: animated_flower_row
    image: b3be7eb5855566b8e037614521217361af6baced1630a3a52370de09dceea1ce.jpg
  main_street:
    title: Main Street
    description: A wide, bustling little main street paved with bright cobblestones. Awnings on every shopfront flap lazily
      in the breeze, and the air is full of the cheerful, contradictory sounds of a town that never quite makes up its
      mind what kind of day it's having. The History museum is to the north, the Post Office to the south.
    exits:
      e: main_street_2
      n: the_mystery_of_pixel_haven
      w: the_railroad_crossing
      s: post_office
    image: 7925bf2f4d323da88105eb1bb51a9a92971a0ea43f9912533f60d98299e6c6bd.jpg
  main_street_2:
    title: Main Street
    description: An eastward continuation of Main Street, lined with smaller shops and a particularly handsome apothecary.
      The storefronts here are smaller and more eccentric — a hatmaker, a kite-shop, a tea importer who specialises in
      tea no one has heard of.
    exits:
      w: main_street
      e: crazy_road_intersection_point
      s: the_apothecary
    image: f518009e71fe3c39e51e8a09c9464e2f81d6ac17f65d93cdfffa3f7bab02b675.jpg
  crazy_road_intersection_point:
    title: Crazy Road Intersection Point
    description: A wild seven-way intersection where six lanes of phantom traffic somehow never quite collide. Hand- painted
      street signs point in three more directions than there are streets. The Wacky Waving Crossing Guard Station
      shimmers to the north, and Quiltwinds Road heads east.
    exits:
      w: main_street_2
      n: the_wacky_waving_arm_flailing_inflatable_crossing_guard_station
      e: road_quiltwinds
      s: nightmare_alley:the_stretching_corridor
    image: ae4e64646f80f7aa0f4f7df05bb06c1c683c4bbd12c43757fef5beeb23c3132e.jpg
  the_great_stone_inn:
    title: The Great Stone Inn
    description: A massive stone building older than anything else in town, its walls thick with creeping moss and its
      hearth never quite cool. Innkeeper Mossy moves through the common room with the silent grace of someone who knows
      every floorboard. A faded sign by the hearth reads 'SET YOUR RECALL HERE — THESE STONES REMEMBER.'
    bank: true
    tavern: true
    exits:
      s: road_quiltwinds
    image: 5272d45c98a23a8a68429710c86aaf78acaf4262f188816bfcb590621701057f.jpg
  the_park:
    title: The Park
    description: A wide, gently rolling park whose grass is the green of fresh crayons and whose sky always seems to be
      midafternoon. A path winds south to the lake, north to the boulevard, and west to the Mother Goose Gazebo.
    exits:
      s: pixel_haven_lake
      n: park_boulevard
      w: mother_goose_gazebo
    image: 763f39b230473d38c0ccecb970f26a1f050c9868d9d405f4c80bda74d8556ec6.jpg
  the_apothecary:
    title: The Apothecary
    description: A narrow, fragrant shop lined floor to ceiling with little wooden drawers labelled in tiny scrawled
      handwriting. Bouquets of dried herbs hang from the rafters, and the front counter is presided over by a polished
      brass scale that always weighs exactly what you need.
    exits:
      n: main_street_2
    image: 3f7c2c67ed3ed84d316a9950b347bbe6ffe6aaba5f0f1fee16f9ec9e10599200.jpg
  pixel_haven_lake:
    title: Pixel Haven Lake
    description: A perfectly round lake whose surface ripples in tidy crayon-blue squares. Lily pads the size of dinner
      plates float in lazy patterns, and the air smells of clean water and warm sun. A weed-tangled rope ladder descends
      into the murky depths below.
    exits:
      n: the_park
      d: lake_bottom
    image: 35bd76b2ced460b6332ec16f7ba6ddb4cc0ae6e6c53624c64977430bad99d94b.jpg
  park_boulevard:
    title: Park Boulevard
    description: A long, leafy avenue lined with park benches and gas-lamp posts that someone has decorated with ribbons. To
      the east, a cheerful little house glows behind a picket fence — Grandma Sunshine's place, the cosiest stop in
      town.
    exits:
      n: parkway
      s: the_park
      e: grandma_sunshines_house
    image: 7a98afb214efc34246bc2f9fef79c51f61081d34ecfe5b01e8b255bd93480695.jpg
  grandma_sunshines_house:
    title: Grandma Sunshine's House
    description: The cozy living room bursts with cheerful chaos, its walls adorned with glittering snowman figurines
      perched alongside framed portraits of a pompadoured crooner in rhinestone-studded jumpsuits. Mismatched furniture
      from decades past creates a kaleidoscope of floral patterns and bold geometric prints, while twinkling Christmas
      lights strung year-round cast a warm, golden glow over crocheted doilies and ceramic Elvis collectibles that crowd
      every available surface.
    exits:
      w: park_boulevard
      s: chatty_kathy_alley
    image: 7490ce7d3e7881d301f71bdb542177a21ee2c6f1f823098e1c5bd6da0314ea6c.jpg
  chatty_kathy_alley:
    title: Chatty Kathy Alley
    description: A narrow alley between two leaning houses, walled in laundry-line and shadow. A lone porcelain doll sits in
      the middle of the alley, smiling. She's smiling. She is smiling. The way out is back to the north.
    exits:
      n: grandma_sunshines_house
    image: f4f0c4499ea744a5c7cdacf66a31b9c506309fe651bc62f3c88061a25d858574.jpg
  lake_bottom:
    title: Lake Bottom
    description: A surprisingly cosy underwater grotto lit by glowing crystals and drifting columns of bubbles. The sand is
      soft, the water is warm, and an enormous moss-covered teddy bear watches from a hollow in the rock.
    exits:
      u: pixel_haven_lake
    image: 98468274608797aa5b672a909477902ce91417b1ac1d529ff35957c530896b09.jpg
  the_railroad_crossing:
    title: The Railroad Crossing
    description: A bright red-and-white crossing gate stands here, perpetually half-raised, perpetually about to clang. The
      toy train station sits to the south, the railroad bridge stretches north, and Main Street is east.
    exits:
      w: parkway
      s: toy_train_station
      n: railroad_bridge
      e: main_street
    image: 43bdc79f973d39b13f4aafe7351d9181314cc0ba8284ed102488bc603f7c9dcc.jpg
  toy_train_station:
    title: The Toy Train Station
    description: A perfect miniature station house with a pitched red roof, a clock tower, and a single bench on the
      platform. Conductor Choo Choo stands proudly by the empty tracks, pocketwatch in hand. There is no train. There
      has never been a train. The schedule is, however, immaculate.
    exits:
      n: the_railroad_crossing
    image: c2469db3224d910f36ceaa374812589092244c19d293bd016f90be621b24248a.jpg
  railroad_bridge:
    title: The Railroad Bridge
    description: A long iron-and-tie bridge crossing a deep, soft-edged ravine. The rails are polished gold-bronze and the
      wooden ties are unevenly spaced, as though laid by an enthusiastic but small contractor. A spur leads west to a
      hulking toy train car parked alone on a siding.
    exits:
      s: the_railroad_crossing
      n: misfit_island
      w: train_car
    image: 42da4bf19afe476ed57268608804d360ba80f0b1b31aa41f3e78fd952ec213bc.jpg
  pixelated_culvert:
    title: A Pixelated Culvert
    description: A low concrete culvert under a forgotten footpath, dripping with pixel-perfect droplets and lit by a single
      dirty shaft of light. A vein of gummy ore glimmers in the wall like buried fruit.
    exits:
      n: pixel_river_2
    image: 0a85f504440efb00c58b75a05b1f197b4506e6006bb4358c2394555e4832dc2f.jpg
  fireworks_depot:
    title: The Magical Fireworks Depot
    description: A rickety wooden warehouse on the edge of Misfit Island, packed wall to wall with crates of bottle rockets,
      sparklers, fountain candles, and the occasional banned-everywhere-else cherry bomb. A hand-lettered sign warns NO
      LIGHTING THE STOCK NO MATTER HOW BORED YOU ARE.
    exits:
      e: misfit_island
    image: 78bc8340b102ca6d15ee203ab49347a40a74bb7e262842ae710ec3949b822ed8.jpg
  misfit_island:
    title: Misfit Island
    description: A small green island in the middle of the river, reachable by footbridges from several directions. The
      misfit kids of Pixel Haven gather here, dreamed-up pirates and outlaws among them. Sneaky Pete keeps a leaning
      shack at the center and teaches the rogue's trade to anyone with quick fingers.
    exits:
      s: railroad_bridge
      w: fireworks_depot
      n: the_sports_metroplex
      e: river_cliffs
    image: 9851dcc5588aaa6f22179b3a2f11b92be4f30a90acddc30d2117fc20a4d9ef50.jpg
  river_cliffs:
    title: The Cliffs Along Pixel River
    description: A short, dramatic cliff face overlooking the Pixel River — perfect for sitting on, throwing pebbles from,
      or making important child-life decisions. Pebble sprites tumble and chime among the loose stones.
    exits:
      w: misfit_island
    image: 4c3b581342c3381184edbd65ad25dff7b73aef1713ea5b397d772dfb3dec306d.jpg
  magic_pie_shop:
    title: The Magic Pie Shop
    description: A snug bakery whose front window is permanently fogged with pie steam. Round pies, square pies, sky-high
      meringues, and one impossible four-dimensional tart sit cooling on the racks. Granny Aprons commands the kitchen
      with a wooden spoon and an iron will.
    exits:
      s: animated_flower_row
    image: 646cfc00e29ddbe69317954f7295c5e77125591c497166b35a3ebeae248553ae.jpg
  animated_flower_row:
    title: Cartoon Flower Square
    description: A flagstone square ringed with enormous animated daisies whose petals turn to follow you and whose faces
      have actual expressions. They sing softly to themselves when no one's listening, and bow politely when someone is.
      Daisy sprites buzz about the bigger flowers like very small bees.
    exits:
      e: parkway
      n: magic_pie_shop
      s: walking_path
      w: rainbow_fowl
    image: ef2e3c7e05ec4b3bf8fecd7147306bd823f0d73ceca9ace0a1e222e1a9fa493f.jpg
  mother_goose_gazebo:
    title: The Mother Goose Gazebo
    description: A round wooden gazebo painted white, ringed with morning glories and inhabited by an enormous, dignified
      goose in tiny spectacles. Stacks of nursery-rhyme books rise around her like fortifications. The Park is east; a
      cobblestone path leads north.
    exits:
      n: walking_path
      e: the_park
      w: forgotten_playground
    image: a1a4d98f949156d854760481bd71655e97cc0d071b5c52388fe2acc285b50d98.jpg
  walking_path:
    title: A Cobblestone Path
    description: A winding stone path between high boxwood hedges. The cobbles are arranged in a soothing herringbone
      pattern, and tiny lanterns hang from the hedge tops. Cartoon Flower Square is to the north; the gazebo lies south.
    exits:
      n: animated_flower_row
      s: mother_goose_gazebo
    image: 3c7cb56e3789a1063c27d19f1806c49a00164a7ed286303346db3ff696cd17d6.jpg
  fanciest_house_front_yard:
    title: A Front Yard Filled With Inflatables and Holiday Decorations
    description: An immaculate front lawn so densely packed with inflatable snowmen, ghosts, turkeys, bunnies, and one
      inexplicable inflatable accountant that there is barely room to walk. They sway gently in unison whenever a breeze
      passes through.
    exits:
      n: the_fanciest_most_decorated_rainbow_mansion
    image: 5d175f18f65258b2e9840c798a5223898e6092b769893facdbf1796a071457dc.jpg
  fanciest_house_back_yard:
    title: A Back Yard With a Magic Waterpark
    description: A turquoise pool ringed with water slides, fountains, and inflatable rafts shaped like impossible animals.
      A particularly large inflatable shark prowls the deep end with menacing intent. The water is always the perfect
      temperature.
    exits:
      e: the_fanciest_most_decorated_rainbow_mansion
      s: the_picture_palace
    image: ea0e175c15cfab6085b7886e2731ae29a7292b8b57242818ccf6374f76cea723.jpg
  post_office:
    title: The Zippy Quick Post Office
    description: A bright, narrow office wallpapered in pigeonhole shelves, every cubby crammed with letters addressed in
      many handwritings. Postmaster Polly works behind a wooden counter that has been polished by generations of elbows.
      Type 'mail list' to read your inbox.
    exits:
      n: main_street
    image: de719dffa1917ef880541330d5325d85053d76780dce893b58f57a3be205c8ec.jpg
  train_car:
    title: An Enormous Toy Train Car
    description: A gigantic toy boxcar parked on a forgotten siding, its sides painted with a faded circus motif. The
      interior smells of old straw and oily metal. Rusty the Toy Train Bandit holds the running-board like he owns the
      place, and arguably he does.
    exits:
      e: railroad_bridge
    image: e7147a786909300b3bb31ced17780feaf7e2ae75518766db3c3dcf110baafa9d.jpg
  sanctuary:
    title: The Pixel Haven Stone Sanctuary
    description: A small chapel of cool grey stone, its arched windows filtering the daylight into long quiet bars across
      the floor. A single brass bowl of water stands at the altar, and the air is utterly hushed. No one will attack you
      here — even bath-toy slimes know better than to bring their nonsense inside.
    exits:
      e: the_wacky_waving_arm_flailing_inflatable_crossing_guard_station
    image: c424d2e2966dc1ac235d1a962638c2ba2957ee9239c0003123feee7e648ce1f6.jpg
  rainbow_fowl:
    title: Rainbow Fowl Fairway
    description: A wide pedestrian fairway lined with chickens of impossible colors — turquoise, magenta, sunset- gold. They
      strut about with the confidence of birds who have never met a fox. The General Store is to the north, Donut Shop
      south, and the Toybox Ocean shore west.
    exits:
      e: animated_flower_row
      n: the_general_store
      s: donut_shop
      w: sea_shore
    image: 224d5c26a0ceef3635306402063709b3cf09ca1ec2ce1fcd9bb4bc792d648c7b.jpg
  donut_shop:
    title: The Oddest Donut Shop Around
    description: A round, glass-fronted shop with a rotating display case of donuts in every imaginable shape and color,
      plus several that defy ordinary geometry. Doctor Doughnut presides from behind the counter, fogged glasses and
      all.
    exits:
      n: rainbow_fowl
    image: 3840a7ac13fe1d54aa9f78dd481647a59ca25314e63fa0cd310fb08d4869cb33.jpg
  sea_shore:
    title: The Shore of the Toybox Ocean
    description: A wide ribbon of white sand beach beside an ocean that is, on closer inspection, actually a child's
      enormous toybox. Plastic boats bob in the waves and the sand is studded with small forgotten treasures.
    exits:
      e: rainbow_fowl
      s: toybox_ocean:the_shallows_of_soft_awakening
    image: 2b0fc7c5abeb359dfb90e522e5a8b12367563a5e00aa5bf096469f092009bd14.jpg
  the_only_road_4:
    title: The Road to Crayonsville
    description: The eastward stretch of the Only Road toward the Pixel Haven Mall, where the cobblestones become subtly
      waxy underfoot and the grass grows in vivid, unnatural greens. A handful of crayon goblins lurk in the verges,
      grinning. Crayonsville lies somewhere beyond, hazy and inviting.
    exits:
      e: the_only_road_2
      n: pixel_haven_mall_parking
      w: crayonsville:the_chromatic_welcome_plaza
    image: fb45db82cffbeb9dba522e01552ce83d6b3be88d339efae6da433c65d7d20b9f.jpg
  the_only_road_5:
    title: The Road to Stuffiesburg
    description: A stretch of the Only Road that smells of fresh felt and looks faintly fuzzy at the edges. Stuffie guards
      in zigzag-stitched armor patrol the verges, polite but firm. Stuffiesburg lies beyond, somewhere safer than it
      sounds.
    exits:
      w: the_only_road_3
      e: stuffiesburg:the_cobblestone_plaza
    image: 7e509dadff5c506794f38145bdb8a6b4a3ec4f5081358964cddb35d1698f5150.jpg
  road_underbed_hollow:
    title: A Treacherous Footbridge to the Underbed Hollow
    description: A swaying rope-and-plank bridge slung across a shallow ravine. The boards are mossy, and a sign at the near
      end warns CAREFUL — DUST BUNNIES IN SEASON. The Underbed Hollow is somewhere on the other side, a twilight forest
      where lost things gather.
    exits:
      e: a_hidden_railroad_bridge
      w: underbed_hollow:bridge_s_end
    image: 8ed221dffcd346f75f7b5450364d22431bcef85560d8aa68c7876babb6134344.jpg
  road_quiltwinds:
    title: The Road to Quiltwinds Township
    description: A long, gentle stretch of road that has been paved (so the locals say) with the soft blocks of an enormous
      patchwork quilt. The seams are lumpy underfoot, but the colors are wonderful. Quiltwinds Township is somewhere
      over the horizon. The Great Stone Inn squats reassuringly to the north.
    exits:
      w: crazy_road_intersection_point
      n: the_great_stone_inn
      s: toy_emporium
      e: quiltwinds_township:the_quilted_crossroads
    image: 5b8bb0b66c1ad9e780072dd178c5dbbf61b689a0e1958eb7188691ab58ae6d15.jpg
  cult_of_the_rubber_ducky:
    title: Cult of the Rubber Ducky
    description: A tiny, sun-bright temple devoted to the worship of an enormous rubber duck enshrined upon a velvet pillow
      on the central altar. The cultists dance, sing, and even play the saxophone, all WITHOUT putting down the ducky.
      Pirates have begun to gather here too — a most unlikely congregation. The costume shop is east.
    exits:
      e: the_tailor_s_costume_shop
    image: 9b3ebae29a99a493db8f6a241d0795b407073d32cd5fd9933c01e7876c49e0e2.jpg
  toy_emporium:
    title: The Old Toy Emporium
    description: A rambling, dust-filled toy shop that no one in town can quite remember the way to. The shelves groan with
      handmade wooden trains, painted soldiers, marble-runs, and at least one rocking horse that looks like it remembers
      being a real horse. Topsy the Toymaker bustles about behind a workbench at the back. The front door opens onto a
      road that doesn't appear to exist.
    image: 52ce5ccecb081802a65f792ab92b18e4aface1fbbc06409451b47ad7122b57db.jpg
    exits:
      n: road_quiltwinds
  forgotten_playground:
    title: The Forgotten Playground
    description: A small overgrown playground tucked into a forgotten pocket of Pixel Haven, where the swings sway gently in
      a breeze you cannot feel and the merry-go-round still turns slowly on its rusted bearings. The laughter of
      children plays here just at the edge of hearing.
    image: d6b5bf6c94a1f2729aa7cf8c5c0838e1970cd520b933af8494844a88b23d14a9.jpg
    exits:
      e: mother_goose_gazebo
  the_picture_palace:
    title: The Picture Palace
    description: A grand, slightly run-down movie theater with a marquee that reads NOW SHOWING — YOUR FAVORITE MEMORY in
      flickering bulbs. The lobby smells of buttered popcorn, the carpet is the color of a daydream, and the projection
      booth hums softly even when no film is playing.
    image: 71d9aebb36cfc656b9ccd2d6ce76647f79ea610d0c672d04371e048d73538b16.jpg
    exits:
      n: fanciest_house_back_yard
  pixel_haven_mall_parking:
    title: The Pixel Haven Mall Parking Lot
    description: A vast, abandoned parking lot stretches under flickering fluorescent lights, where the ghostly echoes of
      old video game arcade music seem to drift from the cracked and overgrown asphalt. Strange, blocky geometric
      patterns, as if from a low-resolution screen, warp the reality of the concrete pillars and empty spaces between
      rusted, outdated vehicles.
    exits:
      s: the_only_road_4
      n: shear_elegance
      e: the_dump
      w: housing_broker
    image: a7341d2c64fbd237c0e2077209511f153d70205fd87da8fd22a736484d654bdd.jpg
  shear_elegance:
    title: Shear Elegance
    description: A sleek, minimalist space where mirrored walls and polished chrome surfaces reflect the soft glow of
      pendant lighting over stylists' stations equipped with gleaming tools and bottles of vibrant hair color.
    exits:
      s: pixel_haven_mall_parking
      n: portals
    stylist: true
    image: 55e8003c2db2d689cdc97406d584e57e5f23c9a2ea70df6cd56da9257a9e2353.jpg
  housing_broker:
    title: Jingleheimerschmidtt Premium Housing
    description: A vaulted chamber adorned with gold filigree and enchanted, self-polishing darkwood gleams under the soft,
      perpetual light of magically suspended gemstones, every surface speaking of impossible wealth and arcane comfort.
    image: 520a63daeef424525be5a3146ded83cc5e02fb176dc346cec4c52dbfc37795d7.jpg
    exits:
      e: pixel_haven_mall_parking
    housingBroker: true
  portals:
    title: Pixel Haven Hall of Portals
    description: A shimmering chamber thrums with arcane energy, its walls lined with swirling portals that shimmer in
      impossible colors—one rippling with verdant mists northward, another glowing soft and pastel to the east, while a
      third crackles with misty spray to the west. The southern wall remains calm and ordinary, a simple archway leading
      back to the familiar scent of hair and cosmetics, yet the air itself seems to bend around these gateways as if
      reality itself grows thin in this hidden nexus between worlds.
    exits:
      s: shear_elegance
      n: pbrae:waterfall_cliff
      w: wesleyalis:gravel_road_2
      e: trailey:cul_de_sac
    image: e87f16533056783fc5ba5b95500aeeee3bd876cefc44a1597e912ed7e6834653.jpg
graphical: true
levelBand:
  min: 3
  max: 5
difficultyHint: casual
image:
  room: 788110b0edc972237bfc2fc28882df52b70cf98361c760cc1195fa26024ec227.jpg
  mob: 7953c82d6a58c2e851840d0a595a97de8fb354b48496b2f5519a6f374ff0b779.png
  item: 899cd5b51a29e232b3bdba79727151c5f49df9f46462d81d6e6913e33b1601dc.png
mobs:
  grandma_sunshine:
    name: Grandma Sunshine
    spawns:
      - room: grandma_sunshines_house
    tier: boss
    level: 5
    description: A plump, motherly figure with towering silver hair teased to impressive heights and shellacked with
      gleaming hairspray that catches the golden light, wearing a vibrant floral housedress in shades of pink and yellow
      that complement the town's perpetual sunset glow. Her kind eyes twinkle with mischief behind cat-eye glasses
      adorned with tiny rhinestones, while her arms remain perpetually open in invitation, sturdy sensible shoes tapping
      rhythmically against the moss-touched cobblestones as if always ready to break into an impromptu dance.
    image: 6cda77dde1bfdbce6d302b93002b4425306baed63231257d067c3ffafb7bda5b.png
    dialogue:
      root:
        text: Well bless your heart, sugar — come on in! The cookies are still warm. Grandma Sunshine takes care of everyone in
          Pixel Haven, and that includes you.
        choices:
          - text: Tell me about Pixel Haven.
            next: about_town
          - text: Goodbye, Grandma.
            next: farewell
      about_town:
        text: This whole town was dreamed up one summer afternoon when a little girl named Auringold fell asleep on her
          grandmother's porch. Every kid in the world has visited at least once — they just don't always remember. Make
          yourself at home.
        choices:
          - text: Goodbye, Grandma.
            next: farewell
      farewell:
        text: You come back any time, sugar. Bring a friend.
  grandma_grumpy:
    name: Grandma Grumpy
    spawns:
      - room: grumpy_grandma_s_house
    tier: standard
    level: 3
    description: A rotund elderly woman slumps in a creaky wooden rocking chair, her gray hair escaping from a loose bun as
      she nods drowsily with half-closed, irritated eyes. A massive orange tabby cat sprawls across her ample lap, its
      fur matted and whiskers twitching while she mutters under her breath, her knitted shawl pulled tight around her
      hunched shoulders.
    image: 639b4d228adaa929aea90d2a1a85915cecfb781d5123c37423c6ebdd1f6af602.png
    dialogue:
      root:
        text: Hmph. Tracking porch dust into a person's house. Some grandmothers bake cookies. I sit. Move along, I'm watching
          my stories.
        choices:
          - text: Sorry to bother you.
            next: farewell
      farewell:
        text: Mhm. Close the screen door behind you.
  mailman_kirk:
    name: Mailman Kirk
    spawns:
      - room: fat_cat_row
    tier: standard
    level: 3
    description: A wiry figure in faded blue postal coveralls jogs past with mechanical precision, his worn leather satchel
      bouncing rhythmically against his hip as letters and small packages peek from its overstuffed opening. His
      weathered hands are perpetually stained with engine grease despite his current role, and his determined stride
      carries the efficient urgency of someone who has found his true calling in motion rather than machinery.
    image: 72c67d746d349214733c428611a07bde998e8856faf231e1a35e8662f03bc31a.png
    behavior:
      template: patrol
      params:
        patrolRoute:
          - fat_cat_row
          - the_porch_of_eternal_sighs
          - a_road_filled_with_holiday_cheer
          - trainer_row
    dialogue:
      root:
        text: Letters! Packages! Special deliveries! Can't stop, can't stop — Pixel Haven's mail waits for no one. If you're
          looking for the post office, it's right off Main Street.
        choices:
          - text: Goodbye, Kirk.
            next: farewell
      farewell:
        text: Keep your address current!
  mayor_buttercup:
    name: Mayor Buttercup
    spawns:
      - room: pixel_haven_city_hall
    tier: weak
    level: 3
    quests:
      - bath_toy_invasion
    description: A round, rosy-cheeked woman in a butter-yellow suit two sizes too small for her enthusiasm, an enormous
      brass mayor's chain bouncing on her chest as she gestures. She gives the impression of a small sun that has
      decided to wear glasses.
    dialogue:
      root:
        text: Welcome to Pixel Haven City Hall! I'm Mayor Buttercup, and I keep this lovely little town running. We handle all
          civic business right here — and the bank's open as well.
        choices:
          - text: Tell me about Pixel Haven.
            next: about_town
          - text: I hear there's trouble down by the river.
            next: quest_offer
          - text: How does the bank work?
            next: about_bank
          - text: Goodbye, Mayor.
            next: farewell
      about_town:
        text: Pixel Haven is the cosiest little town in all of Auringold — the magical world dreamed up by children everywhere.
          We have a lake, a park, an academy, costume shops, a sports metroplex, even a real lottery! And our newest
          neighborhood is across the K'nex Drawbridge.
        choices:
          - text: Goodbye, Mayor.
            next: farewell
      quest_offer:
        text: Oh, you've heard! Bath-toy slimes have been bubbling up out of Pixel River. They're harmless, mostly, but they
          leave residue all over the bridge planks. Could you clear out a few for me? I'd be ever so grateful.
        choices:
          - text: I'll handle it.
            next: farewell
      about_bank:
        text: Just type 'bank' to see your account, 'deposit <amount>' to put gold away, or 'withdraw <amount>' to take it back
          out. Your gold is safe with us — I balanced the ledger myself this morning.
        choices:
          - text: Goodbye, Mayor.
            next: farewell
      farewell:
        text: Civics is its own reward!
    image: 636adde0144a0020e27db66d5831ff133f185b1ee36853142ceea5409dc11b3c.png
  lottery_larry:
    name: Lottery Larry
    spawns:
      - room: pixel_haven_lottery_office
    tier: weak
    level: 3
    description: A whip-thin man in a gold satin vest and a confetti-stained bowtie, beaming beside a rumbling glass tumbler
      full of numbered ping-pong balls. He never seems to blink and always seems to be one second from shouting
      'WINNER!'
    dialogue:
      root:
        text: WELCOME, FRIEND, to the Pixel Haven Lottery Office! Where dreams become numbers and numbers become dreams! Buy a
          ticket with 'lottery buy', check the jackpot with 'lottery info', and may the lucky stars smile on you!
        choices:
          - text: How does it work?
            next: how_lottery
          - text: Goodbye, Larry.
            next: farewell
      how_lottery:
        text: Easiest game in town! 'lottery buy' for a single ticket, 'lottery tickets' to see your numbers, and 'lottery info'
          for the current pot. Drawings happen on a schedule. Big winners get their photo on the wall!
        choices:
          - text: Goodbye, Larry.
            next: farewell
      farewell:
        text: STAY LUCKY OUT THERE!
    image: 075230e4be9541a0f674c7f85dd234e44611e1ce7565c317959e7cbba4f55434.png
  crayonsville_carl:
    name: Crayonsville Carl
    spawns:
      - room: the_general_store
    tier: weak
    level: 3
    description: A jovial shopkeeper in a striped apron, his beard streaked with stripes of accidental crayon. He gestures
      around the cluttered shelves of the general store with the proud air of a man who has organized everything by
      color.
    dialogue:
      root:
        text: Step right in! Carl's General Store carries everything a Pixel Haven adventurer might need — weapons, armor,
          snacks, and at least one of every color of crayon. Type 'list' to see what's on the shelves.
        choices:
          - text: Goodbye, Carl.
            next: farewell
      farewell:
        text: Mind the threshold — the floor still squeaks!
    image: d2b34719de852824201feb00dad84dfaa472f4efe432299aa7da54736a2b6920.png
  granny_aprons:
    name: Granny Aprons
    spawns:
      - room: magic_pie_shop
    tier: weak
    level: 3
    quests:
      - sweet_petals
    description: A diminutive baker barely as tall as her own counter, wreathed in seven aprons of progressively smaller
      size. She smells overwhelmingly of cinnamon and powdered sugar.
    dialogue:
      root:
        text: Hello dearie! Pies, pies, pies — Granny Aprons makes the best pies in Pixel Haven. Magic ones, too. The
          fairy-floss slice is on special today.
        choices:
          - text: How can I help?
            next: quest_offer
          - text: What's on the menu?
            next: shop_info
          - text: Goodbye, Granny.
            next: farewell
      quest_offer:
        text: Oh, you sweet thing — I'm short on glittering daisy petals. The flowers in Cartoon Flower Square shed them
          sometimes if you ask nicely (and the daisy sprites don't always ask nicely back). Bring me a few and I'll bake
          you something special.
        choices:
          - text: I'll fetch some petals.
            next: farewell
      shop_info:
        text: Type 'list' to see today's pies. Or just smell them — your nose will tell you everything.
        choices:
          - text: Goodbye, Granny.
            next: farewell
      farewell:
        text: Mind the bottom step on your way out — the icing's slippery!
    image: 9a61a8e5e6ede7c485aac4a5eeb594eb5a2efe045373faf9ee960893d8d33aab.png
  doctor_doughnut:
    name: Doctor Doughnut
    spawns:
      - room: donut_shop
    tier: weak
    level: 3
    description: A tall man in a white coat that is either a baker's or a doctor's, depending on which way the light hits
      the embroidered name patch. His big round glasses keep fogging up from the donut fryer behind him.
    dialogue:
      root:
        text: Welcome to The Oddest Donut Shop Around — where every donut is medicinal! Some heal scrapes, some restore courage,
          and one of them, regrettably, is just a donut. Try 'list' for the menu.
        choices:
          - text: Goodbye, Doctor.
            next: farewell
      farewell:
        text: Doughnuts twice a day, that's the prescription.
    image: df6513222f60b4fc8800573b254ccbfd79e0409ad4d87398f639abaa4ae445e0.png
  burnt_bobby:
    name: Bartender Burnt Bobby
    spawns:
      - room: burnt_pixel_bar
    tier: weak
    level: 3
    description: A grizzled bartender whose left eyebrow is permanently singed off. He polishes a glass with a rag that may
      once have been a bar towel, in another life.
    dialogue:
      root:
        text: Welcome to the Burnt Pixel. Don't ask about the kitchen fire. Don't ask about the OTHER kitchen fire. We do
          gambling here too — type 'gamble' or 'dice' if you're feeling lucky.
        choices:
          - text: How does the gambling work?
            next: about_gambling
          - text: Goodbye, Bobby.
            next: farewell
      about_gambling:
        text: Simple. 'dice <amount>' rolls the bones for a payout. Win some, lose some. The house drinks either way.
        choices:
          - text: Goodbye, Bobby.
            next: farewell
      farewell:
        text: Try not to breathe through your nose on the way out.
    image: c8a3b6276c7f5a00d2ed17ebff82f1233a3119413072fb1b8845abd96fb20410.png
  innkeeper_mossy:
    name: Innkeeper Mossy
    spawns:
      - room: the_great_stone_inn
    tier: weak
    level: 3
    description: A serene woman with green braids piled atop her head and moss growing — quite intentionally — along the
      seams of her apron. She moves so quietly she might be made of stone herself.
    dialogue:
      root:
        text: Welcome, traveler. The Great Stone Inn has been here since the very first dream of Auringold. Set your recall
          stone here, and these old stones will always know how to pull you home.
        choices:
          - text: Set this inn as my recall point.
            next: confirm_recall
            action: set_recall
          - text: Tell me about recall.
            next: explain_recall
          - text: Goodbye.
            next: farewell
      confirm_recall:
        text: It is done. The hearth stones know your name now. Type 'recall' from anywhere in the world and you will be drawn
          back here.
        choices:
          - text: Thank you, Mossy.
            next: farewell
      explain_recall:
        text: Recall is your way home. Pick a safe spot, set it once, and you can always return — handy when night falls in a
          strange wood.
        choices:
          - text: Set this inn as my recall point.
            next: confirm_recall
            action: set_recall
          - text: Goodbye.
            next: farewell
      farewell:
        text: Walk gently. The stones remember every step.
    image: 7b4d5b0ad309d752102e93a97c18e050089131e16f057b3257d1766f32c9adca.png
  postmaster_polly:
    name: Postmaster Polly
    spawns:
      - room: post_office
    tier: weak
    level: 3
    description: A brisk woman in a starched blue uniform two sizes too crisp, juggling three letters and a parcel with the
      practiced ease of someone who has done this her entire life.
    dialogue:
      root:
        text: Pixel Haven Post Office, Postmaster Polly speaking! 'mail list' shows your inbox, 'mail send <player> <message>'
          fires off a letter, and Mailman Kirk does the legwork. The legwork is the part Kirk likes most.
        choices:
          - text: Goodbye, Polly.
            next: farewell
      farewell:
        text: Stamps are on the counter. They're decorative — we run on enthusiasm.
    image: 543b25c266eb10e96ae3bb9c78bbd87bb82c40306c05f515030498429075659d.png
  guild_registrar_brides:
    name: Brides the Guild Registrar
    spawns:
      - room: the_register_brides
    tier: weak
    level: 3
    description: A solemn woman in scholarly robes, surrounded by hundreds of dusty leather-bound ledgers and one brand-new
      fountain pen.
    dialogue:
      root:
        text: Welcome to the Registrar of Guilds. If you wish to found, join, or manage a guild, the paperwork begins here.
        choices:
          - text: How do guilds work?
            next: explain_guilds
          - text: Goodbye.
            next: farewell
      explain_guilds:
        text: "'guild create <name>' founds one. 'guild invite <player>' brings in members. 'guild roster' lists them. 'gchat
          <message>' speaks in the guild channel. We keep impeccable records — even of typos."
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: May your charter outlast its founders.
    image: d7fd34adcb9113bef0bd7617d379b9e9768cab09950d6e4ca25155595379e346.png
  historian_whiskers:
    name: Historian Whiskers
    spawns:
      - room: the_mystery_of_pixel_haven
    tier: weak
    level: 3
    description: A stooped, bespectacled scholar with magnificent white sideburns and ink-stained fingertips. His desk is
      buried in maps of Pixel Haven that contradict each other in cheerful ways.
    dialogue:
      root:
        text: Aha — a fellow seeker. I am Historian Whiskers, and this little museum collects the tangled threads of Pixel
          Haven's past. What would you like to know?
        choices:
          - text: How was Pixel Haven created?
            next: about_origin
          - text: Tell me about Auringold.
            next: about_world
          - text: Why are there so many roads called 'The Only Road'?
            next: about_roads
          - text: Goodbye, Historian.
            next: farewell
      about_origin:
        text: Pixel Haven was dreamed into being by a child named Auringold one summer afternoon — the dream lingered in the
          world long after she woke, and over the years other children added to it. Every fanciful idea, every
          half-finished daydream, every 'wouldn't it be cool if...' eventually rooted somewhere in our streets.
        choices:
          - text: Tell me about Auringold.
            next: about_world
          - text: Goodbye, Historian.
            next: farewell
      about_world:
        text: Auringold is the magical world made of children's dreams. Pixel Haven is one town in it; there are many others —
          Crayonsville, Stuffiesburg, Quiltwinds, the Underbed Hollow, and stranger places still. The roads leading out
          of town will get you to most of them, eventually.
        choices:
          - text: Why are there so many roads called 'The Only Road'?
            next: about_roads
          - text: Goodbye, Historian.
            next: farewell
      about_roads:
        text: Ah! That is the great mystery, isn't it? Each is the only road that leads to where it leads. So they are all true,
          and all named correctly, and the maps simply have to cope. Personally, I find it charming.
        choices:
          - text: Goodbye, Historian.
            next: farewell
      farewell:
        text: Mind the loose floorboards by the door — they are themselves a historical exhibit.
    image: e8028ece1cc5311dd6f5144138c1ec70ade188b87975d3a5a2af4049c392ddaf.png
  sir_bramble:
    name: Sir Bramble the Brave
    spawns:
      - room: the_academy
    tier: weak
    level: 3
    description: A jolly knight in cardboard plate armor laced together with shoelaces. His helm visor is permanently stuck
      in the up position, revealing a luxurious mustache.
    dialogue:
      root:
        text: Hail, brave one! I am Sir Bramble, and at the Academy we train the bravest knights in Pixel Haven. Type 'train
          list' to see what I can teach you. Honor first, snacks second, victory third!
        choices:
          - text: How does training work?
            next: training_info
          - text: Goodbye.
            next: farewell
      training_info:
        text: "'train list' shows what's available. 'train learn <ability>' spends a skill point. Knights are tough, loud, and
          very polite to dragons."
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Stand tall! The visor stays up!
    image: 7fe03d17191efb73c474a3db877e6441c74c76db4e349250f1afc370851ca5d0.png
  princess_sparklepants:
    name: Princess Sparklepants
    spawns:
      - room: the_tailor_s_costume_shop
    tier: weak
    level: 3
    description: A radiant young woman in glittering layers of pink and silver, her hair coiled into a crown of star pins.
      Wherever she walks, a faint sprinkle of sparkles follows her about a half-step behind.
    dialogue:
      root:
        text: Oh, hello! I'm Princess Sparklepants, and the Tailor's Costume Shop is my school as much as it is a shop. Princess
          magic is the prettiest magic in all of Auringold. 'train list' to see what I can teach you!
        choices:
          - text: How does training work?
            next: training_info
          - text: Goodbye.
            next: farewell
      training_info:
        text: "'train list' shows my spells. 'train learn <spell>' spends a skill point. Princess magic is mostly sparkles,
          charm, and the occasional very polite fireball."
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Smile! The day is full of glitter.
    image: 7327b9f16cb627b19c5eecc23eea4486c5154b3d7a7dc5b05da22501c1036e5e.png
  doctor_ouchless:
    name: Doctor Ouchless
    spawns:
      - room: hospital_for_the_aging_and_infirmed_teenagers
    tier: weak
    level: 3
    description: A kindly woman in a too-clean lab coat with a name-tag reading 'DR. OUCHLESS — IT WON'T HURT, I PROMISE'.
      She carries a stethoscope shaped like a friendly cat.
    dialogue:
      root:
        text: Hello, hello — welcome to the Hospital for the Aging and Infirmed (Teenagers). It's a niche specialty. I teach the
          healing arts to anyone willing to learn. 'train list' to see what I offer.
        choices:
          - text: How does training work?
            next: training_info
          - text: Why teenagers?
            next: about_hospital
          - text: Goodbye.
            next: farewell
      training_info:
        text: "'train list' shows healing prayers and sciences. 'train learn <ability>' spends a skill point. Doctors patch up
          everyone — even themselves, eventually."
        choices:
          - text: Goodbye.
            next: farewell
      about_hospital:
        text: Teenagers are the only people in Auringold who can be both 'aging' and 'infirmed' on the same afternoon. It's a
          real challenge medically. Mostly we hand out juice boxes.
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Drink water! Eat a snack! You're doing great.
    image: 17e0d3bf6c7e0b5a34646cf72a2c6b6953b6eccbb390701d0babcc10de582319.png
  sneaky_pete:
    name: Sneaky Pete the Pirate Captain
    spawns:
      - room: misfit_island
    tier: weak
    level: 3
    description: A wiry pirate in a paper tricorne, an eyepatch worn over the wrong eye depending on the day, and an
      enormous grin full of every tooth he ever brushed.
    dialogue:
      root:
        text: Arr! Welcome to Misfit Island, the only respectable place in Pixel Haven for a proper rogue. I'm Sneaky Pete, and
          I teach the fine art of being where the watchmen aren't. 'train list' to learn the trade.
        choices:
          - text: How does training work?
            next: training_info
          - text: Why misfits?
            next: about_misfits
          - text: Goodbye.
            next: farewell
      training_info:
        text: "'train list' shows my tricks. 'train learn <skill>' spends a skill point. Rogues sneak, pick, backstab, and
          occasionally rescue lost cats — for a fee."
        choices:
          - text: Goodbye.
            next: farewell
      about_misfits:
        text: Every kid feels like a misfit eventually. This little island is where their dreams of being a daring outlaw came
          to live. We're all misfits here, and that makes us a fine crew.
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Watch your purse — I'm just being friendly!
    image: dd5209997ab2d09585516e7d6105ca7a4f3284b2fdd63dd15ee56a72f974eee1.png
  ranger_pinecone:
    name: Ranger Pinecone
    spawns:
      - room: the_sports_metroplex
    tier: weak
    level: 3
    description: A weather-tanned ranger in a many-pocketed khaki vest, with a bandana around her neck and a butterfly net
      slung across her back like a longbow. Twigs and grass cling to her boots.
    dialogue:
      root:
        text: Hey there! Pixel Haven's got more outdoors than you'd think — fields, river, woods — and I teach the explorers who
          go play in 'em. 'train list' to see what I've got.
        choices:
          - text: How does training work?
            next: training_info
          - text: Goodbye.
            next: farewell
      training_info:
        text: "'train list' shows tracking, marking, and a few critter calls. 'train learn <ability>' spends a skill point.
          Explorers see what other folk miss — and they keep their pets fed."
        choices:
          - text: Goodbye.
            next: farewell
      farewell:
        text: Sunscreen! Water! And remember the trail markers!
    image: dba8886e5d78e5ca09a94d2e2319626177e78fc710149ac66d5d4e3da4a3f9be.png
