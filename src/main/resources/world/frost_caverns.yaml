quests:
  the_frozen_ward:
    name: The Frozen Ward
    description: Hermit Jorek, a former Scholars' Guild member, needs the ancient frost ward retrieved from the frozen vault
      deep in the Frost Caverns. This ward is part of the old protective network that once safeguarded the Celestial
      Peak.
    giver: hermit_jorek
    objectives:
      - type: collect
        targetKey: ancient_frost_ward
        count: 1
        description: Retrieve the ancient frost ward from the frozen vault
    rewards:
      xp: 1200
      gold: 60
rooms:
  frozen_pass:
    title: Frost Caverns — Frozen Pass
    description: Beyond the highland summit the trail descends into a narrow pass where the temperature drops sharply. Ice
      coats the rock walls and the ground is treacherous. The entrance to a vast cavern system opens in the cliff face
      ahead to the north — a dark mouth rimmed with icicles. Hermit Jorek has pitched a weather-beaten tent near the
      entrance. The highland summit is back to the south.
    exits:
      s: highland_trails:summit_approach
      n: ice_shelf
    image: 035f2c4811b70d3928b6e281400a75c5e9730d37a8db8a916919c8e8b5c0f5a0.jpg
  ice_shelf:
    title: Ice Shelf
    description: A broad ledge of ice-covered rock inside the cavern entrance. Frost bats hang from the ceiling in clusters,
      dropping to attack anything that disturbs them. The daylight from the entrance behind you fades quickly. The
      frozen pass is back to the south; the crystal grotto glitters ahead to the east; a frozen stream lies to the
      north.
    exits:
      s: frozen_pass
      e: crystal_grotto
      n: frozen_stream
    image: 4d6107218febd45ce2cc8af61af7e3e512d0b07951e59b1b7e8c90cd73464816.jpg
  crystal_grotto:
    title: Crystal Grotto
    description: A natural chamber where mineral-rich water has frozen into spectacular crystal formations. The ice here is
      not white but deep blue, shot through with veins of silver and pale gold. Glacial ore is visible in the exposed
      crystal faces. The beauty is extraordinary — and entirely indifferent to your survival. The ice shelf is back to
      the west.
    exits:
      w: ice_shelf
    image: 9550d9a5e099283da9a0cc7e65d04b711fbaeceb5550811f94c6f313129186ad.jpg
  frozen_stream:
    title: Frozen Stream
    description: An underground river, frozen solid, its surface rippled as though the water stopped mid-flow. The ice is
      thick enough to walk on. Strange shapes are visible deep in the ice — preserved creatures, objects, and what might
      be architecture from a much older time. An ice bridge crosses a chasm to the east. The ice shelf is back to the
      south.
    exits:
      s: ice_shelf
      e: ice_bridge
    image: 9440a436981e4f5623dc57e6afe6dc80d4f355b7e09daa6df6663ce60cfcceae.jpg
  ice_bridge:
    title: Ice Bridge
    description: A natural bridge of compacted ice spanning a deep crevasse. The drop below is invisible — the darkness
      swallows light. The bridge is stable but the footing is treacherous. On the far side, the cavern system opens into
      wider spaces. The frozen stream is back to the west; the glacial chamber is ahead to the north.
    exits:
      w: frozen_stream
      n: glacial_chamber
    image: 837b81df762326919e98f023f37aec25cb442da7b2fb9ce115d420a0719f4cd7.jpg
  glacial_chamber:
    title: Glacial Chamber
    description: "A vast cavern of blue-white ice, its ceiling lost in frozen mist. Frost elementals coalesce from the
      ambient cold, their forms shifting and unstable. The chamber branches: a spider nest lies to the east, an ancient
      shrine to the west, and a frozen gallery descends to the north. The ice bridge is back south."
    exits:
      s: ice_bridge
      e: frost_spider_nest
      w: ancient_ice_shrine
      n: frozen_gallery
    image: f708050922e1acbc36cb5c3aae8e8b47752be93a38f382be8d8b6403b2fed900.jpg
  frost_spider_nest:
    title: Frost Spider Nest
    description: A side cavern choked with frozen webs of incredible density and complexity. Ice spiders move through their
      crystalline web network with fluid confidence, their bodies translucent and hard to see against the ice. Prey
      items — frozen solid — hang at intervals throughout the web. The glacial chamber is back to the west.
    exits:
      w: glacial_chamber
    image: aa3f445e29c67ea230607d1579163d801044154d6e634a853f164d1044c9b371.jpg
  ancient_ice_shrine:
    title: Ancient Ice Shrine
    description: A carved chamber predating the natural cavern system — someone built this space deliberately, long ago. The
      walls bear carved geometric patterns similar to those found on the ancient seals elsewhere in Eryndal. A glacial
      sentinel stands motionless before an altar of blue ice, guarding whatever purpose this place once served. The
      glacial chamber is back east.
    exits:
      e: glacial_chamber
    image: e3d76bfc63d20f5b4592b7937ddd3ada2b99a63e4b7486db2ee77e5bf468a2d5.jpg
  frozen_gallery:
    title: Frozen Gallery
    description: A long, descending passage where the ice forms natural columns and curtains of extraordinary beauty. The
      temperature drops with every step north. The walls narrow and the ceiling lowers. Something large has scraped
      along the walls ahead — deep gouges in the ice, wide apart. The glacial chamber is back south; the wyrm's approach
      lies to the north.
    exits:
      s: glacial_chamber
      n: wyrm_approach
    image: e834f3c1012d768367a4e4546d1fb313ce9cf30ce717ab57628a8ef259882500.jpg
  wyrm_approach:
    title: Wyrm's Approach
    description: The passage widens into a natural antechamber before the deepest cavern. The walls are scored with massive
      claw marks and patches of ice have been melted and refrozen repeatedly — the frost wyrm's territory is
      unmistakable. The air itself feels hostile, the cold so intense it burns. The den opens ahead to the north; the
      gallery is back south.
    exits:
      s: frozen_gallery
      n: frost_wyrms_den
    image: 5bc592af68369d072ec7468faa57fc54e66c0442cc4598158d1b4135071cb67a.jpg
  frost_wyrms_den:
    title: Frost Wyrm's Den
    description: "The deepest chamber in the cavern system: an enormous natural cathedral of ice where the Frost Wyrm makes
      its lair. The creature is part of the glacier itself — when motionless, it is indistinguishable from the
      surrounding ice. Bones of previous challengers are frozen into the floor. A passage in the far wall leads to the
      frozen vault beyond."
    exits:
      s: wyrm_approach
      e: frozen_vault
    image: cc22ad13e7882daff81a39ae076df808905d5645b8ed7c80b950583e65fb2acf.jpg
  frozen_vault:
    title: Frozen Vault
    description: A sealed chamber at the absolute deepest point of the cavern system. The construction is deliberate —
      carved stone beneath the ice, ward-glyphs cut into every surface, and a stone pedestal at the center bearing an
      ancient frost ward tablet. This room was built to preserve something important. It has succeeded.
    features:
      ward_pedestal:
        type: CONTAINER
        displayName: a stone pedestal
        keyword: pedestal
        initialState: open
        resetWithZone: false
        items:
          - ancient_frost_ward
    exits:
      w: frost_wyrms_den
    image: 51bba94cb45d36ef1a72e1ccefec2381249c43e2c8481fd3fd7abc51abfb572b.jpg
  ice_passage:
    title: Ice Passage
    description: Beyond the frozen vault, the passage continues deeper into the mountain. The ward-glyphs carved into the
      walls glow with increasing intensity — blue shifting to white — and the air grows warmer despite the ice.
      Something powerful lies ahead. The ancient ice that once sealed this passage has cracked and fallen away, leaving
      the way north open for the first time in centuries. The vault is back to the south.
    exits:
      s: frozen_vault
      n: celestial_peak:mountain_passage
    image: 998581047966908aae7adb273c4170a547b0927395c4e23d8aa093e2cc512406.jpg
graphical: true
