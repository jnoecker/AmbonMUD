    room: frost_wyrms_den
    tier: boss
    level: 9
    respawnSeconds: 900
    xpReward: 320
    goldMin: 110
    goldMax: 220
    behavior:
      template: aggro_guard
    drops:
      - itemId: frost_fang
        chance: 0.45
      - itemId: glacial_plate
        chance: 0.35
    dialogue:
      root:
        text: "The cavern shakes. Ice cracks and falls in sheets from the ceiling as an enormous wyrm of crystallised ice
          unfolds from the far wall — it was there the entire time, motionless, indistinguishable from the glacier. Its
          eyes open: deep blue, ancient, and utterly cold."
        choices:
          - text: Fight.
            next: farewell
      farewell:
        text: The temperature plummets. Frost forms on your weapon.
    image: 1899095509e65a3fa3221e9a5c3edd8e161d4c4495517dc338acfc2bb919a4c9.png
  hermit_jorek:
    name: Hermit Jorek
    room: frozen_pass
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - the_frozen_ward
    dialogue:
      root:
        text: Ha! A visitor! Don't see many up here. I'm Jorek — used to be Scholars' Guild before I got fed up with committees.
          Came up here to study the old wards. There's one in the frozen vault deep inside these caverns — a frost ward,
          part of the original protective network. I need it retrieved. The sentinel guards the path and the wyrm guards
          the depths. Interested?
        choices:
          - text: I'll find the ward.
            next: quest_accept
          - text: Tell me about the wards.
            next: ward_info
          - text: Goodbye.
            next: farewell
      ward_info:
        text: The old order placed wards across the land — seals, tablets, protective enchantments. They were holding something
          in check at the Celestial Peak. The wards are failing. This frost ward is one of the last intact ones. If we
          can study it, we might understand what they were protecting against.
        choices:
          - text: I'll get the ward.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Excellent. The vault is in the deepest part of the caverns, past the glacial chamber and the wyrm's den. The
          ancient frost ward is on a pedestal in the frozen vault. Be careful — everything in there has been preserved
          by the cold, including the things that guard it.
        choices:
          - text: I'll return with it.
            next: farewell
      farewell:
        text: Bundle up. It gets worse the deeper you go.
    image: 2ac8b99c0d09943f6312aebfaeeb261dd78bb274c35d89d379b26fef65864848.png
