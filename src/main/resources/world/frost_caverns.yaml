items:
  frost_crystal:
    displayName: a frost crystal
    keyword: crystal
    description: A perfectly clear crystal of pure ice that doesn't melt at room temperature. The cold it radiates is
      magical in origin.
    basePrice: 20
    image: 9856343d3efdce9085a88ae79ebef3c2a19fff04d1b3fc91ec0d1f029f5073b5.png
  spider_silk_shard:
    displayName: a shard of ice-spider silk
    keyword: silk
    description: A rigid strand of silk frozen solid by the ice spider that spun it. Crafters use it in enchanted thread.
    basePrice: 15
    image: 8215e4c9642047ee06ed74d1f5c925f68e2859e0dd0c6510581342c5d196547a.png
  ancient_frost_ward:
    displayName: an ancient frost ward
    keyword: ward
    description: A stone tablet inscribed with ward-glyphs that radiate intense cold. Part of the old protective network
      mentioned in the Scholars' Guild texts. Hermit Jorek has been searching for this.
    basePrice: 0
    image: 441f294560e934729089b08e25c21f362eec9c93ed9b70d1864d440948380056.png
  frost_fang:
    displayName: the Frost Wyrm's fang
    keyword: fang
    slot: weapon
    damage: 13
    basePrice: 450
    description: A dagger-length fang of crystallised ice, sharp as steel and colder than anything natural. Torn from the
      Frost Wyrm's jaw.
    image: f54e72a9aad4c5b3f70137091ec38457c2e447732e90a083cf0e5a2390f2bca4.png
  glacial_plate:
    displayName: glacial plate armour
    keyword: plate
    slot: body
    armor: 8
    basePrice: 470
    description: Armour forged from compressed glacial ice and bound with silver wire. It never melts and provides
      extraordinary protection.
    image: 5214aaba5bb33440ccd29213fbb274b80523bc14378775f336c53aeb8cdb8377.png
  glacial_ore:
    displayName: a chunk of glacial ore
    keyword: ore
    description: Dense, blue-veined ore found only in glacial formations. Smiths prize it for frost-resistant alloys.
    basePrice: 28
    image: d9c11a1fe5327d31aac58bfce2abbd33321ce01fd561b25b36f15567b0513b2e.png
