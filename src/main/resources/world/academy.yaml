        text: I can adjust your appearance — hairstyle, coloring, features, build, the works. I can also change your name if you
          fancy a fresh start. Everything I do can be reversed, so there is no need to worry about commitment. Think of
          it as trying on a new outfit, but for your very identity!
        choices:
          - text: Sounds wonderful. Let's begin!
            next: farewell
          - text: I'll think about it and come back.
            next: farewell
      farewell:
        text: Whenever you are ready, just click on me. Everyone deserves to look their best!
