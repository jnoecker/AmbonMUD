      - title: Kvarcgagap - Footprints in Emberfell
        file: a22985f846a93ff62f6acf9925959dd4c7784899200152084cd9fbe9645bd33c.mp3
        durationSeconds: 202
        cost: 1
        artist: TRADITIONAL
        description: Up-tempo Fantasy Bard Song about Kvarcgagap, the Shining Quartz Void
        lyrics:
          - Kvarcgagap came first
          - When Ambon was young
          - He moved like quicksilver
          - Through bedrock and lung
          - He wore no fixed face
          - Just opal and shine
          - He carved out the deep
          - And seeded the mines
