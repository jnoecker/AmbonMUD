    mobId: puzzlewright
    question: 'The Puzzlewright grins its stony grin and gestures to the inscription carved into the tower wall. It reads:
      "I have cities, but no houses live there. I have mountains, but no trees grow there. I have water, but no fish
      swim there. I have roads, but no travelers walk there. What am I?"'
    answer: map
    acceptableAnswers:
      - a map
      - maps
    reward:
      type: give_item
      itemId: puzzle_key
    successMessage: The Puzzlewright erupts in delighted laughter, scattering small chips of stone. "YES! A map, of course!
      You adventurers always overlook the obvious!" A crystalline key materializes in the air before you, solidifying
      from pure insight, and drops into your hands.
    failMessage: The Puzzlewright tilts its head and clicks its stone tongue. "Hmm, not quite! Think carefully — what has
      all those things, but none of the life? Try again!"
    cooldownMs: 0
dungeon:
  name: academy
  description: A shifting labyrinth beneath the Academy where restless undead and forgotten horrors take physical form.
    Each expedition is different — the corridors rearrange, the creatures change, and the rewards vary.
  minLevel: 1
  roomCountMin: 4
  roomCountMax: 8
  portalRoom: catacombs
  roomTemplates:
    entrance:
      - title: Catacomb Threshold
        description: Cracked flagstones give way to packed earth. The air is thick and damp, heavy with the smell of mildew and
          old stone. Flickering torches in rusted sconces light the way forward.
        image: 6d2ca52a2d8c1432e3f423b2b7d7cf0fdb4022eae3378960ac286d0c9a797973.jpg
      - title: The Descending Stair
        description: A spiral staircase descends into shifting darkness. Each step is worn smooth by centuries of use. The walls
          are slick with condensation, and the air grows colder with each turn.
        image: 5e7a63fd8e52ad6c253c4e748cf28edd83901d880fb9d10c43f04ac7adcb3cd1.jpg
    corridor:
      - title: The Crumbling Passage
        description: A narrow corridor whose walls are cracked and crumbling, revealing older stonework beneath. Iron torch
          brackets line the walls at uneven intervals, some still holding guttering flames.
        image: f0144a81a7ff7da47becddabbf27f3e3f538797d1121b37ea93691d99cd091c8.jpg
      - title: The Bone-Lined Hall
        description: Skulls and femurs are set into the walls in grim geometric patterns — the ancient burial customs of some
          forgotten order. The air smells of dust and dry decay.
        image: d36936d6feef356911ff6af630c2c59af86759026b8046c76e914edde24b2de5.jpg
      - title: The Echoing Corridor
        description: A long passage where every footstep echoes back threefold. The stone floor is worn into shallow grooves by
          the passage of countless feet over the centuries. Water drips somewhere in the darkness ahead.
        image: c1c62c1e3407ade77cb844aa0a034cecff72b036a3673adca44ef094202d6567.jpg
    chamber:
      - title: The Guard Barracks
        description: Rows of stone bunks line the walls of this underground chamber, their occupants long since turned to dust.
          Rusted weapons and rotting leather gear are scattered across the floor. Something stirs in the shadows.
        image: 9b8ec0cc6605aed1b97902b82725e9b8acaec601a5c7fd92d3a40dc8dd6f4174.jpg
      - title: The Collapsed Crypt
        description: Half the ceiling has caved in here, letting roots dangle through the rubble from the world above. Broken
          sarcophagi spill their contents across the floor — bones, grave goods, and things that should have stayed
          buried.
        image: 18999efb7e0514ebaf09c238827072bf31d297e8336456eca674cd7b13c7e667.jpg
      - title: The Ritual Chamber
        description: Arcane circles are etched into the stone floor, still faintly glowing with residual power. Shattered
          alchemical equipment lines the workbenches, and something has made a nest of old scrolls in the corner.
        image: 57c79182787144ea9d3ab8cfa404558c42ad8ba0a4411d4d9dcb4866e8e538e8.jpg
    treasure:
      - title: The Vault
        description: A reinforced chamber whose iron door has been forced open from the inside. Overturned strongboxes and
          scattered coins litter the floor. Among the mundane debris, genuine treasures glint in the torchlight.
        image: 663dbd47e36b30b6475b1ca374d5585add552da21c2b86225062a12fc4188444.jpg
    boss:
      - title: The Sunken Hall
        description: An enormous underground hall where the floor drops away into stagnant black water. A single stone platform
          rises from the depths at the center, connected by narrow bridges of crumbling masonry. Something ancient and
          powerful waits here — the source of the catacombs' darkest horrors.
        image: ed4dfe1fe77de05671d3dbf165b3e4fdda350aa797a0dc584d84f49d111e0035.jpg
      - title: The Fallen Headmaster's Study
        description: A twisted mirror of the Academy above — desks overturned, bookshelves toppled, and the walls covered in mad
          scribblings. At the headmaster's desk sits a figure in rotting robes, its hollow eyes burning with undying
          malice.
        image: 8b6422fabe5913c7d2a4dd40a5c4bf1fb446b8283b372a516251d5e2585d57c2.jpg
  mobPools:
    common:
      - skeleton_warrior
      - shadow_slime
    elite:
      - wraith
    boss:
      - fallen_champion
  lootTables:
    normal:
      mobDrops:
        - healing_potion
        - spider_silk
        - iron_ore
      completionRewards:
        - warding_pendant
        - hearty_ration
    hard:
      mobDrops:
        - hearty_ration
        - enchanted_cloth
        - iron_ore
      completionRewards:
        - shadow_cloak
        - elixir_of_clarity
  image: 1517e48dcd7371bf37569fe3c0256a18ae150a769a48576387d68d1a281cc658.jpg
