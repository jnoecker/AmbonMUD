          - She bore the storm in silence
          - Each child a bright-tongued spark
          - Alive beneath her heartbeat
          - Gone out inside the dark
          - Aineroia, mother of ash and gold
          - Aineroia, hear what the graves have told
          - Phoenix, dragon, faerie light
          - Carry them home through the night
          - Aineroia, grief turned holy flame
          - Aineroia, the dead learned names
          - She painted stone with wonder
