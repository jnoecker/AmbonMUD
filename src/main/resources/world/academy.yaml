zone: academy
startRoom: academy_gates
rooms:
  academy_gates:
    title: The Academy Gates
    description: >-
      You stand before a towering iron portcullis set into walls of ancient grey stone, flanked by weathered statues of
      forgotten scholars. Torch sconces flicker with steady amber flame, casting long shadows across the flagstone path.
      Above the gate, carved letters spell out THE ACADEMY in deep relief, and ivy creeps along the mortar lines as
      though the building itself has stood for centuries beyond counting.


      A bronze orientation plaque is mounted beside the gate. It reads: "Welcome, new student! Your vitals bar at the
      bottom of the screen shows your health, mana, and gold. The icons along the sidebar open panels for your
      inventory, quests, spellbook, and more. Click on characters and objects to interact with them! Open the chest
      nearby to claim your welcome gift."


      The Grand Hall lies to the south.
    exits:
      s: grand_hall
    features:
      welcome_chest:
        type: CONTAINER
        displayName: a weathered oak chest
        keyword: chest
        initialState: closed
        items:
          - leather_hood
          - healing_potion
    image: 8ee3e1b303bc3821110953178c1b1adeace2b15ecd2f7c03074f395b7bd3b239.jpg
  grand_hall:
    title: The Grand Hall
    description: >-
      A vast rotunda of pale stone rises around you, its vaulted ceiling lost in shadow above. Massive pillars carved
      with arcane runes line the perimeter, and an iron chandelier the size of a wagon wheel hangs from thick chains,
      its dozens of candles filling the hall with warm, unsteady light. Faded banners bearing the Academy's crest — a
      tower wreathed in flame — hang between the columns, stirring in drafts from unseen passages.


      A parchment map pinned to one of the pillars reads: "Navigate using the compass rose or by clicking exits in the
      room description. Use the chat bar to talk with other students — try Say for the room, Gossip for the academy, or
      OOC for out-of-character chat. Click the emote button to express yourself! The Who panel shows other students
      online, and the Friends panel lets you keep track of companions."


      Beneath the eastern arch, a hooded griffin-keeper tends a roost of saddled griffins. A slate beside her reads:
      "Flight master — type 'flights' to see the roosts I can carry you to, then 'fly <name>' (or 'fly <#>') to take
      wing. You can only fly to roosts you've visited yourself, and the fare grows with the distance."


      Paths lead east to the Scholar's Study, west to the Common Room, and south to the Armory. A winding staircase
      climbs upward to the Catacombs. The Academy Gates are back to the north.
    flightMaster: true
    flightMapX: 50.0
    flightMapY: 30.0
    exits:
      n: academy_gates
      e: scholars_study
      w: common_room
      s: armory
      u: catacombs
    image: c27e9e67d23b98f8c2254a47c753905b4ea101a5d839ca2601752b68c51dd215.jpg
  scholars_study:
    title: The Scholar's Study
    description: >-
      A circular chamber lined floor to ceiling with overstuffed bookshelves, their contents ranging from crumbling
      grimoires to neatly bound treatises on the arcane arts. A heavy oak desk dominates the center of the room, covered
      in star charts, ink-stained quills, and a brass astrolabe that turns slowly of its own accord. The air carries the
      scent of old parchment and candle wax.


      A student's guide pinned to the door reads: "Click on Scholar Elara to start a conversation. Dialogue choices
      appear at the bottom — explore all the options to learn the most! Some NPCs offer quests, some offer lore, and
      some just have something interesting to say."


      The Grand Hall is to the west, and the Training Yard lies to the south. A quiet alcove opens to the east, where
      candlelight flickers against gilded shelves — Sister Veshtal, Keeper of the Alcove, welcomes anyone curious about
      the chroniclers who level by recording the world instead of conquering it.
    exits:
      w: grand_hall
      s: training_yard
      e: akathavae_alcove
    image: 8f6e95312493937bdb5d43391a9db948336450c4d3173731b4950b3dfaf0ac64.jpg
    musicBox:
      title: Tessikar of Kaerinlith
      file: 52347048fdeae3029d6d216d559863b6cc7bc43097a1bb71661bb98d6059b8e5.mp3
      durationSeconds: 243
      artist: TRADITIONAL
      description: >-
        A palm-sized walnut-and-brass music box on the desk — a miniature of the great cabinet in the Parlor of
        Borrowed Songs, said to be Tessikar's own travelling model. Type 'musicbox' (or 'mb') to open it, then
        'musicbox play' to wind it up. Its song is yours alone and follows you from room to room until it winds down
        or you 'musicbox stop' it.
      lyrics:
        - Born beyond the veil
        - Where brass sang slow
        - Copper rivers down below
        - He came to Ambon
        - Through his own door
        - Wheels and crystal
        - Spun the floor
        - One amber eye
        - One arm of brass
        - Broad-shouldered, quiet
        - Built to last
        - Not to rule, not to reign
        - Just a bench, and a flame
        - Tessikar, Tessikar, Hammer the sky
        - Tessikar, Tessikar, Make the world fly
        - Kvarcgagap Shined in the deep
        - Tessikar, Tessikar, Kept the dream
  akathavae_alcove:
    title: Alcove of the Akathavae
    description: >-
      A hushed alcove tucked behind the study's tallest shelves, lit by a single ring of candles that never seem to
      burn down. At its heart stands a modest shrine of pale stone: an open book carved so finely that its pages appear
      to turn when watched too long. This is a shrine to the Naraxian Akathavae — the keeper of stories, whose faithful
      give voice to all that would otherwise be forgotten. Pilgrims who forswear violence kneel here and pledge
      themselves as Akathavae, recording the world in their own Arcanum rather than conquering it. Sister Veshtal,
      Keeper of the Alcove, tends the candle ring with ink-stained fingers, glad to answer the questions of the
      curious.


      A small bronze plate at the shrine's base reads: "Speak 'pledge' to give your voice to the Arcanum. What is
      written remains."


      The Scholar's Study lies back to the west.
    akathavaeShrine: true
    exits:
      w: scholars_study
  common_room:
    title: The Common Room
    description: >-
      A broad, low-ceilinged hall warmed by a roaring stone hearth at its center. Long wooden tables are scattered with
      half-finished games of cards and dice, tankards of ale, and platters of bread and cheese. The walls are hung with
      trophies — mounted antlers, rusted swords, and framed certificates of past graduates. A polished bar counter runs
      along the far wall, tended by a stout barkeep who polishes mugs with practiced ease.


      A carved wooden sign behind the bar reads: "Welcome to the Common Room! This is the academy's tavern — check the
      Lottery panel in your sidebar for daily drawings and use the gambling features to try your luck! The Leaderboard
      panel shows how you rank against other students across various categories."


      The Grand Hall is to the east, the Treasury is to the south, the Stylist's Parlor lies to the north, and a
      velvet-curtained doorway to the west breathes faint clockwork music from the Parlor of Borrowed Songs.
    tavern: true
    exits:
      e: grand_hall
      s: treasury
      n: stylist_parlor
      w: song_parlor
    image: 877842311c0643d0e2eb5c616ec94fdfb95e9c73e040e571a6322088fef8897a.jpg
  treasury:
    title: The Treasury
    description: >-
      A squat, heavily fortified chamber behind a door of banded iron. Stone strongboxes line the walls, each bearing a
      different seal, and a massive vault door of dwarven steel dominates the back wall, its surface etched with
      protective wards that glow faintly in the torchlight. A clerk sits behind a reinforced counter, a ledger open
      before him and a set of brass scales at his elbow.


      A brass plaque on the counter reads: "The Treasury safely stores your gold and valuables! Open the Bank panel in
      your sidebar to deposit gold for safekeeping or withdraw it when you need to make purchases. Your savings earn
      interest at the Academy — even while you are away!"


      The Common Room is back to the north.
    bank: true
    exits:
      n: common_room
    image: 8e1951d4cb51556a84131424dd16bf848c5d37963430dad4d2257ac0921e7384.jpg
  armory:
    title: The Armory
    description: >-
      A long stone hall lined with weapon racks and armor stands, each piece gleaming with careful maintenance. Swords,
      axes, maces, and bows hang in neat rows along the walls. Suits of chainmail and leather armor stand at attention
      on wooden mannequins. A broad counter of scarred oak separates the browsing area from the stockroom beyond, where
      crates of supplies are stacked to the ceiling.


      A posted notice on the wall reads: "Click on Quartermaster Bren to browse the shop catalog! To equip purchased
      items, open your Inventory panel and click items to equip them to your character. Your Equipment section shows
      what you're wearing. You can sell items you no longer need back to the shop for gold."


      The Grand Hall is to the north. The Workshop is to the east. The Proving Grounds are to the south.
    exits:
      n: grand_hall
      e: workshop
      s: proving_grounds
    image: e7add36525e558c28de111b84175d7e6eee980b3fa32555d06b47789ec692c14.jpg
  training_yard:
    title: The Training Yard
    terrain: outside
    description: >-
      An open-air courtyard paved with worn flagstones, surrounded by high walls scarred with blade marks and scorch
      stains from countless practice sessions. Straw-stuffed training dummies stand in rows, many bearing fresh cuts and
      dents. A raised wooden platform at the center serves as the instructor's stage, and racks of blunted practice
      weapons line the perimeter. The air smells of sweat, iron, and the faint tang of spent magic.


      A training manual posted on the wall reads: "Click on Instructor Valence to open the Training panel! Choose a
      class to unlock, then learn abilities. Drag learned abilities from your Spellbook panel to the action bar at the
      bottom of your screen for quick access. Each ability has a cooldown after use — watch the timer on the button.
      Abilities cost mana, shown in your vitals bar."


      Past the weapon racks, a gate in the south wall opens onto a timber landing on the Academy canal, where a ferryman
      waits beside his boat. "Fixed routes, fixed fares," he grunts. "Type 'voyages' to see where I sail, then
      'sail <name>' to board."


      The Scholar's Study is to the north, and the Riddle Tower is to the south.
    boatDock: true
    boatMapX: 44.0
    boatMapY: 35.0
    boatRoutes:
      - to: herb_garden
        price: 30
      - to: proving_grounds
        price: 45
    exits:
      n: scholars_study
      s: riddle_tower
    image: 077a12b734be6030818f2425ee256e911d774b0c0d5646a5f34885c449bb263f.jpg
  workshop:
    title: The Workshop
    description: >-
      A cluttered workroom thick with the smell of hot metal and alchemical reagents. Sturdy workbenches line the walls,
      covered with hammers, tongs, mortar and pestle sets, and half-finished projects. A brick forge glows in one
      corner, its bellows operated by an ingenious foot-pedal mechanism. Shelves of bottled substances in every color
      catch the firelight, and a stained recipe board hangs above the main bench.


      A workshop guide pinned to the wall reads: "Open the Crafting panel in your sidebar to view available recipes!
      You'll need materials from the Herb Garden to the south. This room has a workbench — crafting here gives a bonus
      to certain recipes. Your crafting and gathering skill levels are also shown in the Crafting panel."


      The Armory is to the west, and the Herb Garden is to the south.
    station: alchemy_table
    exits:
      w: armory
      s: herb_garden
    image: 51ae5e51455a1b3f06ba14046134f2df812d411d3fded771ad4e5c34bf9dfa5a.jpg
  herb_garden:
    title: The Herb Garden
    terrain: forest
    description: >-
      A walled garden open to the sky, where medicinal herbs and rare plants grow in carefully tended beds separated by
      gravel paths. Trellises of climbing ivy and flowering vines partition the space into alcoves, and a small fountain
      burbles at the center. Spider webs glisten with morning dew between the hedgerows, and veins of raw iron ore push
      through the earth along the garden's stone border, exposed by years of erosion.


      A garden sign reads: "This is a gathering area! Look for resource nodes highlighted in the room — the spider webs
      yield spider silk, and the ore veins yield raw materials. Click on them or use the Crafting panel to see nearby
      nodes and gather materials. Then head north to the Workshop to craft something!"


      A mossy stair at the garden's edge drops to a stone quay where the Academy canal slips past. A weathered punt is
      tied up, ready to carry you along its fixed routes — 'voyages' lists the fares, 'sail <name>' casts off.


      The Workshop is back to the north.
    boatDock: true
    boatMapX: 28.0
    boatMapY: 42.0
    boatRoutes:
      - to: training_yard
        price: 30
      - to: proving_grounds
        price: 60
    exits:
      n: workshop
    image: 977dd88e634b8fa228517e84cf5a2ff105b5c9397f91317e41bb1f7be1d8e715.jpg
  proving_grounds:
    title: The Proving Grounds
    terrain: outside
    description: >-
      A broad, fenced enclosure of packed earth and sparse grass where the Academy's combat trials take place.
      Flickering wisps of pale light drift aimlessly through the air. Dark slimes ooze along the ground, leaving
      glistening trails. Small, bat-winged imps cackle from their perches on the fence posts. The ground is pocked with
      craters and scorch marks from previous encounters.


      A safety notice on the fence reads: "Welcome to the Proving Grounds! Click on a hostile creature to target it,
      then use abilities from your action bar to engage in combat. Watch the combat log for battle updates, and keep an
      eye on your health in the vitals bar. Use consumable items from your inventory if you need healing. If things get
      dangerous, you can always flee! Defeated creatures may drop useful items — check your inventory after combat."


      Someone has dropped a healing potion on the ground near the gate.


      A weathered griffin-keeper has staked a roost beside the gate, his griffins preening between trials. "Visited the
      Grand Hall or the Throne Room?" he calls. "Type 'flights' and I'll wing you straight there."


      Where the proving fields meet the Academy canal, a low jetty juts into the water and a ferrywoman leans on her
      pole. "Boats run a fixed circuit, no exploring required," she says. "Type 'voyages' to see my fares, then
      'sail <name>' to ride."


      The Armory is to the north. The Riddle Tower is to the east. The Throne Room lies to the south.
    flightMaster: true
    flightMapX: 37.0
    flightMapY: 58.0
    boatDock: true
    boatMapX: 37.0
    boatMapY: 58.0
    boatRoutes:
      - to: herb_garden
        price: 60
      - to: training_yard
        price: 45
    exits:
      n: armory
      e: riddle_tower
      s: throne_room
    image: eded104012c51ec31eb3e0c3590d175f9894fd39976170a25b88df1a41bac4ec.jpg
  riddle_tower:
    title: The Riddle Tower
    description: >-
      A narrow, cylindrical tower room with walls of ancient grey stone, covered in faded inscriptions and carved
      symbols that seem to shift when viewed from the corner of your eye. The floor is a mosaic depicting a great battle
      between scholars and dark forces. At the center, a stone gargoyle perches on a pedestal, its stony features frozen
      in an expression of amused cunning. An old riddle is carved into the wall behind it.


      A student's note stuck to the door reads: "Some challenges at the Academy are puzzles, not fights! Read the riddle
      carefully and submit your answer through the dialogue that appears. Correct answers earn rewards. This one unlocks
      the door to the south!"


      A heavy door of ironbound oak blocks the passage to the south, secured by an elaborate lock that glimmers with
      enchantment.


      The Proving Grounds are to the west, and the Training Yard is to the north.
    exits:
      n: training_yard
      w: proving_grounds
      s:
        to: secret_library
        door:
          initialState: locked
          keyItemId: puzzle_key
          keyConsumed: true
    image: 65ff01b1d4c6bf3cb10c9e29a0874cff3919255792cdf33d48ae579dbd9fa481.jpg
  secret_library:
    title: The Secret Library
    description: >-
      A hushed, reverent chamber hidden behind the tower's enchanted door. Towering shelves of leather-bound tomes
      stretch into the shadows overhead, their spines marked with gilt lettering in a dozen languages. A reading alcove
      in the corner holds a worn leather armchair and a brass oil lamp that burns with a steady, unwavering flame. The
      air is thick with the scent of aged parchment and old magic.


      An orientation guide rests on the reading desk, covering advanced Academy features: "Congratulations on solving
      the puzzle! As you continue your adventures beyond the Academy, you'll discover more features through the sidebar
      panels: Housing lets you own a personal dwelling. The Auction panel connects you to a global marketplace. Mail
      lets you send letters to other students. Trading enables face-to-face item exchanges. Pets let you bond with a
      creature companion. And Factions track your reputation with the various powers of the realm. Explore every panel —
      there's always more to discover!"


      The Riddle Tower is back to the north.
    exits:
      n: riddle_tower
    features:
      ancient_bookcase:
        type: CONTAINER
        displayName: a dusty ancient bookcase
        keyword: bookcase
        initialState: closed
        items:
          - elixir_of_clarity
          - enchanted_cloth
    image: e981cc7168f50dffb6e100ed80877ddda2fe2ce1485983d41fa9053cea8a50d0.jpg
  throne_room:
    title: The Throne Room
    description: >-
      The ceremonial heart of the Academy — a vast hall with a vaulted ceiling supported by massive stone columns. Faded
      tapestries depicting the Academy's history hang between iron torch brackets. At the far end, an ornate stone
      throne sits upon a raised dais, its armrests carved with rearing griffins. But between you and the throne, the
      shadows thicken unnaturally. Something lurks here — the Academy's ultimate test.


      A plaque near the entrance reads: "The Throne Room is where your journey culminates! After defeating challenges,
      check the Quest panel to turn in completed quests. Open the Character panel to review your stats, and check the
      Achievements panel for milestones you've reached. The Prestige panel shows advanced progression options for
      experienced students."


      A battered treasure chest sits near the base of the throne.


      Tucked in an alcove by the entrance, a quiet griffin-keeper minds a lone saddled griffin. A faded card hung from
      its reins reads: "Flight master — 'flights' to list roosts, 'fly <name>' to depart. The longer the journey, the
      heavier the fare."


      The Proving Grounds are back to the north.
    flightMaster: true
    flightMapX: 55.0
    flightMapY: 81.0
    exits:
      n: proving_grounds
    features:
      treasure_chest:
        type: CONTAINER
        displayName: a battered iron-bound chest
        keyword: chest
        initialState: closed
        items:
          - academy_banner
          - hearty_ration
    image: 1d3695605145a72bd76d88d23cf8514ab86dd59061231e632e13261d3fbbe534.jpg
  catacombs:
    title: The Catacombs
    terrain: underground
    description: >-
      A winding staircase descends from the Grand Hall into a damp, torch-lit passage carved from the bedrock beneath
      the Academy. The walls are lined with alcoves holding ancient stone sarcophagi, their lids cracked and displaced.
      The air is cold and carries the faint echo of distant, inhuman sounds. A shimmering portal arch stands against the
      far wall, its surface rippling like disturbed water, leading into the unknown depths below.


      A bulletin board by the stairs reads: "Dungeons are instanced adventures — open the Dungeon panel in your sidebar
      to see available dungeons and start a run! For the best experience, bring friends — use the Group panel to invite
      other students and tackle dungeons together. The Guild panel lets you form permanent organizations with shared
      chat, a roster, and a guild hall. Strength in numbers!"


      The Grand Hall is back down the stairs.
    dungeon: true
    exits:
      d: grand_hall
    image: 457b0f5c083d127e4221f29c7130f52b3ed7e463d05134ee365b8dbd044f851e.jpg
  stylist_parlor:
    title: The Stylist's Parlor
    stylist: true
    description: >-
      A well-appointed chamber of polished mirrors and soft lamplight. Tall looking glasses in ornate frames line the
      walls, each reflecting a subtly different version of whoever stands before it — here a change of hairstyle, there
      an altered complexion, in another a different set of features entirely. A velvet-cushioned chair sits before the
      largest mirror, and shelves of cosmetic implements, dyes, and enchanted scissors gleam nearby. The air smells
      faintly of rosewater and sandalwood.


      A gilded card on the vanity reads: "Welcome to the Stylist's Parlor! Here you can customize your character's
      appearance, change your name, and adjust how the world sees you. Click on Stylist Maren to begin — she can help
      you look exactly the way you want. Don't worry, changes can always be undone!"


      The Common Room is back to the south.
    exits:
      s: common_room
    image: fe897d386ee1ff382d9b4a5d268504b10a5c9cc765c4addc3f6c0d47212b3342.jpg
  song_parlor:
    title: The Parlor of Borrowed Songs
    description: >-
      A velvet-hushed listening room off the Common Room, its walls quilted in tapestry so that no note escapes to
      trouble the hearth. Filling half the parlor stands a giant music-box of walnut, brass, and dreamglass — an
      invention of Tessikar the Springwright — its pinned brass cylinder turning behind a crystal pane above a tiny
      stage of shuttered doors. Fed a coin, the doors swing open on cuckoo-clock hinges and a troupe of clockwork
      musicians glides out on rails: fiddlers no taller than a teacup, a bellows-chested singer with a painted
      porcelain face, a drummer whose sticks are wound springs. Together they perform the great ballads of Ambon — the
      faerie-song of Aineroia, the mother goddess; the footprint-ballad of Kvarcgagap, the shining quartz void; the
      music-box ballad of Tessikar the Springwright; and a call-and-response shanty begging fair passage of Maelsang,
      the tide between worlds. A few alcoves on the little stage still wait dark and empty, freshly chalked for songs
      not yet pressed. A hand-lettered placard is bolted to the cabinet ('read placard').


      The Common Room is back to the east.
    exits:
      e: common_room
    features:
      jukebox_placard:
        type: SIGN
        displayName: a hand-lettered placard bolted to the cabinet
        keyword: placard
        text: THE BORROWED SONG. Feed the jukebox a few coins and it plays your chosen song for EVERYONE in the parlor,
          not just you. Type 'jukebox' (or 'jb') to read the songbook, then 'jukebox play <number>' to pay for a track.
          While a song plays the jukebox is busy — it won't take another coin until the tune ends, after which the
          parlor drifts back to its usual quiet. Web players can click the Jukebox badge to browse and watch the
          countdown. The clockwork singer mouths every verse as the cylinder turns, so even visitors who keep their
          sound off can follow the song in the room text. Tonight's songbook holds four pressed cylinders — Aineroia
          the mother goddess, Kvarcgagap the shining quartz void, Tessikar the Springwright, and Maelsang of the tides
          — and the songbook grows as new cylinders are pressed. The saddest verses are about real people, some of
          whom still visit.
    jukebox:
      - title: Aineroia, Faerie Queen
