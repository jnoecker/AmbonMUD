mobs:
  headmaster_aldric:
    name: Headmaster Aldric
    spawns:
      - room: academy_gates
    tier: standard
    level: 10
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - grand_tour
    dialogue:
      root:
        text: A tall, silver-haired man in deep blue robes regards you with keen, appraising eyes. A heavy medallion bearing the
          Academy's seal hangs at his chest, and his staff — iron-shod and rune-carved — rests in the crook of his arm.
          "Welcome to the Academy, student. I am Headmaster Aldric, keeper of this institution. You have arrived at a
          fortuitous time — we have much to show you. Shall I explain how the Academy works, or would you prefer a quest
          to guide your exploration?"
        choices:
          - text: Tell me about the quest!
            next: quest_info
          - text: How does the Academy work?
            next: how_it_works
          - text: I'll explore on my own, thanks.
            next: farewell
      quest_info:
        text: Very well. I call it 'The Grand Tour.' As you explore the Academy, you will encounter various creatures — wisps,
          sprites, slimes, and worse. Some carry Arcane Fragments, crystallized shards of raw magical energy. Collect
          three and return them to me for a handsome reward. You can track your progress in the Quest panel on your
          sidebar — look for the scroll icon.
        choices:
          - text: I'll get right on it!
            next: farewell
          - text: Any advice for a new student?
            next: advice
      how_it_works:
        text: The Academy is a place of learning for aspiring adventurers — warriors, mages, and all manner of heroes. Every
          room teaches something new. Your vitals bar at the bottom of the screen shows your health, mana, and gold. The
          sidebar panels — those icons along the edge — give you access to your inventory, quest log, spellbook, and
          much more. Click on anyone or anything that catches your eye. The Academy rewards curiosity.
        choices:
          - text: That's helpful. What about the quest?
            next: quest_info
          - text: I think I understand. I'll start exploring!
            next: farewell
      advice:
        text: Of course. Head south to the Grand Hall — it is the heart of the Academy, with paths to every wing. I would
          suggest visiting the Armory first to equip yourself, then the Training Yard to learn some abilities. The
          Proving Grounds are where you will find creatures to practice combat against. And do not overlook the side
          wings — the Common Room to the west has refreshment and entertainment, and the Scholar's Study to the east
          holds fascinating conversations. Every panel in your sidebar has something to discover.
        choices:
          - text: Thanks, Headmaster!
            next: farewell
      farewell:
        text: May your blade stay sharp and your mind sharper. Remember — at the Academy, knowledge is the most powerful weapon
          of all. Off you go!
    image: d7d20725e259a579a098ea0856dae504e860588448e9d570dc079405ad7dc20b.png
  scholar_elara:
    name: Scholar Elara
    spawns:
      - room: scholars_study
    tier: standard
    level: 8
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - scholars_research
    dialogue:
      root:
        text: A slender woman in spectacles and ink-stained robes looks up from a heavy tome, brushing a strand of auburn hair
          from her face. Her desk is buried under scrolls and star charts, and a brass astrolabe spins lazily beside
          her. "Ah, a new student! Welcome to my study. I am Scholar Elara, and I teach the art of discourse and
          diplomacy — vital skills for any adventurer. You are practicing right now, in fact. Shall we continue?"
        choices:
          - text: Tell me about yourself.
            next: about_self
          - text: What can I learn here?
            next: learn_here
          - text: What's south of here?
            next: directions
          - text: I overheard you mention research. What are you working on?
            next: research_inquiry
          - text: Goodbye, Scholar.
            next: farewell
      research_inquiry:
        text: 'Elara hesitates, then leans forward, lowering her voice. "Perceptive of you. I am studying the resonance patterns
          in Arcane Fragments — they may be more than mere magical residue. I need a sample to compare against my notes,
          but the Headmaster keeps the archive key. Would you fetch one for me, then bring your findings to him? He
          should hear of this directly."'
        action: unlock_flag:scholar_research
        choices:
          - text: Of course, I'd be happy to help.
            next: farewell
          - text: I'll think about it.
            next: farewell
      about_self:
        text: I was once a wandering sage, traveling from library to library in search of lost knowledge. I spent years
          cataloging forgotten histories and deciphering ancient scripts. The Headmaster found me poring over
          manuscripts in a ruined archive and offered me a position here. I have been teaching ever since — there is no
          better audience than eager young minds.
        choices:
          - text: That's fascinating. What do you teach?
            next: learn_here
          - text: Do you miss the open road?
            next: miss_road
          - text: Goodbye, Scholar.
            next: farewell
      miss_road:
        text: 'Elara pauses, her gaze drifting to the window. "Sometimes. The road offers freedom — new horizons each day, the
          thrill of discovery around every bend. But here, I have something the road never gave me: students who carry
          my teachings forward into the world. I think that is worth the trade. But enough about me — the Academy has so
          much more to show you! The Training Yard is just south of here."'
        choices:
          - text: I'll head there. Thanks!
            next: farewell
      learn_here:
        text: This study demonstrates the dialogue system. When you click on a character who has something to say, you will see
          a conversation like this one — with choices that branch into different paths. Some conversations lead to
          quests, some to lore, some to hints. Always explore all the options! Every NPC at the Academy has something
          worth hearing.
        choices:
          - text: Good to know. What else is nearby?
            next: directions
          - text: Thanks for the lesson, Scholar.
            next: farewell
      directions:
        text: South of here you will find the Training Yard, where Instructor Valence teaches the combat arts. West returns you
          to the Grand Hall — the Academy's central hub. If you have not visited the Armory yet, I would recommend it.
          Difficult to fight monsters without proper equipment! And should fighting hold no appeal at all, the alcove
          east of my study shelters the shrine of the Akathavae — Sister Veshtal keeps it, and her chroniclers level by
          recording the world rather than conquering it.
        choices:
          - text: I'll check it out.
            next: farewell
      farewell:
        text: Study well, student. And remember — in every conversation, there is something hidden. You just have to ask the
          right questions.
    image: 306a50931d50ea68df08991427009fe9ce847aea2f311164f4a9cab0902aa073.png
  quartermaster_bren:
    name: Quartermaster Bren
    spawns:
      - room: armory
    tier: standard
    level: 5
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: A broad-shouldered man with a scarred jaw and thick forearms leans against the counter, arms folded. A leather
          apron covers his chain shirt, and a ring of keys jingles at his belt. "Welcome to the Armory. I'm
          Quartermaster Bren — I keep this place stocked and the students equipped. Click on me to browse the supply
          catalog. You can also sell things you don't need for some extra gold."
        choices:
          - text: Show me your wares.
            next: farewell
          - text: How does shopping work?
            next: how_shop
          - text: Just looking around.
            next: farewell
      how_shop:
        text: Simple enough. Click on me and the shop panel opens. Items on the left are what I sell — click one to buy it. Your
          inventory panel shows what you are carrying. To equip armor or weapons, open the equipment section and click
          the item you want to wear. You can sell items back to me too, though I only pay half price. A quartermaster
          has expenses, you understand.
        choices:
          - text: Makes sense. Let me browse!
            next: farewell
      farewell:
        text: Good trading. And if you find anything interesting in your travels, I am always buying.
    image: a6bffb59957c7b9cb75c0a0b9a007938e9eb8b0403f87d32a2db7fa28d6e2a0b.png
  instructor_valence:
    name: Instructor Valence
    spawns:
      - room: training_yard
    tier: elite
    level: 10
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: A battle-hardened knight in burnished plate armor stands at attention on the training platform, a longsword
          resting point-down before her. Her eyes are sharp and appraising, and her bearing radiates the confidence of
          someone who has seen a hundred battles and won them all. "Student! I am Instructor Valence, and I teach every
          discipline the Academy offers. Click on me to open the training panel — pick a class, unlock it, and start
          learning abilities. Then drag your new skills to the action bar at the bottom of your screen!"
        choices:
          - text: What classes are available?
            next: classes
          - text: I'd like to start training!
            next: farewell
          - text: Where should I go after training?
            next: after_training
          - text: Maybe later.
            next: farewell
      classes:
        text: Five paths of power! WARRIOR — steel and stamina, the unyielding front line. MAGE — arcane devastation unleashed
          from a distance. CLERIC — healing light that sustains your allies through the darkest trials. ROGUE — shadows
          and precision strikes, ending fights before they begin. RANGER — nature's ally, fighting alongside summoned
          companions. You can unlock multiple classes over time! Start with whatever calls to you. After you unlock a
          class, learn its abilities — they will appear in your Spellbook panel.
        choices:
          - text: Let's begin!
            next: farewell
          - text: Can I learn more than one class?
            next: multiclass
      multiclass:
        text: Absolutely. That is the beauty of the Academy. Unlock as many as you like. Your Spellbook panel shows all learned
          abilities regardless of class. Drag them to your action bar for quick access. Each ability has a cooldown
          after use — watch the timer on the button. Now go forth and train!
        choices:
          - text: On it!
            next: farewell
      after_training:
        text: Once you have learned some abilities, head south to the Proving Grounds! That is where you can practice combat
          against creatures. Remember to equip your gear first — the Armory is north, then west. And keep an eye on your
          health in the vitals bar!
        choices:
          - text: Good advice. Thanks!
            next: farewell
      farewell:
        text: Courage is not the absence of fear — it is the will to act in spite of it. Train well!
    image: be956281462401c1276572bedc906f3f6123987a2d9e77038516e2ae8e507eff.png
  groundskeeper_thorne:
    name: Groundskeeper Thorne
    spawns:
      - room: proving_grounds
    tier: standard
    level: 5
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - creature_roundup
    dialogue:
      root:
        text: A weathered old man in a muddy leather coat trudges over, leaning on a gnarled walking stick. His face is deeply
          lined and tanned from years outdoors, and a ring of iron keys clinks at his hip. "Ah, a student! I'm
          Groundskeeper Thorne. I tend the creatures in the Proving Grounds, but some have gotten... spirited lately.
          The shadow slimes and cave imps are causing trouble. Could you help put them down? Bring me their fangs as
          proof."
        choices:
          - text: I'll help wrangle them!
            next: accepted
          - text: What creatures are here?
            next: creatures
          - text: Not right now.
            next: farewell
      accepted:
        text: Good on you! Just engage the creatures in combat — click on one to target it, then use your abilities from the
          action bar. Collect three beast fangs from the ones you defeat. Keep an eye on the combat log for battle
          details, and don't forget you can use consumable items if your health gets low! Check your Quest panel to
          track your progress.
        choices:
          - text: On it!
            next: farewell
      creatures:
        text: The wandering wisps are harmless little lights — they will drift away from you. But the shadow slimes are
          aggressive — they will attack on sight! And the cave imps are worse. If you get in over your head, you can
          always flee. The wisps and sprites drop Arcane Fragments too, if you are collecting those for the Headmaster's
          quest.
        choices:
          - text: I'll help round them up!
            next: accepted
          - text: Maybe later.
            next: farewell
      farewell:
        text: Be careful with the imps — they bite! And the invisible ones are the worst. ...Don't tell them I said that.
    image: 955cf818c472c71960e9a18f0f6e5d630f2be0013d72e01dd4df69ec53005753.png
  puzzlewright:
    name: the Puzzlewright
    spawns:
      - room: riddle_tower
    tier: standard
    level: 5
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: A stone gargoyle perches on its pedestal, its carved features twisted into an expression of amused cunning. It
          speaks in a voice like tumbling gravel. "Ah, a STUDENT! I do so love students. They always think they know the
          answer. Tell me — do YOU know the answer? Of course you don't. You haven't heard the question yet. Would you
          like to?"
        choices:
          - text: Ask me your riddle!
            next: riddle_hint
          - text: What happens if I answer correctly?
            next: reward_info
          - text: I'll come back later.
            next: farewell
      riddle_hint:
        text: The riddle is inscribed on the wall behind me. Read it carefully! When you think you know the answer, respond
          through the dialogue that appears. I will tell you if you are right. And don't worry — you can try as many
          times as you like. The best riddles deserve patience.
        choices:
          - text: I'll give it a shot.
            next: farewell
      reward_info:
        text: Answer correctly and you will receive a very special key — one that opens the locked door to the south. Behind
          that door lies the Secret Library, full of ancient knowledge and rare treasures. Worth the brain exercise, I
          promise!
        choices:
          - text: Sounds worth it. Let me try the riddle.
            next: farewell
      farewell:
        text: Think carefully! The answer is always simpler than you expect.
    image: 3ca017584a1614014ea4a44816817e01c6149df064c69735810d02fa743b88e6.png
  artificer_wren:
    name: Artificer Wren
    spawns:
      - room: workshop
    tier: weak
    level: 3
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    dialogue:
      root:
        text: A wiry gnome in a soot-stained apron peers up at you through a pair of oversized brass goggles, a smith's hammer
          in one hand and a bubbling flask in the other. Sparks and alchemical fumes trail in her wake as she gestures
          excitedly at the workbenches. "A new crafter! Oh, this is my favorite part! Open the Crafting panel in your
          sidebar — you'll see recipes for things you can make! But you'll need materials first. Head south to the Herb
          Garden to gather some!"
        choices:
          - text: How does crafting work?
            next: how_craft
          - text: What can I make?
            next: what_make
          - text: I'll go gather materials first.
            next: farewell
      how_craft:
        text: First, gather materials — the Herb Garden south of here has spider silk and iron ore. Then come back here and open
          the Crafting panel. Select a recipe, and if you have the right materials, you can craft the item! This room
          has a workbench, which gives a bonus to certain recipes. The Crafting panel also shows your gathering and
          crafting skill levels.
        choices:
          - text: What can I make?
            next: what_make
          - text: Got it! I'll start gathering.
            next: farewell
      what_make:
        text: Right now I have got two recipes ready for beginners! The Warding Pendant is a protective charm — good for
          defense. The Bottled Starlight is a consumable that grants experience. Both need materials from the Herb
          Garden. Gather spider silk and iron ore, then come back and craft away!
        choices:
          - text: I'll go gather materials!
            next: farewell
      farewell:
        text: Think big, craft bigger! And watch out for the spiders in the garden — they are friendly, but their webs are VERY
          sticky.
    image: d8c66057ee7f9319bbea2805098819ce55a0a5e92cac9746fd08716586314915.png
  stylist_maren:
