      root:
        text: A graceful half-elf with nimble fingers and an appraising eye steps forward, a pair of enchanted silver scissors
          hanging from a chain at her waist. Her own appearance seems to shift subtly in the mirror light — now
          dark-haired, now fair, now somewhere in between. "Welcome, dear! I am Stylist Maren. I can change your
          appearance, your name — anything about how the world sees you. Shall we get started, or would you like to know
          more first?"
        choices:
          - text: What can you change about me?
            next: what_change
          - text: Let's get started!
            next: farewell
