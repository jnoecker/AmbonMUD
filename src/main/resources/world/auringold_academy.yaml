        count: 2
    behavior:
      template: wander
      params:
        maxWanderDistance: 4
  angry_nebula:
    name: a tiny angry nebula
    tier: standard
    level: 1
    description: A swirling sphere of cosmic dust no larger than a clenched fist roils with violent purples and blues, its
      edges crackling with barely contained energy as it zips erratically through the air, leaving a faint trail of
      sparkling particles in its wake. It looks angry, but it's small and cute.
    spawns:
      - room: endless_starry_void
        count: 2
      - room: wagon_drifting_stars
        count: 2
      - room: caravan_stable
    image: 98a543f8c919057bd9fbbe0d8fa0308f4c497dfe8a600288802d978ee9278606.png
