  verathaios:
    name: Verathaios
    description: A serene man in a long coat that seems woven entirely from phoenix feathers — iridescent reds, oranges, and
      golds that shift and shimmer as he moves. He stands with his hands open over the green, and where his attention
      falls the plants answer — vines weave, flowers open, fruiting branches bend toward him like sunflowers to the sun.
      Bioluminescent blooms and herbs that shimmer with healing crowd around his feet, and the air holds a faint golden
      warmth. He does not command the garden so much as keep it company. This is Verathaios, the World Healer — a god
      far more gardener than lord, who came to a wounded world and simply decided to make it grow.
