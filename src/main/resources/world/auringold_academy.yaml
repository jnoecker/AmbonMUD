  sparring_circle:
    terrain: outside
    title: The Sparring Circle
    description: A ring of white chalk renewed each dawn by some unseen hand, where brass sparring golems wait with arms
      folded and the air tastes faintly of ozone and ambition. At the ring's edge an examination golem twice the others'
      size stands under a canopy, a silk ribbon reading PROCTOR pinned to its chest plate. Weigh each opponent before
      you step in — 'consider golem' will read you the odds, and 'consider proctor' should give you honest pause. The
      dummies of the proving yard never hit back; everything in this circle does.
    exits:
      w: proving_yard
      s: duel_ring
    image: 1505f404328edd0f7e03f442d01edf7db3726e7e07203132c0df61d478e5414f.jpg
  beast_pen:
    terrain: outside
    title: The Misbehaving Menagerie
    description: A fenced pen of churned mud and chewed fence posts where the Academy keeps its less cooperative teaching
      aids. A gloomling — all damp shadow and enormous eyes — skitters from puddle to puddle and bolts the moment anyone
      looks fierce, while something that is almost certainly not a footstool waits with suspicious stillness in the
      corner. A timber spotters' walk on stilts overlooks the pen, reached by a ladder bolted to the fence. Mind the
      placard before you wander close ('read placard').
    exits:
      n: proving_yard
      e: duel_ring
    features:
      pen_placard:
        type: SIGN
        displayName: a mud-spattered placard wired to the fence
        keyword: placard
        text: MENAGERIE SAFETY. One — the mimic by the corner attacks anyone who lingers; some creatures in Ambon need no
          invitation, so 'consider' before you wander. Two — the gloomling flees when wounded; chase it and learn how
          cowards fight. Three — set your own cowardice wisely. 'wimpy 30' flees you automatically below thirty percent
          health; 'wimpy off' disables it; plain 'wimpy' reports it. Four — if a lesson goes badly, 'flee', drink
          something, and come back wiser. Five — should a beast wear a strange color and a stranger name, 'consider' it
          twice; the spotters' walk above keeps the log on such visitors.
    image: 7183443afdde57fb6bedd1509388ed2aba3050ba895c5eadc73850168a2964fa.jpg
  spotters_walk:
    terrain: outside
    title: The Spotters' Walk
    description: A timber gallery raised on stilts above the menagerie, its rail worn smooth by generations of leaning
      elbows and its roof shingled against thrown mud. Field glasses on brass chains wait at intervals, a logbook the
      size of a door stands open on a lectern, and a small bell hangs ready to be rung at a worthy sighting — the most
      recent entry beneath it reads SAW SOMETHING GLIMMERING, RANG TWICE. Warden Bellwether keeps the watch ('talk
      warden'), and the log's standing orders are pinned to the lectern ('read log').
    features:
      spotters_log:
        type: SIGN
        displayName: the spotters' log, open to its standing orders
        keyword: log
        text: THE SPOTTERS' STANDING ORDERS. Now and then the dream paints a creature strange — an Albino, Verdant, or
          Shadow-touched cousin of an ordinary beast; rarer still an Ember, Glimmering, or Frostbound one; and once in a
          long while a Spectral or Ancient that the whole dream hears about. Any creature, anywhere, may wear the rare
          coat. They stand out, they hit harder, they last longer, and they carry richer spoils, so 'consider' before
          you approach — the reading already accounts for the coat. Sightings are called across the zone as they appear.
          Ring the bell after, and never call a Verdant gloomling 'mossy' to its face.
    image: 9002b32593d40fa496957ad29774669da8fb759ea2581c0c925f0a942519fd0e.jpg
  duel_ring:
    terrain: outside
    title: The Duel Ring
    description: An elegant sunken ring of pale marble, its tiers cushioned in velvet for spectators and its floor etched
      with runes that catch and soften every killing blow. Marshal Valenne — a silver-masked Lustriae with a dueling
      sabre worn like jewelry — oversees all matches of honor with theatrical gravity. Challenges here harm pride alone;
      ask her about the forms with 'talk marshal', or read the etiquette plaque ('read plaque').
    exits:
      n: sparring_circle
      w: beast_pen
    features:
      duel_plaque:
        type: SIGN
        displayName: a marble plaque inlaid with crossed sabres
        keyword: plaque
        text: THE FORMS OF HONOR. To challenge a fellow dreamer, 'duel <name>'. They answer with 'duel accept' or 'duel decline'
          — both are polite. The ring referees itself; when one duelist falls the runes catch them, and honor is settled
          with no lasting harm. Duels may be fought anywhere in Ambon, but the ring remembers your victories more
          fondly. PvP kills also earn honor on the leaderboards — 'leaderboard' to see where you stand.
    image: 8cd176c367d02584fe8489af0854d3e9b1279d2f3c44e8809ba3e16dca9485a1.jpg
  market_row:
    terrain: urban
    title: Market Row
    description: A crooked harbor lane in the cool beneath Lyrasael, its leaning shopfronts strung with paper lanterns and
      its cobblestones worn smooth by generations of dreaming feet. Hawkers' stalls display bottled lullabies and
      self-shuffling card decks, a fountain shaped like a yawning moon burbles in the middle distance, and the smell of
      toasted sugar drifts from somewhere that is never quite findable. Commerce of every flavor keeps its doors within
      a stroll of this row — the bank, the auction hall, the provisioner and post, and the offices where homes and
      guilds are chartered. The crier's post summarizes it all ('read post').
    exits:
      u: lyrasael
      e: auction_hall
      w: bursar_bank
      n: campus_post_office
      s: provisioners_nook
    features:
      criers_post:
        type: SIGN
        displayName: the town crier's post, papered in handbills
        keyword: post
        text: MATTERS OF COIN. 'gold' counts what you carry; 'currencies' counts subtler wealth, like Academy Merits. 'give
          <item> <person>' is generosity, 'drop' and 'get' are carelessness and its remedy. The Bursar's bank keeps coin
          and goods safe forever — even from you. The auction hall sells to the highest dreamer. The provisioner stocks
          what adventurers actually need. And when you tire of renting rooms in other people's dreams, the broker and
          the registrar will sell you a house or charter your guild.
    image: 7253c766e0bbba3c0db3463ed12a3602d9f362c63834fcdc0b0498a4f0b7ce5b.jpg
  bursar_bank:
    terrain: inside
    title: The Bursar's Vault
    description: Beyond a counter of polished obsidian, shelves of strongboxes recede impossibly far into the hillside, each
      humming a different note so the Bursar can find them by ear. Brass lamps burn with a flame that casts no shadow,
      the air smells of cold iron and ledger ink, and somewhere deep below something enormous turns over in its sleep —
      the interest, perhaps, compounding. Bursar Coppertill will gladly explain the house rules ('talk bursar'), which
      are also etched plainly into the counter ('read counter').
    exits:
      w: twilight_salon
      e: market_row
      s: broker_office
    bank: true
    features:
      vault_counter:
        type: SIGN
        displayName: an obsidian counter etched with the house rules
        keyword: counter
        text: THE BURSAR'S RULES. 'bank' states your balance and stored goods. 'deposit 50' entrusts us with coin; 'deposit
          <item>' with property. 'withdraw 50' or 'withdraw <item>' reclaims either. What the vault holds, nothing can
          take — not thieves, not death, not your own enthusiasm. Browser patrons may simply open the Bank panel while
          standing in this room. The Bursar reminds you that gold carried is gold spendable, and gold spendable is gold
          spent.
    image: 2c4f9993c1f72994d27ec4f7b9e3e2d5c01f0c7280a979a9f0d720643939151a.jpg
  auction_hall:
    terrain: inside
    title: The Auction Hall of Whispered Bids
    description: An amphitheater of velvet and brass where a chandelier of captured fireflies dims respectfully each time
      the hammer falls. Auctioneer Mirabelle — a Kitsarae with an opera voice and a gavel of petrified lightning —
      presides over lots that float serenely above the block in soap-bubble spheres. Anyone may sell and anyone may bid;
      the rules of the house hang beside the block ('read rules'), and Mirabelle herself will teach the finer points
      ('talk auctioneer').
    exits:
      w: market_row
      s: guild_registry
    auction: true
    features:
      house_rules:
        type: SIGN
        displayName: the house rules, hung in a gilt frame
        keyword: rules
        text: THE WHISPERED BID. 'auction' (or 'auction list') shows every lot on the block. 'auction sell <item> <price>'
          offers your own treasure to the dream at the price you name. 'auction buy <number>' claims a lot; 'auction
          cancel <number>' withdraws one of yours, no questions asked. Coin changes hands instantly and the house takes
          no cut — we are, after all, only dreaming. Browser bidders will find the Auction panel opens right here.
    image: fda55923bbdd9b6760e74235e997db07200764a97522ce4278f64ec42952147a.jpg
  provisioners_nook:
    terrain: inside
    title: The Provisioner's Nook
    description: A snug shop smelling of wax, rope, and restorative cordials, its walls hung with coils of silver twine and
      shelves of stout red-and-blue bottles arranged by cheerfulness. Quartermaster Tobbin keeps the counter with a
      ledger ruled in three colors of honest ink, squaring every bottle to the same quarter-turn, while a supply crate
      of communal odds and ends sits open to any student in need. Stock up before your lessons ('list', then 'buy
      <thing>'), rummage the crate ('open crate', 'search crate', 'get rope from crate'), and ask Tobbin what a satchel
      should hold ('talk quartermaster'). Through a sorting-window in one wall drifts the busy thump of a franking iron.
    exits:
      n: market_row
      w: broker_office
      e: guild_registry
    features:
      supply_crate:
        type: CONTAINER
        displayName: a communal supply crate stenciled TAKE WHAT YOU NEED
        keyword: crate
        initialState: closed
        respawnSeconds: 90
        items:
          - practice_rope
          - dreamers_biscuit
    image: 07fef40a4de8d0eba67cabb22818157f0b34276c3c72395a8251f4cab6e6b1a7.jpg
  campus_post_office:
    terrain: inside
    title: The Campus Post Office
    description: A small sorting hall walled floor to ceiling in pigeonholes, each labeled in Postmistress Wren's impeccable
      hand and several stuffed with letters that arrived before their senders finished writing them. A brass franking
      iron warms over a candle, parcel twine unspools from a wheel near the ceiling, and the air smells of sealing wax,
      ink, and other people's good news. Wren sorts at the counter ('talk wren'), and the corkboard of postal notices
      explains the whole service ('read notices').
    exits:
      s: market_row
    features:
      post_board:
        type: SIGN
        displayName: a corkboard of postal notices
        keyword: notices
        text: THE POST AND THE HANDSHAKE. Letters travel even between dreams — 'mail send <name>' composes one (coin and parcels
          may ride along), 'mail' lists your inbox, 'mail read 1' opens a letter, 'mail claim 1' pockets its enclosures,
          'mail delete 1' burns it. For trades made face to face, 'trade <name>' opens a bargaining table; 'trade offer
          <item>' and 'trade offer 50 gold' load your side, 'trade accept' shakes on it, 'trade cancel' walks away. Both
          dreamers must accept before anything moves — the handshake protects you both.
    image: 5be59dc69fed289152a971bad22cb61787c2506e20c7ae0fde175d0adbfedbe8.jpg
  broker_office:
    terrain: inside
    title: The Estates Broker's Office
    description: A reassuring office of deep carpets and deeper armchairs, where scale models of cottages, vaults, and one
      alarmingly large castle rotate slowly inside glass bell jars. Broker Thistledown — a Mycorae whose cap is politely
      doffed indoors — sells not houses but the dreams of houses, which in Auringold amounts to the same thing. Browse
      the catalog with 'house list', ask the broker anything ('talk broker'), and read the fine print, which for once is
      printed large ('read print').
    exits:
      w: hall_of_records
      e: provisioners_nook
      n: bursar_bank
    housingBroker: true
    features:
      fine_print:
        type: SIGN
        displayName: the fine print, printed mercifully large
        keyword: print
        text: ON THE OWNERSHIP OF DREAMS. 'house list' shows every room we build and its price. 'house buy' (spoken in this
          office) purchases your first carriage house; 'house expand <template> <direction>' grows it room by room
          thereafter. 'house' reports your estate; 'house invite <name>' and 'house kick <name>' manage guests; 'house
          describe title <words>' and 'house describe desc <words>' redecorate in prose. Homes are safe rooms — beds
          rest you, vaults hold your things, and nobody uninvited gets in. Saving up is half the pride of it.
    image: ba77abde0d45617e886ebfc5ac8bb121730c472519ad3a6490d42006ba302497.jpg
  guild_registry:
    terrain: inside
    title: The Guild Registry
    description: A hall of dark wood and brighter heraldry, every wall crowded with the crests of fellowships past — some
      noble, some long dissolved, one apparently just a painting of soup. Registrar Oakhollow, a Lithae whose granite
      hands are surprisingly gentle with parchment, keeps the great ledger of guilds and the smaller, warmer ledger of
      friendships. He will witness your charter ('talk registrar'), and the wall of crests explains the forms ('read
      crests').
    exits:
      n: auction_hall
      w: provisioners_nook
    features:
      crest_wall:
        type: SIGN
        displayName: the wall of crests and its engraved forms
        keyword: crests
        text: ON FELLOWSHIP. Guilds are forever-marks — 'guild create <name> <TAG>' founds one, 'guild invite <name>' grows it,
          'guild roster', 'guild motd <words>', 'guild promote' and 'guild demote' keep it civil, and 'gchat <words>'
          (or 'g') speaks only to your own. A guild may even raise a hall — ask about 'guild hall buy'. Groups are
          tonight-marks — 'group invite <name>' to hunt together, 'group accept' to join, 'gtell <words>' to whisper to
          the hunting party, 'group leave' when dawn comes. Friends are kept-marks — 'friend add <name>', 'friends' to
          see who walks the dream beside you. And 'who' shows everyone awake right now.
    image: 925bef73b1e655fd7ad3b1102f5cd11121cefec8f43131c0dd359b5e3398d145.jpg
  gathering_garden:
    terrain: outside
    title: The Gathering Garden
    description: Terraced beds of impossible botany descend toward a brook that giggles when stepped over, the air heavy
      with pollen that glitters faintly before settling. Moonpetal blooms open and close in slow heartbeat rhythm,
      trellised sunsap vines drip amber light instead of nectar, and Gardener Fernwhistle — a Sylflorae with a watering
      can that is also somehow a hat — putters between the rows leaving footprints of clover. She teaches the gentle
      arts ('talk gardener'); the potting bench keeps her instructions ('read bench'). At the garden's lower edge, broad
      stone steps open onto a flagstone terrace crowded with weather instruments.
    exits:
      e: verathaios_workshop
      n: alchemy_lab
      s: almanac_terrace
    features:
      potting_bench:
        type: SIGN
        displayName: a potting bench chalked with field notes
        keyword: bench
        text: THE GENTLE ARTS. Living makings must be gathered — 'gather petals' coaxes the moonpetal bed, 'gather vine' the
          sunsap trellis. Each bed needs a short rest after harvest, and so might you. 'craftskills' shows your mastery
          of herbalism and every other craft; skill grows by doing. When one craft becomes your calling, 'specialize
          <craft>' devotes you to it for a bonus to all its learning. Browser gardeners — the Crafting panel lists every
          gatherable thing in reach.
    image: 05343bf2aa8bb4a46ebcae373bcf97dbf893e4386b0f29d4683d449c6d13ff53.jpg
  almanac_terrace:
    terrain: outside
    title: The Almanac Terrace
    description: An open flagstone terrace at the garden's lower edge, ringed by a balustrade of weathered brass and
      centered on a great weather-glass — a captured sphere of sky in which tomorrow's clouds quietly rehearse. Season
      charts flutter on a drying line, a sundial keeps the day and a moondial keeps the rest of it, and four shallow
      basins stand one to each corner — blossom, warm sand, fallen leaves, and rime — only one of them ever full at a
      time. Keeper Brontide tends the instruments ('talk keeper'), and the almanac stone states the calendar plainly
      ('read almanac').
    exits:
      n: gathering_garden
    features:
      almanac_stone:
        type: SIGN
        displayName: the almanac stone, carved with a wheel of the year
        keyword: almanac
        text: THE DREAM'S CALENDAR. 'time' reads the hour and the sky together — the dream keeps dawn, day, dusk, and night, and
          weathers of clear, rain, storm, fog, snow, and wind, each zone under its own sky. Beneath both, the year
          wheels through spring, summer, autumn, and winter; the terrace basins fill to mark the season, and browser
          dreamers will see it painted in the sky itself. Mind the schedules — some creatures keep to one hour, one
          weather, or one season alone, arriving when the calendar suits and fading when it stops. The terrace's own
          almanac beasts demonstrate, each in its proper turn, and the zone hears every arrival called. And now and then
          the dream keeps a holiday outright — the Wandering Star, chief among them. When word of one spreads, 'time'
          lists it while it lasts, and the terrace may keep an extra guest for the duration.
    ambient: 0918d6a86df06d90c4384605a8d1fb2ceda24b415b82c560d5d2c9f945e5c1e6.mp3
    image: faf1ab8fcb0d13e1d8ae1aa1fbdf7649122e0e649e01ebfa0ec80fe064c24b43.jpg
  old_mine_gate:
    terrain: outside
    title: The Old Mine Gate
    description: A timber-framed adit yawning from the hillside off the path to Kaerinlith, its lintel carved with the
      Academy crest and a much older miner's blessing worn nearly smooth. Cart tracks run inward into glittering dark, a
      rack of borrowable picks leans by the entrance, and Foreman Graveljaw — a Lithae whose beard appears to be genuine
      quartz — sits sentry on an upturned bucket. He knows every seam below ('talk foreman'), and the assay board posts
      what the mountain is offering ('read board').
    exits:
      e: path_kaerinlith
      w: crystal_seam
    features:
      assay_board:
        type: SIGN
        displayName: the foreman's assay board
        keyword: board
        text: ASSAY OF THE DEEPS. Beyond this gate the dream grows mineral. 'gather seam' (or 'mine seam') works the
          glimmer-ore; 'gather pocket' tries the dreamglass, which asks a steadier hand — skill 2 or better. Every seam
          occasionally yields something rare; that is not luck but the mountain's opinion of you. Ore feeds the forge,
          dreamglass feeds finer work, and 'craftskills' tracks how the mountain's opinion is trending.
    image: 80c3761b0f862e16e771c7aaae8bbb4f44a927d1ada0dfaaa13b0f4531894315.jpg
    ambient: 533d68af8b2944dc9dcd1212a70a0a228982aac50e93a02da303c7a844d9cd5f.mp3
  crystal_seam:
    terrain: underground
    title: The Crystal Seam
    description: A low gallery where lantern light returns from the walls multiplied and slightly improved, every surface
      veined with glimmer-ore that pulses like a slow second heartbeat. Pockets of dreamglass bloom from the stone in
      frozen splashes, each holding a tiny refracted image of somewhere else in the dream, and the dark beyond the
      lamplight has the companionable quality of a cellar rather than a cave. The seams here are for working — 'gather
      seam' for ore, 'gather pocket' for dreamglass — and the way back up is never far.
    exits:
      e: old_mine_gate
    image: 8d6c56005f5f9a18b5094d48516c3887620145702c113840ed20a7ab188a1e6f.jpg
  alchemy_lab:
    terrain: inside
    title: The Alchemy Lab
    description: Copper kettles mutter over violet flames while glass coils carry blushing liquids from bench to bench in no
      particular hurry. The shelves hold reagents labeled in six languages and one apology, the ceiling bears a stain
      shaped exactly like the headmaster of some other school, and Alchemist Dewdrop — an Ophirae in wave-patterned
      robes — measures drops with the serenity of falling rain. Her table welcomes all students ('talk alchemist'); the
      formulary lists the founding recipes ('read formulary').
    exits:
      s: gathering_garden
    station: alchemy_table
    features:
      formulary:
        type: SIGN
        displayName: a formulary propped open on a reading stand
        keyword: formulary
        text: THE FOUNDING FORMULAE. Brewing happens at an alchemy table such as this one — 'recipes' lists what you can make,
          'recipes alchemy' narrows the list, 'craft minor healing draught' brews the classic. Draughts mend the body
          and philters the mind; 'use' one in need, or trust 'quickheal' and 'quickmana' to grab the best bottle you
          carry. Brewing at the table itself yields a little extra — the glassware approves of being included.
    image: a890bbdc31e4a8a66c7979d88cbc2673a3390b04caea799259b0992be8c215ae.jpg
  tinkers_bench:
    terrain: inside
    title: The Tinker's Bench
    description: A long workbench of scarred oak under a constellation of hanging tools, each swaying gently toward
      whichever project needs it next. Half-finished marvels crowd the shelves — a music box that plays tomorrow's
      weather, a compass pointing to lost buttons — and a wall of tiny labeled drawers holds springs, lenses, and
      patience. The bench works wonders from humbler stuff ('recipes', then 'craft <thing>' while standing here), and
      its brass placard explains the house philosophy ('read placard').
    exits:
      n: enchanting_sanctum
      w: call_for_heroes
    station: workbench
    features:
      bench_placard:
        type: SIGN
        displayName: a brass placard screwed slightly crooked
        keyword: placard
        text: THE TINKER'S PHILOSOPHY. A workbench turns oddments into wonders — dreamglass into charms, lanterns, and the small
          necessary things no forge or kettle thinks to make. 'recipes' shows the bench's repertoire beside everything
          else you know; each craft names the station it wants. Work at the proper station and the work repays you in
          kind. When your hands outgrow these benches, 'specialize' in the craft you love best.
    image: 6d5a6cc3ac3dcfdf297a179563345eb2a104231d6095d33beecb925a4514e41d.jpg
  enchanting_sanctum:
    terrain: inside
    title: The Enchanting Sanctum
    description: A hushed circular chamber where the walls are bookshelves and the books are chained — not to prevent theft,
      the plaques insist, but escape. Motes of stardust orbit a lectern of frosted crystal in slow ellipses, runes drift
      across the floor like leaves on a pond, and Enchanter Silverquill — an Aetherae whose hair will not commit to a
      single constellation — coaxes sleeping magic into waking metal. The art is taught freely ('talk enchanter'), and
      the lectern bears its grammar ('read lectern').
    exits:
      n: crafters_workshop
      w: library_fairytales
      s: tinkers_bench
    features:
      rune_lectern:
        type: SIGN
        displayName: a frosted crystal lectern inscribed with rune-grammar
        keyword: lectern
        text: THE GRAMMAR OF WAKING MAGIC. 'enchantments' lists every working this sanctum knows and the makings each demands —
          stardust always, and something with character. 'enchant <item> <enchantment>' weaves one into a worn-slot
          treasure ('enchant sword keen_edge', say); plain 'enchant <item>' lets the sanctum choose the finest you can
          manage. Each item holds one enchantment, so choose with feeling. The craft grows like any other —
          'craftskills' tracks it, and greater workings unlock as your hand steadies.
    image: e909b4129db1c1a305cb7c861af93a024d719dc608c9d113219ac1d21dbe4c24.jpg
  hall_of_records:
    terrain: inside
    title: The Hall of Records
    description: A long gallery where the Academy's memory is kept in marble and gold leaf — plinths bearing the names of
      celebrated graduates, cabinets of medals polished nightly by moths trained for the purpose, and a great brass
      orrery whose planets are tiny portraits of the year's finest students. Archivist Inkwhisper drifts between the
      stacks correcting history's penmanship, happy to explain how glory is measured ('talk archivist'). The Ledger of
      Legends anchors the hall ('read ledger'), and a curtain of dust-silk half-veils a domed vestibule kept for the
      hall's most patient monument.
    features:
      ledger_of_legends:
        type: SIGN
        displayName: the Ledger of Legends, open on a marble plinth
        keyword: ledger
        text: HOW GLORY IS KEPT. 'achievements' lists every deed the dream has noticed in you, finished and unfinished alike —
          some are secrets until earned. Great deeds grant titles; 'title <name of title>' wears one proudly, 'title
          clear' retires it. 'leaderboard' ranks the dream's finest by many measures — 'leaderboard level', 'leaderboard
          gold', and more. 'describe <words>' writes the line others read when they look upon you, and 'describe check
          <name>' reads theirs.
    image: 5ebee2cbe55c358171c2818d91cb67a042abe1088197735804a9a3b11c60312c.jpg
    exits:
      n: twilight_salon
      e: broker_office
  riddle_gallery:
    terrain: inside
    title: The Riddle Gallery
    description: A vaulted gallery where bookshelves that wandered down from the library long ago have grown playful,
      rearranging their spines into puns when no one watches. At the gallery's heart crouches the Sphinx of Softwords —
      housecat-sized, marble-furred, and insufferably pleased with itself — atop a pedestal carved with question marks
      in forty alphabets. Beyond it, a door of dark walnut waits under an engraved arch, locked to all who have not
      answered. Hear the riddle by reading the pedestal ('read pedestal'), and offer your solution with 'answer <your
      answer>'.
    exits:
      n: catacombs_landing
      s:
        to: vault_of_whispers
        door:
          initialState: locked
          keyItemId: key_of_questions
    features:
      riddle_pedestal:
        type: SIGN
        displayName: a pedestal carved with question marks in forty alphabets
        keyword: pedestal
        text: "The sphinx's riddle, engraved in patient stone: \"I speak without a mouth and hear without ears. I have no body,
          but I come alive with wind. What am I?\" Offer your solution aloud with 'answer <word>'. Correct answers are
          rewarded; incorrect ones are remembered, fondly and forever, by the sphinx. The walnut door beyond opens only
          to the key the sphinx guards — once it is yours, 'unlock door' and 'open door' grant passage."
    image: 00a5a2f57d85fc1448a405e498200d3d39a2a94023668b541a82c8618ad62540.jpg
  vault_of_whispers:
    terrain: inside
    title: The Vault of Whispers
    description: A circular stone chamber that swallows sound — your own footsteps arrive a half-beat late, apologetic.
      Three great levers of celestial brass rise from the floor, crowned in turn with a blazing sun, a crescent moon,
      and a five-pointed star, and one wall is suspiciously blank in the way of walls that are also doors. A verse is
      chiseled above the levers ('read verse'); pull them in the order it praises — 'pull star', 'pull moon', 'pull sun'
      are the manner of it — and the wall may reconsider.
    exits:
      n: riddle_gallery
    features:
      vault_verse:
        type: SIGN
        displayName: a verse chiseled above the levers
        keyword: verse
        text: "\"Last light of evening, first to wake — the STAR stands watch for heaven's sake. The MOON comes next on silver
          feet, where night and morning briefly meet. And last of all the SUN climbs high, to open wide the waiting
          sky.\" Pull the levers as the verse walks — star, then moon, then sun — and the blank wall will remember being
          a door."
      star_lever:
        type: LEVER
        displayName: a brass lever crowned with a five-pointed star
        keyword: star
        initialState: up
        respawnSeconds: 60
      moon_lever:
        type: LEVER
        displayName: a brass lever crowned with a crescent moon
        keyword: moon
        initialState: up
        respawnSeconds: 60
      sun_lever:
        type: LEVER
        displayName: a brass lever crowned with a blazing sun
        keyword: sun
        initialState: up
        respawnSeconds: 60
    image: 7b61c1811b508c349572f88f5cc8fb88943c7ccd14a1ed43c648f8a3f22a0f9e.jpg
  secret_archive:
    terrain: inside
    title: The Secret Archive
    description: A hidden reading room lit by a skylight that opens onto stars unfamiliar even to Auringold, where the
      Academy keeps the books too true for the open shelves. A marble mouth set into the far wall recites its single
      riddle to each visitor with evident relish, guarding a strongbox bound in silver; the Grimoire of Beginnings rests
      on a lectern, available to any student bold enough to have arrived. Take the grimoire ('get grimoire'), hear the
      mouth's riddle ('read mouth' — then 'answer <word>'), and spend its key before the room forgets you ('unlock
      strongbox', 'open strongbox', 'get seal from strongbox').
    exits:
      n: vault_of_whispers
    features:
      marble_mouth:
        type: SIGN
        displayName: a marble mouth set into the wall, mid-recitation
        keyword: mouth
        text: "The mouth recites, rolling each word like a sweet: \"I have keys that open no locks, a space but no room, and you
          may enter though you never go in. What am I?\" Speak your solution with 'answer <word>'. The mouth dispenses a
          silver key to the worthy — a key the strongbox accepts exactly once, so open it while the kindness lasts."
      archive_strongbox:
        type: CONTAINER
        displayName: a strongbox bound in tarnished silver
        keyword: strongbox
        initialState: locked
        keyItemId: archive_key
        keyConsumed: true
        respawnSeconds: 120
        items:
          - scholars_seal
    image: 536f0e2b58dc99aec879ab6233cfe729cd74fe37ad779af57fae5cfaef51cea8.jpg
  games_parlor:
    terrain: inside
    title: The Parlor of Small Fortunes
    description: A snug gambling den tucked off Lyrasael's lantern-lit promenade, upholstered in green felt and good cheer,
      where the dice are honest because Gamemaster Kolksprut once asked them nicely and they have never forgotten. A
      crystal jar of lottery tickets glitters on the mantel beneath a chalkboard of past jackpots, each crossed out with
      theatrical grief. Kolksprut deals in hope at fair prices ('talk gamemaster'); the table card states the odds
      without blushing ('read card').
    tavern: true
    features:
      table_card:
        type: SIGN
        displayName: a table card stating the odds without blushing
        keyword: card
        text: SMALL FORTUNES, FAIRLY SOLD. The dice — 'gamble 10' wagers ten gold on a roll against the house; win and it
          doubles. Plain 'gamble' recites the full rules. The lottery — 'lottery' shows the jackpot now growing,
