  song_parlor:
    terrain: inside
    title: The Parlor of Borrowed Songs
    description: >-
      A velvet-hushed listening room tucked beside the gambling den, its tapestry-quilted walls swallowing every note
      before it can trouble the promenade. Filling half the parlor stands one of Tessikar the Springwright’s grand
      musical engines: a car-sized clockwork village of walnut, brass, painted porcelain, and dreamglass, built in the
      old Bavarian cuckoo-clock style with steep little roofs, shuttered windows, turning waterwheels, bell towers,
      balconies, and tiny streets no wider than a hand.


      Behind crystal panes, pinned brass cylinders turn with patient precision. Gears shift beneath the cobbled
      miniature squares. When fed a coin, the whole village wakes. Shutters clap open. Doors swing wide on bright cuckoo
      hinges. Little clockwork villagers glide out on hidden rails and revolving dias-plinths: fiddlers no taller than
      teacups bowing in place beneath a painted linden tree, a bellows-chested singer with a porcelain face leaning from
      an upper window, drummers whose spring-wound sticks tap smartly against thimble-sized drums, and a chorus of
      brass-throated townsfolk who rotate through the square as if caught in some eternal festival procession.


      Together they perform the great ballads of Ambon: the faerie-song of Aineroia, the mother goddess; the
      footprint-ballad of Kvarcgagap, the shining quartz void; the music-box ballad of Tessikar the Springwright; and a
      call-and-response shanty begging fair passage of Maelsang, the tide between worlds. Some cottages and
      balcony-stages remain dark, their tiny nameplates freshly chalked for songs not yet pressed into cylinder or
      taught to gear and spring.


      A hand-lettered placard is bolted to the cabinet (`read placard`).
    exits:
      n: games_parlor
    features:
      jukebox_placard:
        type: SIGN
        displayName: a hand-lettered placard bolted to the cabinet
        keyword: placard
        text: THE BORROWED SONG. Feed the jukebox a few coins and it plays your chosen song for EVERYONE in the parlor, not just
          you. Type 'jukebox' (or 'jb') to read the songbook, then 'jukebox play <number>' to pay for a track. While a
          song plays the jukebox is busy — it won't take another coin until the tune ends, after which the parlor drifts
          back to its usual quiet. Web players can click the Jukebox badge to browse and watch the countdown. Tonight's
          songbook holds four pressed cylinders — Aineroia the mother goddess, Kvarcgagap the shining quartz void,
          Tessikar the Springwright, and Maelsang of the tides — and the songbook grows as new cylinders are pressed.
          The saddest verses are about real people, some of whom still visit.
