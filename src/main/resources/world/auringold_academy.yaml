  lustriae_guard_woman:
    name: A Lustriae Guard
    tier: standard
    level: 3
    description: A short, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — pastel hair,
      dark eyes, softly pointed ears. She has rust colored diaphanous wings extending from her back. She is dressed as a
      fairy guard, like the forest itself grew over her to provide clothing, with bark, leaves thorns forming a living
      military uniform.
    spawns:
      - room: aineron
    image: be2e76bd6e83bb37d85636a4848317d9f54507b1d42c05ef81b61819d5f33926.png
