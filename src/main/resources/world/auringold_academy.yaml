quests:
  auringold_visit_naraxian:
    name: Visit the Naraxian Akathavae
    giver: krioshaeu
    description: The Naraxian Akathavae is the god of stories, historians, musicians and performers. Visit their floating
      caravan wagon in the stars and learn about the history of Ambon.
    turnInMob: naraxian_akathavae
    completionType: npc_turn_in
    level: 1
    difficulty: standard
    rewards:
      items:
        - itemId: silk_tophat
          count: 1
  school_orientation:
    name: Orientation Day
    giver: provost_lumina
    description: Provost Lumina has enrolled you at the Auringold Academy. Report to Pip the Welcome Wisp in the
      Orientation Hall off the quad — ask it everything, settle your preferences, and let it log your enrollment.
      ('talk pip' when you arrive, and read the chalkboard while you're there.)
    turnInMob: greeter_pip
    completionType: npc_turn_in
    level: 1
    difficulty: trivial
    rewards:
      gold: 25
      currencies:
        academy_merit: 5
      items:
        - itemId: badge_of_orientation
          count: 1
  the_first_swing:
    name: The First Swing
    giver: drillmaster_brasswick
    description: Drillmaster Brasswick wants your arm educated before your opinions are. Burst three practice
      dummies on the proving yard — 'consider dummy' to size one up, 'kill dummy' to begin, and gather what falls.
      The dummies have signed waivers.
    completionType: npc_turn_in
    level: 1
    difficulty: easy
    objectives:
      - type: kill
        targetKey: practice_dummy
        count: 3
        description: Burst practice dummies on the proving yard
    rewards:
      gold: 25
      currencies:
        academy_merit: 5
  know_your_enemy:
    name: Know Your Enemy
    giver: drillmaster_brasswick
    description: The sparring circle's brass golems hit back — that is their entire syllabus. 'consider' them first,
      learn what the warning means, then best one and bring the Drillmaster its humming core as proof the lesson
      connected. Mind the Proctor; 'consider' it too, and believe what you read.
    completionType: npc_turn_in
    level: 2
    difficulty: standard
    objectives:
      - type: collect
        targetKey: golem_core
        count: 1
        description: Claim a core from a bested sparring golem
    rewards:
      gold: 40
      currencies:
        academy_merit: 5
  the_better_part_of_valor:
    name: The Better Part of Valor
    giver: drillmaster_brasswick
    description: Two lessons wait in the menagerie. The gloomling flees when wounded — chase it down and take its
      ribbon. The mimic strikes the unwary — survive its ambush and take a tooth. Set 'wimpy 30' before you go, and
      'flee' without shame if the footstool wins round one. The Drillmaster will know if you skipped the wimpy.
    completionType: npc_turn_in
    level: 2
    difficulty: standard
    objectives:
      - type: collect
        targetKey: gloom_ribbon
        count: 1
        description: Take a ribbon from the fleeing gloomling
      - type: collect
        targetKey: mimic_tooth
        count: 1
        description: Take a tooth from the ambushing mimic
    rewards:
      gold: 40
      currencies:
        academy_merit: 10
      items:
        - itemId: badge_of_valor
          count: 1
  stock_the_satchel:
    name: Stock the Satchel
    giver: postmistress_wren
    description: Postmistress Wren logs commissions only for students provisioned against trouble. Have a minor
      healing draught in your satchel — 'buy' one from her shelves or brew your own — and present it for
      inspection. Inspected goods are returned with interest; the Academy is not a highwayman.
    completionType: npc_turn_in
    level: 1
    difficulty: easy
    objectives:
      - type: collect
        targetKey: minor_healing_draught
        count: 1
        description: Carry a minor healing draught for inspection
    rewards:
      gold: 30
      currencies:
        academy_merit: 5
      items:
        - itemId: minor_healing_draught
          count: 2
  letters_and_ledgers:
    name: Letters and Ledgers
    giver: bursar_coppertill
    description: Banks and auction houses reconcile daily, or civilization stops. Carry the Bursar's sealed ledger
      down Market Row to Auctioneer Mirabelle — and let every door you pass introduce itself. Speak with Mirabelle
      to deliver it. ('talk auctioneer' at the auction hall.)
    turnInMob: auctioneer_mirabelle
    completionType: npc_turn_in
    level: 1
    difficulty: easy
    rewards:
      gold: 30
      currencies:
        academy_merit: 10
      items:
        - itemId: badge_of_commerce
          count: 1
  green_thumbs:
    name: Green Thumbs, Steady Hands
    giver: gardener_fernwhistle
    description: Gardener Fernwhistle logs fieldwork for students who know both halves of gathering. Bring her
      three moonpetal blooms from the garden beds ('gather petals') and three lumps of glimmer-ore from the seam
      below the mine gate ('gather seam'). The makings join the Academy stores — the badge is yours to keep.
    completionType: npc_turn_in
    level: 2
    difficulty: easy
    objectives:
      - type: collect
        targetKey: moonpetal_herb
        count: 3
        description: Gather moonpetal blooms in the garden
      - type: collect
        targetKey: glimmer_ore
        count: 3
        description: Mine glimmer-ore from the crystal seam
    rewards:
      gold: 35
      currencies:
        academy_merit: 10
      items:
        - itemId: badge_of_harvest
          count: 1
  strike_while_hot:
    name: Strike While the Forge Is Hot
    giver: smith_emberlyn
    description: Forge a glimmersteel shortblade — two lumps of glimmer-ore, one mimic's tooth, and Emberlyn's own
      forge ('craft glimmersteel shortblade' while standing at it) — then present the blade for inspection.
      Inspected work is stamped with the maker's mark and handed straight back; first blades are favorites forever.
    completionType: npc_turn_in
    level: 2
    difficulty: standard
    objectives:
      - type: collect
        targetKey: glimmersteel_shortblade
        count: 1
        description: Forge a glimmersteel shortblade and present it
    rewards:
      gold: 50
      currencies:
        academy_merit: 5
      items:
        - itemId: glimmersteel_shortblade
          count: 1
  bottled_courage:
    name: Bottled Courage
    giver: alchemist_dewdrop
    description: Alchemist Dewdrop's practical exam — brew two minor healing draughts at her table ('craft minor
      healing draught', moonpetal from the garden) and present the pair in matching glass. The lab keeps the exam
      bottles, as labs do, and grades generously in kind.
    completionType: npc_turn_in
    level: 2
    difficulty: standard
    objectives:
      - type: collect
        targetKey: minor_healing_draught
        count: 2
        description: Brew minor healing draughts for the practical exam
    rewards:
      gold: 40
      currencies:
        academy_merit: 5
      items:
        - itemId: draught_of_grit
          count: 1
  a_finer_polish:
    name: A Finer Polish
    giver: enchanter_silverquill
    description: Enchanter Silverquill asks two proofs — a dreamglass charm of your own tinkering ('craft
      dreamglass charm' at the workbench) and two pinches of stardust, however the dream offers them. The stardust
      feeds your first witnessed working; the charm is countersigned and returned. Then let the sanctum teach you
      'enchant' itself.
    completionType: npc_turn_in
    level: 2
    difficulty: standard
    objectives:
      - type: collect
        targetKey: dreamglass_charm
        count: 1
        description: Tinker a dreamglass charm at the workbench
      - type: collect
        targetKey: stardust
        count: 2
        description: Gather stardust for the witnessed working
    rewards:
      gold: 50
      currencies:
        academy_merit: 10
      items:
        - itemId: dreamglass_charm
          count: 1
        - itemId: badge_of_makers
          count: 1
  echoes_in_the_stacks:
    name: Echoes in the Stacks
    giver: archivist_inkwhisper
    description: The Archivist will credit the library wing to any student who walks its whole gauntlet — answer
      the sphinx ('answer <word>' in the gallery), open the walnut door, pull the vault's levers in the verse's
      order, and return with the Grimoire of Beginnings from the secret archive. The archive grows a fresh copy for
      every student; yours returns to the shelves with your name in it.
    completionType: npc_turn_in
    level: 3
    difficulty: standard
    objectives:
      - type: collect
        targetKey: grimoire_of_beginnings
        count: 1
        description: Retrieve the Grimoire of Beginnings from the secret archive
    rewards:
      gold: 50
      currencies:
        academy_merit: 10
      items:
        - itemId: badge_of_riddles
          count: 1
  rattling_bones:
    name: Rattling Bones
    giver: curator_mortis
    description: The Curator asks a kindness of the third-years — four restless pupils in the ossuary, laid back to
      their rest. They were students once; they will be calm again, with help. The Academy's regard for you will
      rise with every one — 'reputation' keeps the score.
    completionType: npc_turn_in
    level: 3
    difficulty: standard
    objectives:
      - type: kill
        targetKey: restless_pupil
        count: 4
        description: Lay restless pupils to rest in the ossuary
    rewards:
      gold: 60
      currencies:
        academy_merit: 10
  the_deep_lesson:
    name: The Deep Lesson
    giver: curator_mortis
    description: The deep examination, four centuries overdue — 'dungeon enter academy_catacombs' at the chapel's
      iron door, walk the shifting halls, and put the Dean of the Dead to rest in the deepest chamber. Bring
      company if you can ('group invite <name>' shares both danger and glory), and 'dungeon leave' concedes with
      honor if the halls win.
    completionType: npc_turn_in
    level: 4
    difficulty: hard
    objectives:
      - type: kill
        targetKey: dean_of_the_dead
        count: 1
        description: Put the Dean of the Dead to rest
    rewards:
      gold: 100
      currencies:
        academy_merit: 15
      items:
        - itemId: badge_of_vigil
          count: 1
  a_friendly_word:
    name: A Friendly Word
    giver: registrar_oakhollow
    description: Registrar Oakhollow needs a signature from Gamemaster Fortuna in the tavern parlor, and signatures
      come easier to friendly faces. Cross the campus, say your hellos along the way — 'say', 'emote', 'who',
      'friend add' as the mood takes you — and speak with Fortuna to deliver his regards.
    turnInMob: gamemaster_fortuna
    completionType: npc_turn_in
    level: 1
    difficulty: easy
    rewards:
      gold: 25
      currencies:
        academy_merit: 10
      items:
        - itemId: badge_of_fellowship
          count: 1
  commencement:
    name: Commencement
    giver: provost_lumina
    description: The rite of graduation. Hold all eight wing badges — orientation, valor, commerce, harvest, the
      makers' mark, the riddle's answer, the vigil, and fellowship — and present your credentials to Gatekeeper
      Aurelion at the Gates of Ambon. The badges become your diploma; the regalia becomes yours. Declare your
      candidacy to the Provost first, and accept the rite only once your satchel holds all eight.
    turnInMob: gatekeeper_aurelion
    completionType: npc_turn_in
    requiresDialogueFlag: commencement_candidate
    level: 5
    difficulty: epic
    objectives:
      - type: collect
        targetKey: badge_of_orientation
        count: 1
        description: Hold the Badge of Orientation
      - type: collect
        targetKey: badge_of_valor
        count: 1
        description: Hold the Badge of Valor
      - type: collect
        targetKey: badge_of_commerce
        count: 1
        description: Hold the Badge of Commerce
      - type: collect
        targetKey: badge_of_harvest
        count: 1
        description: Hold the Badge of Harvest
      - type: collect
        targetKey: badge_of_makers
        count: 1
        description: Hold the Makers' Mark
      - type: collect
        targetKey: badge_of_riddles
        count: 1
        description: Hold the Riddle's Answer
      - type: collect
        targetKey: badge_of_vigil
        count: 1
        description: Hold the Badge of the Vigil
      - type: collect
        targetKey: badge_of_fellowship
        count: 1
        description: Hold the Badge of Fellowship
    rewards:
      gold: 500
      currencies:
        academy_merit: 50
      items:
        - itemId: graduate_regalia
          count: 1
