  cavern_rat:
    name: a crystalline cavern rat
    tier: standard
    level: 1
    description: A skeletal rodent no larger than a fist, its entire body formed from translucent crystal that catches and
      refracts light into scattered rainbows; its beady eyes glow faintly with an inner luminescence, and delicate
      shards protrude from its spine like a crystalline mane.
    image: 19383836c19d719be273583b2baa9757a8cd4525b3d773e54ecc828d9fc65b5d.png
    spawns:
      - room: vault
        count: 2
      - room: gemstone_mineshaft
        count: 2
      - room: shining_crystal_mine
        count: 2
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: stone_fragments
        chance: 0.5
  clockwork_deer:
    name: a clockwork deer
    tier: standard
    level: 1
    description: A delicate brass stag no taller than a hound, with intricate copper gears visible through transparent
      panels along its flanks and neck, its antlers crafted from polished steel that catch the light with each
      mechanical tick of its movements. Its eyes glow with a faint amber luminescence, and wisps of steam occasionally
      escape from vents near its shoulders as it moves with an eerie, synchronized grace.
    spawns:
      - room: deep_clockwork_forest
        count: 3
    image: 94202d0ed57ecea852a93400b0dd7189454e91faee7c94e7ebfa3e10ba7963f2.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_sparrow:
    name: a filigree clockwork sparrow
    tier: standard
    level: 1
    description: A tiny mechanical bird no larger than a thumb, its delicate brass body intricately etched with scrolling
      patterns and barely-visible gears visible through transparent crystal panels; gossamer copper wings beat with a
      soft, rhythmic ticking as it hovers on diminutive springs, its jeweled eyes glowing a faint amber.
    spawns:
      - room: deep_clockwork_forest
      - room: clockwork_clearing
      - room: beside_clockwork_pond
    image: 4f0b9851a85ffd1b925dd6801d83f21cb4fc4610d9c38c32fa1573ae78e1dbd3.png
    behavior:
      template: wander
      params: {}
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_koi:
    name: a clockwork koi
    tier: standard
    level: 1
    description: A small mechanical fish with burnished copper scales that shimmer with an oily iridescence, its body
      wrought from interlocking gears and delicate brass plating. Rhythmic clicking emanates from within as crystalline
      fins of frosted glass rotate with hypnotic precision, propelling the diminutive construct through the air with
      unnaturally fluid grace.
    spawns:
      - room: wading_pond
        count: 2
    category: beast
    image: fa6161e40322460d3a4836754311d8473a8bf94f3a976cd0c18c88b3af64eddb.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_frog:
    name: a clockwork frog
    description: A diminutive brass automaton no larger than a fist, with segmented copper limbs articulated at delicate
      joints and a bulbous body etched with intricate gear patterns. Two luminous emerald gems serve as its eyes,
      casting a faint glow as they swivel with mechanical precision, while a small winding key protrudes from its back.
    spawns:
      - room: wading_pond
      - room: beside_clockwork_pond
    image: 48fb4bf8946a3efd4569b1dd39cbf622ac0c32c11be9daa970632619c77c06e5.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  clockwork_alligator:
    name: a clockwork alligator
    description: A small mechanical reptile with brass plating and copper joints, its segmented tail ticking rhythmically as
      it moves with jerky, predatory grace across the ground. Tiny gears visible through gaps in its corroded metal hide
      catch the light as it snaps its hinged jaw open and closed with a metallic clang.
    spawns:
      - room: clockwork_dias
        count: 2
    tier: elite
    category: beast
    image: 036fc6608c00aa8394614e25043d60cee96941d5e0fe93adb3b4679d4a75dcd6.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 1
  sea_anemone:
    name: a sea anemone
    description: A translucent, gelatinous creature no larger than a human fist clings to the seafloor, its stubby tentacles
      swaying gently in the currents with delicate, rippling motions. Soft hues of pale pink and cream shimmer across
      its translucent body, while its countless thin tendrils undulate hypnotically, seeking sustenance from the water
      around it.
    spawns:
      - room: coral_reef
        count: 2
      - room: ship_graveyard
      - room: underground_river
    image: 76004d44219adf97e79d0e2be8c461c08bf2007903468272b227856ac2e03732.png
    drops:
      - itemId: kelp
        chance: 0.5
  electric_eel:
    name: an electric eel
    description: A sleek, serpentine creature about two feet long with a mottled dark green and black body that glistens
      with moisture, its small beady eyes gleaming with predatory intelligence as faint blue arcs of electricity
      occasionally dance across its slick scales.
    spawns:
      - room: ship_graveyard
        count: 2
      - room: seaweed_thicket
      - room: sunken_ship_hull
    image: f348a12be66710585e8f8b0f18bf0b49ec53acac473b118d6bb40a34a6f30e8e.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: kelp
        chance: 0.5
  venomous_jellyfish:
    name: a highly venomous jellyfish
    tier: standard
    level: 1
    description: A translucent, bell-shaped creature drifts lazily through the water, its gelatinous body tinged with sickly
      purples and greens that seem to pulse with an inner toxin. Long, wispy tentacles trail beneath it like deadly
      threads, each one shimmering with a faint bioluminescent glow that marks their venom-laden nature.
    spawns:
      - room: coral_reef
      - room: seaweed_thicket
      - room: sandy_shoal
    image: 9f574217a3179c38c639fae887572aa196065e98e6d5148489925bc08a38e5e4.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: kelp
        chance: 0.5
  spiny_starfish:
    name: a spiny starfish
    tier: standard
    level: 1
    description: A small, brick-red starfish sprawls across the seafloor with five stubby arms, its surface bristling with
      blunt spines that give it a rough, defensive appearance; tiny suction cups line the undersides of its limbs as it
      slowly glides across sand and stone.
    spawns:
      - room: sandy_shoal
      - room: turbulent_waters
    image: 65dc0bea5548fda08505550546665f8423f410921b5fc9b16cde0afe03e7d74a.png
    drops:
      - itemId: kelp
        chance: 0.5
  kirot_aethiryn:
    name: Shade Kirot Aethiryn
    tier: elite
    level: 3
    description: An Alorae who has fallen — tall, with the frame of a divine being, but corrupted. Where a healthy Alorae
      radiates prismatic light, Kirot radiates a sickly darkness. His skin is pale and cracked, with veins of black
      energy visible beneath the surface. His eyes burn with cold green light. His vestments were once white and gold
      but are now stained, tattered, and rewoven with dark threads. He stands in a blighted landscape — dead trees, grey
      earth, withered crops — and from his outstretched hands, tendrils of dark magic reach into the ground, pulling
      skeletal and rotting forms upward. The dead rise around him in a spreading circle. His expression is calm,
      methodical, clinical — this is not madness, it is craft.
    spawns:
      - room: creeping_darkness
    image: 7342f15083fe82f02ea536995aac566b512ea3de9377a9b1c0ed6a7d9b8fe20e.png
  astriel:
    name: Astriel
    tier: standard
    level: 1
    description: A tall, radiant Alorae standing in golden subtropical farmland at sunset. He is luminous — prismatic light
      refracting from his skin, rainbows playing across his white and gold vestments. But his light is gentle here, not
      blinding — he is using it to bless the land. His hands are extended over rows of growing crops, and where his
      light touches the earth, plants surge upward, flowering and fruiting in fast-forward.
    image: eb5d7ef8b73570f181a24eb4561696726baf3b6fad3931178ce70610a3f3916e.png
    spawns:
      - room: heralds_of_creation
  ambuoroko:
    name: Ambuoroko
    tier: standard
    level: 1
    description: A figure of dark, billowing shadow wrapped in a magnificent ornate cloak, standing atop a rocky outcropping
      overlooking a vast battlefield. Glowing blue eyes burn intensely from within the churning darkness of the hood —
      the only solid feature in the smoke. His hands are extended and from them erupts an enormous display of arcane
      power — cascading blue and white lightning, spiraling geometric patterns of pure magical energy, reality itself
      bending around him. The scale is devastating — the magic he channels dwarfs the landscape below. His cloak billows
      dramatically in the energy discharge.
    image: e0a8f7cd6c08084fc10c83ea4aa3fb8829a9995bb4c51f59e4c9dfc56f23fd02.png
    spawns:
      - room: resistance_camp
    role: prop
  elustriaine:
    name: Elustriaine
    tier: standard
    level: 1
    description: A smaller, younger-looking version of Aineroia — the same Lustriae features, translucent diaphanous wings,
      dark hair, dark eyes, pale mother-of-pearl skin - but more compact, fiercer, with an edge of wildness. She wears
      layered silks in neon pastel tones — bright and cheery — draped and wrapped in a traveling style, with coin
      bracelets on both wrists that catch the light. The bracelets are prominent — scale-like or coin-like metal pieces
      that jingle with movement. A small crossbow is slung at her hip. Her dark hair is wild, adorned with small coins
      and silk ribbons. She has rainbow, diaphanous wings extending from her back like enormous stained glass windows
      that seem to emit an otherworldly light.
    image: d3b4971d6b0c9e63636debab14dbb589cfb277250d593c58bed4d9bf8c8dfbed.png
    spawns:
      - room: resistance_camp
    role: prop
  geode_fragment:
    name: an animated geode fragment
    tier: standard
    level: 2
    description: A fist-sized chunk of rough grey stone shambles forward on tiny crystalline legs, its cracked exterior
      splitting open to reveal a jagged interior of glittering purple amethyst that catches the light with an eerie,
      pulsing shimmer.
    image: 4d97001049c36770387bd9aef568fd28488bc3cc2ce4fb1bf99b240fffd43d7a.png
    spawns:
      - room: mine_opening
      - room: shining_crystal_mine
      - room: gemstone_mineshaft
      - room: vault
        count: 2
    drops:
      - itemId: stone_fragments
        chance: 0.75
  crystal_drake:
    name: the Crystal Drake
    tier: boss
    level: 1
    description: A massive serpentine creature coils with regal menace, its scales formed entirely of razor-sharp
      crystalline facets that refract light into cascading prismatic rainbows across every surface it touches. Two
      enormous wings of translucent amethyst membrane stretch wide behind a horned head crowned with jagged spires of
      pure quartz, its piercing eyes glowing with an inner violet luminescence.
    spawns:
      - room: vault
    image: e061aa58425340394caf82a9356177ea87cacf879ad05d153cb7d0d0bc3e19c6.png
    drops:
      - itemId: quartz_bootz
        chance: 1
      - itemId: stone_fragments
        chance: 0.8
  magma_spawn:
    name: a magma spawn
    tier: standard
    level: 2
    description: A small, roughly humanoid figure formed from cooling volcanic rock, its cracked obsidian shell glowing a
      fierce orange-red at the seams where molten magma churns just beneath the surface.
    spawns:
      - room: gemstone_mineshaft
      - room: shining_crystal_mine
    image: b7d4f4ed496b31348dfbbebeea9326e32e64b9dc8c6afa67aa7f01acdc102c7c.png
    behavior:
      template: wander
      params: {}
    drops:
      - itemId: stone_fragments
        chance: 0.5
  stalactite:
    name: a furious stalactite
    tier: standard
    level: 2
    description: A jagged spike of pale limestone hangs motionless from the cave ceiling, its wet surface glinting faintly
      in the dim light, a thin crack running along its length suggesting it is moments from breaking free.
    spawns:
      - room: void_below_mountain
      - room: mine_opening
    category: elemental
    image: b9da025e285409e7aec3cd050c2083342d63d4bf8e7d8f54fe35959bca2779cd.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  stalagmite:
    name: a giggling stalagmite
    tier: standard
    level: 2
    description: A small, lumpy column of pale grey stone rises from the cave floor, its rough mineral surface etched with a
      crude, unsettling grin of jagged calcite teeth that seems to widen whenever no one is looking directly at it.
    spawns:
      - room: void_below_mountain
      - room: gemstone_mineshaft
    category: elemental
    image: 07dab737592b2d8419e04d5d18cfffe3a3ee42bf65f6366edaed6ace5833500f.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  fanged_jackelope:
    name: a fanged jackalope
    tier: weak
    level: 2
    description: A small, tawny-furred rabbit crouches low to the ground, its oversized antlers still velvet-soft and
      slightly crooked, while two tiny but wickedly sharp fangs curl over its lower lip.
    spawns:
      - room: foothills_kaerinlith
      - room: path_kaerinlith
      - room: clockwork_clearing
      - room: arrival_king
    image: 1daa5765c57ca44f672e8b7ee70651ef918097930751d9dee68b0e20c254a829.png
    behavior:
      template: wander
      params: {}
  malkuth:
    name: Malkuth
    tier: standard
    level: 1
    description: "A distinctly human man dressed like a caricature of a king or lord. He is handsome in a cold, calculated
      way — sharp features, dark hair, pale skin. His clothing is absurdly elaborate — layer upon layer of royal
      regalia, gold crown encrusted with too many jewels, fur-trimmed robes over embroidered tunics over silk shirts,
      rings on every finger, chains of office stacked upon chains of office. He has overdone it. "
    spawns:
      - room: arrival_king
    role: prop
    image: b9467a3b108bb570f9810860977fde1efac477247fab8677638c63956ab88dc4.png
  mechanical_fortune_teller:
    name: a mechanical fortune teller
    tier: standard
    level: 1
    description: A small, weathered automaton encased in a glass cabinet, its brass gears and clockwork face visible through
      cracked panes, glass eyes glowing with a faint amber light beneath a painted turban of chipped red and gold.
    spawns:
      - room: carnival_prophecy
    role: prop
    image: 6fd7c6a10d8c6206c1af8fab86ce9c61acc32e60e5083572f9a6bcabe6e70c5c.png
  kvarcgagap_fragments:
    name: broken fragments of Kvarcgagap
    tier: standard
    level: 1
    description: Scattered across the ground lie jagged shards of translucent quartz, each fragment still faintly pulsing
      with an inner iridescent light — pale golds, blues, and violets shifting like trapped opalescence beneath a
      cracked and cloudy surface, as though something divine and liquid once filled them but has long since drained
      away.
    spawns:
      - room: great_betrayal
        count: 2
    role: prop
    image: f21d8bd898f0a3f88892e6ec335f9f3abb25ad2a0a1fef3281972f4a8e4988f9.png
  time_wraith:
    name: a time wraith
    tier: standard
    level: 2
    description: A wispy, translucent figure drifts just above the ground, its tattered shroud shifting between moments like
      a flickering candle flame, now solid, now barely a shimmer of pale silver and faded grey. Empty hollow eyes glow
      with a dim, ghostly light, and its elongated fingers trail behind it like smoke dissolving into forgotten time.
    image: b7d0eaa3b8e5a2d186ada591fbcd478fe223195aa755ffedbd99c73dd5ca3ada.png
    spawns:
      - room: obsidian_dagger
      - room: carnival_prophecy
      - room: lustriae
    behavior:
      template: wander
      params:
        maxWanderDistance: 10
  emberfell_tessikar:
    name: Tessikar the Springwright
    tier: standard
    level: 1
    description: A stout dwarf figure in a heavy leather apron, his arms corded with muscle and streaked with old burn
      scars, stands with the quiet confidence of someone who has bent the world to the shape of his hammer. Flecks of
      obsidian dust glitter in his beard and along the creases of his weathered knuckles, and a faint ember-glow lingers
      in his eyes like the last sparks of a forge that never fully cools. One eye is replaced by a clockwork mechanism
      that whirs and focuses with mechanical precision, its lens glowing faintly amber. One arm is entirely mechanical —
      brass and copper gears, pistons, and articulated fingers that move with impossible delicacy.
    image: e101d7723c8dd2563c98d3b3b5dea3d05eb9c7b7d30d7676c4b19e48138784ef.png
    spawns:
      - room: emberfell
    role: prop
  void_elemental:
    name: a crackling void elemental
    tier: standard
    level: 2
    description: A wispy, translucent figure of swirling darkness crackles with faint purple-white sparks along its
      ever-shifting edges, its vaguely humanoid form constantly dissolving and reforming as though struggling to hold
      itself together. Twin pinpricks of cold violet light serve as eyes, flickering unsteadily within the hollow depths
      of its amorphous, shadowy mass.
    spawns:
      - room: world_seed
        count: 2
      - room: obsidian_dagger
      - room: clockwork_battle
        count: 2
      - room: memory_creation
    image: e961a698f6f079e266dd8bcc640e9786adacfe0972df39e083b898c8396ef6de.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
    drops:
      - itemId: stardust
        chance: 1
  archae_healer:
    name: a humble Archae healer woman
    tier: standard
    level: 1
    description: A slender Archae woman with waist-length dark hair and sharp, slightly pointed ears stands with quiet
      composure, her extremely pale skin almost luminous against the simple earthen robes she wears. Her dark, attentive
      eyes carry a calm warmth, and a small pouch of herbs and wrapped linen bandages hangs at her hip.
    spawns:
      - room: humble_forest_cabin
    role: prop
    image: 0c9772fd134cc6620b2945f67eb5f5cf21af2a1ecda072c3bbcce0ebb0aff3ad.png
  doctor_reinheart:
    name: Doctor Reinheart
    tier: standard
    level: 1
    description: a young Kitsarae reindeer scholar, a humanoid woman with animalistic features. She is a world renowned
      scholar and an expert in every field. She provides refreshment and training for new heroes, and a friendly ear to
      the residents of Auringold.
    image: 47ac7830fb16cae073c6844ffb2be8b4a3ef3baefa993ea4b18bfcbe4b6aa03a.png
    spawns:
      - room: auringold_tavern
  madame_herb:
    name: Madame Herb
    tier: standard
    level: 1
    description: "A smaller Sylflorae formed entirely from dense tangles of living flowers, vines, and root-fibers gathered
      into the rough shape of a creature. Its body has no clear anatomy beneath the growth; instead, layered iris
      petals, curling stems, moss, and flowering tendrils continuously weave and shift against one another as it moves.
      Long streamer-like leaves trail behind it like flowing hair, while great blooming irises open and close across its
      body in response to mood and attention. "
    spawns:
      - room: cozy_inn
    role: prop
    image: 4ad06118ad72d78e8f2ee0f5841d5128b1b0a56c0adfcd492b2d63fc7f5c97b6.png
  shadow_of_betrayal:
    name: a shadow of betrayal
    tier: standard
    level: 3
    description: A wispy, humanoid silhouette of deep violet-black smoke drifts silently just above the ground, its
      featureless face turned slightly away as though perpetually averting its gaze. Faint, jagged cracks of sickly
      green light fracture across its translucent form, pulsing with a dim, unsettling glow.
    spawns:
      - room: royal_wedding
      - room: betrayer_study
      - room: royal_graveyard
    image: 07fe0d3cf6c6ea0a7b5bd910ee3e22841019f9482a4023314bd78d68a5617578.png
  grief_aineroia:
    name: Aineroia
    tier: standard
    level: 1
    description: "A tall, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — dark hair,
      dark eyes, softly rounded ears but she is taller, broader. She walks through the garden, holding a children's
      fairytale book, telling stories that spiral outward as golden magic, forming shapes in the air — the ghostly
      silhouettes of fantastical creatures taking form: a phoenix, a dragon, a glowing jellyfish, a tiny shimmering
      pixie. Her expression is not triumph but grief — tears streaming down her dark eyes even as she creates."
    role: prop
    spawns:
      - room: royal_graveyard
    image: 671b6a806d82be72dd584c67ce8360672f1ef29b5f645592767b5f1b7df372ba.png
  wandering_spirit:
    name: a wandering displaced spirit
    tier: weak
    level: 3
    description: A translucent, softly glowing figure drifts aimlessly just above the ground, its ethereal form flickering
      between visibility and absence like a candle flame caught in the wind. The ghostly silhouette appears vaguely
      humanoid, its edges dissolving into wisps of pale blue-white mist, features blurred and expression vacant — caught
      in a state between worlds.
    category: undead
    spawns:
      - room: arcane_tempest
        count: 3
      - room: caldera
        count: 4
      - room: shattered_fae_wood
        count: 2
    image: bb1a99c775d1da90396a3d30bc0a35e7de6c0c699e801fad9cf846695fd55bd9.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 8
  venus_flytrap:
    name: a slithering adventurer-eating venus flytrap
    tier: standard
    level: 3
    description: A knee-high carnivorous plant with a wide, tooth-lined snap-jaw blossom dripping with translucent digestive
      fluid, its mottled green and crimson leaves bristling with coarse trigger hairs. It sways hypnotically on a thick
      fibrous stalk.
    category: elemental
    image: be307292e792aed70a3f162def03b9e6f2f58240ad9dbaef7b9c28c73f375c38.png
    spawns:
      - room: verathaios_workshop
        count: 2
      - room: caldera
  pitcher_plant:
    name: a walking pitcher-plant with venomous tentacles
    tier: standard
    level: 3
    description: A squat, bulbous green plant shuffles forward on a tangle of pale root-like legs, its wide-mouthed pitcher
      glistening with sweet-smelling digestive fluid. Slender, violet-veined tentacles writhe lazily around its base,
      their tips beaded with tiny drops of shimmering amber venom.
    spawns:
      - room: verathaios_workshop
      - room: caldera
    image: 8c76195912a12c4a99b83f196b35f76187cf05ad7d7608033010dfe7834e6497.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
  knowledge_gremlin:
    name: a tiny knowledge-stealing gremlin
    tier: weak
    level: 3
    description: A knee-high wrinkled creature with oversized ears and bulging yellow eyes crouches low to the ground, its
      spindly fingers perpetually twitching as though eager to snatch something away. Tattered scraps of stolen
      parchment and broken quill tips are tucked haphazardly into its patchy, matted fur.
    spawns:
      - room: aolexia
        count: 2
      - room: aolia
      - room: shattered_fae_wood
        count: 2
    image: 362b835f5cd396fb77ac83db6aa42c3d6051fa9fa0e98a2f097e5821fb04fd3a.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
  flowerpetal_phoenix:
    name: a phoenix formed from flower petals
    tier: standard
    level: 3
    description: A small, delicate bird composed entirely of softly layered flower petals in shades of blush pink, coral,
      and gold, their edges catching the light like living flame. Its wings trail wisps of pollen dust as it moves, and
      tiny ember-like sparks drift upward from its feathered crest like floating seeds on a warm breeze.
    spawns:
      - room: verathaios_workshop
      - room: aolia
      - room: caldera
    image: 7ea03618091c6e2f58bea732fe29f4e0d7255f856b980344941c9ff5baa31441.png
    category: beast
  dancing_couple:
    name: Shade of Aineroia and Malkuth at the Wedding
    tier: standard
    level: 1
    description: "A ghostly memory-shade flickers with translucent luminescence, depicting a tall faerie bride — iridescent
      pale skin, dark eyes, dark hair crowned with a delicate crystal tiara — swathed in billowing diaphanous silks and
      scattered flower blooms, her softly rounded ears and broader frame marking her as something between mortal and
      fey. She dances in the arms of a sharp-featured human man draped in an almost comical excess of royal finery:
      jewel-encrusted gold crown, fur-trimmed robes layered over embroidered tunics, fingers lost beneath rings, and
      chains of office heaped upon chains of office — handsome in a cold, deliberate way, every inch of him calculated
      pageantry."
    spawns:
      - room: royal_wedding
    role: prop
    image: 2ac43f5ce14dea2ead7af04644ee79d0edcfb508746cf6845445dc1ab2e5e6da.png
  aineroia_ascended:
    name: Ascended Aineroia
    tier: standard
    level: 1
    description: A tall, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — dark hair,
      dark eyes, softly rounded ears but she is taller, broader. She has rainbow, diaphanous wings extending from her
      back, taller than she is, like enormous stained glass windows. She is dressed in fae garb, like the forest itself
      grew over her to provide clothing, with moss and vines, leaves and blooms forming a living gown.
    spawns:
      - room: aineroia_cottage
    role: prop
    image: be10142633109bfa80fe6af2b650b8f5a7a9cea68a6ab4eeb8efb718dc403520.png
  lustriae_guard:
    name: A Lustriae Guard
    tier: standard
    level: 3
    description: A short, luminous man with delicate features and pale iridescent skin of a Lustriae faerie — pastel hair,
      dark eyes, softly pointed ears. He has jade colored diaphanous wings extending from his back. He is dressed as a
      fairy guard, like the forest itself grew over him to provide clothing, with bark, leaves thorns forming a living
      military uniform.
    spawns:
      - room: aineron
    image: 020fce38e0c6c7f7742dd20f8bb4b4c9ee48b925257485ed3ea7ba3320ca6087.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
  lustriae_diver:
    name: Lustriae Pearl Diver
    tier: standard
    level: 3
    description: A short, luminous woman with delicate features and pale iridescent skin of a Lustriae faerie — pastel hair,
      dark eyes, softly pointed ears. She has 青 colored diaphanous wings extending from her back that shift in the light
      like a stormy sky. She is dressed as a fairy pearl diver, like the ocean itself grew over her to provide clothing,
      with coral, seaweed and shells forming a living bathing suit.
    spawns:
      - room: faegrimm
    image: 0159feb25f2c94da4248680a09a46dfe1c64f2fc0c434be1e5c3de31b8e16372.png
  pyrae_faeweaver:
    name: Pyrae Faeweaver
    tier: standard
    level: 3
    description: A slender humanoid figure draped in woven garments threaded with living vines and luminous amber filaments,
      their ember-warm skin casting a soft ruddy glow across the surrounding leaves. Their hair drifts upward like
      slow-rising flame in shades of copper and gold, and their eyes hold a calm, smoldering light — fingers laced with
      creeping tendrils of enchanted greenery that curl and bloom at their touch.
    spawns:
      - room: pyrae
    image: 0f01013216690d2d4f027cacf48128e857486d6c37d42d2a6793ed5220561bf7.png
    toughness: -1
    hpMult: 0.8
    dmgMult: 0.8
    xpMult: 0.8
    goldMult: 0.8
  aureliae_starweaver:
    name: Aureliae Starweaver
    tier: standard
    level: 3
    description: A boneless, translucent humanoid figure draped in flowing robes and floating crystal-clasped armor, their
      gelatinous form faintly revealing luminescent internal structures beneath the skin, crowned by a pulsing jellyfish
      bell that casts pale blue and violet light across the surrounding dark. Fingerless, tapering hands raise toward
      the night sky as threads of starlight weave between them into shimmering geometric patterns, while long
      phosphorescent tentacle-hair trails behind them and spreading tendrils anchor their formless lower body to ground
      scattered with softly glowing celestial motes.
    spawns:
      - room: aureliae
    image: 3d76a01b85ff09d65b21e7bd96f9b5ea1d9c0b50162c6a64b3df47a47910f107.png
  ophirae_diplomat:
    name: Ophirae Diplomat
    tier: standard
    level: 3
    description: A fully reptilian dragon-humanoid with a distinct dragon head — scaled snout, frilled or horned crest,
      intelligent golden eyes. Their entire body is covered in iridescent blue-green scales. Clawed hands and feet, a
      long tail. Small draconic wings with translucent fin-like membranes. Wearing a flowing white robe or kimono-like
      garment draped over their scaled body, adorned with seaweed, coral beads, and shell necklaces. They should look
      like an eastern sea dragon who got dressed for a diplomatic meeting — regal, ancient, clearly not mammalian in any
      way. A creature of deep water and open sky.
    image: 75a779ab774e3d27f198aae2e676979dffbf6fd136e0cff8ea4080f6bc4ce4fd.png
    spawns:
      - room: ophirae
  mycorae_merchant:
    name: Mycorae Merchant
    description: "A Mycorae, an enchanted fungal forest guardian, sitting among tiny mushrooms in a glowing woodland
      clearing at sunset. The creature is composed entirely of various mushrooms, made from dark mycelium, moss, and
      layered mushroom flesh. Instead of a head, it has an enormous ruffled mushroom cap. It is crowned by a huge
      layered orange-red mushroom cap, wide and fan-shaped, with wavy frilled edges, pale gill ridges, and soft golden
      highlights. Its body is covered in overlapping shelf mushrooms and petal-like fungal plates in red, coral,
      magenta, violet, and deep purple. "
    level: 3
    spawns:
      - room: mycorae
    image: 353d9b49c12e17a34459ad2ce64b01bee2f0fb60ac9c1588a23a760d03e06539.png
  messenger_tessikar:
    name: Tessikar's Messenger
    tier: standard
    level: 1
    description: A slender brass automaton stands with poised, courier's alertness, its torso etched in flowing scrollwork
      that pulses with faint golden light as though carrying a message written in living flame. Transparent panels at
      its wrists and temples reveal tiny spinning gears, and tucked beneath one articulated arm is a sealed cylindrical
      case of dark lacquered wood banded in polished copper.
    spawns:
      - room: tessikon
    image: a1025a60961a303f4dba0adfc41d48d3961008d605c6a90fbc0c6f94cf931ee9.png
    dialogue:
      root:
        text: Greetings adventurer!  Are you here for Scrollwright training? Or perhaps because Tessikar the Springwright is
          working on a new and marvelous invention to portal young heroes like yourself to the forest outside Tessikon
          for training. Unfortunately, the device is still under construction. Check back soon for updates!
        choices:
          - text: What is Scrollwright training?
            next: scrollwright
          - text: I'll check back soon, thanks.
      scrollwright:
        text: 'Scrollwrights create and maintain mechanical constructs that help them in battle, by absorbing damage or
          attacking their enemies. These mechanical "pets" often have their own special abilities and require
          maintenance to keep them in working condition. '
        choices:
          - text: What kind of maintenance?
          - text: I'll check back soon, thanks.
      maintenance:
        text: Scrollwrights study methods of repairing and enhancing their constructs to help them to recover from the damage of
          battle. They should also dismiss and rebuild the construct as their power increases, resulting in more
          powerful pets.
        choices:
          - text: I'll check back soon, thanks.
  snapdragons:
    name: a fire-breathing snapdragon
    description: A small, vivid crimson flower with snapping petals shaped like a dragon's maw, its pistils glowing faintly
      amber as tiny licks of flame curl from between its blooms with each hungry bite of the air.
    spawns:
      - room: night_wind
        count: 2
      - room: desert_sands
      - room: verathaios_workshop
    level: 3
    image: b5b2f6cc00a6ebce1c9b4f42e90114b07f98463b240882ffeb9ef8164fc59e37.png
  luneqrae:
    name: Luneqrae
    tier: elite
    level: 3
    description: Pure white smoke and swirling mists run across the countryside, forming the vague outlines of spectral horses.
    spawns:
      - room: luneqrae
        count: 3
    category: beast
    image: cb12f34ef06f7f3850139e78ee901a4f5a88d1dc57beebf82863a9bf0fe0d088.png
  aetherae_stablemaster:
    name: Aetherae Stablemaster
    tier: elite
    level: 4
    description: A figure made of dark, billowing shadowy smoke, wrapped in a heavy ornate cloak with intricate embroidery
      and clasps. The cloak is richly detailed and clearly physical — the body within it is not. Where the cloak opens
      or where a face should be, there is only roiling dark fog, dense and slowly churning. No visible features, no
      solid form beneath the garment — just darkness. The smoke curls and wisps at the edges of the cloak's hood and
      hem.
    spawns:
      - room: aetherae
    image: 50626dba0a001ae306255584daf8a24da879f9e4aab2e6b62af5408993280a39.png
  doktuk_malukae:
    name: Doktuk Mulkae
    description: A towering, broad-shouldered figure of sun-baked terracotta hide, etched with pale mineral veins that catch
      the light like cracked desert stone, stooped slightly beneath the weight of a massive flat rock clutched to its
      chest like a sacred tome. Its deep-set eyes hold a ponderous, straining intensity beneath a heavy brow ridge
      dusted with fine crystalline sediment.
    spawns:
      - room: desert_sands
    level: 3
    tier: standard
    image: 14488cf9f196ee14e6a9387e5a3401f662420d828ed83aba59e9b9249dbad595.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
      - itemId: stone_fragments
        chance: 0.5
  graktuk_malukae:
    name: Graktuk Malukae
    tier: standard
    level: 3
    description: A hulking humanoid of sun-baked terracotta hide and granite-grey undertones, its massive frame hunched with
      slow, brutish power, thick limbs scarred from countless contests of strength. Rough-hewn loincloths of cured
      leather hang from its waist, and its fists are calloused and cracked like ancient stone, ever ready to grapple.
    spawns:
      - room: desert_sands
    image: a2557f41431dd9868e3aa1eacedc187ae227be71c53a81934b7b93069d478c1c.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
      - itemId: stone_fragments
        chance: 0.5
  avatar_krioshaeu:
    name: Tea in the Afterlife
    tier: standard
    level: 1
    description: Two women having tea in a small, cozy cabin. A roaring fire in the hearth. The scene is intimate, warm,
      quiet — the most important meeting in Ambon's cosmology rendered as the most ordinary moment imaginable. Aineroia
      sits on one side of the table. She is tall, luminous, with the pale iridescent skin and delicate features of a
      Lustriae faerie — dark hair falling past her shoulders, dark eyes that carry immeasurable depth, softly rounded
      ears. Translucent diaphanous wings folded behind her shimmer faintly with blues and violets. She wears simple
      robes — not the regalia of a goddess but the clothes of a woman visiting a friend. She holds her teacup in both
      hands. Her expression is soft, warm, a little sad — the way a mother looks when she's been talking about her
      children. Krioshaeu sits across from her. She is also Lustriae — pale iridescent skin, salt-and-pepper hair
      streaked with grey, dark eyes — but wilder, more eccentric. The only faerie who looks aged. Her clothing is
      colorful and deliberately mismatched — patchwork silks, embroidered scarves in clashing patterns, a wide-brimmed
      hat adorned with flowers, feathers, and small dangling charms sitting on the table beside her teacup. Large,
      strong black raven wings — not translucent like Aineroia's but solid, dark, feathered — are folded comfortably
      behind her. She is mid-laugh or mid-sentence, gesturing with one hand while the other holds her cup. Her eyes are
      kind and ancient and slightly wild. She looks like someone who knows how every story ends and has decided to enjoy
      the telling anyway.
    spawns:
      - room: krioshaion
    role: prop
    image: 42617fd81c29b5614f557d19a4ef8c7babdbb97225aaf8063e73bb7bdde0ff6e.png
  undead_wight:
    name: an undead wight
    tier: weak
    level: 4
    description: A gaunt, pale-gray humanoid figure draped in tattered burial shrouds, its sunken hollow eyes glowing with a
      faint, cold blue light. Wisps of dark shadow cling to its emaciated form as it shuffles forward with stiff, jerky
      movements, bony fingers outstretched.
    spawns:
      - room: necrambon
        count: 3
      - room: yaleron
        count: 2
    image: 809446bfec7b56e8f851dab2a6ec334f2287b39595b8d99d9aebde31232f9f42.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
  scarab_spider:
    name: a creeping scarab spider
    tier: weak
    level: 4
    description: A small, unsettling creature with the glossy black carapace of a scarab beetle fused to the twitching legs
      of a spider, its iridescent shell catching the light with flickers of dark green and purple as it skitters low to
      the ground.
    spawns:
      - room: necrambon
        count: 3
      - room: yaleron
    image: cdf341bab27780f2cb2c9023527c5e99ed3f796a3056b55640a94fab5348d1bc.png
    behavior:
      template: wander
      params: {}
  kitsarae_ship_captain:
    name: Kitsarae Ship's Captain
    tier: standard
    level: 3
    description: A tall, broad-shouldered figure draped in a salt-worn naval coat, his body covered in sleek white and grey
      feathers that ruffle slightly in the sea breeze, with a long hooked beak and sharp amber eyes that carry the
      weathered authority of countless ocean voyages. A battered captain's hat sits cocked atop his feathered head, and
      a worn leather satchel of charts and manifests hangs at his side.
    spawns:
      - room: lyrasael
    image: c459b74e96fae423fdff503aaab9b73e84dfb4caab489fbf32875421e51d5b33.png
  rogue_spore:
    name: a cloud of rogue spores
    tier: weak
    level: 3
    description: A drifting, translucent haze of pale greenish-yellow particles floats lazily through the air, barely
      visible except where clusters of tiny luminescent spores catch the light in soft, eerie pulses.
    spawns:
      - room: voxspore
        count: 3
    image: 8e16d53e4133f2003fd70f642fe0e254fb11876a996baafde1ff7bd2a183c2a5.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 1
  bad_dream_pickpocket:
    name: a bad dream turned pickpocket
    tier: weak
    level: 4
    description: A wispy, translucent child-like figure with hollow dark eyes and tattered smoky rags, its insubstantial
      fingers nonetheless nimble and quick as it drifts unnervingly close. The faint impression of a grinning face
      flickers across its ghostly features, half-forgotten and unsettling, like a dream slipping away at dawn.
    spawns:
      - room: voxspore
        count: 2
      - room: night_wind
        count: 2
      - room: moon
      - room: yaleron
    image: 6ad5290d3c1b76ac2f7433738ad98b1107c029f89a194e38d653a08415cdbfd9.png
    behavior:
      template: wander
      params: {}
  banished_nightmare:
    name: a banished nightmare
    tier: weak
    level: 4
    description: A wispy, translucent shadow-wraith barely larger than a human child, its tattered dark form flickering like
      a dying flame as hollow white eyes stare out from an ever-shifting face of smoke and despair. Thin tendrils of
      darkness curl from its edges, dissolving into nothing before they can fully take shape.
    category: aberration
    image: 46ffaeec8388b3edbb1969cefd03c6fec6cff3bca810b3318b839bf429a3def7.png
    spawns:
      - room: moon
        count: 2
      - room: night_wind
  undead_scout:
    name: an undead scout
    tier: standard
    level: 3
    description: A gaunt, hollow-eyed corpse clad in tattered leather armor, its pale grey skin stretched tight over sharp
      bones, moves with a stilted, lurching gait, scanning its surroundings with milky, unseeing eyes.
    spawns:
      - room: resistance_camp
    image: f89bed7599859d49e5502b06d650a0684d1238bb1d8495d919b799e63f1a49a2.png
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
  uehma:
    name: Uehma the Fairytale Librarian
    tier: standard
    level: 1
    description: A small mandarin duck stands upright with scholarly composure, his striking plumage a breathtaking mosaic
      of iridescent teal, burnt orange, cream, and deep burgundy, with twin amber sail feathers fanning elegantly from
      his back like the pages of an open book. He peers over a pair of tiny wire-rimmed spectacles perched at the tip of
      his rosy bill, dressed in a miniature patchwork robe stitched from fragments of illustrated storybooks, the faded
      ink still shimmering faintly as if the stories refuse to stay still.
    spawns:
      - room: library_fairytales
    image: d76a4e596631ff4bbf193525d9899735721d01e78d191bc3a76acc6c642bbabc.png
  madam_daydreams:
    name: Madam Daydreams
    tier: standard
    level: 1
    description: A plump, drowsy-eyed woman draped in layers of mismatched silk and lace, her graying hair pinned loosely
      with a cluster of faded flowers that seem perpetually on the verge of tumbling free. She sways gently on her feet
      as if half-lost in some pleasant reverie, her unfocused gaze drifting just past you toward something only she can
      see.
    image: c94d4380439f0c435ba33480bd771f9eeb629ffc3538d878e30885ebae11f270.png
    role: vendor
    spawns:
      - room: general_store
  creeping_ivy_hotel_receptionist:
    name: Creeping Ivy Hotel Receptionist
    tier: standard
    level: 1
    description: Tendrils of creeping ivy grow over the front desk, culminating in violet blooms.
    spawns:
      - room: dream_hotel
    role: prop
    image: d46c76bb992a1dae5fb571e78945e2a8b58b9ae0f64384e662b5025fadfc79e2.png
  alorae_refugee:
    name: Alorae Refugee
    tier: standard
    level: 1
    description: Tall and ethereal with translucent, luminous skin that refracts light into impossible spectrums of deep
      purple, golden yellow, and silvery blue. The body appears delicate yet substantial, with graceful proportions and
      an almost crystalline quality to the flesh. Soft prismatic halos shimmer around the form, shifting colors with
      emotion. Eyes glow with inner starlight. Hair flows like captured cosmic wind. The overall presence seems to
      subtly bend surrounding air and light, creating an effect of gentle distortion around the figure. Wrapped in
      tattered robes and unusually thin, with a reduced lustre.
    spawns:
      - room: call_for_heroes
    role: prop
    image: 5bb9b1fb976743a1b4b043f28420bfd814949dc7d0a72848171ce0da81547d1f.png
  lithae_blacksmith:
    name: Lithae Blacksmith
    tier: standard
    level: 3
    description: A stocky crystalline figure stands at the forge, its faceted obsidian-black body threaded with deep ruby
      veins that pulse faintly with internal light, rough-hewn angles and sharp geometric limbs still bearing the
      unpolished edges of youth. Its hammer-worn hands catch the firelight in dull prismatic shards, apron replaced by a
      natural breastplate of fused mineral growth, and each strike of its tools sends hairline vibrations rippling
      visibly across its translucent torso.
    spawns:
      - room: vulgorth
    image: 239f01130f74f94eba1cae3c613780eba609af8e2da8e3cbd6db8aaa6b3908a5.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
  fungus_gnat:
    name: a Fungus Gnat
    tier: weak
    level: 4
    description: A tiny, delicate insect with translucent wings veined in pale grey, its slender dark body barely larger
      than a thumbnail. It drifts lazily through the air in erratic loops, drawn toward damp earth and the faint glow of
      bioluminescent mushrooms nearby.
    spawns:
      - room: mycollum
        count: 3
      - room: mycorae
    image: bcd8ce4eb087c0040a6b5ed0f006a99ec5328cef44175c7bd2587bf11ea8fd36.png
  snapping_turtle:
    name: an iridescent snapping turtle
    tier: weak
    level: 4
    description: A small, ancient-looking turtle with a hooked beak and a rough, algae-darkened shell that shimmers with an
      unexpected rainbow sheen when caught in the light. Its leathery neck and stubby clawed feet are mottled
      grey-green, and it regards the world with beady, suspicious eyes from the muddy shallows.
    spawns:
      - room: aureliae
      - room: lagauri
      - room: phosmaren
    category: beast
    image: a9b2b70f0d8a3192cef7510dcad6c86a54a051b4805438063983b2acb2de1286.png
    drops:
      - itemId: kelp
        chance: 0.5
  ocean_sunfish:
    name: a vicious ocean sunfish
    tier: standard
    level: 3
    description: A massive, silvery-gray disc of a fish drifts through the water with eerie slowness, its truncated, finless
      body giving it the unsettling appearance of a swimming head with no tail. Two tall, rigid fins extend from its top
      and bottom, and its small, puckered mouth lends it a permanently bewildered expression despite its enormous,
      car-sized bulk.
    spawns:
      - room: lagauri
        count: 2
      - room: phosmaren
    image: dedc65636ea6fcf55561eb4c5f3697783da9f7d645c58812ecb5f4631fc6db36.png
    drops:
      - itemId: kelp
        chance: 0.5
  rust_nymph:
    name: a creeping rust ooze
    tier: weak
    level: 3
    description: A slow-moving blob of reddish-brown slime oozes across the ground, its gelatinous body flecked with
      corroded metal fragments and orange powdery rust that leave faint stains wherever it passes. Its translucent form
      occasionally catches the light, revealing dark clumps of dissolved iron suspended within like grim inclusions in
      amber.
    spawns:
      - room: vulgorth
        count: 3
    image: bcba2928d7c873268bf4f4e3da13ccb0c50a3699687b4071458bdc433b29618d.png
    drops:
      - itemId: broken_clockwork_gears
        chance: 0.5
  fire_snail:
    name: a fire snail
    tier: weak
    level: 4
    description: A tiny snail with a dull ember-orange shell streaked with ash-grey, its soft body glowing faintly like
      cooling coal as it leaves a thin trail of scorched slime behind it.
    spawns:
      - room: mycollum
        count: 2
      - room: voxspore
        count: 2
    image: a8cd367b82966fbba9daca60d67f19230844b77ee8a2265ee2cfe4804640458b.png
  burrowing_barnacle:
    name: a burrowing barnacle
    tier: standard
    level: 1
    description: A pale, thumbnail-sized crustacean clings to a rocky surface, its ridged white shell streaked with gray and
      edged in barnacled teeth that scrape and rasp against stone.
    spawns:
      - room: lyrasael
        count: 3
    image: 32528c6079c7a1d3c9993c4a28840c53885119de3b150f708ed1caed5a4f7893.png
    drops:
      - itemId: kelp
        chance: 0.5
  lemprey_leviathan:
    name: a lamprey leviathan
    tier: standard
    level: 3
    description: A massive, pale-fleshed serpentine creature coils through the water, its enormous circular maw lined with
      countless rows of jagged, inward-curving teeth that glisten with viscous slime. Its translucent, eel-like body
      shimmers with sickly iridescent hues, dark spots running along its length like bruises beneath the skin.
    spawns:
      - room: ophirae
      - room: thalvorek
        count: 2
    category: beast
    image: 4e3e91cbe4cdebcd6302057d19e4a577860620535c90b0ae07b01bc0faaa05f3.png
    drops:
      - itemId: kelp
        chance: 1
  glass_urchin:
    name: a glass urchin
    tier: weak
    level: 4
    description: A small, translucent sea creature rests motionless on the ocean floor, its delicate crystalline spines
      refracting light into tiny scattered rainbows across the surrounding sand. Its glassy, dome-shaped body is almost
      perfectly clear, revealing faint shadowy organs within.
    spawns:
      - room: thalvorek
      - room: nakhara
    image: b4a1b4f4931f4004102cc360f3ccfa58be75f20e9c9528522c2622d06aad1632.png
    drops:
      - itemId: kelp
        chance: 0.5
  pearl_wasp:
    name: a pearl wasp
    tier: standard
    level: 3
    description: an underwater parasite with a powerful stinger that targets clams, mollusks and oysters
    spawns:
      - room: aureliae
      - room: phosmaren
    image: aa404c0be7860fdafd4d2551565c1fa2ccdc84e43f0d52b771691d7344af1a90.png
    drops:
      - itemId: kelp
        chance: 0.5
  antlion:
    name: an antlion
    tier: weak
    level: 3
    description: A pale, segmented insect roughly the size of a fist, its six spindly legs splayed wide as it skitters
      across the sandy ground, trailing a shallow groove behind it. Its oversized mandibles curve outward like cracked
      ivory hooks, far too large for its dull, sand-dusted body.
    spawns:
      - room: nakhara
        count: 2
    image: eb73402597cc071b44d65b7c76367e1882906d0f738238aef3718f4366f82051.png
  bramblethorn_eagle:
    name: a bramblethorn eagle
    tier: weak
    level: 3
    description: A mid-sized raptor woven entirely from gnarled, woody bramble vines, its "feathers" formed by overlapping
      thorns and dark serrated leaves that rustle softly when it shifts its weight. Clusters of tiny white blossoms and
      glossy blackberries dot its wings and crest, giving it a deceptively delicate appearance despite its sharp, hooked
