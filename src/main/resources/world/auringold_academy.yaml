  dream_hotel:
    terrain: inside
    title: Hotel at the Edge of Dreams
    description: A grand but unsettling establishment where the architecture subtly defies logic — doorways slightly too
      tall, hallways that curve where they shouldn't, and wallpaper of deep burgundy and tarnished gold that seems to
      shift patterns when not looked at directly. Soft amber lamplight flickers throughout, casting long shadows across
      velvet furnishings and a front desk of dark lacquered wood, behind which hangs a clock with too many hands, all
      moving at different speeds.
    exits:
      s: library_fairytales
      e: crafters_workshop
      n: necrambon
    image: 481dfc891901ad708722e5a02d83c7d2e90a450a5e0b0f8ed4e3a06852c95b77.jpg
    inn: true
  general_store:
    terrain: inside
    title: Madam Daydreams' General Store
    description: A cozy, cluttered shop bathed in warm amber lamplight, its wooden shelves sagging under the weight of
      colorful potion bottles, bundled herbs, and peculiar knick-knacks stacked from floor to ceiling. A faded velvet
      curtain separates the front counter from some unseen back room, and the air seems to shimmer faintly with the
      mingled scents of dried flowers and old magic. Madam Daydreams trades gladly with dreamers — 'list' spreads her
      wares before you, 'buy <thing>' makes one yours, and 'sell <thing>' parts with what no longer serves. 'gold'
      counts your coin. In a browser, the shop window opens itself the moment you ask for the list.
    exits:
      n: call_for_heroes
    image: c6b80d50e20e3c883a68c934f0aa7f77a0250541c0aba84a6dd9cb7e606bade5.jpg
  library_fairytales:
    terrain: inside
    title: The Library of Fairytales
    description: Towering shelves of dark mahogany stretch from floor to vaulted ceiling, crammed with leather-bound tomes
      whose gilded spines shimmer with a faint, otherworldly glow, while clusters of floating candles drift lazily
      between the stacks, casting warm pools of amber light across worn reading tables scattered with open books and
      fallen feathers. Faded tapestries depicting wolves in grandmother's clothing, glass slippers, and spinning wheels
      adorn the stone walls, and in the far corner, a massive illustrated atlas lies open on a pedestal, its pages
      slowly turning on their own as if an invisible hand searches for a forgotten story. Uehma teaches every calling
      beneath these shelves — 'train' shows what she can awaken in you, and 'train learn <ability>' commits it to your
      bones.
    image: 6d192aa9e3f04aaf85e413fea876d016d183d2b21725c77dd3dea2d96f491244.jpg
    exits:
      n: dream_hotel
      e: enchanting_sanctum
      s: call_for_heroes
  lantern_cloister:
    terrain: inside
    title: The Lantern Cloister
    akathavaeShrine: true
    description: A narrow cloister folded behind the fortune teller's impossible shelves, where one brass lantern burns with
      a flame that casts light but no shadow and the wagon's stained-glass colors arrive gentled to candle-warmth. The
      walls hold hundreds of pinned field-sketches — creatures, doorways, distant weather — each signed by a pilgrim who
      recorded the world instead of conquering it, and a low shrine of smooth river stones bears the open-book sigil of
      the Akathavae. Pilgrim Evenlight keeps the flame ('talk pilgrim'), and the tablet at the shrine's foot states the
      pledge plainly ('read tablet').
    exits:
      e: zoetrope_carriage
      s: memory_creation
    features:
      pilgrims_tablet:
        type: SIGN
        displayName: a river-stone tablet at the shrine's foot
        keyword: tablet
        text: >-
          THE GENTLE PATH. The Akathavae raise no blade — they level by illuminating the world instead. 'pledge' at this
          shrine takes the vow, freely: your calling is set aside and kept safe, combat is forsworn, and your Arcanum
          journal opens. 'illuminate <creature>' records a being in light instead of blood; rooms and curiosities
          inscribe themselves as you walk and 'look'. 'arcanum' reads your journal — 'arcanum rooms', 'arcanum mobs',
          'arcanum items' turn to its chapters — and 'wardrobe' conjures garb the journal remembers. The vow is not a
          cage: 'renounce' at any shrine restores your old calling, for a heavy tithe of gold and a day's reflection
          before a shrine will hear your pledge again.


          *THE AKATHAVAE PATH IS A NEW FEATURE AND MAY BE BUGGY*
        backgroundImage: dfa6d79baa82d9436dfea5d1e0eb722432a29a9f4ce47726b1d0ee4abcbd038f.png
    image: 05600761df3378c11681a0f1b4aa2c88a7e6e88771ff917e7d222f088e0bcec3.jpg
  kiriton_winter:
    terrain: outside
    title: Harsh Kiriton Winter
    description: Frost-rimed wooden structures huddle together beneath a merciless grey sky, their rooftops buried under
      heavy drifts of snow while icicles hang like pale fangs from every eave. The settlement's paths are swallowed in
      white, the frozen earth cracked and unyielding, and the skeletal silhouettes of barren trees sway against a biting
      wind that scours the land bare of any warmth or color. Above it the sun hangs pale and far — the one light here
      that does not bite — and the freezing know whose fire it is — Sorayangriel, who burned away all she was to become
      the Sun and break the first long winter.
    features:
      sun_stone:
        type: SIGN
        displayName: a sun-stone shrine, its hollow worn smooth by cold hands
        keyword: shrine
        text: "Sorayangriel, who spent the whole of herself to become the Sun and end the Long Dark — warm us, as you warmed the
          world. (Old kindness, not a quest: nothing here to take, only a place the freezing have always stopped to be
          grateful.)"
    exits:
      w: heralds_of_creation
      e: first_archae
    image: 28ff73b7cfe9eaa48941f4fab10447aa916be3b0785f0f34fd5c618c7f7be723.jpg
    musicBox:
      title: Sorayangriel Sun
      file: 0ae59123de1d5812bf3ddacd4402c330808acfe19adf6d74be81d74fa52c7720.mp3
      durationSeconds: 306
      artist: TRADITIONAL
      description: A Martial Hymn to Sorayangriel, the Personification of Ambon's Sun
      image: 7a01a7c72a7008e522b69154bc5868e1bf8eba8c87e50d9d3831017f01b1345b.png
