    goldMult: 0.8
  aetherae_stablemaster_2:
    name: Aetherae Stablemaster
    tier: elite
    level: 4
    description: A figure of churning midnight-blue smoke and shadow fills the heavy ornate cloak that drapes its formless
      body, the fabric richly embroidered in silver and deep cobalt with clasps of tarnished steel catching the light.
      Where a face should be, only dense cerulean fog churns and roils, tendrils of blue-black mist curling from the
      hood's edges and hem like breath in cold air, hinting at immense, inhuman presence within.
    spawns:
      - room: aetherae
