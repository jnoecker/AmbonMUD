puzzles:
  gallery_riddle:
    type: riddle
    roomId: riddle_gallery
    mobId: sphinx_of_softwords
    question: "The Sphinx of Softwords stretches, taps the pedestal twice, and recites: 'I speak without a mouth and
      hear without ears. I have no body, but I come alive with wind. What am I?'"
    answer: echo
    acceptableAnswers:
      - an echo
      - the echo
      - echoes
    reward:
      type: give_item
      itemId: key_of_questions
    successMessage: The sphinx's tail stops mid-tick. "Correct," it says, managing to sound both impressed and
      personally wounded, and a brass key drops from beneath its paw. "The Key of Questions. Do try the door before
      the key changes its mind."
    failMessage: The sphinx purrs — a long, satisfied, devastating purr. "No. But please, guess again. I have four
      thousand years and you are very entertaining."
    cooldownMs: 3000
  whisper_vault_levers:
    type: sequence
    roomId: vault_of_whispers
    steps:
      - feature: star
        action: pull
      - feature: moon
        action: pull
      - feature: sun
        action: pull
    reward:
      type: unlock_exit
      exitDirection: e
      targetRoom: secret_archive
    successMessage: The third lever seats with a chime like a struck bell, and the blank eastern wall remembers,
      stone by sliding stone, that it was always a door. Beyond it, starlight falls on shelves no catalog admits to.
    failMessage: The levers shudder and reset themselves with an air of profound disappointment. Somewhere, faintly,
      the vault sighs. The verse above them has not moved.
    resetOnFail: true
    cooldownMs: 0
  archive_riddle:
    type: riddle
    roomId: secret_archive
    mobId: the_marble_mouth
    question: "The marble mouth clears a throat it does not have and recites: 'I have keys that open no locks, a
      space but no room, and you may enter though you never go in. What am I?'"
    answer: keyboard
    acceptableAnswers:
      - a keyboard
      - the keyboard
    reward:
      type: give_item
      itemId: archive_key
    successMessage: The mouth's smile widens a full inch into the stone. "Clever dreamer," it murmurs, and a slender
      silver key slides from between its lips. "The strongbox accepts it exactly once. Spend it with feeling."
    failMessage: "'Mmm. No,' says the mouth, savoring it. 'Although I do admire the confidence.'"
    cooldownMs: 3000
dungeon:
  name: academy_catacombs
  description: The catacombs beneath the Auringold Academy rearrange themselves nightly into a fresh examination —
    shifting halls of shelved bones, restless alumni, and marrow proctors, with the Dean of the Dead presiding over
    the deepest chamber. No two delves are graded alike.
  minLevel: 3
  roomCountMin: 4
  roomCountMax: 7
  portalRoom: catacomb_chapel
  roomTemplates:
    entrance:
      - title: The Examination Threshold
        description: A descending stair of worn slate where the chapel's candlelight gives way to the catacombs' own
          luminescence — shelved bones glowing faintly with remembered lamplight. Fresh chalk on the floor marks
          tonight's hall assignments in a hand no living registrar uses.
      - title: The Invigilation Gate
        description: An iron gate stands propped open by a stack of petrified examination booklets, its bars worn
          smooth by centuries of students entering and rather fewer leaving promptly. A bell above the arch rings
          once, all by itself, to mark your examination begun.
    corridor:
      - title: A Hall of Shelved Scholars
        description: Bones line this corridor with bibliographic precision — femurs filed like folios, skulls capped
          in mortarboard dust — and the air carries the rustle of pages from books that are not there. The shelving
          rearranges itself somewhere just out of sight, always politely, always closer.
      - title: The Whispering Stacks
        description: A narrow passage between leaning shelves of grave goods and confiscated crib notes, where the
          whispers of old recitations pool at ankle height like cold air. The candles here burn blue and budget
          their light.
    chamber:
      - title: A Lecture Hall of the Dead
        description: A vaulted chamber of tiered stone benches facing a lectern of fused vertebrae, where the dust
          of ten thousand lectures hangs in the unmoving air. Some of the benches are occupied. None of the
          occupants turn around. All of them are listening.
      - title: The Recitation Vault
        description: A round vault whose walls are honeycombed with scroll niches, each holding one rolled
          examination answer judged too wrong to destroy. The acoustics are perfect, the silence deliberate, and
          something in the niches keeps score of your footsteps.
    treasure:
      - title: The Confiscation Closet
        description: A barrel-vaulted closet where the proctors of four centuries stored everything students were
          not supposed to have — charm-loaded quills, bottled courage, dice of suspicious honesty — all of it
          glittering in heaps and strictly, theoretically, still confiscated.
    boss:
      - title: The Dean's Office
        description: The deepest chamber of the catacombs, furnished as a study — grave-silk drapes, a desk of black
          marble, and a gradebook the size of a tomb lid lying open to a page with your name on it. The Dean of the
          Dead rises from behind the desk, adjusts his mortarboard, and uncaps a blazing red quill.
      - title: The Hall of Final Marking
        description: A great hall whose walls are one continuous gradebook, names and verdicts chiseled floor to
          vault, every verdict the same. At the far end the Dean of the Dead waits beneath a chandelier of guttering
          candles, patient as a deadline, certain as a curve.
  mobPools:
    common:
      - restless_pupil
      - restless_scholar
    elite:
      - marrow_proctor
    boss:
      - dean_of_the_dead
  lootTables:
    normal:
      mobDrops:
        - marrow_dust
        - grave_silk
        - minor_healing_draught
      completionRewards:
        - dreamglass_shard
        - grave_silk
