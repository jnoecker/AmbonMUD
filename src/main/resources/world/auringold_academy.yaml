  rain_sprite:
    name: a puddle-dancing rain sprite
    tier: weak
    level: 2
    category: elemental
    spawns:
      - room: almanac_terrace
    condition:
      weather:
        - RAIN
        - STORM
    description: A knee-high figure of falling water that never quite lands, dancing in and out of the terrace puddles with
      each gust. It only ever visits wet weather, conducts the rain basin like a tiny choir, and dissolves into ordinary
      drizzle the moment the sky clears — always mid-bow, as though it planned it that way.
    drops:
      - itemId: almanac_pressing
        chance: 1
