  auringold_robes:
    displayName: Auringold Academy Robes
    description: Flowing robes of midnight blue cascade to the floor, their fabric alive with slowly shifting
      constellations, distant nebulae, and spiraling galaxies that shimmer with an inner celestial light, as though the
      wearer is draped in a living piece of the cosmos itself.
    keyword: auringold academy robes
    image: 9a86d73ae9c256e7b13e8df36479c6aab578af4320fb4d9fd96ee4cfe62f64cd.png
    slot: body
    level: 1
    tier: rare
    archetype: armor
    armor: 8
    stats:
      PRIMARY: 5
      SECONDARY: 3
      TERTIARY: 2
    basePrice: 20
    itemType: equipment
  silk_tophat:
    displayName: Silk Top Hat
    description: A towering stovepipe hat of shimmering silk rises to an absurd height, its surface layered in cascading
      ribbons, oversized bows, and dangling baubles in clashing shades of mint green, lavender, bubblegum pink, and
      lemon yellow. Every inch of the fabric is embroidered with swirling patterns and studded with tiny glittering
      gems, giving the impression that it was designed by someone who had never once been told the word "enough."
    keyword: ambon_auringold_academy_item8
    slot: head
    level: 1
    tier: rare
    archetype: balanced
    damage: 1
    armor: 2
    stats:
      PRIMARY: 3
      SECONDARY: 2
      TERTIARY: 1
    image: 077907959ba074d2ea76dca098aced0079e31ce61393ab881de23f019bc3c265.png
  quartz_bootz:
    displayName: Quartz Boots
    description: Crafted from translucent quartz crystal that catches the light in pale, prismatic flickers, these sturdy
      boots are seamlessly formed without visible seam or buckle, their smooth mineral surface veined with threads of
      milky white and soft rose that seem to glow faintly from within.
    keyword: dreamwoven boots
    slot: feet
    level: 1
    tier: rare
    archetype: balanced
    basePrice: 20
    itemType: equipment
    damage: 1
    armor: 2
    stats:
      PRIMARY: 3
      SECONDARY: 2
      TERTIARY: 1
    image: 6abb7705746d610874fb2c6045b587e9c7f1c6c2563e006a97df9e674c7b5c63.png
  aura_tempest:
    displayName: Aura of the Tempest
    description: A swirling corona of crackling lightning and dark stormclouds orbits the wearer in a perpetual tempest,
      electric arcs dancing between coiling wisps of violet-tinged thunderheads.
    keyword: aura tempest
    slot: floating
    level: 1
    tier: epic
    disableTertiary: true
    secondaryStat: DEX
    stats:
      PRIMARY: 3
      DEX: 5
    basePrice: 27
    image: 4b9a05e82791683d4dc4297f1d6d6298e02f3176d18c4cb7fcf5fbb1c510ad10.png
  ruby_necklace:
    displayName: Royal Ruby Necklace
    description: A massive, ostentatious necklace of deep crimson rubies set in heavy gold filigree, each gemstone the size
      of a thumbnail and catching the light with an almost vulgar brilliance. The ornate links drip with dangling
      teardrop pendants, the entire piece screaming wealth and poor taste in equal measure.
    keyword: ruby necklace
    slot: neck
    level: 2
    tier: rare
    disableTertiary: true
    basePrice: 25
    secondaryStat: CHA
    stats:
      CHA: 6
      PRIMARY: 4
    image: e371540c0c5701c3daad273b454118e4fbc0fea76047f7c71f63a293139da590.png
  cup_tea:
    displayName: a cup of the tea of magic
    description: A delicate porcelain cup filled with softly glowing amber liquid, wisps of luminescent steam curling upward
      in slow, ethereal spirals that shimmer with faint hues of gold and pale green.
    keyword: tea
    consumable: true
    basePrice: 5
    charges: 5
    onUse:
      healMana: 100
    image: f842dd2c97036be6c4b750e8ee77d9876a64921fe367329f9519086e52d9a4ba.png
  slice_cake:
    displayName: a slice of the cake of rebirth
    description: A perfectly preserved wedge of ethereal cake, its layers shimmering between pale gold and ghostly white,
      dusted with silver flecks that drift upward like embers in reverse, as though defying death itself.
    keyword: cake
    basePrice: 5
    itemType: consumable
    consumable: true
    charges: 5
    onUse:
      healHp: 100
    image: 664c27ed12697a357dcf9e73dc7bbb50fc633440c5d123441dbfa06bd80f079f.png
  cucumber_sandwich:
    displayName: a magically charged cucumber sandwich
    description: A neatly trimmed sandwich of pale white bread and crisp green cucumber slices, crackling with faint arcs of
      violet electricity that dance along its crusts and leave a faint smell of ozone in the air.
    keyword: cucumber sandwich
    basePrice: 7
    consumable: true
    charges: 1
    onUse:
      healHp: 100
      healMana: 100
    image: 31a9f6838362f02a30590b485ed5c4534dad88c59dd2cc28e74a600416e365df.png
  lavender_macaron:
    displayName: a lavender macaron
    description: A delicate, pastel-purple sandwich cookie with a smooth, slightly domed shell and ruffled edges, its two
      airy meringue halves pressed together around a thin layer of creamy lavender filling.
    keyword: a lavender macaron
    basePrice: 10
    itemType: consumable
    consumable: true
    charges: 1
    onUse:
      healHp: 200
    image: 8f65c376428ccb77144cb9f45547ba0d4f455e0001115334dc015426708d519b.png
  fizzy_apple_cider:
    displayName: fizzy apple cider
    description: A tall, slender glass bottle filled with pale golden liquid that sparkles with tiny rising bubbles, its
      cork stopper sealed with a twist of twine and a small dried apple slice tied around the neck.
    keyword: cider
    basePrice: 10
    itemType: consumable
    consumable: true
    onUse:
      healMana: 200
    image: 28473b247172ad78b468392631f8d730f268b410a7587c17509e43775ef4a113.png
  forest_berry_pie:
    displayName: a slice of berry of the forest pie
    description: A golden-brown pastry wedge glistening with crimson and violet berry juices that seep through its flaky,
      latticed crust, dusted lightly with crystallized sugar along its crumbling edges.
    keyword: pie
    basePrice: 15
    itemType: consumable
    consumable: true
    onUse:
      healHp: 200
      healMana: 200
    image: cb312f72be14bf2e9f9567af9726aa5c3ba7ca6039319da3ba28a10c38951912.png
  stardust:
    displayName: a handful of stardust
    description: A shimmering collection of luminescent particles gathered loosely in the palm, each mote glowing with soft
      silver and gold light that pulses faintly like distant stars, leaving trails of ghostly radiance as they drift and
      swirl against one another.
    keyword: stardust
    basePrice: 3
    itemType: treasure
    image: 8633af9d0e38f23d5e8c79e12ce2ab2d9c85e07c23a33f515f010bc0377fad3f.png
  kelp:
    displayName: a handful of kelp
    description: Slick, dark green strands of ocean kelp drape limply from your grasp, their rubbery blades glistening with
      saltwater and catching the light with a faint iridescent sheen. Tiny air bladders dot the slender stalks, and the
      faint smell of the sea clings to every tangled frond.
    keyword: ambon_auringold_academy_item19
    itemType: misc
    basePrice: 9
    image: e73a549cbca6e1fc1625a4ba54cb3934a35516466f875726a61c955143127fc0.png
  stone_fragments:
    displayName: assorted stone fragments
    description: A small pile of rough, irregular chunks of stone in varying shades of grey and brown, their broken edges
      sharp and uneven where they were cleaved from larger rocks.
    keyword: ambon_auringold_academy_item20
    itemType: misc
    basePrice: 8
    image: d528bbe12ef56055c8ac991baa5e98a601acecf7c8eabb88c36a2fc9837e7b2e.png
  broken_clockwork_gears:
    displayName: a pile of broken clockwork gears
    description: A tarnished heap of interlocking brass and iron gears, their teeth chipped and edges rusted, lie tangled
      together in a useless clatter of stripped mechanisms and snapped springs.
    keyword: gears
    basePrice: 10
    itemType: misc
    image: 525871622eaa2031981d08519ba85b88efddfe83c3c03a57220d82e684a14e0b.png
  gemstone_crate:
    displayName: a crate of glittering gemstones
    description: A heavy wooden crate packed with straw cradles dozens of loose gemstones that catch the light in brilliant
      flashes of ruby red, sapphire blue, and emerald green. The rough-hewn box is barely able to contain the dazzling
      wealth within, its slats slightly bowed outward as scattered gems spill over the edges like a treasure chest
      mid-overflow.
    keyword: gemstone crate
    basePrice: 150
    itemType: treasure
    image: 2800fe4d9fb3973299e53a20bb1d91eac893fdcd5003947a8344f263d727b699.png
  creators_footprints:
    displayName: The Creators Footprints
    room: world_seed
    description: Two jagged shards of obsidian, forged where the Creator's feet touched the ground.
    keyword: creators footprint
    takeable: false
    itemType: misc
    image: 09b04943bfb974ec7423c80bba7d5b0981fd8ea0da2605f219d98e0fa5fadac0.png
  obsidian_dagger:
    displayName: The Obsidian Dagger
    room: obsidian_dagger
    description: A jagged blade made of obsidian, glowing with the residual energy of creation. Delicate and not
      particularly sharp, but with the power to temporarily render divine beings utterly powerless.
    image: a73cc89332ae4f3f920dc96a17f9f8948b13ff9e439e0cd7ac20dcb3c9e21728.png
    keyword: obsidian_dagger
    takeable: false
  starlight_lyre:
    displayName: Starlight Lyre
    description: A delicate stringed instrument carved from pale moonwood, its frame etched with constellations that softly
      glow with a faint silver-blue radiance, the gossamer strings shimmering as though woven from captured starlight.
    keyword: starlight lyre
    slot: weapon
    level: 1
    tier: rare
    archetype: damage
    damage: 4
    stats:
      PRIMARY: 5
      SECONDARY: 3
      TERTIARY: 2
    basePrice: 20
    itemType: equipment
    image: 07dae8568b3d1d73170cd128af4e533fad84841b02ab84f34c86c30662ecc69d.png
  starlight_hammer:
    displayName: Starlight Hammer
    description: A sturdy war hammer with a head of deep midnight-blue metal flecked with tiny glimmering motes that pulse
      like distant stars, its worn leather-wrapped handle etched with faint constellation patterns.
    keyword: starlight sceptre
    slot: weapon
    level: 1
    tier: rare
    archetype: damage
    damage: 4
    stats:
      PRIMARY: 5
      SECONDARY: 3
      TERTIARY: 2
    basePrice: 20
    itemType: equipment
    image: 374e8822e4cc908b50037a9c842df0fe46dc12f24d77e8affcadf2f9261ab3ee.png
  straw_heart:
    displayName: a practice dummy's straw heart
    description: A fist-sized knot of golden straw bound with red practice-ribbon, awarded by tradition to whoever
      finally bursts the dummy that held it. It smells of sunshine and minor violence.
    keyword: straw heart
    itemType: misc
    basePrice: 1
  golem_core:
    displayName: a humming golem core
    description: A brass sphere the size of an orange, still warm and faintly indignant, its mainspring ticking down
      the last of a sparring golem's enthusiasm. Students traditionally present one as proof the lesson connected.
    keyword: golem core
    itemType: misc
    basePrice: 12
  proctors_ribbon:
    displayName: the Proctor's silk ribbon
    description: A ribbon of examination silk lettered PROCTOR in thread-of-gold, cut from the Examination Golem's
      chest plate by someone who passed. It confers no authority whatsoever and enormous satisfaction.
    keyword: ribbon
    itemType: treasure
    basePrice: 20
  gloom_ribbon:
    displayName: a ribbon of nervous gloom
    description: A strip of soft, damp shadow that wrings itself anxiously when held, shed by a fleeing gloomling the
      way other creatures shed fur. It is surprisingly good insulation and terrible company.
    keyword: gloom ribbon
    itemType: misc
    basePrice: 5
  mimic_tooth:
    displayName: a mimic's brass tooth
    description: A hinged brass fang the length of a thumb, sheared from a footstool that was never a footstool. The
      edge keeps itself keen out of habit, which smiths find extremely useful and slightly unsettling.
    keyword: mimic tooth
    itemType: misc
    basePrice: 6
  marrow_dust:
    displayName: a pinch of scholar's marrow-dust
    description: Fine grey dust that settles out of the restless dead when they finally rest, smelling of chalk,
      candle smoke, and concluded arguments. Alchemists prize it for tonics of stubborn endurance.
    keyword: marrow dust
    itemType: misc
    basePrice: 8
  grave_silk:
    displayName: a skein of grave-silk
    description: Cloth-of-shadow woven by centuries of patient dead from the quiet between heartbeats, cool to the
      touch and heavier than it looks. It pads helms, lines hoods, and keeps secrets beautifully.
    keyword: grave silk
    itemType: misc
    basePrice: 14
  moonpetal_herb:
    displayName: a moonpetal bloom
    description: A pale flower that opens and closes in a slow heartbeat rhythm even after picking, its petals cool
      as porcelain and faintly luminous at the edges. The heart of every honest healing draught.
    keyword: moonpetal
    itemType: misc
    basePrice: 4
  sunsap_bloom:
    displayName: a cluster of sunsap blossom
    description: A trellis blossom that drips slow beads of amber light instead of nectar, each drop holding its
      glow for hours. Alchemists render it into medicines for the mind and sweeten exactly one tea with it, once.
    keyword: sunsap
    itemType: misc
    basePrice: 6
  whisperweed:
    displayName: a sprig of whisperweed
    description: A rare silver herb that repeats, very faintly, the last kind thing said near it. Gardeners find
      sprigs only when the beds are in an exceptional mood, and apothecaries pay handsomely to listen.
    keyword: whisperweed
    itemType: treasure
    basePrice: 18
  glimmer_ore:
    displayName: a lump of glimmer-ore
    description: Raw dream-metal shot through with veins of trapped starlight that pulse like a slow second
      heartbeat. It works easily under the hammer and remembers, ever after, the first shape it was given.
    keyword: glimmer ore
    itemType: misc
    basePrice: 7
  dreamglass_shard:
    displayName: a shard of dreamglass
    description: A frozen splash of translucent mineral holding a tiny refracted image of somewhere else in the
      dream — a different one in every shard. Tinkers cut charms from it; enchanters argue with it.
    keyword: dreamglass
    itemType: misc
    basePrice: 15
  dreamers_biscuit:
    displayName: a dreamer's biscuit
    description: A round shortbread stamped with the Academy orrery, baked to a comfort somewhere between cookie and
      lullaby. Issued to every new student; hoarded by every old one.
    keyword: biscuit
    itemType: consumable
    consumable: true
    onUse:
      healHp: 25
    basePrice: 2
  practice_rope:
    displayName: a coil of practice rope
    description: Twelve feet of dependable hempen rope, faintly chewed at one end by something in the menagerie. No
      adventurer has ever regretted carrying rope, a fact the Academy includes on the syllabus.
    keyword: rope
    itemType: misc
    basePrice: 2
  minor_healing_draught:
    displayName: a minor healing draught
    description: A stout red-glass bottle of moonpetal cordial that mends scrapes, knits bruises, and tastes —
      against all alchemical tradition — rather nice. The label reads DRINK ME, SHELVE REGRET.
    keyword: healing draught
    itemType: consumable
    consumable: true
    onUse:
      healHp: 60
    basePrice: 15
  minor_mana_philter:
    displayName: a minor mana philter
    description: A slim blue-glass philter of moonpetal and sunsap that refills the mind's well with a sensation
      like remembering a name just in time. Faintly carbonated, for morale.
    keyword: mana philter
    itemType: consumable
    consumable: true
    onUse:
      healMana: 60
    basePrice: 15
  draught_of_grit:
    displayName: a draught of scholarly grit
    description: A square amber bottle of sunsap tonic steadied with marrow-dust, brewed for examinations and other
      emergencies. It mends a frightening amount of damage and leaves the drinker briefly certain about footnotes.
    keyword: grit
    itemType: consumable
    consumable: true
    onUse:
      healHp: 140
    basePrice: 35
  glimmersteel_shortblade:
    displayName: a glimmersteel shortblade
    description: A forge-bright shortblade of worked glimmer-ore, its edge set with a mimic's brass tooth that keeps
      itself keen out of habit. A student's first true blade, and traditionally a favorite forever.
    keyword: shortblade
    slot: weapon
    level: 2
    tier: uncommon
    archetype: damage
    damage: 6
    stats:
      PRIMARY: 6
      SECONDARY: 3
    basePrice: 30
    itemType: equipment
  glimmersteel_gauntlets:
    displayName: glimmersteel gauntlets
    description: Articulated gauntlets of glimmer-ore plate lined with soothing gloom-ribbon, warm in winter, cool
      in catacombs, and proof against most teeth. The knuckles glitter encouragingly when a fist is made.
    keyword: gauntlets
    slot: hands
    level: 2
    tier: uncommon
    archetype: armor
    armor: 4
    stats:
      SECONDARY: 4
    basePrice: 30
    itemType: equipment
  glimmersteel_helm:
    displayName: a glimmersteel helm
    description: A rounded helm of layered glimmer-ore padded in grave-silk, quiet as a library inside no matter the
      battle outside. The crest socket ships empty; heroics are expected to fill it.
    keyword: helm
    slot: head
    level: 3
    tier: uncommon
    archetype: armor
    armor: 5
    stats:
      PRIMARY: 4
    basePrice: 45
    itemType: equipment
  dreamglass_charm:
    displayName: a dreamglass charm
    description: A teardrop of cut dreamglass on a silver cord, holding a tiny image of the wearer's favorite place
      before the wearer has decided what it is. It hums when worn, content to be jewelry at last.
    keyword: charm
    slot: neck
    level: 2
    tier: uncommon
    archetype: support
    stats:
      PRIMARY: 3
    basePrice: 35
    itemType: equipment
  dreamglass_lantern:
    displayName: a dreamglass lantern
    description: A small faceted lantern that burns nothing and refuses to go out, casting the warm light of a
      remembered hearth. It floats at the shoulder of its keeper, politely illuminating and occasionally judging.
    keyword: lantern
    slot: floating
    level: 3
    tier: uncommon
    archetype: support
    armor: 2
    stats:
      SECONDARY: 3
    basePrice: 50
    itemType: equipment
  scholars_seal:
    displayName: the Scholar's Seal
    description: A medallion of silver and dreamglass bearing the Academy orrery, struck centuries ago for students
      who out-riddled the archive itself. The sphinx denies all knowledge of how it ended up in a strongbox.
    keyword: seal
    slot: neck
    level: 3
    tier: rare
    archetype: support
    armor: 1
    stats:
      TERTIARY: 4
    basePrice: 60
    itemType: equipment
  deans_hood:
    displayName: the Dean's grave-silk hood
    description: The academic hood of the Dean of the Dead, woven of grave-silk and trimmed in four centuries of
      withheld approval. Worn by the living, it confers excellent protection and a faint urge to grade things.
    keyword: hood
    slot: head
    level: 4
    tier: rare
    archetype: armor
    armor: 6
    stats:
      PRIMARY: 5
      TERTIARY: 3
    basePrice: 90
    itemType: equipment
  humilitys_crown:
    displayName: Humility's Crown
    description: A slowly turning halo of candleflame and settled dust that hovers above its bearer, granted only by
      the Final Lesson to students who survived the entire demonstration. It sheds no heat, only perspective.
    keyword: crown
    slot: floating
    level: 5
    tier: epic
    archetype: support
    armor: 3
    stats:
      PRIMARY: 4
      SECONDARY: 4
    basePrice: 150
    itemType: equipment
  graduate_regalia:
    displayName: the Regalia of a Graduate of Auringold
    description: Commencement robes cut from the same midnight as the Academy's banners, hemmed with drifting
      constellations and lined with quiet pride. The orrery clasp turns once, gently, each time the wearer does
      something the faculty would applaud.
    keyword: regalia
    slot: body
    level: 5
    tier: epic
    archetype: armor
    armor: 12
    stats:
      PRIMARY: 6
      SECONDARY: 4
      TERTIARY: 2
    basePrice: 200
    itemType: equipment
  key_of_questions:
    displayName: the Key of Questions
    description: A long brass key whose teeth are tiny question marks, warm from the sphinx's keeping. It opens the
      walnut door in the Riddle Gallery and refuses, on principle, to be lost.
    keyword: key of questions
    itemType: misc
    questItem: true
    basePrice: 0
  archive_key:
    displayName: a slender silver archive key
    description: A delicate key of cold silver dispensed by the marble mouth, made to turn exactly once. The
      strongbox it opens consumes it with a sound like a satisfied period at the end of a sentence.
    keyword: archive key
    itemType: misc
    questItem: true
    basePrice: 0
  grimoire_of_beginnings:
    displayName: the Grimoire of Beginnings
    description: A heavy tome bound in dawn-colored leather, its pages teaching the oldest curriculum — how every
      hero, god, and disaster in Ambon simply started. The archive grows a fresh copy for each student bold enough
      to reach the lectern.
    keyword: grimoire
    itemType: treasure
    questItem: true
    room: secret_archive
    respawnSeconds: 90
    basePrice: 0
  badge_of_orientation:
    displayName: the Badge of Orientation
    description: A small enamel pin of a lantern over an open door, awarded for arriving, asking, and settling in
      properly. The first of the eight wing badges, and secretly the Provost's favorite.
    keyword: orientation badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_valor:
    displayName: the Badge of Valor
    description: An enamel pin of crossed practice swords over a tiny, dignified straw heart, awarded by the
      Drillmaster to students who learned when to strike, when to judge, and when to run.
    keyword: valor badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_commerce:
    displayName: the Badge of Commerce
    description: An enamel pin of a balanced scale stamped from a decommissioned coin, awarded by Market Row for
      mastering banks, bargains, and the post. It smells very faintly of ledger ink.
    keyword: commerce badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_harvest:
    displayName: the Badge of Harvest
    description: An enamel pin of a moonpetal crossed with a miner's pick, awarded for honest work in garden and
      seam alike. The gardener insists it be worn where growing things can see it.
    keyword: harvest badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_makers:
    displayName: the Makers' Mark
    description: An enamel pin of a hammer, a kettle, and a waking rune in close formation, awarded to students who
      forged, brewed, tinkered, and enchanted their way through the workshops.
    keyword: makers badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_riddles:
    displayName: the Riddle's Answer
    description: An enamel pin shaped like a question mark wearing a tiny crown, awarded by the library for
      out-thinking the sphinx, the levers, and the archive. The sphinx signed the back, under protest.
    keyword: riddle badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_vigil:
    displayName: the Badge of the Vigil
    description: An enamel pin of a candle burning steadily inside an hourglass, awarded for coursework among the
      catacombs' restless dead. It is always, no matter the hour, slightly warm.
    keyword: vigil badge
    itemType: treasure
    questItem: true
    basePrice: 0
  badge_of_fellowship:
    displayName: the Badge of Fellowship
    description: An enamel pin of two clasped hands beneath the Academy orrery, awarded for errands run, names
      learned, and company kept. The Registrar polishes each one twice before parting with it.
    keyword: fellowship badge
    itemType: treasure
    questItem: true
    basePrice: 0
