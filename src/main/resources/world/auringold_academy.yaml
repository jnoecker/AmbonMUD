    questItem: true
    basePrice: 0
    image: 7d5c961c3459e5ee815ff852d93d2657ee6fae9a5e4d76c16b4e963e84ecb472.png
  badge_of_riddles:
    displayName: the Riddle's Answer
    description: An enamel pin shaped like a question mark wearing a tiny crown, awarded by the library for out-thinking the
      sphinx, the levers, and the archive. The sphinx signed the back, under protest.
    keyword: riddle badge
    itemType: treasure
    questItem: true
    basePrice: 0
    image: c9dbe692b3d1e3dbd9041d6191607c798859d59c487e07c03cf7d4f0eb2a6ed1.png
  badge_of_vigil:
    displayName: the Badge of the Vigil
    description: An enamel pin of a nightlight burning steadily inside an hourglass, awarded for keeping watch in the deep
      dark and soothing the bad dreams there. It is always, no matter the hour, slightly warm.
    keyword: vigil badge
    itemType: treasure
    questItem: true
    basePrice: 0
    image: e21e47b0df791dc4238f0e7b00c4a8517a584564c226d5f5e03a406f8faf3123.png
  badge_of_fellowship:
    displayName: the Badge of Fellowship
    description: An enamel pin of two clasped hands beneath the Academy orrery, awarded for errands run, names learned, and
      company kept. The Registrar polishes each one twice before parting with it.
    keyword: fellowship badge
    itemType: treasure
    questItem: true
    basePrice: 0
    image: 9bd224add943292cfd5120bb4157a27f725ed845a13dffbe41c6b6fe17601860.png
  portrait_kolksprut:
    displayName: A Framed Painting of Kolksprut, God of Luck
    room: games_parlor
    description: A framed painting hangs above the lottery jar. In it a vast, opalescent octopus-god drifts through an abyss
      that might be deep ocean or deep sky, his translucent body aglow in pearly blues, violets, and gold. Tiny scenes
      flicker inside his mantle — roads, parlors, dice-tables, masked travelers — as though his flesh held a hundred
      small fates at once, and his many arms trail off into puppet-shapes wearing the faces of Ambon's peoples. Coins,
      dice, and charms drift around him like stars. A small brass plate beneath reads simply, KOLKSPRUT, GOD OF LUCK.
    takeable: false
    keyword: portrait
    basePrice: 100
    itemType: misc
    image: 6c91db2d7a9ecb1c0ee1b1da07ddcc5d6646a09f18edfd5266a4f9b7a97b4fac.png
