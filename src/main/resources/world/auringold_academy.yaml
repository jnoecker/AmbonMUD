zone: auringold_academy
startRoom: krioshaeu_cabin
rooms:
  krioshaeu_cabin:
    terrain: inside
    title: Krioshaeu's Cabin
    description: >-
      Welcome, Adventurer! You stand within a cozy cabin that is lit by a roaring fire in the hearth. Here in the realm
      between life and death, you've been chosen to be reborn as a hero of Ambon. A small tea cart is set with two cups
      of hot tea and a variety of pastries and finger sandwiches. Krioshaeu sits in her rocking chair, smiling warmly at
      you. 


      A doorway opens into an endless starry void.


      Krioshaeu has been expecting you. Speak with her by typing 'talk krioshaeu' — or, if you play in a browser, tap
      her portrait beside the room art. Wherever you wander in Ambon, 'help' lists every command you can speak, and
      'look' paints your surroundings afresh. A small card rests on the tea cart ('read card').
    exits:
      e: endless_starry_void
      s: playtesting:pixelated_void
    image: 621b3619970199aa512be55195f7f5d0085f43a960a2d6931ff817d7e01a99c7.jpg
    inn: true
    features:
      tea_card:
        type: SIGN
        displayName: a tea-stained welcome card
        keyword: card
        text: >-
          "Dearest newcomer — a few first words, with love. Move with the compass: n, s, e, w, u, d. 'look' shows the
          room; 'look <something>' studies it closely. 'inventory' (or 'i') checks your pockets, 'equipment' (or 'eq')
          what you wear, 'score' your soul, 'quests' your promises, 'who' your fellow dreamers. This cabin is an inn —
          resting here ('rest') marks it as home, and 'recall' will always carry you back to it. Browser visitors: the
          panels along your screen mirror all of this, and Ctrl+K opens a palette of every command. — K."
  endless_starry_void:
    terrain: sky
    title: The Endless Starry Void
    description: >-
      You drift suspended in an infinite expanse of darkness punctuated by countless stars of brilliant white and deep
      sapphire, their light seeming to bend and refract through threads of luminescent cosmic dust that spiral outward
      like frozen aurora. Distant galaxies bloom and fade like flowers of light in slow motion, their swirling arms of
      gold and violet painting stories across the void while wisps of nebulae drift past in haunting, ever-shifting
      formations that seem to echo with the weight of eons.


      The door to Krioshaeu's Cabin stands open nearby, suspended in space, and a caravan wagon drifts through the stars
      not far off. A waystone of pale crystal drifts within arm's reach ('read waystone').
    exits:
      w: krioshaeu_cabin
      e: caravan_stable
    image: df9c77f0bdab31aed502b54b5ca5c05f651bfcbaa9f5388f0fbb289dc9bedee8.jpg
    features:
      drifting_waystone:
        type: SIGN
        displayName: a drifting waystone of pale crystal
        keyword: waystone
        text: >-
          Words surface in the crystal as you read: "The dream is wide — walk it with n, s, e, w, and sometimes u and
          d. 'exits' (or 'ex') names every way out, and 'autopeek on' whispers what waits one room ahead before you
          step. To stride several rooms at once, speak a path like 'run 2e' or 'run 3nw'. Should the way ever close
          behind you, 'recall' returns you to the last inn where you rested."
  wagon_drifting_stars:
    terrain: sky
    title: Outside a Wagon Drifting Through the Stars
    description: A weathered fortune teller's wagon drifts silently through the cosmic void, its wooden frame adorned with
      faded gilt and arcane symbols, while stained glass windows pulse with an eerie, otherworldly luminescence in hues
      of deep violet and emerald. Before it, a perfect ring of spectral campfire hovers impossibly in the starless
      darkness, casting dancing shadows across the wagon's ornate side and illuminating the endless expanse of space
      around it.
    exits:
      w: caravan_stable
      n: fortune_teller_parlor
    image: 6f0eed32b8bd417a0e936a08f81ce405f82260326bce5bbc3bdcb2b0bbd304f0.jpg
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
  memory_creation:
    terrain: sky
    title: A Memory of Creation
    description: You stand within a dream, or a memory, witnessing the creation of Ambon. The world is pulled apart,
      floating in pieces around a central platform. A humanoid figure stands on the platform, bathed in blinding light,
      manipulating the arcane energies as the world forms around them. At their feet, the heat of their presence melts
      the ground, forming two slabs of obsidian beneath them.
    exits:
      s: fortune_teller_parlor
      w: first_archae
    image: b976a65e63d87ef7aaff59b3744ca75f43e254efebf5d5ce2fa8dc26a0074309.jpg
  fortune_teller_parlor:
    terrain: inside
    title: Fortune Teller's Astral Parlor
    description: Within the impossibly vast interior of what should be a cramped wagon, towering shelves overflow with
      leather-bound tomes and crystalline artifacts, their spines glowing with arcane script, while overhead a vaulted
      ceiling painted with zodiac constellations is illuminated by an ever-shifting kaleidoscope of colored light
      streaming through intricate stained glass windows—each pane depicting celestial events and mystical symbols. The
      air itself seems to shimmer with otherworldly energy, dense with the scent of incense and old parchment, as though
      the space exists partially in this world and partially in something far stranger beyond.
    exits:
      s: wagon_drifting_stars
      n: memory_creation
    image: 0e64e864804e64df695eaa90cdb563ff1f84eae706c8b28425c9a94695e3f6c9.jpg
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
  heralds_of_creation:
    terrain: outside
    title: The Heralds of Creation
    description: You stand upon eternally soft grass that shifts between verdant green and opalescent shimmer, as if reality
      itself cannot decide what this primordial earth should be. Towering above in the luminous haze are beings of pure
      prismatic light—their forms vaguely humanoid yet composed of cascading colors that refract and bloom like living
      stained glass, their movements leaving trails of soft radiance as they prepare the new world for its coming
      inhabitants.
    exits:
      e: kiriton_winter
      w: sylflorae_farm
    image: 0504be1f81b24cb78013988368648a40eb218e854876c837229be4b29d726d66.jpg
  first_archae:
    terrain: urban
    title: The First Archae
    description: The first Archae city, Marldon, begins as a humble town along the river. As the eons pass, it grows into a
      thriving metropolis, the cultural center of Archae civilization.
    exits:
      e: memory_creation
      s: kiriton_winter
    image: 0c4550a153afb0dcc59fa600a276c823d839ed6831852be56141f394fb0bd266.jpg
  tempest_between_worlds:
    terrain: outside
    title: The Tempest Between Worlds
    description: Drawn by the absence of the Creator, primal forces from other realms began to arrive in Ambon. Maelsang,
      the Tempest Between Worlds,  is a god of storms and seas who came to Ambon from another world. Here in the dream,
      you witness him in his full fury, the unbridled tempest of the harsh early land.
    exits:
      w: sandy_shoal
      n: cozy_inn
      s: seaweed_thicket
    image: 557289ce1d6ee3f443488456dd6cb27539ce96f8f486405efdab855ff83a3b74.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  turbulent_waters:
    terrain: underwater
    title: Turbulent Waters
    description: You find yourself suspended in roiling, storm-churned depths where jagged shards of lightning flicker
      through murky jade-green waters, their brief illumination revealing debris and strange shapes drifting in the
      turbulent currents that pull and twist around you.
    exits:
      e: waterfall
      n: ship_graveyard
    image: 79cf2d6f61685fe54d279f15b12bed9deaec1b19400287e173bcab753ffa3172.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  sandy_shoal:
    terrain: underwater
    title: A Sandy Shoal
    description: A shallow expanse of pale golden sand stretches beneath crystalline shallows, where sunlight dances in
      rippling patterns across the seafloor—the boundary between waking and dreaming where the waters seem both
      impossibly clear and softly luminescent, as though lit from within by the gentle glow of awakening consciousness.
    exits:
      e: tempest_between_worlds
      s: coral_reef
    image: bb5d4c02713e27ce82c02370e8a7f5c0b8df03fd7a6678cdb8280a7502118ecb.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  foothills_kaerinlith:
    terrain: mountain
    title: The Foothills Below Kaerinlith
    description: Gentle slopes of amber-hued grass roll downward from the towering crystalline peak of Kaerinlith, its
      faceted surface catching ethereal light in shimmering cascades of lavender and gold. The air carries the sweet,
      dreamlike quality of a place half-remembered, where wildflowers in impossible colors bloom between smooth stones
      worn soft by time, and the distant sound of crystalline chimes drifts down from the mountain above like a lullaby
      calling the newly-reborn toward their destiny.
    exits:
      e: clockwork_forest
      n: path_kaerinlith
      s: kitsarae_study
    image: 1b6551b8133f215e6cf04d227dd3c9e4109293141d0542bb12f11ee2a258e03e.jpg
  sylflorae_farm:
    terrain: mountain
    title: A Sylflorae Farm
    description: >-
      You stand on a mountaintop, looking over a valley filled with various Sylflorae migrating outward from their point
      of creation. 


      The Sylflorae are enormous, slow-moving, deeply intelligent creatures whose backs grow orchards, berry tangles,
      tea-shrubs, moss gardens, or grainlike seed-plumes. Created by Astriel to provide plentiful harvests for the young
      Archae civilizations, the Sylflorae resemble vast mythical animals with bark-hide, rootlike limbs, vine manes,
      antler-branches, and entire cultivated ecosystems growing across their backs. They roam through the plains of
      central Ambon seeking favorable growing conditions.
    exits:
      e: heralds_of_creation
      n: kitsarae_mountain_basin
    image: ea2129b8131473f96d797b3c86e6b010a85d0da1af0a0e5223b7b4d8e229ab4f.jpg
  clockwork_forest:
    terrain: forest
    title: A Clockwork Forest
    description: Towering brass and copper trees rise like skeletal sentinels, their branches fashioned from interlocking
      gears and crystalline chimes that hum with an ethereal resonance. Soft luminescent sap glows amber and violet
      within transparent trunks, casting dancing shadows across a forest floor of polished cogs and delicate clockwork
      vines that tick softly with each passing breeze.
    exits:
      w: foothills_kaerinlith
      n: deep_clockwork_forest
      e: springwright_workshop
    image: ee93a862c08e9614196f0acffcbe2b5ce972adac718356cfa078e8c75e11e566.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  deep_clockwork_forest:
    terrain: forest
    title: Deeper in the Clockwork Forest
    description: Massive brass gears and copper clockwork mechanisms jut from the forest floor like mechanical roots, their
      surfaces etched with intricate patterns that gleam faintly in the dreamlike golden light filtering through
      canopies of crystalline leaves that chime softly as they shift. The air hums with the rhythmic tick-tock of
      countless unseen mechanisms, while shimmering pathways of polished metal wind between ancient trees whose trunks
      spiral with embedded cogs and spinning wheels, creating an eerie beauty where nature and machinery exist in
      perfect, impossible harmony.
    exits:
      e: clockwork_clearing
      s: clockwork_forest
      w: path_kaerinlith
      n: beside_clockwork_pond
    image: dd259c098c1379a685ce700f800aaa1979eb6e273a0dcd72a427a497ddb8e764.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  clockwork_clearing:
    terrain: forest
    title: A Clearing in the Clockwork Forest
    description: A sun-dappled clearing opens within a forest of towering mechanisms—gears the size of boulders mesh with
      crystalline branches that chime softly in the breeze, their surfaces catching golden light like stained glass.
      Grass dotted with luminescent flowers grows in neat spirals around the mechanical trunks, while the sky above
      shimmers with the warm, dreamlike glow of perpetual late afternoon.
    exits:
      w: deep_clockwork_forest
      s: springwright_workshop
    image: 7daf42104ae165a2ddffbee41905b89a306679d6a0f81fb5b9a45827b1824e8a.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  springwright_workshop:
    terrain: inside
    title: The Springwright's Workshop
    description: This is a memory of the workshop of Tessikar the Springwright. The workshop is magnificent chaos — gears,
      springs, crystals, half-finished mechanisms, blueprints, tools of every kind covering every surface. Crystals from
      the Lithae mines glow in racks along the walls, some already integrated into mechanical housings. Through the
      workshop window, the city of Tessikon is visible far below on the mountainside — his creation, grown from one
      workshop into a civilization.
    exits:
      n: clockwork_clearing
      w: clockwork_forest
    image: a05bef9b134d1a5dff03b6298602f16031da640a05869bccd11add309da56d9a.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  beside_clockwork_pond:
    terrain: forest
    title: Beside the Clockwork Pond
    description: A serene glade unfolds beside a luminous pond whose surface ripples with the gentle ticking of countless
      tiny gears and clockwork mechanisms, their brass and copper casings catching dreamlike light as they drift lazily
      through crystalline water. Whimsical mushrooms with iridescent caps dot the mossy banks, while delicate chiming
      bells hang from nearby branches, creating soft melodies that echo the pond's mechanical heartbeat—a place where
      the boundary between nature's organic beauty and artifice's precise wonder blurs into something wholly
      fantastical.
    exits:
      s: deep_clockwork_forest
      n: wading_pond
    image: 358571d7b541802f55ffb5530d3a4db78fb4c063e7d68c6151e14f2d7b5f2500.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  clockwork_dias:
    terrain: outside
    title: Mechanical Dias at the Center of a Clockwork Pond
    description: Two massive clockwork alligators flank a ornate spiral staircase of interlocking brass gears and polished
      copper rails that corkscrews downward through the glassy water, its steps still visible as they descend into the
      shimmering crystal depths below. The guardians' articulated scales catch the light like hammered coins, their
      glass eyes glowing a dim amber as gears click and whir audibly within their chests, tails sweeping slow,
      deliberate arcs across the mechanical dais beneath their clawed feet.
    exits:
      d: void_below_mountain
      s: wading_pond
    image: 43db612865ddb5f2540bc2f567979df623a907582059c162cd024311f17cba99.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  mine_opening:
    terrain: underground
    title: The Opening of a Shining Crystal Mine
    description: Crystalline formations jut from earth and stone in every direction, their facets catching and scattering
      light into dancing rainbows that paint the walls in shifting hues of amber, violet, and rose gold. The mine's
      entrance yawns wide and inviting, with glittering veins of precious ore running through the rock face like threads
      of solidified starlight, while loose gemstones crunch softly beneath your feet, their surfaces polished smooth by
      time and the passage of many before you.
    exits:
      n: shining_crystal_mine
      s: path_kaerinlith
    image: 77bc2bf48062d7e6fc7700f6b4452bf053f790751a9f393efc7352ef5effa096.jpg
  shining_crystal_mine:
    terrain: underground
    title: A Shining Crystal Mineshaft
    description: Crystalline formations of brilliant amber and pale gold jut from earthen walls, their facets catching and
      refracting an ethereal, opalescent glow that illuminates the narrow passage without any apparent source of light.
      The air shimmers with faint, dreamlike iridescence, and the ground beneath your feet crunches softly with
      fragments of glittering mineral dust, as though you walk through solidified starlight freshly mined from the
      depths of slumber itself.
    exits:
      s: mine_opening
      n: void_below_mountain
    image: 4a4245cc4f74e9aab8b472e0372fcc73a081839b32d69d85e70fd318e2cc09ad.jpg
  void_below_mountain:
    terrain: underground
    title: The Void Below the Mountain
    description: Early in Ambon's history Kvarcgagap, The Sparkling Quartz Void, arrived. Like a trickle of quicksilver, he
      moved through the deep places, carving the caverns and seeding the crystals and ore. You stand within a memory of
      his home, deep beneath Kaerinlith, among the sparkling rainbow crystal statues of his children, the Lithae.
    exits:
      s: shining_crystal_mine
      u: clockwork_dias
      n: sleeping_stone_statues
    image: bd52d312b8bba40a7c2f178e44ba4bb9b8d05683efef31377578f82a88459600.jpg
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  sleeping_stone_statues:
    terrain: underground
    title: Cavern of Sleeping Stone Lithae
    description: A cavernous vault stretches endlessly into shadow, its vaulted ceiling soaring impossibly high above rows
      upon rows of towering crystalline statues—some translucent and gleaming with inner light, others carved from
      obsidian and pale limestone, their humanoid forms frozen in eternal poses of dignity, anguish, or defiance. Veins
      of luminescent ore thread through the chamber's walls, casting an ethereal glow that dances across the statues'
      blank faces and reaches toward distant archways where deeper darkness beckons.
    exits:
      s: void_below_mountain
      e: underground_river
    image: 9d602887e0d91e19de570d3c939c53cf9db9ed241d2b5f726c1d4a46e902d50e.jpg
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  arrival_king:
    terrain: outside
    title: The Arrival of the King
    description: A tear of blinding light splits the mountainside as reality warps and fractures—through the shimmering
      breach emerges an ornate mahogany chariot drawn by four majestic white stallions whose manes seem woven from
      starlight, their hooves striking the ground with an otherworldly resonance as they pull their gilded burden into
      this realm of dreams and rebirth.
    exits:
      e: world_seed
      w: enchanted_bakery
      s: cozy_inn
    image: a1d66ddb18d9d71f72da57f2513a9e8cb9c567a8e65fdce6772602cfa5bb72b8.jpg
    features:
      gilded_waystone:
        type: SIGN
        displayName: a gilded waystone half-buried in wildflowers
        keyword: waystone
        text: >-
          "Halfway through the dream already, traveler. Take stock: 'score' reads your soul entire — level, health,
          mana, experience, coin. 'effects' lists what blessings or poisons ride you, 'time' tells the hour, and
          'areas' names every region of the world beside the levels it welcomes. 'quests' reviews your promises.
          Should your strength flag, 'use' a snack — the cake mends the body and the tea restores the mind, and
          'quickheal' or 'quickmana' will reach for the best one without being asked."
  world_seed:
    terrain: underground
    title: The World Seed
    description: >-
      You stand within a memory of a time long past. Shades of a time long forgotten play out like an ethereal opera,
      great figures of old shifting through the mists. Malkuth the Betrayer visits Kvarcgagap, the Shining Quartz Void,
      and presents him with a seemingly simple question: "From what kind of seed did the world grow?". 


      And so Kvarcgagap traveled to the center of Ambon, in the deepest and oldest places there, and discovered the
      obsidian slabs where the Creator stood as they created the realm.
    exits:
      w: arrival_king
      e: obsidian_dagger
    image: 8dc5c2042d8c27e56054d3e12eaa0bfd6329405de0f4d3c1cbc77661acb82dd4.jpg
  great_betrayal:
    terrain: forest
    title: The Great Betrayal
    description: You stand within a memory, watching as Malkuth the Betrayer meets with Kvarcgagap, the Shining Quartz Void.
      The scene unfolds in the clockwork forest near Kaerinlith. As the dream plays out, Malkuth draws the Obsidian
      Dagger from its sheath and steals the life force of the great stone god. In the distance, a fortune teller's wagon
      sits next to a smoldering fire.
    exits:
      s: obsidian_dagger
      w: carnival_prophecy
    image: c89c492ff785c0247ec2550c0626964b92b4785ddd26fd4d711711c9602ceacb.jpg
  clockwork_battle:
    terrain: forest
    title: The Clockwork Battle
    description: You stand in a clearing that shows clear signs of a terrible battle. Fragments of memory drift by - Malkuth
      attacking Tessikar and being driven off by the Springwright. The ground is scorched and the clockwork trees are
      bent and damaged.
    exits:
      e: carnival_prophecy
      w: emberfell
    image: 1fa275e7d2aa8f8fae0cc4e1b16302fa165c2ff947d1488e94e3eedfa5a0a565.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  obsidian_dagger:
    terrain: inside
    title: The Birth of the Obsidian Dagger
    description: A cavernous forge wreathed in ethereal, twilight-blue flames burns at the center of a black cathedral, its
      edges fractured into jagged shards that seem to pierce the boundary between worlds. At the furnace's heart, the
      flames have turned black and gold —while whispers of the divine realm echo through fissures in reality that bleed
      starlight and ash.
    exits:
      w: world_seed
      n: great_betrayal
    image: 53147cdfb360ec66d5a88894bd98c6e497481cd662265b3bc9012b3072a6a9be.jpg
  carnival_prophecy:
    terrain: inside
    title: The Fortune Teller's Prophecy
    description: Inside a cramped wagon perfumed with exotic incense, candlelight flickers across crimson silks and
      mysterious symbols etched into wooden walls, casting dancing shadows that seem to move of their own accord; a
      robed figure gestures solemnly over scattered tarot cards and glowing crystals while their companion leans forward
      intently, caught between wonder and dread as ancient words hang heavy in the air.
    exits:
      e: great_betrayal
      w: clockwork_battle
    image: df45bfc79089f4d2c14c783769583de217536589f847063d209b0c364b92a774.jpg
  emberfell:
    terrain: mountain
    title: The Emberfell
    description: You stand at the highest peak of the mountain Kaerinlith. The memories swirl around you, showing the scenes
      of the Emberfell. Tessikar the Springwright strikes the molten slag of obsidian with his hammer, sending a shower
      of sparks over the countryside.
    exits:
      e: clockwork_battle
      w: gemstone_mineshaft
    image: 50e8cca852ad6084ddadcf36409c2084385761cbee708fefb0b1b52de30126c5.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  humble_forest_cabin:
    terrain: inside
    title: A Humble Forest Cabin
    description: Weathered logs form the walls of this modest cabin, its thatched roof sagging gently with age and patched
      in places with bundled reeds. Smoke curls lazily from a stone chimney, and the air carries the mingled scents of
      dried herbs hanging from the rafters, medicinal poultices simmering on a clay stove, and old wood worn smooth by
      decades of care.
    exits:
      e: vault
      n: royal_wedding
    image: ae1bd6b304e7e457d06cba442e7e769c5de357165c0b4bf500138a09104ad7b6.jpg
    inn: true
  royal_wedding:
    terrain: inside
    title: The Royal Wedding
    description: You stand in a lavishly decorated ballroom, as the memory of the wedding of Malkuth and Aineroia plays out
      before you. Ghostly figures dance and twirl and the sounds of music and revelry fill the air.
    exits:
      s: humble_forest_cabin
      w: royal_graveyard
    image: 99ecfd5dd9e30ca602ed217b73edf3cfec0028b3975f719c9fc791991fc1f92f.jpg
  royal_graveyard:
    terrain: outside
    title: In a Tiny, Brightly-Lit Graveyard
    description: Rows of cheerfully painted gravestones glow under the warm light of countless torches, their surfaces
      ablaze with vibrant depictions of phoenixes mid-flight, delicate faeries dancing between flowers, and majestic
      dragons coiled protectively around ornate monuments. The dancing firelight casts playful shadows across the tiny
      cemetery, transforming what might be a place of sorrow into a luminous garden of hope and wonder.
    exits:
      e: royal_wedding
      s: betrayer_study
    image: ba96b0ba1d72fd91dc51fb940526ad9f7dfafd33efcab5b608adb05060eb1864.jpg
  caldera:
    terrain: mountain
    title: The Caldera
    description: A colossal wound carved into the world itself, this massive crater sprawls endlessly in all directions—its
      jagged rim rising like broken teeth against the sky while the depths plunge into shadow and swirling auroras of
      unstable arcane energy. The displaced earth hangs suspended in impossible geometry, great chunks of stone and
      shattered kingdom frozen mid-fall through layers of ethereal light and crackling magical force that hums with the
      residual power of catastrophic enchantment.
    exits:
      n: verathaios_workshop
      s: arcane_tempest
    image: 5411f15744df7bfd6e3a6625b0dc3b4a6b70ab2e143c39fa282a05e93eb74398.jpg
  arcane_tempest:
    terrain: inside
    title: Inside the Arcane Tempest
    description: Swirling columns of prismatic energy spiral endlessly through this impossible chamber, their colors
      shifting from deep violet to brilliant gold with each rotation. The air crackles with raw magical force, and the
      very ground beneath your feet seems to flicker between solid stone and shimmering, translucent arcane matter as
      reality bends around the tempest's violent heart.
    exits:
      e: betrayer_study
      n: caldera
    image: 9f585d210c0485d0ee16050ae777afc0a7d0d0e7bd03bb4046a73ec225767e30.jpg
  verathaios_workshop:
    terrain: forest
    title: Verathaios's Workshop
    description: A lush tropical greenhouse thrums with verdant life, its canopy towering overhead with bioluminescent vines
      that cast dancing shadows across massive ferns and exotic flowers blooming in impossible colors—deep purples,
      luminous golds, and soft greens that seem to glow from within. The air shimmers with visible magic, and the ground
      is carpeted with moss so soft it muffles footsteps while healing herbs and crystalline-stemmed plants grow in wild
      abundance, their properties whispered through the humid breeze.
    exits:
      s: caldera
      n: aolia
    image: 222a68eed45875914175d6b7a1084229d4c9a47162f9bc8967a516efe2ee0314.jpg
  aolexia:
    terrain: sky
    title: Aolexia
    description: A breathtaking expanse of crystalline islands drift like silent sentinels through an ethereal void where
      starlight pools into luminous streams and the very atmosphere thrums with ancient arcane knowledge. Vast libraries
      spiral across floating terraces of solidified starlight, their ever-shifting shelves laden with tomes in forgotten
      and unspoken tongues, while meditation chambers hewn from cosmic crystal invite seekers deeper into
      understanding—all tethered to the world below through Aolia, a delicate observatory whose constellation of
      gleaming telescopes pierces both the celestial vault above and the misty lands of Ambon beneath, their lenses
      reflecting equal wonder at the infinite and the mortal.
    exits:
      n: shattered_fae_wood
      s: aolia
    image: a8243875ed1a79fe69527981f745fdffbcc57c8e34b867af071210fb559351be.jpg
  aolia:
    terrain: sky
    title: Aolia
    description: A sprawling observatory suspended among billowing clouds, its brass telescopes pointed skyward like fingers
      grasping at celestial secrets, while below the misty veil Ambon's civilizations shimmer in miniature; gossamer
      pathways of solidified starlight wind between crystalline domes and floating platforms, and a shimmering archway
      pulses with arcane energy—the threshold to the grand library beyond.
    exits:
      s: verathaios_workshop
      n: aolexia
    image: c99929fa5944ad00e0aff498371184223d11aeaf583fa604342d970c2e720962.jpg
  shattered_fae_wood:
    terrain: sky
    title: The Shattered Fae Wood
    description: Fractured crystalline shards of impossible geometry drift through an endless void of twilight purple and
      shimmering gold, their surfaces reflecting distorted glimpses of a forest that exists in a thousand broken pieces
      simultaneously—skeletal trees with luminescent bark twist through the weightless expanse while spectral wisps of
      displaced magic coalesce and scatter like disturbed embers, all beneath a sky that has itself splintered into
      jagged segments of starlight and shadow.
    exits:
      s: aolexia
      n: aineroia_cottage
    image: db2b9154459b1435b78cb93e9f542a65dadb4b91d4eaa70b8b37b81385da0b56.jpg
  lustriae:
    terrain: forest
    title: The Lustriae
    description: A shimmering glade where twilight lingers eternally, neither fully day nor night, with ancient trees whose
      bark glimmers faintly as though dusted with captured starlight and frost. Gossamer veils of pale blue and silver
      mist coil through the air like living things, swirling around impossible architecture that seems to exist in
      multiple moments at once—archways that loop back upon themselves, crystalline structures that refract light into
      cascading rainbows, and clearings where the same stone appears both weathered by ages and pristine and new.
    exits:
      n: aineron
      s: faegrimm
      e: pyrae
    image: 7737a097885c90224249a98f6fb3b087568c3381f9afaf694d49b7547bd5d2e4.jpg
  pyrae:
    terrain: forest
    title: The Pyrae
    description: Scorched air ripples from every surface as waves of heat distort the very atmosphere, and towering trees
      with bark blackened by eternal flame stretch impossibly high into a hazy crimson sky where embers drift like snow.
      Suspended bridges of woven vines and phoenix feathers span between colossal canopy dwellings, their architecture
      carved from still-smoldering wood and reinforced with bands of hardened ash, while the glow of contained infernos
      within illuminates everything in dancing shades of gold, amber, and deep blood-red.
    exits:
      s: veratheron
      n: cindaron
      w: lustriae
      e: aureliae
    image: 64a3637fd9cfb47b8e7fb0c1df8177083e4a2713c621090aeb3cd233b523882b.jpg
  aureliae:
    terrain: underwater
    title: The Aureliae
    description: Bioluminescent beings of the deep ocean drift through endless darkness like living constellations, their
      translucent forms pulsing with otherworldly radiance in cascades of azure, violet, and pearl that ripple
      hypnotically across jellyfish-like bodies. Around them, vast coral metropolises rise in impossible spirals and
      delicate arches, each structure alive and glowing in harmony with the gentle light of their creators, while
      haunting magic songs—complex symphonies resonating through the water—echo endlessly through the luminous realm.
    exits:
      n: phosmaren
      s: lagauri
      w: pyrae
      e: ophirae
    image: 90ca5a0d9219b2030955d051fcf8c9ee8a4639def5218798627399d48e52b3da.jpg
  ophirae:
    terrain: underwater
    title: The Ophirae
    description: A vast underwater cathedral of pearlescent bone and midnight scales emerges from obsidian depths, its
      spiraling towers crafted from the ancient ribs of forgotten leviathans; serpentine forms with iridescent eyes
      glide through currents of luminescent bioluminescence, their scaled bodies rippling with the grace of creatures
      born to command both the crushing abyss and storm-torn skies.
    exits:
      s: thalvorek
      n: nakhara
      w: aureliae
      e: mycorae
    image: af848e21e7e2690fccfe31ad6f0ad4c14e03a765bd717ac289fbee14889e8e53.jpg
  mycorae:
    terrain: underground
    title: The Mycorae
    description: Beneath the forest floor, a vast network of silvery mycelial threads pulses with bioluminescent life, their
      collective consciousness made manifest in fruiting bodies that rise like living architecture—towering mushroom
      cities with caps of deep amber, ethereal blue, and ghostly white glow softly in the perpetual twilight. Individual
      Mycorae emerge from this living substrate as graceful, translucent-skinned beings with stalks for limbs and crowns
      of luminescent tissue, their bark-like flesh breathing in rhythm with the greater fungal network, embodying the
      eternal cycle of decay, death, and rebirth that defines their very existence.
    exits:
      n: mycollum
      s: voxspore
      w: ophirae
      e: vulgorth
    image: 7cce05554812382d224576540a06bf6259af2f1a48f1b5911f3ae693a22f79cb.jpg
  night_wind:
    terrain: outside
    title: A Shrieking Night Wind
    description: A violent, keening gale that shrieks with the anguish of a child's unfinished cry, its form a roiling mass
      of pale, corpse-cold mist threaded through with wisps of deep indigo and sickly green that pulse like a dying
      heartbeat. The air itself seems to fracture in its presence, crystalline shards of supernatural frost hanging
      suspended in the wind, while an overwhelming sense of abandon and grief presses down upon all who stand within its
      maddening howl.
    exits:
      e: moon
      s: vulgorth
      w: mycollum
    image: 9c2673b0ee733ca6b99106596060341af924a0e7819e5bfd536d3ac130d09195.jpg
  luneqrae:
    terrain: outside
    title: The Luneqrae
    description: You stand on the grassy plains in Northern Ambon. Ethereal forms of pearlescent mist and silver smoke
      coalesce into the shapes of graceful horses, their bodies translucent and shifting like captured moonlight, their
      hoofbeats silent against the ground as they drift through the space with an haunting, weightless elegance. Their
      eyes gleam with a sorrowful luminescence, and trails of gossamer light mark their passage—the restless spirits of
      those who never found rest, now bound eternally to the silver glow of the moon's domain.
    exits:
      n: krioshaion
      e: aetherae
    image: 99236129bfdf008ab2ad9ac7708100f9ad7f3420405d7a4f71bff5529f846567.jpg
  moon:
    terrain: sky
    title: Aineroia Lights the Night Sky
    description: >-
      Nearly 200 years after her ascension, Aineroia returns to Ambon to find the people terrified by the newly released
      magical creatures, haunted by the screeching night wind, cowering in fear of Ambon's dark nights. Death existed in
      Ambon from the beginning — terrifying, formless, nameless, the end of all things. Aineroia could not accept this
      for her children - for any of Ambon's children - so she took this primordial terror and shaped it into something
      beautiful.


      Thus was born Krioshaion, the realm of the dead, ruled by the benevolent Krioshaeu —death given form, purpose, and
      compassion. She lifted Krioshaion itself into Ambon's night sky, transforming the realm of the dead into the
      world's moon. Now it hangs there like a luminous pearl, casting gentle light across the world below—no longer the
      harsh, distant gleam of stars, but the warm radiance of a mother's eternal vigil.
    exits:
      w: night_wind
      s: krioshaion
    image: cca4e544c700308ccc5ce44cc0291171ccde60446cc9faa4e1ce803943adb553.jpg
  aetherae:
    terrain: outside
    title: The Aetherae
    description: Swirling mists coalesce into spectral forms that drift across windswept northern plains, their translucent
      bodies shifting between shadow and starlight as they move with the grace of nomadic herders tending luminescent,
      ethereal creatures. These beings of living darkness wear flowing garments that billow without wind, their eyes
      glowing softly like distant moons, eternally bound to guard an ancient, concealed blade and shepherd their fey
      charges across endless grasslands.
    exits:
      w: luneqrae
      n: desert_sands
    image: bb881d7d87779e921fbbc5f4b83e34d63ade138df152db4d06b829c623797329.jpg
  call_for_heroes:
    terrain: outside
    title: The Call for Heroes
    description: Outside a quaint cottage of pale wisteria wood that sits nestled among luminescent dream-flowers, its
      thatched roof shimmering with threads of silver starlight that seem to drift upward like smoke. Warm amber light
      spills from curtained windows, and the doorway is framed by climbing vines bearing delicate glass-like blooms that
      chime softly in an unfelt breeze. Lantern-lit paths gather here from every corner of the campus — the quad where
      Provost Lumina marshals her new heroes, the market row, the workshops, and the great gilded gates that will one
      day open onto Ambon itself. A brass signpost marks the crossing ('read signpost').
    exits:
      w: general_store
      n: tessikon
      s: academy_quad
      e: gates_approach
    image: 22db860fb5a194de739e516c7a45e9b953d52e72f6f6109fe9979223d7cb2de8.jpg
    features:
      brass_signpost:
        type: SIGN
        displayName: a brass signpost crowned with a tiny orrery
        keyword: signpost
        text: >-
          AURINGOLD ACADEMY — CAMPUS DIRECTORY. The Quad: Provost Lumina, orientation, and the start of your
          coursework ('talk provost'). Proving Grounds: combat tuition, training dummies, the duel ring. Market Row:
          bank, auction hall, provisioner, post. Workshops: forge, alchemy lab, tinker's bench, enchanting sanctum,
          with gardens and a mine for raw makings. The Library: training, riddles, and the Hall of Records. Below the
          quad: the catacombs — seniors only. Track your coursework with 'quests'; speak 'help' for every command.
  desert_sands:
    terrain: desert
    title: The Hot Desert Sands
    description: The Hot Desert Sands stretch endlessly beneath a merciless sun, where towering rock formations pierce the
      shimmering heat haze like the weathered bones of ancient titans. Vast expanses of rust-colored sand and
      sun-bleached stone dominate the landscape, interrupted by scattered outcroppings of dark basalt and veins of
      crystalline minerals that gleam like captured starlight, while the distant eastern peaks loom snow-capped and
      forbidding against the harsh blue sky—a frozen barrier separating this scorched realm from the world beyond.
    exits:
      s: aetherae
      n: creeping_darkness
    image: 476fae41ed4bc4fff46b36e692530d628c2b3b6a3c44b633129c84472aab40d6.jpg
  aineron:
    terrain: forest
    title: Aineron
    description: "A massive archway grown from ancient, living trees at the edge of a sparse northern forest. The trees
      forming the arch are enormous, their trunks twisted together into a cathedral-like gateway, branches interlocking
      overhead. Beyond the archway, the world changes — the light is warmer, the colors more saturated, the air filled
      with drifting motes of gold. On this side: thin boreal forest, cold light, frost on the ground. Through the arch:
      an impossibly lush magical realm glimpsed in the distance. Small cozy structures of wood and vine cluster near the
      base of the archway. The feeling of standing at a threshold between worlds."
    exits:
      s: lustriae
      w: aineroia_cottage
      e: cindaron
    image: fe8620dc4d3c630244ddf9bfb439d6007c57543469972d12d55c64cd4d30b68b.jpg
  veratheron:
    terrain: urban
    title: Veratheron
    description: Tall, slender tower-like structures rising above the jungle canopy along the western coast. The towers are
      organic in design — grown from living wood rather than built, spiraling upward like enormous vines reaching for
      the sky. At their tops, platform-homes and lookout posts give views across both the jungle and the ocean. The warm
      river flows nearby, steam rising where supernatural warmth meets ocean breeze. Named for Verathaios the World
      Healer, this settlement has a sacred quality — a place where the divine greenhouse meets the sea.
    exits:
      n: pyrae
      w: faegrimm
      e: lagauri
    image: 3e08c753756a8b77fc0d81f0dc59ac08f2e70aeaa56412394a4c2bcc20afe496.jpg
  phosmaren:
    terrain: urban
    title: Phosmaren
    description: The main Aureliae port at the southeastern tip of the continent — the place where other races come to trade
      with the jellyfish people. A larger settlement than the others, with proper docks and harbor facilities, but still
      unmistakably Aureliae in design. The architecture glows with phosphorescent light, especially beautiful at dusk
      and night. A lighthouse-like structure emits a soft, pulsing bioluminescent beacon.
    exits:
      s: aureliae
      w: cindaron
      e: nakhara
    image: 8041ec2bfe3cee985507c3e74f6c9bd5f09aa682d1f9ba08545d095ef1f55d09.jpg
  thalvorek:
    terrain: underwater
    title: Thalvorek
    description: The underwater city of Thalvorek. Massive coral-and-stone architecture spiraling downward into deep blue
      water. Bioluminescent lights illuminate the structures in blues, greens, and golds. The buildings have a flowing,
      organic quality — grown from coral and shaped by current rather than built with straight lines. Schools of fish
      move through open archways. The scale is enormous — this is a true city, with districts, plazas, and towering
      structures, all beneath the waves. The surface above is calm, giving no hint of what lies below except a faint,
      diffused glow.
    exits:
      n: ophirae
      w: lagauri
      e: voxspore
    image: dc3bf8b9bc3e5c4d541e583cc13c039b0737c42b29e338a57f2b0754e49ca637.jpg
  mycollum:
    terrain: swamp
    title: Mycollum
    description: A fungal city at the intersection of forest and marsh. Enormous mushroom caps — some the size of buildings
      — form the canopy over a settlement built from living fungal material. Bioluminescent fungi of every color provide
      light — pale blues, soft greens, warm ambers. The ground is a thick carpet of mycelium, visibly pulsing with faint
      light as information travels through the network. Structures are grown, not built — hollowed-out giant mushrooms
      serve as homes, with shelf fungi forming stairs and platforms. The air is thick with spores that drift like snow.
      Everything is damp, organic, alive.
    exits:
      s: mycorae
      w: nakhara
      e: night_wind
    image: cccbeaf07a0bc4f4f3caa865d44d29c8778802dc02d2fdc4f11c65459f51afb1.jpg
  creeping_darkness:
    terrain: outside
    title: The Creeping Darkness
    description: "Creeping shadows pool unnaturally thick in this place, darkness so profound it seems almost solid—a
      tangible wrongness that swallows light rather than merely obscuring it. The very stone beneath your feet bears the
      discolored marks of decay, fractured and weeping a sickly luminescence like infected wounds, while the air tastes
      of copper, ash, and something far more ancient: the reek of stolen divinity twisted into instruments of
      suffering."
    exits:
      e: resistance_camp
      s: desert_sands
    image: 67066afa1c96a002b652f09b6bf7b1b1d88c277f7c10fa3f732995969c04e88c.jpg
    features:
      scorched_waystone:
        type: SIGN
        displayName: a scorched waystone leaning from the rot
        keyword: waystone
        text: >-
          The letters here are carved deep, as if in a hurry: "BEWARE. Not every shadow ahead is a lesson. 'consider'
          a creature before you raise a blade — it will tell you plainly whether you face practice or peril. If a
          fight sours, 'flee'. Better still, teach your feet wisdom in advance — 'wimpy 30' makes you run on your own
          the moment your health falls below three parts in ten."
  tessikon:
    terrain: urban
    title: The Coming-Soon Portal to Tessikon
    description: A city of pure engineering at the base of the central mountains, built by Tessikar the Springwright. High
      above the city, Tessikar's cabin and workshop are visible carved into the mountainside — smoke and steam venting
      from a cluttered genius's workshop, with a path winding down to the city below. The architecture is unlike
      anything else in Ambon — every surface is mechanical. Buildings of polished brass, copper, and steel, with visible
      gears, pistons, and clockwork mechanisms integrated into the structure itself. Towers topped with spinning
      orreries. Streets paved with interlocking metal plates. Steam vents release gentle plumes from underground
      workshops. Mechanical lifts carry people between terraced levels built into the mountainside. Automated market
      stalls with clockwork attendants. Crystal-powered lamps line every street — the crystals traded from the nearby
      Lithae, repurposed from beauty into function. The city hums — a constant low vibration of a thousand mechanisms
      working in harmony.
    exits:
      n: library_fairytales
      s: call_for_heroes
      w: crafters_workshop
      e: enchanted_bakery
    image: 65df522aa8c2369914463d0a832b3b5755c2a4fb0c357c9c44263c8a6c5bf73f.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  faegrimm:
    terrain: forest
    title: Faegrimm
    description: A weathered Lustriae settlement at the eastern edge of the sparse forest where it meets the rocky coast.
      Harder and grimmer than the western faerie communities — structures of dark twisted wood and grey stone, built to
      withstand coastal winds. Watch towers of black timber rise above the treeline. The faeries here are frontier folk.
      Fog rolls in from the sea. The buildings have a fortress quality underneath their organic construction — thorned
      vines growing over defensive walls, trees shaped into barricades. A settlement that says "this is where the gentle
      forest ends and the wild coast begins."
    exits:
      n: lustriae
      e: veratheron
    image: 248212b5d708da10e3a22a8a26233e16b386846b19eac5b10dd608a9d5f1d2d9.jpg
  cindaron:
    terrain: forest
    title: Cindaron
    description: A Pyrae settlement at the southern edge of the jungle, where the canopy thins and the caldera's warmth
      fades. The structures are lower here, the trees less massive. The architecture transitions from full canopy-city
      to something closer to ground level. The light is different — less of the supernatural golden glow, more natural.
      The settlement has a frontier quality — the last outpost of Pyrae civilization before the open Archae heartland
      begins. Embers of the caldera's warmth linger in the air, but just barely. A place of endings and thresholds.
    exits:
      s: pyrae
      e: phosmaren
      w: aineron
    image: 0330d08a1b566b1d520aa22256133d8c9bf0fc4d47352c8e02170cefbe4585c7.jpg
  lagauri:
    terrain: underwater
    title: Lagauri
    description: An Aureliae settlement in the central archipelago, built around and within a warm tropical lagoon. The
      architecture is half above water, half below — structures that descend from stilts above the surface down into the
      lagoon below. Everything glows — bioluminescent coral, luminescent jellyfish drifting through the shallows, the
      buildings themselves emanating soft golden and purple light. The lagoon water is shallow and warm, filled with
      life. Aureliae in their natural translucent, glowing forms are visible moving through the water. A city of light
      floating on a tropical sea.
    exits:
      n: aureliae
      e: thalvorek
      w: veratheron
    image: f72ff1300b002395f6024c9211798a83b3c5caee08583de913664b44a948db27.jpg
  nakhara:
    terrain: urban
    title: Nakhara
    description: A coastal trading settlement on the northeastern shore, larger and more developed than Thalnakh. Built on
      the beach and extending onto stilts over shallow water. The architecture incorporates pearl, shell, coral, and
      sea-glass — beautiful in an understated way. The offshore water is crystal-clear, revealing coral structures and
      the tops of underwater buildings in the shallows. Ophirae in their natural dragon-like forms are visible swimming
      in the water below the docks.
    exits:
      s: ophirae
      e: mycollum
      w: phosmaren
    image: 1f9176fbdb634ac7a78b7b51439abf676cf59a54c9c542ac37b6413d176e93f9.jpg
  voxspore:
    terrain: urban
    title: Voxspore
    description: A unique settlement where Kitsarae and Mycorae cultures blend. On one side, Kitsarae architecture —
      colorful, elegant, silk-draped market stalls and carved buildings. On the other, Mycorae fungal structures — giant
      mushrooms, bioluminescent light, mycelium walkways. The two styles meet and mingle in the center, creating a
      hybrid district unlike anything else in Ambon. A place where fox-clever diplomats trade with a hive-mind. The
      market stalls sell both conventional goods and exotic fungal products. The atmosphere is bustling, cosmopolitan,
      slightly surreal.
    exits:
      n: mycorae
      e: lyrasael
      w: thalvorek
    image: 4d753d106f9f9d97f48a8515eb9dbcc2e88bcb3cd67fdb4b3b15105f8d92e4a6.jpg
  lyrasael:
    terrain: urban
    title: Lyrasael
    description: A beautiful port city on the eastern coast of the Kitsarae basin. White and pastel buildings cascading down
      a hillside to a crescent harbor. The architecture is the most refined on the continent — graceful arches, tile
      roofs in warm terracotta and blue, open courtyards with fountains and flowering gardens. Musicians perform in
      public squares. Sailing vessels fill the harbor. The climate is perfect — warm sun, gentle breeze, blue water.
      This is the jewel of Kitsarae culture, the place every bard wants to perform and every diplomat wants to be
      posted. Mediterranean paradise with fox-clever charm.
    exits:
      w: voxspore
      n: vulgorth
    image: 6e2742ca669f368d274b233853dd4b46cb4a5fb7881582193d83116264ca2ff7.jpg
  vulgorth:
    terrain: mountain
    title: Vulgorth
    description: A Lithae settlement on the eastern slope of the mountains, facing the lowlands. More industrial and
      outward-facing than the deep holds — great forge chimneys rise from the mountainside, smoke and steam venting into
      the open air. The architecture transitions from mountain-carved stone at the top to more conventional buildings at
      the base where the settlement meets the trade roads. Workshops, smithies, and markets line terraced streets
      descending the slope. The gateway where dwarven craft meets the outside world. Warm forge-light glows from every
      window. Carts of finished metalwork and crystal goods line the roads heading east.
    exits:
      s: lyrasael
      n: night_wind
      w: mycorae
    image: 93f7c31b0240eb321ddbc1680626f9a73021e26e27153ebfcdfdfa1c6947e491.jpg
  krioshaion:
    terrain: sky
    title: Krioshaion
    description: Vast, rolling expanses of luminous colored mist — aurora-touched fog in silvers, golds, pale blues, soft
      violets, and rose pinks — drifting and shifting like a living sky made of ground. The mist doesn't obscure — it
      reveals, parting and reforming to show glimpses of impossible beauty. There is no ground in the conventional sense
      — visitors walk on surfaces of solidified moonlight, smooth and faintly warm, that glow from within. The "sky"
      above is not a sky but the inner surface of the moon itself — a vast dome of pearlescent silver-white that
      radiates gentle, ambient light from every direction.
    exits:
      n: moon
      s: luneqrae
    image: 5947c926ca33e82fe9b0391a62746b74790e512dda6b6160300d2e1b7a97ca29.jpg
  path_kaerinlith:
    terrain: mountain
    title: The Path to Kaerinlith
    description: A winding mountain path ascends toward a distant crystalline peak that shimmers with ethereal light, its
      slopes bathed in the soft, dreamlike glow of Auringold's perpetual twilight. Wildflowers in impossible
      hues—lavender, rose-gold, and pale silver—dot the rocky terrain, while the air itself seems to shimmer with gentle
      mist that obscures the drop-offs below, creating an atmosphere both wondrous and slightly disorienting, as if the
      very path exists between waking and dreaming.
    exits:
      s: foothills_kaerinlith
      e: deep_clockwork_forest
      n: mine_opening
    image: b80da180b860369e1da890a8a14773a252ddaff95121065bc6f7d990a65484fc.jpg
  cozy_inn:
    terrain: inside
    title: The Cozy Inn of Dreams
    description: "Warm lamplight spills across worn wooden floorboards as the crackling fireplace casts dancing shadows on
      the plush, dream-touched furnishings—every cushion and curtain rendered in soft golds and drowsy blues, as if the
      inn itself exists half in sleep. Familiar comforts materialize around you: a well-stocked bar of frosted glass
      bottles, small round tables perfect for quiet conversations, and an overall atmosphere that feels both safely
      enclosed and somehow infinite, like a cherished memory made manifest. Madame Herb keeps the hearth warm for
      dreamers — 'rest' here to mark the inn as your haven, and wherever the road later takes you, 'recall' will carry
      you home to it. Bodies and minds mend twice as quickly under an inn's roof."
    exits:
      s: tempest_between_worlds
      w: auringold_tavern
      n: arrival_king
    image: 0309c4708de74fbfb829e49e9543b4852d74e988fb34a25bb9ba277c3349a162.jpg
    inn: true
  gemstone_mineshaft:
    terrain: underground
    title: A Mineshaft Full of Gemstones
    description: Glittering veins of amethyst, emerald, and sapphire streak through the rough stone walls, catching light in
      fractured rainbows that dance across the earthen floor, while loose gemstones of every hue scatter across the
      ground like fallen stars awaiting discovery.
    exits:
      e: emberfell
      s: vault
    image: 5f99cd98b28e968d55981340885b126bf50a778ac35ee82a403c994f771bc9b4.jpg
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  enchanted_bakery:
    terrain: inside
    title: The Enchanted Bakery of Auringold
    description: Warm golden light spills through frosted windows as the scent of fresh-baked bread and sweet honey fills
      the air, with shelves lined in soft pastels displaying delicate confections that seem to glow with an otherworldly
      luminescence. The cozy interior radiates comfort and wonder—all rounded corners, soft textures, and whimsical
      details that feel both inviting and slightly dreamlike, as if you've stepped into a memory of safety rather than a
      real place.
    exits:
      s: auringold_tavern
      e: arrival_king
      w: tessikon
    image: 7ddce51ed28a620d2ec86bf12882671927b02d644778984cbb3045191620bb31.jpg
  auringold_tavern:
    terrain: inside
    title: The Retired Professor Tavern
    description: A cozy tavern bathed in warm lamplight, its wooden beams and shelves lined with well-worn books, curious
      artifacts, and half-empty bottles of amber liquor that catch the glow like captured firelight. Comfortable
      armchairs and round tables scattered throughout invite weary travelers to settle in, while the air itself seems
      thick with the scent of pipe smoke, old leather, and the faint sweetness of mulled wine—a place where stories
      linger as much as the patrons who tell them. Doctor Reinheart holds court among the bookshelves — 'train' lets
      him teach the arts of your calling, and 'train list' names each ability beside its price in skill points. A
      parlor rattling with dice and a salon smelling of rosewater and reinvention adjoin the taproom.
    exits:
      e: cozy_inn
      n: enchanted_bakery
      w: games_parlor
      s: twilight_salon
    image: 476b99795d7942fe98e2cae09a03547ded90113ad73395d7c3a4c4a9d00c6424.jpg
    tavern: true
  ship_graveyard:
    terrain: underwater
    title: A Graveyard of Sunken Ships
    description: Skeletal hulls of countless vessels lie scattered across the murky seafloor like the ribs of massive
      beasts, their splintered wood encrusted with bioluminescent coral and writhing sea anemones that paint the
      darkness with ethereal blues and greens. Swaying kelp forests have claimed the masts and rigging, while schools of
      phosphorescent fish weave through the skeletal remains, transforming this graveyard of human ambition into a
      haunting garden of brine and decay.
    exits:
      s: turbulent_waters
      e: sunken_ship_hull
      n: coral_reef
    image: 89b9cf85f3e6727d45b65b17f64ea2c29a838e13d4208c30b719cd34767f63b4.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  coral_reef:
    terrain: underwater
    title: A Coral Reef
    description: Brilliant corals in impossible hues—deep purples, electric blues, and shimmering golds—form towering
      formations around you, their branching arms creating natural corridors of wonder. Schools of luminescent fish dart
      through the crystalline water in synchronized waves, while anemones sway gently in the current, their tentacles
      painting trails of bioluminescent light across the dreamlike seascape.
    exits:
      e: seaweed_thicket
      n: sandy_shoal
      s: ship_graveyard
    image: 5279e2ca8653ebc5bcc9789e9cd5cac2b67f9096c2b220d7c1b0b641b0ac2662.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  seaweed_thicket:
    terrain: underwater
    title: A Seaweed Thicket
    description: Towering strands of emerald and amber seaweed sway gently in invisible currents, their fronds creating a
      dense, shifting labyrinth of shadows and filtered green light that dapples across the sandy bottom. The water here
      tastes of salt and ancient growth, with occasional glimpses of bioluminescent plankton twinkling like drowsy stars
      between the tangled stems.
    exits:
      s: sunken_ship_hull
      w: coral_reef
      n: tempest_between_worlds
    image: 4e606002b2d293908ea6702303ff66ceff916600bb011f3abccf678cb1789656.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  sunken_ship_hull:
    terrain: underwater
    title: Within the Hull of a Sunken Ship
    description: The rotting wooden hull of an ancient vessel lies tilted in the murky depths, its barnacle-encrusted
      timbers creaking softly with the current, while bioluminescent algae casts an eerie green-blue glow across the
      tilted deck and the skeletal remains of its rigging.
    exits:
      n: seaweed_thicket
      w: ship_graveyard
    image: 9d5aab8d4364c525b499dffc1b10464f1a2a002e1c40a08d743d0d7d020e2114.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  vault:
    terrain: underground
    title: Kvarcgagap's Vault
    description: A cavernous chamber carved from glittering quartz-veined stone, its walls faceted to catch and refract
      ethereal dreamlight into prismatic cascades of amber and violet. Towering crystalline formations jut from floor
      and ceiling like frozen waterfalls, their surfaces etched with faint runes that seem to shimmer with the memory of
      countless treasures once guarded within this hallowed vault.
    exits:
      n: gemstone_mineshaft
      w: humble_forest_cabin
    image: f729ad0d18906f2bada6705e141c6e1fea1a1556088ac548ac481dce13d834eb.jpg
    features:
      vault_chest:
        type: CONTAINER
        displayName: Kvarcgagap's Vault
        keyword: vault
        initialState: closed
        resetWithZone: true
        items:
          - gemstone_crate
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  wading_pond:
    terrain: outside
    title: Wading Across a Clockwork Pond
    description: A tranquil expanse of shallow water glimmers with an otherworldly luminescence, its surface dotted with
      floating brass gears and crystalline cogs that turn in perfect, silent synchronization; delicate streams of golden
      light dance between the mechanical pieces like living threads, while the water itself shimmers in soft blues and
      silvers, reflecting a sky that seems both dream-like and impossibly precise.
    exits:
      s: beside_clockwork_pond
      n: clockwork_dias
    image: 5fffac95ab32ad799a1a776c5acdf87183bacfe621e388407e16c1150c436025.jpg
    music: 525e63fd56577f2c86db08133633afbfe4f148b7a3e2403a586dd04a12cd347b.mp3
  caravan_stable:
    terrain: sky
    title: A Stable of Clockwork Horses
    description: A pair of gleaming brass automatons stand beneath a makeshift stable, floating among the stars. their
      bodies etched with intricate filigree and spinning gears visible beneath translucent panels in their flanks. Their
      mechanical eyes glow with an amber light, and wisps of enchanted steam curl from their nostrils, their polished
      surfaces reflecting candlelight in mesmerizing patterns.
    exits:
      w: endless_starry_void
      e: wagon_drifting_stars
    image: 5f9be7ba119db763266a550f3682a961f218b53a5efc33a4ceb80dc09adfe615.jpg
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
  kitsarae_study:
    terrain: forest
    title: The Path to Enlightenment
    description: A serene forest clearing bathed in soft, ethereal light where creatures of fur and feather sit in
      contemplative circles around glowing tomes and intricate geometric diagrams etched into moonlit stone. The air
      shimmers with arcane energy as some beings remain locked in animal form while others stand half-transformed, their
      silhouettes flickering between bestial and humanoid grace, their eyes alight with the spark of dawning intellect.
    exits:
      s: kitsarae_mountain_basin
      n: foothills_kaerinlith
    image: 7c7d300f9ff459aa5c9b2c87290b2c6ff6d75d51b5c63ddbdbfdb460be2b6449.jpg
  aineroia_cottage:
    terrain: outside
    title: Aineroia's Cottage
    description: A quaint cottage of pale wisteria wood sits nestled among luminescent dream-flowers, its thatched roof
      shimmering with threads of silver starlight that seem to drift upward like smoke. Warm amber light spills from
      curtained windows, and the doorway is framed by climbing vines bearing delicate glass-like blooms that chime
      softly in an unfelt breeze.
    exits:
      s: shattered_fae_wood
      e: aineron
    image: 765695329eab63cba7d77f28a0e8010d1baa6620c21d4da22f3810b1b19f8f22.jpg
    inn: true
  yaleron:
    terrain: urban
    title: Yaleron - A City Under Seige
    description: A walled Archae city east of the mountains, dominated by a large temple to the Creator. High, thick walls
      with few gates. The architecture is austere and conservative — functional stone buildings, no ornamentation, no
      concession to the newer magical aesthetics of post-ascension Ambon. The temple is the largest structure, its spire
      visible for miles. The city feels deliberately isolated — no sprawling suburbs, no welcoming market districts
      outside the walls. Roads approach but the gates are narrow.
    exits:
      s: necrambon
      n: resistance_camp
    image: 5e4aa3bbf50b398644f5a71f7bcf7a4eeb5d4bc69e4e83c9925ea09aee1ff75f.jpg
  necrambon:
    terrain: urban
    title: Necrambon
    description: >-
      A walled Archae city east of the mountains, dominated by a large temple to the Creator. High, thick walls with few
      gates. The architecture is austere and conservative — functional stone buildings, no ornamentation, no concession
      to the newer magical aesthetics of post-ascension Ambon. The temple is the largest structure, its spire visible
      for miles. The city feels deliberately isolated — no sprawling suburbs, no welcoming market districts outside the
      walls. Roads approach but the gates are narrow.

      The city has been destroyed. The walls are breached, the temple damaged. The streets are empty of the living. An
      oppressive, grey atmosphere — the light seems dimmer here, the air colder. Signs of Kirot's occupation everywhere
      — dark stains on the stones, an unnatural stillness. This is a place where terrible things happened and the land
      remembers. The architecture is intact but lifeless — a city that died with its people.
    image: e968c0831a4836afc16ba4e6715dd88dccbd95616b96c1ada9b900d7bc7d89e2.jpg
    exits:
      n: yaleron
      s: dream_hotel
  resistance_camp:
    terrain: mountain
    title: A Resistance Camp in the Mountains
    description: Rough-hewn tents of grey and brown canvas cling to the windswept ledges of a jagged mountain pass, their
      guide-ropes straining against the biting alpine wind, while cookfires glow like embers in the cold dusk below
      peaks dusted with snow. Banners of a dozen different orders and factions hang side by side between the rocks, and
      armored figures move purposefully among stacked crates and weapon racks, their breath misting in the thin air as
      the sprawling walled city of Yaleron looms far below in the valley's shadow.
    image: a0bb874f3ccbb2b71a5c616b1777301e81e878ec645bf217e3471f91a7201ed1.jpg
    exits:
      w: creeping_darkness
      s: yaleron
  dream_hotel:
    terrain: inside
    title: Hotel at the Edge of Dreams
    description: A grand but unsettling establishment where the architecture subtly defies logic — doorways slightly too
      tall, hallways that curve where they shouldn't, and wallpaper of deep burgundy and tarnished gold that seems to
      shift patterns when not looked at directly. Soft amber lamplight flickers throughout, casting long shadows across
      velvet furnishings and a front desk of dark lacquered wood, behind which hangs a clock with too many hands, all
      moving at different speeds.
    exits:
      s: library_fairytales
      n: necrambon
    image: 481dfc891901ad708722e5a02d83c7d2e90a450a5e0b0f8ed4e3a06852c95b77.jpg
    inn: true
  general_store:
    terrain: inside
    title: Madam Daydreams' General Store
    description: A cozy, cluttered shop bathed in warm amber lamplight, its wooden shelves sagging under the weight of
      colorful potion bottles, bundled herbs, and peculiar knick-knacks stacked from floor to ceiling. A faded velvet
      curtain separates the front counter from some unseen back room, and the air seems to shimmer faintly with the
      mingled scents of dried flowers and old magic. Madam Daydreams trades gladly with dreamers — 'list' spreads her
      wares before you, 'buy <thing>' makes one yours, and 'sell <thing>' parts with what no longer serves. 'gold'
      counts your coin. In a browser, the shop window opens itself the moment you ask for the list.
    exits:
      e: call_for_heroes
    image: c6b80d50e20e3c883a68c934f0aa7f77a0250541c0aba84a6dd9cb7e606bade5.jpg
  library_fairytales:
    terrain: inside
    title: The Library of Fairytales
    description: Towering shelves of dark mahogany stretch from floor to vaulted ceiling, crammed with leather-bound tomes
      whose gilded spines shimmer with a faint, otherworldly glow, while clusters of floating candles drift lazily
      between the stacks, casting warm pools of amber light across worn reading tables scattered with open books and
      fallen feathers. Faded tapestries depicting wolves in grandmother's clothing, glass slippers, and spinning wheels
      adorn the stone walls, and in the far corner, a massive illustrated atlas lies open on a pedestal, its pages
      slowly turning on their own as if an invisible hand searches for a forgotten story. Uehma teaches every calling
      beneath these shelves — 'train' shows what she can awaken in you, and 'train learn <ability>' commits it to your
      bones. Deeper in, the shelves give way to the Riddle Gallery, and the Hall of Records keeps the Academy's
      tallies of glory.
    image: 6d192aa9e3f04aaf85e413fea876d016d183d2b21725c77dd3dea2d96f491244.jpg
    exits:
      n: dream_hotel
      s: tessikon
      e: riddle_gallery
      w: hall_of_records
  kiriton_winter:
    terrain: outside
    title: Harsh Kiriton Winter
    description: Frost-rimed wooden structures huddle together beneath a merciless grey sky, their rooftops buried under
      heavy drifts of snow while icicles hang like pale fangs from every eave. The settlement's paths are swallowed in
      white, the frozen earth cracked and unyielding, and the skeletal silhouettes of barren trees sway against a biting
      wind that scours the land bare of any warmth or color.
    exits:
      n: first_archae
      w: heralds_of_creation
    image: 28ff73b7cfe9eaa48941f4fab10447aa916be3b0785f0f34fd5c618c7f7be723.jpg
  underground_river:
    terrain: underground
    title: An Underground River
    description: A wide, dark river cuts silently through a vaulted stone cavern, its black water catching faint glimmers of
      bioluminescent moss clinging to the slick, dripping walls. Jagged stalactites hang overhead like stone teeth, and
      the air carries the cold, mineral scent of deep earth made almost visible in faint wisps of pale mist drifting
      across the slow current.
    exits:
      w: sleeping_stone_statues
      n: waterfall
    image: 8bddb8069ad07b2c89cdcd0f22547302fc843473ffbb879fe57e80cd79c76e96.jpg
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  waterfall:
    terrain: mountain
    title: A Mountain Waterfall
    description: A breathtaking cascade of crystalline water thunders down the face of a moss-covered granite cliff,
      catching the light in a thousand shimmering droplets that drift like silver mist through the cool mountain air.
      Lush ferns and wildflowers cling to the rocky banks where the churning white water collects into a deep, emerald
      pool below.
    exits:
      s: underground_river
      w: turbulent_waters
    image: 275cd52857efa2f96d298529f177d4ab587d3c8409216c7b3354bf7e7b588f51.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
  crafters_workshop:
    terrain: inside
    title: Crafter's Workshop
    description: Warm firelight flickers from a stone forge tucked into one corner, its chimney blackened with years of
      soot, while across the room an alchemist's table gleams with glass vials, bubbling retorts, and shelves crowded
      with labeled reagents. A sturdy loom and spinning wheel occupy a quieter alcove, draped with half-finished bolts
      of cloth in rich, earthy hues, the whole space smelling of coal smoke, herbs, and raw wool. The forge hungers for
      honest work — 'recipes' lists what your hands know, 'craft <recipe>' sets hammer to metal, and 'craftskills'
      tracks your growing mastery. Standing at a proper station like this one sweetens every craft with bonus goods.
      Doorways lead on to the gardens, the alchemy lab, and the tinker's bench.
    exits:
      e: tessikon
      n: gathering_garden
      s: alchemy_lab
      w: tinkers_bench
    image: 1d237cf52db65fb29656f05b7783dbf001436e26ecf06ef61d7347a486f491d6.jpg
    station: forge
  betrayer_study:
    terrain: inside
    title: The Betrayer's Study
    description: Candlelight flickers across an obsidian altar of polished black glass, its surface etched with spiraling
      runes that seem to drink in the shadows; arranged upon it are dried bundles of luminescent herbs that glow with
      soft violet and silver light, an ornate bassinet lined with gossamer silk, and a ceremonial dagger whose blade
      catches the firelight like captured starlight. The air shimmers with an otherworldly haze, carrying the sweet
      scent of dreamsmoke and rebirth magic, as if the very boundary between the realm of the dead and the waking world
      grows thin in this consecrated space.
    exits:
      w: arcane_tempest
      n: royal_graveyard
    image: cfbc9592e1c6919d62586c9abe6dcfa975ecdcb5e7b35d3f1943ec081eac4e4c.jpg
  kitsarae_mountain_basin:
    terrain: forest
    title: The Awakening of the Kitsarae
    description: Towering plant-like titans rise from the earth here, their bark-thick limbs draped in cascading vines and
      luminous blossoms that pulse with a soft, golden-green light. Smaller creatures nest within their broad, mossy
      shoulders and hollowed trunks, while the roots sprawl outward like ancient roads, threading between stone and soil
      at the foot of the mountain range.
    exits:
      s: sylflorae_farm
      n: kitsarae_study
    image: 2274b912789783348cd1979b25bc51577d09a5231cc46db1ebadafa61ad670dd.jpg
  academy_quad:
    terrain: outside
    title: The Academy Quad
    description: A broad lawn of silver-green dreamgrass quartered by lantern-lit paths, where banners bearing the
      Academy's orrery crest stir in a wind that smells of chalk dust and night-blooming jasmine. Students of every race
      drift between lessons, some trailed by clockwork familiars, and at the lawn's heart Provost Lumina Auringale
      presides from a floating lectern that follows her like a patient moon. Speak with her by typing 'talk provost' —
      her coursework will walk you through everything the Academy teaches. A notice board crowded with parchment stands
      beside the lectern ('read board').
    exits:
      n: call_for_heroes
      w: orientation_hall
      e: proving_yard
      s: market_row
      d: catacombs_landing
    features:
      notice_board:
        type: SIGN
        displayName: a notice board crowded with fluttering parchment
        keyword: board
        text: >-
          ACADEMY NOTICES. Daily chores refresh each dawn — 'daily' lists today's, 'weekly' the week's grand task. The
          Cosmic Bureau posts open bounties: 'bounty' takes one, 'bounty info' checks it, 'bounty abandon' admits
          defeat. When the whole dream competes, 'gquest' shows the standing contest. Your own coursework is always
          under 'quests' — 'quest info <name>' for details, 'quest turnin <name>' when an instructor owes you a
          reward, 'quest abandon <name>' to drop one. Browser students: the Quests panel tracks all of this for you.
  orientation_hall:
    terrain: inside
    title: The Orientation Hall
    description: Rows of mismatched desks face an enormous slate chalkboard on which lesson notes write and erase
      themselves in looping silver script. Paper birds folded from old syllabi roost in the rafters, occasionally
      gliding down to peck at crumbs of eraser dust, and a cheerful wisp of lantern-light bobs near the lectern, eager
      to be asked anything at all. Settle your preferences before the term begins — the chalkboard keeps the full list
      ('read chalkboard'), and the welcome chest by the door holds a small gift for every new student ('open chest',
      then 'get biscuit from chest').
    exits:
      e: academy_quad
    features:
      orientation_chalkboard:
        type: SIGN
        displayName: an enormous self-writing chalkboard
        keyword: chalkboard
        text: >-
          SETTLING IN, A CHECKLIST. Colors too loud or too quiet? 'ansi on' / 'ansi off', and 'colors' previews the
          palette. Using a screen reader? 'screenreader on' tailors every message for it. Tired of stooping for loot?
          'autoloot on' pockets your spoils as you win them. Curious what lies one room over? 'autopeek on'. Screen
          cluttered? 'clear'. Lost? 'help'. Visiting as a guest? 'claim <password>' makes this character truly yours
          before you leave. Browser students — the gear icon and Ctrl+K command palette hold these same switches, and
          the terminal overlay shows this classic text any time you miss it.
      welcome_chest:
        type: CONTAINER
        displayName: a carved welcome chest with brass corners
        keyword: chest
        initialState: closed
        respawnSeconds: 120
        items:
          - dreamers_biscuit
  proving_yard:
    terrain: outside
    title: The Proving Yard
    description: Packed earth scarred by ten thousand practice bouts, ringed by racks of blunted weapons and lit by
      floating lanterns that politely look away whenever a student fumbles. Straw-stuffed training dummies stand in
      patient rows, each wearing a hand-painted face of theatrical menace, while Drillmaster Brasswick — a barrel-chested
      clockwork sergeant with a whistle of polished bone — stalks the line barking encouragement. Take his coursework
      with 'talk drillmaster', then square up to a dummy with 'consider dummy' and 'kill dummy'. The slate by the gate
      lists the fundamentals ('read slate').
    exits:
      w: academy_quad
      e: sparring_circle
      s: beast_pen
    features:
      combat_slate:
        type: SIGN
        displayName: a battered slate hung from the weapon rack
        keyword: slate
        text: >-
          COMBAT, THE SHORT COURSE. 'consider <foe>' weighs your chances — believe it. 'kill <foe>' begins the bout;
          your blade swings itself, but your judgment does not. 'cast <ability> <foe>' spends mana for greater blows —
          'spells' lists what you know, 'effects' what currently rides you. 'flee' is never shameful. Keep a snack or
          potion handy and 'use' it, or let 'quickheal' and 'quickmana' choose for you. The fallen leave spoils —
          'get' them, or let 'autoloot on' do the stooping. Browser students fight just as well by tapping a foe and
          using the ability bar.
  sparring_circle:
    terrain: outside
    title: The Sparring Circle
    description: A ring of white chalk renewed each dawn by some unseen hand, where brass sparring golems wait with
      arms folded and the air tastes faintly of ozone and ambition. At the ring's edge an examination golem twice the
      others' size stands under a canopy, a silk ribbon reading PROCTOR pinned to its chest plate. Weigh each opponent
      before you step in — 'consider golem' will read you the odds, and 'consider proctor' should give you honest
      pause. The dummies next door never hit back; everything in this circle does.
    exits:
      w: proving_yard
      s: duel_ring
  beast_pen:
    terrain: outside
    title: The Misbehaving Menagerie
    description: A fenced pen of churned mud and chewed fence posts where the Academy keeps its less cooperative
      teaching aids. A gloomling — all damp shadow and enormous eyes — skitters from puddle to puddle and bolts the
      moment anyone looks fierce, while something that is almost certainly not a footstool waits with suspicious
      stillness in the corner. Mind the placard before you wander close ('read placard').
    exits:
      n: proving_yard
    features:
      pen_placard:
        type: SIGN
        displayName: a mud-spattered placard wired to the fence
        keyword: placard
        text: >-
          MENAGERIE SAFETY. One — the mimic by the corner attacks anyone who lingers; some creatures in Ambon need no
          invitation, so 'consider' before you wander. Two — the gloomling flees when wounded; chase it and learn how
          cowards fight. Three — set your own cowardice wisely. 'wimpy 30' flees you automatically below thirty
          percent health; 'wimpy off' disables it; plain 'wimpy' reports it. Four — if a lesson goes badly, 'flee',
          drink something, and come back wiser.
  duel_ring:
    terrain: outside
    title: The Duel Ring
    description: An elegant sunken ring of pale marble, its tiers cushioned in velvet for spectators and its floor
      etched with runes that catch and soften every killing blow. Marshal Valenne — a silver-masked Lustriae with a
      dueling sabre worn like jewelry — oversees all matches of honor with theatrical gravity. Challenges here harm
      pride alone; ask her about the forms with 'talk marshal', or read the etiquette plaque ('read plaque').
    exits:
      n: sparring_circle
    features:
      duel_plaque:
        type: SIGN
        displayName: a marble plaque inlaid with crossed sabres
        keyword: plaque
        text: >-
          THE FORMS OF HONOR. To challenge a fellow dreamer, 'duel <name>'. They answer with 'duel accept' or 'duel
          decline' — both are polite. The ring referees itself; when one duelist falls the runes catch them, and honor
          is settled with no lasting harm. Duels may be fought anywhere in Ambon, but the ring remembers your
          victories more fondly. PvP kills also earn honor on the leaderboards — 'leaderboard' to see where you
          stand.
  market_row:
    terrain: urban
    title: Market Row
    description: A crooked lane of leaning shopfronts strung with paper lanterns, where the cobblestones have been worn
      smooth by generations of dreaming feet. Hawkers' stalls display bottled lullabies and self-shuffling card decks,
      a fountain shaped like a yawning moon burbles in the middle distance, and the smell of toasted sugar drifts from
      somewhere that is never quite findable. Commerce of every flavor lives along this row — the bank, the auction
      hall, the provisioner, and the offices where homes and guilds are chartered. The crier's post summarizes it all
      ('read post').
    exits:
      n: academy_quad
      w: bursar_bank
      s: auction_hall
      e: provisioners_nook
    features:
      criers_post:
        type: SIGN
        displayName: the town crier's post, papered in handbills
        keyword: post
        text: >-
          MATTERS OF COIN. 'gold' counts what you carry; 'currencies' counts subtler wealth, like Academy Merits.
          'give <item> <person>' is generosity, 'drop' and 'get' are carelessness and its remedy. The Bursar's bank
          keeps coin and goods safe forever — even from you. The auction hall sells to the highest dreamer. The
          provisioner stocks what adventurers actually need. And when you tire of renting rooms in other people's
          dreams, the broker and the registrar will sell you a house or charter your guild.
  bursar_bank:
    terrain: inside
    title: The Bursar's Vault
    description: Beyond a counter of polished obsidian, shelves of strongboxes recede impossibly far into the hillside,
      each humming a different note so the Bursar can find them by ear. Brass lamps burn with a flame that casts no
      shadow, the air smells of cold iron and ledger ink, and somewhere deep below something enormous turns over in its
      sleep — the interest, perhaps, compounding. Bursar Coppertill will gladly explain the house rules ('talk
      bursar'), which are also etched plainly into the counter ('read counter').
    exits:
      e: market_row
    bank: true
    features:
      vault_counter:
        type: SIGN
        displayName: an obsidian counter etched with the house rules
        keyword: counter
        text: >-
          THE BURSAR'S RULES. 'bank' states your balance and stored goods. 'deposit 50' entrusts us with coin;
          'deposit <item>' with property. 'withdraw 50' or 'withdraw <item>' reclaims either. What the vault holds,
          nothing can take — not thieves, not death, not your own enthusiasm. Browser patrons may simply open the
          Bank panel while standing in this room. The Bursar reminds you that gold carried is gold spendable, and
          gold spendable is gold spent.
  auction_hall:
    terrain: inside
    title: The Auction Hall of Whispered Bids
    description: An amphitheater of velvet and brass where a chandelier of captured fireflies dims respectfully each
      time the hammer falls. Auctioneer Mirabelle — a Kitsarae with an opera voice and a gavel of petrified lightning —
      presides over lots that float serenely above the block in soap-bubble spheres. Anyone may sell and anyone may
      bid; the rules of the house hang beside the block ('read rules'), and Mirabelle herself will teach the finer
      points ('talk auctioneer').
    exits:
      n: market_row
      w: broker_office
      e: guild_registry
    auction: true
    features:
      house_rules:
        type: SIGN
        displayName: the house rules, hung in a gilt frame
        keyword: rules
        text: >-
          THE WHISPERED BID. 'auction' (or 'auction list') shows every lot on the block. 'auction sell <item>
          <price>' offers your own treasure to the dream at the price you name. 'auction buy <number>' claims a lot;
          'auction cancel <number>' withdraws one of yours, no questions asked. Coin changes hands instantly and the
          house takes no cut — we are, after all, only dreaming. Browser bidders will find the Auction panel opens
          right here.
  provisioners_nook:
    terrain: inside
    title: The Provisioner's Nook
    description: A snug shop smelling of wax, rope, and restorative cordials, its walls hung with coils of silver twine
      and shelves of stout red-and-blue bottles arranged by cheerfulness. Postmistress Wren runs the counter and the
      adjoining post office at once, sorting letters with one hand and corking potions with the other, while a supply
      crate of communal odds and ends sits open to any student in need. Stock up before your lessons ('list', then
      'buy <thing>'), rummage the crate ('open crate', 'search crate', 'get rope from crate'), and ask Wren about the
      post ('talk wren').
    exits:
      w: market_row
    features:
      supply_crate:
        type: CONTAINER
        displayName: a communal supply crate stenciled TAKE WHAT YOU NEED
        keyword: crate
        initialState: closed
        respawnSeconds: 90
        items:
          - practice_rope
          - dreamers_biscuit
      post_board:
        type: SIGN
        displayName: a corkboard of postal notices
        keyword: notices
        text: >-
          THE POST AND THE HANDSHAKE. Letters travel even between dreams — 'mail send <name>' composes one (coin and
          parcels may ride along), 'mail' lists your inbox, 'mail read 1' opens a letter, 'mail claim 1' pockets its
          enclosures, 'mail delete 1' burns it. For trades made face to face, 'trade <name>' opens a bargaining
          table; 'trade offer <item>' and 'trade offer 50 gold' load your side, 'trade accept' shakes on it, 'trade
          cancel' walks away. Both dreamers must accept before anything moves — the handshake protects you both.
  broker_office:
    terrain: inside
    title: The Estates Broker's Office
    description: A reassuring office of deep carpets and deeper armchairs, where scale models of cottages, vaults, and
      one alarmingly large castle rotate slowly inside glass bell jars. Broker Thistledown — a Mycorae whose cap is
      politely doffed indoors — sells not houses but the dreams of houses, which in Auringold amounts to the same
      thing. Browse the catalog with 'house list', ask the broker anything ('talk broker'), and read the fine print,
      which for once is printed large ('read print').
    exits:
      e: auction_hall
    housingBroker: true
    features:
      fine_print:
        type: SIGN
        displayName: the fine print, printed mercifully large
        keyword: print
        text: >-
          ON THE OWNERSHIP OF DREAMS. 'house list' shows every room we build and its price. 'house buy' (spoken in
          this office) purchases your first carriage house; 'house expand <template> <direction>' grows it room by
          room thereafter. 'house' reports your estate; 'house invite <name>' and 'house kick <name>' manage guests;
          'house describe title <words>' and 'house describe desc <words>' redecorate in prose. Homes are safe rooms
          — beds rest you, vaults hold your things, and nobody uninvited gets in. Saving up is half the pride of it.
  guild_registry:
    terrain: inside
    title: The Guild Registry
    description: A hall of dark wood and brighter heraldry, every wall crowded with the crests of fellowships past —
      some noble, some long dissolved, one apparently just a painting of soup. Registrar Oakhollow, a Lithae whose
      granite hands are surprisingly gentle with parchment, keeps the great ledger of guilds and the smaller, warmer
      ledger of friendships. He will witness your charter ('talk registrar'), and the wall of crests explains the
      forms ('read crests').
    exits:
      w: auction_hall
    features:
      crest_wall:
        type: SIGN
        displayName: the wall of crests and its engraved forms
        keyword: crests
        text: >-
          ON FELLOWSHIP. Guilds are forever-marks — 'guild create <name> <TAG>' founds one, 'guild invite <name>'
          grows it, 'guild roster', 'guild motd <words>', 'guild promote' and 'guild demote' keep it civil, and
          'gchat <words>' (or 'g') speaks only to your own. A guild may even raise a hall — ask about 'guild hall
          buy'. Groups are tonight-marks — 'group invite <name>' to hunt together, 'group accept' to join, 'gtell
          <words>' to whisper to the hunting party, 'group leave' when dawn comes. Friends are kept-marks — 'friend
          add <name>', 'friends' to see who walks the dream beside you. And 'who' shows everyone awake right now.
  gathering_garden:
    terrain: outside
    title: The Gathering Garden
    description: Terraced beds of impossible botany descend toward a brook that giggles when stepped over, the air
      heavy with pollen that glitters faintly before settling. Moonpetal blooms open and close in slow heartbeat
      rhythm, trellised sunsap vines drip amber light instead of nectar, and Gardener Fernwhistle — a Sylflorae with a
      watering can that is also somehow a hat — putters between the rows leaving footprints of clover. She teaches the
      gentle arts ('talk gardener'); the potting bench keeps her instructions ('read bench').
    exits:
      s: crafters_workshop
      w: old_mine_gate
    features:
      potting_bench:
        type: SIGN
        displayName: a potting bench chalked with field notes
        keyword: bench
        text: >-
          THE GENTLE ARTS. Living makings must be gathered — 'gather petals' coaxes the moonpetal bed, 'gather vine'
          the sunsap trellis. Each bed needs a short rest after harvest, and so might you. 'craftskills' shows your
          mastery of herbalism and every other craft; skill grows by doing. When one craft becomes your calling,
          'specialize <craft>' devotes you to it for a bonus to all its learning. Browser gardeners — the Crafting
          panel lists every gatherable thing in reach.
  old_mine_gate:
    terrain: outside
    title: The Old Mine Gate
    description: A timber-framed adit yawning from the hillside behind the workshop, its lintel carved with the
      Academy crest and a much older miner's blessing worn nearly smooth. Cart tracks run inward into glittering
      dark, a rack of borrowable picks leans by the entrance, and Foreman Graveljaw — a Lithae whose beard appears to
      be genuine quartz — sits sentry on an upturned bucket. He knows every seam below ('talk foreman'), and the
      assay board posts what the mountain is offering ('read board').
    exits:
      e: gathering_garden
      d: crystal_seam
    features:
      assay_board:
        type: SIGN
        displayName: the foreman's assay board
        keyword: board
        text: >-
          ASSAY OF THE DEEPS. Below this gate the dream grows mineral. 'gather seam' (or 'mine seam') works the
          glimmer-ore; 'gather pocket' tries the dreamglass, which asks a steadier hand — skill 2 or better. Every
          seam occasionally yields something rare; that is not luck but the mountain's opinion of you. Ore feeds the
          forge, dreamglass feeds finer work, and 'craftskills' tracks how the mountain's opinion is trending.
  crystal_seam:
    terrain: underground
    title: The Crystal Seam
    description: A low gallery where lantern light returns from the walls multiplied and slightly improved, every
      surface veined with glimmer-ore that pulses like a slow second heartbeat. Pockets of dreamglass bloom from the
      stone in frozen splashes, each holding a tiny refracted image of somewhere else in the dream, and the dark
      beyond the lamplight has the companionable quality of a cellar rather than a cave. The seams here are for
      working — 'gather seam' for ore, 'gather pocket' for dreamglass — and the way back up is never far.
    exits:
      u: old_mine_gate
  alchemy_lab:
    terrain: inside
    title: The Alchemy Lab
    description: Copper kettles mutter over violet flames while glass coils carry blushing liquids from bench to bench
      in no particular hurry. The shelves hold reagents labeled in six languages and one apology, the ceiling bears a
      stain shaped exactly like the headmaster of some other school, and Alchemist Dewdrop — an Ophirae in
      wave-patterned robes — measures drops with the serenity of falling rain. Her table welcomes all students ('talk
      alchemist'); the formulary lists the founding recipes ('read formulary').
    exits:
      n: crafters_workshop
    station: alchemy_table
    features:
      formulary:
        type: SIGN
        displayName: a formulary propped open on a reading stand
        keyword: formulary
        text: >-
          THE FOUNDING FORMULAE. Brewing happens at an alchemy table such as this one — 'recipes' lists what you can
          make, 'recipes alchemy' narrows the list, 'craft minor healing draught' brews the classic. Draughts mend
          the body and philters the mind; 'use' one in need, or trust 'quickheal' and 'quickmana' to grab the best
          bottle you carry. Brewing at the table itself yields a little extra — the glassware approves of being
          included.
  tinkers_bench:
    terrain: inside
    title: The Tinker's Bench
    description: A long workbench of scarred oak under a constellation of hanging tools, each swaying gently toward
      whichever project needs it next. Half-finished marvels crowd the shelves — a music box that plays tomorrow's
      weather, a compass pointing to lost buttons — and a wall of tiny labeled drawers holds springs, lenses, and
      patience. The bench works wonders from humbler stuff ('recipes', then 'craft <thing>' while standing here), and
      its brass placard explains the house philosophy ('read placard').
    exits:
      e: crafters_workshop
      s: enchanting_sanctum
    station: workbench
    features:
      bench_placard:
        type: SIGN
        displayName: a brass placard screwed slightly crooked
        keyword: placard
        text: >-
          THE TINKER'S PHILOSOPHY. A workbench turns oddments into wonders — dreamglass into charms, lanterns,
          and the small necessary things no forge or kettle thinks to make. 'recipes' shows the bench's repertoire
          beside everything else you know; each craft names the station it wants. Work at the proper station and the
          work repays you in kind. When your hands outgrow these benches, 'specialize' in the craft you love best.
  enchanting_sanctum:
    terrain: inside
    title: The Enchanting Sanctum
    description: A hushed circular chamber where the walls are bookshelves and the books are chained — not to prevent
      theft, the plaques insist, but escape. Motes of stardust orbit a lectern of frosted crystal in slow ellipses,
      runes drift across the floor like leaves on a pond, and Enchanter Silverquill — an Aetherae whose hair will not
      commit to a single constellation — coaxes sleeping magic into waking metal. The art is taught freely ('talk
      enchanter'), and the lectern bears its grammar ('read lectern').
    exits:
      n: tinkers_bench
    features:
      rune_lectern:
        type: SIGN
        displayName: a frosted crystal lectern inscribed with rune-grammar
        keyword: lectern
        text: >-
          THE GRAMMAR OF WAKING MAGIC. 'enchantments' lists every working this sanctum knows and the makings each
          demands — stardust always, and something with character. 'enchant <item> <enchantment>' weaves one into a
          worn-slot treasure ('enchant sword keen_edge', say); plain 'enchant <item>' lets the sanctum choose the
          finest you can manage. Each item holds one enchantment, so choose with feeling. The craft grows like any
          other — 'craftskills' tracks it, and greater workings unlock as your hand steadies.
  hall_of_records:
    terrain: inside
    title: The Hall of Records
    description: A long gallery where the Academy's memory is kept in marble and gold leaf — plinths bearing the names
      of celebrated graduates, cabinets of medals polished nightly by moths trained for the purpose, and a great
      brass orrery whose planets are tiny portraits of the year's finest students. Archivist Inkwhisper drifts between
      the stacks correcting history's penmanship, happy to explain how glory is measured ('talk archivist'). Two
      monuments anchor the hall — the Ledger of Legends ('read ledger') and the Prestige Plaque ('read plaque').
    exits:
      e: library_fairytales
    features:
      ledger_of_legends:
        type: SIGN
        displayName: the Ledger of Legends, open on a marble plinth
        keyword: ledger
        text: >-
          HOW GLORY IS KEPT. 'achievements' lists every deed the dream has noticed in you, finished and unfinished
          alike — some are secrets until earned. Great deeds grant titles; 'title <name of title>' wears one
          proudly, 'title clear' retires it. 'leaderboard' ranks the dream's finest by many measures — 'leaderboard
          level', 'leaderboard gold', and more. 'describe <words>' writes the line others read when they look upon
          you, and 'describe check <name>' reads theirs.
      prestige_plaque:
        type: SIGN
        displayName: the Prestige Plaque, veiled in dust-silk
        keyword: plaque
        text: >-
          SUBTLER LEDGERS. 'currencies' (or 'wallet') counts wealth beyond gold — Academy Merits among them, earned
          by coursework and admired by collectors. 'reputation' (or 'rep') shows how the dream's factions regard
          you; deeds tilt their opinion, and the catacombs below keep one such grudge warm. As for the veiled
          half of this plaque — 'prestige' speaks of a ceremony for heroes who reach the summit of their power and
          choose to climb again. The dust-silk suggests no one has managed it lately.
  riddle_gallery:
    terrain: inside
    title: The Riddle Gallery
    description: A vaulted annex where the bookshelves have grown playful, rearranging their spines into puns when no
      one watches. At the gallery's heart crouches the Sphinx of Softwords — housecat-sized, marble-furred, and
      insufferably pleased with itself — atop a pedestal carved with question marks in forty alphabets. Beyond it, a
      door of dark walnut waits under an engraved arch, locked to all who have not answered. Hear the riddle by
      reading the pedestal ('read pedestal'), and offer your solution with 'answer <your answer>'.
    exits:
      w: library_fairytales
      e:
        to: vault_of_whispers
        door:
          initialState: locked
          keyItemId: key_of_questions
    features:
      riddle_pedestal:
        type: SIGN
        displayName: a pedestal carved with question marks in forty alphabets
        keyword: pedestal
        text: >-
          The sphinx's riddle, engraved in patient stone: "I speak without a mouth and hear without ears. I have no
          body, but I come alive with wind. What am I?" Offer your solution aloud with 'answer <word>'. Correct
          answers are rewarded; incorrect ones are remembered, fondly and forever, by the sphinx. The walnut door
          beyond opens only to the key the sphinx guards — once it is yours, 'unlock door' and 'open door' grant
          passage.
  vault_of_whispers:
    terrain: inside
    title: The Vault of Whispers
    description: A circular stone chamber that swallows sound — your own footsteps arrive a half-beat late, apologetic.
      Three great levers of celestial brass rise from the floor, crowned in turn with a blazing sun, a crescent moon,
      and a five-pointed star, and the eastern wall is suspiciously blank in the way of walls that are also doors. A
      verse is chiseled above the levers ('read verse'); pull them in the order it praises — 'pull star', 'pull moon',
      'pull sun' are the manner of it — and the wall may reconsider.
    exits:
      w: riddle_gallery
    features:
      vault_verse:
        type: SIGN
        displayName: a verse chiseled above the levers
        keyword: verse
        text: >-
          "Last light of evening, first to wake — the STAR stands watch for heaven's sake. The MOON comes next on
          silver feet, where night and morning briefly meet. And last of all the SUN climbs high, to open wide the
          waiting sky." Pull the levers as the verse walks — star, then moon, then sun — and the blank wall will
          remember being a door.
      star_lever:
        type: LEVER
        displayName: a brass lever crowned with a five-pointed star
        keyword: star
        initialState: up
        respawnSeconds: 60
      moon_lever:
        type: LEVER
        displayName: a brass lever crowned with a crescent moon
        keyword: moon
        initialState: up
        respawnSeconds: 60
      sun_lever:
        type: LEVER
        displayName: a brass lever crowned with a blazing sun
        keyword: sun
        initialState: up
        respawnSeconds: 60
  secret_archive:
    terrain: inside
    title: The Secret Archive
    description: A hidden reading room lit by a skylight that opens onto stars unfamiliar even to Auringold, where the
      Academy keeps the books too true for the open shelves. A marble mouth set into the far wall recites its single
      riddle to each visitor with evident relish, guarding a strongbox bound in silver; the Grimoire of Beginnings
      rests on a lectern, available to any student bold enough to have arrived. Take the grimoire ('get grimoire'),
      hear the mouth's riddle ('read mouth' — then 'answer <word>'), and spend its key before the room forgets you
      ('unlock strongbox', 'open strongbox', 'get seal from strongbox').
    exits:
      w: vault_of_whispers
    features:
      marble_mouth:
        type: SIGN
        displayName: a marble mouth set into the wall, mid-recitation
        keyword: mouth
        text: >-
          The mouth recites, rolling each word like a sweet: "I have keys that open no locks, a space but no room,
          and you may enter though you never go in. What am I?" Speak your solution with 'answer <word>'. The mouth
          dispenses a silver key to the worthy — a key the strongbox accepts exactly once, so open it while the
          kindness lasts.
      archive_strongbox:
        type: CONTAINER
        displayName: a strongbox bound in tarnished silver
        keyword: strongbox
        initialState: locked
        keyItemId: archive_key
        keyConsumed: true
        respawnSeconds: 120
        items:
          - scholars_seal
  games_parlor:
    terrain: inside
    title: The Parlor of Small Fortunes
    description: A snug gambling den attached to the tavern, upholstered in green felt and good cheer, where the dice
      are honest because Gamemaster Fortuna once asked them nicely and they have never forgotten. A crystal jar of
      lottery tickets glitters on the mantel beneath a chalkboard of past jackpots, each crossed out with theatrical
      grief. Fortuna deals in hope at fair prices ('talk gamemaster'); the table card states the odds without
      blushing ('read card').
    exits:
      e: auringold_tavern
    tavern: true
    features:
      table_card:
        type: SIGN
        displayName: a table card stating the odds without blushing
        keyword: card
        text: >-
          SMALL FORTUNES, FAIRLY SOLD. The dice — 'gamble 10' wagers ten gold on a roll against the house; win and
          it doubles. Plain 'gamble' recites the full rules. The lottery — 'lottery' shows the jackpot now growing,
          'lottery buy' takes a ticket, 'lottery buy 5' takes five, and each drawing crowns one dreamer an hour. Both
          pleasures require a tavern's hospitality, which this parlor is licensed to provide. Fortuna's only law is
          carved into the mantel — wager what you would happily lose.
  twilight_salon:
    terrain: inside
    title: The Twilight Salon
    description: A boudoir of rose-gold mirrors and hovering scissor-birds, perfumed with rosewater and the faint ozone
      of transformation. Madame Papillon — a Kitsarae whose own face is a rotating exhibition — circles each client
      like a sculptor judging marble, while the mirrors politely show not what you are but what you are considering.
      Reinvention is the house specialty ('talk stylist'), with the menu of services lettered in gold on the central
      mirror ('read mirror').
    exits:
      n: auringold_tavern
    stylist: true
    features:
      service_mirror:
        type: SIGN
        displayName: a rose-gold mirror lettered with the menu of services
        keyword: mirror
        text: >-
          THE MENU OF BECOMING. 'stylist' lists every race Madame Papillon can make of you and her fee for the
          deeper work; 'changerace <race>' commits to it. Gentler adjustments are free of charge anywhere — 'gender
          <choice>' is yours to declare, 'describe <words>' rewrites how others see you, 'title' wears your earned
          honors, and 'sprite list' then 'sprite set <number>' changes the figure browser-dreamers see crossing the
          canvas. The mirrors never judge. Madame Papillon judges only the indecisive.
  catacombs_landing:
    terrain: underground
    title: The Catacombs Landing
    description: A spiral stair delivers you into cool darkness that smells of old paper and older prayers, where the
      Academy's foundations rest on vaults of honeycombed stone. Lantern niches hold candles that relight themselves
      out of politeness, and the walls bear generations of student graffiti, the oldest simply reading WE WERE HERE
      AND NOW WE ARE HERE AGAIN. A heavy iron notice is bolted beside the descending arch ('read notice') — the
      Academy does not waste iron on idle warnings.
    exits:
      u: academy_quad
      n: ossuary_walk
    features:
      iron_notice:
        type: SIGN
        displayName: an iron notice bolted to the archway
        keyword: notice
        text: >-
          NOTICE TO UNDERCLASSMEN. Beyond this arch walk the Restless Dead — alumni who never finished dying
          properly. They are a faction, with memory and grievance; lay them to rest and the Academy's regard for you
          grows, as 'reputation' will attest. They are also third-year material at the least — 'consider' every one
          of them, travel with a 'group' if you can find one, and keep a draught at your belt. The Curator in the
          chapel below offers proper coursework for this floor.
  ossuary_walk:
    terrain: underground
    title: The Ossuary Walk
    description: A long gallery walled in scholarly bones — femurs shelved like scrolls, skulls capped with mortarboard
      dust, the whole arrangement somehow more bibliographic than morbid. Restless pupils drift between the niches
      clutching translucent essays, eternally late for examinations that ended centuries ago, and restless scholars
      argue footnotes in voices like turning pages. They do not suffer the living to audit their misery — expect
      every one of them to object to your presence, violently and posthumously.
    exits:
      s: catacombs_landing
      n: catacomb_chapel
  catacomb_chapel:
    terrain: underground
    title: The Chapel of Patient Rest
    description: A vaulted undercroft chapel whose altar has been lovingly maintained by Curator Mortis — a desiccated
      but impeccably mannered scholar who finished dying centuries ago and found the quiet agreeable. Votive candles
      burn in the colors of every god, and behind the altar a sealed delve-door of black iron breathes slowly, beyond
      which the catacombs rearrange themselves nightly into fresh examinations. The Curator administers the deep
      coursework ('talk curator'); the delve-door's workings are posted beside it ('read door-plate').
    exits:
      s: ossuary_walk
      e: memento_mori_shrine
    features:
      door_plate:
        type: SIGN
        displayName: a verdigrised plate beside the delve-door
        keyword: door-plate
        text: >-
          THE NIGHTLY EXAMINATION. Beyond this door the catacombs reshuffle themselves into a fresh labyrinth for
          every class that enters — no two delves alike. 'dungeon enter academy_catacombs' begins your examination;
          'dungeon leave' concedes it and returns you here. The delve suits students of the third year and above,
          and rewards those who bring friends — 'group invite <name>' before entering shares both the danger and
          the glory. The deepest chamber holds the Dean of the Dead, who grades harshly.
  memento_mori_shrine:
    terrain: underground
    title: The Memento Mori Shrine
    description: A small round shrine of black marble and white candles, kept scrupulously clean by no visible hand. At
      its center kneels an armored figure of dust and candleflame — the Final Lesson, the Academy's oldest teaching
      assistant — whose single duty is to demonstrate, gently and thoroughly, what losing feels like. The shrine's
      tablet is the only required reading ('read tablet'); the Lesson itself is strictly elective, and it will not
      strike first.
    exits:
      w: catacomb_chapel
    features:
      shrine_tablet:
        type: SIGN
        displayName: a black marble tablet ringed in candleflame
        keyword: tablet
        text: >-
          ON LOSING, AN ELECTIVE. Death in Ambon is a detour, not an ending — the fallen wake in Krioshaeu's
          sanctum, mended enough to be embarrassed, and 'depart' returns them through the spirit gate to where they
          fell. Nothing carried is lost. Students who wish to rehearse this mercy may 'kill lesson' — the Final
          Lesson is very good at its job, accepts no grudge, and bows to the rare student who bests it. Set 'wimpy
          off' first if you truly mean to see the end of the demonstration.
  restless_repository:
    terrain: underground
    title: The Restless Repository
    description: A sealed annex deep beneath the chapel where the delve stores its examiners between examinations —
      marrow proctors standing in patient rows, and the Dean of the Dead at his desk, grading papers that do not
      exist yet. No door in the waking catacombs opens onto this place; it belongs to the shifting halls alone, and
      it is very, very quiet.
    exits:
      u: catacomb_chapel
  gates_approach:
    terrain: outside
    title: The Approach to the Gates
    description: A processional avenue paved in moonstone, lined with statues of graduates caught mid-stride on their
      way out of the dream — packs shouldered, faces set toward morning. Petals drift from nowhere in particular and
      are swept by a wind that takes its duty seriously. The avenue narrows toward a rise where the great Gates of
      Ambon stand waiting, and a herald's lectern bears the order of ceremony ('read lectern').
    exits:
      w: call_for_heroes
      e: gates_of_ambon
    features:
      ceremony_lectern:
        type: SIGN
        displayName: a herald's lectern bearing the order of ceremony
        keyword: lectern
        text: >-
          ORDER OF COMMENCEMENT. Candidates shall have walked every wing of the Academy and hold all eight wing
          badges — orientation, valor, commerce, harvest, the makers' mark, the riddle's answer, the vigil, and
          fellowship. Candidates shall have reached the fourth year of their power at the least. When ready, accept
          the rite of Commencement from Provost Lumina on the quad, then present yourself to Gatekeeper Aurelion at
          the Gates. The Gates know their own. They have never once been wrong.
  gates_of_ambon:
    terrain: outside
    title: The Gates of Ambon
    description: Two colossal doors of gold and morning stand in a freestanding arch atop the rise, taller than any
      tower on the campus and warm to the touch like sun-soaked stone. Through their seam leaks a light that is
      unmistakably daylight — real daylight, the waking world's — and the grass grows greener in the stripe where it
      falls. Gatekeeper Aurelion, an Alorae of quiet radiance, keeps the threshold and accepts the credentials of
      graduates ('talk gatekeeper'). The gates themselves remain sealed a while longer; the proclamation fixed to
      them explains ('read proclamation').
    exits:
      w: gates_approach
      e:
        to: gates_approach
        door:
          initialState: locked
    features:
      gate_proclamation:
        type: SIGN
        displayName: a proclamation fixed to the golden doors
        keyword: proclamation
        text: >-
          BY ORDER OF THE PROVOST. The waking world of Ambon is being prepared to receive this year's graduates, and
          the Gates will open the moment it is ready — soon, and properly. Graduates are encouraged to wear their
          regalia, keep their skills sharp on the grounds, revisit the catacombs for extra credit, and check the
          notice board for daily work. Your patience, like everything else about you, has been graded favorably.
lifespan: 30
terrain: inside
