  sparring_golem:
    name: a brass sparring golem
    tier: standard
    level: 2
    category: construct
    spawns:
      - room: sparring_circle
        count: 2
    description: A student-built golem of riveted brass plates and visible mainsprings, its knuckles capped in regulation
      felt that has long since stopped helping. It assumes a courteous boxing stance when approached, taps its fists
      together twice, and waits — the Academy insists its golems never swing first, and the golems visibly resent it.
    respawnSeconds: 45
    drops:
      - itemId: golem_core
        chance: 1
    spells:
      piston_jab:
        displayName: Piston Jab
        message: "{mob} drives a piston-straight jab into you for {damage}!"
