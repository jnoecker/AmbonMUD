        minDamage: 19
        maxDamage: 24
        cooldownMs: 9000
    image: f17825d549be803e2b3edd64e25c35112ef6854db1b84c2e51bd7a5f5448e631.png
  proctor_golem:
    name: the Examination Golem
    tier: elite
    level: 3
    category: construct
    rareVariants: false
    spawns:
      - room: sparring_circle
    description: Twice the size of the sparring models and plated in gunmetal scored with honors, this golem wears a silk
      ribbon reading PROCTOR pinned over where a heart would be. It does not adopt a stance when approached. It simply
      produces a small bell, rings it once, and notes the time — examinations, its posture suggests, have already begun.
    respawnSeconds: 90
    drops:
      - itemId: golem_core
        chance: 1
      - itemId: proctors_ribbon
        chance: 0.35
    spells:
      grading_slam:
        displayName: Grading Slam
        message: "{mob} brings both fists down like a failing grade for {damage}!"
        roomMessage: "{mob} brings both fists down on {target} like a failing grade for {damage}!"
        minDamage: 30
        maxDamage: 38
        cooldownMs: 12000
    image: c001fbdfabe03263b08dde51fcbaa6f2a121a81842372c5cca953237cd662849.png
  cowardly_gloomling:
    name: a cowardly gloomling
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: beast_pen
        count: 2
    description: A knee-high creature of damp shadow and enormous apologetic eyes, all elbows and flinches, leaving little
      puddles of nervous gloom wherever it skitters. It watches every approach with the resigned certainty of a creature
      that has been a teaching aid for a very long time and knows exactly which lesson it is.
    respawnSeconds: 40
    behavior:
      template: coward
      params:
        fleeHpPercent: 60
        fleeMessage: The gloomling squeaks, abandons all dignity, and bolts!
    drops:
      - itemId: gloom_ribbon
        chance: 1
    image: 1eb8e2ba2a458a930928b2a26e388b5167ddbbd0fcff4f3e78c42c3538c5447a.png
  unruly_mimic:
    name: an unruly mimic
    tier: weak
    level: 2
    category: construct
    spawns:
      - room: beast_pen
    description: At first glance a perfectly ordinary footstool upholstered in cheerful gingham — at second glance a
      footstool with hinges where no footstool needs them, breathing very slightly, and angled just a touch too
      conveniently toward passing ankles. The fence post nearest it has been chewed in a pattern best described as
      practiced.
    respawnSeconds: 60
    behavior:
      template: aggro_guard
      params:
        aggroMessage: The footstool unhinges into a grin of brass teeth and lunges at you!
    drops:
      - itemId: mimic_tooth
        chance: 1
    image: 29d2edbb79ed854038600159cd6956d674b8b3578622a7a5e5b0cc48f473df5c.png
  warden_bellwether:
    name: Warden Bellwether
    role: dialog
    faction: auringold_academy
    spawns:
      - room: spotters_walk
    description: A leathery Archae shepherd in an oilskin coat gone the exact color of weather, a brass spyglass at her eye
      and a bellwether's bell at her hip that she rings only for the genuinely remarkable. Decades of minding the pens
      have given her a hunter's patience and a grandmother's commentary, and her logbook keeps a pressed flower for
      every rare beast she has admired and pointedly declined to fight.
    dialogue:
      root:
        text: Hsst — elbows off the rail slow, you'll spook the pen. Bellwether. I mind the walk and keep the log of strange
          sightings. Ask your questions quiet.
        choices:
          - text: What counts as a strange sighting?
            next: variants
          - text: How dangerous are the rare ones?
            next: danger
          - text: Where do the scheduled creatures keep?
            next: schedules
          - text: I'll watch quietly, Warden.
      variants:
        text: Any beast in the dream can wake up wearing a rare coat — Albino, Verdant, or Shadow-touched if you're lucky;
          Ember, Glimmering, or Frostbound if you're luckier; Spectral or Ancient if the dream is showing off, and those
          last two get announced to every dreamer awake. Same creature underneath, mind — just more of it, and wearing
          its name in front like a title. The dream does this on its own whim, wherever it pleases, so keep your eyes up
          everywhere — not just over my pen.
        choices:
          - text: How dangerous are the rare ones?
            next: danger
          - text: Thanks, Warden.
      danger:
        text: Rarer means sturdier, harder-hitting, and richer in the pockets — roughly in that order of concern. 'consider' one
          before you commit; the reading already accounts for the coat. A Shadow-touched gloomling is still a gloomling,
          but an Ancient anything has earned the name. The zone hears a shout when one appears. Get there before the
          seniors do, and ring my bell on your way back.
        choices:
          - text: What counts as a strange sighting?
            next: variants
          - text: Thanks, Warden.
      schedules:
        text: Different ledger, same philosophy. Some creatures keep to a season, an hour of the dream, or a particular sky —
          they arrive when the calendar suits them and fade when it stops. Keeper Brontide's almanac terrace by the
          gardens keeps the timetable and a small menagerie of demonstrations. Between her calendar and my log, nothing
          in this dream need ever surprise you. Startle, yes. Surprise, no.
        choices:
          - text: What counts as a strange sighting?
            next: variants
          - text: Thanks, Warden.
    image: 2d55eb724891b7fd6d81f7147734a5cb5f829cd473362dfb761271c13ac50435.png
  marshal_valenne:
    name: Marshal Valenne
    role: dialog
    faction: auringold_academy
    spawns:
      - room: duel_ring
    description: A Lustriae duelist of impossible posture, silver-masked and gloved in dove-grey, her ceremonial sabre worn
      the way other people wear jewelry. Her wings are folded with parade precision, her voice carries the acoustics of
      an amphitheater regardless of where she stands, and her mask's single engraved eyebrow manages to convey an entire
      philosophy of judged technique.
    dialogue:
      root:
        text: Welcome to the only ring on campus where pride is the sole casualty. I am Marshal Valenne, and I referee all
          matters of honor. Speak, and I shall teach you the forms.
        choices:
          - text: How does a duel work?
            next: forms
          - text: What do I win?
            next: stakes
          - text: Merely admiring the architecture, Marshal.
      forms:
        text: Simplicity itself. 'duel <name>' issues the challenge — anywhere in Ambon, though the ring is traditional. Your
          opponent answers 'duel accept' or 'duel decline', and either answer is honorable. Blades and spells then speak
          until one dreamer falls; the runes catch the loser gently, and both parties walk away owning their result. No
          looting, no grudges, no lasting harm. The purest conversation two fighters can have.
        choices:
          - text: What do I win?
            next: stakes
          - text: Thank you, Marshal.
      stakes:
        text: Honor — the only currency that cannot be banked. Victories in formal PvP earn honor points, and 'currencies'
          counts yours beside subtler wealth. The 'leaderboard' remembers the dream's finest duelists with embarrassing
          precision. Win gracefully, lose curiously, and challenge anyone whose technique you wish to understand. The
          ring is always open.
        choices:
          - text: How does a duel work?
            next: forms
          - text: Thank you, Marshal.
    image: 61bf8fe4184a029f1398dce526f2b3bd63f3c68bc2cc909c422c0ff5ccdfa7f9.png
  bursar_coppertill:
    name: Bursar Coppertill
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: bursar_bank
    description: A short, immensely solid Lithae whose skin has the warm patina of circulated coin, dressed in a banker's
      waistcoat with seventeen visible pockets and, the rumor insists, forty more. An abacus of floating gemstones
      calculates idly beside her head, and her smile, when granted, has the satisfying finality of a vault door seating
      into its frame.
    dialogue:
      root:
        text: Welcome to the Vault. Your gold is currently doing the riskiest thing gold can do — being carried. Shall we
          discuss the alternative?
        choices:
          - text: Teach me how the bank works.
            next: banking
          - text: What else counts as wealth here?
            next: wealth
          - text: I have an errand to run for you, I hear.
            next: errand
          - text: My gold likes the danger, thank you.
      banking:
        text: Three words and a habit. 'deposit 50' entrusts coin to the vault, 'withdraw 50' reclaims it, 'bank' reads your
          balance and stored goods. Property banks too — 'deposit <item>' shelves a treasure beyond the reach of
          thieves, accidents, and your own generosity, and 'withdraw <item>' fetches it back. The habit is this — bank
          after every windfall, and the dream can never take back what it gave you.
        choices:
          - text: What else counts as wealth here?
            next: wealth
          - text: I'll take that errand.
            next: errand
          - text: Wise words, Bursar.
      wealth:
        text: Gold is merely the loudest currency. 'gold' counts it, yes — but 'currencies' counts the rest. Academy Merits from
          coursework, honor from formal duels, tokens from honest craft. None of it spends at the counter and all of it
          spends in reputation, which compounds better. Speaking of which — 'reputation' shows how the dream's factions
          regard you. The Academy notices its friends.
        choices:
          - text: Teach me how the bank works.
            next: banking
          - text: Wise words, Bursar.
      errand:
        text: Indeed. Auctioneer Mirabelle's ledger sheet is due — banks and auction houses reconcile daily, or civilization
          stops. Walk this sealed ledger along Market Row and on to her auction hall, and put it in her hands. Mind the
          row as you go — every door near it will matter to you sooner than you think.
        choices:
          - text: I'll carry the ledger to Mirabelle.
            action: accept_quest:letters_and_ledgers
          - text: Another time, Bursar.
    quests:
      - letters_and_ledgers
    image: a89da8f11a3052e49171bfd15fdd20eeff1185e72c671ff0457d844b5cc14835.png
  auctioneer_mirabelle:
    name: Auctioneer Mirabelle
    role: dialog
    faction: auringold_academy
    spawns:
      - room: auction_hall
    description: A statuesque Kitsarae with  an opera contralto, gowned in auction-catalog pages that rustle with every
      sweeping gesture. Her gavel is a rod of petrified lightning that crackles softly when bidding grows interesting,
      and her smile suggests she already knows what your treasures are worth — to the copper.
    dialogue:
      root:
        text: Welcome to the block, darling! Everything sells eventually — the only variables are patience and presentation.
          What shall we discuss?
        choices:
          - text: The Bursar sent this ledger for you.
            action: turn_in_quest:letters_and_ledgers
          - text: How do I buy at auction?
            next: buying
          - text: How do I sell my treasures?
            next: selling
          - text: Just admiring the lots, madam.
      buying:
        text: "'auction' parades every lot before you, each with its number and asking price. See something irresistible?
          'auction buy <number>' and it is yours, coin to seller, instantly. The browser-blessed will find the Auction
          panel does the parading for them in this very hall. Bid boldly, darling — regret is for the second-highest."
        choices:
          - text: How do I sell my treasures?
            next: selling
          - text: Thank you, madam.
      selling:
        text: "'auction sell <item> <price>' places your treasure on the block at the price you dare to name — too humble
          insults the goods, too proud and it gathers dust. 'auction cancel <number>' withdraws a lot with dignity
          intact. Between us — crafted goods from the workshops sell beautifully to students who haven't found the forge
          yet. Supply, demand, and a little theater, darling. That's all an economy is."
        choices:
          - text: How do I buy at auction?
            next: buying
          - text: Thank you, madam.
    image: 61b70d9dc49445196f27ca1a4aadd07712eb335cbc4eae2f7620c45ff8bacff6.png
  postmistress_wren:
    name: Postmistress Wren
    role: dialog
    faction: auringold_academy
    spawns:
      - room: campus_post_office
    description: A small, quick Archae woman in a postal coat of official red, spectacles pushed up into hair that has
      defeated every pin sent against it. She sorts letters at a speed the pigeonholes can barely answer, keeps a
      wax-sealing iron warm in a candle flame, and addresses every customer with the brisk tenderness of someone who
      reads a great many other people's good news.
    dialogue:
      root:
        text: Welcome to the post, dreamer — mind the twine. Letters in, letters out, and not one lost since the office opened.
          What'll it be?
        choices:
          - text: Teach me the post.
            next: post
          - text: How do trades between dreamers work?
            next: trading
          - text: Just browsing, Postmistress.
      post:
        text: The post reaches every dreamer, awake or not. 'mail send <name>' opens a letter — write your piece, and coin or a
          parcel may ride along with it. 'mail' lists your inbox, 'mail read 1' opens the first letter, 'mail claim 1'
          pockets whatever it carried, 'mail delete 1' burns it politely. Nothing is ever lost in my post. Misfiled
          briefly, on occasion. Never lost.
        choices:
          - text: How do trades between dreamers work?
            next: trading
          - text: Thank you, Postmistress.
      trading:
        text: Face to face is the older post. 'trade <name>' opens a bargaining table between you and another dreamer — 'trade
          offer <item>' and 'trade offer 50 gold' load your side of it, theirs loads the other, and nothing whatsoever
          moves until both of you speak 'trade accept'. Either of you may 'trade cancel' and walk away friends. The
          handshake protects you both — the Academy is rather proud of that.
        choices:
          - text: Teach me the post.
            next: post
          - text: Thank you, Postmistress.
    image: 698a263130211ea46f0829c1dd0b54a38875f347f744585ea19d8403b4c44847.png
  quartermaster_tobbin:
    name: Quartermaster Tobbin
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: provisioners_nook
    description: A round, methodical Archae man in a canvas apron whose many pockets are labeled, alphabetized, and full, a
      grease pencil behind one ear and a measuring cord worn like a sash of office. He squares every bottle on its shelf
      to the same quarter-turn, and his handshake arrives with the firm, evaluating squeeze of a man checking whether
      you would last a week in the field.
    dialogue:
      root:
        text: Welcome to the Nook. Rope, bottles, biscuits, advice — everything a satchel needs and nothing it doesn't. Most
          adventurers come in for the bottles and leave having learned about the rest. What'll it be?
        choices:
          - text: What should every adventurer carry?
            next: provisions
          - text: I have a draught right here — log my commission.
            next: provisions
          - text: Just browsing, Quartermaster.
      provisions:
        text: A weapon you trust, a back you've armored, and bottles — always bottles. 'list' shows my shelves, 'buy minor
          healing draught' stocks your satchel, and in the field 'quickheal' drinks the best one you carry the instant
          you ask. When you've a draught in your pocket, come tell me so — show me a student provisioned for trouble and
          I'll log your commission with the Academy.
        choices:
          - text: I have a draught right here — log my commission.
            action: accept_quest:stock_the_satchel
          - text: Thank you, Quartermaster.
    quests:
      - stock_the_satchel
    image: a0ddc4779f2286e9175d097f56bbb686ae809255ae4284668a36a516e610cbf7.png
  broker_thistledown:
    name: Broker Thistledown
    role: dialog
    faction: auringold_academy
    spawns:
      - room: broker_office
    description: A genteel Mycorae in a houndstooth suit, cap politely doffed indoors and held to his chest like a small
      beloved pet. Spores of paperwork drift from his sleeves and assemble themselves into contracts mid-air, and his
      handshake — offered freely — carries the loamy reassurance of someone who has never once sold a house with a ghost
      he didn't disclose.
    dialogue:
      root:
        text: Welcome, welcome — sit anywhere, the chairs are included. Thistledown, estates and dreams thereof. Every great
          adventurer eventually wants a door that locks behind them. Shall I show you what that costs?
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: What can I do with a house?
            next: house_life
          - text: What about a hall for a guild?
            next: guild_halls
          - text: Just window-shopping, Broker.
      buying_home:
        text: "'house list' shows the catalog — every room we build and its price, from the carriage house at ten thousand gold
          upward to castles I'm contractually obliged to call sensible. When your purse is ready, stand in this office
          and speak 'house buy' — the carriage house is always the first key. After that, 'house expand <template>
          <direction>' grows the estate room by room. Saving toward a door of your own is half of what Market Row is
          for."
        choices:
          - text: What can I do with a house?
            next: house_life
          - text: Thank you, Broker.
      house_life:
        text: Everything the dream denies you elsewhere. 'house' reports your estate; inside it you rest safe, store goods in
          vault rooms, even raise a private forge. 'house invite <name>' welcomes a guest, 'house kick <name>'
          un-welcomes one, 'house guests' takes attendance. And 'house describe title' and 'house describe desc' let you
          redecorate in prose, which is the cheapest renovation ever invented.
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: Thank you, Broker.
      guild_halls:
        text: Ah, fellowship at scale! Once you've founded a guild with Registrar Oakhollow at the Guild Registry, 'guild hall
          buy' raises a common hall — the Guild Commons, hearth and banners included — and 'guild hall expand' grows it
          as the fellowship does. Ten thousand gold, split among friends, buys a remarkable amount of belonging.
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: Thank you, Broker.
    image: 8381768d08b293a6254111883abc40d3f824df34c73ed96715e1b2e7503c88e8.png
  registrar_oakhollow:
    name: Registrar Oakhollow
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: guild_registry
    description: A broad Lithae of cathedral proportions whose granite hands turn ledger pages with watchmaker delicacy.
      Centuries of charters have worn a librarian's hush into him; moss grows in his knuckle-seams like well-kept
      hedgerows, and the great book before him is chained not against thieves but against his own tendency to hug it.
    dialogue:
      root:
        text: Welcome to the Registry. Heroes are sturdy things, but fellowships outlast them — I keep the ledgers of both. What
          shall we enter today?
        choices:
          - text: How do I found a guild?
            next: guilds
          - text: How do hunting groups work?
            next: groups
          - text: How do I keep hold of friends here?
            next: friends
          - text: How do dreamers speak across the dream?
            next: channels
          - text: I'd take a social errand, if you have one.
            next: errand
          - text: Only browsing the crests, Registrar.
      guilds:
        text: A guild is a name that outlives its founders. 'guild create <name> <TAG>' enters one in my ledger — choose both
          with care, the dream remembers. 'guild invite <name>' extends the hand, 'guild roster' counts the family,
          'guild motd <words>' posts the morning's wisdom, 'guild promote' and 'guild demote' keep order kindly, and
          'gchat <words>' — or simply 'g' — speaks in the fellowship's private voice. When the treasury allows, Broker
          Thistledown at his estates office will sell you a hall to put it all in.
        choices:
          - text: How do hunting groups work?
            next: groups
          - text: Thank you, Registrar.
      groups:
        text: Groups are friendships with a shared scoreboard, made for an evening and dissolved by dawn. 'group invite <name>'
          calls a hunting party, they answer 'group accept', and from then on 'gtell <words>' reaches the party's ears
          alone while experience flows a little richer for everyone — the dream rewards company. 'group' takes the roll,
          'group leave' bows out, 'group kick' un-invites the snorer. The catacombs beneath Necrambon were built for
          exactly this arithmetic.
        choices:
          - text: How do I found a guild?
            next: guilds
          - text: Thank you, Registrar.
      friends:
        text: The quietest ledger and my favorite. 'friend add <name>' marks a dreamer as yours to miss; 'friends' shows who
          among them walks the dream this very moment, and the page turns itself when they arrive or depart. 'friend
          remove <name>' — well. The ledger holds no grudges, and neither should you. 'who' shows every soul awake,
          strangers included, which is how friends begin.
        choices:
          - text: How do dreamers speak across the dream?
            next: channels
          - text: Thank you, Registrar.
      channels:
        text: Each voice carries differently. 'say <words>' — or a simple apostrophe — fills the room you stand in. 'tell <name>
          <words>' crosses any distance to one ear; 'whisper' is for secrets close by; 'shout' rattles the whole zone,
          mind the library. 'gossip' is the dream-wide hearth where everyone warms themselves, and 'ooc' steps outside
          the story entirely. For the wordless moments — 'emote bows deeply', or 'pose', and the browser-folk have a
          shelf of one-tap gestures besides.
        choices:
          - text: How do I keep hold of friends here?
            next: friends
          - text: Thank you, Registrar.
      errand:
        text: Always. Gamemaster Kolksprut of the Parlor of Small Fortunes owes my ledger a signature — he will sign for a
          friendly face far sooner than for a form. His parlor keeps its licensed hospitality just up the hill, off
          Lyrasael's promenade above this market. Climb the stair, say your hellos along the way, and let her teach you
          what her parlor teaches. Fellowship, candidate, begins with errands exactly like this one.
        choices:
          - text: I'll carry your regards to Kolksprut.
            action: accept_quest:a_friendly_word
          - text: Another day, Registrar.
    quests:
      - a_friendly_word
    image: 19ac239c9d432389c66503ca08d5b9dc48408dfa5f5fca7b92dcfbeb0a938188.png
  gardener_fernwhistle:
    name: Gardener Fernwhistle
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: gathering_garden
    description: A Sylflorae Harvester  wearing a watering can as a hat with total unselfconsciousness. Clover springs up in
      her footprints and politely retracts behind her, songbirds use her shoulders as a waiting room, and her gardening
      apron's pockets hold seeds, shears, and at least one napping mouse she pretends not to know about.
    dialogue:
      root:
        text: Oh, hello, new sprout! Mind the moonpetals, they're shy before lunch. I keep the garden and the garden keeps the
          workshops — everything forged or brewed on this campus began as something gathered. Want to learn the gentle
          arts?
        choices:
          - text: Teach me to gather.
            next: gathering
          - text: How do crafting skills grow?
            next: skills
          - text: What lives by the seasons?
            next: seasons
          - text: My basket's full — log my fieldwork.
            next: fieldwork
          - text: Just smelling the flowers, Gardener.
      gathering:
        text: Two beds here, and the old mine on Kaerinlith's path keeps two seams more — Foreman Graveljaw guards its gate and
          its opinions. 'gather petals' coaxes the moonpetal bed; 'gather vine' taps the sunsap trellis once your hands
          have learned the first bed's patience. In the mine it's 'gather seam' for glimmer-ore and 'gather pocket' for
          dreamglass. Each harvest tires the bed a short while — rotate like a considerate bee. And every so often the
          dream tips generously — rare findings for steady hands.
        choices:
          - text: How do crafting skills grow?
            next: skills
          - text: My basket's full — log my fieldwork.
            next: fieldwork
          - text: Thank you, Gardener!
      skills:
        text: By doing, sprout, only ever by doing. Every gather and every craft feeds its skill — 'craftskills' shows them all
          growing like a window box. Higher skill opens shyer beds, finer recipes, steadier hands. And when one craft
          becomes your truest calling, 'specialize <craft>' devotes you to it — devoted hands learn a quarter again as
          fast. Choose with your heart. The crafts can tell.
        choices:
          - text: Teach me to gather.
            next: gathering
          - text: Thank you, Gardener!
      seasons:
        text: Oh, the almanac beasts! Not everything blooms year-round, sprout — the dream keeps seasons, and some of its shyest
          creatures keep to just one. Keeper Brontide minds the almanac terrace down the steps from my beds; she can
          tell you what the sky is doing, what the year is doing, and who either of them is about to summon. Do say good
          evening to the lampyr if you pass at dusk. It preens.
        choices:
          - text: Teach me to gather.
            next: gathering
          - text: Thank you, Gardener!
      fieldwork:
        text: Show me, show me! Three moonpetal blooms and three lumps of glimmer-ore — garden and mine both, because a maker
          who only knows one is hopping on one root. Bring them in your basket and the Academy will pin the harvest
          badge on you itself.
        choices:
          - text: Log my fieldwork, Gardener.
            action: accept_quest:green_thumbs
          - text: I'll fill the basket first.
    quests:
      - green_thumbs
    image: c7660b32375d9c6aea2d18c9d21186e29e28e5843d898ea571e75bf85490627f.png
  keeper_brontide:
    name: Keeper Brontide
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: almanac_terrace
    description: An Aetherae meteorologist whose cloak is a slow patch of live weather — hems of drifting fog, one shoulder
      of summer haze, one pocket quietly raining. She consults three instruments at once and agrees with none of them,
      records the sky's moods in a ledger of pressed pages, and speaks of the seasons the way other people speak of
      beloved, unreliable relatives.
    dialogue:
      root:
        text: Sssh — the weather-glass is thinking. There. Welcome to the terrace, dreamer. I keep the Academy's almanac — the
          hours, the skies, and the four seasons of the dream. Ask, and I'll read you the calendar.
        choices:
          - text: Teach me the dream's calendar.
            next: calendar
          - text: Tell me about the almanac beasts.
            next: beasts
          - text: What of the Wandering Star?
            next: star
          - text: Your ledger wants fieldwork, I hear.
            next: fieldwork
          - text: Fair skies, Keeper.
      calendar:
        text: "'time' reads you the hour and the sky together — the dream keeps dawn, day, dusk, and night, and each hour wakes
          different company; the weather above runs clear, rain, storm, fog, snow, or wind, and every zone keeps its own
          sky. Beneath both, the year wheels through spring, summer, autumn, and winter while you dream — watch my
          corner basins fill in turn, or, if you dream in a browser, simply watch the painted sky. Consult the calendar
          before you consult your plans; half of Ambon keeps appointments by it."
        choices:
          - text: Tell me about the almanac beasts.
            next: beasts
          - text: Fair skies, Keeper.
      beasts:
        text: The terrace keeps four tenants, one to each season — the vernal hare arrives with spring, the sunbask salamander
          with summer, the gourdling with autumn, and the frostwing moth with winter. When the year turns, the old
          tenant fades and the new one arrives, and the whole zone hears the sighting called. A lampyr haunts the dusk
          and dark hours besides, and a rain sprite only ever visits wet weather. None of them will trouble you. Most of
          them are frankly delighted to be admired.
        choices:
          - text: What of the Wandering Star?
            next: star
          - text: Your ledger wants fieldwork, I hear.
            next: fieldwork
          - text: Teach me the dream's calendar.
            next: calendar
          - text: Fair skies, Keeper.
      star:
        text: Ah — not all the calendar is wheelwork. Now and then the dream keeps a holiday, and the Wandering Star is ours — a
          vagrant light that slips its mooring, drifts low for a brief spell, and moves on. The whole zone hears when it
          arrives, and 'time' lists it among the sky's affairs while it lasts. While the star hangs low a stray starfall
          comes down to circle my moondial — admire it promptly, dreamer. Holidays gate their own company, and the
          calendar makes no promises about encores.
        choices:
          - text: Tell me about the almanac beasts.
            next: beasts
          - text: Fair skies, Keeper.
      fieldwork:
        text: It does. My ledger wants pressings — proof a student has met the calendar face to face. Whichever beast the year
          is keeping when you visit, take a pressing from it and bring me the page; 'time' will tell you who ought to be
          home. The beasts re-form with their season, so pressing one is a lesson, not a loss. They understand. Mostly.
        choices:
          - text: I'll bring you a pressing.
            action: accept_quest:the_turning_year
          - text: I'll wait for better weather.
    quests:
      - the_turning_year
    image: 5effc24b58abf594ef0090e552740985c2d550c51875dc016617dba51259e3f9.png
  vernal_hare:
    name: a vernal hare
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: almanac_terrace
    condition:
      seasons:
        - SPRING
    description: A long-eared hare the color of new shoots, tiny white blossoms growing where other hares keep their dander.
      It arrives with the spring and appears to be made entirely of the season's optimism, lolloping between the terrace
      basins and sampling the season charts whenever Keeper Brontide pretends not to look.
    behavior:
      template: wander
    drops:
      - itemId: almanac_pressing
        chance: 1
    image: 3965f4a7da7873f2afa05d607ff41b6e7fefc05d9dd2dbd005741af797f07e5c.png
  sunbask_salamander:
    name: a sunbask salamander
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: almanac_terrace
    condition:
      seasons:
        - SUMMER
    description: A fat, contented salamander the deep orange of a held breath of August, sprawled across the warmest
      flagstone on the terrace with the certainty of a creature that has never once been asked to move. Heat shimmer
      rises gently from its back, and it glows like a banked coal whenever the light goes golden.
    drops:
      - itemId: almanac_pressing
        chance: 1
    image: b8c257b3b8fcfb3ef7b0dec8accea76becacd7d26596f5c5d796aee7990cb42b.png
  gourdling:
    name: a wobbling gourdling
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: almanac_terrace
    condition:
      seasons:
        - AUTUMN
    description: A small round squash on knuckled root-legs, wearing a jaunty cap of curled stem and trailing the smell of
      cinnamon and first rain. It arrives with the autumn, wobbles everywhere at the pace of falling leaves, and bumps
      gently and repeatedly into the leaf basin, which it appears to be courting.
    drops:
      - itemId: almanac_pressing
        chance: 1
    image: f1b6aef7374fd80e8c972c17da7d22425bf2d7197bdf0d54a9df80f0c0a6ed9a.png
  frostwing_moth:
    name: a frostwing moth
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: almanac_terrace
    condition:
      seasons:
        - WINTER
    description: A moth the size of two cupped hands, its wings panes of windowpane frost that chime very softly when it
      settles. It arrives with the winter, roosts on the moondial, and exhales tiny flurries in its sleep — the rime
      basin fills fastest wherever it has spent the night.
    drops:
      - itemId: almanac_pressing
        chance: 1
    image: d0b5817d005d10ddd68c30a027ab53503bea2a79d6c5aab552059bcb726b4064.png
  dusk_lampyr:
    name: a dusk-lit lampyr
    tier: weak
    level: 2
    category: elemental
    spawns:
      - room: almanac_terrace
    condition:
      time:
        - DUSK
        - NIGHT
      chance: 0.75
    description: A slender, long-legged creature with a belly of warm lantern-glass, lit from within by a flame nobody ever
      kindled. It keeps strictly to the dusk and dark hours, patrolling the balustrade like a lamplighter making rounds,
      and it preens — visibly, at length — whenever anyone wishes it good evening.
    behavior:
      template: wander
    drops:
      - itemId: almanac_pressing
