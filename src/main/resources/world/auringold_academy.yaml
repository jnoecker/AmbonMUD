        - Turning trembling into clear
        - Word of Ambon, guide us home
        - Word of Ambon, make us known
        - The Creator’s sister, serene and bright
        - You draw the song out of the world tonight
        - Word of Ambon, stay near
        - Word of Ambon, we are here
        - Word of Ambon, lead us on
        - Word of Ambon, sing us strong
  heralds_of_creation:
    terrain: outside
    title: The Heralds of Creation
    description: You stand upon eternally soft grass that shifts between verdant green and opalescent shimmer, as if reality
      itself cannot decide what this primordial earth should be. Towering above in the luminous haze are beings of pure
      prismatic light—their forms vaguely humanoid yet composed of cascading colors that refract and bloom like living
      stained glass, their movements leaving trails of soft radiance as they prepare the new world for its coming
      inhabitants.
    exits:
      e: kiriton_winter
      w: sylflorae_farm
    image: 0504be1f81b24cb78013988368648a40eb218e854876c837229be4b29d726d66.jpg
    features:
      music_box_placard:
        type: SIGN
        displayName: a small lacquered placard beside the music box
        keyword: placard
        text: "A small placard reads: \"Wind the music box and it will sing you the song of this place. Type 'musicbox' (or
          'mb') to open it, then 'musicbox play' to start the tune — it costs nothing, plays only for you, and follows
          you from room to room until it ends or you 'musicbox stop' it. Boxes like this one rest in halls all across
          the Academy, each holding the ballad of the tale told there. Browser visitors can tap the music-box kiosk to
          open the device and watch its lyrics scroll past.\""
    musicBox:
      title: Astriel Star Summoner
      file: 18a09a164b5209a49329d293a9014e1ba9407f57e85cede5b082cac9b4dc2dc1.mp3
      durationSeconds: 242
      artist: TRADITIONAL
