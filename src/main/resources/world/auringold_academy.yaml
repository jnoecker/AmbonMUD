        - The Archae bent under hard days
        - With thin bowls and cupboards cold
        - He sang to the roots below
        - And green came climbing through the dust
        - Row by row, the furrows woke
        - Stone by stone, the hunger broke
        - But in the shade, by the old moss line
        - Something stirred in the weave of vine
        - Astriel, Astriel
        - You made the feast grow
        - Astriel, Astriel
        - You let the green go
        - From empty hands to bending stalks
        - From bare ground up to tender walks
        - Astriel, Astriel
        - You made us whole
        - Then the seed went strange and bright
        - Not grain alone, but leaf and eye
        - Sylflorae rose in the morning light
        - Little plant folk with knowing sighs
        - They carried fruit in woven hands
        - Fed Ambon from the living land
        - A good mistake, a holy turn
        - A new kind of life began to learn
        - They bowed in vines, they laughed in rain
        - And every harvest spoke his name
        - Astriel, Astriel
        - You made the feast grow
        - Astriel, Astriel
        - You let the green go
        - From empty hands to bending stalks
        - From bare ground up to tender walks
        - Astriel, Astriel
        - You made us whole
        - Now when the baskets come in slow
        - And the children line the road
        - They thank the god who missed his aim
        - And changed the world with one green flame
        - Astriel, Astriel
        - You made the feast grow
        - Astriel, Astriel
        - You let the green go
        - From Archae fields to Ambon’s door
        - Life keeps giving, more and more
        - Astriel, Astriel
        - You made us whole
  first_archae:
    terrain: urban
    title: The First Archae
    description: The first Archae city, Marldon, begins as a humble town along the river. As the eons pass, it grows into a
      thriving metropolis, the cultural center of Archae civilization.
    exits:
      w: kiriton_winter
      e: memory_creation
    image: 0c4550a153afb0dcc59fa600a276c823d839ed6831852be56141f394fb0bd266.jpg
  tempest_between_worlds:
    terrain: outside
    title: The Tempest Between Worlds
    description: Drawn by the absence of the Creator, primal forces from other realms began to arrive in Ambon. Maelsang,
      the Tempest Between Worlds,  is a god of storms and seas who came to Ambon from another world. Here in the dream,
      you witness him in his full fury, the unbridled tempest of the harsh early land.
    exits:
      w: sandy_shoal
      s: seaweed_thicket
      n: cozy_inn
    image: 557289ce1d6ee3f443488456dd6cb27539ce96f8f486405efdab855ff83a3b74.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
    musicBox:
      title: Maelsang Tide
      file: 9d03cdc3ec70ee29aafdf2b14481b5924f2ec4bc8fb3bc26897b79c11148ce70.mp3
      durationSeconds: 252
      artist: TRADITIONAL
      description: Call-and-response sea shanty about Maelsang, The Tide Between Worlds
