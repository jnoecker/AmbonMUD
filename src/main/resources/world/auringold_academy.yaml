  future_yaleron:
    title: An Astral Shimmer of Yaleron's Future
    description: Towering stained glass cathedral windows cast fractured prismatic light across a lavishly appointed parlor,
      their kaleidoscopic hues spilling over an eerily detailed scale model of a once-proud walled city now rendered in
      exquisite ruin — crumbled towers, shattered gates, and collapsed districts frozen in miniature catastrophe. In the
      corner, a brass phonograph draped in cobwebs turns its tarnished horn toward the ceiling, filling the silence with
      a faint, melancholic waltz that seems to drift from some other age entirely.
    exits:
      u: yaleron
    akathavaeShrine: true
