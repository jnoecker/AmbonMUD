      pale skin, dark eyes, dark hair crowned with a delicate crystal tiara — swathed in billowing diaphanous silks and
      scattered flower blooms, her softly rounded ears and broader frame marking her as something between mortal and
      fey. She dances in the arms of a sharp-featured human man draped in an almost comical excess of royal finery:
      jewel-encrusted gold crown, fur-trimmed robes layered over embroidered tunics, fingers lost beneath rings, and
      chains of office heaped upon chains of office — handsome in a cold, deliberate way, every inch of him calculated
