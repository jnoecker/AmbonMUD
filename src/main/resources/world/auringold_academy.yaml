    drops:
      - itemId: stone_fragments
        chance: 0.5
  sandy_crab:
    name: a sandy crab
    tier: weak
    level: 1
    description: A small, pale sand-colored crab scuttles sideways across the ground, its shell dusted with fine grit and
      its beady black eyes perched on short, wary stalks.
    spawns:
      - room: tempest_between_worlds
      - room: sandy_shoal
      - room: waterfall
    image: 7c90f63fbb2dcfb5ef73159d7bc56a551a1d8c5bc58ef7dd709d33116e2ee708.png
    behavior:
      template: wander
      params:
        maxWanderDistance: 2
    drops:
      - itemId: kelp
        chance: 1
  caemyr:
    name: Caemyr
    tier: standard
    level: 1
    description: Caemyr is an elder arcanist of quiet, imposing presence, his long white hair falling in silver waves across
      layered ceremonial robes embroidered with faintly glowing runes. Though age has bent neither his posture nor his
      will, countless years of study linger in his sharp amber eyes and measured voice, carrying the calm authority of
      one who has witnessed empires rise and fade. Arcane energy gathers subtly around him like drifting starlight,
      warping the air with barely restrained power, while every gesture feels deliberate, graceful, and steeped in
      ancient wisdom.
    spawns:
      - room: aolexia
    role: prop
    image: 8676e5ae0ea8ce40503d7e2cdfdc1130731d3e9798eb6d016220ae9f4fd8f6c7.png
  caemyr_fissure:
    name: Caemyr
    tier: standard
    level: 1
    description: Caemyr stands at the edge of the shattered arcane fissure, his robes whipping violently in the storm of
      unstable magic pouring from the wound in reality. Rivers of violet and azure energy spiral around his outstretched
      hands as ancient sigils ignite beneath his feet, casting brilliant light across the fractured landscape. His long
      white hair streams behind him like a silver banner while cracks of raw arcana lash through the air, threatening to
      tear the world apart with every pulse. Yet amid the chaos, Caemyr’s expression remains calm and resolute — the
      practiced focus of a master arcanist drawing upon centuries of knowledge to weave the rupture shut strand by
      strand, forcing the raging energies back into harmony through sheer will and mastery.
    spawns:
      - room: shattered_fae_wood
    role: prop
    image: e503153d82ac7b2d6be13e61a70fe06c79b368b5acc8af1cca8f2ad9e68539c8.png
  displaced_aineroia:
    name: Displaced Spirit of Aineroia
    tier: standard
    level: 1
    description: Displaced from her body by the arcane explosion, Aineroia's spirit wanders aimlessly through the Shattered
      Fae Wood until Caemyr arrives and nurses her back to health.
    spawns:
      - room: shattered_fae_wood
    role: prop
    image: 4cdd2b1d76a94e826aa75192a4ed33867abe3dc88dee3105b78365ecc0b97863.png
  ritual_malkuth:
    name: A Shade of Malkuth Stealing Divinity
    tier: elite
    level: 2
    description: "A pale, sharp-featured man draped in absurd layers of royal finery — fur-trimmed robes over embroidered
      tunics, rings crowding every finger, chains of office heaped upon more chains of office, and a jewel-encrusted
      gold crown sitting slightly askew above dark hair — kneels at the center of a ritual diagram etched into the pale
      stone floor, his cold handsome face locked in total concentration, lips moving in silence. The constellation
      inlays nearby pulse faintly in rhythm with his working, casting silver-white light up across the excessive
      grandeur of his costume.  "
    spawns:
      - room: betrayer_study
    image: 382070af196eb28781bd213eb820fa5c3480922615c651a1be8827abcf43c4e5.png
  opera_mask:
    name: a floating silk opera mask
    tier: standard
    level: 1
    description: A lacquered silk mask in midnight blue and ivory drifts at eye level, its painted features frozen in an
      expression of serene theatrical sorrow, twin ribbons of constellation-silver trailing behind it like the ghost of
      the face it once adorned.
    role: dialog
    category: construct
    spawns:
      - room: obsidian_dagger
    image: b7e85de218af2ea88f65c804c6ce510d59672079fc6cd67241a13d7437d62be8.png
    dialogue:
      root:
        text: It was here that Malkuth the Betrayer, greedy for more power, forged the Obsidian Dagger and began his endless
          thirst for conquest.
        choices:
          - text: What is the Obsidian Dagger?
            next: obsidian_dagger
          - text: Who are you?
            next: avatar
          - text: Thank you, goodbye.
      obsidian_dagger:
        text: The Obsidian Dagger was forged from the stone that formed beneath the Creator's feet. Infused by the touch of the
          Creator, it has the power to make even divine beings vulnerable.
        choices:
          - text: Vulnerable to what?
            next: vulnerable
          - text: What happens to the defeated gods?
            next: what_happened
          - text: Thank you, goodbye.
      vulnerable:
        text: Malkuth's power allowed him to absorb and imprison souls, stealing their magic and divinity. But his own abilities
          were quite weak, and he couldn't best the gods in equal combat, nor overcome their natural defenses. Simply
          touching the ceremonial dagger to another being was enough to render them temporarily powerless, and for
          Malkuth to absorb their essence.
        choices:
          - text: What happens to the defeated gods?
            next: what_happened
          - text: Thank you, goodbye.
      what_happened:
        text: "The gods that Malkuth defeated and absorbed were imprisoned within him, giving him a growing source of power to
          feed from. "
        choices:
          - text: Vulnerable to what?
            next: vulnerable
          - text: Thank you, goodbye.
      avatar:
        text: I am an avatar of the Naraxian Akathavae. We record the history of Ambon and tell its stories. We turn to you to
          learn from our history and ensure we do not repeat these dark times.
        choices:
          - text: What is the Obsidian Dagger
            next: obsidian_dagger
          - text: Thank you, goodbye.
  lithae_miner:
    name: Sleeping Lithae Miner
    tier: standard
    level: 3
    description: A stocky crystalline figure holds a pickaxe. It is frozen in place as though time itself has stopped, its
      faceted obsidian-black body made with rough-hewn angles and unpolished geometric limbs dusted with pale mineral
      grit.
    spawns:
      - room: sleeping_stone_statues
    image: e17e71534468a6bab6db28de076c33584d152e9d136dfe29667409cca10a21a7.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
    role: prop
  lithae_miner_copy:
    name: Sleeping Lithae Wizard
    tier: standard
    level: 3
    description: A stocky crystalline figure in flowing robes stands utterly motionless, its obsidian-black faceted body
      frozen mid-gesture with one angular arm outstretched, a gnarled staff clutched in its geometric fingers. Pale
      mineral dust has settled across the dark, rough-hewn planes of its form, and faint geometric runes etched into its
      robes catch the light with a dull, dormant gleam.
    spawns:
      - room: sleeping_stone_statues
    image: 5806ec7f7f01c43113182de20d256ee69a327bafb7e3c31875c339748a3c92fa.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
    role: prop
  kitsarae_squirrel:
    name: a squirrel actor
    description: A small, bright-eyed squirrel stands upright on its hind legs, draped in a tiny tattered cape and clutching
      a miniature wooden prop sword, its bushy tail curled dramatically behind it as though mid-performance. Its dark,
      almost knowing gaze flickers with an uncanny spark of awareness, suggesting something just beneath the surface of
      a simple creature stirring to life.
    spawns:
      - room: kitsarae_mountain_basin
    tier: weak
    image: 17d2322c89f0cd8369bd27e9eba1a50de98e3f0c4fd42d7d4c37d490b72ac2ab.png
  beaver_storyteller:
    name: a beaver storyteller
    tier: standard
    level: 1
    description: A plump, amber-furred rodent sits upright on a mossy log, its broad flat tail spread beneath it like a
      cushion, gesturing animatedly with small nimble paws as it speaks. Bright, intelligent eyes gleam beneath a pair
      of tiny spectacles perched crookedly on its whiskered snout, and a worn leather satchel bulging with rolled
      parchments hangs loosely across its round chest.
    spawns:
      - room: kitsarae_mountain_basin
    image: 49d66bdba0609875f4e432ba7a7ceea5c4bc748f8fa125ed9d922281cb54d297.png
  rabbit_astronomer:
    name: a rabbit astronomer
    tier: standard
    level: 1
    description: A small, brown-furred rabbit sits upright on its haunches, wearing a tiny velvet coat adorned with star
      charts and a miniature brass telescope strapped across its back. Its wide, intelligent eyes peer skyward through a
      pair of oversized spectacles perched crookedly on its twitching nose.
    spawns:
      - room: kitsarae_mountain_basin
    image: 58c76099aad82426c61c90a5a510424428b948b8f8eb9d29e6b71c5939c911c9.png
  provost_lumina:
    name: Provost Lumina Auringale
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: academy_quad
    description: A tall Aureliae of late middle years whose skin holds the deep amber of preserved sunlight, robed in
      academic black that resolves, at the hems, into drifting constellations. Pince-nez of dreamglass perch on her
      nose, a quill writes minutes in the air beside her unprompted, and her floating lectern follows half a step
      behind like a well-trained moon. Her smile is the warm, dangerous kind that has already planned your entire
      curriculum.
    dialogue:
      root:
        text: Ah — the new arrival. Krioshaeu speaks well of you, which she does of everyone, and the Gates will speak
          honestly of you, which is rather the point of this place. I am Provost of the Auringold Academy, and my
          coursework will make Ambon make sense. Shall we enroll you properly?
        choices:
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: How does coursework actually work?
            next: coursework
          - text: Tell me about the Academy.
            next: academy
          - text: I am ready to graduate. (Fourth year and beyond.)
            minLevel: 4
            next: candidacy
          - text: Just passing through, Provost.
      coursework:
        text: Each wing of the campus keeps an instructor, and each instructor keeps lessons. 'quests' lists every
          course you've accepted with its remaining work, 'quest info <name>' reads the syllabus, and when the work is
          done you return to your instructor and 'quest turnin <name>' — or simply say so in conversation, as you are
          doing now. Finish a wing and its instructor will pin a badge on you. Collect all eight badges and the Gates
          themselves will want a word.
        choices:
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: Tell me about the Academy.
            next: academy
          - text: Thank you, Provost.
      academy:
        text: Auringold exists in the dreams of children, where the wall between realms wears thinnest — a campus
          stitched from memory and good intentions. The quad you stand upon connects everything that matters. Combat
          is taught east of here, commerce south along Market Row, craft in the workshops by Tessikon, riddles and
          glory in the library wings, and humility in the catacombs below. The notice board beside me posts the daily
          work; 'areas' will remind you where in the world you are, and 'time' when.
        choices:
          - text: How does coursework actually work?
            next: coursework
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: Thank you, Provost.
      candidacy:
        text: Then say it formally, candidate, and I shall enter your name in the book. The rite of Commencement asks
          only what the lectern at the Gates already told you — all eight wing badges in hand, presented to Gatekeeper
          Aurelion. The Gates know their own.
        choices:
          - text: I declare my candidacy for Commencement.
            action: unlock_flag:commencement_candidate
            next: candidacy_sealed
          - text: Not yet. I have badges to earn.
      candidacy_sealed:
        text: Witnessed and entered. Take the rite when your satchel holds all eight badges — accept it from me here,
          then carry your credentials to the Gatekeeper. And do straighten your robes first. The statues on the
          approach are watching, and they gossip.
        choices:
          - text: I accept the rite of Commencement.
            action: accept_quest:commencement
          - text: I will return with the badges.
    quests:
      - school_orientation
      - commencement
  greeter_pip:
    name: Pip the Welcome Wisp
    role: dialog
    faction: auringold_academy
    category: elemental
    spawns:
      - room: orientation_hall
    description: A fist-sized wisp of lantern-light wearing a graduation cap several sizes too small, bobbing at exactly
      the height of a friendly handshake. It glows brighter when asked questions, dims apologetically when it doesn't
      know an answer, and trails a faint ribbon of light shaped like a checklist. The cap, it will tell anyone, was
      earned.
    dialogue:
      root:
        text: Hello hello HELLO! New student! I'm Pip — orientation is ME. Ask me anything. Ask me everything! I
          glow either way.
        choices:
          - text: The Provost sent me to report for orientation.
            action: turn_in_quest:school_orientation
          - text: How do I make the game comfortable to read?
            next: comfort
          - text: What should the browser folk know?
            next: browser
          - text: What little conveniences am I missing?
            next: conveniences
          - text: I'm only visiting — can I keep this character?
            next: claiming
          - text: That's everything, Pip.
      comfort:
        text: Comfort first, always! 'ansi on' and 'ansi off' turn the colors up or away, and 'colors' shows the whole
          palette so you can judge it. If a screen reader speaks the dream aloud for you, 'screenreader on' makes
          every message read beautifully. 'clear' wipes the slate when the scroll gets long. And 'help' — 'help' is
          always the answer when you forget the question.
        choices:
          - text: What little conveniences am I missing?
            next: conveniences
          - text: What should the browser folk know?
            next: browser
          - text: Thanks, Pip!
      conveniences:
        text: The dream will do your chores if you ask! 'autoloot on' pockets the spoils of every victory before they
          touch the ground. 'autopeek on' whispers what waits in the next room before you walk in. 'wimpy 30' makes
          your feet flee danger on their own. 'quickheal' and 'quickmana' drink the best bottle you carry without
          rummaging. Set them once and forget them forever — that's the Academy way.
        choices:
          - text: How do I make the game comfortable to read?
            next: comfort
          - text: Thanks, Pip!
      browser:
        text: Ohh, the lucky ones with the painted dream! Your screen's panels mirror every command — character sheet,
          inventory, quests, map, crafting, all of it, live. Ctrl+K opens the command palette when you forget a word.
          The atlas fills in as you explore. The action bar holds your abilities for one-tap casting. And if you ever
          miss the old ways, the terminal overlay shows the dream as pure text, like the elders played it.
        choices:
          - text: What little conveniences am I missing?
            next: conveniences
          - text: Thanks, Pip!
      claiming:
        text: Guest dreamers fade when they leave unless they claim themselves! 'claim <password>' makes this very
          character permanently yours — name, progress, pockets and all. Do it before you wake, or I'll have to greet
          you ALL OVER AGAIN, and one of us will find that embarrassing.
        choices:
          - text: Thanks, Pip!
  drillmaster_brasswick:
    name: Drillmaster Brasswick
    role: quest_giver
    faction: auringold_academy
    category: construct
    spawns:
      - room: proving_yard
    description: A barrel-chested clockwork sergeant in a dented breastplate polished to parade shine, steam curling
      from the hinge of his jaw whenever he is about to be loud, which is always. One glass eye ticks as it ranges
      across the yard grading posture, and a whistle of polished bone hangs from his neck on a medal ribbon. Somewhere
      in his chest, a metronome keeps the cadence of ten thousand drills.
    dialogue:
      root:
        text: FRESH RECRUIT ON THE YARD! Outstanding. I am Drillmaster Brasswick and I have never lost a student I
          liked. We start with dummies, we end with things that hit back, and somewhere in between you become
          dangerous. Questions first or bruises first?
        choices:
          - text: Bruises. Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: I'm past dummies — what's next? (Second year.)
            minLevel: 2
            next: second_lesson
          - text: Teach me the fundamentals of a fight.
            next: fundamentals
          - text: What about the arts of my calling?
            next: callings
          - text: How do I not die, Drillmaster?
            next: survival
          - text: Carry on, Drillmaster.
      fundamentals:
        text: Rule one — 'consider' before you commit. The dream tells you true odds and only fools ignore them. Rule
          two — 'kill <foe>' starts the bout and your arm keeps its own rhythm, so spend your attention on judgment.
          Rule three — 'cast <ability> <foe>' is how you spend mana to end fights faster, 'spells' lists your arts and
          'effects' whatever's currently riding you, blessing or curse. Rule four — the fallen drop spoils. 'get' them
          or set 'autoloot on' and never stoop again.
        choices:
          - text: What about the arts of my calling?
            next: callings
          - text: How do I not die, Drillmaster?
            next: survival
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      callings:
        text: Every calling kills differently, recruit. Reach your second year, then visit Doctor Reinheart in the
          tavern or Uehma in the library — 'train' shows what they can wake in you, 'train learn <ability>' commits
          it. Your first art costs nothing but the asking. Speak your calling and I'll name the art to ask for.
        choices:
          - text: I am a Bulwark.
            requiredClass: bulwark
            next: calling_bulwark
          - text: I am an Arcanist.
            requiredClass: arcanist
            next: calling_arcanist
          - text: I walk the Veil.
            requiredClass: veil
            next: calling_veil
          - text: I am a Herald.
            requiredClass: herald
            next: calling_herald
          - text: I am a Scrollwright.
            requiredClass: scrollwright
            next: calling_scrollwright
          - text: I am a Songweaver.
            requiredClass: songweaver
            next: calling_songweaver
      calling_bulwark:
        text: A wall that hits back — my favorite kind of student. Ask for Hammer Strike at second year and bring it
          down with 'cast hammer strike <foe>'. Third year offers Shield Bash and a field-medic's trick called Triage
          Wounds — 'cast triage wounds' patches you mid-melee. You'll hold every line worth holding.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_arcanist:
        text: Glass cannon, emphasis on cannon. Arcane Bolt at second year — 'cast arcane bolt <foe>' and watch the
          math happen. Third year brings Arcane Blast for crowds and Arcane Intuition to sharpen your mind before a
          duel. Stand behind the Bulwarks. They love it.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_veil:
        text: I won't pretend I see you clearly even now, and that's the compliment. Shadow Strike at second year —
          'cast shadow strike <foe>' from anywhere the light isn't. Third year offers a Poison Dart that keeps hurting
          after you've stopped, and Scimitar Slash for when subtlety is finished. 'effects' will show your poisons
          doing their patient work.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_herald:
        text: The dream listens when you petition, Herald. Smite at second year — 'cast smite <foe>' and let your
          patron argue for you. Third year grants Minor Heal — 'cast minor heal' mends you mid-fight — and a Prayer of
          Fortification before hard lessons. Healers outlive everyone. It's the entire trick.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_scrollwright:
        text: Ah, Tessikar's heirs. Spring Shot at second year — 'cast springshot <foe>', undignified and effective.
          But your third year is the one that matters — Summon Clockwork Alligator. 'cast summon clockwork alligator'
          builds you a companion; 'pet' reports its health, 'pet skills' its arts, 'pet <skill>' commands one in
          battle, 'pet name <name>' christens it and 'pet dismiss' sends it to sleep. Rebuild it as you grow — they
          come back stronger.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_songweaver:
        text: Music as ordnance — the Academy approves. Sour Note at second year, 'cast sour note <foe>', and yes, it
          hurts exactly like it sounds. Third year brings the Songs of Strength and Intellect, long anthems that make
          you mightier for hours. Sing before the fight, recruit, not during the eulogy.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      survival:
        text: Dying is a fine elective and a terrible habit. Watch your vitals — 'score' between fights, the prompt
          during them. Keep cake, draughts, or both, and 'use' them — or trust 'quickheal'. Set 'wimpy 30' so your
          feet overrule your pride at thirty percent. And when judgment says run, 'flee' — the menagerie's gloomling
          demonstrates daily and has never once been graded down for it. The shrine below campus offers the full
          mortality seminar, strictly elective.
        choices:
          - text: I'm ready for the menagerie lesson. (Second year.)
            minLevel: 2
            action: accept_quest:the_better_part_of_valor
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      second_lesson:
        text: Then it's time you fought something with opinions. The sparring circle east of here keeps brass golems
          that hit back and a Proctor that hits back HARD — 'consider' both and learn what the colors of caution
          taste like. Bring me a golem's core and I'll believe the lesson took.
        choices:
          - text: I'll take the sparring examination.
            action: accept_quest:know_your_enemy
          - text: And after the golems?
            next: third_lesson
          - text: Carry on, Drillmaster.
      third_lesson:
        text: After golems, judgment. The menagerie holds a coward that must be chased and an ambusher that must be
          survived — bring me proof of both and you'll have learned the two lessons that keep soldiers old. Set your
          wimpy first. I'll know if you didn't.
        choices:
          - text: I'm ready for the menagerie lesson.
            action: accept_quest:the_better_part_of_valor
          - text: Carry on, Drillmaster.
    quests:
      - the_first_swing
      - know_your_enemy
      - the_better_part_of_valor
  practice_dummy:
    name: a practice dummy
    tier: weak
    level: 1
    category: construct
    spawns:
      - room: proving_yard
        count: 3
    description: A straw-stuffed canvas warrior lashed to a whirling post, wearing a hand-painted expression of
      theatrical villainy and a small placard reading HIT ME, I INSIST. Decades of student blows have given it a
      lumpy, forgiving shape, and bits of straw drift from its seams like slow confetti whenever it sways.
    hp: 12
    minDamage: 0
    maxDamage: 0
    xpReward: 10
    goldMin: 0
    goldMax: 0
    respawnSeconds: 20
    drops:
      - itemId: straw_heart
        chance: 1
  sparring_golem:
    name: a brass sparring golem
    tier: standard
    level: 2
    category: construct
    spawns:
      - room: sparring_circle
        count: 2
    description: A student-built golem of riveted brass plates and visible mainsprings, its knuckles capped in
      regulation felt that has long since stopped helping. It assumes a courteous boxing stance when approached,
      taps its fists together twice, and waits — the Academy insists its golems never swing first, and the golems
      visibly resent it.
    respawnSeconds: 45
    drops:
      - itemId: golem_core
        chance: 1
    spells:
      piston_jab:
        displayName: Piston Jab
        message: "{mob} drives a piston-straight jab into you for {damage}!"
        roomMessage: "{mob} drives a piston-straight jab into {target} for {damage}!"
        minDamage: 19
        maxDamage: 24
        cooldownMs: 9000
  proctor_golem:
    name: the Examination Golem
    tier: elite
    level: 3
    category: construct
    spawns:
      - room: sparring_circle
    description: Twice the size of the sparring models and plated in gunmetal scored with honors, this golem wears a
      silk ribbon reading PROCTOR pinned over where a heart would be. It does not adopt a stance when approached. It
      simply produces a small bell, rings it once, and notes the time — examinations, its posture suggests, have
      already begun.
    respawnSeconds: 90
    drops:
      - itemId: golem_core
        chance: 1
      - itemId: proctors_ribbon
        chance: 0.35
    spells:
      grading_slam:
        displayName: Grading Slam
        message: "{mob} brings both fists down like a failing grade for {damage}!"
        roomMessage: "{mob} brings both fists down on {target} like a failing grade for {damage}!"
        minDamage: 30
        maxDamage: 38
        cooldownMs: 12000
  cowardly_gloomling:
    name: a cowardly gloomling
    tier: weak
    level: 2
    category: beast
    spawns:
      - room: beast_pen
        count: 2
    description: A knee-high creature of damp shadow and enormous apologetic eyes, all elbows and flinches, leaving
      little puddles of nervous gloom wherever it skitters. It watches every approach with the resigned certainty of
      a creature that has been a teaching aid for a very long time and knows exactly which lesson it is.
    respawnSeconds: 40
    behavior:
      template: coward
      params:
        fleeHpPercent: 60
        fleeMessage: The gloomling squeaks, abandons all dignity, and bolts!
    drops:
      - itemId: gloom_ribbon
        chance: 1
  unruly_mimic:
    name: an unruly mimic
    tier: weak
    level: 2
    category: construct
    spawns:
      - room: beast_pen
    description: At first glance a perfectly ordinary footstool upholstered in cheerful gingham — at second glance a
      footstool with hinges where no footstool needs them, breathing very slightly, and angled just a touch too
      conveniently toward passing ankles. The fence post nearest it has been chewed in a pattern best described as
      practiced.
    respawnSeconds: 60
    behavior:
      template: aggro_guard
      params:
        aggroMessage: The footstool unhinges into a grin of brass teeth and lunges at you!
    drops:
      - itemId: mimic_tooth
        chance: 1
  marshal_valenne:
    name: Marshal Valenne
    role: dialog
    faction: auringold_academy
    spawns:
      - room: duel_ring
    description: A Lustriae duelist of impossible posture, silver-masked and gloved in dove-grey, her ceremonial sabre
      worn the way other people wear jewelry. Her wings are folded with parade precision, her voice carries the
      acoustics of an amphitheater regardless of where she stands, and her mask's single engraved eyebrow manages to
      convey an entire philosophy of judged technique.
    dialogue:
      root:
        text: Welcome to the only ring on campus where pride is the sole casualty. I am Marshal Valenne, and I referee
          all matters of honor. Speak, and I shall teach you the forms.
        choices:
          - text: How does a duel work?
            next: forms
          - text: What do I win?
            next: stakes
          - text: Merely admiring the architecture, Marshal.
      forms:
        text: Simplicity itself. 'duel <name>' issues the challenge — anywhere in Ambon, though the ring is
          traditional. Your opponent answers 'duel accept' or 'duel decline', and either answer is honorable. Blades
          and spells then speak until one dreamer falls; the runes catch the loser gently, and both parties walk away
          owning their result. No looting, no grudges, no lasting harm. The purest conversation two fighters can
          have.
        choices:
          - text: What do I win?
            next: stakes
          - text: Thank you, Marshal.
      stakes:
        text: Honor — the only currency that cannot be banked. Victories in formal PvP earn honor points, and
          'currencies' counts yours beside subtler wealth. The 'leaderboard' remembers the dream's finest duelists
          with embarrassing precision. Win gracefully, lose curiously, and challenge anyone whose technique you wish
          to understand. The ring is always open.
        choices:
          - text: How does a duel work?
            next: forms
          - text: Thank you, Marshal.
  bursar_coppertill:
    name: Bursar Coppertill
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: bursar_bank
    description: A short, immensely solid Lithae whose skin has the warm patina of circulated coin, dressed in a
      banker's waistcoat with seventeen visible pockets and, the rumor insists, forty more. An abacus of floating
      gemstones calculates idly beside her head, and her smile, when granted, has the satisfying finality of a vault
      door seating into its frame.
    dialogue:
      root:
        text: Welcome to the Vault. Your gold is currently doing the riskiest thing gold can do — being carried.
          Shall we discuss the alternative?
        choices:
          - text: Teach me how the bank works.
            next: banking
          - text: What else counts as wealth here?
            next: wealth
          - text: I have an errand to run for you, I hear.
            next: errand
          - text: My gold likes the danger, thank you.
      banking:
        text: Three words and a habit. 'deposit 50' entrusts coin to the vault, 'withdraw 50' reclaims it, 'bank'
          reads your balance and stored goods. Property banks too — 'deposit <item>' shelves a treasure beyond the
          reach of thieves, accidents, and your own generosity, and 'withdraw <item>' fetches it back. The habit is
          this — bank after every windfall, and the dream can never take back what it gave you.
        choices:
          - text: What else counts as wealth here?
            next: wealth
          - text: I'll take that errand.
            next: errand
          - text: Wise words, Bursar.
      wealth:
        text: Gold is merely the loudest currency. 'gold' counts it, yes — but 'currencies' counts the rest. Academy
          Merits from coursework, honor from formal duels, tokens from honest craft. None of it spends at the
          counter and all of it spends in reputation, which compounds better. Speaking of which — 'reputation' shows
          how the dream's factions regard you. The Academy notices its friends.
        choices:
          - text: Teach me how the bank works.
            next: banking
          - text: Wise words, Bursar.
      errand:
        text: Indeed. Auctioneer Mirabelle's ledger sheet is due — banks and auction houses reconcile daily, or
          civilization stops. Walk this sealed ledger down Market Row to the auction hall and put it in her hands.
          Mind the row as you go — every door on it will matter to you sooner than you think.
        choices:
          - text: I'll carry the ledger to Mirabelle.
            action: accept_quest:letters_and_ledgers
          - text: Another time, Bursar.
    quests:
      - letters_and_ledgers
  auctioneer_mirabelle:
    name: Auctioneer Mirabelle
    role: dialog
    faction: auringold_academy
    spawns:
      - room: auction_hall
    description: A statuesque Kitsarae with fox-bright eyes and an opera contralto, gowned in auction-catalog pages
      that rustle with every sweeping gesture. Her gavel is a rod of petrified lightning that crackles softly when
      bidding grows interesting, and her smile suggests she already knows what your treasures are worth — to the
      copper.
    dialogue:
      root:
        text: Welcome to the block, darling! Everything sells eventually — the only variables are patience and
          presentation. What shall we discuss?
        choices:
          - text: The Bursar sent this ledger for you.
            action: turn_in_quest:letters_and_ledgers
          - text: How do I buy at auction?
            next: buying
          - text: How do I sell my treasures?
            next: selling
          - text: Just admiring the lots, madam.
      buying:
        text: >-
          'auction' parades every lot before you, each with its number and asking price. See something
          irresistible? 'auction buy <number>' and it is yours, coin to seller, instantly. The browser-blessed will
          find the Auction panel does the parading for them in this very hall. Bid boldly, darling — regret is for
          the second-highest.
        choices:
          - text: How do I sell my treasures?
            next: selling
          - text: Thank you, madam.
      selling:
        text: >-
          'auction sell <item> <price>' places your treasure on the block at the price you dare to name — too
          humble insults the goods, too proud and it gathers dust. 'auction cancel <number>' withdraws a lot with
          dignity intact. Between us — crafted goods from the workshops sell beautifully to students who haven't
          found the forge yet. Supply, demand, and a little theater, darling. That's all an economy is.
        choices:
          - text: How do I buy at auction?
            next: buying
          - text: Thank you, madam.
  postmistress_wren:
    name: Postmistress Wren
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: provisioners_nook
    description: A small, quick Archae woman in a postal coat dyed provisioner's red, spectacles pushed up into hair
      that has defeated every pin sent against it. She sorts letters with one hand and corks bottles with the other,
      keeps a wax-sealing iron warm in a candle flame, and addresses every customer with the brisk tenderness of
      someone who reads a great many other people's good news.
    dialogue:
      root:
        text: Letters, bottles, rope, advice — the Nook stocks the essentials. Most adventurers come in for the
          bottles and leave having learned about everything else. What'll it be?
        choices:
          - text: What should every adventurer carry?
            next: provisions
          - text: Teach me the post.
            next: post
          - text: How do trades between dreamers work?
            next: trading
          - text: Just browsing, Postmistress.
      provisions:
        text: A weapon you trust, a back you've armored, and bottles — always bottles. 'list' shows my shelves, 'buy
          minor healing draught' stocks your satchel, and in the field 'quickheal' drinks the best one you carry the
          instant you ask. When you've a draught in your pocket, come tell me so — show me a student provisioned
          for trouble and I'll log your commission with the Academy.
        choices:
          - text: I have a draught right here — log my commission.
            action: accept_quest:stock_the_satchel
          - text: Teach me the post.
            next: post
          - text: Thank you, Postmistress.
      post:
        text: The post reaches every dreamer, awake or not. 'mail send <name>' opens a letter — write your piece,
          and coin or a parcel may ride along with it. 'mail' lists your inbox, 'mail read 1' opens the first
          letter, 'mail claim 1' pockets whatever it carried, 'mail delete 1' burns it politely. Nothing is ever
          lost in my post. Misfiled briefly, on occasion. Never lost.
        choices:
          - text: How do trades between dreamers work?
            next: trading
          - text: Thank you, Postmistress.
      trading:
        text: Face to face is the older post. 'trade <name>' opens a bargaining table between you and another
          dreamer — 'trade offer <item>' and 'trade offer 50 gold' load your side of it, theirs loads the other, and
          nothing whatsoever moves until both of you speak 'trade accept'. Either of you may 'trade cancel' and walk
          away friends. The handshake protects you both — the Academy is rather proud of that.
        choices:
          - text: What should every adventurer carry?
            next: provisions
          - text: Thank you, Postmistress.
    quests:
      - stock_the_satchel
  broker_thistledown:
    name: Broker Thistledown
    role: dialog
    faction: auringold_academy
    spawns:
      - room: broker_office
    description: A genteel Mycorae in a houndstooth suit, cap politely doffed indoors and held to his chest like a
      small beloved pet. Spores of paperwork drift from his sleeves and assemble themselves into contracts mid-air,
      and his handshake — offered freely — carries the loamy reassurance of someone who has never once sold a house
      with a ghost he didn't disclose.
    dialogue:
      root:
        text: Welcome, welcome — sit anywhere, the chairs are included. Thistledown, estates and dreams thereof.
          Every great adventurer eventually wants a door that locks behind them. Shall I show you what that costs?
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: What can I do with a house?
            next: house_life
          - text: What about a hall for a guild?
            next: guild_halls
          - text: Just window-shopping, Broker.
      buying_home:
        text: >-
          'house list' shows the catalog — every room we build and its price, from the carriage house at ten
          thousand gold upward to castles I'm contractually obliged to call sensible. When your purse is ready,
          stand in this office and speak 'house buy' — the carriage house is always the first key. After that,
          'house expand <template> <direction>' grows the estate room by room. Saving toward a door of your own is
          half of what Market Row is for.
        choices:
          - text: What can I do with a house?
            next: house_life
          - text: Thank you, Broker.
      house_life:
        text: Everything the dream denies you elsewhere. 'house' reports your estate; inside it you rest safe,
          store goods in vault rooms, even raise a private forge. 'house invite <name>' welcomes a guest, 'house
          kick <name>' un-welcomes one, 'house guests' takes attendance. And 'house describe title' and 'house
          describe desc' let you redecorate in prose, which is the cheapest renovation ever invented.
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: Thank you, Broker.
      guild_halls:
        text: Ah, fellowship at scale! Once you've founded a guild with the Registrar next door, 'guild hall buy'
          raises a common hall — the Guild Commons, hearth and banners included — and 'guild hall expand' grows it
          as the fellowship does. Ten thousand gold, split among friends, buys a remarkable amount of belonging.
        choices:
          - text: Walk me through buying a home.
            next: buying_home
          - text: Thank you, Broker.
  registrar_oakhollow:
    name: Registrar Oakhollow
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: guild_registry
    description: A broad Lithae of cathedral proportions whose granite hands turn ledger pages with watchmaker
      delicacy. Centuries of charters have worn a librarian's hush into him; moss grows in his knuckle-seams like
      well-kept hedgerows, and the great book before him is chained not against thieves but against his own
      tendency to hug it.
    dialogue:
      root:
        text: Welcome to the Registry. Heroes are sturdy things, but fellowships outlast them — I keep the ledgers
          of both. What shall we enter today?
        choices:
          - text: How do I found a guild?
            next: guilds
          - text: How do hunting groups work?
            next: groups
          - text: How do I keep hold of friends here?
            next: friends
          - text: How do dreamers speak across the dream?
            next: channels
          - text: I'd take a social errand, if you have one.
            next: errand
          - text: Only browsing the crests, Registrar.
      guilds:
        text: A guild is a name that outlives its founders. 'guild create <name> <TAG>' enters one in my ledger —
          choose both with care, the dream remembers. 'guild invite <name>' extends the hand, 'guild roster' counts
          the family, 'guild motd <words>' posts the morning's wisdom, 'guild promote' and 'guild demote' keep order
          kindly, and 'gchat <words>' — or simply 'g' — speaks in the fellowship's private voice. When the treasury
          allows, the Broker next door will sell you a hall to put it all in.
        choices:
          - text: How do hunting groups work?
            next: groups
          - text: Thank you, Registrar.
      groups:
        text: Groups are friendships with a shared scoreboard, made for an evening and dissolved by dawn. 'group
          invite <name>' calls a hunting party, they answer 'group accept', and from then on 'gtell <words>' reaches
          the party's ears alone while experience flows a little richer for everyone — the dream rewards company.
          'group' takes the roll, 'group leave' bows out, 'group kick' un-invites the snorer. The catacombs below
          were built for exactly this arithmetic.
        choices:
          - text: How do I found a guild?
            next: guilds
          - text: Thank you, Registrar.
      friends:
        text: The quietest ledger and my favorite. 'friend add <name>' marks a dreamer as yours to miss; 'friends'
          shows who among them walks the dream this very moment, and the page turns itself when they arrive or
          depart. 'friend remove <name>' — well. The ledger holds no grudges, and neither should you. 'who' shows
          every soul awake, strangers included, which is how friends begin.
        choices:
          - text: How do dreamers speak across the dream?
            next: channels
          - text: Thank you, Registrar.
      channels:
        text: Each voice carries differently. 'say <words>' — or a simple apostrophe — fills the room you stand in.
          'tell <name> <words>' crosses any distance to one ear; 'whisper' is for secrets close by; 'shout' rattles
          the whole zone, mind the library. 'gossip' is the dream-wide hearth where everyone warms themselves, and
          'ooc' steps outside the story entirely. For the wordless moments — 'emote bows deeply', or 'pose', and the
          browser-folk have a shelf of one-tap gestures besides.
        choices:
          - text: How do I keep hold of friends here?
            next: friends
          - text: Thank you, Registrar.
      errand:
        text: Always. Gamemaster Fortuna in the tavern parlor owes my ledger a signature — she will sign for a
          friendly face far sooner than for a form. Carry my regards across the quad, introduce yourself properly
          along the way, and let her teach you what her parlor teaches. Fellowship, candidate, begins with errands
          exactly like this one.
        choices:
          - text: I'll carry your regards to Fortuna.
            action: accept_quest:a_friendly_word
          - text: Another day, Registrar.
    quests:
      - a_friendly_word
  gardener_fernwhistle:
    name: Gardener Fernwhistle
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: gathering_garden
    description: A Sylflorae whose body is half wisteria and half good intentions, wearing a watering can as a hat
      with total unselfconsciousness. Clover springs up in her footprints and politely retracts behind her, songbirds
      use her shoulders as a waiting room, and her gardening apron's pockets hold seeds, shears, and at least one
      napping mouse she pretends not to know about.
    dialogue:
      root:
        text: Oh, hello, new sprout! Mind the moonpetals, they're shy before lunch. I keep the garden and the garden
          keeps the workshops — everything forged or brewed on this campus began as something gathered. Want to
          learn the gentle arts?
        choices:
          - text: Teach me to gather.
            next: gathering
          - text: How do crafting skills grow?
            next: skills
          - text: My basket's full — log my fieldwork.
            next: fieldwork
          - text: Just smelling the flowers, Gardener.
      gathering:
        text: Two beds here, and the mine through the gate keeps two seams more. 'gather petals' coaxes the
          moonpetal bed; 'gather vine' taps the sunsap trellis once your hands have learned the first bed's
          patience. Below ground it's 'gather seam' for glimmer-ore and 'gather pocket' for dreamglass. Each
          harvest tires the bed a short while — rotate like a considerate bee. And every so often the dream tips
          generously — rare findings for steady hands.
        choices:
          - text: How do crafting skills grow?
            next: skills
          - text: My basket's full — log my fieldwork.
            next: fieldwork
          - text: Thank you, Gardener!
      skills:
        text: By doing, sprout, only ever by doing. Every gather and every craft feeds its skill — 'craftskills'
          shows them all growing like a window box. Higher skill opens shyer beds, finer recipes, steadier hands.
          And when one craft becomes your truest calling, 'specialize <craft>' devotes you to it — devoted hands
          learn a quarter again as fast. Choose with your heart. The crafts can tell.
        choices:
          - text: Teach me to gather.
            next: gathering
          - text: Thank you, Gardener!
      fieldwork:
        text: Show me, show me! Three moonpetal blooms and three lumps of glimmer-ore — garden and mine both,
          because a maker who only knows one is hopping on one root. Bring them in your basket and the Academy
          will pin the harvest badge on you itself.
        choices:
          - text: Log my fieldwork, Gardener.
            action: accept_quest:green_thumbs
          - text: I'll fill the basket first.
    quests:
      - green_thumbs
  foreman_graveljaw:
    name: Foreman Graveljaw
    role: dialog
    faction: auringold_academy
    spawns:
      - room: old_mine_gate
    description: A weathered Lithae perched on an upturned ore bucket like a monument to the concept of breaks, his
      beard a magnificent growth of genuine quartz that chimes when he laughs. A lifetime underground has given him
      opinions about every stone in the mountain, all of which he will share, several of which are flattering.
    dialogue:
      root:
        text: Hold up there. Nobody walks under my lintel without the safety talk — the mountain's friendly, but
          it's friendly the way an avalanche is enthusiastic. What do you want to know?
        choices:
          - text: Give me the safety talk, Foreman.
            next: safety
          - text: What's worth digging down there?
            next: ores
          - text: Carry on, Foreman.
      safety:
        text: Three rules. One — 'gather seam' works the glimmer-ore and any fool can learn it, which is why we
          start fools on it. Two — the dreamglass pockets ask for skill 2; 'craftskills' tells you when your
          mining's ready, and the pocket will tell you ruder if it isn't. Three — seams need a breather between
          harvests, same as foremen. That's the whole talk. The mountain handles the rest of your education.
        choices:
          - text: What's worth digging down there?
            next: ores
          - text: Thanks, Foreman.
      ores:
        text: Glimmer-ore feeds the forge — blades, gauntlets, helms, anything Emberlyn can make sing. Dreamglass
          is subtler stuff, for charms and lanterns and the Enchanter's grammar. And now and then the seam tips you
          something rare — stardust in the ore, whisperweed in the cracks. The mountain has moods. Dig politely and
          they're mostly good ones.
        choices:
          - text: Give me the safety talk, Foreman.
            next: safety
          - text: Thanks, Foreman.
  smith_emberlyn:
    name: Smith Emberlyn
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: crafters_workshop
    description: A Pyrae smith whose ember-bright hair is bound back with a strip of wet leather that steams gently
      as she works, forearms freckled with constellations of old spark-scars. She speaks to the forge in the
      affectionate scold of a longtime partnership, and the hammer she sets down to greet you clearly does not enjoy
      being set down.
    dialogue:
      root:
        text: Mind the sparks, love. Forge is lit, anvil's willing, and I've never met a hero yet whose first blade
          wasn't their favorite forever. Come to make something?
        choices:
          - text: Teach me to smith.
            next: smithing
          - text: What can the forge make for me?
            next: catalog
          - text: I've forged my first blade — inspect it.
            next: inspection
          - text: Another time, Smith.
      smithing:
        text: Simple as honest work gets. 'recipes' lists everything your hands know — 'recipes smithing' narrows it
          to my trade. Stand at a forge, have the makings in your satchel, and 'craft glimmersteel shortblade' does
          the rest. The station matters — work at a proper forge and the metal gives you a little extra back.
          Glimmer-ore comes from the mine past the garden, and the menagerie's creatures drop the teeth and ribbons
          my patterns call for. Skill grows every time the hammer falls; 'craftskills' watches it happen.
        choices:
          - text: What can the forge make for me?
            next: catalog
          - text: I've forged my first blade — inspect it.
            next: inspection
          - text: Thank you, Smith.
      catalog:
        text: For new hands — the glimmersteel shortblade, a finer edge than the starlight gear you woke with.
          Gauntlets for hands the dream left bare, and when your skill's earned it, a helm worth the name. Wear your
          work with 'wear <item>', check the fit with 'equipment', and compare anything against anything before you
          choose — 'look <item>' tells you what a thing is worth in the wearing. A smith's gear plus an enchanter's
          finish — that's how campus legends dress.
        choices:
          - text: Teach me to smith.
            next: smithing
          - text: Thank you, Smith.
      inspection:
        text: Then let's see it, love! Forge your glimmersteel shortblade — ore from the seam, a mimic's tooth from
          the menagerie, hammer at my forge — and present it still warm. Pass inspection and the Academy pins the
          makers' path open for you.
        choices:
          - text: Inspect my blade, Smith.
            action: accept_quest:strike_while_hot
          - text: I'll be back with one.
    quests:
      - strike_while_hot
  alchemist_dewdrop:
    name: Alchemist Dewdrop
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: alchemy_lab
    description: An Ophirae in wave-patterned robes who moves with tidal calm among the bubbling kettles, measuring
      drops with the serenity of falling rain. Tiny beads of condensation orbit her like grateful moons, her sleeves
      are charmed against every stain except blackberry cordial, and her smile suggests the universe is simply a
      solution that hasn't finished precipitating.
    dialogue:
      root:
        text: Welcome, welcome — don't breathe too deeply near the violet kettle, it makes people honest. The lab
          turns the garden's gifts into bottled mercy. Shall I teach you?
        choices:
          - text: Teach me to brew.
            next: brewing
          - text: Which draughts matter most?
            next: draughts
          - text: I've brewed my own — examine them.
            next: examination
          - text: Just enjoying the bubbling, Alchemist.
      brewing:
        text: Brewing is patience with a recipe. Stand at an alchemy table — this one is the campus's finest —
          with makings in your satchel, and 'craft minor healing draught' begins the classic. 'recipes alchemy'
          lists my whole syllabus. Moonpetal from the garden is the heart of healing work; sunsap sweetens the
          mind's medicine. The table itself blesses the batch — brew here and the kettles always pour you one
          extra.
        choices:
          - text: Which draughts matter most?
            next: draughts
          - text: I've brewed my own — examine them.
            next: examination
          - text: Thank you, Alchemist.
      draughts:
        text: The red mends flesh, the blue mends thought — keep both and you will outlive your own mistakes,
          which is the whole of alchemy's promise. 'use draught' drinks deliberately; 'quickheal' and 'quickmana'
          drink wisely in a hurry, reaching for the best bottle you own. Check 'effects' after stranger potions.
          And carry spares for friends — nothing makes fellowship like the right bottle at the wrong time.
        choices:
          - text: Teach me to brew.
            next: brewing
          - text: Thank you, Alchemist.
      examination:
        text: Then the practical exam, gladly — two minor healing draughts of your own brewing, presented in
          matching glass. Brew them at my table and the batch will carry the lab's blessing and a little extra
          besides. Pass, and the Academy notes a promising pair of hands.
        choices:
          - text: Examine my draughts, Alchemist.
            action: accept_quest:bottled_courage
          - text: I'll fetch my ingredients first.
    quests:
      - bottled_courage
  enchanter_silverquill:
    name: Enchanter Silverquill
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: enchanting_sanctum
    description: An Aetherae of indeterminate age whose hair refuses to commit to any single constellation, drifting
      between star-maps as their mood turns. Runes orbit their wrists like patient pets, their fingertips leave
      brief silver afterimages on everything they touch, and they speak with the unhurried precision of someone who
      has argued with sleeping magic and, on occasion, lost gracefully.
    dialogue:
      root:
        text: Softly, please — the books are listening and several are critics. This sanctum teaches the last craft,
          the one that wakes magic inside finished things. Have you come to learn the grammar?
        choices:
          - text: Teach me enchanting.
            next: enchanting
          - text: What makings does the art demand?
            next: materials
          - text: I'm ready for the practical work.
            next: practical
          - text: Only browsing the chained books.
      enchanting:
        text: Every finished thing dreams of being more — we simply finish the sentence. 'enchantments' lists the
          workings this sanctum knows and what each demands. 'enchant <item> <working>' weaves one into a worn
          treasure — 'enchant shortblade keen_edge', say — or plain 'enchant <item>' and the sanctum chooses the
          finest your hand can manage. One working per item, so enchant with conviction. The craft grows like any
          other; 'craftskills' tracks your enchanting beside the rest.
        choices:
          - text: What makings does the art demand?
            next: materials
          - text: I'm ready for the practical work.
            next: practical
          - text: Thank you, Enchanter.
      materials:
        text: Stardust, always — the void's small change, shed by the star-creatures near Krioshaeu's cabin and
          sold, occasionally, by Madam Daydreams. Then something with character — broken gears for an edge that
          bites, moonpetal for weave that wards, dreamglass for the scholar's deeper workings. The dust remembers
          being a star. Our entire art is reminding it.
        choices:
          - text: Teach me enchanting.
            next: enchanting
          - text: Thank you, Enchanter.
      practical:
        text: Then two proofs, quietly. First — a dreamglass charm from the tinker's bench beside us, for the bench
          teaches what enchanting refines. Second — stardust in your satchel, gathered however the dream offers it.
          Bring both and I will witness your first working myself. The books will pretend not to watch. They will
          be watching.
        choices:
          - text: Witness my work, Enchanter.
            action: accept_quest:a_finer_polish
          - text: I'll gather the makings.
    quests:
      - a_finer_polish
  archivist_inkwhisper:
    name: Archivist Inkwhisper
    role: dialog
    faction: auringold_academy
    spawns:
      - room: hall_of_records
    description: A slender figure in archivist's greys who may once have been Lustriae and is now mostly profession,
      drifting between the stacks with a quill tucked behind each ear and a third, working quill that writes ahead of
      their thoughts. Their fingertips are permanently silvered with gold leaf, and they regard every visitor with
      the gentle appraisal of someone deciding how your plaque will read.
    dialogue:
      root:
        text: Hush — not for silence, you understand, but for drama. You stand in the Academy's memory. Everything
          you do echoes in here eventually. Would you like to know how the echo is kept?
        choices:
          - text: How are deeds remembered?
            next: deeds
          - text: How do I wear my honors?
            next: honors
          - text: What of the subtler ledgers?
            next: ledgers
          - text: I'll browse quietly, Archivist.
      deeds:
        text: >-
          'achievements' lists every deed the dream has noticed in you — done, half-done, and a few kept secret
          until the doing. Each is filed by school — combat, exploration, craft, fellowship, calling. The
          'leaderboard' is the louder cousin — 'leaderboard' alone shows the famous, 'leaderboard gold' the rich,
          and so on through every measure a dreamer can be ranked by. Browser scholars will find both bound into
          panels, updated as you live them.
        choices:
          - text: How do I wear my honors?
            next: honors
          - text: Thank you, Archivist.
      honors:
        text: Great deeds confer titles — 'title <words of the title>' wears one before your name for all to see,
          'title clear' retires it modestly. Your description is yours to author besides — 'describe <words>'
          writes what others read when they 'look' upon you, and 'describe check <name>' reads a fellow dreamer's
          page. Between titles, describing, and the salon's arts, no two heroes need ever read alike.
        choices:
          - text: What of the subtler ledgers?
            next: ledgers
          - text: Thank you, Archivist.
      ledgers:
        text: >-
          'currencies' counts wealth gold ignores — Academy Merits, honor, craft tokens. 'reputation' reads how
          the dream's factions regard you; the Academy's good opinion is earned in coursework and in laying its
          restless alumni to rest below. And the veiled plaque behind me concerns 'prestige' — a ceremony for heroes
          at the very summit of power who choose to begin again, mightier each time. Its dust-silk has not been
          lifted in living memory. Perhaps you'll be the one to embarrass it.
        choices:
          - text: How are deeds remembered?
            next: deeds
          - text: Thank you, Archivist.
  sphinx_of_softwords:
    name: the Sphinx of Softwords
    role: dialog
    category: construct
    spawns:
      - room: riddle_gallery
    description: A housecat-sized sphinx of veined marble curled atop its pedestal with the smugness of a creature
      that has never once been wrong in four thousand years and intends to keep the streak. Its tail ticks like a
      metronome when visitors think too loudly, and its smile is the precise smile of someone who already knows your
      answer and finds it adorable.
    dialogue:
      root:
        text: Mrrrow. A visitor. How wonderful — I was just thinking the gallery needed someone to be wrong in it.
          My riddle is on the pedestal. The door behind me opens for the worthy, and the worthy are those who answer.
        choices:
          - text: How do I answer a riddle?
            next: answering
          - text: Give me a hint, sphinx.
            next: hint
          - text: I'll think on it.
      answering:
        text: You read the riddle — 'read pedestal', in this gallery's case — you think, ideally, and then you speak
          your solution aloud with 'answer <word>'. Answer truly and I part with a key I am extremely fond of.
          Answer falsely and I purr, which you will learn to dread. The dream's puzzles all share this etiquette —
          some are questions, some are levers, all of them are listening.
        choices:
          - text: Give me a hint, sphinx.
            next: hint
          - text: I'll think on it.
      hint:
        text: A hint. Mrrrow. Very well — I am fondest of valleys, I die in a moment yet repeat forever, and every
          shout you have ever regretted sent me back to you immediately. You have heard me your whole life and never
          once seen me. Do hurry. Being patient is my entire body and even I have limits.
        choices:
          - text: How do I answer a riddle?
            next: answering
          - text: I'll think on it.
  the_marble_mouth:
    name: a marble mouth
    role: prop
    category: construct
    spawns:
      - room: secret_archive
    description: A pair of exquisitely carved marble lips set into the archive wall at exactly head height, mid-word
      forever. The stone around them is worn smooth by centuries of leaning listeners, and the mouth recites its
      single riddle with the relish of a performer who has honed one perfect show and sees no reason to learn
      another.
  gamemaster_fortuna:
    name: Gamemaster Fortuna
    role: dialog
    faction: auringold_academy
    spawns:
      - room: games_parlor
    description: A Kitsarae croupier of dazzling sleeves and untraceable card-flourishes, her fox eyes bright with
      the particular joy of someone who runs an honest table and finds honesty the best trick of all. Dice orbit her
      lazily awaiting their turn, and her smile pays out more reliably than the lottery — though she would thank you
      not to repeat that within the jar's hearing.
    dialogue:
      root:
        text: Welcome to the Parlor of Small Fortunes, where the dice are honest and the hope is complimentary! Pull
          up a stool, darling. What's your pleasure?
        choices:
          - text: The Registrar sends his regards — and a signature request.
            action: turn_in_quest:a_friendly_word
          - text: Teach me the dice.
            next: dice
          - text: Tell me about the lottery.
            next: lottery
          - text: Just soaking in the atmosphere.
      dice:
        text: Aineroia's own game, fair as moonrise. 'gamble 10' stakes ten gold against the house on a single roll
          — win and it comes back double, lose and the house buys the candles. Plain 'gamble' recites the full
          rules and the odds, which I post honestly because shame is bad for business. House rule and Fortuna's
          law — wager only what you'd happily lose, and you will never leave this parlor poorer than amused.
        choices:
          - text: Tell me about the lottery.
            next: lottery
          - text: Thanks, Fortuna.
      lottery:
        text: The jar on the mantel, darling — the whole dream buys in and one dreamer an hour walks out golden.
          'lottery' shows the jackpot swelling as we speak, 'lottery buy' takes a ticket for twenty-five gold,
          'lottery buy 5' takes five, ten per dreamer per drawing. Both my pleasures need a tavern's hospitality,
          which this parlor is licensed to provide. Browser guests — the lottery board behind me keeps itself
          current.
        choices:
          - text: Teach me the dice.
            next: dice
          - text: Thanks, Fortuna.
  stylist_papillon:
    name: Madame Papillon
    role: dialog
    faction: auringold_academy
    spawns:
      - room: twilight_salon
    description: A Kitsarae stylist whose own face is a rotating exhibition — cheekbones revised hourly, tonight's
      eyes borrowed from a portrait she admired — circling each client with shears she never seems to actually use.
      Her scissor-birds hover in attentive formation, and her appraising hum carries the weight of a final exam you
      did not know you were sitting.
    dialogue:
      root:
        text: Stand in the light, darling — mm, yes, there's something to work with. The salon's services range from
          the cosmetic to the existential. What are we feeling today?
        choices:
          - text: What can the salon change about me?
            next: services
          - text: What can I change about myself, for free?
            next: self_service
          - text: Just admiring the mirrors, Madame.
      services:
        text: The deep work — 'stylist' lists every race these hands can make of you and the fee for the unmaking,
          five hundred gold and worth twice that in conversation. When you're certain, 'changerace <race>' and the
          mirrors do the rest. An Archae who wakes Kitsarae sees the dream differently forever. The salon offers no
          refunds, darling, only encores.
        choices:
          - text: What can I change about myself, for free?
            next: self_service
          - text: Thank you, Madame.
      self_service:
        text: The dream charges nothing for self-knowledge. 'gender <choice>' is yours to declare whenever truth
          requires. 'describe <words>' authors what others see when they look upon you — write generously. 'title'
          wears any honor you've earned, and for the browser-blessed, 'sprite list' then 'sprite set <number>'
          changes the very figure that walks the painted dream. Reinvention, darling, is the one craft with no
          skill requirement.
        choices:
          - text: What can the salon change about me?
            next: services
          - text: Thank you, Madame.
  curator_mortis:
    name: Curator Mortis
    role: quest_giver
    faction: auringold_academy
    category: undead
    spawns:
      - room: catacomb_chapel
    description: A desiccated scholar in impeccably kept robes who finished dying some centuries ago and found the
      quiet agreeable, his finger-bones stained with votive wax and candle soot. He polishes the altar with the
      contentment of a gardener and addresses the living with gentle, papery courtesy — death, in his case, having
      improved his manners and his patience both.
    dialogue:
      root:
        text: Ah — a warm one. Welcome, welcome. Do not mind the others; they were students once and will be calm
          again, with help. I am the Curator, and the floor below is both my parish and your coursework. How may I
          guide you?
        choices:
          - text: Why do the dead walk here?
            next: the_dead
          - text: Explain the delve behind the altar.
            next: the_delve
          - text: I'll quiet the restless. (Third year.)
            minLevel: 3
            action: accept_quest:rattling_bones
          - text: I'm ready for the deep examination. (Fourth year.)
            minLevel: 4
            next: deep_exam
          - text: Peace to you, Curator.
      the_dead:
        text: Alumni, of a kind — students who never quite finished dying and now re-sit examinations no one is
          offering. They are a faction with memory and grievance, the Restless Dead, and they regard every warm
          student as an unfair grading curve. Lay them to rest and the Academy's regard for you rises — 'reputation'
          keeps the score with perfect manners. They feel no pain you'd recognize. Only relief, eventually.
        choices:
          - text: I'll quiet the restless.
            minLevel: 3
            action: accept_quest:rattling_bones
          - text: Explain the delve behind the altar.
            next: the_delve
          - text: Peace to you, Curator.
      the_delve:
        text: Beyond the iron door the catacombs dream their own architecture — every party that enters finds the
          halls rearranged, fresh and unmapped. 'dungeon enter academy_catacombs' begins your delve; 'dungeon leave'
          concedes it without shame and returns you to my chapel. Bring company if you can — 'group invite <name>'
          before the door shares the danger and sweetens the learning. At the bottom waits the Dean of the Dead, who
          has failed every student to reach him in four hundred years. He would adore being wrong about you.
        choices:
          - text: I'm ready for the deep examination.
            minLevel: 4
            next: deep_exam
          - text: Peace to you, Curator.
      deep_exam:
        text: Then I shall light the good candles. Enter the delve, walk its shifting halls, and put the Dean of the
          Dead to rest at the bottom of it. Succeed and you will have done this campus a kindness four centuries
          overdue — and worn the vigil badge that proves it. Mind the marrow proctors. They grade in the old style.
        choices:
          - text: I accept the deep examination.
            action: accept_quest:the_deep_lesson
          - text: I'll prepare first, Curator.
    quests:
      - rattling_bones
      - the_deep_lesson
  restless_pupil:
    name: a restless pupil
    tier: weak
    level: 3
    category: undead
    faction: restless_dead
    spawns:
      - room: ossuary_walk
        count: 2
    description: The translucent shade of a student forever late, clutching an essay whose ink runs upward and a
      satchel that long ago rotted to suggestion. It drifts the ossuary at a panicked walking pace, muttering page
      counts, and turns on the living with the wild, affronted energy of someone whose study hall has been
      interrupted for the last time.
    respawnSeconds: 45
    drops:
      - itemId: marrow_dust
        chance: 0.7
      - itemId: grave_silk
        chance: 0.3
  restless_scholar:
    name: a restless scholar
    tier: standard
    level: 3
    category: undead
    faction: restless_dead
    spawns:
      - room: ossuary_walk
    description: A gaunt revenant in the tatters of academic regalia, mortarboard fused to its skull at a scholarly
      tilt, arguing footnotes with the air in a voice like turning pages. Its hollow sockets hold a librarian's
      disappointment, and the quill it brandishes has been sharpened far past the needs of any honest correction.
    respawnSeconds: 60
    drops:
      - itemId: marrow_dust
        chance: 0.8
      - itemId: grave_silk
        chance: 0.5
    spells:
      withering_footnote:
        displayName: Withering Footnote
        message: "{mob} cites a withering footnote against you for {damage} — the criticism lingers!"
        roomMessage: "{mob} cites a withering footnote against {target} for {damage}!"
        minDamage: 16
        maxDamage: 22
        statusEffectId: poison
        cooldownMs: 12000
  marrow_proctor:
    name: a marrow proctor
    tier: elite
    level: 4
    category: undead
    faction: restless_dead
    spawns:
      - room: restless_repository
    description: A towering construct of fused scholar-bones wearing the chained remains of an examination bell, its
      ribcage packed with confiscated crib notes that flutter when it moves. It patrols with the unhurried
      certainty of invigilators everywhere — there is no leaving its hall early, and it has never once believed
      anyone who claimed to be finished.
    drops:
      - itemId: marrow_dust
        chance: 1
      - itemId: grave_silk
        chance: 0.6
  dean_of_the_dead:
    name: the Dean of the Dead
    tier: boss
    level: 4
    category: undead
    faction: restless_dead
    spawns:
      - room: restless_repository
    description: The grandest of the restless — a skeletal magisterium in robes of woven grave-silk, crowned with a
      mortarboard whose tassel is a tiny chained ghost. Four hundred years of failing every student to reach him
      have refined his disappointment into something architectural, and the gradebook fused to his left hand has
      never once recorded a pass.
    drops:
      - itemId: deans_hood
        chance: 1
      - itemId: grave_silk
        chance: 1
      - itemId: marrow_dust
        chance: 1
    spells:
      final_marking:
        displayName: Final Marking
        message: "{mob} strikes your name through with a blazing red quill for {damage}!"
        roomMessage: "{mob} strikes {target}'s name through with a blazing red quill for {damage}!"
        minDamage: 38
        maxDamage: 50
        cooldownMs: 10000
  the_final_lesson:
    name: the Final Lesson
    tier: boss
    level: 5
    category: construct
    faction: restless_dead
    spawns:
      - room: memento_mori_shrine
    description: An armored figure of compacted dust and steady candleflame kneeling at the shrine's heart, its
      helm bowed in permanent, patient apology. The Academy's oldest teaching assistant has exactly one lecture,
      delivers it flawlessly, and bows to the rare student who survives the syllabus. It will not rise until
      attacked. It always rises.
    hp: 600
    minDamage: 48
    maxDamage: 70
    armor: 6
    xpReward: 900
    respawnSeconds: 120
    drops:
      - itemId: humilitys_crown
        chance: 1
  gatekeeper_aurelion:
    name: Gatekeeper Aurelion
    role: dialog
    faction: auringold_academy
    spawns:
      - room: gates_of_ambon
    description: An Alorae of quiet, prismatic radiance in a herald's tabard bearing the Academy orrery, light
      bending gently around him as though the morning itself were paying attention. He holds no weapon and needs
      none — the Gates are his, and the Gates have never once been wrong. His smile, for graduates, is sunrise
      arriving early.
    dialogue:
      root:
        text: Welcome to the threshold, dreamer. Beyond these doors the waking world of Ambon is being made ready
          for you — and my whole office is knowing who is ready for it. Have you business with the Gates?
        choices:
          - text: I present my credentials for Commencement.
            action: turn_in_quest:commencement
          - text: What lies beyond the Gates?
            next: beyond
          - text: What do graduates do while they wait?
            next: waiting
          - text: Only paying respects, Gatekeeper.
      beyond:
        text: Everything, in the fullest sense — Ambon entire, waking and wide, every region 'areas' has whispered
          about. The Gates will open the moment the world is ready to receive this year's heroes; the Provost's
          proclamation says soon, and the Provost has never used that word carelessly. When they part, every
          graduate will feel it. You'll want your affairs banked and your blade enchanted, if you ask me. Nobody
          asks the Gatekeeper.
        choices:
          - text: What do graduates do while they wait?
            next: waiting
          - text: Thank you, Gatekeeper.
      waiting:
        text: They stay sharp, mostly. The notice board posts fresh chores each dawn — 'daily' and 'weekly' keep
          coin and experience flowing. The Bureau's 'bounty' work never runs dry, the catacombs reshuffle nightly
          for extra credit, and the dueling ring polishes technique politely. Some chase the deeds 'achievements'
          still keeps secret. And one or two simply sit with me and watch the light through the seam. That is also
          allowed.
        choices:
          - text: What lies beyond the Gates?
            next: beyond
          - text: Thank you, Gatekeeper.
