  underground_river:
    terrain: underground
    title: An Underground River
    description: A wide, dark river cuts silently through a vaulted stone cavern, its black water catching faint glimmers of
      bioluminescent moss clinging to the slick, dripping walls. Jagged stalactites hang overhead like stone teeth, and
      the air carries the cold, mineral scent of deep earth made almost visible in faint wisps of pale mist drifting
      across the slow current.
    exits:
      w: sleeping_stone_statues
      n: waterfall
    image: 8bddb8069ad07b2c89cdcd0f22547302fc843473ffbb879fe57e80cd79c76e96.jpg
    music: 1544e0fc50680c7e3f83d5f1b6fb6628de74d5455c0d2051fef91170a8a5c466.mp3
  waterfall:
    terrain: mountain
    title: A Mountain Waterfall
    description: A breathtaking cascade of crystalline water thunders down the face of a moss-covered granite cliff,
      catching the light in a thousand shimmering droplets that drift like silver mist through the cool mountain air.
      Lush ferns and wildflowers cling to the rocky banks where the churning white water collects into a deep, emerald
      pool below.
    exits:
      s: underground_river
      w: turbulent_waters
    image: 275cd52857efa2f96d298529f177d4ab587d3c8409216c7b3354bf7e7b588f51.jpg
    music: 2209f8ed7fe55b141d0e6598754261077d450682249dc9d520aac93b0655e5e5.mp3
    ambient: a00e6cc7f9416fd14237b17345aeff699d24792b5258f808693c33032208a6d7.mp3
  crafters_workshop:
    terrain: inside
    title: Crafter's Workshop
    description: Warm firelight flickers from a stone forge tucked into one corner, its chimney blackened with years of
      soot, while across the room an alchemist's table gleams with glass vials, bubbling retorts, and shelves crowded
      with labeled reagents. A sturdy loom and spinning wheel occupy a quieter alcove, draped with half-finished bolts
      of cloth in rich, earthy hues, the whole space smelling of coal smoke, herbs, and raw wool. The forge hungers for
      honest work — 'recipes' lists what your hands know, 'craft <recipe>' sets hammer to metal, and 'craftskills'
      tracks your growing mastery. Standing at a proper station like this one sweetens every craft with bonus goods. A
      doorway leads on to the tinker's bench, and outside, Tessikon hums.
    exits:
      w: dream_hotel
      s: enchanting_sanctum
    image: 1d237cf52db65fb29656f05b7783dbf001436e26ecf06ef61d7347a486f491d6.jpg
    station: forge
  betrayer_study:
    terrain: inside
    title: The Betrayer's Study
    description: Candlelight flickers across an obsidian altar of polished black glass, its surface etched with spiraling
      runes that seem to drink in the shadows; arranged upon it are dried bundles of luminescent herbs that glow with
      soft violet and silver light, an ornate bassinet lined with gossamer silk, and a ceremonial dagger whose blade
      catches the firelight like captured starlight. The air shimmers with an otherworldly haze, carrying the sweet
      scent of dreamsmoke and rebirth magic, as if the very boundary between the realm of the dead and the waking world
      grows thin in this consecrated space.
    exits:
      w: arcane_tempest
      n: royal_graveyard
    image: cfbc9592e1c6919d62586c9abe6dcfa975ecdcb5e7b35d3f1943ec081eac4e4c.jpg
    music: 4a80e1644837ae8d90844bd809b67fb716b1cbec0a946c72b6b49f82d7494199.mp3
  kitsarae_mountain_basin:
    terrain: forest
    title: The Awakening of the Kitsarae
    description: Towering plant-like titans rise from the earth here, their bark-thick limbs draped in cascading vines and
      luminous blossoms that pulse with a soft, golden-green light. Smaller creatures nest within their broad, mossy
      shoulders and hollowed trunks, while the roots sprawl outward like ancient roads, threading between stone and soil
      at the foot of the mountain range.
    exits:
      s: sylflorae_farm
      n: kitsarae_study
    image: 2274b912789783348cd1979b25bc51577d09a5231cc46db1ebadafa61ad670dd.jpg
  academy_quad:
    terrain: underwater
    title: Magnificent Palace Beneath the Waves
    description: >-
      Towering columns of pale coral rise toward a vaulted ceiling where bioluminescent jellyfish drift like living
      chandeliers, casting rippling azure light across floors of polished abalone and walls encrusted with pearls and
      sea-glass mosaics. At the room's heart, a broad-shouldered woman in wine-stained academic robes reclines across an
      enormous throne of black obsidian and gold filigree, a goblet dangling lazily from her fingers while crabs, eels,
      and iridescent fish weave dutifully between her feet.


      Provost Enid Maykoyla lounges on the ornate throne, feasting and drinking and nominally overseeing the students.
      Speak with her by typing 'talk provost' — her coursework will walk you through everything the Academy teaches. A
      notice board crowded with parchment floats nearby ('read board').
    exits:
      e: orientation_hall
      w: endless_starry_void
    features:
      notice_board:
        type: SIGN
        displayName: a notice board crowded with fluttering parchment
        keyword: board
        text: "ACADEMY NOTICES. Daily chores refresh each dawn — 'daily' lists today's, 'weekly' the week's grand task. The
          Cosmic Bureau posts open bounties: 'bounty' takes one, 'bounty info' checks it, 'bounty abandon' admits
          defeat. When the whole dream competes, 'gquest' shows the standing contest. Your own coursework is always
          under 'quests' — 'quest info <name>' for details, 'quest turnin <name>' when an instructor owes you a reward,
          'quest abandon <name>' to drop one. Browser students: the Quests panel tracks all of this for you."
    image: 56d4ec73527be176bc5c8873768a59c5a32c9f749b34cb725d15c64193197577.jpg
  orientation_hall:
    terrain: inside
    title: Undersea Orientation Hall
    description: >-
      Bioluminescent coral formations cluster along the walls like living sconces, casting the hall in shifting hues of
      teal and violet, while rows of barnacle-encrusted desks face an enormous basalt slab on which lesson notes write
      and erase themselves in glowing silver-white script, stirred by slow underwater currents. Folded paper constructs
      — syllabi sealed in translucent fish bladder to resist the deep — drift lazily through the water above like pale
      manta rays, and a cheerful globe of captured sea-light bobs near the kelp-draped lectern, its glow brightening
      whenever a new student drifts near.


      Settle your preferences before the term begins — the chalkboard keeps the full list ('read chalkboard'), and the
      welcome chest by the door holds a small gift for every new student ('open chest', then 'get biscuit from chest').
    exits:
      w: academy_quad
      e: wagon_drifting_stars
    features:
      orientation_chalkboard:
        type: SIGN
        displayName: an enormous self-writing chalkboard
        keyword: chalkboard
        text: SETTLING IN, A CHECKLIST. Colors too loud or too quiet? 'ansi on' / 'ansi off', and 'colors' previews the palette.
          Using a screen reader? 'screenreader on' tailors every message for it. Tired of stooping for loot? 'autoloot
          on' pockets your spoils as you win them. Curious what lies one room over? 'autopeek on'. Screen cluttered?
          'clear'. Lost? 'help'. Visiting as a guest? 'claim <password>' makes this character truly yours before you
          leave. Browser students — the gear icon and Ctrl+K command palette hold these same switches, and the terminal
          overlay shows this classic text any time you miss it.
      welcome_chest:
        type: CONTAINER
        displayName: a carved welcome chest with brass corners
        keyword: chest
        initialState: closed
        respawnSeconds: 120
        items:
          - dreamers_biscuit
    image: 0fef0f3c2ff5e803791d936d9cb32f30fa05e5f53df9ac67f546922d346d36e6.jpg
  proving_yard:
    terrain: outside
    title: The Proving Yard
    description: Packed earth scarred by ten thousand practice bouts, ringed by racks of blunted weapons and lit by floating
      lanterns that politely look away whenever a student fumbles. Straw-stuffed training dummies stand in patient rows,
      each wearing a hand-painted face of theatrical menace, while Drillmaster Brasswick — a barrel-chested clockwork
      sergeant with a whistle of polished bone — stalks the line barking encouragement. Take his coursework with 'talk
      drillmaster', then square up to a dummy with 'consider dummy' and 'kill dummy'. The slate by the gate lists the
      fundamentals ('read slate').
    exits:
      e: sparring_circle
      s: beast_pen
      w: deep_clockwork_forest
    features:
      combat_slate:
        type: SIGN
        displayName: a battered slate hung from the weapon rack
        keyword: slate
        text: COMBAT, THE SHORT COURSE. 'consider <foe>' weighs your chances — believe it. 'kill <foe>' begins the bout; your
          blade swings itself, but your judgment does not. 'cast <ability> <foe>' spends mana for greater blows —
          'spells' lists what you know, 'effects' what currently rides you. 'flee' is never shameful. Keep a snack or
          potion handy and 'use' it, or let 'quickheal' and 'quickmana' choose for you. The fallen leave spoils — 'get'
          them, or let 'autoloot on' do the stooping. Browser students fight just as well by tapping a foe and using the
          ability bar.
      drengariae_monument:
        type: SIGN
        displayName: a ring of frost-rimed warrior-statues at the yard's edge
        keyword: statues
        text: Warriors carved in ice that never melts — the Drengariae, the Alorae guard who ringed the first settlement with
          flaming swords through the Long Dark and froze at their posts rather than yield. Fighters still touch the cold
          stone before a hard bout and ask the frozen guard to stand with them.
    image: adea3d38dc4df5f8ed61e648c76669a0d7a06a884b950a1de96fd8c1eede9dc3.jpg
    musicBox:
      title: Drengariae, Stand Up
      file: c1223c4cf94d2b59fb9d423455c999579574695ede5bd80007e3c3e449f1261b.mp3
      durationSeconds: 224
      artist: TRADITIONAL
      description: Martial Polyphonic Battle Hymn about the Drengariae, the Gods of War and Protection
      image: 136560ec65d7700f78f5230310109032a717a11db8c0d5aefa4bbd07149d4511.png
