zone: auringold_academy
startRoom: krioshaeu_cabin
rooms:
  krioshaeu_cabin:
    terrain: inside
    title: Krioshaeu's Cabin
    description: >-
      Welcome, Adventurer! You stand within a cozy cabin that is lit by a roaring fire in the hearth. Here in the realm
      between life and death, you've been chosen to be reborn as a hero of Ambon. A small tea cart is set with two cups
      of hot tea and a variety of pastries and finger sandwiches. Krioshaeu sits in her rocking chair, smiling warmly at
      you. 


      A doorway opens into an endless starry void.


      Krioshaeu has been expecting you. Speak with her by typing 'talk krioshaeu' — or, if you play in a browser, tap
      her portrait beside the room art. Wherever you wander in Ambon, 'help' lists every command you can speak, and
      'look' paints your surroundings afresh. A small card rests on the tea cart ('read card').
    exits:
      e: endless_starry_void
    image: 621b3619970199aa512be55195f7f5d0085f43a960a2d6931ff817d7e01a99c7.jpg
    inn: true
    features:
      tea_card:
        type: SIGN
        displayName: a tea-stained welcome card
        keyword: card
        text: "\"Dearest newcomer — a few first words, with love. Move with the compass: n, s, e, w, u, d. 'look' shows the
          room; 'look <something>' studies it closely. 'inventory' (or 'i') checks your pockets, 'equipment' (or 'eq')
          what you wear, 'score' your soul, 'quests' your promises, 'who' your fellow dreamers. This cabin is an inn —
          resting here ('rest') marks it as home, and 'recall' will always carry you back to it. Browser visitors: the
          panels along your screen mirror all of this, and Ctrl+K opens a palette of every command. — K.\""
  endless_starry_void:
    terrain: sky
    title: The Endless Starry Void
    description: >-
      You drift suspended in an infinite expanse of darkness punctuated by countless stars of brilliant white and deep
      sapphire, their light seeming to bend and refract through threads of luminescent cosmic dust that spiral outward
      like frozen aurora. Distant galaxies bloom and fade like flowers of light in slow motion, their swirling arms of
      gold and violet painting stories across the void while wisps of nebulae drift past in haunting, ever-shifting
      formations that seem to echo with the weight of eons.


      The door to Krioshaeu's Cabin stands open nearby, suspended in space, and a caravan wagon drifts through the stars
      not far off. Below the door, impossibly, a lantern-lit lawn of silver-green grass floats in the dark — the
      Academy's quad, waiting for its newest student. A waystone of pale crystal drifts within arm's reach ('read
      waystone').
    exits:
      w: krioshaeu_cabin
      e: academy_quad
    image: df9c77f0bdab31aed502b54b5ca5c05f651bfcbaa9f5388f0fbb289dc9bedee8.jpg
    features:
      drifting_waystone:
        type: SIGN
        displayName: a drifting waystone of pale crystal
        keyword: waystone
        text: "Words surface in the crystal as you read: \"The dream is wide — walk it with n, s, e, w, and sometimes u and d.
          'exits' (or 'ex') names every way out, and 'autopeek on' whispers what waits one room ahead before you step.
          To stride several rooms at once, speak a path like 'run 2e' or 'run 3nw'. Should the way ever close behind
          you, 'recall' returns you to the last inn where you rested.\""
  wagon_drifting_stars:
    terrain: sky
    title: Outside a Wagon Drifting Through the Stars
    description: A weathered fortune teller's wagon drifts silently through the cosmic void, its wooden frame adorned with
      faded gilt and arcane symbols, while stained glass windows pulse with an eerie, otherworldly luminescence in hues
      of deep violet and emerald. Before it, a perfect ring of spectral campfire hovers impossibly in the starless
      darkness, casting dancing shadows across the wagon's ornate side and illuminating the endless expanse of space
      around it. A brass listening horn is bolted to the wagon's side ('read horn'), and a small side-carriage trails
      behind on a chain of starlight, its slatted drum glowing from within ('east').
    exits:
      w: orientation_hall
      e: caravan_stable
    features:
      listening_horn:
        type: SIGN
        displayName: a brass listening horn, etched with a curl of notes
        keyword: horn
        text: "THE DREAM HAS A VOICE. Every corner of Ambon keeps two sounds — a melody, and the murmur beneath it: wind, water,
          embers, crowds. Browser dreamers: the dream wakes silent, by the law of browsers — tap the speaker button once
          to let it sing, and its sliders set the music, the murmur, and the speaking voices each to your own taste.
          Many of the folk you 'talk' to will answer aloud. Text dreamers are not forgotten: speak 'audio on' and the
          dream will hand you each song, murmur, and voice as a link to play wherever you like; 'audio off' quiets the
          offer."
    image: 6f0eed32b8bd417a0e936a08f81ce405f82260326bce5bbc3bdcb2b0bbd304f0.jpg
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
  zoetrope_carriage:
    terrain: inside
    title: The Zoetrope Carriage
    description: A snug side-carriage hitched to the fortune teller's wagon by a chain of braided starlight, its walls
      lacquered midnight blue and its single round window showing nothing but slow-turning stars. The whole room is
      arranged around one instrument — a great brass zoetrope, taller than a dreamer, its slatted drum spinning with a
      soft clockwork purr. Candlelight catches the drum's slits as it turns, and painted figures flicker to life on the
      curved walls — a memory of the dream, replaying itself over and over for anyone who cares to watch. Dust motes
      drift through the projector-beam like slow snow. A hand-painted playbill is tacked beside the door ('read
      playbill').
    exits:
      s: fortune_teller_parlor
      w: lantern_cloister
    features:
      playbill:
        type: SIGN
        displayName: a hand-painted playbill in gilt and midnight blue
        keyword: playbill
        text: "MOVING MEMORIES — SHOWING NIGHTLY, AND ALSO ALWAYS. Some corners of the dream remember so vividly that the memory
          moves. Browser dreamers: when a place keeps a moving memory, a glowing reel marker appears beside the room's
          art — tap it and the memory plays. Whole regions sometimes greet a first visit with one, and the expanded
          world map will replay a region's memory whenever you wish. Creatures and curios may carry moving memories of
          their own — look for the reel in their portraits. Text dreamers: the words are the older, deeper magic;
          nothing here is shown that the dream does not also say."
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
    ambient: eabbaffaf798c184344d0114a97c89211c47726ffeac0453768b2707a935836c.mp3
    image: c55643926908e85ffafba4a743b4f3435447e854391c95590d48ce7b67700da8.jpg
    videoText: Inside a snug fortune-teller's carriage at night, its walls lacquered midnight blue, a great ornate brass
      zoetrope turns slowly at the center. Candlelight catches its slits, and the painted figures it throws onto the
      curved walls flicker and walk as it spins. Dust drifts through the beam of light like slow snow — warm, close, and
      quietly magical.
    video: c01f67bb45b1aa8187efedc78f7d5d4e4039cf4580f748f7e1a8e022eaa64a4d.mp4
  memory_creation:
    terrain: sky
    title: A Memory of Creation
    description: You stand within a dream, or a memory, witnessing the creation of Ambon. The world is pulled apart,
      floating in pieces around a central platform. A humanoid figure stands on the platform, bathed in blinding light,
      manipulating the arcane energies as the world forms around them. At their feet, the heat of their presence melts
      the ground, forming two slabs of obsidian beneath them.
    exits:
      n: lantern_cloister
      w: first_archae
    image: b976a65e63d87ef7aaff59b3744ca75f43e254efebf5d5ce2fa8dc26a0074309.jpg
  fortune_teller_parlor:
    terrain: inside
    title: Fortune Teller's Astral Parlor
    description: Within the impossibly vast interior of what should be a cramped wagon, towering shelves overflow with
      leather-bound tomes and crystalline artifacts, their spines glowing with arcane script, while overhead a vaulted
      ceiling painted with zodiac constellations is illuminated by an ever-shifting kaleidoscope of colored light
      streaming through intricate stained glass windows—each pane depicting celestial events and mystical symbols. The
      air itself seems to shimmer with otherworldly energy, dense with the scent of incense and old parchment, as though
      the space exists partially in this world and partially in something far stranger beyond. Behind the tallest shelf,
      steady lantern-light seeps from a hidden cloister.
    exits:
      n: zoetrope_carriage
      s: caravan_stable
    image: 0e64e864804e64df695eaa90cdb563ff1f84eae706c8b28425c9a94695e3f6c9.jpg
    music: 825807f5b4a0b914fd69cec553969f4e3b92c4cb008622e418ad1ddd923c07e2.mp3
    ambient: eabbaffaf798c184344d0114a97c89211c47726ffeac0453768b2707a935836c.mp3
    musicBox:
      title: The Word of Ambon
      file: 5e9aec773598a4844d52452a785c4cbd75627d65cc31907ee0eeae044b242d69.mp3
      durationSeconds: 202
