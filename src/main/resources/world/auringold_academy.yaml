  stray_starfall:
    name: a stray starfall
    tier: weak
    level: 2
    category: elemental
    spawns:
      - room: almanac_terrace
    condition:
      events:
        - wandering_star
    description: A child-sized knot of silver light, plainly wandered off from some celestial parade and not the least
      embarrassed about it. It only ever comes down while the Wandering Star hangs low, circles the moondial shedding
      slow sparks that fade before they land, and bolts skyward the moment its parent star climbs home — leaving the
      terrace one shade dimmer and noticeably quieter.
    drops:
      - itemId: almanac_pressing
        chance: 1
      - itemId: stardust
        chance: 0.5
    image: d54a937911a2a4c29adf7df8cc166c84aefa3e98a9bc1e0f1a049a5c09da6e51.png
  foreman_graveljaw:
    name: Foreman Graveljaw
    role: dialog
    faction: auringold_academy
    spawns:
      - room: old_mine_gate
    description: A weathered Lithae perched on an upturned ore bucket like a monument to the concept of breaks, his beard a
      magnificent growth of genuine quartz that chimes when he laughs. A lifetime underground has given him opinions
      about every stone in the mountain, all of which he will share, several of which are flattering.
    dialogue:
      root:
        text: Hold up there. Nobody walks under my lintel without the safety talk — the mountain's friendly, but it's friendly
          the way an avalanche is enthusiastic. What do you want to know?
        choices:
          - text: Give me the safety talk, Foreman.
            next: safety
          - text: What's worth digging down there?
            next: ores
          - text: Carry on, Foreman.
      safety:
        text: Three rules. One — 'gather seam' works the glimmer-ore and any fool can learn it, which is why we start fools on
          it. Two — the dreamglass pockets ask for skill 2; 'craftskills' tells you when your mining's ready, and the
          pocket will tell you ruder if it isn't. Three — seams need a breather between harvests, same as foremen.
          That's the whole talk. The mountain handles the rest of your education.
        choices:
          - text: What's worth digging down there?
            next: ores
          - text: Thanks, Foreman.
      ores:
        text: Glimmer-ore feeds the forge — blades, gauntlets, helms, anything Emberlyn can make sing. Dreamglass is subtler
          stuff, for charms and lanterns and the Enchanter's grammar. And now and then the seam tips you something rare
          — stardust in the ore, whisperweed in the cracks. The mountain has moods. Dig politely and they're mostly good
          ones.
        choices:
          - text: Give me the safety talk, Foreman.
            next: safety
          - text: Thanks, Foreman.
    image: 45ec23d0d621c093f0117ca76a357f487812a9994a9256c494d052bd4c874bec.png
  smith_emberlyn:
    name: Smith Emberlyn
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: crafters_workshop
    description: A Pyrae smith whose ember-bright hair is bound back with a strip of wet leather that steams gently as she
      works, forearms freckled with constellations of old spark-scars. She speaks to the forge in the affectionate scold
      of a longtime partnership, and the hammer she sets down to greet you clearly does not enjoy being set down.
    dialogue:
      root:
        text: Mind the sparks, love. Forge is lit, anvil's willing, and I've never met a hero yet whose first blade wasn't their
          favorite forever. Come to make something?
        choices:
          - text: Teach me to smith.
            next: smithing
          - text: What can the forge make for me?
            next: catalog
          - text: I've forged my first blade — inspect it.
            next: inspection
          - text: Another time, Smith.
      smithing:
        text: Simple as honest work gets. 'recipes' lists everything your hands know — 'recipes smithing' narrows it to my
          trade. Stand at a forge, have the makings in your satchel, and 'craft glimmersteel shortblade' does the rest.
          The station matters — work at a proper forge and the metal gives you a little extra back. Glimmer-ore comes
          from the old mine on Kaerinlith's path, and the menagerie's creatures drop the teeth and ribbons my patterns
          call for. Skill grows every time the hammer falls; 'craftskills' watches it happen.
        choices:
          - text: What can the forge make for me?
            next: catalog
          - text: I've forged my first blade — inspect it.
            next: inspection
          - text: Thank you, Smith.
      catalog:
        text: For new hands — the glimmersteel shortblade, a finer edge than the starlight gear you woke with. Gauntlets for
          hands the dream left bare, and when your skill's earned it, a helm worth the name. Wear your work with 'wear
          <item>', check the fit with 'equipment', and compare anything against anything before you choose — 'look
          <item>' tells you what a thing is worth in the wearing. A smith's gear plus an enchanter's finish — that's how
          campus legends dress.
        choices:
          - text: Teach me to smith.
            next: smithing
          - text: Thank you, Smith.
      inspection:
        text: Then let's see it, love! Forge your glimmersteel shortblade — ore from the seam, a mimic's tooth from the
          menagerie, hammer at my forge — and present it still warm. Pass inspection and the Academy pins the makers'
          path open for you.
        choices:
          - text: Inspect my blade, Smith.
            action: accept_quest:strike_while_hot
          - text: I'll be back with one.
    quests:
      - strike_while_hot
    image: ccbc90be4fde51e066c83e37c6c1e7961306d0dc4b2ffef65ac63739f7392290.png
  alchemist_dewdrop:
    name: Alchemist Dewdrop
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: alchemy_lab
    description: An Ophirae in wave-patterned robes who moves with tidal calm among the bubbling kettles, measuring drops
      with the serenity of falling rain. Tiny beads of condensation orbit her like grateful moons, her sleeves are
      charmed against every stain except blackberry cordial, and her smile suggests the universe is simply a solution
      that hasn't finished precipitating.
    dialogue:
      root:
        text: Welcome, welcome — don't breathe too deeply near the violet kettle, it makes people honest. The lab turns the
          garden's gifts into bottled mercy. Shall I teach you?
        choices:
          - text: Teach me to brew.
            next: brewing
          - text: Which draughts matter most?
            next: draughts
          - text: I've brewed my own — examine them.
            next: examination
          - text: Just enjoying the bubbling, Alchemist.
      brewing:
        text: Brewing is patience with a recipe. Stand at an alchemy table — this one is the campus's finest — with makings in
          your satchel, and 'craft minor healing draught' begins the classic. 'recipes alchemy' lists my whole syllabus.
          Moonpetal from the garden is the heart of healing work; sunsap sweetens the mind's medicine. The table itself
          blesses the batch — brew here and the kettles always pour you one extra.
        choices:
          - text: Which draughts matter most?
            next: draughts
          - text: I've brewed my own — examine them.
            next: examination
          - text: Thank you, Alchemist.
      draughts:
        text: The red mends flesh, the blue mends thought — keep both and you will outlive your own mistakes, which is the whole
          of alchemy's promise. 'use draught' drinks deliberately; 'quickheal' and 'quickmana' drink wisely in a hurry,
          reaching for the best bottle you own. Check 'effects' after stranger potions. And carry spares for friends —
          nothing makes fellowship like the right bottle at the wrong time.
        choices:
          - text: Teach me to brew.
            next: brewing
          - text: Thank you, Alchemist.
      examination:
        text: Then the practical exam, gladly — two minor healing draughts of your own brewing, presented in matching glass.
          Brew them at my table and the batch will carry the lab's blessing and a little extra besides. Pass, and the
          Academy notes a promising pair of hands.
        choices:
          - text: Examine my draughts, Alchemist.
            action: accept_quest:bottled_courage
          - text: I'll fetch my ingredients first.
    quests:
      - bottled_courage
    image: a0a129d42df3ce550792cb19af8a286518b2e2079d060af2ee67793b4a1b1141.png
  enchanter_silverquill:
    name: Enchanter Silverquill
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: enchanting_sanctum
    description: An Aetherae in an elaborate mother-of-pearl cloak that hides their face. Runes orbit their wrists like
      patient pets, their fingertips leave brief silver afterimages on everything they touch, and they speak with the
      unhurried precision of someone who has argued with sleeping magic and, on occasion, lost gracefully.
    dialogue:
      root:
        text: Softly, please — the books are listening and several are critics. This sanctum teaches the last craft, the one
          that wakes magic inside finished things. Have you come to learn the grammar?
        choices:
          - text: Teach me enchanting.
            next: enchanting
          - text: What makings does the art demand?
            next: materials
          - text: I'm ready for the practical work.
            next: practical
          - text: Only browsing the chained books.
      enchanting:
        text: Every finished thing dreams of being more — we simply finish the sentence. 'enchantments' lists the workings this
          sanctum knows and what each demands. 'enchant <item> <working>' weaves one into a worn treasure — 'enchant
          shortblade keen_edge', say — or plain 'enchant <item>' and the sanctum chooses the finest your hand can
          manage. One working per item, so enchant with conviction. The craft grows like any other; 'craftskills' tracks
          your enchanting beside the rest.
        choices:
          - text: What makings does the art demand?
            next: materials
          - text: I'm ready for the practical work.
            next: practical
          - text: Thank you, Enchanter.
      materials:
        text: Stardust, always — the void's small change, shed by the star-creatures near Krioshaeu's cabin and sold,
          occasionally, by Madam Daydreams. Then something with character — broken gears for an edge that bites,
          moonpetal for weave that wards, dreamglass for the scholar's deeper workings. The dust remembers being a star.
          Our entire art is reminding it.
        choices:
          - text: Teach me enchanting.
            next: enchanting
          - text: Thank you, Enchanter.
      practical:
        text: Then two proofs, quietly. First — a dreamglass charm from the tinker's bench beside us, for the bench teaches what
          enchanting refines. Second — stardust in your satchel, gathered however the dream offers it. Bring both and I
          will witness your first working myself. The books will pretend not to watch. They will be watching.
        choices:
          - text: Witness my work, Enchanter.
            action: accept_quest:a_finer_polish
          - text: I'll gather the makings.
    quests:
      - a_finer_polish
    image: 00f75f328c7f53dc039f24f0d15c9b21512830f81063aecf88fa6195236771d6.png
  archivist_inkwhisper:
    name: Archivist Inkwhisper
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: hall_of_records
    description: A slender figure in archivist's greys who may once have been Lustriae and is now mostly profession,
      drifting between the stacks with a quill tucked behind each ear and a third, working quill that writes ahead of
      their thoughts. Their fingertips are permanently silvered with gold leaf, and they regard every visitor with the
      gentle appraisal of someone deciding how your plaque will read.
    dialogue:
      root:
        text: Hush — not for silence, you understand, but for drama. You stand in the Academy's memory. Everything you do echoes
          in here eventually. Would you like to know how the echo is kept?
        choices:
          - text: How are deeds remembered?
            next: deeds
          - text: How do I wear my honors?
            next: honors
          - text: What of the subtler ledgers?
            next: ledgers
          - text: Set me the riddle gauntlet. (Third year.)
            minLevel: 3
            next: gauntlet
          - text: I'll browse quietly, Archivist.
      gauntlet:
        text: Ah — the wing I cannot walk for you. Beneath fallen Necrambon, off the catacombs landing, the Sphinx of Softwords
          keeps its gallery — answer its riddle, spend the key it grudges you, persuade the vault's levers in the order
          the verse praises, and bring me the Grimoire of Beginnings from the archive past the wall. The archive grows a
          fresh copy for every student; yours returns to these shelves with your name in it, which is the only way
          history accepts donations.
        choices:
          - text: I'll walk the gauntlet, Archivist.
            action: accept_quest:echoes_in_the_stacks
          - text: Another day, perhaps.
      deeds:
        text: "'achievements' lists every deed the dream has noticed in you — done, half-done, and a few kept secret until the
          doing. Each is filed by school — combat, exploration, craft, fellowship, calling. The 'leaderboard' is the
          louder cousin — 'leaderboard' alone shows the famous, 'leaderboard gold' the rich, and so on through every
          measure a dreamer can be ranked by. Browser scholars will find both bound into panels, updated as you live
          them."
        choices:
          - text: How do I wear my honors?
            next: honors
          - text: Thank you, Archivist.
      honors:
        text: Great deeds confer titles — 'title <words of the title>' wears one before your name for all to see, 'title clear'
          retires it modestly. Your description is yours to author besides — 'describe <words>' writes what others read
          when they 'look' upon you, and 'describe check <name>' reads a fellow dreamer's page. Between titles,
          describing, and the salon's arts, no two heroes need ever read alike.
        choices:
          - text: What of the subtler ledgers?
            next: ledgers
          - text: Thank you, Archivist.
      ledgers:
        text: "'currencies' counts wealth gold ignores — Academy Merits, honor, craft tokens. 'reputation' reads how the dream's
          factions regard you; the Academy's good opinion is earned in coursework and in soothing the bad dreams to rest
          in the catacombs beneath Necrambon. And the veiled plaque in the vestibule off this hall concerns 'prestige' —
          a ceremony for heroes at the very summit of power who choose to begin again, mightier each time. Its dust-silk
          has not been lifted in living memory. Perhaps you'll be the one to embarrass it."
        choices:
          - text: How are deeds remembered?
            next: deeds
          - text: Thank you, Archivist.
    quests:
      - echoes_in_the_stacks
    image: ec407c627616eb75fc19453c68833a0ce1e00c535894103929943efadcd83245.png
  sphinx_of_softwords:
    name: the Sphinx of Softwords
    role: dialog
    category: construct
    spawns:
      - room: riddle_gallery
    description: A housecat-sized sphinx of veined marble curled atop its pedestal with the smugness of a creature that has
      never once been wrong in four thousand years and intends to keep the streak. Its tail ticks like a metronome when
      visitors think too loudly, and its smile is the precise smile of someone who already knows your answer and finds
      it adorable.
    dialogue:
      root:
        text: Mrrrow. A visitor. How wonderful — I was just thinking the gallery needed someone to be wrong in it. My riddle is
          on the pedestal. The door behind me opens for the worthy, and the worthy are those who answer.
        choices:
          - text: How do I answer a riddle?
            next: answering
          - text: Give me a hint, sphinx.
            next: hint
          - text: I'll think on it.
      answering:
        text: You read the riddle — 'read pedestal', in this gallery's case — you think, ideally, and then you speak your
          solution aloud with 'answer <word>'. Answer truly and I part with a key I am extremely fond of. Answer falsely
          and I purr, which you will learn to dread. The dream's puzzles all share this etiquette — some are questions,
          some are levers, all of them are listening.
        choices:
          - text: Give me a hint, sphinx.
            next: hint
          - text: I'll think on it.
      hint:
        text: A hint. Mrrrow. Very well — I am fondest of valleys, I die in a moment yet repeat forever, and every shout you
          have ever regretted sent me back to you immediately. You have heard me your whole life and never once seen me.
          Do hurry. Being patient is my entire body and even I have limits.
        choices:
          - text: How do I answer a riddle?
            next: answering
          - text: I'll think on it.
    image: 84b792e91d6ef15214f39e55d54c379fcafdd39a1e1eaa090afff79227007614.png
  the_marble_mouth:
    name: a marble mouth
    role: prop
    category: construct
    spawns:
      - room: secret_archive
    description: A pair of exquisitely carved marble lips set into the archive wall at exactly head height, mid-word
      forever. The stone around them is worn smooth by centuries of leaning listeners, and the mouth recites its single
      riddle with the relish of a performer who has honed one perfect show and sees no reason to learn another.
    image: 97ad440be78559ea0995543f85a534544ceec8d1e4afb49e24b8e356a5f99dac.png
  gamemaster_kolksprut:
    name: Gamemaster Kolksprut
    role: dialog
    faction: auringold_academy
    spawns:
      - room: games_parlor
    description: At a glance, a smiling croupier of dazzling sleeves and untraceable card-flourishes — but look twice and
      the shape won't quite hold — the colors of the coat drift when you glance away, there is a sleeve or two more than
      a person ought to have, and the eyes carry the sideways gold of a cuttlefish. It is a borrowed face. Not one
      student in a hundred guesses that the parlor's honest table is kept by Kolksprut himself, the god of luck,
      slumming among mortals for the pure delight of a fair game.
    dialogue:
      root:
        text: Welcome to the Parlor of Small Fortunes, where the dice are honest and the hope is complimentary! Pull up a stool,
          darling. What's your pleasure?
        choices:
          - text: The Registrar sends his regards — and a signature request.
            action: turn_in_quest:a_friendly_word
          - text: Teach me the dice.
            next: dice
          - text: Tell me about the lottery.
            next: lottery
          - text: Just soaking in the atmosphere.
      dice:
        text: Aineroia's own game, fair as moonrise. 'gamble 10' stakes ten gold against the house on a single roll — win and it
          comes back double, lose and the house buys the candles. Plain 'gamble' recites the full rules and the odds,
          which I post honestly because shame is bad for business. House rule and Kolksprut's law — wager only what
          you'd happily lose, and you will never leave this parlor poorer than amused.
        choices:
          - text: Tell me about the lottery.
            next: lottery
          - text: Thanks, Kolksprut.
      lottery:
        text: The jar on the mantel, darling — the whole dream buys in and one dreamer an hour walks out golden. 'lottery' shows
          the jackpot swelling as we speak, 'lottery buy' takes a ticket for twenty-five gold, 'lottery buy 5' takes
          five, ten per dreamer per drawing. Both my pleasures need a tavern's hospitality, which this parlor is
          licensed to provide. Browser guests — the lottery board behind me keeps itself current.
        choices:
          - text: Teach me the dice.
            next: dice
          - text: Thanks, Kolksprut.
    image: 13b980ad840fd719eec4ac6c5b2b61ff082ec3c488a1c53b175a0f6f30d6eab4.png
  stylist_papillon:
    name: Madame Papillon
    role: dialog
    faction: auringold_academy
    spawns:
      - room: twilight_salon
    description: A moth Kitsarae stylist with an impeccable sense of style.
    dialogue:
      root:
        text: Stand in the light, darling — mm, yes, there's something to work with. The salon's services range from the
          cosmetic to the existential. What are we feeling today?
        choices:
          - text: What can the salon change about me?
            next: services
          - text: What can I change about myself, for free?
            next: self_service
          - text: Just admiring the mirrors, Madame.
      services:
        text: The deep work — 'stylist' lists every race these hands can make of you and the fee for the unmaking, five hundred
          gold and worth twice that in conversation. When you're certain, 'changerace <race>' and the mirrors do the
          rest. An Archae who wakes Kitsarae sees the dream differently forever. The salon offers no refunds, darling,
          only encores.
        choices:
          - text: What can I change about myself, for free?
            next: self_service
          - text: Thank you, Madame.
      self_service:
        text: The dream charges nothing for self-knowledge. 'gender <choice>' is yours to declare whenever truth requires.
          'describe <words>' authors what others see when they look upon you — write generously. 'title' wears any honor
          you've earned, and for the browser-blessed, 'sprite list' then 'sprite set <number>' changes the very figure
          that walks the painted dream. Reinvention, darling, is the one craft with no skill requirement.
        choices:
          - text: What can the salon change about me?
            next: services
          - text: Thank you, Madame.
    image: 54f96cd1466301ca10e9d759cc057966af4be348464b48f5498dda15027991f1.png
  curator_mortis:
    name: the Lampkeeper
    role: quest_giver
    faction: auringold_academy
    category: humanoid
    spawns:
      - room: catacomb_chapel
    description: A round, soft-spoken keeper in a patched dressing-gown, a brass lamp cupped in both hands and a ring of
      little nightlights bobbing at his belt like fireflies on a string. He tends the last warm light in the deep dark
      beneath the Academy, where the bad dreams gather, and speaks to frightened visitors the way a good grown-up speaks
      at a bedroom door — softly, and certain that morning is coming.
    dialogue:
      root:
        text: Oh — a waking one, come all the way down here. Mind your step, and mind the dark, but don't mind the others
          overmuch; they're only bad dreams, and a bad dream can always be talked round. I'm the Lampkeeper, and the
          deep below is mine to watch. How can I help you?
        choices:
          - text: Why do nightmares gather here?
            next: the_dead
          - text: Explain the door behind the lamp.
            next: the_delve
          - text: I'll soothe the restless dreams. (Third year.)
            minLevel: 3
            action: accept_quest:rattling_bones
          - text: I'm ready for the deepest dark. (Fourth year.)
            minLevel: 4
            next: deep_exam
          - text: Sleep easy, Lampkeeper.
      the_dead:
        text: Bad dreams, every one — the sort every child carries to school. Long ago the nightmare demon Effiənoae went door
          to door seeding such dreams, and though it was swallowed whole an age past, the dreams it made were never once
          tucked in. They sank, the way dark things do, to the lowest place in the dream and pooled here, and still they
          call that old demon master out of habit. Quiet them and the Academy is grateful — 'reputation' keeps the
          score, kindly. They feel no real pain. Only relief, when they finally wake.
        choices:
          - text: I'll soothe the restless dreams.
            minLevel: 3
            action: accept_quest:rattling_bones
          - text: Explain the door behind the lamp.
            next: the_delve
          - text: Sleep easy, Lampkeeper.
      the_delve:
        text: Beyond the lamp-lit door the deep dreams its own shape — every party that goes down finds the halls rearranged,
          fresh and unmapped. 'dungeon enter academy_catacombs' begins your descent; 'dungeon leave' turns back without
          shame and returns you to my lamp. Bring company if you can — 'group invite <name>' before the door shares the
          dark and warms it. At the very bottom waits the Dean of Bad Dreams, the worst of Effiənoae's leavings, who has
          frightened off every child to reach him. He has never yet met one who wasn't afraid. You could be the first.
        choices:
          - text: I'm ready for the deepest dark.
            minLevel: 4
            next: deep_exam
          - text: Sleep easy, Lampkeeper.
      deep_exam:
        text: Then I'll trim the good wick. Go down, walk the shifting dark, and put the Dean of Bad Dreams to rest at the
          bottom of it. Do that and you'll have done every sleeping child here a kindness long overdue — and worn the
          nightlight badge that proves it. Mind the proctor-frights. They were always the stubborn sort.
        choices:
          - text: I accept the deepest dark.
            action: accept_quest:the_deep_lesson
          - text: I'll prepare first, Lampkeeper.
    quests:
      - rattling_bones
      - the_deep_lesson
    image: 7cfedf54eb58b2b5ab451704a0091eeeb1036a6ade3d201b4fbfef64dff205de.png
  restless_pupil:
    name: a running-late nightmare
    tier: weak
    level: 3
    category: aberration
    faction: restless_dead
    spawns:
      - room: ossuary_walk
    description: A flickering bad dream in the shape of a student who is late, always late — clutching an essay whose ink
      runs upward off the page and a satchel rotted to a smudge of worry. It hurries the dark at a panicked
      not-quite-run, muttering page counts that never add up, and rounds on anyone awake with the wild, affronted dread
      of a child who has forgotten something terribly important.
    respawnSeconds: 45
    drops:
      - itemId: marrow_dust
        chance: 0.7
      - itemId: grave_silk
        chance: 0.3
    image: d36b8a95501fe97efbefc3b00b682aab39ef08da491d02bccd1f9e2f3ac0d017.png
  restless_scholar:
    name: a red-ink nightmare
    tier: standard
    level: 3
    category: aberration
    faction: restless_dead
    spawns:
      - room: ossuary_walk
    description: A crumpled sheet of parchment animated by malevolent force, its surface crawling with aggressive red ink
      slashes and corrections that writhe and reshape themselves like living wounds. The paper curls and twists as it
      moves, bleeding crimson marks that drip upward in defiance of gravity, every inch covered in harsh, looping script
      that seems to scream failure.
    respawnSeconds: 60
    drops:
      - itemId: marrow_dust
        chance: 0.8
      - itemId: grave_silk
        chance: 0.5
    spells:
      red_ink:
        displayName: Red Ink
        message: "{mob} scores a red mark across your work for {damage} — the sting lingers!"
        roomMessage: "{mob} scores a red mark across {target}'s work for {damage}!"
        minDamage: 16
        maxDamage: 22
        statusEffectId: poison
        cooldownMs: 12000
    image: bb32deeda2913c61b1770d01b622bd2c69bd08bcd04c9edd527201099aec5ab7.png
  dean_of_the_dead:
    name: the Dean of Bad Dreams
    tier: boss
    level: 4
    category: aberration
    rareVariants: false
    faction: restless_dead
    spawns:
      - room: restless_repository
    description: The grandest and gloomiest of the bad dreams — a towering nightmare of a headmaster in robes of woven
      shadow-silk, crowned with a mortarboard whose tassel is a tiny whimpering ghost. The worst of what Effiənoae left
      behind, his disappointment has set over the long dark into something almost solid, and the gradebook fused to his
      left hand has never once, in any child's dream, recorded a pass.
    drops:
      - itemId: deans_hood
        chance: 1
      - itemId: grave_silk
        chance: 1
      - itemId: marrow_dust
        chance: 1
    spells:
      final_marking:
        displayName: Final Marking
        message: "{mob} strikes your name through with a blazing red quill for {damage}!"
        roomMessage: "{mob} strikes {target}'s name through with a blazing red quill for {damage}!"
        minDamage: 38
        maxDamage: 50
        cooldownMs: 10000
    image: 8d04d096f87f24da4e022ff2b87828c623225c1b505c2157f8c21b327da66686.png
  the_final_lesson:
    name: the Final Lesson
    tier: boss
    level: 5
    category: construct
    rareVariants: false
    faction: restless_dead
    spawns:
      - room: memento_mori_shrine
    description: An armored figure of compacted dust and steady candleflame kneeling at the shrine's heart, its helm bowed
      in permanent, patient apology. The Academy's oldest teaching assistant has exactly one lecture, delivers it
      flawlessly, and bows to the rare student who survives the syllabus. It will not rise until attacked. It always
      rises.
    hp: 600
    minDamage: 48
    maxDamage: 70
    armor: 6
    xpReward: 900
    respawnSeconds: 120
    drops:
      - itemId: humilitys_crown
        chance: 1
    image: fa4a301342d6c71dc9cc20e2e387a92512cd02ecb018cb0b3abfc7ba1d53c6c5.png
  gatekeeper_aurelion:
    name: Gatekeeper Aurelion
    role: dialog
    faction: auringold_academy
    spawns:
      - room: call_for_heroes
    description: An Alorae of quiet, prismatic radiance in a herald's tabard bearing the Academy orrery, light bending
      gently around him as though the morning itself were paying attention. He holds no weapon and needs none.
    dialogue:
      root:
        text: Welcome to the threshold, dreamer. Beyond these doors the waking world of Ambon is being made ready for you — and
          my whole office is knowing who is ready for it. Have you business with the Gates?
        choices:
          - text: I present my credentials for Commencement.
            action: turn_in_quest:commencement
          - text: What lies beyond the Gates?
            next: beyond
          - text: What do graduates do while they wait?
            next: waiting
          - text: Only paying respects, Gatekeeper.
      beyond:
        text: Everything, in the fullest sense — Ambon entire, waking and wide, every region 'areas' has whispered about. The
          Gates will open the moment the world is ready to receive this year's heroes; the Provost's proclamation says
          soon, and the Provost has never used that word carelessly. When they part, every graduate will feel it. You'll
          want your affairs banked and your blade enchanted, if you ask me. Nobody asks the Gatekeeper.
        choices:
          - text: What do graduates do while they wait?
            next: waiting
          - text: Thank you, Gatekeeper.
      waiting:
        text: They stay sharp, mostly. The notice board posts fresh chores each dawn — 'daily' and 'weekly' keep coin and
          experience flowing. The Bureau's 'bounty' work never runs dry, the catacombs reshuffle nightly for extra
          credit, and the dueling ring polishes technique politely. Some chase the deeds 'achievements' still keeps
          secret. And one or two simply sit with me and watch the light through the seam. That is also allowed.
        choices:
          - text: What lies beyond the Gates?
            next: beyond
          - text: Thank you, Gatekeeper.
    image: a9b472a62a98d62b95112092b7f735ee129606bec96acc52a53bf7ef8d75860a.png
  pilgrim_evenlight:
    name: Pilgrim Evenlight
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: lantern_cloister
    description: A Kitsarae in travel-worn robes the grey of dawn before color arrive. Her Arcanum journal hangs at her hip
      on a strap polished by handling, its pages leaking a faint glow at the seams, and her only staff is a lantern-pole
      — light, she will tell you, being the one thing she has ever aimed at anyone.
    dialogue:
      root:
        text: Welcome, dreamer. Sit — the lantern doesn't mind. I walk the gentle path, the way of the Akathavae, named for the
          god of stories, and this cloister is where the Academy keeps it. Ask me anything. It is a path made of
          questions.
        choices:
          - text: Krioshaeu entered this elective in my name.
            action: turn_in_quest:a_gentler_curriculum
          - text: What does the pledge ask of me?
            next: pledge
          - text: How does an Akathavae grow without fighting?
            next: illumination
          - text: What is the Arcanum?
            next: arcanum
          - text: What if I change my mind?
            next: renounce
          - text: Walk gently, Pilgrim.
      pledge:
        text: Everything, and nothing you will miss if the path is truly yours. 'pledge' at the shrine sets your calling aside —
          the dream keeps it safe — and closes your hands to violence entirely. No blade, no spell raised in anger, no
          second calling alongside. In exchange the world itself becomes your coursework — every room, every creature,
          every curiosity feeds you. The vow is free to take. It costs only what you thought you had to be.
        choices:
          - text: How does an Akathavae grow without fighting?
            next: illumination
          - text: What if I change my mind?
            next: renounce
          - text: Walk gently, Pilgrim.
      illumination:
        text: We illuminate. 'illuminate <creature>' is our whole art — you hold a being in the light until the journal has it,
          and the creature is no worse for the honor. A quick mind steadies the light, a warm presence eases your
          retreat when a subject objects, and a wise eye draws deeper learning from every page. Greater beings make
          greater pages; the first recording of anything is the sweetest, and returning later still teaches, but gently.
          Rooms inscribe themselves as you walk; curiosities, as you 'look' upon them.
        choices:
          - text: What is the Arcanum?
            next: arcanum
          - text: What does the pledge ask of me?
            next: pledge
          - text: Walk gently, Pilgrim.
      arcanum:
        text: Our journal, our level, our wardrobe, our memory. 'arcanum' reads the whole; 'arcanum rooms', 'arcanum mobs', and
          'arcanum items' open its chapters one at a time. And 'wardrobe' — the journal remembers every garment it has
          recorded and will conjure one for you to wear, so we arrive at every door already dressed for it. It is the
          path's one vanity. We have earned it by walking.
        choices:
          - text: How does an Akathavae grow without fighting?
            next: illumination
          - text: Walk gently, Pilgrim.
      renounce:
        text: Then the path lets you go, kindly. 'renounce' at any shrine restores the calling you set aside, exactly as you
          left it. The shrine asks a heavy tithe of gold for the unworking, and a full day of reflection before it will
          hear your pledge again — so choose like you mean it, both times. No one walks the gentle path well by being
          trapped on it.
        choices:
          - text: What does the pledge ask of me?
            next: pledge
          - text: Walk gently, Pilgrim.
    quests:
      - a_gentler_curriculum
    image: d2b91be0b84584ef4ede83481e4008c029d03f65b1a5147eb69c882d0bc60f35.png
  sorayangriel:
    name: Sorayangriel
    description: Where the pale sun should hang over the frozen settlement, a figure burns in its place — a tall Alorae
      woman caught forever in the act that made her the dawn. Living flame streams up from her in place of hair, her
      white-gold robe dissolves into fire at its hems, and beneath the burning her skin still holds the prismatic light
      of a herald. Sorrow and resolve sit together on her face; she never looks down at the cold below her, only up,
      into the newborn sun she is becoming. The air near her is the only warm air for miles.
    spawns:
      - room: kiriton_winter
    role: prop
    image: 5ae21a6ea2230228adca74c5fb3c5d5055cd4e3cffc8362fea4a9a20f3696a8f.png
  drengariae:
    name: The Drengariae
    description: At the cold edge of the yard the air holds a shape that will not settle — tall warriors of crystal and
      frostlight, many and then one and then many again, a single god-form splitting into a host and folding back
      together like overlapping spirits caught in ice and mist. Their long white hair streams in a wind no one else can
      feel, and their faces are noble, serene, and sorrowfully sure. This is the frozen guard that died holding the
      first long winter, keeping its post still — touch the cold stone and ask, and they will stand with you.
    spawns:
      - room: proving_yard
    role: prop
    image: 296a9a621bb680b1b3053c50b6001338deec08913ea9cadb23b9324986880d7d.png
  effienoae:
    name: Effienoae
    tier: standard
    level: 1
    description: A shadow creature of crystalline frost with green tinted skin and blackened fingertips, lean to the point
      of emaciation, bearing the sharp claws, fangs, and tusks of Ambon's wild beasts; sickly-pale, plagued by a
      constant nagging cough, his eyes glazed white like cataracts. He walks bent, slow, and limping — yet by night he
      can cross the whole of Ambon in a few hours, walking through shadows. He carries a torch that emits a black flame.
    image: 4c538ac5b83be30b80c0dd3762b275fde5723c21635aea16edf2439eaec6de25.png
    spawns:
      - room: nightmare_demon
    role: prop
    condition:
      time:
        - NIGHT
        - DUSK
  late_dream:
    name: a running late dream proctor
    tier: elite
    level: 4
    category: aberration
    faction: restless_dead
    spawns:
      - room: restless_repository
    description: A sharp-eyed figure in rumpled scholarly robes rushes forward with frantic urgency, clutching a stack of
      parchment scrolls that trail wisps of shimmering dream-smoke, spectacles askew on a furrowed brow. An ink-stained
      sash of authority marks their status despite their disheveled appearance, and their feet barely seem to touch the
      ground as they hurry with unnatural, dreamlike speed.
    drops:
      - itemId: marrow_dust
        chance: 1
      - itemId: grave_silk
        chance: 0.6
    image: 72ee5b51fc9700d6dfed1beba4c83ac5cdc6fa5b08d6442b2f2322b6337c4bac.png
