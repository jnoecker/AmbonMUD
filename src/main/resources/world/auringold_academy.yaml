mobs:
  krioshaeu:
    name: Krioshaeu
    role: quest_giver
    spawns:
      - room: krioshaeu_cabin
    description: "A Lustriae woman with salt-and-pepper hair — the only faerie who looks aged — pale iridescent skin, dark
      eyes, and softly rounded ears. Beautiful but slightly off. Her features have a faerie delicacy but there is
      something wild and untamed about her. Her clothing is colorful and deliberately mismatched — patchwork silks,
      embroidered scarves in clashing patterns, a wide-brimmed hat adorned with flowers, feathers, and small dangling
      charms. She looks like a beloved eccentric aunt who dresses however she pleases. Her most striking feature: large,
      strong black raven wings spreading from her back — not the translucent, diaphanous wings of the Lustriae but
      solid, dark, powerful feathered wings. She sits in a cozy cabin interior — a roaring fire, a steaming teapot, two
      cups on the table. One hand holds a teacup. She is smiling warmly, as if the viewer just arrived and she's been
      expecting them. Her dark eyes are kind but ancient — they have seen everyone's last moment and they are not
      afraid. Death dressed like a carnival, waiting with tea."
    image: 06f7c8e197484afd462d95d7eaed442b50a84e0bc943b07ff637f6be699e17c3.png
    dialogue:
      root:
        text: Welcome, little dreamer. You died — don't fret, you did it beautifully — and I have chosen you to be reborn
          as a hero of Ambon. Beyond my door drifts the dream where heroes are made. The Naraxian Akathavae, god of
          stories, waits in their caravan among the stars to show you everything that came before you. Visit them first.
        choices:
          - text: I accept your charge.
            action: accept_quest:auringold_visit_naraxian
          - text: What should I know before I go?
            next: basics
          - text: What is this place?
            next: place
          - text: Maybe later.
      basics:
        text: Speak your will plainly and the dream obeys. 'look' shows where you stand, the compass words — n, s, e, w,
          and sometimes u and d — carry you, 'talk <someone>' begins a conversation such as this, and the numbered
          choices answer it. 'quests' remembers every promise you make, and 'help' lists every word the dream
          understands. My card on the tea cart holds the rest, whenever you care to 'read card'.
        choices:
          - text: I accept your charge.
            action: accept_quest:auringold_visit_naraxian
          - text: What is this place?
            next: place
          - text: Thank you, Krioshaeu.
      place:
        text: The realm between life and death — my parlor, the campus of the Auringold Academy, and the dream itself,
          all at once. Here the reborn learn to be heroes before the great gates open on Ambon proper. The tour of
          memories beyond my door will teach you the world; the campus at its end will teach you everything else. Take
          tea. Take your time. Time is the one thing I always have.
        choices:
          - text: What should I know before I go?
            next: basics
          - text: I accept your charge.
            action: accept_quest:auringold_visit_naraxian
          - text: Thank you, Krioshaeu.
    quests:
      - auringold_visit_naraxian
  naraxian_akathavae:
    name: Naraxian Akathavae
    spawns:
      - room: fortune_teller_parlor
    description: A wrinkled old woman dressed in colorful minstrel garb with an extremely ornate masquerade-style mask
      covering most of their face. They hold an ancient tome that crackles with magic in their left hand, and a flaming
      phoenix feather quill in their right. They have an ornately carved violin floating next to them, and wear a tall,
      overly complicated hat.
    role: quest_giver
    image: 186fea09fb5576e300202ce45d8561a2704933369e3966777acb5241bdc190df.png
    quests:
      - auringold_visit_naraxian
    dialogue:
      root:
        text: Welcome. I've been waiting a long time to see you again. Or is it for the first time? I suppose it depends how you
          look at it! In any case, a fine adventurer such as yourself deserves a matching hat!
        choices:
          - text: Thank you.
            action: turn_in_quest:auringold_visit_naraxian
  maelsang:
    name: A Dream of Maelsang
    spawns:
      - room: tempest_between_worlds
    description: A tempest given form — a colossal figure emerging from or composed of a raging ocean storm. His body is
      made of churning seawater, dark clouds, and crackling lightning. Waves tower around him. His face is barely
      defined in the storm — just the suggestion of features in the roiling clouds, eyes of lightning, a mouth that is a
      whirlpool. He is in motion — fleeing westward across the ocean, and his passage is destruction. Behind him, ships
      are shattered, waves crash impossibly high, waterspouts spiral into the sky. The ocean itself is being torn apart
      by his panicked retreat. In the far background, the coastline of Ambon is barely visible through the storm. He is
      not attacking — he is running, and the devastation is collateral. A god so afraid of what's behind him that he's
      destroying everything in his path without even noticing.
    image: a824a778961d83d35e6521579c89060b5b4b84f91f1b8bfbebfec2d329821f67.png
    tier: boss
    category: elemental
    level: 1
    drops:
      - itemId: aura_tempest
        chance: 1
  tessikar:
    name: Tessikar the Springwright
    spawns:
      - room: springwright_workshop
    description: A dwarf — short, stocky, broad-shouldered — sitting at a cluttered workbench in a mountain workshop. One
      eye is replaced by a clockwork mechanism that whirs and focuses with mechanical precision, its lens glowing
      faintly amber. One arm is entirely mechanical — brass and copper gears, pistons, and articulated fingers that move
      with impossible delicacy as they work on a small clockwork creation on the bench. His organic hand holds a tiny
      tool. The workshop is magnificent chaos — gears, springs, crystals, half-finished mechanisms, blueprints, tools of
      every kind covering every surface. Crystals from the Lithae mines glow in racks along the walls, some already
      integrated into mechanical housings. Through the workshop window, the city of Tessikon is visible far below on the
      mountainside — his creation, grown from one workshop into a civilization. His expression is pure concentration —
      the look of someone who has forgotten to eat because this particular gear ratio is almost perfect. A god who would
      rather tinker than rule.
    image: c7c99f07b36e64c6d41b4652abd08e6a16b2ba86bf09966281d7cfdcb1c44a47.png
    role: prop
  kvarcgagap:
    name: Kvarcgagap the Shining Quartz Void
    spawns:
      - room: void_below_mountain
    role: dialog
    description: "An ancient, primordial being from outside of Ambon. God of bedrock, caverns, precious gems and crystals,
      metal ores, and everything glittering under the ground. A force of nature, he most often takes the form of a
      shimmering liquid the consistency of quicksilver, but shimmering like liquid opal. In this form, he travels freely
      through solid stone, sometimes as a trickle and other times as a great deluge. Sometimes leaving no trail and
      others carving massive underground caverns and seeding the deep places with crystals and metals. "
    image: ea5db886e78b01c943b894959523e21bfcc192ce8eeaca26949a8887aeb5ae70.png
  ambon_auringold_academy_mob6:
    name: Shade of Malkuth
    spawns:
      - room: clockwork_battle
    description: A pale, sharp-featured specter dressed in the tattered remnants of absurdly overdone royal regalia —
      stacked chains of office, rings crowding every flickering finger, a jewel-crusted crown tilted over dark hair —
      flickers between solid and incorporeal against the Academy's silver-lit dark, its form never quite settling into
      either world. One hand clutches an obsidian dagger raised aloft while fragments of silk and embroidered fur cling
      to its shadowed silhouette like the dissolving memory of stolen grandeur, its cold gaze burning with a possessive
      hunger that seems less like malice and more like desperate, bitter refusal to let go.
    image: 23027b226ea97ac67e4e905335e943bdf05009d6e92babc7d68717d0a0c3c56e.png
    level: 2
    tier: boss
    toughness: 1
    hpMult: 1.25
    dmgMult: 1.25
    xpMult: 1.25
    goldMult: 1.25
    drops:
