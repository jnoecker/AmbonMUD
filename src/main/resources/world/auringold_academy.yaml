  necrambon:
    terrain: urban
    title: Necrambon
    description: >-
      A walled Archae city east of the mountains, dominated by a large temple to the Creator. High, thick walls with few
      gates. The architecture is austere and conservative — functional stone buildings, no ornamentation, no concession
      to the newer magical aesthetics of post-ascension Ambon. The temple is the largest structure, its spire visible
      for miles. The city feels deliberately isolated — no sprawling suburbs, no welcoming market districts outside the
      walls. Roads approach but the gates are narrow.

      The city has been destroyed. The walls are breached, the temple damaged. The streets are empty of the living. An
      oppressive, grey atmosphere — the light seems dimmer here, the air colder. Signs of Kirot's occupation everywhere
      — dark stains on the stones, an unnatural stillness. This is a place where terrible things happened and the land
      remembers. The architecture is intact but lifeless — a city that died with its people.

      Beneath the broken temple, a stair of black iron descends to the Academy's catacombs — the one part of this dead
      city that is still, in its way, alive.
    image: e968c0831a4836afc16ba4e6715dd88dccbd95616b96c1ada9b900d7bc7d89e2.jpg
    exits:
      n: yaleron
      d: catacombs_landing
      s: dream_hotel
  resistance_camp:
    terrain: mountain
    title: A Resistance Camp in the Mountains
    description: Rough-hewn tents of grey and brown canvas cling to the windswept ledges of a jagged mountain pass, their
      guide-ropes straining against the biting alpine wind, while cookfires glow like embers in the cold dusk below
      peaks dusted with snow. Banners of a dozen different orders and factions hang side by side between the rocks, and
      armored figures move purposefully among stacked crates and weapon racks, their breath misting in the thin air as
      the sprawling walled city of Yaleron looms far below in the valley's shadow.
    image: a0bb874f3ccbb2b71a5c616b1777301e81e878ec645bf217e3471f91a7201ed1.jpg
    exits:
      w: creeping_darkness
      s: yaleron
    musicBox:
      title: Elustriaine- Bracelets of Silver Fire
      file: 83be4844cd5186289b7ea11ca406b0ad8506c0d8e90cb3b3d2b66d61f6063f8d.mp3
      durationSeconds: 274
      artist: TRADITIONAL
      description: A Martial Ballad in Celtic Folk Style about Elustriaine the Faerie Queen
      image: 1294b43c35548ce85d4fc3c9b78d7937fb53d0fcce7b8c6f70392412347c6901.png
      lyrics:
        - When Kirot’s shadow came
        - You stood in the ash
        - Philosopher hands
        - Turned iron in a flash
        - Courts held their breath
        - At your quiet stare
        - Moonbeam hair
        - And a warlord’s glare
        - You count the next three moves
        - Before they breathe
