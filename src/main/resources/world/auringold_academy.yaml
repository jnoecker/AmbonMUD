    tier: weak
    level: 1
    description: A tatter of absolute dark drifts where the rot runs thickest — not a shadow cast by something, but an
      absence with edges, cold pouring off it in a slow tide. For an instant it holds the shape of a hand drawing a
      thread loose from the world; then it forgets the shape and is only nothing again. It is the thinnest reach of
      Braelaatum, the silence beyond the veil, leaking through where the war wore the world raw.
    category: elemental
    spawns:
