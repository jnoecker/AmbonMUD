      - room: turbulent_waters
    image: 65dc0bea5548fda08505550546665f8423f410921b5fc9b16cde0afe03e7d74a.png
    drops:
      - itemId: kelp
        chance: 0.5
  kirot_aethiryn:
    name: Shade Kirot Aethiryn
    tier: elite
    level: 3
    description: An Alorae who has fallen — tall, with the frame of a divine being, but corrupted. Where a healthy Alorae
      radiates prismatic light, Kirot radiates a sickly darkness. His skin is pale and cracked, with veins of black
      energy visible beneath the surface. His eyes burn with cold green light. His vestments were once white and gold
      but are now stained, tattered, and rewoven with dark threads. He stands in a blighted landscape — dead trees, grey
      earth, withered crops — and from his outstretched hands, tendrils of dark magic reach into the ground, pulling
      skeletal and rotting forms upward. The dead claw their way up around him. His expression is calm, methodical,
      clinical — this is not madness, it is craft.
    spawns:
      - room: creeping_darkness
    image: 7342f15083fe82f02ea536995aac566b512ea3de9377a9b1c0ed6a7d9b8fe20e.png
  astriel:
    name: Astriel
    tier: standard
    level: 1
    description: A tall Alorae robed in white and gold, his skin shedding a gentle prismatic light — not the blinding glory
      of his kind, but something patient and warm. His hands stay open over the rows before him, and where the light
      falls the crops thicken, flower, and fruit before your eyes. This is Astriel, the harvest-god, at the only work he
      ever wanted — blessing the land so that no one goes hungry.
    image: eb5d7ef8b73570f181a24eb4561696726baf3b6fad3931178ce70610a3f3916e.png
    spawns:
      - room: heralds_of_creation
  ambuoroko:
    name: Ambuoroko
    tier: standard
    level: 1
    description: A hollow cloak of opalescent white drifts here, its hem dissolving into moonlit mist. Silver filigree,
      pearl chains, and crescent embroidery glimmer across the ceremonial mantle, though no body can be seen within it.
      Beneath the deep hood hang only shadow, pale vapor, and two small blue lights like distant stars. A twisted
      ivory-wood staff floats at its side, crowned by a crystal sphere swirling with tiny galaxies.
    image: fe3f5ce280378c25364873f16a05c83de8d80e93b51aa77ad1158f942697bf42.png
    spawns:
      - room: yaleron
    role: prop
  elustriaine:
    name: Elustriaine
    tier: standard
    level: 1
    description: A smaller, younger-looking version of Aineroia — the same Lustriae features, translucent diaphanous wings,
      dark hair, dark eyes, pale mother-of-pearl skin - but more compact, fiercer, with an edge of wildness. She wears
      layered silks in neon pastel tones — bright and cheery — draped and wrapped in a traveling style, with coin
      bracelets on both wrists that catch the light. The bracelets are prominent — scale-like or coin-like metal pieces
      that jingle with movement. A small crossbow is slung at her hip. Her dark hair is wild, adorned with small coins
      and silk ribbons. She has rainbow, diaphanous wings extending from her back like enormous stained glass windows
      that seem to emit an otherworldly light.
    image: d3b4971d6b0c9e63636debab14dbb589cfb277250d593c58bed4d9bf8c8dfbed.png
    spawns:
      - room: resistance_camp
    role: prop
  geode_fragment:
    name: an animated geode fragment
    tier: standard
    level: 2
    description: A fist-sized chunk of rough grey stone shambles forward on tiny crystalline legs, its cracked exterior
      splitting open to reveal a jagged interior of glittering purple amethyst that catches the light with an eerie,
      pulsing shimmer.
    image: 4d97001049c36770387bd9aef568fd28488bc3cc2ce4fb1bf99b240fffd43d7a.png
