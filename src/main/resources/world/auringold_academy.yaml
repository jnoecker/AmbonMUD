    image: 6a3e6e05096569627357c5ca7dc0028699dcb5fb0cc906d028c2beadbd645778.jpg
    video: fe44ecfb26767fb79a5ef56ca7864215435233b8b64f8ab113163354cf553c37.mp4
    videoText: >-
      A car-sized clockwork village of rich walnut, polished brass, painted porcelain, and glowing dreamglass — all
      steep gabled roofs, tiny shuttered windows, bell towers, little bridges, and turning waterwheels, like a Bavarian
      cuckoo clock grown into a town.


      At rest it glows softly in warm lamplight. Then the works wake: gears turn, brass cylinders rotate behind glass,
      shutters swing open, and tiny doors pop wide as clockwork villagers ride out on hidden rails. Miniature musicians
      glide into place — fiddlers bowing, a drummer tapping, a porcelain singer leaning from a balcony — and the whole
      little town seems caught mid-festival, singing from its windows.
    music: 8b6472392f3667f3d1a96a19c34c6887187e3ab11ca4451e3152c6b9a560e366.mp3
  twilight_salon:
    terrain: inside
    title: The Twilight Salon
    description: A boudoir of rose-gold mirrors and hovering scissor-birds, perfumed with rosewater and the faint ozone of
      transformation. Madame Papillon — a Kitsarae whose own face is a rotating exhibition — circles each client like a
      sculptor judging marble, while the mirrors politely show not what you are but what you are considering.
      Reinvention is the house specialty ('talk stylist'), with the menu of services lettered in gold on the central
      mirror ('read mirror').
    stylist: true
    features:
      service_mirror:
        type: SIGN
        displayName: a rose-gold mirror lettered with the menu of services
        keyword: mirror
        text: THE MENU OF BECOMING. 'stylist' lists every race Madame Papillon can make of you and her fee for the deeper work;
          'changerace <race>' commits to it. Gentler adjustments are free of charge anywhere — 'gender <choice>' is
          yours to declare, 'describe <words>' rewrites how others see you, 'title' wears your earned honors, and
          'sprite list' then 'sprite set <number>' changes the figure browser-dreamers see crossing the canvas. The
          mirrors never judge. Madame Papillon judges only the indecisive.
    image: 47f08775fb1e93e6c019a258626c9878f3e65eb3c90f3c3514ae8a193b696fd9.jpg
    exits:
      e: bursar_bank
      s: hall_of_records
  catacombs_landing:
    terrain: underground
    title: The Long Way Down
    description: A spiral stair delivers you into cool darkness that smells of old paper and outgrown fears, where the dead
      city's foundations rest on vaults of honeycombed stone — the deepest, lowest place in the whole dream, where bad
      dreams gather the way water finds the bottom of a well. Lantern niches hold candles that relight themselves out of
      kindness, and the walls bear generations of children's chalk drawings, the oldest a wobbly crayon sun beneath the
      words IT GETS LIGHT AGAIN. A heavy iron notice is bolted beside the descending arch ('read notice') — the Academy
      does not waste iron on idle warnings.
    exits:
      u: necrambon
      n: ossuary_walk
      s: riddle_gallery
    features:
      iron_notice:
        type: SIGN
        displayName: an iron notice bolted to the archway
        keyword: notice
        text: NOTICE TO UNDERCLASSMEN. Beyond this arch drift the Bad Dreams — nightmares the demon Effiənoae seeded long ago
          and never came back to tuck in. They are a faction, with memory and grievance; soothe them to rest and the
          Academy's regard for you grows, as 'reputation' will attest. They are also third-year material at the least —
          'consider' every one of them, travel with a 'group' if you can find one, and keep a draught at your belt. The
          Lampkeeper in the chapel offers proper coursework for this floor.
    image: fdb5e4910112fab0e955b03e95af97940cdd63e6a39c42bba8ac982327f6a421.jpg
    ambient: 3dcf6ef3098cbc062225d5c555290d690bcd1195f7bf35f06e41cb9fab41b9d1.mp3
  ossuary_walk:
    terrain: underground
    title: The Long Dark Hall
    description: A long gallery shelved with everything children are afraid of losing — unfinished homework filed like
      scrolls, report cards face-down, single mittens, baby teeth in little jars, the whole arrangement somehow more
      lost-and-found than frightening. Running-late nightmares hurry between the niches clutching essays that never end,
      and red-ink nightmares scold the dark in voices like turning pages. They do not care to be woken — expect every
      one of them to object to your presence, loudly and in a sulk.
    exits:
      s: catacombs_landing
      n: catacomb_chapel
    image: 5af1411edce5ad107ece892f3b23b7b099564dabc3d7f65640ca0d531496d750.jpg
  catacomb_chapel:
    terrain: underground
    title: The Chapel of the Last Lamp
    description: A vaulted undercroft chapel whose altar holds the last warm light in the deep, lovingly tended by the
      Lampkeeper — a round, gentle keeper who long ago stopped being afraid of the dark and stayed to help others do the
      same. Votive candles burn in the colors of every god, and behind the altar a sealed door of black iron breathes
      slowly, beyond which the deep dark rearranges itself nightly into fresh frights. The Lampkeeper administers the
      deep coursework ('talk lampkeeper'); the door's workings are posted beside it ('read door-plate').
    exits:
      s: ossuary_walk
      e: memento_mori_shrine
      w: restless_repository
    features:
      door_plate:
        type: SIGN
        displayName: a verdigrised plate beside the dark door
        keyword: door-plate
        text: THE DEEPEST DARK. Beyond this door the deep reshuffles itself into a fresh labyrinth for every class that enters —
          no two descents alike. 'dungeon enter academy_catacombs' begins your descent; 'dungeon leave' turns back and
          returns you here. The deep suits students of the third year and above, and rewards those who bring friends —
          'group invite <name>' before entering shares both the dark and the courage. The deepest chamber holds the Dean
          of Bad Dreams, the worst of what Effiənoae left behind.
    image: e0c15b63152f00787f91fbe4e2220281d314b91623961021927794ffc05ccce8.jpg
  memento_mori_shrine:
    terrain: underground
    title: The Memento Mori Shrine
    description: A small round shrine of black marble and white candles, kept scrupulously clean by no visible hand. At its
      center kneels an armored figure of dust and candleflame — the Final Lesson, the Academy's oldest teaching
      assistant — whose single duty is to demonstrate, gently and thoroughly, what losing feels like. The shrine's
      tablet is the only required reading ('read tablet'); the Lesson itself is strictly elective, and it will not
      strike first.
    exits:
      w: catacomb_chapel
    features:
      shrine_tablet:
        type: SIGN
        displayName: a black marble tablet ringed in candleflame
        keyword: tablet
        text: ON LOSING, AN ELECTIVE. Death in Ambon is a detour, not an ending — the fallen wake in Krioshaeu's sanctum, mended
          enough to be embarrassed, and 'depart' returns them through the spirit gate to where they fell. Nothing
          carried is lost. Students who wish to rehearse this mercy may 'kill lesson' — the Final Lesson is very good at
          its job, accepts no grudge, and bows to the rare student who bests it. Set 'wimpy off' first if you truly mean
          to see the end of the demonstration.
    image: 9b019d0ed71f6e1ab78f768db90baaca3cc2fc160aad04f8c7f5db44998cd511.jpg
  restless_repository:
    terrain: underground
    title: The Waiting Dark
    description: A sealed annex behind the chapel where the deep keeps its frights between descents — proctor-frights
      standing in patient rows, and the Dean of Bad Dreams at his desk, grading papers no child has dreamed yet. The
      Lampkeeper opens it to the waking only rarely, and regrets it almost always. It is very, very quiet.
    exits:
      e: catacomb_chapel
    image: f3b16beddf9f30c67ba7cd114e368ef4c75e0895d15d6c07589125c8caf6852a.jpg
