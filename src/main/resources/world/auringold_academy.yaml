      - itemId: stone_fragments
        chance: 0.5
    role: prop
  lithae_miner_copy:
    name: Sleeping Lithae Wizard
    tier: standard
    level: 3
    description: A stocky crystalline figure in flowing robes stands utterly motionless, its obsidian-black faceted body
      frozen mid-gesture with one angular arm outstretched, a gnarled staff clutched in its geometric fingers. Pale
      mineral dust has settled across the dark, rough-hewn planes of its form, and faint geometric runes etched into its
      robes catch the light with a dull, dormant gleam.
    spawns:
      - room: sleeping_stone_statues
    image: 5806ec7f7f01c43113182de20d256ee69a327bafb7e3c31875c339748a3c92fa.png
    drops:
      - itemId: stone_fragments
        chance: 0.5
    role: prop
  kitsarae_squirrel:
    name: a squirrel actor
    description: A small, bright-eyed squirrel stands upright on its hind legs, draped in a tiny tattered cape and clutching
      a miniature wooden prop sword, its bushy tail curled dramatically behind it as though mid-performance. Its dark,
      almost knowing gaze flickers with an uncanny spark of awareness, suggesting something just beneath the surface of
      a simple creature stirring to life.
    spawns:
      - room: kitsarae_mountain_basin
    tier: weak
    image: 17d2322c89f0cd8369bd27e9eba1a50de98e3f0c4fd42d7d4c37d490b72ac2ab.png
  beaver_storyteller:
    name: a beaver storyteller
    tier: standard
    level: 1
    description: A plump, amber-furred rodent sits upright on a mossy log, its broad flat tail spread beneath it like a
      cushion, gesturing animatedly with small nimble paws as it speaks. Bright, intelligent eyes gleam beneath a pair
      of tiny spectacles perched crookedly on its whiskered snout, and a worn leather satchel bulging with rolled
      parchments hangs loosely across its round chest.
    spawns:
      - room: kitsarae_mountain_basin
    image: 49d66bdba0609875f4e432ba7a7ceea5c4bc748f8fa125ed9d922281cb54d297.png
  rabbit_astronomer:
    name: a rabbit astronomer
    tier: standard
    level: 1
    description: A small, brown-furred rabbit sits upright on its haunches, wearing a tiny velvet coat adorned with star
      charts and a miniature brass telescope strapped across its back. Its wide, intelligent eyes peer skyward through a
      pair of oversized spectacles perched crookedly on its twitching nose.
    spawns:
      - room: kitsarae_mountain_basin
    image: 58c76099aad82426c61c90a5a510424428b948b8f8eb9d29e6b71c5939c911c9.png
  provost_lumina:
    name: Provost Enid Maykoyla
    role: quest_giver
    faction: auringold_academy
    spawns:
      - room: academy_quad
    description: An opalescent humanoid octopus lounges on the throne, her translucent body aglow in pearly blues, violets,
      and gold. She wears academic robes that are excessively ostentatious.
    dialogue:
      root:
        text: Ah — the new arrival. Krioshaeu speaks well of you, which she does of everyone, and the Gates will speak honestly
          of you, which is rather the point of this place. I am Provost of the Auringold Academy, and my coursework will
          make Ambon make sense. Shall we enroll you properly?
        choices:
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: How does coursework actually work?
            next: coursework
          - text: Tell me about the Academy.
            next: academy
          - text: I am ready to graduate. (Fourth year and beyond.)
            minLevel: 4
            next: candidacy
          - text: Just passing through, Provost.
      coursework:
        text: Each wing of the campus keeps an instructor, and each instructor keeps lessons. 'quests' lists every course you've
          accepted with its remaining work, 'quest info <name>' reads the syllabus, and when the work is done you return
          to your instructor and 'quest turnin <name>' — or simply say so in conversation, as you are doing now. Finish
          a wing and its instructor will pin a badge on you. Collect all eight badges and the Gates themselves will want
          a word.
        choices:
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: Tell me about the Academy.
            next: academy
          - text: Thank you, Provost.
      academy:
        text: Auringold exists in the dreams of children, where the wall between realms wears thinnest — and the campus is the
          dream itself. This quad is merely its threshold; every wing keeps a station along the tour of memories you are
          about to walk. The drill yard waits in the clockwork clearing, commerce beneath Lyrasael's harbor, the gentle
          arts at the World Healer's greenhouse, the forge at Tessikon's edge, the catacombs beneath fallen Necrambon,
          and the Gates at the end of everything. Walk the dream and you will have walked your entire curriculum. The
          notice board beside me posts the daily work; 'areas' will remind you where in the world you are, and 'time'
          when.
        choices:
          - text: How does coursework actually work?
            next: coursework
          - text: Must every hero fight, Provost?
            next: gentle_path
          - text: Enroll me. Where do I start?
            action: accept_quest:school_orientation
          - text: Thank you, Provost.
      gentle_path:
        text: No — and the Academy is quietly proudest of the ones who don't. The Akathavae walk a pacifist's road. They pledge
          away their blades entirely and level by illuminating the world instead — recording its rooms, its creatures,
          and its treasures in a journal called the Arcanum. Pilgrim Evenlight keeps their lantern cloister behind the
          fortune teller's shelves at the dream's very beginning, and Krioshaeu herself enrolls the curious. Hearing
          never hurt anyone. That, I believe, is rather their point.
        choices:
          - text: How does coursework actually work?
            next: coursework
          - text: Thank you, Provost.
      candidacy:
        text: Then say it formally, candidate, and I shall enter your name in the book. The rite of Commencement asks only what
          the lectern at the Gates already told you — all eight wing badges in hand, presented to Gatekeeper Aurelion.
          The Gates know their own.
        choices:
          - text: I declare my candidacy for Commencement.
            action: unlock_flag:commencement_candidate
            next: candidacy_sealed
          - text: Not yet. I have badges to earn.
      candidacy_sealed:
        text: Witnessed and entered. Take the rite when your satchel holds all eight badges — accept it from me here, then carry
          your credentials to the Gatekeeper. And do straighten your robes first. The statues on the approach are
          watching, and they gossip.
        choices:
          - text: I accept the rite of Commencement.
            action: accept_quest:commencement
          - text: I will return with the badges.
    quests:
      - school_orientation
      - commencement
    image: 72ef1bb741ae58a8e6fc200db091186025d912b9bcb5a90f96d2efdde0f785b5.png
  greeter_pip:
    name: Pip the Welcome Wisp
    role: dialog
    faction: auringold_academy
    category: elemental
    spawns:
      - room: orientation_hall
    description: A fist-sized wisp of lantern-light wearing a graduation cap several sizes too small, bobbing at exactly the
      height of a friendly handshake. It glows brighter when asked questions, dims apologetically when it doesn't know
      an answer, and trails a faint ribbon of light shaped like a checklist. The cap, it will tell anyone, was earned.
    dialogue:
      root:
        text: Hello hello HELLO! New student! I'm Pip — orientation is ME. Ask me anything. Ask me everything! I glow either
          way.
        choices:
          - text: The Provost sent me to report for orientation.
            action: turn_in_quest:school_orientation
          - text: How do I make the game comfortable to read?
            next: comfort
          - text: What should the browser folk know?
            next: browser
          - text: What little conveniences am I missing?
            next: conveniences
          - text: I'm only visiting — can I keep this character?
            next: claiming
          - text: That's everything, Pip.
      comfort:
        text: Comfort first, always! 'ansi on' and 'ansi off' turn the colors up or away, and 'colors' shows the whole palette
          so you can judge it. If a screen reader speaks the dream aloud for you, 'screenreader on' makes every message
          read beautifully. 'clear' wipes the slate when the scroll gets long. And 'help' — 'help' is always the answer
          when you forget the question.
        choices:
          - text: What little conveniences am I missing?
            next: conveniences
          - text: What should the browser folk know?
            next: browser
          - text: Thanks, Pip!
      conveniences:
        text: The dream will do your chores if you ask! 'autoloot on' pockets the spoils of every victory before they touch the
          ground. 'autopeek on' whispers what waits in the next room before you walk in. 'wimpy 30' makes your feet flee
          danger on their own. 'quickheal' and 'quickmana' drink the best bottle you carry without rummaging. Set them
          once and forget them forever — that's the Academy way.
        choices:
          - text: How do I make the game comfortable to read?
            next: comfort
          - text: Thanks, Pip!
      browser:
        text: Ohh, the lucky ones with the painted dream! Your screen's panels mirror every command — character sheet,
          inventory, quests, map, crafting, all of it, live. Ctrl+K opens the command palette when you forget a word.
          The atlas fills in as you explore. The action bar holds your abilities for one-tap casting. And if you ever
          miss the old ways, the terminal overlay shows the dream as pure text, like the elders played it.
        choices:
          - text: What little conveniences am I missing?
            next: conveniences
          - text: Thanks, Pip!
      claiming:
        text: Guest dreamers fade when they leave unless they claim themselves! 'claim <password>' makes this very character
          permanently yours — name, progress, pockets and all. Do it before you wake, or I'll have to greet you ALL OVER
          AGAIN, and one of us will find that embarrassing.
        choices:
          - text: Thanks, Pip!
    image: ed8a860bf919435b966f91cd2cc21da8a1b00431238cadbb80fbaa9bb3abc8da.png
  drillmaster_brasswick:
    name: Drillmaster Brasswick
    role: quest_giver
    faction: auringold_academy
    category: construct
    spawns:
      - room: proving_yard
    description: A barrel-chested clockwork sergeant in a dented breastplate polished to parade shine, steam curling from
      the hinge of his jaw whenever he is about to be loud, which is always. One glass eye ticks as it ranges across the
      yard grading posture, and a whistle of polished bone hangs from his neck on a medal ribbon. Somewhere in his
      chest, a metronome keeps the cadence of ten thousand drills.
    dialogue:
      root:
        text: FRESH RECRUIT ON THE YARD! Outstanding. I am Drillmaster Brasswick and I have never lost a student I liked. We
          start with dummies, we end with things that hit back, and somewhere in between you become dangerous. Questions
          first or bruises first?
        choices:
          - text: Bruises. Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: I'm past dummies — what's next? (Second year.)
            minLevel: 2
            next: second_lesson
          - text: Teach me the fundamentals of a fight.
            next: fundamentals
          - text: What about the arts of my calling?
            next: callings
          - text: How do I not die, Drillmaster?
            next: survival
          - text: Carry on, Drillmaster.
      fundamentals:
        text: Rule one — 'consider' before you commit. The dream tells you true odds and only fools ignore them. Rule two —
          'kill <foe>' starts the bout and your arm keeps its own rhythm, so spend your attention on judgment. Rule
          three — 'cast <ability> <foe>' is how you spend mana to end fights faster, 'spells' lists your arts and
          'effects' whatever's currently riding you, blessing or curse. Rule four — the fallen drop spoils. 'get' them
          or set 'autoloot on' and never stoop again.
        choices:
          - text: What about the arts of my calling?
            next: callings
          - text: How do I not die, Drillmaster?
            next: survival
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      callings:
        text: Every calling kills differently, recruit. Reach your second year, then visit Doctor Reinheart in the tavern or
          Uehma in the library — 'train' shows what they can wake in you, 'train learn <ability>' commits it. Your first
          art costs nothing but the asking. Speak your calling and I'll name the art to ask for.
        choices:
          - text: I am a Bulwark.
            requiredClass: bulwark
            next: calling_bulwark
          - text: I am an Arcanist.
            requiredClass: arcanist
            next: calling_arcanist
          - text: I walk the Veil.
            requiredClass: veil
            next: calling_veil
          - text: I am a Herald.
            requiredClass: herald
            next: calling_herald
          - text: I am a Scrollwright.
            requiredClass: scrollwright
            next: calling_scrollwright
          - text: I am a Songweaver.
            requiredClass: songweaver
            next: calling_songweaver
      calling_bulwark:
        text: A wall that hits back — my favorite kind of student. Ask for Hammer Strike at second year and bring it down with
          'cast hammer strike <foe>'. Third year offers Shield Bash and a field-medic's trick called Triage Wounds —
          'cast triage wounds' patches you mid-melee. You'll hold every line worth holding.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_arcanist:
        text: Glass cannon, emphasis on cannon. Arcane Bolt at second year — 'cast arcane bolt <foe>' and watch the math happen.
          Third year brings Arcane Blast for crowds and Arcane Intuition to sharpen your mind before a duel. Stand
          behind the Bulwarks. They love it.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_veil:
        text: I won't pretend I see you clearly even now, and that's the compliment. Shadow Strike at second year — 'cast shadow
          strike <foe>' from anywhere the light isn't. Third year offers a Poison Dart that keeps hurting after you've
          stopped, and Scimitar Slash for when subtlety is finished. 'effects' will show your poisons doing their
          patient work.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_herald:
        text: The dream listens when you petition, Herald. Smite at second year — 'cast smite <foe>' and let your patron argue
          for you. Third year grants Minor Heal — 'cast minor heal' mends you mid-fight — and a Prayer of Fortification
          before hard lessons. Healers outlive everyone. It's the entire trick.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_scrollwright:
        text: Ah, Tessikar's heirs. Spring Shot at second year — 'cast springshot <foe>', undignified and effective. But your
          third year is the one that matters — Summon Clockwork Alligator. 'cast summon clockwork alligator' builds you
          a companion; 'pet' reports its health, 'pet skills' its arts, 'pet <skill>' commands one in battle, 'pet name
          <name>' christens it and 'pet dismiss' sends it to sleep. Rebuild it as you grow — they come back stronger.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      calling_songweaver:
        text: Music as ordnance — the Academy approves. Sour Note at second year, 'cast sour note <foe>', and yes, it hurts
          exactly like it sounds. Third year brings the Songs of Strength and Intellect, long anthems that make you
          mightier for hours. Sing before the fight, recruit, not during the eulogy.
        choices:
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      survival:
        text: Dying is a fine elective and a terrible habit. Watch your vitals — 'score' between fights, the prompt during them.
          Keep cake, draughts, or both, and 'use' them — or trust 'quickheal'. Set 'wimpy 30' so your feet overrule your
          pride at thirty percent. And when judgment says run, 'flee' — the menagerie's gloomling demonstrates daily and
          has never once been graded down for it. The catacombs beneath Necrambon keep a shrine with the full mortality
          seminar, strictly elective.
        choices:
          - text: I'm ready for the menagerie lesson. (Second year.)
            minLevel: 2
            action: accept_quest:the_better_part_of_valor
          - text: Give me the first lesson.
            action: accept_quest:the_first_swing
          - text: Carry on, Drillmaster.
      second_lesson:
        text: Then it's time you fought something with opinions. The sparring circle beside this yard keeps brass golems that
          hit back and a Proctor that hits back HARD — 'consider' both and learn what the colors of caution taste like.
          Bring me a golem's core and I'll believe the lesson took.
        choices:
          - text: I'll take the sparring examination.
            action: accept_quest:know_your_enemy
          - text: And after the golems?
            next: third_lesson
          - text: Carry on, Drillmaster.
      third_lesson:
        text: After golems, judgment. The menagerie holds a coward that must be chased and an ambusher that must be survived —
          bring me proof of both and you'll have learned the two lessons that keep soldiers old. Set your wimpy first.
          I'll know if you didn't.
        choices:
          - text: I'm ready for the menagerie lesson.
            action: accept_quest:the_better_part_of_valor
          - text: Carry on, Drillmaster.
    quests:
      - the_first_swing
      - know_your_enemy
      - the_better_part_of_valor
    image: c7b8b70bbd41a56a9d5e20e0b492fa804e69ec53aef8366fe1161963603c98ec.png
  practice_dummy:
    name: a practice dummy
    tier: weak
    level: 1
    category: construct
    spawns:
      - room: proving_yard
        count: 3
    description: A straw-stuffed canvas warrior lashed to a whirling post, wearing a hand-painted expression of theatrical
      villainy and a small placard reading HIT ME, I INSIST. Decades of student blows have given it a lumpy, forgiving
      shape, and bits of straw drift from its seams like slow confetti whenever it sways.
    hp: 12
    minDamage: 0
    maxDamage: 0
    xpReward: 10
    goldMin: 0
    goldMax: 0
    respawnSeconds: 20
