  royal_wedding:
    terrain: inside
    title: The Royal Wedding
    description: You stand in a lavishly decorated ballroom, as the memory of the wedding of Malkuth and Aineroia plays out
      before you. Ghostly figures dance and twirl and the sounds of music and revelry fill the air.
    exits:
      s: humble_forest_cabin
      w: royal_graveyard
    image: 99ecfd5dd9e30ca602ed217b73edf3cfec0028b3975f719c9fc791991fc1f92f.jpg
    music: 25fd8cdc59aaae3a78172989788ebb693625a2a7cfcb0b194f96210f21b1bec1.mp3
  royal_graveyard:
    terrain: outside
    title: In a Tiny, Brightly-Lit Graveyard
    description: Rows of cheerfully painted gravestones glow under the warm light of countless torches, their surfaces
      ablaze with vibrant depictions of phoenixes mid-flight, delicate faeries dancing between flowers, and majestic
      dragons coiled protectively around ornate monuments. The dancing firelight casts playful shadows across the tiny
      cemetery, transforming what might be a place of sorrow into a luminous garden of hope and wonder.
    exits:
      e: royal_wedding
      s: betrayer_study
    image: ba96b0ba1d72fd91dc51fb940526ad9f7dfafd33efcab5b608adb05060eb1864.jpg
    music: 4a80e1644837ae8d90844bd809b67fb716b1cbec0a946c72b6b49f82d7494199.mp3
  caldera:
    terrain: mountain
    title: The Caldera
    description: A colossal wound carved into the world itself, this massive crater sprawls endlessly in all directions—its
      jagged rim rising like broken teeth against the sky while the depths plunge into shadow and swirling auroras of
      unstable arcane energy. The displaced earth hangs suspended in impossible geometry, great chunks of stone and
      shattered kingdom frozen mid-fall through layers of ethereal light and crackling magical force that hums with the
      residual power of catastrophic enchantment.
    exits:
      n: verathaios_workshop
      s: arcane_tempest
    image: 5411f15744df7bfd6e3a6625b0dc3b4a6b70ab2e143c39fa282a05e93eb74398.jpg
    music: 4a80e1644837ae8d90844bd809b67fb716b1cbec0a946c72b6b49f82d7494199.mp3
  arcane_tempest:
    terrain: inside
    title: Inside the Arcane Tempest
    description: Swirling columns of prismatic energy spiral endlessly through this impossible chamber, their colors
      shifting from deep violet to brilliant gold with each rotation. The air crackles with raw magical force, and the
      very ground beneath your feet seems to flicker between solid stone and shimmering, translucent arcane matter as
      reality bends around the tempest's violent heart.
    exits:
      e: betrayer_study
      n: caldera
    image: 9f585d210c0485d0ee16050ae777afc0a7d0d0e7bd03bb4046a73ec225767e30.jpg
    music: 4a80e1644837ae8d90844bd809b67fb716b1cbec0a946c72b6b49f82d7494199.mp3
  verathaios_workshop:
    terrain: forest
    title: Verathaios's Workshop
    description: A lush tropical greenhouse thrums with verdant life, its canopy towering overhead with bioluminescent vines
      that cast dancing shadows across massive ferns and exotic flowers blooming in impossible colors—deep purples,
      luminous golds, and soft greens that seem to glow from within. The air shimmers with visible magic, and the ground
      is carpeted with moss so soft it muffles footsteps while healing herbs and crystalline-stemmed plants grow in wild
      abundance, their properties whispered through the humid breeze. At the greenhouse's edge the wild abundance
      gentles into tidy student beds — the Academy's gathering garden, planted where the World Healer's bounty spills
      over.
    exits:
      s: caldera
      n: aolia
      w: gathering_garden
    image: 222a68eed45875914175d6b7a1084229d4c9a47162f9bc8967a516efe2ee0314.jpg
