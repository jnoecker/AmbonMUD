  avatar_krioshaeu:
    name: Tea in the Afterlife
    tier: standard
    level: 1
    description: Two women take tea in a small, warm cabin, a fire muttering in the hearth — the most important meeting in
      all of Ambon's cosmology, and the most ordinary moment imaginable. Aineroia sits on one side of the table. She is
      tall, luminous, with the pale iridescent skin and delicate features of a Lustriae faerie — dark hair falling past
      her shoulders, dark eyes that carry immeasurable depth, softly rounded ears. Translucent diaphanous wings folded
      behind her shimmer faintly with blues and violets. She wears simple robes — not the regalia of a goddess but the
      clothes of a woman visiting a friend. She holds her teacup in both hands. Her expression is soft, warm, a little
      sad — the way a mother looks when she's been talking about her children. Krioshaeu sits across from her. She is
      also Lustriae — pale iridescent skin, salt-and-pepper hair streaked with grey, dark eyes — but wilder, more
      eccentric. The only faerie who looks aged. Her clothing is colorful and deliberately mismatched — patchwork silks,
      embroidered scarves in clashing patterns, a wide-brimmed hat adorned with flowers, feathers, and small dangling
      charms sitting on the table beside her teacup. Large, strong black raven wings — not translucent like Aineroia's
      but solid, dark, feathered — are folded comfortably behind her. She is mid-laugh or mid-sentence, gesturing with
      one hand while the other holds her cup. Her eyes are kind and ancient and slightly wild. She looks like someone
      who knows how every story ends and has decided to enjoy the telling anyway.
    spawns:
      - room: krioshaion
    role: prop
    image: 42617fd81c29b5614f557d19a4ef8c7babdbb97225aaf8063e73bb7bdde0ff6e.png
  undead_wight:
