  pyrae_warrior:
    name: Pyrae Warrior
    tier: standard
    level: 3
    description: A male Pyrae wreathed in flickering tongues of orange and crimson flame, its ashen skin cracked like
      cooling embers revealing a molten glow beneath. It stands in a battle-ready stance, wielding a spear of hardened
      obsidian tipped with a perpetually burning point.
    spawns:
      - room: pyrae
    image: df07ef0387e9436059c85a11e2ecd79fb0f60d32afe78b4c22c783228dd43139.png
