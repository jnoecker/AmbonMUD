      twisted into grotesque, melting shapes as though reality itself is being consumed by shadow. At the heart of the
      room, silk canopies coil like grasping fingers above a bed sunken into the warped stone floor, while ghostly
      silhouettes of courtiers flicker at the edges of vision, there and gone in the same breathless moment.
    exits:
      s: carnival_prophecy
