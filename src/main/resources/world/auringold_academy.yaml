        chance: 1
  unruly_tarot:
    name: a deck of unruly tarot cards
    tier: standard
    level: 1
    description: A chaotic swirl of oversized playing cards hovers in mid-air, their gilded edges catching the light as they
      flutter and dance with manic energy—some depicting strange arcane symbols while others show warped, laughing faces
      that seem to shift when you're not looking directly at them. The entire mass pulses with an eerie violet glow,
      cards occasionally shooting out in random directions before snapping back into the roiling cloud like they're
      bound by invisible strings.
    spawns:
      - room: fortune_teller_parlor
    category: construct
    image: ff5cc8193189b38a6e0a9fbe18ce933df6d7a3cf62dc0ae1a0b361e1d8f56168.png
  tiny_seamonster:
    name: a tiny sea monster
    description: A diminutive creature no larger than a clenched fist, with translucent bluish skin that glistens wetly and
      a cluster of short, writhing tentacles around a gaping circular mouth lined with needle-like teeth. Two large,
      bulbous eyes glow faintly with bioluminescent green light as it darts erratically through the water.
    image: b298c4b4c06750ebd4772f9f7903d63dd27c794726f7719ff877c5a59e818473.png
    spawns:
      - room: sunken_ship_hull
    level: 2
    drops:
      - itemId: kelp
        chance: 1
  seahorse:
    name: a neon colored seahorse
    description: A diminutive seahorse with a translucent body that shimmers in brilliant neon blues and magentas, its
      serpentine tail curling gracefully as bioluminescent patterns dance across its delicate frame like living
      electricity.
    spawns:
      - room: seaweed_thicket
        count: 3
    image: 290e2d1d33e90e302c45bc564b0d0620a81c89a82696c836eeaf90d355006cec.png
