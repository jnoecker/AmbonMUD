  vulgorth:
    terrain: mountain
    title: Vulgorth
    description: A Lithae settlement on the eastern slope of the mountains, facing the lowlands. More industrial and
      outward-facing than the deep holds — great forge chimneys rise from the mountainside, smoke and steam venting into
      the open air. The architecture transitions from mountain-carved stone at the top to more conventional buildings at
      the base where the settlement meets the trade roads. Workshops, smithies, and markets line terraced streets
      descending the slope. The gateway where dwarven craft meets the outside world. Warm forge-light glows from every
      window. Carts of finished metalwork and crystal goods line the roads heading east.
    exits:
      s: lyrasael
      n: night_wind
      w: mycorae
    image: 93f7c31b0240eb321ddbc1680626f9a73021e26e27153ebfcdfdfa1c6947e491.jpg
  krioshaion:
    terrain: sky
    title: Krioshaion
    description: Vast, rolling expanses of luminous colored mist — aurora-touched fog in silvers, golds, pale blues, soft
      violets, and rose pinks — drifting and shifting like a living sky made of ground. The mist doesn't obscure — it
      reveals, parting and reforming to show glimpses of impossible beauty. There is no ground in the conventional sense
      — visitors walk on surfaces of solidified moonlight, smooth and faintly warm, that glow from within. The "sky"
      above is not a sky but the inner surface of the moon itself — a vast dome of pearlescent silver-white that
      radiates gentle, ambient light from every direction.
    exits:
      n: moon
      s: luneqrae
    image: 5947c926ca33e82fe9b0391a62746b74790e512dda6b6160300d2e1b7a97ca29.jpg
