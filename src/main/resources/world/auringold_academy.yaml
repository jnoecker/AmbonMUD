puzzles:
  gallery_riddle:
    type: riddle
    roomId: riddle_gallery
    mobId: sphinx_of_softwords
    question: "The Sphinx of Softwords stretches, taps the pedestal twice, and recites: 'I speak without a mouth and hear
      without ears. I have no body, but I come alive with wind. What am I?'"
    answer: echo
    acceptableAnswers:
      - an echo
      - the echo
      - echoes
    reward:
      type: give_item
      itemId: key_of_questions
    successMessage: The sphinx's tail stops mid-tick. "Correct," it says, managing to sound both impressed and personally
      wounded, and a brass key drops from beneath its paw. "The Key of Questions. Do try the door before the key changes
      its mind."
    failMessage: The sphinx purrs — a long, satisfied, devastating purr. "No. But please, guess again. I have four thousand
      years and you are very entertaining."
    cooldownMs: 3000
  whisper_vault_levers:
    type: sequence
    roomId: vault_of_whispers
    steps:
      - feature: star
        action: pull
      - feature: moon
        action: pull
      - feature: sun
        action: pull
    reward:
      type: unlock_exit
      exitDirection: s
      targetRoom: secret_archive
    successMessage: The third lever seats with a chime like a struck bell, and the blank wall remembers, stone by sliding
      stone, that it was always a door. Beyond it, starlight falls on shelves no catalog admits to.
    failMessage: The levers shudder and reset themselves with an air of profound disappointment. Somewhere, faintly, the
      vault sighs. The verse above them has not moved.
    resetOnFail: true
    cooldownMs: 0
  archive_riddle:
    type: riddle
    roomId: secret_archive
    mobId: the_marble_mouth
    question: "The marble mouth clears a throat it does not have and recites: 'I have keys that open no locks, a space but
      no room, and you may enter though you never go in. What am I?'"
    answer: keyboard
    acceptableAnswers:
      - a keyboard
      - the keyboard
    reward:
      type: give_item
      itemId: archive_key
    successMessage: The mouth's smile widens a full inch into the stone. "Clever dreamer," it murmurs, and a slender silver
      key slides from between its lips. "The strongbox accepts it exactly once. Spend it with feeling."
    failMessage: "'Mmm. No,' says the mouth, savoring it. 'Although I do admire the confidence.'"
    cooldownMs: 3000
dungeon:
  name: academy_catacombs
  description: The deep dark beneath the Auringold Academy rearranges itself nightly into a fresh labyrinth of bad dreams
    — shifting halls of lost things, running-late and red-ink nightmares, and looming proctor-frights, with the Dean of
    Bad Dreams presiding over the deepest chamber. No two descents are the same.
  minLevel: 3
  roomCountMin: 4
  roomCountMax: 7
  portalRoom: catacomb_chapel
  roomTemplates:
    entrance:
      - title: The Threshold of the Dark
        description: A descending stair of worn slate where the chapel's lamplight gives way to the deep's own glow — shelves of
          lost homework glimmering faintly with remembered nightlight. Fresh chalk on the floor marks tonight's turnings
          in a hand no waking child uses.
        image: 8a883eb8bc842279f336488c574b10769372e725a09740ae2d58a98102becb9e.jpg
      - title: The Whispering Gate
        description: An iron gate stands propped open by a stack of forgotten lunchboxes, its bars worn smooth by years of
          children going in and rather fewer coming straight back out. A bell above the arch rings once, all by itself,
          to mark your dream begun.
        image: b57882f0f8ec2ecc288b5bc614987ce911fd3010e455a728640acec0e82da9c4.jpg
    corridor:
      - title: A Hall of Lost Things
        description: Shelves line this corridor with bibliographic precision — homework filed like folios, report cards capped
          in dust — and the air carries the rustle of pages from books that are not there. The shelving rearranges
          itself somewhere just out of sight, always quietly, always closer.
        image: 01c82f0e2e3051e664a54bf7c8f7bf7621e054d34b5a606998f634b1d27f09b1.jpg
      - title: The Whispering Stacks
        description: A narrow passage between leaning shelves of lost mittens and confiscated crib-notes, where the whispers of
          old scoldings pool at ankle height like cold air. The candles here burn blue and budget their light.
        image: 1da59ff934b916b4f101456ddc7c57b8bf964896dbeacf3f7aac676ef1258111.jpg
    chamber:
      - title: A Lecture Hall of Bad Dreams
        description: A vaulted chamber of tiered stone benches facing an empty lectern, where the hush of ten thousand bad
          dreams hangs in the unmoving air. Some of the benches are occupied. None of the occupants turn around. All of
          them are listening.
        image: 65da28c8c2896d59b832ba93289c0d6c528e553b4f1d5d9cfa06cea7cdf2504e.jpg
      - title: The Recitation Vault
        description: A round vault whose walls are honeycombed with niches, each holding one rolled-up answer a child got wrong
          and never forgot. The acoustics are perfect, the silence deliberate, and something in the niches keeps score
          of your footsteps.
        image: bdacf16a60483b3e3df02221e9a613115f3819e89445ea3d0b430aa0da617a49.jpg
    treasure:
      - title: The Confiscation Closet
        description: A barrel-vaulted closet where the proctor-frights stored everything children were not supposed to bring to
          school — charm-loaded quills, bottled courage, dice of suspicious honesty — all of it glittering in heaps and
          strictly, theoretically, still confiscated.
        image: 45b22d0ee1293a8f9722412870d46b770f9f9c84e3bea87ee92b8f0c24194caa.jpg
    boss:
      - title: The Dean's Office
        description: The deepest chamber of the dark, furnished as a study — shadow-silk drapes, a desk of black marble, and a
          gradebook the size of a door lying open to a page with your name on it. The Dean of Bad Dreams rises from
          behind the desk, adjusts his mortarboard, and uncaps a blazing red quill.
        image: 51e64a2d3c6fc086448a432f396288c005d7137886e5768f8653ce6a912eceb8.jpg
      - title: The Hall of Final Marking
        description: A great hall whose walls are one endless gradebook, names and verdicts chalked floor to vault, every
          verdict the same. At the far end the Dean of Bad Dreams waits beneath a chandelier of guttering candles,
          patient as a bedtime that never comes, certain as the dark.
        image: b9e25afe906141e49fbddd46d94d845c4ab153c014864b29346aac552569792a.jpg
  mobPools:
    common:
      - restless_pupil
      - restless_scholar
    elite:
      - marrow_proctor
    boss:
      - dean_of_the_dead
  lootTables:
    normal:
      mobDrops:
        - marrow_dust
        - grave_silk
        - minor_healing_draught
      completionRewards:
        - dreamglass_shard
        - grave_silk
  image: 55112428c8a2b9ede4b663d463ed87fd0b58d3d3ead74d812368f8770602b7c8.jpg
