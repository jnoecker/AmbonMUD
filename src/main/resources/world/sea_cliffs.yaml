    dialogue:
      root:
        text: You there! Thank the tides — a capable-looking face. I'm Davan, a coastal merchant. Those corsairs in the cove
          below boarded my vessel and stripped it clean. Their captain is down there in the raider's cove. If you deal
          with him and bring back his insignia as proof, I'll make it worth your while.
        choices:
          - text: I'll deal with the corsair captain.
            next: quest_accept
          - text: What's in it for me?
            next: reward_info
          - text: Goodbye.
            next: farewell
      quest_accept:
        text: Excellent. The raider cove is southeast — down from the camp. The captain won't flee. He's too arrogant for that.
          Bring me his insignia.
        choices:
          - text: I'll be back.
            next: farewell
      reward_info:
        text: Everything I have on me, which admittedly isn't much since they took my cargo. But gold and good will from a
          merchant with contacts up and down the coast. Deal?
        choices:
          - text: Fair enough. I'll do it.
            next: quest_accept
          - text: Goodbye.
            next: farewell
      farewell:
        text: Stay well clear of the cliffside — the harpies have been bold lately.
    image: 3e5a781a756e21fb0793ccce13ff92bb2476ab53b32edf1577319fb398001185.png
quests:
  corsairs_bounty:
    name: The Corsair's Bounty
    description: Merchant Davan was robbed by the corsairs camped at the Sea Cliffs. Defeat the Corsair Captain in the
      raider cove and bring back his insignia as proof.
    giver: merchant_davan
    objectives:
      - type: collect
        targetKey: corsair_insignia
        count: 1
        description: Collect the corsair captain's insignia
    rewards:
      xp: 800
      gold: 60
rooms:
  cliff_road:
    title: Sea Cliffs — Cliff Road
    description: The rutted cart track from the Farmer Fields ends here where the land begins its final descent toward the
      coast. The smell of salt hits you at once, and the sound of waves is constant beneath everything else. The fields
      are back to the north; the coastal cliffs begin to the south.
    exits:
      n: farmer_fields:field_road_south
      s: cliff_overlook
    image: b5c09ceb2e0629412091215671015232b01325ac8d7c8a3cd6de5ef1e56ff721.jpg
  cliff_overlook:
    title: Cliff Overlook
    description: "A flat promontory at the cliff edge with an extraordinary view south: grey-green sea stretching to the
      horizon, white foam at the base of the cliffs far below, and — on a clear day — the dark silhouette of what must
      be ancient ruins offshore to the south. Merchant Davan stands here looking agitated. The road is north; the
      coastal path descends south; a harpy-haunted ridge lies east; the raider camp is to the west."
    exits:
      n: cliff_road
      s: coastal_path
      e: harpy_ridge
      w: sea_raider_camp
    image: a344084299a55eb6badff49ff5c28e13cfa07413a725af2ad3e1a9124e9b642a.jpg
  harpy_ridge:
    title: Harpy Ridge
    description: A jagged outcropping of cliff-top rock where cliff harpies have established a colony. The noise —
      screaming, cackling, the crack of wings — is extraordinary. Nesting material and the bones of small animals litter
      the rock. Standing on the edge you can see the sea in three directions. The overlook is back to the west.
    exits:
      w: cliff_overlook
    image: 2e228e6a50165889e3e0313a352b50fb754f8b9d49c024b1b5725da7c4638f8b.jpg
  sea_raider_camp:
    title: Sea Raider Camp
    description: A camp of battered tents and salvaged ship timber on the clifftop. Sea raiders lounge around fire pits,
      sharpening weapons and passing around a clay bottle. Below, their boats are beached in a cove visible through gaps
      in the cliff face. The overlook is east; a steep path descends south to the raider's cove.
    exits:
      e: cliff_overlook
      s: raider_cove
    image: 3e3c0a1961037f33fffcf29d2710437118f2a21b52648d31fdb5ba9e2e77e6cd.jpg
  raider_cove:
    title: Raider Cove
    description: A sheltered cove at cliff base, accessible only from above or by sea. Corsair longboats are beached in a
      neat line. The Corsair Captain holds court here among crates of stolen cargo. The cliffside path leads back up to
      the north.
    exits:
      n: sea_raider_camp
    image: fce43c8a7fee11a7ede6ac053ffcb2e7627b18c54c4567c6f081c291707c0b35.jpg
  coastal_path:
    title: Coastal Path
    description: A rough track that hugs the cliff edge, slick with spray and sea-wind. The drop to the left is vertiginous.
      Tide elementals form in the heavier surf below and sometimes crest the cliff face. The overlook is back north; the
      tidal platform lies south; a narrow path descends east toward the crab-covered shore.
    exits:
      n: cliff_overlook
      s: tidal_platform
      e: crab_shore
      w: kelp_cove
    image: 53bc1185e8ea192b4af02d0effeb1f5e5501113ac4f2d0a552e067d4b8fd3d29.jpg
  kelp_cove:
    title: Kelp Cove
    description: A narrow inlet where kelp grows thick in the surge zone. The water is dark green and the smell is strongly
      marine. Gulls pick over the kelp beds at low tide. The coastal path is back to the east.
    exits:
      e: coastal_path
    image: eabe15e80803d05f9702abf8528e0303089dddd6533737db6f59cc6ce58c04f0.jpg
  crab_shore:
    title: Crab Shore
    description: "A rocky shore of exposed reef at the base of the lesser cliff. Giant crabs patrol the rock pools with
      proprietary confidence. The footing is treacherous: barnacles and weed-covered stone. The coastal path is back
      west; tidal pools lie to the south."
    exits:
      w: coastal_path
      s: tidal_pool
    image: a4068f12185606569da74b4c071a58b99ec3389a5f020300b65cd75f6ab619eb.jpg
  tidal_pool:
    title: Tidal Pool
    description: Deep, still pools left by the receding tide, each a miniature world of anemones, small fish, and
      pearl-bearing molluscs. The pearl beds here are visible at low tide — cloudy spheres visible in the deeper shells.
      Giant crabs guard the richest pools jealously. The crab shore is back to the north.
    exits:
      n: crab_shore
    image: 7e3d3b7fba20a7724367a43624a0a92b54d15657e8df811d154077c5841f65fe.jpg
  tidal_platform:
    title: Tidal Platform
    description: A broad flat shelf of sea-washed rock where the tide has polished the stone glass-smooth. Tide elementals
      coalesce here from the spray, flickering in and out of solidity with the wave rhythm. At the southern edge the
      rock dips below water at high tide — but at low tide a path is visible toward a structure offshore. The coastal
      path is back north; salt flats spread to the east.
    exits:
      n: coastal_path
      s: low_tide_path
      e: salt_flats
    image: a5eb97713c47c75c1c61c56b3caaa367a15d7789b71840d674fc7d5a3b1c7690.jpg
  salt_flats:
    title: Salt Flats
    description: A stretch of low rock where salt has crystallised in thick white deposits as the sea retreats. The crystals
      crunch underfoot and the air tastes of pure brine. Gatherers come here for alchemical salt when the tide allows.
      The tidal platform is back to the west.
    exits:
      w: tidal_platform
    image: 71cb93d853be0252cc57f45701d35ad650e5954ceb6db9981c482fa43d403c55.jpg
  low_tide_path:
    title: Low-Tide Path
    description: A causeway of sea-smoothed rock that emerges from the water at low tide, running south from the tidal
      platform toward a partially submerged structure offshore. The path is just passable on foot for a few hours either
      side of low tide. The ruins ahead are old — much older than Thornhaven. The tidal platform is back to the north.
    exits:
      n: tidal_platform
      s: sunken_temple:tidal_approach
    image: a1db478e727bc5830818a3a917cadc475693c8b31a18161b8b196d746719c03e.jpg
graphical: true
