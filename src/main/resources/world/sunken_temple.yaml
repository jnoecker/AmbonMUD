items:
  sanctum_key:
    displayName: a sanctum key
    keyword: key
    description: A barnacle-encrusted iron key on a corroded ring. The stone guardian was carrying it. It must open
      something deep in the temple.
    basePrice: 0
    image: e074cca73225050b3e8579f2d33bd839744cccce2cd6a877f50cc34b40784ccd.png
  temple_medallion:
    displayName: the temple medallion
    keyword: medallion
    description: A disc of dark metal engraved with a star-pattern and inlaid with sea-glass. Whoever placed it in the
      offering chamber considered it sacred. Scholar Timon will recognise it.
    basePrice: 0
    image: 16fac421341412c7a23d85f760ca112de7b55dce9c14e9cc696f80ed2f612177.png
  ancient_codex:
    displayName: an ancient codex
    keyword: codex
    description: A waterlogged book of pressed sea-cloth whose text has survived the flooding. Written in a script no one in
      Thornhaven reads — worth considerable gold to the Scholars' Guild.
    basePrice: 75
    image: 066fa5fb9b19c47e7f6d2fa9bc734bb020c71c45d0056e9aa134993f6a770423.png
  drowned_trinket:
    displayName: a drowned trinket
    keyword: trinket
    description: A small ornamental piece recovered from a drowned acolyte — corroded but identifiable as devotional jewellery.
    basePrice: 15
    image: 369ff52e02f5f16557131980c4a696b643a7125a00d276c34f3132204a12184c.png
  revenant_scepter:
    displayName: the Elder Revenant's scepter
    keyword: scepter
    slot: weapon
    damage: 11
    basePrice: 380
    description: A scepter of ancient iron wrapped in sea-glass and silver wire, thrumming faintly with residual divine power.
    image: 3ff623c5181af4b757892796ce9fc3dc5387221987ecc8a75809f89af54d0043.png
  revenant_shroud:
    displayName: the Elder Revenant's shroud
    keyword: shroud
    slot: body
    armor: 5
    basePrice: 290
    description: A garment that is somehow dry despite its long immersion — the cloth is ancient but undamaged, and the
      enchantments woven through it still hold.
    image: 8f5fa5978b38eeaa3bdec02e2092b0715d5d943b263ad05b7ef3520d9d7ca170.png
