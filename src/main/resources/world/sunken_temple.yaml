zone: sunken_temple
startRoom: tidal_approach
lifespan: 0

image:
  room: demo/DefaultRoom.png
  mob: demo/DefaultMob.png
  item: demo/DefaultObject.png

# ─── Items ────────────────────────────────────────────────────────────────────

items:
  sanctum_key:
    displayName: "a sanctum key"
    keyword: key
    description: "A barnacle-encrusted iron key on a corroded ring. The stone guardian was carrying it. It must open something deep in the temple."
    basePrice: 0

  temple_medallion:
    displayName: "the temple medallion"
    keyword: medallion
    description: "A disc of dark metal engraved with a star-pattern and inlaid with sea-glass. Whoever placed it in the offering chamber considered it sacred. Scholar Timon will recognise it."
    basePrice: 0

  ancient_codex:
    displayName: "an ancient codex"
    keyword: codex
    description: "A waterlogged book of pressed sea-cloth whose text has survived the flooding. Written in a script no one in Thornhaven reads — worth considerable gold to the Scholars' Guild."
    basePrice: 75

  drowned_trinket:
    displayName: "a drowned trinket"
    keyword: trinket
    description: "A small ornamental piece recovered from a drowned acolyte — corroded but identifiable as devotional jewellery."
    basePrice: 15

  revenant_scepter:
    displayName: "the Elder Revenant's scepter"
    keyword: scepter
    slot: hand
    damage: 11
    basePrice: 380
    description: "A scepter of ancient iron wrapped in sea-glass and silver wire, thrumming faintly with residual divine power."

  revenant_shroud:
    displayName: "the Elder Revenant's shroud"
    keyword: shroud
    slot: body
    armor: 5
    basePrice: 290
    description: "A garment that is somehow dry despite its long immersion — the cloth is ancient but undamaged, and the enchantments woven through it still hold."

# ─── Mobs ─────────────────────────────────────────────────────────────────────

mobs:
  temple_skeleton:
    name: "a temple skeleton"
    room: entrance_hall
    tier: standard
    level: 5
    respawnSeconds: 90
    xpReward: 38
    behavior:
      template: wander_aggro

  dark_cultist:
    name: "a dark cultist"
    room: west_side_chapel
    tier: standard
    level: 5
    respawnSeconds: 120
    xpReward: 42
    behavior:
      template: aggro_guard

  drowned_acolyte:
    name: "a drowned acolyte"
    room: drowned_chamber
    tier: standard
    level: 5
    respawnSeconds: 90
    xpReward: 40
    behavior:
      template: wander_aggro
    drops:
      - itemId: drowned_trinket
        chance: 0.5

  stone_guardian:
    name: "a stone guardian"
    room: submerged_vault
    tier: elite
    level: 6
    respawnSeconds: 300
    xpReward: 75
    behavior:
      template: aggro_guard
    drops:
      - itemId: sanctum_key
        chance: 1.0

  elder_revenant:
    name: "the Elder Revenant"
    room: revenant_chamber
    tier: boss
    level: 7
    respawnSeconds: 900
    xpReward: 180
    goldMin: 60
    goldMax: 120
    drops:
      - itemId: revenant_scepter
        chance: 0.5
      - itemId: revenant_shroud
        chance: 0.4
    dialogue:
      root:
        text: "...Still. After all this time. You come bearing the noise of the living — boots on stone, breath in the air. I remember what that was like. I am what remained when the cult drowned this place and everyone in it. What business do the living have in my temple?"
        choices:
          - text: "We're looking for a stolen relic."
            next: relic_info
          - text: "We've come to put you to rest."
            next: defiance
          - text: "We'll leave."
            next: farewell
      relic_info:
        text: "The medallion. Yes. The cultists left it in the offering chamber when they sealed the sanctum. I have watched it for centuries. It is not theirs. It was never theirs. Take it if you can reach it. Defeating me would be the first step."
        choices:
          - text: "Then we fight."
            next: farewell
          - text: "We'll go."
            next: farewell
      defiance:
        text: "Rest. An interesting word. I wonder what that would feel like. Come, then. Let us find out."
        choices:
          - text: "Now."
            next: farewell
      farewell:
        text: "..."

  scholar_timon:
    name: "Scholar Timon"
    room: temple_outer_steps
    tier: weak
    level: 1
    hp: 999
    minDamage: 1
    maxDamage: 1
    xpReward: 0
    goldMin: 0
    goldMax: 0
    quests:
      - stolen_relic
    dialogue:
      root:
        text: "Careful on the steps — the tide has made them treacherous. I'm Timon, Thornhaven Scholars' Guild. I've been documenting this site for a season. The inner sanctum holds a medallion of significant historical value. I can't reach it — the guardian deeper in is beyond my abilities. Could you retrieve it?"
        choices:
          - text: "I'll find the medallion."
            next: quest_accept
          - text: "What can you tell me about this place?"
            next: temple_lore
          - text: "Goodbye."
            next: farewell
      quest_accept:
        text: "Excellent. The medallion is in the offering chamber — you'll need to get past the stone guardian to reach it. The guardian carries the sanctum key. The offering chamber is north of the inner sanctum hall. Thank you."
        choices:
          - text: "I'll return when I have it."
            next: farewell
      temple_lore:
        text: "This was a coastal temple, pre-Thornhaven — a thousand years old at minimum. A cult took it over, flooded the lower levels deliberately, and then apparently drowned themselves inside it. The Elder Revenant is what's left of the high priest. The whole affair is academically fascinating and personally terrifying."
        choices:
          - text: "I'll find the medallion."
            next: quest_accept
          - text: "Goodbye."
            next: farewell
      farewell:
        text: "Be careful in there. And watch your footing on the wet stone."

# ─── Quests ───────────────────────────────────────────────────────────────────

quests:
  stolen_relic:
    name: "The Stolen Relic"
    description: "Scholar Timon needs you to recover the temple medallion from the offering chamber deep in the Sunken Temple. Defeat the stone guardian for the sanctum key, then find the medallion."
    giver: scholar_timon
    objectives:
      - type: collect
        targetKey: temple_medallion
        count: 1
        description: "Recover the temple medallion from the offering chamber"
    rewards:
      xp: 900
      gold: 40

# ─── Rooms ────────────────────────────────────────────────────────────────────

rooms:
  tidal_approach:
    title: "Sunken Temple — Tidal Approach"
    description: "The low-tide causeway from the Sea Cliffs ends here at the base of an ancient structure rising from the water. Barnacled stone walls, a colonnade of half-submerged pillars, and a wide staircase ascending from the tidal zone. At high tide this would all be under water. Scholar Timon's camp is just above on the outer steps. The causeway leads back north."
    exits:
      n: sea_cliffs:low_tide_path
      e: temple_outer_steps

  temple_outer_steps:
    title: "Temple Outer Steps"
    description: "A broad staircase of sea-worn stone climbing from the tidal zone to the temple entrance. The steps are uneven from centuries of wave action but still passable. Scholar Timon has set up a small research camp on a dry landing halfway up. The tidal approach is back west; the entrance hall lies ahead to the north."
    exits:
      w: tidal_approach
      n: entrance_hall

  entrance_hall:
    title: "Temple Entrance Hall"
    description: "The first interior space: a vaulted hall where the ceiling is intact but the floor is ankle-deep in seawater. Carved fish and wave-patterns cover the walls in the pre-Thornhaven style. Temple skeletons patrol the waterlogged floor. A flooded corridor continues east; ceremonial side chambers are to the west; the forecourt is to the north."
    exits:
      s: temple_outer_steps
      n: temple_forecourt
      e: flooded_corridor
      w: ceremonial_chamber

  ceremonial_chamber:
    title: "Ceremonial Chamber"
    description: "A side chamber that served as a preparation room for temple rites. Stone basins line the walls, their interiors stained with old pigment. A carved altar table has survived the flooding intact, its surface still bearing the impression of objects removed long ago. The entrance hall is back east."
    exits:
      e: entrance_hall

  flooded_corridor:
    title: "Flooded Corridor"
    description: "A long passage running deeper into the temple's eastern wing, knee-deep in dark water. The flooding gets deeper the further in you go. Something moves in the murk ahead. Drowned acolytes haunt this passage, drifting with the currents. The entrance hall is back west."
    exits:
      w: entrance_hall
      n: drowned_chamber

  drowned_chamber:
    title: "Drowned Chamber"
    description: "A partially flooded chamber where the water reaches the waist. The cult's act of drowning this level is most visible here — possessions float, preserved by cold and darkness: robes, devotional objects, writing tablets. Drowned acolytes drift between them. A passage continues east to the submerged vault."
    exits:
      s: flooded_corridor
      e: submerged_vault

  submerged_vault:
    title: "Submerged Vault"
    description: "A reinforced chamber at the end of the flooded wing, the stone walls thicker here than anywhere else. A stone guardian stands in the center of the room — statue-still until it detects movement, then devastatingly fast. A iron ring on the floor holds something large. The drowned chamber is back to the west."
    exits:
      w: drowned_chamber

  temple_forecourt:
    title: "Temple Forecourt"
    description: "The main interior courtyard, open to a partially collapsed roof that lets in grey sea-light. The floor here is dry — high enough to escape the flooding. Side chapels branch east and west. A heavy bronze door stands at the north wall, its surface carved with a star-pattern and sealed with a corroded lock. The entrance hall is to the south."
    exits:
      s: entrance_hall
      e: east_side_chapel
      w: west_side_chapel
      n:
        to: inner_sanctum
        door:
          initialState: locked
          keyItemId: sanctum_key
          keyConsumed: false
          resetWithZone: false

  east_side_chapel:
    title: "East Side Chapel"
    description: "A small devotional space still in reasonable condition — the carved figures on the walls are intact, and a stone chest has kept its contents dry for centuries. The forecourt is back to the west."
    features:
      stone_chest:
        type: CONTAINER
        displayName: "a stone chest"
        keyword: chest
        initialState: closed
        resetWithZone: false
        items:
          - ancient_codex
    exits:
      w: temple_forecourt

  west_side_chapel:
    title: "West Side Chapel"
    description: "A larger chapel on the west side, its walls covered in more recent carvings in a different and darker style — the cult's additions. A dark cultist kneels before an obsidian slab that has replaced the original altar. The forecourt is east."
    exits:
      e: temple_forecourt

  inner_sanctum:
    title: "Inner Sanctum"
    description: "The heart of the temple proper, accessed through the bronze door. The air here is different — drier, stiller, preserved by the sealing. Carved stars cover every surface and the floor is inlaid with a compass-pattern in sea-glass. Passages lead north to the sanctum hall."
    exits:
      s: temple_forecourt
      n: sanctum_hall

  sanctum_hall:
    title: "Sanctum Hall"
    description: "A long hall connecting the inner sanctum to the deeper ceremonial spaces. Alcoves hold the stone likenesses of figures in prayer. The hall branches east to a side shrine, west to an offering pit, and north to the revenant's chamber where something cold and luminous can be seen moving."
    exits:
      s: inner_sanctum
      e: side_shrine
      w: offering_pit
      n: revenant_chamber

  side_shrine:
    title: "Side Shrine"
    description: "A narrow alcove off the sanctum hall containing a carved figure of a sea deity — double-headed, half-submerged, arms open. Offerings have been placed at its feet repeatedly over centuries: coins, shells, and objects of no obvious function. A small locked cabinet at the back holds something that glints."
    features:
      offering_cabinet:
        type: CONTAINER
        displayName: "a stone cabinet"
        keyword: cabinet
        initialState: closed
        resetWithZone: false
        items:
          - drowned_trinket
    exits:
      w: sanctum_hall

  offering_pit:
    title: "Offering Pit"
    description: "A ritual pit in the west wing of the sanctum, used for offerings that were meant to sink — coins, sealed vessels, valuable objects given to the sea. The pit is still dry, and at the bottom, placed carefully on a stone shelf, sits the temple medallion on a circle of faded velvet."
    features:
      offering_shelf:
        type: CONTAINER
        displayName: "an offering shelf"
        keyword: shelf
        initialState: open
        resetWithZone: false
        items:
          - temple_medallion
    exits:
      e: sanctum_hall

  revenant_chamber:
    title: "Revenant's Chamber"
    description: "The innermost room of the temple, where the high priest once officiated. The Elder Revenant drifts here in a slow orbit of the central dais, its luminous form never quite still. The chamber is cold, absolutely silent, and carries the weight of a thousand years of solitary occupation. The sanctum hall is back to the south."
    exits:
      s: sanctum_hall

# ─── Puzzles ─────────────────────────────────────────────────────────────────

puzzles:
  guardian_riddle:
    type: riddle
    mobId: stone_guardian
    roomId: temple_forecourt
    question: "I guard the way yet have no sword. I stand for ages yet have no feet. I open for the worthy yet have no hands. What am I?"
    answer: "a door"
    acceptableAnswers: ["a door", "door", "the door", "gate", "a gate"]
    reward:
      type: give_xp
      xp: 50
    failMessage: "The guardian's eyes dim. 'You are not yet worthy. Think again.'"
    successMessage: "The guardian's eyes flare bright. 'You speak truth. Pass, and carry this knowledge.'"
    cooldownMs: 0
